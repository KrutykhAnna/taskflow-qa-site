<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта процесса</title>
<meta name="description" content="Интерактивная карта: как фича проходит путь от требований до прода, какие жизненные циклы, документы и роли участвуют и что на каждом шаге делает тестировщик.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Карта процесса — эстетика схемы метро: этапы как станции, фича как поезд */
:root{
  --bg:#f4f1ea; --paper:#fffdf8; --ink:#16171b; --muted:#5b5d66; --line:#dcd4c4; --soft:#ece7dc; --grid:rgba(22,23,27,.045);
  --p0:#cf3f2a; --p1:#c97c00; --p2:#2360cc; --p3:#15845a; --p4:#0d7787; --p5:#666a75;
  --ok:#16794a; --okbg:#e0f1e7; --bad:#b42318; --badbg:#fbe5e1; --warn:#935600; --warnbg:#fcefd6; --info:#2360cc; --infobg:#e3ebfb;
  --f-disp:"Unbounded","Golos Text","Segoe UI",sans-serif;
  --f-body:"Golos Text","Segoe UI",-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 0 rgba(22,23,27,.04),0 8px 24px -14px rgba(22,23,27,.25);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111215; --paper:#1a1c21; --ink:#ecebe6; --muted:#a3a4ac; --line:#2e3139; --soft:#24262c; --grid:rgba(236,235,230,.035);
  --p0:#ff7d66; --p1:#f2b33f; --p2:#76a2ff; --p3:#4cc98f; --p4:#3cc3d2; --p5:#a5a8b2;
  --ok:#5fd19a; --okbg:#173326; --bad:#ff8a7a; --badbg:#3a1c18; --warn:#f2b860; --warnbg:#3a2b12; --info:#8fb0ff; --infobg:#1d2740;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111215; --paper:#1a1c21; --ink:#ecebe6; --muted:#a3a4ac; --line:#2e3139; --soft:#24262c; --grid:rgba(236,235,230,.035);
  --p0:#ff7d66; --p1:#f2b33f; --p2:#76a2ff; --p3:#4cc98f; --p4:#3cc3d2; --p5:#a5a8b2;
  --ok:#5fd19a; --okbg:#173326; --bad:#ff8a7a; --badbg:#3a1c18; --warn:#f2b860; --warnbg:#3a2b12; --info:#8fb0ff; --infobg:#1d2740;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.7); color-scheme:dark }
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top */
header.top{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(6px);position:sticky;top:0;z-index:30}
.top-in{display:flex;align-items:center;gap:14px 24px;padding-block:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:inherit}
.logo-mark{width:38px;height:38px;flex:none}
.logo b{font-family:var(--f-disp);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;display:block}
.logo span{color:var(--muted);font-size:.82rem}
.top-r{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:10px}
.prog-bar{width:140px;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog-bar i{display:block;height:100%;width:0;background:var(--p3);transition:width .4s}
.prog span{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:9px;height:34px;padding:0 10px;cursor:pointer;font-size:.85rem;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{color:var(--ink);border-color:var(--ink)}

nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:0 10px;scrollbar-width:thin}
nav.tabs button{flex:none;border:0;background:none;padding:8px 13px;border-radius:99px;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
nav.tabs button .n{font-family:var(--f-mono);font-size:.72rem;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor}
nav.tabs button:hover{color:var(--ink);background:var(--soft)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}

main{padding-block:26px 80px}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:end;margin-bottom:22px}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(1.55rem,3.6vw,2.5rem);letter-spacing:-.02em;margin-top:6px}
.hero p.lead{color:var(--muted);margin-top:10px;max-width:62ch}
.feature{background:var(--paper);border:1.5px dashed var(--ink);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow)}
.feature .tag{flex:none;width:40px;height:40px}
.feature b{display:block;font-size:.95rem}
.feature span{font-size:.88rem;color:var(--muted)}
h2.sec{font-family:var(--f-disp);font-weight:700;font-size:clamp(1.25rem,2.6vw,1.7rem);letter-spacing:-.015em}
.sec-lead{color:var(--muted);margin-top:8px;max-width:70ch}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:18px}
.howto div{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--muted)}
.howto b{color:var(--ink)}
.howto .k{flex:none;font-family:var(--f-mono);font-size:.75rem;width:24px;height:24px;border-radius:7px;background:var(--ink);color:var(--paper);display:grid;place-items:center}

/* controls */
.ctrl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:6px}
.ctrl-l{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer;user-select:none;color:var(--muted)}
.switch input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--soft);border:1px solid var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch input:checked{background:var(--p0);border-color:var(--p0)}
.switch input:checked::after{transform:translateX(14px);background:#fff}
.layers{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0}
.layers small{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.chipbtn{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 11px;font-size:.84rem;cursor:pointer;color:var(--muted)}
.chipbtn[aria-pressed="true"]{background:var(--soft);color:var(--ink);border-color:var(--ink)}

/* track (metro map) */
.mapbox{position:relative;margin-top:14px;padding:6px 4px 4px}
.phases{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:0;margin-bottom:2px}
.phase{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--pc);border-top:3px solid var(--pc);padding:6px 6px 0;margin:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;display:grid;grid-template-columns:repeat(9,minmax(0,1fr))}
.st{position:relative;border:0;background:none;cursor:pointer;padding:18px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--ink);min-width:0}
.st::before{content:"";position:absolute;top:27px;left:0;right:0;height:6px;background:var(--pc)}
.st:first-child::before{left:50%}
.st:last-child::before{right:50%}
.st .dot{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;background:var(--paper);border:5px solid var(--pc);transition:transform .25s,background .25s}
.st:hover .dot{transform:scale(1.15)}
.st[aria-current="true"] .dot{background:var(--pc);transform:scale(1.25);box-shadow:0 0 0 5px color-mix(in srgb,var(--pc) 25%,transparent)}
.st.visited .dot{background:color-mix(in srgb,var(--pc) 35%,var(--paper))}
.st .nm{font-weight:600;font-size:.86rem;line-height:1.25}
.st .sm{font-size:.74rem;color:var(--muted);line-height:1.25}
.st .num{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.st .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.st .ph{display:none}
.envbar{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));margin-top:6px}
.envseg{margin:0 3px;font-family:var(--f-mono);font-size:.7rem;text-align:center;padding:3px 0;border-radius:6px;background:var(--soft);color:var(--muted)}
.envseg.empty{background:none}

.train{position:absolute;left:0;top:0;width:40px;height:40px;z-index:5;pointer-events:none;transition:transform .8s cubic-bezier(.65,.05,.3,1)}
.train .body{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.5);transition:background .3s}
.train .body svg{width:22px;height:22px}
.train::after{content:"";position:absolute;inset:-6px;border-radius:16px;border:2px solid var(--ink);opacity:0;animation:ring 1.8s infinite}
.train.bad .body{background:var(--bad)} .train.bad::after{border-color:var(--bad)}
.train.ok .body{background:var(--ok)} .train.ok::after{border-color:var(--ok)}
.train.bug .body{background:var(--warn)} .train.bug::after{border-color:var(--warn)}
@keyframes ring{0%{opacity:.6;transform:scale(.85)}100%{opacity:0;transform:scale(1.35)}}
.ret{position:absolute;z-index:4;pointer-events:none;border:2.5px dashed var(--bad);opacity:0;transition:opacity .3s}
.ret.h{border-bottom:0;border-radius:14px 14px 0 0}
.ret.v{border-right:0;border-radius:14px 0 0 14px}
.ret.on{opacity:1}
.ret::after{content:"";position:absolute;width:0;height:0;border:7px solid transparent}
.ret.h::after{left:-8px;bottom:-12px;border-top-color:var(--bad)}
.ret.v::after{right:-12px;bottom:-8px;border-left-color:var(--bad)}

.event{margin-top:14px;min-height:48px;border-radius:12px;padding:11px 14px;display:flex;gap:10px;align-items:flex-start;font-size:.93rem;background:var(--soft);color:var(--muted);transition:background .3s,color .3s}
.event b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;flex:none;padding-top:2px}
.event.bad{background:var(--badbg);color:var(--bad)}
.event.ok{background:var(--okbg);color:var(--ok)}
.event.bug,.event.back{background:var(--warnbg);color:var(--warn)}
.event.info{background:var(--infobg);color:var(--info)}
.event.pop{animation:pop .45s}
@keyframes pop{0%{transform:translateY(6px);opacity:.3}100%{transform:none;opacity:1}}

/* detail */
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;margin-top:16px}
.dcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;animation:pop .4s}
.dcard.qa{border:2px solid var(--pc,var(--ink))}
.dcard h3{font-size:.76rem;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.dcard .big{font-family:var(--f-disp);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;margin-bottom:8px}
.dcard p+p{margin-top:8px}
.who{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.who div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:start;font-size:.9rem}
.av{font-family:var(--f-mono);font-size:.68rem;font-weight:600;min-width:34px;height:24px;padding:0 6px;border-radius:7px;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.av.qa{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lgrid{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.lrow{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;animation:pop .4s}
.lrow h4{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{font-size:.82rem;padding:3px 9px;border-radius:99px;background:var(--soft);border:1px solid var(--line)}
.chip.strong{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.arrow{color:var(--muted);font-size:.85rem}
.envs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.envs span{text-align:center;font-family:var(--f-mono);font-size:.78rem;padding:6px 0;border-radius:7px;background:var(--soft);color:var(--muted)}
.envs span.on{background:var(--ink);color:var(--paper)}
.skip{grid-column:1/-1;border-left:3px solid var(--bad);background:var(--badbg);color:var(--ink);border-radius:0 12px 12px 0;padding:11px 14px;font-size:.92rem}
.skip b{color:var(--bad)}
.ex{grid-column:1/-1;border-left:3px solid var(--p2);background:var(--infobg);border-radius:0 12px 12px 0;padding:11px 14px;font-size:.92rem}
.ex b{color:var(--info)}

/* doc chips, io row, modal */
.dchip{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;padding:4px 6px 4px 10px;border-radius:99px;background:var(--paper);border:1px solid var(--line);cursor:pointer;transition:border-color .2s,transform .2s}
.dchip:hover{border-color:var(--ink);transform:translateY(-1px)}
.dchip{text-align:left}
.dm-dl{margin:0;padding-left:18px}.dm-dl li+li{margin-top:4px}
.dchip .ii{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.66rem;font-weight:700;background:var(--soft);color:var(--muted)}
.dchip.strong{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dchip.strong .ii{background:var(--paper);color:var(--ink)}
.docrow{grid-column:1/-1}
.docrow h4 .tip{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-weight:400;font-size:.8rem;margin-left:6px;color:var(--muted)}
.io{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.io-b{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.io-b.out{border-style:solid;border-color:var(--ink)}
.io-h{display:flex;flex-direction:column;gap:1px}
.io-h b{font-size:.9rem}
.io-h span{font-size:.78rem;color:var(--muted)}
.io-ar{align-self:center;font-family:var(--f-disp);font-size:1.4rem;color:var(--muted)}
@media (max-width:640px){.io{grid-template-columns:minmax(0,1fr)}.io-ar{transform:rotate(90deg);justify-self:center;line-height:1}}
.doc[data-card]{cursor:pointer}
.doc[data-card]:hover{border-color:var(--ink)}
.doc .more{font-size:.82rem;font-weight:600;margin-top:auto}
.docm{position:fixed;inset:0;z-index:60;background:rgba(10,11,14,.55);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .2s}
.docm.on{opacity:1}
.docm[hidden]{display:none}
.docm-in{position:relative;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:18px;max-width:640px;width:100%;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;padding:22px 22px 20px;box-shadow:0 24px 60px -20px rgba(0,0,0,.6);transform:translateY(10px) scale(.98);transition:transform .25s}
.docm.on .docm-in{transform:none}
.docm-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:.9rem}
.docm-x:hover{border-color:var(--ink)}
#docm-b{display:flex;flex-direction:column;gap:14px}
.dm-top{padding-right:40px}
.dm-top .lvl{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.dm-top h2{font-family:var(--f-disp);font-weight:700;font-size:1.35rem;letter-spacing:-.01em;margin:4px 0 8px}
#docm-b h5{margin:0 0 6px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dm-sec ul{margin:0;padding-left:18px}.dm-sec li+li{margin-top:3px}
.dm-note{margin-top:8px;font-size:.88rem;color:var(--warn)}
.dm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.dm-grid>div{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.9rem}
.dm-ex{border-left:3px solid var(--p2);background:var(--infobg);border-radius:0 10px 10px 0;padding:10px 12px;font-size:.9rem}
.dm-ex b{color:var(--info)}
.rp{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:.84rem;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:2px 9px 2px 3px;cursor:pointer}
.rp:hover{border-color:var(--ink)}
.dm-steps{display:flex;flex-direction:column;gap:6px}
.dm-steps>div{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem}
.dm-q{background:var(--soft);border-radius:10px;padding:9px 12px;font-size:.92rem}
.muted{color:var(--muted)}
.dchip.okc{background:var(--okbg);color:var(--ok);border-color:transparent}
.dchip.okc .ii{background:var(--paper);color:var(--ok)}
.who-b{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:start;text-align:left;border:1px solid transparent;background:none;padding:5px 7px;margin:0 -7px;border-radius:9px;cursor:pointer;font-size:.9rem;width:calc(100% + 14px)}
.who-b:hover{background:var(--soft);border-color:var(--line)}
.who-b .ii,.cardtip .ii{width:17px;height:17px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--f-mono);font-size:.66rem;font-weight:700;background:var(--soft);color:var(--muted);vertical-align:middle}
.avb{border:0;background:none;padding:0;cursor:pointer}
.cardtip{grid-column:1/-1;font-size:.84rem;color:var(--muted);margin:2px 0 -4px}
.envs button{text-align:center;font-family:var(--f-mono);font-size:.78rem;padding:6px 0;border-radius:7px;background:var(--soft);color:var(--muted);border:1px solid transparent;cursor:pointer}
.envs button:hover{border-color:var(--ink)}
.envs button.on{background:var(--ink);color:var(--paper)}
.flow button.fs{cursor:pointer;text-align:left}

function seqLen(){return story?STORY.length:STATIONS.length}
function step(d){
  const n=Math.max(0,Math.min(seqLen()-1,storyPos+d));
  if(n===storyPos&&d>0){finishPath();return false;}
  const prev=story?STORY[storyPos].s:storyPos;
  storyPos=n;
  if(story){const it=STORY[n];curEv=it.ev||null;setStation(it.s,true,false,prev);setEvent(it.ev||null);}
  else{curEv=null;setStation(n,true,false,prev);setEvent(null);}
  if(storyPos===seqLen()-1)finishPath();
  return true;
}
function finishPath(){markDone('path-'+(story?'story':'plain'),story?'Сюжет пройден целиком':'Путь пройден целиком');}
function startPlay(){
  if(storyPos>=seqLen()-1){storyPos=0;visited=new Set([0]);setStation(story?STORY[0].s:0,false);setEvent(story?STORY[0].ev||null:null);}
  $('play').innerHTML=ICON.pause+'Пауза';
  playing=setInterval(()=>{if(!step(1)||storyPos>=seqLen()-1)stopPlay();},story?3200:2300);
}
function stopPlay(){stopTypes();if(playing){clearInterval(playing);playing=null;}const p=$('play');if(p)p.innerHTML=ICON.play+'Запустить';}
function setStation(i,manual,instant,from){
  cur=i;visited.add(i);
  if(manual&&!story){storyPos=i;}
  document.querySelectorAll('.st').forEach((b,k)=>{b.setAttribute('aria-current',k===i);b.classList.toggle('visited',visited.has(k)&&k!==i);});
  moveTrain(instant);
  const ret=$('ret');
  if(from!=null&&from>i)drawReturn(from,i);else ret.classList.remove('on');
  drawDetail();
  live(`Станция ${i+1}: ${STATIONS[i].t}`);
}
function dotPos(i){
  const tr=$('track');const d=tr.querySelectorAll('.st .dot')[i];if(!d)return{x:0,y:0};
  const r=tr.getBoundingClientRect(),q=d.getBoundingClientRect();
  return{x:q.left-r.left+q.width/2,y:q.top-r.top+q.height/2};
}
function moveTrain(instant){
  const t=$('train');if(!t)return;const p=dotPos(cur);
  if(instant)t.style.transition='none';
  t.style.transform=`translate(${p.x-20}px,${p.y-20}px)`;
  t.className='train'+(curEv?' '+({bad:'bad',ok:'ok',bug:'bug',back:'bad',info:''}[curEv[0]]):'');
  if(instant){t.offsetHeight;t.style.transition='';}
}
function drawReturn(a,b){
  const r=$('ret'),pa=dotPos(a),pb=dotPos(b);

}

   <tr><th>Когда</th><td>Сразу после новой сборки и сразу после релиза — на проде</td><td>После небольшого изменения или исправления</td><td>После того как баг исправили</td><td>После проверки нового, перед релизом</td></tr>
   <tr><th>Широта</th><td>Широко: главные пути</td><td>Узко: одна область</td><td>Очень узко: один баг</td><td>Широко: всё, что могло пострадать</td></tr>
   <tr><th>Глубина</th><td>Неглубоко</td><td>Чуть глубже смоука</td><td>Глубоко по одному сценарию</td><td>От главного к второстепенному</td></tr></table></div></div>`;
  drawScen();
}
function drawScen(){
  $('scen').innerHTML=SCEN.map((s,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===scSel}"><span class="i">${String(i+1).padStart(2,'0')}</span><span>${s.t}</span><span class="ok">${done.has(s.id)?'✓':''}</span></button>`).join('');
  $('scen').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;scSel=+b.dataset.i;scPick=new Set();scChecked=false;drawScen();};
  drawMods(false);drawScBody();
}
function drawMods(ripple){
  const W=140,H=40,s=SCEN[scSel];
  let h=`<svg class="mods" viewBox="0 0 670 300" role="img" aria-label="Схема модулей магазина"><defs><marker id="mar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>`;
  MDEP.forEach(([a,b])=>{const A=MODS[a],B=MODS[b],p=edgePt(A,B,W,H),q=edgePt(B,A,W+6,H+6);h+=`<line class="e" data-e="${a}-${b}" x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" marker-end="url(#mar)"/>`;});
  Object.entries(MODS).forEach(([k,n])=>{h+=`<g class="m ${n.crit?'crit':''}" data-m="${k}"><rect x="${n.x-W/2}" y="${n.y-H/2}" width="${W}" height="${H}" rx="10"/><text x="${n.x}" y="${n.y+4.5}" text-anchor="middle">${n.t}</text></g>`;});
  if(s.src){const n=MODS[s.src];h+=`<circle class="pulse" id="pl" cx="${n.x}" cy="${n.y}" r="20"/>`;}
  h+=`</svg><div class="legend" style="margin-top:6px"><span><i style="border-color:var(--bad);background:var(--bad)"></i>изменили</span><span><i style="border-color:var(--warn);background:var(--warnbg)"></i>может пострадать</span><span><i class="d"></i>критичный сценарий</span></div>`;
  $('mods').innerHTML=h;
  if(ripple&&s.src)runRipple(s.src,s.depth||9);
}
function runRipple(src,maxD){
  const depth={[src]:0},q=[src];
  while(q.length){const a=q.shift();MDEP.filter(e=>e[0]===a).forEach(([,b])=>{if(depth[b]==null&&depth[a]<maxD){depth[b]=depth[a]+1;q.push(b);}});}
  const g=k=>document.querySelector(`#mods [data-m="${k}"]`);
  g(src).classList.add('src');const pl=$('pl');if(pl){pl.classList.remove('go');void pl.getBoundingClientRect();pl.classList.add('go');}
  Object.entries(depth).forEach(([k,d])=>{if(!d)return;setTimeout(()=>{g(k).classList.add('hit');MDEP.forEach(([a,b])=>{if(b===k&&depth[a]===d-1){const e=document.querySelector(`#mods [data-e="${a}-${b}"]`);e&&e.classList.add('hit');}});},d*450);});
}
function drawScBody(){
  const s=SCEN[scSel];
  $('scBody').innerHTML=`<p class="q" style="margin-top:12px">${s.t}. <b>Какие проверки нужны?</b> ${s.need.length>1?'Выбери все нужные.':'Выбери одну.'}</p>
   <div class="picks" id="picks">${CHK.map(c=>{let cls='';if(scChecked){cls=s.need.includes(c)?(scPick.has(c)?'r':'w'):(scPick.has(c)?(s.neut.includes(c)?'n':'w'):'');}return `<button type="button" data-c="${c}" aria-pressed="${scPick.has(c)}" class="${cls}">${c}</button>`;}).join('')}</div>
   <div class="actions"><button class="btn primary" type="button" id="scCheck">Проверить</button></div><div id="scFb"></div>`;
  $('picks').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;const c=b.dataset.c;scPick.has(c)?scPick.delete(c):scPick.add(c);scChecked=false;drawScBody();};
  $('scCheck').onclick=()=>{
    scChecked=true;const miss=s.need.filter(c=>!scPick.has(c)),wrong=[...scPick].filter(c=>!s.need.includes(c)&&!s.neut.includes(c)),ok=!miss.length&&!wrong.length;
    drawScBody();drawMods(true);
    $('scFb').innerHTML=`<div class="fb ${ok?'ok':'bad'}" style="margin-top:10px">${ok?'Верно. ':''}${miss.length?`Не хватает: ${miss.join(', ')}. `:''}${wrong.length?`Лишнее: ${wrong.join(', ')}. `:''}${s.why}</div>`;
    if(ok){markDone(s.id,'Ситуация разобрана');$('scen').querySelectorAll('.ok')[scSel].textContent='✓';}
  };
}

/* ================= 5. quiz ================= */
const QUIZ=[
 {id:'q1',type:'order',title:'Этапы STLC по порядку',q:'Расставь этапы жизненного цикла тестирования по порядку.',items:STLC.map(s=>s.t),
  hint:'Сначала понять, что проверять, потом решить, как, подготовить всё нужное — и только потом проверять и подводить итоги.',sol:'Анализ требований → Планирование → Проектирование тестов → Подготовка окружения → Выполнение → Завершение.'},
 {id:'q2',type:'order',title:'Путь сборки до прода',q:'Как правка разработчика попадает к пользователям?',items:['Коммит','Сборка и автотесты','Dev','Test','Stage','Prod'],
  hint:'Сначала правку сохраняют в общее хранилище кода, потом она проходит стенды от самого «сырого» к настоящему.',sol:'Коммит → сборка и автотесты (автоматически) → dev → test → stage → prod. Упала сборка или автотест — правка возвращается разработчику.'},
 {id:'q3',type:'match',title:'Где это происходит',q:'Сопоставь проверку с окружением.',opts:['При сборке (автоматически)','test','stage','prod'],
  rows:[['Модульные автотесты',0],['Смоук новой сборки',1],['Ретест исправленного бага',1],['Регресс и финальная проверка перед релизом',2],['Проверка с настоящими внешними сервисами (оплата)',2],['Смоук после релиза',3]],
  hint:'На test работает тестировщик с новым и с ретестом. Stage — копия прода с настоящими внешними сервисами.',sol:'Автотесты — при сборке. Смоук и ретест — test. Регресс и проверка с настоящими сервисами — stage. Смоук после релиза — prod.'},
 {id:'q4',type:'match',title:'Документ → этап STLC',q:'На каком этапе STLC получается этот результат?',opts:STLC.map(s=>s.t),
  rows:[['Вопросы с ответами в задаче',0],['Тест-план, оценка времени',1],['Чек-лист и тест-кейсы',2],['Рабочий стенд и тестовые данные',3],['Баг-репорты',4],['Итоговый отчёт о тестировании',5]],
  hint:'Посмотри колонку «На выходе» во вкладке «Жизненные циклы».',sol:'Вопросы — анализ требований; тест-план — планирование; чек-лист и кейсы — проектирование тестов; стенд и данные — подготовка окружения; баг-репорты — выполнение; отчёт — завершение.'},
 {id:'q5',type:'match',title:'К кому за чем',q:'Что тестировщик получает от каждой роли?',opts:['Приоритеты и ответы «как должно быть»','Требования и спецификации','Макеты','Рабочий стенд и новую сборку','Новые запросы API и исправления'],
  rows:[['PO / PM',0],['Аналитик',1],['Дизайнер',2],['DevOps',3],['Backend-разработчик',4]],
  hint:'Вспомни, кто за что отвечает: решает «что и зачем», пишет требования, рисует, следит за стендами, делает сервер.',sol:'PO — приоритеты и ответы; аналитик — требования; дизайнер — макеты; DevOps — стенд и сборка; backend — API и исправления.'},
 {id:'q6',type:'choice',title:'Смоук упал',q:'Новая сборка на test: не работает вход. Что делаешь?',
  opts:[['Сразу пишу разработчикам и возвращаю сборку, полную проверку не начинаю',1,'Да. Смоук отвечает на вопрос «есть ли смысл тестировать дальше» — здесь нет.'],['Завожу баг и продолжаю проверять промокод по чек-листу',0,'Без входа нельзя проверить почти ничего — день уйдёт впустую.'],['Жду до вечера: может, само починится',0,'Разработчики узнают о проблеме поздно, и время тестирования пропадёт.'],['Начинаю регресс, раз новое проверить нельзя',0,'Регресс — после проверки нового и тоже требует живой сборки.']]},
 {id:'q7',type:'choice',title:'Fixed — и что дальше',q:'Разработчик перевёл твой баг в Fixed. Кто и что делает дальше?',
  opts:[['Разработчик сам закрывает баг',0,'Fixed — только мнение разработчика. Закрывает обычно тестировщик.'],['Тестировщик делает ретест на новой сборке и, если баг не повторился, закрывает его',1,'Верно. И помнит про регресс: исправление могло задеть соседние функции.'],['Баг сразу уходит в Closed автоматически',0,'Без ретеста никто не знает, исправлен ли баг на самом деле.'],['Тестировщик переоткрывает баг, чтобы проверить ещё раз',0,'Reopened — когда ретест уже показал, что баг повторился.']]},
 {id:'q8',type:'choice',title:'Зачем так рано',q:'Зачем тестировщик подключается уже на этапе требований, когда кода ещё нет?',
  opts:[['Чтобы быстрее написать автотесты',0,'Автотесты тут ни при чём: на этапе требований тестируют сами требования.'],['Ошибку в требованиях исправить дешевле всего — одной правкой текста',1,'Да. Условно: в требованиях ×1, на тестировании ×20, у пользователей ×100. Это shift-left.'],['Так положено по Waterfall',0,'Ранний старт полезен в любой модели разработки.'],['Чтобы проконтролировать аналитика',0,'Цель — не контроль, а найти неясности до того, как по ним напишут код.']]}
];
const qState={};
function renderQuiz(m){
  m.innerHTML=`<h2 class="sec">Проверь себя</h2><p class="sec-lead">Задания проверяются сразу. Если не получается — подсказка, потом разбор. Решённые задания засчитываются в прогресс вверху.</p><div class="tasks" id="tasks"></div>`;
  $('tasks').innerHTML=QUIZ.map((t,i)=>`<div class="task ${done.has(t.id)?'done':''}" id="t-${t.id}"><div class="task-h"><span class="id">${String(i+1).padStart(2,'0')}</span><h4>${t.title}</h4><span class="badge">${done.has(t.id)?'решено':'не решено'}</span></div><p class="q">${t.q}</p><div class="tb"></div>
   <div class="actions"><button class="btn primary" type="button" data-a="check">Проверить</button>${t.hint?'<button class="btn" type="button" data-a="hint">Подсказка</button>':''}${t.sol?'<button class="btn" type="button" data-a="sol">Разбор</button>':''}<button class="btn" type="button" data-a="reset">Сбросить</button></div><div class="out"></div></div>`).join('');
  QUIZ.forEach(t=>{qState[t.id]=qState[t.id]||{};drawTask(t);const el=$('t-'+t.id);
    el.querySelector('.actions').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,out=el.querySelector('.out');
      if(a==='hint')out.innerHTML=`<div class="hintbox">${t.hint}</div>`;
      if(a==='sol')out.innerHTML=`<div class="solbox">${t.sol}</div>`;
      if(a==='reset'){qState[t.id]={};out.innerHTML='';drawTask(t);}
      if(a==='check')checkTask(t,el,out);};});
}
function drawTask(t){
  const el=$('t-'+t.id),tb=el.querySelector('.tb'),st=qState[t.id];
  if(t.type==='order'){st.pool=st.pool||shuffle(t.items.map((x,i)=>i));st.seq=st.seq||[];
    tb.innerHTML=`<div class="seq">${st.seq.map((i,k)=>`<button type="button" data-s="${k}" class="${st.res?(st.res[k]?'r':'w'):''}"><span class="o">${k+1}</span>${t.items[i]}</button>`).join('')}</div><div class="pool" style="margin-top:8px">${st.pool.filter(i=>!st.seq.includes(i)).map(i=>`<button type="button" data-p="${i}">${t.items[i]}</button>`).join('')}</div>`;
    tb.onclick=e=>{const p=e.target.closest('[data-p]'),s=e.target.closest('[data-s]');st.res=null;if(p)st.seq.push(+p.dataset.p);if(s)st.seq.splice(+s.dataset.s,1);drawTask(t);};}
  if(t.type==='match'){st.v=st.v||{};
    tb.innerHTML=`<div class="match">${t.rows.map((r,k)=>`<div class="row ${st.res?(st.res[k]?'r':'w'):''}"><span class="lbl">${r[0]}</span><select data-k="${k}" aria-label="${r[0]}"><option value="">— выбери —</option>${t.opts.map((o,j)=>`<option value="${j}" ${st.v[k]==j&&st.v[k]!==''?'selected':''}>${o}</option>`).join('')}</select></div>`).join('')}</div>`;
    tb.onchange=e=>{const s=e.target.closest('select');if(!s)return;st.v[s.dataset.k]=s.value;st.res=null;s.closest('.row').className='row';};}
  if(t.type==='choice'){
    tb.innerHTML=`<div class="opts">${t.opts.map((o,k)=>`<label class="${st.checked&&st.sel==k?(o[1]?'r':'w'):''}"><input type="radio" name="${t.id}" value="${k}" ${st.sel==k?'checked':''}><span>${o[0]}${st.checked&&st.sel==k?`<span class="why">${o[2]}</span>`:''}</span></label>`).join('')}</div>`;
    tb.onchange=e=>{st.sel=+e.target.value;st.checked=false;drawTask(t);};}
}
function checkTask(t,el,out){
  const st=qState[t.id];let ok=false,msg='';
  if(t.type==='order'){if(st.seq.length<t.items.length){out.innerHTML='<div class="fb bad">Расставь все карточки.</div>';return;}
    st.res=st.seq.map((v,k)=>v===k);ok=st.res.every(Boolean);msg=ok?'Верно!':`На своих местах: ${st.res.filter(Boolean).length} из ${t.items.length}. Нажми на карточку, чтобы вернуть её назад.`;}
  if(t.type==='match'){const filled=t.rows.every((r,k)=>st.v[k]!==undefined&&st.v[k]!=='');if(!filled){out.innerHTML='<div class="fb bad">Заполни все строки.</div>';return;}
    st.res=t.rows.map((r,k)=>+st.v[k]===r[1]);ok=st.res.every(Boolean);msg=ok?'Верно!':`Верно: ${st.res.filter(Boolean).length} из ${t.rows.length}.`;}
  if(t.type==='choice'){if(st.sel==null){out.innerHTML='<div class="fb bad">Выбери вариант.</div>';return;}st.checked=true;ok=!!t.opts[st.sel][1];msg=ok?'Верно!':'Не совсем — прочитай пояснение под вариантом.';}
  drawTask(t);out.innerHTML=`<div class="fb ${ok?'ok':'bad'}">${msg}</div>`;
  if(ok){markDone(t.id,'Задание решено');el.classList.add('done');el.querySelector('.badge').textContent='решено';}
}

/* ================= progress ================= */
const ALL=['path-plain','path-story','roles-all','types-all',...MISSIONS.map(m=>m.id),...SCEN.map(s=>s.id),...QUIZ.map(q=>q.id)];
function updProg(){const n=ALL.filter(i=>done.has(i)).length;$('pbar').style.width=(n/ALL.length*100)+'%';$('ptxt').textContent=`${n} / ${ALL.length}`;}

drawTabs();render();updProg();
</script>
