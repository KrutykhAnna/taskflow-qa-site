# Вопросы темы «Интеграции: синхронные и асинхронные, внутренние и внешние». Формат — см. osnovy/bag-report.yaml.

- id: int-01
  type: card
  question: По каким двум осям классифицируют любую интеграцию?
  answer: |
    Две независимые оси.

    **Ждёт ли отправитель результат?** Ждёт — интеграция **синхронная**.
    Отправил и пошёл дальше — **асинхронная**. Особый вид асинхронной —
    **пакетная**: работа копится и выполняется по расписанию.

    **Чья вторая сторона?** Наша — **внутренняя**. Другой компании —
    **внешняя**.

    Оси не связаны, бывают все четыре сочетания. Запрос в банк «спиши»
    с ожиданием ответа — внешняя синхронная. Событие «Заказ оплачен»
    через брокер к сервису курьеров — внутренняя асинхронная.

    Вид определяют **у каждой связи отдельно**, а не у процесса целиком.

- id: int-02
  type: quiz
  question: Отправитель передал данные и продолжил работу, а результат появился через минуту. Какая это интеграция?
  options:
    - "Внешняя: результат пришёл от другой стороны"
    - "Асинхронная: отправитель не ждал результат"
    - "Синхронная: данные ушли HTTP-запросом"
    - "Внутренняя: отправитель продолжил работу"
  correct: 1
  explanation: |
    Синхронная или асинхронная — это про **ожидание**. Отправитель не
    ждал результат и продолжил работу — интеграция асинхронная.

    Внешняя или внутренняя — другая ось: она про то, **чья** вторая
    сторона. Из условия этого не понять. Протокол HTTP тоже не решает:
    запрос может вернуть «принято», а работа пойдёт дальше в фоне.

- id: int-03
  type: quiz
  question: "Коллега: «Платёжный шлюз — внешняя система, значит, интеграция с ним асинхронная». Что ответишь?"
  options:
    - "Да, с внешними системами общаются только через очередь"
    - "Да, если сервер шлюза находится в другой стране мира"
    - "Нет: с внешними системами обмениваются только файлами"
    - "Нет: «спиши» с ожиданием ответа — внешняя синхронная"
  correct: 3
  explanation: |
    Это типичная путаница: склеить две независимые оси. Внешняя
    интеграция бывает синхронной: магазин отправляет «спиши 1500 ₽» и
    ждёт «одобрено» или «отказ». А бывает асинхронной: шлюз потом сам
    присылает вебхук «платёж подтверждён».

    Где стоит сервер и как далеко он, тоже не решает. Вид определяют
    у каждой связи отдельно.

- id: int-04
  type: quiz
  question: Какой признак снаружи чаще всего говорит, что обработка асинхронная?
  options:
    - "Ответ 202 Accepted и id для проверки статуса позже"
    - "Ответ 201 Created с готовым объектом в теле ответа"
    - "Ответ 200 OK, пришедший быстрее чем за одну секунду"
    - "Ответ 400 Bad Request с подробным описанием ошибки"
  correct: 0
  explanation: |
    `202 Accepted` значит «принято, обработаю позже». Обычно с ним
    приходит id задачи или ссылка, по которой потом проверяют статус.

    Другие признаки асинхронности: статус «в обработке» в ответе,
    результат появляется позже, в документации слова «очередь»,
    «топик», «событие», «вебхук».

    `201` с готовым объектом — признак того, что работа сделана к моменту
    ответа. Скорость ответа о виде интеграции ничего не говорит.

- id: int-05
  type: card
  question: Чем внутренняя интеграция отличается от внешней? Что это меняет для тестировщика?
  answer: |
    Решает, **кто управляет второй стороной**.

    **Внутренняя** — вторая сторона наша: соседний сервис, база данных,
    кэш, очередь. Мы её построили, можем поменять и заглянуть внутрь:
    код, логи, база.

    **Внешняя** — система другой компании: банк, служба доставки,
    SMS-провайдер. Видим только документацию и её ответы. Она может
    измениться, упасть или начать брать деньги без нас.

    Для тестировщика:

    - во внутренней прохожу обе стороны сам: запрос, запись в базе,
      логи второго сервиса;
    - во внешней собираю свою сторону — что отправили и что получили, —
      тестирую в песочнице партнёра и на заглушке, а остальное —
      вопрос партнёру;
    - главный риск внешней — партнёр изменился, недоступен или ответил
      «неизвестно».

- id: int-06
  type: quiz
  question: Приложение хранит данные в базе, которую держит облачный провайдер. Какая это интеграция?
  options:
    - "Внешняя: сервер базы принадлежит другой компании"
    - "Внешняя: связь с базой идёт через интернет"
    - "Внутренняя: схема, данные и запросы наши"
    - "Это вообще не интеграция, а просто хранение данных"
  correct: 2
  explanation: |
    Внутренняя или внешняя — решает не «где стоит», а **кто управляет**.
    Сервер у провайдера, но таблицы, данные и запросы — наши. Мы решаем,
    что и как в базе хранить.

    И база данных — тоже интеграция: два компонента, между ними сеть,
    у разговора свои ошибки.

- id: int-07
  type: quiz
  question: Твой сервис вызывает сервис другой команды той же компании. Как к этой интеграции правильно относиться?
  options:
    - "Внутренняя, но тестировать её как почти внешнюю, с контрактом"
    - "Как к внешней: другая команда — это всё равно что другая компания"
    - "Как к обычной внутренней: её код всегда можно поменять самому"
    - "Никак не тестировать: за этот сервис отвечает только та команда"
  correct: 0
  explanation: |
    Это серая зона. Формально интеграция внутренняя: компания одна,
    логи и помощь можно попросить. Но поменять сервис сами мы не можем,
    и выкатывают его без нас.

    Поэтому тестируют его **как почти внешний**: проверяют контракт,
    готовятся к тому, что он изменится, упадёт или будет медленным.
    Отказываться от проверок связи с ним нельзя: на границе ломается
    чаще всего.

- id: int-08
  type: quiz
  question: Что такое вебхук?
  options:
    - "Опрос статуса по таймеру: мы спрашиваем «готово?» каждые N секунд"
    - "Файл, который партнёр выкладывает раз в сутки для обработки"
    - "Очередь внутри брокера для сообщений, которые не удалось обработать"
    - "Запрос, которым вторая сторона сама сообщает нам о событии"
  correct: 3
  explanation: |
    **Вебхук** — вторая сторона сама вызывает наш адрес, когда у неё
    что-то случилось: «платёж прошёл», «посылка в пункте выдачи». Для
    нас это входящая асинхронная интеграция.

    Что проверить: вебхук без подписи или с неверной подписью
    отклоняется; повторный вебхук не создаёт второй платёж; вебхук,
    пришедший раньше времени, не ломает заказ.

    Опрос по таймеру — polling. Очередь для необработанных сообщений —
    DLQ.

- id: int-09
  type: quiz
  question: Сервис пушей забрал из брокера событие «Заказ доставлен» и вызывает Apple, чтобы отправить пуш, ждёт «принято». Какой вид у вызова Apple?
  options:
    - "Внутренняя асинхронная, как и вся цепочка"
    - "Внешняя синхронная: ждём ответ чужой системы"
    - "Внешняя асинхронная: вся цепочка через брокер"
    - "Внутренняя синхронная: сервис пушей наш"
  correct: 1
  explanation: |
    Ловушка — подписать вид у процесса целиком. Получение события из
    брокера — внутренняя асинхронная связь. А вызов Apple — отдельная
    связь: вторая сторона чужая, и сервис ждёт ответ. Это внешняя
    синхронная, исходящая.

    Внутри асинхронной цепочки может быть спрятан синхронный вызов.
    Поэтому вид определяют у каждой стрелки отдельно.

- id: int-10
  type: card
  question: Кто такие продюсер, консьюмер и брокер? Что проверяют у каждого?
  answer: |
    **Продюсер** публикует событие. **Брокер** — Kafka, RabbitMQ — хранит
    сообщение, пока его не заберут. **Консьюмер** получает и
    обрабатывает событие.

    Сообщение в брокере — **место встречи**. Поэтому каждую сторону
    тестируют отдельно.

    **Продюсер — «правильно ли сказал»:** событие есть, когда нужно, и
    нет, когда не нужно; одно действие — одно событие; правильный
    топик и ключ; поля и типы по контракту; есть `event_id` и
    `correlation_id`; нет номера карты и паролей; событие не теряется,
    если брокер недоступен.

    **Консьюмер — «правильно ли понял»:** правильный результат; дубль
    того же `event_id` обрабатывается один раз; события не по порядку
    не ломают; битое сообщение уходит в DLQ, остальные идут; новое
    поле не ломает; после простоя догоняет накопленное.

    Коротко: продюсера проверяют по сообщению в топике, консьюмера —
    подложив своё сообщение и посмотрев на результат.

- id: int-11
  type: quiz
  question: Клиенту пришли два SMS «Заказ принят». В топике по этому заказу два сообщения с разными event_id. Кто виноват?
  options:
    - "Брокер: он доставил одно сообщение дважды"
    - "Консьюмер: он не идемпотентен к повторной доставке"
    - "Продюсер: на одно действие он отправил два события"
    - "SMS-провайдер: он продублировал сообщение клиенту"
  correct: 2
  explanation: |
    Разные `event_id` — это два **разных** события. Брокер так не
    дублирует: при повторной доставке он присылает то же сообщение с тем
    же `event_id`. Значит, продюсер на одно действие опубликовал два
    события.

    Если бы в топике было одно сообщение — или два с одинаковым
    `event_id`, — а SMS два, виноват был бы консьюмер: он обработал
    повтор как новое событие.

- id: int-12
  type: quiz
  question: В топике одно сообщение «Заказ оплачен», брокер доставил его повторно после сбоя. Назначено два курьера. Что не так?
  options:
    - "Брокер: при повторной доставке он обязан был удалить старую копию"
    - "Ничего: при асинхронной интеграции дубли курьеров — обычная норма"
    - "Продюсер: он должен был сразу отправить событие ещё раз с новым id"
    - "Консьюмер не идемпотентен: повтор того же event_id меняет итог"
  correct: 3
  explanation: |
    Брокеры обычно доставляют «хотя бы один раз»: чтобы не потерять
    сообщение, при сбое его доставляют повторно. Это нормальное
    поведение брокера.

    Защита от дублей — на стороне консьюмера. Он должен быть
    **идемпотентным**: увидев уже обработанный `event_id`, не назначать
    второго курьера. Проверка: подложить в топик то же сообщение второй
    раз.

- id: int-13
  type: card
  question: Что такое схема outbox и что в ней проверить?
  answer: |
    **Проблема.** Сервис сохранил оплату в базу, а событие «Заказ
    оплачен» отправить не успел: брокер лежал или сервис перезапустился.
    Заказ навсегда остаётся «Оплачен» без доставки.

    **Outbox** — «исходящий ящик». Событие сначала пишется **в ту же
    базу и в той же транзакции**, что и сама оплата. Сохранилась
    оплата — сохранилось и событие. Отдельный процесс читает «ящик» и
    отправляет события в брокер. Брокер лежал — процесс попробует
    снова, когда он поднимется.

    Outbox защищает от **потери**, но не от **дублей**: процесс может
    отправить событие и упасть, не успев отметить его отправленным, —
    тогда оно уйдёт ещё раз. Поэтому консьюмер всё равно должен быть
    идемпотентным.

    Что проверить: остановить брокер на стенде, сделать оплату,
    запустить брокер — событие не потерялось. Если ушло дважды —
    результат у консьюмера один. И отдельно — оплата откатилась,
    значит, события в «ящике» нет.

- id: int-14
  type: quiz
  question: Зачем продюсеру в Kafka правильно выбирать ключ сообщения?
  options:
    - "От ключа зависит, придут ли события заказа по порядку"
    - "По ключу консьюмер проверяет подпись отправителя сообщения"
    - "Ключ определяет, сколько дней брокер хранит сообщение"
    - "Ключ шифрует сообщение, без него брокер не принимает данные"
  correct: 0
  explanation: |
    В Kafka порядок гарантирован только внутри одной **партиции** —
    «полосы» внутри топика, — а партицию обычно выбирают по ключу. Значит,
    по порядку приходят сообщения с **одинаковым ключом**. Если события одного заказа — «Оплачен» и
    «Отменён» — ушли с разными ключами, они могут обогнать друг друга.
    Курьер поедет за отменённым заказом.

    Поэтому события одного объекта публикуют с одним ключом —
    например, номером заказа. Проверка у продюсера: посмотреть ключ
    сообщения в топике.

- id: int-15
  type: quiz
  question: Что такое DLQ и зачем она нужна?
  options:
    - "Очередь для самых срочных сообщений, их читают первыми"
    - "Очередь для сообщений, которые не удалось обработать"
    - "Копия всех сообщений на случай, если брокер потеряет данные"
    - "Очередь, в которую консьюмер пишет результаты обработки"
  correct: 1
  explanation: |
    **DLQ** — dead letter queue, «очередь мёртвых писем». Консьюмер не
    может обработать сообщение: битый JSON, нет поля. Если пробовать
    снова и снова, вся очередь встанет. Поэтому после нескольких попыток
    сообщение уходит в DLQ, а следующие обрабатываются дальше.

    Что проверить: битое сообщение действительно уходит в DLQ;
    остальные идут; кто-то узнаёт о росте DLQ; сообщения из DLQ можно
    переобработать — и каждое один раз.

- id: int-16
  type: card
  question: Асинхронная интеграция А → брокер → Б сломалась. Как понять, кто виноват — А или Б?
  answer: |
    Смотреть на то, что **между ними** — на сообщение в топике.

    - Сообщения **нет** — виноват **А**. Или настройки: не тот топик.
    - Сообщение **есть, но неправильное** — виноват **А**.
    - Сообщение **есть и правильное**, а результата у Б нет или он
      неверный — виноват **Б**. Смотрим его логи, lag, DLQ.

    Для синхронной связи то же правило: неправильный запрос — А;
    правильный запрос, неправильный ответ — Б; правильный ответ, но А
    показал или сохранил не то — А.

    И перед всем этим — исключить свою ошибку: тот стенд, та база,
    та версия.

- id: int-17
  type: quiz
  question: Продюсер добавил в событие новое поле promo_code. Как должен вести себя консьюмер, которому это поле не нужно?
  options:
    - "Отправить сообщение в DLQ: формат события изменился"
    - "Остановить обработку очереди до обновления контракта"
    - "Обработать сообщение как обычно, лишнее поле пропустить"
    - "Вернуть сообщение продюсеру с ошибкой нарушения контракта"
  correct: 2
  explanation: |
    Добавление нового поля обычно считается **совместимым** изменением.
    Консьюмер должен читать нужные ему поля и спокойно пропускать
    лишние. Иначе любое развитие продюсера будет ломать всех
    подписчиков.

    А вот удаление или переименование поля, смена типа — несовместимые
    изменения. Их выпускают с новой версией события и предупреждают
    консьюмеров.

- id: int-18
  type: quiz
  question: Клиент заплатил картой днём, а кешбэк пришёл только на следующий день. Как оценишь?
  options:
    - "Баг: кешбэк всегда должен начисляться в самый момент покупки"
    - "Не баг в любом случае: кешбэк банк начисляет когда захочет"
    - "Баг: любая асинхронная обработка должна занимать секунды"
    - "Не баг, если по правилам кешбэк считают пакетно раз в сутки"
  correct: 3
  explanation: |
    Кешбэк часто считают **пакетной** обработкой: ночью задача проходит
    по всем покупкам за день. Тогда начисление на следующий день —
    норма. Решает требование, а не ощущение.

    Баг — если по правилам кешбэк должен прийти сразу, если он не
    пришёл вовсе, пришёл дважды или в неправильной сумме.

- id: int-19
  type: card
  question: Ночная задача начисления процентов может запуститься дважды или упасть на середине. Что проверить?
  answer: |
    Задача без интерфейса — это интеграция «задача по расписанию ↔
    база», внутренняя пакетная. Интерфейсом становятся база, логи и
    служебное API запуска.

    - **Двойной запуск** — например, на двух серверах одновременно.
      Проценты не начислены дважды: у каждого вклада ровно одна
      проводка за дату.
    - **Падение на середине** и перезапуск — первая половина вкладов не
      получила начисление второй раз.
    - **Даты**: часовой пояс «полуночи», 29 февраля, вклад открыт 31-го.
    - **Объём**: успеет ли задача на данных прода до утра.
    - **Оповещение**: кто-то узнает, если задача упала или не
      запустилась.

    Проверка — через базу: подготовить вклады, запустить задачу,
    посмотреть проводки и логи.

