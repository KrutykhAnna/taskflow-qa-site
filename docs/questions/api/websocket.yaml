# Вопросы темы «WebSocket и данные в реальном времени». Формат — см. osnovy/bag-report.yaml.

- id: aws-01
  type: card
  question: Зачем нужны данные в реальном времени и какими способами их доставляют?
  answer: |
    **Real-time** — изменение на сервере появляется у пользователя почти
    сразу, без кнопки «Обновить». Нужно для чатов, уведомлений, котировок,
    трекинга курьера, совместного редактирования, игр, статусов заказов.

    Способы:

    - **polling** — клиент спрашивает по таймеру «есть новое?»;
    - **long polling** — сервер держит запрос, пока не появится новость;
    - **SSE** — один HTTP-ответ, в который сервер дописывает события,
      только сервер → клиент;
    - **WebSocket** — постоянное соединение, сообщения в обе стороны;
    - **push-уведомления** — на телефон, даже если приложение закрыто;
    - **вебхуки** — сервер одной системы сообщает серверу другой.

- id: aws-02
  type: quiz
  question: Чем polling — опрос по таймеру — проигрывает WebSocket?
  options:
    - "Polling не работает через HTTPS, поэтому на проде его не используют совсем"
    - "Большинство ответов — «ничего нового», а новость приходит с задержкой"
    - "Polling требует отдельного протокола и ответа `101` на каждый запрос"
    - "При polling сервер сам шлёт данные, и клиент не успевает их обработать"
  correct: 1
  explanation: |
    Polling — обычные HTTP-запросы по таймеру. Чаще всего ответ —
    «ничего нового»: лишняя нагрузка на сервер, трафик и батарею. А новость,
    появившаяся сразу после опроса, дойдёт только при следующем.

    Зато polling простой и надёжный. Для редких изменений, где задержка
    в полминуты не страшна, это нормальный выбор.

- id: aws-03
  type: quiz
  question: Чем `ws://` отличается от `wss://`?
  options:
    - "`ws://` — для текстовых сообщений, `wss://` — для бинарных"
    - "`ws://` работает только в браузере, `wss://` — только в Postman"
    - "`wss://` — это WebSocket с подписками, `ws://` — без подписок"
    - "`wss://` шифрует соединение через TLS, как `https://`, а `ws://` — нет"
  correct: 3
  explanation: |
    Схемы повторяют HTTP: `ws://` — без шифрования, как `http://`,
    `wss://` — с TLS, как `https://`.

    На проде — только `wss://`. Иначе сообщения, токены и личные данные
    идут по сети открытым текстом. `ws://` на проде — баг безопасности.

- id: aws-04
  type: quiz
  question: Что значит код `101 Switching Protocols` у WebSocket-соединения?
  options:
    - "Рукопожатие прошло: сервер согласился перейти с HTTP на WebSocket"
    - "Сервер принял первое сообщение клиента и подтвердил его получение"
    - "Соединение закрыто штатно, и клиенту можно переподключиться"
    - "Сервер перенаправил клиента на другой адрес для WebSocket"
  correct: 0
  explanation: |
    WebSocket начинается с обычного `GET` с заголовками
    `Upgrade: websocket` и `Connection: Upgrade`. Если сервер согласен,
    он отвечает `101` — и дальше по тому же соединению идёт WebSocket.

    `101` говорит только о рукопожатии. Приходят ли сообщения, правильные
    ли они и живо ли соединение сейчас — видно в Messages.

- id: aws-05
  type: card
  question: Где в DevTools смотреть сообщения WebSocket и что там видно?
  answer: |
    **Network** → фильтр по типу **Socket** (в старых версиях Chrome
    и в Firefox — **WS**) → обновить страницу → выбрать соединение
    со статусом `101`.

    - **Headers** — рукопожатие: адрес, `101`, `Upgrade`, `Connection`,
      как передан токен.
    - **Messages** — лента сообщений: стрелка вверх — отправил клиент,
      вниз — пришло от сервера; время, размер, содержимое, фильтр
      и поиск. Здесь же видно закрытие.

    DevTools нужно открыть **до** подключения: сообщения копятся, пока
    открыта вкладка Network. Переподключения видны как новые строки
    с тем же адресом.

- id: aws-06
  type: quiz
  question: Кто может отправить сообщение в уже открытом WebSocket-соединении?
  options:
    - "Только клиент: сервер лишь отвечает на его сообщения"
    - "Только сервер: клиент может лишь подключиться и слушать"
    - "Любая сторона — в любой момент, не дожидаясь другой"
    - "Стороны по очереди: сначала клиент, потом сервер, потом снова клиент"
  correct: 2
  explanation: |
    В этом главное отличие от HTTP. В HTTP разговор всегда начинает
    клиент, и на один запрос приходит один ответ.

    В WebSocket после рукопожатия обе стороны равноправны: сервер может
    прислать десять сообщений подряд без вопроса, клиент — отправить
    своё в любой момент. Очерёдности нет.

- id: aws-07
  type: quiz
  question: В какую сторону идут данные в SSE — Server-Sent Events?
  options:
    - "В обе стороны, как в WebSocket, но только текстовыми строками"
    - "Только от сервера к клиенту, по одному незакрытому HTTP-ответу"
    - "Только от клиента к серверу, пачками сообщений по таймеру"
    - "От сервера к серверу, как вебхуки между двумя системами"
  correct: 1
  explanation: |
    SSE — обычный HTTP-ответ с типом `text/event-stream`, который сервер
    не закрывает, а дописывает в него события.

    Отправить что-то серверу через этот канал нельзя — только отдельным
    HTTP-запросом. Зато браузер сам переподключается и отправляет
    `Last-Event-ID`, чтобы сервер мог дослать пропущенное.

- id: aws-08
  type: quiz
  question: "Хитрый вопрос: в логе одного соединения код закрытия `1000`, другого — `1006`. В чём разница для тестировщика?"
  options:
    - "Никакой: оба кода значат, что соединение закрыто, и это нормальная ситуация"
    - "`1000` — внутренняя ошибка сервера, а `1006` — ошибка на стороне клиента"
    - "`1006` отправляет сервер, когда клиент нарушил формат сообщений"
    - "`1000` — штатное закрытие, а `1006` — обрыв, после которого нужен реконнект"
  correct: 3
  explanation: |
    `1000` — одна из сторон закрыла соединение намеренно и отправила
    close-фрейм. Переподключаться обычно не нужно.

    `1006` никто не отправляет: его ставит сам клиент, когда понял, что
    соединения больше нет, а close-фрейма не было. Пропала сеть, упал
    сервер, соединение убил прокси.

    Значит, после `1006` проверяем переподключение и пропущенные
    данные. А нарушение формата или политики — это `1008`, `1009`
    или код приложения из диапазона 4000–4999.

- id: aws-09
  type: card
  question: Зачем нужен ping/pong и что такое «тихая смерть» соединения?
  answer: |
    **Тихая смерть** — соединение умерло, но ни одна сторона не узнала:
    сеть пропала без close-фрейма. Сокет «открыт», а данных нет. Курьер
    на карте «стоит», котировки замерли, ошибок нет.

    **Ping/pong** — heartbeat, «сердцебиение»: стороны регулярно
    обмениваются короткими сигналами. В протоколе есть служебные фреймы
    ping и pong; многие приложения шлют свой ping обычным сообщением.
    Нет ответа за N секунд — соединение считают мёртвым и переподключаются.

    Вторая задача ping — не дать **прокси и балансировщикам** закрыть
    соединение, по которому долго ничего не идёт.

    Что проверить: есть ли heartbeat в Messages, через сколько клиент
    замечает молчание сервера, что видит пользователь.

- id: aws-10
  type: quiz
  question: После релиза сервер перезапустили, и он сразу лёг от наплыва переподключений. Что должен делать клиент, чтобы этого не было?
  options:
    - "Ждать перед попыткой всё дольше и добавлять к паузе случайную долю"
    - "Переподключаться без паузы, чтобы пользователь не заметил обрыв"
    - "Переподключаться ровно раз в 5 секунд — одинаково у всех клиентов"
    - "Не переподключаться: пользователь сам обновит страницу, если нужно"
  correct: 0
  explanation: |
    Это **шторм переподключений**: все клиенты потеряли соединение
    одновременно и одновременно ломятся обратно.

    Защита — **backoff**: пауза между попытками растёт до верхнего
    предела. И **jitter** — случайная добавка, чтобы попытки тысяч клиентов
    разошлись во времени. Одинаковая пауза у всех не помогает: клиенты
    так и будут приходить волнами.

    Проверяет ручной тестировщик просто: перезапуск сервера на стенде
    и время между новыми соединениями в DevTools.

- id: aws-11
  type: card
  question: Как клиент получает сообщения, пропущенные за время обрыва, и что здесь проверять?
  answer: |
    Типичные механизмы:

    - у каждого события есть **номер** — `seq`. После переподключения
      клиент сообщает номер последнего полученного, сервер досылает
      остальное;
    - в SSE браузер сам отправляет заголовок **`Last-Event-ID`**;
    - клиент заново загружает **снимок** — текущее состояние через REST.

    Если ничего из этого нет — после обрыва на экране висят старые
    данные до следующего изменения. Это баг.

    Проверка: отключить сеть по-настоящему, за это время создать
    события, вернуть сеть. Пришли все пропущенные? В правильном порядке?
    Без дублей? При долгом обрыве, когда сервер уже не хранит старые
    события, — клиент взял снимок?

- id: aws-12
  type: quiz
  question: После переподключения в чате появились два одинаковых сообщения. Что наиболее вероятно?
  options:
    - "Собеседник дважды нажал «Отправить», и это не баг приложения"
    - "WebSocket всегда доставляет каждое сообщение дважды для надёжности"
    - "Сообщение пришло повторно, а клиент не сверяет сообщения по id"
    - "Сервер вернул код `101` дважды, и клиент открыл чат во второй раз"
  correct: 2
  explanation: |
    Два частых сценария. Клиент отправил сообщение, связь оборвалась
    до подтверждения — и после переподключения он отправил его ещё раз.
    Или сервер дослал пропущенное, а среди него было то, что клиент
    уже показал.

    Защита — уникальный id у каждого сообщения: ни сервер, ни клиент
    не создают и не показывают дубль с тем же id. Это идемпотентность
    потребителя, только потребитель — приложение пользователя.

    Чей дубль — видно в Messages старого и нового соединения.

- id: aws-13
  type: quiz
  question: Приложение передаёт токен в адресе соединения — `wss://…/ws?token=…`. Какой главный риск?
  options:
    - "WebSocket не принимает параметры в адресе, соединение не откроется"
    - "Адрес с токеном оседает в логах сервера и прокси — токен может утечь"
    - "Токен в адресе каждый раз заново проверяется и сильно замедляет сообщения"
    - "Браузер сам удаляет параметры из адреса при рукопожатии"
  correct: 1
  explanation: |
    Браузерный WebSocket не позволяет добавить заголовок
    `Authorization`, поэтому токен часто кладут в адрес. Это работает,
    но адрес записывается в логи сервера, прокси, балансировщика.
    Кто читает логи — получает токен.

    Альтернативы: cookie — тогда сервер обязан проверять `Origin`;
    первое сообщение `auth` — тогда проверяем, что без него сервер
    ничего не отдаёт.

    И в баг-репорте такой адрес нужно маскировать.

- id: aws-14
  type: card
  question: Что будет, если токен истёк, а WebSocket-соединение ещё открыто? Как это проверить?
  answer: |
    Сервер обычно проверяет токен **при рукопожатии**. Соединение может
    жить часами — и события продолжают приходить уже без действующего
    токена. Та же проблема после **выхода из аккаунта** и блокировки
    пользователя, если сокет не закрыли.

    Правильное поведение — договорённость команды:

    - сервер сам закрывает соединение своим кодом, например `4001`,
      и клиент переподключается с новым токеном;
    - или клиент заранее обновляет токен и переподтверждает его сообщением.

    Проверка: на стенде попросить короткий срок жизни токена, держать
    соединение дольше. Отдельно — выход из аккаунта и блокировка: после
    них не должно прийти ни одного события.

- id: aws-15
  type: quiz
  question: "Хитрый вопрос: сервер сделан на Socket.IO. Ты подключаешься к нему обычным WebSocket-клиентом в Postman — и ничего не работает. Почему?"
  options:
    - "Socket.IO добавляет поверх WebSocket свой протокол, и нужен клиент Socket.IO"
    - "Socket.IO работает только по `ws://`, а Postman подключается по `wss://`"
    - "Сервер сломан: любой WebSocket-клиент обязан с ним работать"
    - "Postman вообще не поддерживает соединения, которые открыты дольше минуты"
  correct: 0
  explanation: |
    Socket.IO использует WebSocket как транспорт, но добавляет свой
    протокол: служебные сообщения, формат событий, запасной long polling.
    Обычный WebSocket-клиент этого не понимает.

    В Postman для Socket.IO есть отдельный тип запроса. Признак
    Socket.IO в DevTools — `/socket.io/` в адресе и сообщения,
    начинающиеся с цифр: `40`, `42["event",...]`.

    «Не подключается обычным клиентом» здесь — не баг сервера.

- id: aws-16
  type: quiz
  question: "Хитрый вопрос: ты отправил сообщение в WebSocket. Как узнать, что сервер его успешно обработал?"
  options:
    - "По коду ответа `200`, который сервер возвращает на каждое сообщение"
    - "По коду `101`: он приходит в ответ на каждое отправленное сообщение"
    - "Никак: в WebSocket сервер вообще не может отвечать на сообщения"
    - "Если приложение шлёт ответное сообщение, например с тем же `id`"
  correct: 3
  explanation: |
    В WebSocket нет кода ответа на сообщение. Отправил — и всё. Сервер
    может ответить, промолчать или ответить позже, вперемешку с другими
    сообщениями.

    Подтверждения и ошибки придумывают разработчики: например,
    `{"type":"ack","id":"c-17"}` или `{"type":"error","id":"c-17"}`.
    Это часть контракта. Если его нет — первый вопрос к команде:
    как сервер сообщает об ошибке?

- id: aws-17
  type: quiz
  question: "Хитрый вопрос: пользователь подключается с валидным токеном и отправляет `{\"type\":\"subscribe\",\"restaurantId\":318}`, хотя ресторан 318 чужой. Что должен сделать сервер?"
  options:
    - "Подписать: токен валидный, значит, пользователь уже проверен"
    - "Подписать, а прятать чужие заказы должен уже сам интерфейс"
    - "Отклонить: права проверяются при каждой подписке, не только при входе"
    - "Закрыть все соединения ресторана 318 на всякий случай, для защиты"
  correct: 2
  explanation: |
    Валидный токен говорит, **кто** пользователь, но не **на что** он
    имеет право. Подписка на канал — отдельное действие, и права на неё
    проверяет сервер.

    Если сервер подписал — события чужого ресторана уже у клиента,
    даже если интерфейс их не показывает. Это IDOR в мире сокетов.

    Проверять — только на своём стенде, своими двумя тестовыми
    пользователями.

- id: aws-18
  type: quiz
  question: "Хитрый вопрос: чат перестаёт получать сообщения, если в нём минут пять никто не пишет. Ошибок нет. Что вероятнее всего?"
  options:
    - "Сервер удаляет чаты, в которых пять минут не было сообщений"
    - "Прокси закрыл простаивающее соединение, а heartbeat в приложении нет"
    - "Браузер ограничивает любой WebSocket пятью минутами работы"
    - "Код `101` действует пять минут, потом нужно новое рукопожатие"
  correct: 1
  explanation: |
    Прокси и балансировщики закрывают соединения, по которым долго
    ничего не идёт. Если приложение не шлёт ping, тишина в чате
    выглядит для них как «соединение никому не нужно».

    Клиент об этом может и не узнать — «тихая смерть». Поэтому нужен
    heartbeat: регулярный ping и реакция, если pong не пришёл.

    Проверка: открыть чат, ничего не писать 5–10 минут, потом написать
    со второго аккаунта — дошло?

- id: aws-19
  type: card
  question: Зачем нужен long polling, если есть WebSocket?
  answer: |
    - Это **обычный HTTP**: его пропускают любые корпоративные прокси
      и файрволы, а WebSocket некоторые старые прокси рвут или
      не пропускают.
    - Его используют как **запасной вариант**: не открылся WebSocket —
      переходим на long polling. Так умеет, например, Socket.IO.
    - Для редких событий проще: не нужна инфраструктура постоянных
      соединений.

    Для тестировщика: если в продукте есть запасной вариант, его тоже
    нужно проверить — например, в сети, где WebSocket заблокирован.

- id: aws-20
  type: card
  question: Как сымитировать обрыв WebSocket и почему Offline в DevTools — не то же самое, что настоящая потеря сети?
  answer: |
    Offline в DevTools — **имитация**. Уже открытое соединение может
    закрыться не сразу, а сообщения, накопившиеся за время Offline,
    иногда приходят разом после возврата. Настоящая потеря сети ведёт
    себя иначе.

    Для честной проверки:

    - выключить Wi-Fi или включить авиарежим;
    - переключиться между Wi-Fi и мобильной сетью;
    - закрыть крышку ноутбука на несколько минут;
    - на своём стенде — перезапустить сервер.

    Offline в DevTools годится для быстрой проверки «что видит
    пользователь без сети», но вывод стоит перепроверить настоящим
    обрывом.
