# Вопросы темы «Монолит, микросервисы, интеграции». Формат — см. osnovy/bag-report.yaml.

- id: ams-01
  type: card
  question: Чем монолит отличается от микросервисов?
  answer: |
    **Монолит** — вся бизнес-логика в одном приложении: одна кодовая база,
    один деплой, обычно одна основная база данных. Модули вызывают друг
    друга внутри кода, без сети.

    **Микросервисы** — логика разделена между независимыми сервисами.
    У каждого свой код, своя база и свой деплой. Сервисы общаются
    по сети: HTTP-запросами или сообщениями через брокер.

    Для тестировщика разница — в последствиях:

    - монолит поднимается проще, баг ищешь в одном приложении и одном логе;
    - в микросервисах стенд собран из многих сервисов разных версий,
      сначала нужно понять, **какой** сервис виноват, а между сервисами
      появляются таймауты, дубли и задержки.

- id: ams-02
  type: quiz
  question: Что из этого — реальная цена перехода на микросервисы?
  options:
    - "Нельзя выкатить одну часть системы отдельно — выкатывается всё приложение"
    - "Всё приложение падает целиком, если упал один из его модулей"
    - "Сеть ненадёжна, а данные в разных базах расходятся на время"
    - "Все сервисы обязаны хранить данные в одной общей базе данных"
  correct: 2
  explanation: |
    Микросервисы общаются по сети. Запрос между ними может потеряться,
    опоздать или прийти дважды. У каждого сервиса своя база — данные
    сходятся не сразу. Отсюда сложнее тестирование и поиск бага.

    Остальные варианты — наоборот. Независимый релиз и изоляция отказов —
    это **плюсы** микросервисов. Общая база для всех — признак монолита,
    а не требование микросервисов.

- id: ams-03
  type: card
  question: Что такое API Gateway и что он делает?
  answer: |
    **API Gateway** — единая входная точка в систему. Клиенты — сайт,
    мобильное приложение — не знают адресов отдельных сервисов: они ходят
    в gateway, а он решает, куда отправить запрос.

    Обычно gateway:

    - **маршрутизирует** — `/orders/…` в сервис заказов, `/payments/…`
      в оплату;
    - **проверяет авторизацию** на входе;
    - **ограничивает частоту** запросов — rate limit;
    - **ставит `X-Request-ID`**, если клиент его не прислал.

    Для тестировщика: `502` и `504` часто отдаёт именно gateway. Это
    значит «сервис за мной ответил плохо или не ответил вовремя», а не
    «сломался сам gateway».

- id: ams-04
  type: quiz
  question: Какой пример — асинхронное взаимодействие сервисов?
  options:
    - "Сервис оплаты публикует событие «заказ оплачен» в брокер и не ждёт, кто и когда его обработает"
    - "Сервис заказов отправляет HTTP-запрос в сервис цен и ждёт ответ, чтобы посчитать сумму"
    - "Мобильное приложение вызывает REST API и показывает загрузку до ответа"
    - "Сервис заказов вызывает сервис склада по gRPC и ждёт подтверждения резерва"
  correct: 0
  explanation: |
    **Асинхронно** — отправитель публикует сообщение и продолжает работу,
    не дожидаясь обработки. Обработка происходит позже, у подписчиков.

    Остальные три варианта — **синхронные**: вызывающая сторона ждёт
    ответ. REST и gRPC в обычном виде — синхронные вызовы.

- id: ams-05
  type: card
  question: Что такое внешняя интеграция и что в ней проверять?
  answer: |
    **Внешняя интеграция** — наша система обращается к чужой: платёжный
    шлюз, SMS-сервис, служба доставки, карты, 1С. Чужую систему мы
    не контролируем.

    Что проверять:

    - **контракт** — поля, форматы, коды; что будет, если партнёр его изменит;
    - **таймауты и недоступность** — что видит пользователь;
    - **повторы** — ретрай не создаёт второй платёж или заказ;
    - **колбэки и вебхуки** — дубль, опоздание, отсутствие; подпись проверяется;
    - **лимиты партнёра**, **часовые пояса и форматы дат**, **кодировки**;
    - ограничения **песочницы** провайдера.

    Главное: счастливый путь — меньшая часть проверок интеграции.

- id: ams-06
  type: quiz
  question: Что такое stub — заглушка?
  options:
    - "Настоящий сервис, развёрнутый на тестовом стенде"
    - "Запись в логе, которая заменяет ответ сервиса"
    - "Тест, который проверяет, сколько раз вызвали сервис"
    - "Подмена сервиса, которая отдаёт заранее заготовленный ответ"
  correct: 3
  explanation: |
    **Stub** отдаёт заготовленный ответ и ничего не проверяет: «на любой
    запрос в банк — `200` и `approved`». Его используют, когда настоящий
    сервис не готов, нестабилен или стоит денег за вызов.

    Тест, который проверяет, **как** вызвали сервис — сколько раз,
    с какими данными, — работает с **mock**.

    Через заглушку удобно получить то, чего настоящий сервис по заказу
    не даст: таймаут, `500`, мусор в ответе.

- id: ams-07
  type: quiz
  question: Зачем нужен заголовок `X-Request-ID`?
  options:
    - "Он шифрует запрос между клиентом и сервером"
    - "По его значению можно найти все строки логов, связанные с этим запросом"
    - "Он заменяет токен авторизации"
    - "Он задаёт версию API, которую хочет клиент"
  correct: 1
  explanation: |
    `X-Request-ID` — уникальный номер запроса. Сервер записывает его
    в каждую строку лога по этому запросу — в поле вроде `correlationId` —
    и возвращает в ответе.

    Ты прикладываешь его к баг-репорту — разработчик находит нужные
    строки среди тысяч за секунды. В микросервисах тот же id передаётся
    от сервиса к сервису, и по нему виден весь путь запроса.

- id: ams-08
  type: quiz
  question: "В `docker-compose.yml` шесть сервисов: база, кэш, интерфейс к кэшу, хранилище логов, поиск по логам и приложение. Это микросервисная система?"
  options:
    - "Да: больше трёх контейнеров в одном файле — это всегда микросервисы"
    - "Да: у каждого контейнера свой порт, значит, это независимые сервисы"
    - "Нет: бизнес-логика в одном приложении, остальное — инфраструктура"
    - "Нельзя сказать, пока не узнаешь, сколько серверов стоит в продакшене"
  correct: 2
  explanation: |
    Это ловушка. Число контейнеров про архитектуру не говорит.

    Критерий — **где живёт бизнес-логика**. Здесь все правила в одном
    приложении, а база, кэш и логи — инфраструктура: они обслуживают
    приложение, но не знают ни одного бизнес-правила. Это монолит
    с инфраструктурными зависимостями.

    Микросервисы — когда бизнес-логика разделена между несколькими
    сервисами из своего кода, у каждого своя зона ответственности.

- id: ams-09
  type: card
  question: Чем stub отличается от mock?
  answer: |
    **Stub** — отдаёт заготовленный ответ. Тест проверяет поведение
    **нашего** сервиса: «банк ответил отказом — что увидел пользователь».

    **Mock** — тоже отдаёт ответ, но ещё **запоминает вызовы**. Тест
    потом проверяет, **как** наш сервис обратился к зависимости:
    «банк вызвали ровно один раз, с суммой 1500 и ключом
    идемпотентности».

    Коротко: stub — проверяем результат, mock — проверяем взаимодействие.
    На практике слова часто путают, и многие инструменты — WireMock,
    Mockoon — умеют и то и другое. На собеседовании важно показать,
    что ты понимаешь разницу в цели.

- id: ams-10
  type: quiz
  question: Что проверяет контрактный тест между двумя сервисами?
  options:
    - "Что оба сервиса подписали договор об уровне обслуживания"
    - "Что поставщик отвечает в том формате, которого ждёт потребитель: поля, типы, коды"
    - "Что весь сценарий пользователя проходит от начала до конца"
    - "Что сервис выдерживает нагрузку, оговорённую в договоре"
  correct: 1
  explanation: |
    **Контракт** — договорённость потребителя и поставщика о формате
    запросов и ответов. Потребитель записывает ожидания, поставщик
    в своём пайплайне проверяет, что его ответы им соответствуют.

    Польза: поставщик переименовал поле — его тесты падают **до**
    релиза, а не у потребителя в проде. Известный инструмент — Pact.

    Сквозной сценарий — это end-to-end, нагрузка — нагрузочное
    тестирование.

- id: ams-11
  type: quiz
  question: "Ты создал товар в каталоге. В поиске его нет 20 секунд, потом он появляется. Это баг?"
  options:
    - "Да, всегда: в любой системе данные должны появляться мгновенно"
    - "Нет, никогда: в распределённых системах задержка — это норма"
    - "Да, если поиск в целом работает: значит, у него сломан кэш"
    - "Зависит от требования; если оно не описано — вопрос аналитику"
  correct: 3
  explanation: |
    Это **eventual consistency** — данные в разных сервисах сходятся
    не сразу, но со временем. Каталог сохранил товар и отправил событие,
    поиск его обработал позже.

    Баг или норма — решает **требование**. Если ожидание не описано,
    его не придумывают, а спрашивают. А вот «не появился никогда» — баг
    всегда.

    Тестировать — ожиданием условия с таймаутом, а не `sleep`, и записывать,
    через сколько данные появились.

- id: ams-12
  type: quiz
  question: Брокер гарантирует доставку «хотя бы один раз». Что из этого следует для сервиса-потребителя?
  options:
    - "Потребитель должен быть идемпотентным: повторное сообщение не должно создавать второй результат"
    - "Ничего: «хотя бы один раз» значит «ровно один раз»"
    - "Потребитель должен удалять очередь после каждого сообщения"
    - "Сообщения могут теряться, поэтому потребитель должен запрашивать их повторно"
  correct: 0
  explanation: |
    «Хотя бы один раз» — сообщение не потеряется, но при сбое его могут
    доставить **ещё раз**. Одно событие «заказ оплачен» может прийти
    дважды.

    Значит, потребитель должен обработать повтор без вреда: не назначать
    второго курьера, не слать второе письмо. Обычно он запоминает
    идентификаторы обработанных сообщений.

    Что проверить: отправить одно и то же событие дважды и убедиться,
    что результат один.

- id: ams-13
  type: quiz
  question: "Клиент нажал «Оплатить», через 10 секунд получил `504`, нажал ещё раз — деньги списаны дважды. Что наиболее вероятно?"
  options:
    - "Банк ошибся и провёл платёж дважды"
    - "Первая оплата завершилась уже после `504`, а повторный запрос не защищён от дубля"
    - "`504` означает, что первая оплата точно не прошла, значит, виноват клиент"
    - "Сломан gateway: он сам отправил платёж в банк дважды"
  correct: 1
  explanation: |
    `504` значит только, что gateway **не дождался** ответа. Работа
    за ним могла завершиться: оплата прошла, но позже, чем истёк
    таймаут.

    Повторное нажатие сервер принял как **новую** оплату: нет ключа
    идемпотентности или проверки «по этому заказу уже есть оплата».

    Два бага: таймаут gateway короче, чем время оплаты, и
    неидемпотентный повтор. «Клиент сам нажал два раза» — не ответ:
    система должна это выдерживать.

- id: ams-14
  type: card
  question: Что такое circuit breaker и что в нём проверять?
  answer: |
    **Circuit breaker** — «автомат в электрощитке» для вызовов другого
    сервиса.

    - Зависимость отвечает ошибками раз за разом — автомат «выбивает».
    - Какое-то время запросы к ней **не отправляются**: сервис сразу
      отвечает запасным вариантом, а не ждёт таймаут.
    - Потом автомат пробует пропустить один запрос. Зависимость ожила —
      работа возвращается в норму.

    Зачем: не тратить время и ресурсы на заведомо упавший сервис и
    не добивать его потоком запросов.

    Что проверить: что видит пользователь, пока автомат выключен;
    есть ли запасной вариант; возвращается ли система в норму сама,
    когда зависимость поднялась.

- id: ams-15
  type: quiz
  question: "Запрос пришёл с `X-Request-ID`. В логах gateway и сервиса заказов id есть, а в логах сервиса уведомлений, который получает события из очереди, — прочерк. Где, скорее всего, проблема?"
  options:
    - "В сервисе уведомлений: он не умеет писать логи"
    - "В клиенте: он прислал неправильный id"
    - "На границе очереди: сервис заказов не положил id в заголовок сообщения"
    - "Проблемы нет: в асинхронных сервисах id не нужен"
  correct: 2
  explanation: |
    Correlation-id нужно не только записать, но и **передать дальше**.
    Для HTTP — в заголовке следующего запроса, для очереди — в заголовке
    сообщения. Чаще всего id теряется именно на очереди: отправитель
    публикует событие без него.

    Потерянный id — тоже баг. Без него не связать письмо с заказом,
    и каждая проблема разбирается поиском по времени.

    В баг-репорт — запрос со своим id и строки логов обоих сервисов.

- id: ams-16
  type: quiz
  question: "Новый платёжный шлюз: в песочнице банка 50 тестовых оплат прошли успешно. Чего, скорее всего, не хватает для уверенности?"
  options:
    - "Ничего: 50 успешных оплат подряд — уже достаточная проверка"
    - "Ещё 500 таких же успешных оплат в той же песочнице"
    - "Прогона тех же оплат на проде настоящими картами сотрудников компании"
    - "Проверки отказов, 3-D Secure и сценариев без колбэка"
  correct: 3
  explanation: |
    Песочница часто отвечает «успех» почти на всё, упрощает или
    выключает 3-D Secure. Она показывает, что интеграция подключена,
    но не что она переживёт реальность.

    Нужно взять у провайдера **тестовые карты для разных исходов**:
    отказ, недостаток средств, 3-D Secure. И проверить сценарии, когда
    колбэк не пришёл: пользователь закрыл страницу банка, пропала связь.

    Больше одинаковых успешных оплат ничего нового не покажут.

- id: ams-17
  type: card
  question: "Баг на стейдже есть, у разработчика локально — «не воспроизводится». Причём тут микросервисы?"
  answer: |
    В микросервисах у стенда **нет одной версии**. Каждая команда
    выкатывает свой сервис, когда готова. На стейдже может быть сервис
    заказов новой версии и сервис цен — старой, а у разработчика
    локально оба новые.

    Что делать:

    - в баг-репорте указывать **версии всех сервисов** из сценария;
    - воспроизводить на одном стенде с тем же набором версий;
    - проверять **совместимость**: новая версия одного сервиса должна
      работать со старой версией соседа — они не выкатываются
      одновременно;
    - предлагать контрактные тесты между сервисами.

    «Не воспроизводится» — не повод закрыть баг, пока окружения
    не одинаковые.

- id: ams-18
  type: quiz
  question: Как правильно проверить результат асинхронной обработки — например, что курьер назначен после оплаты?
  options:
    - "Проверять условие раз в секунду, но не дольше заданного таймаута, и записать, через сколько оно выполнилось"
    - "Подождать `sleep 10` и проверить один раз"
    - "Проверить сразу после ответа об оплате: если курьера нет — это баг"
    - "Не проверять: если оплата прошла, курьер назначится"
  correct: 0
  explanation: |
    Фиксированная пауза плоха с обеих сторон. Обработка заняла
    11 секунд — `sleep 10` даст ложный баг. Заняла 1 секунду — ты
    потерял 9, и так в каждом тесте.

    Правильно — **ждать условия**: проверять регулярно, пока результат
    не появится, но не дольше таймаута из требования. Не появился
    за таймаут — находка. Появился — запиши время: это тоже информация.

    Проверять сразу — ложные баги. Не проверять — пропущенные.

- id: ams-19
  type: quiz
  question: "В TaskFlow (ветка `training-public`) недоступен Elasticsearch. Что по коду происходит с запросами к API?"
  options:
    - "API перестаёт отвечать, пока Elasticsearch не поднимется"
    - "Каждый запрос отвечает `503`, потому что логи нельзя записать"
    - "API отвечает как обычно; логи за это время не попадают в Kibana, но видны в `docker compose logs`"
    - "API отвечает, но каждый ответ задерживается на таймаут подключения к Elasticsearch"
  correct: 2
  explanation: |
    В TaskFlow логи уходят в Elasticsearch **в фоне**: запись кладётся
    в очередь в памяти, отдельный поток отправляет её пачками. Ответ
    клиенту этого не ждёт.

    Если Elasticsearch недоступен, отправка падает, в стандартный вывод
    пишется предупреждение «логи потеряны», а запрос обрабатывается
    как обычно. Логи в стандартном выводе — то, что показывает
    `docker compose logs`, — остаются.

    Это пример того, что инфраструктурная зависимость не должна ронять
    бизнес-логику. И ловушка мониторинга: `/health` при этом зелёный.

- id: ams-20
  type: card
  question: "Хитрый вопрос: «REST API — значит, система синхронная?»"
  answer: |
    Простое «да» — неполный ответ. Тут два вопроса.

    **Сам HTTP-вызов** — синхронный всегда: клиент отправил запрос
    и ждёт ответ.

    **То, что запрос запустил**, — не обязательно. Сервер может сохранить
    заказ, сразу ответить `201`, а письмо и назначение курьера отправить
    через очередь. Они закончатся позже.

    Для тестирования это главное. При синхронной обработке ответ —
    доказательство результата. При асинхронной — только «принято».
    Результат проверяется отдельно, ожиданием с таймаутом, и нужно
    отличать «ещё не произошло» от «не произойдёт никогда».
