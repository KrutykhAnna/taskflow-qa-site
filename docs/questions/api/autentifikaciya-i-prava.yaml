# Вопросы темы «Аутентификация и права». Формат — см. osnovy/bag-report.yaml.

- id: auth-01
  type: card
  question: Чем идентификация, аутентификация и авторизация отличаются друг от друга?
  answer: |
    Это три шага с тремя разными вопросами:

    - **Идентификация** — «кто ты?». Пользователь называет себя:
      вводит логин, email или телефон.
    - **Аутентификация** — «докажи». Система проверяет доказательство:
      пароль, код из SMS, отпечаток, подпись токена.
    - **Авторизация** — «что тебе можно?». Система решает, разрешено
      ли действие этому пользователю.

    Порядок всегда такой: сначала узнать и проверить, потом решать
    про права. В API отказ аутентификации — `401`, отказ авторизации —
    `403`.

    Ловушка: заголовок `Authorization` и код `401 Unauthorized` на
    самом деле про аутентификацию — так сложилось в HTTP.

- id: auth-02
  type: quiz
  question: Пользователь вошёл в систему, но не может удалить проект — у его роли нет такого права. Какая проверка его остановила?
  options:
    - "Идентификация"
    - "Аутентификация"
    - "Авторизация"
    - "Шифрование"
  correct: 2
  explanation: |
    Кто он — система уже знает и в этом уверена: он вошёл.
    Идентификация и аутентификация пройдены. Остановила **авторизация** —
    проверка того, что ему можно.

    Код ответа в такой ситуации — обычно `403`.

- id: auth-03
  type: quiz
  question: Запрос пришёл с действующим токеном, пользователь активен, но его роли не хватает на действие. Какой код ожидаем?
  options:
    - "401 Unauthorized"
    - "403 Forbidden"
    - "400 Bad Request"
    - "500 Internal Server Error"
  correct: 1
  explanation: |
    `403` — сервер знает, кто ты, но тебе нельзя. Повторный вход не
    поможет: роль останется той же.

    `401` — когда сервер не знает, кто ты: токена нет, он испорчен или
    просрочен. Поможет вход.

    Путать их опасно: клиент на `401` обычно разлогинивает пользователя.

- id: auth-04
  type: card
  question: Что такое сессия и что такое токен? Чем они отличаются?
  answer: |
    HTTP не помнит клиента между запросами. Поэтому после входа сервер
    выдаёт «пропуск», и клиент прикладывает его к каждому запросу.

    - **Сессия** — запись на сервере: «сессия `a8f3…` — это Анна».
      Клиенту отдаётся только номер, обычно в cookie. Сервер на каждый
      запрос ищет номер в своём хранилище.
    - **Токен** — пропуск, в котором всё записано внутри, например JWT.
      Сервер ничего не хранит, а проверяет подпись токена своим ключом.

    Главное отличие — где хранится состояние. Отсюда разница в отзыве:
    сессию достаточно удалить на сервере, а токен действует до своего
    срока, если не завести чёрный список.

- id: auth-05
  type: card
  question: Что такое cookie и что тестировщик в них проверяет?
  answer: |
    **Cookie** — небольшая запись, которую сервер просит браузер
    сохранить через заголовок `Set-Cookie`. Браузер сам присылает её
    обратно в каждом запросе на этот сайт. Часто в cookie хранят номер
    сессии.

    Что проверить в DevTools → Application → Cookies:

    - у cookie сессии есть `HttpOnly` — JavaScript её не прочитает;
    - есть `Secure` — отправляется только по HTTPS;
    - `SameSite` — `Lax` или `Strict`, а не `None` без причины;
    - срок жизни — `Expires` или `Max-Age` — разумный и по требованиям;
    - после выхода cookie удалена, а сессия не работает и на сервере.

- id: auth-06
  type: quiz
  question: Какой вариант — настоящая двухфакторная аутентификация?
  options:
    - "Пароль и ответ на секретный вопрос"
    - "Пароль и PIN-код"
    - "Два разных пароля подряд"
    - "Пароль и код из приложения-аутентификатора на телефоне"
  correct: 3
  explanation: |
    Фактор — это тип доказательства: **знаю** (пароль, PIN), **имею**
    (телефон, ключ), **являюсь** (отпечаток, лицо).

    2FA — два **разных** фактора. Пароль плюс код с телефона — это
    «знаю» и «имею».

    Пароль, секретный вопрос и PIN — всё «знаю». Тот, кто узнал одно,
    может узнать и другое. Это не 2FA, хотя шагов два.

- id: auth-07
  type: quiz
  question: Что означает RBAC?
  options:
    - "Права выдаются ролям, а пользователю назначается роль"
    - "Права выдаются каждому пользователю отдельно вручную"
    - "Доступ получает тот, кто первым вошёл в систему"
    - "Доступ определяется по IP-адресу пользователя"
  correct: 0
  explanation: |
    RBAC — Role-Based Access Control, управление доступом на основе
    ролей. Права описывают для ролей: «администратор», «менеджер»,
    «наблюдатель». Человек получает роль — и весь её набор прав.

    Роли бывают глобальными — на всю систему — и в рамках объекта:
    в одном проекте ты владелец, в другом — наблюдатель.

- id: auth-08
  type: quiz
  question: Хитрый вопрос — данные в payload обычного JWT зашифрованы?
  options:
    - "Да, их может прочитать только сервер"
    - "Да, их расшифровывает браузер с помощью cookie"
    - "Нет, они закодированы в Base64URL и подписаны — прочитать может любой"
    - "Нет, payload передаётся отдельно от токена"
  correct: 2
  explanation: |
    Обычный JWT **подписан**, а не зашифрован. Header и payload — это
    JSON в Base64URL, раскодировать его может кто угодно.

    Подпись защищает от **изменения**: поменяй символ — подпись не
    сойдётся, и сервер отклонит токен. Но от **чтения** она не защищает.

    Вывод: в payload нельзя класть секреты — пароль, номер карты,
    паспорт. А боевые токены нельзя вставлять на сторонние сайты.

- id: auth-09
  type: card
  question: Из каких частей состоит JWT и что в каждой?
  answer: |
    Три части через точку: `header.payload.signature`.

    - **Header** — тип токена и алгоритм подписи, например
      `{"alg":"HS256","typ":"JWT"}`.
    - **Payload** — claims, утверждения о пользователе и токене:
      `sub` — кому выдан, `exp` — когда истекает, `iat` — когда выдан,
      `jti` — уникальный номер токена.
    - **Signature** — подпись первых двух частей секретным ключом
      сервера.

    Первые две части — JSON в Base64URL, их можно прочитать. Подпись
    гарантирует, что их никто не изменил.

    Передаётся токен обычно в заголовке `Authorization: Bearer <токен>`.

- id: auth-10
  type: quiz
  question: Зачем в JWT claim jti?
  options:
    - "В нём хранится роль пользователя"
    - "Это уникальный номер токена — по нему можно отозвать конкретный токен"
    - "Это время, когда токен истекает"
    - "Это секретный ключ для проверки подписи"
  correct: 1
  explanation: |
    `jti` — JWT ID, уникальный номер токена. Он разный у каждого входа.

    Его используют для отзыва: при выходе сервер кладёт `jti` в чёрный
    список и на каждый запрос проверяет, нет ли номера в списке.

    Время истечения — `exp`, в секундах Unix time. Роль, если её
    кладут в токен, — это отдельное, нестандартное поле. Секретный ключ
    в токен не кладут никогда.

- id: auth-11
  type: card
  question: Что такое access и refresh токены? Что в них тестировать?
  answer: |
    - **Access token** — короткоживущий, от минут до часа. Отправляется
      в каждый запрос к API.
    - **Refresh token** — долгоживущий, дни и недели. Отправляется
      только на адрес обновления, чтобы получить новый access.

    Так совмещают безопасность и удобство: украденный access скоро
    истечёт, а пользователю не нужно постоянно вводить пароль.

    Что тестировать:

    - истечение access — `401`, клиент обновляет и повторяет запрос;
    - старый refresh после обновления не работает, если есть ротация;
    - повторное использование refresh — отказ;
    - истёкший refresh — аккуратный выход на страницу входа;
    - несколько параллельных запросов при истечении — токен обновляется
      один раз, пользователя не выкидывает.

- id: auth-12
  type: quiz
  question: Хитрый вопрос — пользователь вышел, но его JWT действует ещё 7 часов. Как сделать, чтобы токен перестал работать сразу?
  options:
    - "Удалить токен из базы данных пользователей"
    - "Сменить пользователю пароль"
    - "Попросить браузер удалить токен из localStorage"
    - "Записать jti токена в чёрный список до момента exp и проверять список на каждый запрос"
  correct: 3
  explanation: |
    JWT самодостаточен: сервер его не хранит, а проверяет подпись и `exp`.
    «Удалить из базы» нечего.

    Удаление в браузере не поможет, если токен успели скопировать.
    Смена пароля сама по себе токен не отзывает — только если сервер так
    устроен.

    Рабочие способы: чёрный список по `jti`, короткий access-токен плюс
    отзываемый refresh, версия токенов у пользователя.

- id: auth-13
  type: quiz
  question: Роль пользователя записана в payload JWT, а сервер берёт её оттуда. Менеджера понизили до наблюдателя. Что будет со старым токеном?
  options:
    - "Он даёт права менеджера, пока не истечёт"
    - "Он сразу даёт права наблюдателя"
    - "Он сразу перестаёт работать"
    - "Сервер сам перевыпустит токен с новой ролью"
  correct: 0
  explanation: |
    Сервер верит тому, что подписано в токене. Там записан «менеджер» —
    значит, до `exp` у человека права менеджера, даже если в интерфейсе
    кнопки уже скрылись.

    Защита: читать роль и статус из базы на каждый запрос, отзывать
    токены при смене роли или сокращать срок жизни.

    Как проверить: сохранить токен, понизить роль, повторить запрещённое
    теперь действие со старым токеном через API.

- id: auth-14
  type: quiz
  question: Что делает атрибут cookie HttpOnly?
  options:
    - "Отправляет cookie только по HTTPS"
    - "Запрещает отправлять cookie с чужих сайтов"
    - "Запрещает JavaScript на странице читать cookie"
    - "Удаляет cookie при закрытии браузера"
  correct: 2
  explanation: |
    `HttpOnly` — cookie видна только браузеру и серверу, но не скриптам.
    `document.cookie` её не покажет. Если на сайте найдётся XSS, чужой
    скрипт не украдёт сессию.

    Только HTTPS — это `Secure`. Чужие сайты — `SameSite`. Удаление при
    закрытии браузера — поведение cookie без `Expires` и `Max-Age`.

- id: auth-15
  type: quiz
  question: От какой атаки в первую очередь защищает атрибут cookie SameSite?
  options:
    - "От перебора паролей"
    - "От CSRF — подделки запроса с чужого сайта"
    - "От перехвата трафика в открытом Wi-Fi"
    - "От SQL-инъекций"
  correct: 1
  explanation: |
    Браузер сам прикладывает cookie к запросам на сайт — даже если
    запрос запустила чужая страница. На этом построен CSRF.

    `SameSite` решает, отправлять ли cookie при запросе с чужого сайта:
    `Strict` — никогда, `Lax` — только при переходе по ссылке, `None` —
    всегда, и тогда обязателен `Secure`.

    Перехват трафика — забота `Secure` и HTTPS. Перебор — rate limit.
    SQL-инъекции — проверка ввода на сервере.

- id: auth-16
  type: card
  question: Хитрый вопрос — где безопаснее хранить токен на клиенте, в localStorage или в cookie?
  answer: |
    Универсально безопасного варианта нет — у каждого свой риск.

    - **localStorage** — любой JavaScript на странице может прочитать
      токен. Одна XSS-уязвимость — и токен украден.
    - **Cookie с `HttpOnly`** — скрипт не прочитает. Но браузер
      отправляет cookie сам, поэтому нужна защита от CSRF: `SameSite`
      и CSRF-токены.

    Часто выбирают cookie с `HttpOnly`, `Secure` и `SameSite`: защиту
    от CSRF настроить проще, чем гарантировать отсутствие XSS.

    Как тестировщик я смотрю в DevTools → Application, где лежит
    токен, проверяю атрибуты cookie и задаю вопрос команде, если выбран
    рискованный вариант.

- id: auth-17
  type: quiz
  question: Хитрый вопрос — «Войти через Google». Какой протокол отвечает за то, чтобы сайт узнал, кто именно вошёл?
  options:
    - "OAuth 2.0 — он сообщает имя и email пользователя"
    - "Basic Auth — Google передаёт сайту логин и пароль"
    - "SAML — это единственный протокол для входа через Google"
    - "OpenID Connect — надстройка над OAuth 2.0, выдаёт ID token"
  correct: 3
  explanation: |
    **OAuth 2.0** — про доступ: приложение получает access token, чтобы
    действовать от твоего имени, например читать календарь. Кто ты, он
    сам по себе не сообщает.

    **OpenID Connect** добавляет к нему аутентификацию: сайт получает
    ID token — подтверждение, кто вошёл.

    Пароль от Google сайт не видит вообще: ты вводишь его только на
    странице Google.

- id: auth-18
  type: quiz
  question: Покупатель поменял в адресе /orders/1001 на /orders/1002 и увидел чужой заказ. Какой это доступ?
  options:
    - "Горизонтальный — к чужому объекту того же уровня"
    - "Вертикальный — к функции выше своей роли"
    - "Это не проблема прав, а ошибка маршрутизации"
    - "Это нормальное поведение: заказы публичные"
  correct: 0
  explanation: |
    **Горизонтальный** доступ — к чужим объектам при той же роли:
    покупатель видит заказ другого покупателя.

    **Вертикальный** — к функциям выше роли: обычный пользователь
    вызывает админский запрос.

    Сервер должен проверять не только роль, но и то, чей объект. Такую
    уязвимость называют IDOR.

- id: auth-19
  type: quiz
  question: Хитрый вопрос — форма входа пишет «Пользователь с таким email не найден» или «Неверный пароль». В чём проблема?
  options:
    - "Проблемы нет — так удобнее пользователю"
    - "Сообщения слишком длинные"
    - "По разным сообщениям можно узнать, какие email зарегистрированы"
    - "Неверный пароль должен давать 500"
  correct: 2
  explanation: |
    Это **перечисление пользователей**. Перебирая email, злоумышленник
    узнаёт, кто клиент сервиса. Такой список используют для фишинга
    и подбора паролей.

    Правильно — одинаковый ответ на оба случая: «Неверный email или
    пароль», с тем же кодом и примерно тем же временем ответа.

    Ту же утечку проверяют в восстановлении пароля и регистрации.

- id: auth-20
  type: card
  question: Хитрый вопрос — у наблюдателя в интерфейсе нет кнопки удаления. Можно считать, что права проверены?
  answer: |
    Нет. Скрытая кнопка — удобство интерфейса, а не защита. Запрос можно
    отправить напрямую: через `curl`, Postman, Swagger, консоль браузера,
    старую закладку или старую версию приложения.

    Защищает только проверка прав на сервере. Поэтому проверяю два
    уровня:

    - интерфейс — кнопки нет;
    - сервер — беру токен наблюдателя и отправляю `DELETE` напрямую.
      Жду `403`, потом `GET` — объект на месте.

    И отдельно — тот же запрос от не участника и под каждой ролью из
    матрицы прав.
