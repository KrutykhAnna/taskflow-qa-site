# Вопросы темы «HTTP: запрос и ответ». Формат — см. osnovy/bag-report.yaml.

- id: http-01
  type: card
  question: Из чего состоит HTTP-запрос?
  answer: |
    Из четырёх частей, всегда в таком порядке:

    1. **Стартовая строка** — метод, путь с query-параметрами и версия
       протокола: `POST /api/v1/projects HTTP/1.1`.
    2. **Заголовки** — пары «имя: значение», по одной на строку:
       `Host`, `Content-Type`, `Authorization`, `Accept` и другие.
    3. **Пустая строка** — граница: заголовки закончились.
    4. **Тело** — данные, например JSON нового объекта. Есть не у всех
       запросов: у `GET` его обычно нет.

    Хост в стартовую строку не входит — он едет в заголовке `Host`.
    В DevTools всё это видно у запроса на вкладках Headers и Payload.

- id: http-02
  type: card
  question: Из чего состоит HTTP-ответ? Какие заголовки ответа ты знаешь?
  answer: |
    Ответ устроен как запрос, только первая строка — **статус-строка**:
    версия, код и фраза, например `HTTP/1.1 201 Created`. Дальше —
    заголовки, пустая строка и тело.

    Заголовки ответа, которые стоит знать:

    - `Content-Type` — формат тела и кодировка;
    - `Content-Length` — длина тела в байтах;
    - `Set-Cookie` — сохранить cookie в браузере;
    - `Cache-Control`, `ETag` — правила кэша и версия ответа;
    - `Location` — адрес созданного объекта у `201` или новый адрес
      у перенаправления;
    - `Content-Encoding` — чем сжато тело;
    - `Access-Control-Allow-Origin` — разрешение CORS;
    - `X-Request-ID` или похожий — номер запроса для поиска в логах.

- id: http-03
  type: card
  question: Что значит «HTTP не хранит состояние»? Как тогда сайт помнит, что ты вошёл?
  answer: |
    **Stateless** — каждый запрос независим. Сервер не помнит, что этот
    клиент уже что-то спрашивал секунду назад.

    Чтобы сайт «помнил» пользователя, клиент сам напоминает о себе
    в **каждом** запросе: браузер прикладывает **cookie** в заголовке
    `Cookie`, или приложение прикладывает **токен** в заголовке
    `Authorization`. Сервер по ним понимает, кто пришёл.

    Следствие для тестировщика: если запрос «потерял» cookie или токен,
    сервер видит незнакомца. Баги вида «разлогинило после перезагрузки»
    ищут в том, какие заголовки ушли с запросом.

- id: http-04
  type: card
  question: Зачем тестировщику вкладка Network, если интерфейс работает?
  answer: |
    Интерфейс показывает то, что нарисовал фронтенд. Network показывает
    **факт**: что реально ушло на сервер и что вернулось.

    - **Найти, чей баг.** Запрос не ушёл или ушёл неправильным — клиент.
      Ушёл правильным, а ответ неверный — сервер.
    - **Увидеть скрытое.** Ошибки, которые интерфейс не показал; лишние
      данные в ответе; заголовки кэша, CORS, кодировки.
    - **Заметить медленное.** Сортировка по Time, вкладка Timing,
      Waterfall.
    - **Оформить баг.** Copy as cURL — точный запрос для разработчика,
      `X-Request-ID` — для поиска в логах.

- id: http-05
  type: card
  question: Что такое CORS и почему в Postman его нет?
  answer: |
    **CORS** — правила, по которым браузер разрешает странице с одного
    источника читать ответы другого. Источник — схема + хост + порт.
    Без разрешения сайт A не может прочитать ответ сайта B. Разрешение
    даёт сервер B заголовком `Access-Control-Allow-Origin`.

    Это защита **пользователя в браузере**: чтобы чужой сайт не прочитал
    его данные, пользуясь его cookie. Поэтому проверяет CORS только
    браузер. Postman, `curl`, мобильные приложения и серверы его не
    проверяют.

    Отсюда классика «в Postman работает, в браузере нет»: запрос
    правильный, но сервер не разрешил чтение с адреса фронтенда.
    Для «непростых» запросов браузер сначала отправляет предварительный
    `OPTIONS` — ошибка может быть на нём.

- id: http-06
  type: card
  question: Как по вкладке Timing понять, где тормозит запрос?
  answer: |
    Смотрю, какая фаза самая длинная:

    - **DNS Lookup, Initial connection, SSL** — сеть и соединение:
      DNS, маршрут, TLS. Это к DevOps. Есть только у первого запроса
      к серверу, дальше соединение переиспользуется;
    - **Waiting for server response (TTFB)** — время до первого байта
      ответа: сервер думает — код, база, другие сервисы. Это бэкенд;
    - **Content Download** — большой ответ или медленная сеть. Смотрю
      Size: если ответ огромный — нужна пагинация или сжатие;
    - **Queueing, Stalled** — браузер ждёт в очереди: страница шлёт
      слишком много запросов. Это фронтенд.

    Замеряю несколько раз и указываю условия: сеть, кэш, устройство.

- id: http-07
  type: quiz
  question: Что такое заголовок HTTP?
  options:
    - "Первая строка запроса с методом и путём"
    - "Служебная пара «имя: значение», которая описывает запрос или ответ"
    - "Название страницы, которое видно во вкладке браузера"
    - "Часть тела запроса с главными данными"
  correct: 1
  explanation: |
    Заголовки — служебные пометки «на конверте»: формат тела, длина,
    токен, язык, правила кэша. Они идут после первой строки, по одному
    на строку, до пустой строки.

    Первая строка — это стартовая строка или статус-строка, а не
    заголовок. Название вкладки — тег `title` в HTML, к HTTP-заголовкам
    отношения не имеет. Данные лежат в теле.

- id: http-08
  type: quiz
  question: Клиент отправляет запрос с заголовком `Content-Type` равным `application/json`. Что этот заголовок сообщает серверу?
  options:
    - "Клиент хочет получить ответ в JSON"
    - "Ответ нужно сжать"
    - "Запрос можно кэшировать"
    - "Тело запроса — в формате JSON"
  correct: 3
  explanation: |
    `Content-Type` в запросе описывает формат **тела этого запроса**.
    Сервер по нему решает, как разбирать данные.

    Какой формат ответа хочет клиент, сообщает другой заголовок —
    `Accept`. О сжатии договариваются через `Accept-Encoding`,
    кэш описывают заголовки `Cache-Control`.

- id: http-09
  type: quiz
  question: Что такое cookie?
  options:
    - "Маленькая запись, которую сервер просит браузер сохранить и присылать обратно с каждым запросом"
    - "Файл со всеми запросами из вкладки Network"
    - "Копия страницы, которую браузер хранит, чтобы не скачивать заново"
    - "Код ответа, который сообщает об успешном входе"
  correct: 0
  explanation: |
    Сервер присылает заголовок `Set-Cookie`, браузер сохраняет запись
    и сам добавляет её в заголовок `Cookie` каждого следующего запроса
    к этому сайту. Так HTTP, который не хранит состояние, получает
    память — например, о том, что пользователь вошёл.

    Файл со всеми запросами — это HAR. Копия страницы — кэш.
    Увидеть cookie можно в Network на вкладке Cookies у запроса
    или в Application → Cookies.

- id: http-10
  type: quiz
  question: Куда правильнее положить токен доступа?
  options:
    - "В query-параметр: так его проще увидеть в адресе"
    - "Во фрагмент адреса после символа #"
    - "В заголовок `Authorization`"
    - "В имя пути, например `/api/token123/projects`"
  correct: 2
  explanation: |
    Токен — секрет, его передают в заголовке `Authorization`
    (иногда — в cookie или в теле).

    Адрес с токеном оседает в истории браузера, в логах серверов,
    может уйти на чужой сайт в `Referer` и легко пересылается вместе
    со ссылкой. В query кладут фильтры, сортировку, номер страницы.
    Фрагмент после `#` на сервер вообще не уходит.

- id: http-11
  type: quiz
  question: Браузер отправил запрос с заголовком `If-None-Match`, а сервер ответил `304 Not Modified`. Что произошло?
  options:
    - "Ресурс удалён, и браузер должен показать ошибку"
    - "Ресурс не изменился, браузер использует свою копию из кэша"
    - "Сервер не смог обработать запрос и просит повторить позже"
    - "Ресурс переехал на новый адрес"
  correct: 1
  explanation: |
    В `If-None-Match` браузер передаёт `ETag` — метку версии своей
    копии. Если на сервере версия та же, сервер отвечает `304` без
    тела, и браузер берёт копию из кэша. Если изменилась — `200`
    с новым телом и новым `ETag`.

    Переезд на новый адрес — это другие коды `3xx` с заголовком
    `Location`. Баг, связанный с `304`: данные изменились, а `ETag`
    нет — и пользователь видит старое.

- id: http-12
  type: quiz
  question: "В Timing запроса к API: Waiting for server response — 3 с, Content Download — 15 мс. Где искать причину?"
  options:
    - "На сервере: он долго готовит ответ"
    - "В размере ответа: он слишком большой"
    - "В DNS: долго ищется адрес сервера"
    - "В браузере: запрос долго стоял в очереди"
  correct: 0
  explanation: |
    Waiting for server response — это TTFB, время до первого байта
    ответа. Если оно большое, а загрузка тела мгновенная, — сервер
    долго думает: медленный запрос к базе, обращения к другим
    сервисам. Это бэкенду.

    Большой ответ дал бы долгий Content Download. Проблемы DNS видны
    в фазе DNS Lookup, очередь браузера — в Queueing и Stalled.

- id: http-13
  type: quiz
  question: Чем опасно пересылать HAR-файл как есть?
  options:
    - "Он слишком большой и не откроется у получателя"
    - "Получатель увидит только адреса, но не заголовки"
    - "В нём не сохраняется время запросов"
    - "В нём могут быть токены, cookie, пароли и личные данные — по ним можно войти под тобой"
  correct: 3
  explanation: |
    HAR — слепок сессии: адреса, заголовки, тела запросов и ответов.
    Там лежат токены и cookie, пароль из запроса входа, личные данные
    из ответов. Пока токен действует, по нему можно войти под тобой.

    Новые версии Chrome при экспорте вырезают cookie и `Authorization`,
    но токен может остаться в адресе или теле. Перед отправкой HAR
    проверяют поиском и чистят, а если HAR с боевым токеном уже ушёл —
    токен отзывают.

- id: http-14
  type: quiz
  question: Зачем в Network включают Preserve log?
  options:
    - "Чтобы сохранить запросы в HAR-файл"
    - "Чтобы браузер не брал ответы из кэша"
    - "Чтобы список запросов не очищался при переходе на другую страницу"
    - "Чтобы записывать запросы, даже когда DevTools закрыты"
  correct: 2
  explanation: |
    Без Preserve log при переходе на другую страницу — после отправки
    формы, перенаправления, входа — список очищается, и запросы,
    которые были до перехода, пропадают. А баг часто именно там.

    Не брать ответы из кэша — это Disable cache. В HAR сохраняет
    Export HAR. Когда DevTools закрыты, Network ничего не записывает
    ни с какими настройками.

- id: http-15
  type: quiz
  question: Страница грузится долго. Как быстрее всего найти самый медленный запрос?
  options:
    - "Отсортировать список в Network по колонке Time"
    - "Включить Disable cache и перезагрузить страницу"
    - "Включить Offline и посмотреть, что не загрузилось"
    - "Открыть вкладку Console и поискать ошибки"
  correct: 0
  explanation: |
    Нажми на заголовок колонки Time — самые долгие запросы окажутся
    наверху. Дальше у медленного запроса смотрят Timing — какая фаза
    длинная, — и Waterfall: нет ли лесенки или десятков одинаковых
    запросов.

    Disable cache нужен для честного замера, но сам медленный запрос
    не покажет. Offline проверяет поведение без сети. Console — про
    ошибки скриптов, а не про время.

- id: http-16
  type: quiz
  question: "Выгрузка отчёта приходит с заголовком `Content-Type: text/csv` без `charset`. У части пользователей вместо русских букв — кракозябры. В чём причина?"
  options:
    - "Файл слишком большой, и браузер его обрезал"
    - "Программа не знает кодировку и угадывает её неправильно"
    - "Сервер забыл сжать файл"
    - "Нужно было отдавать файл как JSON"
  correct: 1
  explanation: |
    Текст — это байты. Чтобы превратить их в буквы, нужна кодировка.
    Без `charset` браузер или Excel её угадывают — и, например, читают
    UTF-8 как другую кодировку. Получается «РџСЂРёРІРµС‚» вместо
    «Привет».

    Исправление — указать кодировку: `text/csv; charset=utf-8`, а для
    Excel иногда ещё добавить в начало файла специальную метку UTF-8.
    У JSON кодировка по стандарту UTF-8, поэтому `application/json`
    без `charset` — норма.
