# Вопросы темы «Коды ответа». Формат — см. osnovy/bag-report.yaml.

- id: code-01
  type: card
  question: Что означает первая цифра кода ответа? Какие бывают классы?
  answer: |
    Первая цифра — класс ответа:

    - `1xx` — информация: ответ ещё не окончательный. Например,
      `101` — переход на WebSocket.
    - `2xx` — успех: `200`, `201`, `204`.
    - `3xx` — перенаправление: ресурс в другом месте или не
      изменился. `301`, `302`, `304`.
    - `4xx` — ошибка клиента: проблема в запросе. `400`, `401`,
      `403`, `404`.
    - `5xx` — ошибка сервера: запрос мог быть правильным, сервер не
      справился. `500`, `502`, `503`, `504`.

    Даже не помня точный код, по первой цифре понятно, кого спрашивать
    первым: при `4xx` — смотри на свой запрос, при `5xx` — на сервер.

- id: code-02
  type: quiz
  question: Удаление прошло успешно, тела в ответе нет. Какой код подходит лучше всего?
  options:
    - "200 OK"
    - "204 No Content"
    - "201 Created"
    - "202 Accepted"
  correct: 1
  explanation: |
    `204` — успех без тела. Так обычно отвечают на `DELETE`.

    - `200` — успех, и в ответе **есть** тело.
    - `201` — создан новый ресурс. Обязателен заголовок `Location`
      с адресом созданного.
    - `202` — запрос принят, но выполнится позже.

    Какой код вернёт конкретный API, записано в его спецификации.

- id: code-03
  type: quiz
  question: Когда уместен код 400 Bad Request?
  options:
    - "Когда у пользователя нет прав на действие"
    - "Когда сервер упал при обработке запроса"
    - "Когда запрошенного ресурса нет"
    - "Когда запрос нельзя разобрать: битый JSON, параметр не того формата"
  correct: 3
  explanation: |
    `400` — сервер не смог понять запрос: JSON без закрывающей скобки,
    текст вместо числа в параметре.

    Нет прав — `403`. Сервер упал — `500`. Ресурса нет — `404`.

    Граница между `400` и `422` в разных API разная — смотри
    спецификацию.

- id: code-04
  type: quiz
  question: Токен действующий, но роли пользователя не хватает на удаление. Какой код?
  options:
    - "403 Forbidden"
    - "401 Unauthorized"
    - "400 Bad Request"
    - "500 Internal Server Error"
  correct: 0
  explanation: |
    `403` — сервер знает, кто ты, но тебе это нельзя. Повторный вход
    не поможет.

    `401` был бы, если бы сервер не знал, кто ты: нет токена, токен
    испорчен или просрочен.

    Если ответить `401` вместо `403`, клиент обычно разлогинит
    пользователя — и тот будет попадать на экран входа при каждой
    попытке.

- id: code-05
  type: quiz
  question: Что означает код 404 Not Found?
  options:
    - "Сервер не работает"
    - "Метод запроса не поддерживается"
    - "Ресурса по этому адресу нет — или его скрывают от тебя"
    - "Нет подключения к интернету"
  correct: 2
  explanation: |
    `404` — ресурса нет. Причина не уточняется: не было никогда,
    удалили, или он чужой и его существование скрывают.

    Метод не тот — `405`. Сервер не работает — `5xx`. Нет интернета —
    вообще нет кода ответа: запрос не дошёл до сервера.

- id: code-06
  type: quiz
  question: Что означает код 500 Internal Server Error?
  options:
    - "Пользователь ввёл неверные данные"
    - "В приложении произошла необработанная ошибка"
    - "Сервер на плановом обслуживании"
    - "Запрос выполнится позже"
  correct: 1
  explanation: |
    `500` — приложение столкнулось с ситуацией, которую не обработало,
    и упало.

    Неверные данные сервер должен обработать сам и ответить `400` или
    `422`. Обслуживание — `503`. «Выполнится позже» — `202`.

    В баг-репорт про `500` приложи номер запроса — `X-Request-ID` или
    аналог: по нему разработчик найдёт ошибку в логах.

- id: code-07
  type: card
  question: Чем 401 отличается от 403?
  answer: |
    Главный вопрос — **знает ли сервер, кто перед ним**.

    - **`401`** — не знает: нет токена, токен испорчен, просрочен или
      отозван. «Предъявите пропуск». Поможет вход.
    - **`403`** — знает, но именно тебе это действие нельзя. «Пропуск
      в порядке, но в эту дверь нельзя». Вход не поможет.

    Пример: изменить проект без токена — `401`. С токеном
    пользователя, у которого роль «только просмотр», — `403`.

    Почему важно: клиент на `401` разлогинивает. Перепутанный код
    выкидывает людей на экран входа.

- id: code-08
  type: quiz
  question: "Хитрый вопрос: почему некоторые API на чужой ресурс отвечают 404, а не 403?"
  options:
    - "Это ошибка разработчиков: правильно всегда 403"
    - "Потому что 404 обрабатывается быстрее"
    - "Потому что 403 разрешено только администраторам"
    - "Чтобы не раскрыть, что ресурс существует: 403 это подтверждает"
  correct: 3
  explanation: |
    `403` говорит «ресурс есть, но тебе нельзя». Перебирая `id`, можно
    узнать, какие проекты, заказы или клиенты существуют, ничего не
    открывая.

    Поэтому для чужих ресурсов многие API отвечают `404` — снаружи не
    отличить «нет» от «не твоё». `403` оставляют для случаев, когда
    существование уже известно: ты участник, но роли не хватает.

    Что проверить: ответ на чужой ресурс неотличим от ответа на
    несуществующий — тот же код и то же сообщение.

- id: code-09
  type: card
  question: Чем 400 отличается от 422?
  answer: |
    - **`400`** — запрос нельзя **разобрать**: битый JSON, текст
      вместо числа. Сервер не понял, что прислали.
    - **`422`** — запрос разобран, но **значения не проходят
      проверку**: пустое название, отрицательная цена, дата окончания
      раньше начала. Сервер понял, но так нельзя.

    Аналогия: `400` — письмо на непонятном языке, `422` — понятное
    письмо с невозможной просьбой.

    Граница в разных API проходит по-разному: некоторые на всё
    отвечают `400`, а FastAPI отвечает `422` даже на битый JSON. Баг —
    когда код расходится со спецификацией или одинаковые ситуации
    в одном API получают разные коды.

- id: code-10
  type: quiz
  question: Когда уместен код 409 Conflict?
  options:
    - "Когда запрос противоречит текущему состоянию: email уже занят, участник уже в проекте"
    - "Когда в теле запроса пустое обязательное поле"
    - "Когда два сервера отвечают одновременно"
    - "Когда токен просрочен"
  correct: 0
  explanation: |
    `409` — данные сами по себе правильные, но конфликтуют с тем, что
    уже есть. Email правильный, но занят. Документ можно сохранить, но
    его уже изменил коллега.

    Пустое поле неверно всегда — это `422`. Просроченный токен — `401`.

    Как отличить `409` от `422`: будет ли этот же запрос правильным в
    другой ситуации? Да — `409`, нет — `422`.

- id: code-11
  type: card
  question: Что означает 429 и какой заголовок в нём важен?
  answer: |
    `429 Too Many Requests` — превышен лимит запросов: слишком много
    попыток входа, слишком частые вызовы API.

    Важный заголовок — **`Retry-After`**: через сколько секунд или
    с какого момента можно повторить.

    Что проверить:

    - лимит срабатывает на заявленном числе запросов;
    - в ответе есть `Retry-After`;
    - через указанное время запросы снова проходят;
    - лимит считается для того, для кого задуман: по пользователю,
      по IP, по ключу API.

    Без `Retry-After` клиент начинает повторять сразу и ещё сильнее
    упирается в лимит.

- id: code-12
  type: quiz
  question: "Хитрый вопрос: пользователи видят 504, а в логах приложения всё 200. Как так?"
  options:
    - "Логи врут, такого не бывает"
    - "504 — ошибка браузера, сервер тут ни при чём"
    - "504 отдал прокси, не дождавшись ответа; приложение досчитало позже и записало 200"
    - "504 значит, что запрос не дошёл до прокси"
  correct: 2
  explanation: |
    `502` и `504` обычно отдаёт прокси или балансировщик перед
    приложением.

    - `502` — нормального ответа от приложения нет: упало,
      перезапускается, ответило мусором.
    - `504` — приложение не ответило за отведённое время.

    При `504` приложение могло закончить работу уже после того, как
    прокси перестал ждать, — и записать `200`. Операция, возможно,
    выполнилась. Искать нужно в логах прокси, а потом проверять
    данные: нет ли дублей после повтора.

- id: code-13
  type: quiz
  question: Что означает код 503 Service Unavailable?
  options:
    - "Ресурс удалён навсегда"
    - "Ошибка в коде приложения"
    - "У пользователя нет прав"
    - "Сервис временно не может обслужить запрос: перегрузка или обслуживание"
  correct: 3
  explanation: |
    `503` — временная недоступность: плановые работы, перегрузка, нет
    живых серверов за балансировщиком.

    Ошибка в коде — `500`. Удалён навсегда — `410`. Нет прав — `403`.

    Что проверить: есть ли `Retry-After`, понятна ли пользователю
    страница «ведутся работы», повторяет ли клиент запрос позже.

- id: code-14
  type: card
  question: Чем отличаются 301, 302, 307 и 308?
  answer: |
    Две оси: **навсегда или временно** и **сохраняется ли метод**.

    | | Навсегда | Временно |
    |---|---|---|
    | Метод может смениться на `GET` | `301` | `302` |
    | Метод и тело сохраняются | `308` | `307` |

    Что важно тестировщику:

    - `301` и `308` браузер **запоминает** и в следующий раз идёт по
      новому адресу без запроса к серверу. Ошибку в адресе потом
      трудно исправить. Поэтому переезд сначала проверяют на `302`.
    - На `301` и `302` после `POST` браузеры отправляют `GET`, и тело
      теряется. Для перенаправления `POST` нужны `307` или `308`.
    - Проверяй адрес в `Location` и цепочки редиректов — с Preserve
      log в Network.

- id: code-15
  type: quiz
  question: Что означает код 304 Not Modified?
  options:
    - "Ресурс не удалось изменить"
    - "Ресурс не изменился — клиент может взять его из своего кэша"
    - "Изменение запрещено правами"
    - "Сервер не поддерживает изменение этим методом"
  correct: 1
  explanation: |
    Клиент спрашивает: «У меня есть версия с таким `ETag` — она ещё
    актуальна?» — заголовок `If-None-Match`. Сервер отвечает `304`
    без тела: «да, бери из кэша».

    Это экономит трафик. Баг бывает, когда данные изменились, а
    сервер продолжает отвечать `304`, — пользователь видит старое.

- id: code-16
  type: quiz
  question: "Хитрый вопрос: на буквы в поле «возраст» сервер ответил 500. Чей это баг?"
  options:
    - "Сервера: неверный ввод он обязан обработать и ответить 400 или 422"
    - "Пользователя: не надо вводить буквы"
    - "Только клиента: он должен был не пропустить буквы"
    - "Ничей: 500 — нормальный ответ на неверные данные"
  correct: 0
  explanation: |
    `500` значит, что сервер не обработал ситуацию и упал. Неверный
    ввод — ожидаемая ситуация, и сервер должен ответить `400` или
    `422` с понятным сообщением.

    Проверка на клиенте — удобство, не защита: запрос можно отправить
    через `curl` или из старой версии приложения.

    Ещё проверь тело `500`: нет ли stack trace — это утечка. И не
    записались ли неверные данные частично.

- id: code-17
  type: card
  question: "Хитрый вопрос: API на всё отвечает 200, а ошибки пишет в теле. Это проблема?"
  answer: |
    Само по себе не баг, если так записано в спецификации: так
    устроены GraphQL и многие старые API. Но есть риски:

    - мониторинг считает ошибки по `5xx` и видит 100% успеха даже
      при полном отказе;
    - прокси и кэш могут сохранить ошибку как нормальный ответ;
    - не работает всё, что опирается на коды: повторы, «разлогинить
      на `401`», графики;
    - тестировщик, который смотрит только на код, пропустит ошибку.

    Что делать: всегда читать тело, уточнить, как мониторинг узнаёт
    об ошибках, и сказать о риске команде.

- id: code-18
  type: quiz
  question: "Хитрый вопрос: сервер отвечает 204 и присылает тело. Что не так?"
  options:
    - "Ничего: тело у 204 необязательное, но допустимое"
    - "Сервер должен был ответить 201"
    - "204 по стандарту без тела; клиенты по-разному обрабатывают лишние байты — если есть что вернуть, нужен 200"
    - "204 с телом — это то же самое, что 206"
  correct: 2
  explanation: |
    `204 No Content` по определению означает «тела нет». Если тело
    всё-таки пришло, одни клиенты его проигнорируют, другие сломаются:
    прочитают лишние байты как начало следующего ответа.

    Если серверу есть что вернуть, правильный код — `200`.

- id: code-19
  type: quiz
  question: Сервер ответил 405 Method Not Allowed. Что должно быть в ответе по стандарту?
  options:
    - "Заголовок Location с новым адресом"
    - "Заголовок Retry-After"
    - "Тело со stack trace для разработчика"
    - "Заголовок Allow со списком разрешённых методов"
  correct: 3
  explanation: |
    `405` — адрес есть, но этот метод к нему применить нельзя. По
    стандарту в ответе обязателен заголовок `Allow`: например,
    `Allow: GET, PATCH, DELETE`.

    Что проверить: код именно `405`, а не `404` или `500`; `Allow` есть
    и совпадает со спецификацией.

    Не путай с соседями: `404` — нет адреса, `501` — сервер этот метод
    вообще не знает.

- id: code-20
  type: card
  question: "Хитрый вопрос: что такое код 418?"
  answer: |
    `418 I'm a teapot` — «я чайник». Это шутка: RFC 2324, первоапрельский
    документ 1998 года о «протоколе управления кофейниками». Чайник
    отказывается варить кофе.

    В стандарт HTTP код не входит, но прижился: его отдают учебные
    сервисы, а некоторые сайты — как пасхалку. Посмотреть можно на
    httpbin: адрес `/status/418`.

    Зачем этот вопрос на собеседовании: проверить кругозор и
    чувство юмора. Хороший ответ — назвать шутку и сразу сказать, что
    в настоящем API такой код — повод спросить, что имелось в виду.
