# Вопросы темы «Методы HTTP и идемпотентность». Формат — см. osnovy/bag-report.yaml.

- id: meth-01
  type: card
  question: Какие методы HTTP ты знаешь и для чего каждый?
  answer: |
    - `GET` — получить ресурс или список. Ничего не меняет.
    - `POST` — создать ресурс или отправить данные на обработку.
    - `PUT` — заменить ресурс целиком.
    - `PATCH` — изменить часть ресурса.
    - `DELETE` — удалить ресурс.
    - `HEAD` — как `GET`, но без тела ответа: только заголовки.
    - `OPTIONS` — узнать, какие методы разрешены. Браузер шлёт его
      перед «непростыми» запросами — это preflight CORS.

    Ещё есть `CONNECT` и `TRACE`, но в работе с API они почти не
    встречаются.

    Метод — это обещание: по нему понятно, меняет ли запрос данные
    и можно ли его безопасно повторить. Отсюда проверки.

- id: meth-02
  type: quiz
  question: Чем GET отличается от POST?
  options:
    - "GET быстрее, потому что работает без сервера"
    - "GET получает данные и ничего не меняет, POST отправляет данные на обработку — обычно создаёт что-то новое"
    - "GET используют только браузеры, а POST — только мобильные приложения"
    - "Ничем: это два названия одного метода"
  correct: 1
  explanation: |
    `GET` — безопасный и идемпотентный: только читает, параметры
    обычно в адресе, тела нет. Его можно кэшировать и повторять.

    `POST` — не безопасный и не идемпотентный: данные в теле, два
    одинаковых запроса обычно создают два объекта. Поэтому повторять
    `POST` без защиты на сервере опасно.

- id: meth-03
  type: card
  question: Чем PUT отличается от PATCH?
  answer: |
    Разница — в полях, которых **нет** в теле запроса.

    - **`PUT`** заменяет ресурс **целиком**. Тело — это новый ресурс
      полностью. Чего нет в теле — должно очиститься, или сервер
      отклонит неполное тело.
    - **`PATCH`** меняет **только переданные** поля. Остальные
      остаются как были.

    `PUT` идемпотентен по стандарту. `PATCH` — не гарантированно:
    зависит от того, какую операцию описывает тело.

    Проверки: `PUT` без одного поля — поле очистилось или пришла
    ошибка, а не осталось молча старое значение. `PATCH` одного поля —
    остальные поля не изменились.

- id: meth-04
  type: quiz
  question: Что такое безопасный метод HTTP?
  options:
    - "Метод, который работает только по HTTPS"
    - "Метод, для которого обязательно нужен токен"
    - "Метод, который нельзя повторить"
    - "Метод, который не меняет данные на сервере"
  correct: 3
  explanation: |
    Безопасный метод — тот, что только читает: `GET`, `HEAD`,
    `OPTIONS`, `TRACE`. Запись в лог или счётчик для статистики не
    считаются изменением данных.

    Безопасность метода не связана с HTTPS и авторизацией. Браузеры,
    прокси и роботы считают безопасные запросы безвредными и могут
    отправлять их заранее или повторять — поэтому `GET` не должен
    ничего менять.

- id: meth-05
  type: card
  question: Что такое идемпотентность?
  answer: |
    Метод **идемпотентен**, если его можно повторить сколько угодно
    раз, и **состояние сервера** будет таким же, как после одного
    раза.

    Главное — это про **состояние**, а не про одинаковый ответ.
    Повторный `DELETE` может ответить `404` вместо `204`, но ресурса
    нет и после первого, и после второго вызова — значит,
    идемпотентность не нарушена.

    По стандарту идемпотентны `GET`, `HEAD`, `OPTIONS`, `PUT`,
    `DELETE`. `POST` — нет. `PATCH` — не гарантированно.

    Зачем это нужно: запросы повторяются сами — обрыв связи, таймауты,
    ретраи, двойные клики. Повторять безопасно можно только
    идемпотентные запросы.

- id: meth-06
  type: quiz
  question: Каким методом обычно удаляют ресурс?
  options:
    - "DELETE"
    - "GET с параметром delete=true"
    - "PUT с пустым телом"
    - "HEAD"
  correct: 0
  explanation: |
    Для удаления есть отдельный метод — `DELETE`. Типичный успешный
    ответ — `204` без тела или `200`.

    Удаление через `GET` — опасная практика: `GET` считается
    безопасным, его могут выполнить роботы, предзагрузка браузера
    или повтор. `PUT` с пустым телом — это замена ресурса, а не
    удаление. `HEAD` только получает заголовки.

- id: meth-07
  type: quiz
  question: Передают ли обычно тело в запросе GET?
  options:
    - "Да, у GET тело обязательно"
    - "Да, но только в формате XML"
    - "Обычно нет: параметры GET передают в адресе"
    - "Нет, стандарт строго запрещает тело у GET"
  correct: 2
  explanation: |
    У `GET` параметры обычно в адресе — в пути и query-параметрах.
    Тела нет.

    Стандарт тело у `GET` не запрещает, но и не определяет, что
    сервер должен с ним делать. Поэтому прокси и библиотеки могут
    его выбросить, а браузерный `fetch` не даст его отправить
    вообще. Если API всё-таки ждёт тело в `GET` — это особенность,
    которую стоит проверить на реальном окружении.

- id: meth-08
  type: quiz
  question: Первый DELETE ответил 204, повторный DELETE того же ресурса — 404. Что это значит?
  options:
    - "Нарушение идемпотентности: ответы должны совпадать"
    - "Нормально: ресурса нет после обоих вызовов, состояние сервера то же"
    - "Ресурс восстановился после первого удаления"
    - "Сервер упал на втором запросе"
  correct: 1
  explanation: |
    Идемпотентность — про состояние сервера, а не про ответ. После
    первого `DELETE` ресурса нет, после второго — тоже нет. `404`
    честно сообщает, что удалять было нечего.

    Некоторые API на повтор отвечают снова `204` — тоже нормально,
    если так в спецификации. Баг — если второй вызов вернул `500`
    (необработанная ошибка) или удалил что-то ещё.

- id: meth-09
  type: card
  question: Почему PATCH не всегда идемпотентен?
  answer: |
    `PATCH` описывает **изменение**, а изменения бывают двух видов.

    - **Установить значение** — идемпотентно. `{"name": "Новое"}`:
      сколько ни повторяй, имя будет «Новое».
    - **Сделать действие с текущим значением** — не идемпотентно.
      «Увеличить баланс на 100», «добавить тег в конец списка»
      (в JSON Patch — `add` с путём `/-`), «сдвинуть срок на +1 день»,
      «перевести в следующий статус». Каждый повтор меняет состояние
      ещё раз.

    Поэтому стандарт идемпотентность `PATCH` не гарантирует. Я её
    проверяю: отправляю тот же `PATCH` дважды и сравниваю состояние
    ресурса.

- id: meth-10
  type: card
  question: Что такое ключ идемпотентности (Idempotency-Key) и как его тестировать?
  answer: |
    Способ сделать `POST` безопасным для повтора — чаще всего в
    платежах. Клиент генерирует уникальный ключ и кладёт его в
    заголовок `Idempotency-Key`. Сервер выполняет операцию и
    запоминает ключ вместе с ответом. Повтор с тем же ключом получает
    сохранённый ответ — без второго списания.

    Что тестировать:

    - тот же ключ и то же тело — тот же ответ, одна операция;
    - новый ключ — новая операция;
    - тот же ключ и **другое** тело, например другая сумма, — ошибка;
    - два запроса с одним ключом одновременно — выполняется один;
    - ключ после срока хранения — поведение по спецификации;
    - запрос без ключа, ключ чужого пользователя;
    - клиент при повторе отправляет **тот же** ключ, а не новый.

- id: meth-11
  type: quiz
  question: Почему клиент или балансировщик не должен автоматически повторять POST после таймаута?
  options:
    - "POST нельзя отправлять повторно — сервер его заблокирует"
    - "После таймаута сервер всегда отклоняет запрос"
    - "Повтор POST занимает больше времени, чем первый запрос"
    - "Первый запрос мог выполниться, а ответ потеряться — повтор создаст дубль"
  correct: 3
  explanation: |
    Таймаут не значит, что запрос не выполнился. Сервер мог создать
    заказ или списать деньги, а ответ потерялся по дороге. `POST` не
    идемпотентен — повтор сделает это ещё раз.

    Автоматически повторять безопасно `GET`, `PUT`, `DELETE`. Для
    `POST` нужна защита на сервере — например, ключ идемпотентности.

- id: meth-12
  type: card
  question: Ссылка «Отписаться» в письме сразу отписывает по GET. Что не так?
  answer: |
    `GET` должен быть безопасным — ничего не менять. Поэтому его
    свободно выполняют программы: почтовые сервисы и антивирусы
    открывают ссылки из писем, чтобы проверить их, браузеры загружают
    ссылки заранее. В итоге человек «отписан», хотя письма не
    открывал.

    Что проверить: открыть ссылку через `curl`, без браузера, —
    отписка выполнилась? Значит, это сделает любая программа.

    Что предложить: ссылка открывает страницу с кнопкой, кнопка
    отправляет `POST`. То же касается подтверждения email,
    удаления и выхода из аккаунта.

- id: meth-13
  type: quiz
  question: Что значит ответ 405 и какой заголовок в нём обязателен?
  options:
    - "Адрес существует, но этот метод к нему не применить; обязателен заголовок Allow со списком разрешённых методов"
    - "Адреса не существует; обязателен заголовок Location"
    - "Нужно войти в систему; обязателен заголовок Authorization"
    - "Сервер перегружен; обязателен заголовок Retry-After"
  correct: 0
  explanation: |
    `405 Method Not Allowed` — адрес есть, метод не тот. По стандарту
    сервер обязан прислать `Allow` с методами, которые этот адрес
    поддерживает.

    Что проверить: неподдерживаемый метод получает `405`, а не `404`,
    `500` или `200`. В `Allow` — тот же список, что в спецификации.

- id: meth-14
  type: quiz
  question: Для чего нужен метод HEAD?
  options:
    - "Чтобы отправить только заголовки запроса без адреса"
    - "Чтобы создать ресурс без тела"
    - "Чтобы получить заголовки ответа без тела — например, узнать размер файла, не скачивая его"
    - "Чтобы получить первую строку HTML-страницы"
  correct: 2
  explanation: |
    `HEAD` — это `GET` без тела ответа. Сервер присылает те же
    заголовки, что и на `GET`: `Content-Length`, `Content-Type`,
    `ETag`, `Last-Modified`.

    Зачем: узнать размер файла, проверить, изменился ли ресурс,
    проверить, жива ли ссылка. Не каждый сервер поддерживает `HEAD` —
    некоторые отвечают на него `405`.

- id: meth-15
  type: quiz
  question: Когда браузер сам отправляет запрос OPTIONS?
  options:
    - "Перед каждым запросом к любому сайту"
    - "Перед «непростым» запросом на другой источник — это preflight CORS"
    - "Только когда пользователь нажимает «Обновить»"
    - "Когда сервер вернул ошибку 500"
  correct: 1
  explanation: |
    Если страница отправляет на другой источник «непростой» запрос —
    с JSON в теле, с заголовком `Authorization`, методом `PUT`,
    `PATCH` или `DELETE`, — браузер сначала спрашивает сервер через
    `OPTIONS`, можно ли. Это preflight. В Network — две строки с одним
    адресом.

    Ответ на preflight говорит, что разрешено отправлять браузеру.
    Он не гарантирует, что сервер этот метод поддерживает.

- id: meth-16
  type: quiz
  question: Какие методы идемпотентны по стандарту?
  options:
    - "Только GET"
    - "POST и PATCH"
    - "Все методы, кроме DELETE"
    - "GET, HEAD, OPTIONS, PUT и DELETE"
  correct: 3
  explanation: |
    Безопасные методы — `GET`, `HEAD`, `OPTIONS` — идемпотентны:
    раз ничего не меняют, то и повтор ничего не меняет. `PUT` и
    `DELETE` меняют данные, но повтор не меняет их ещё раз — поэтому
    тоже идемпотентны.

    `POST` по стандарту не идемпотентен. `PATCH` — не гарантированно:
    зависит от операции в теле.

- id: meth-17
  type: quiz
  question: "Хитрый вопрос: PATCH всегда идемпотентен — он же просто меняет поля?"
  options:
    - "Да, PATCH идемпотентен всегда по стандарту"
    - "Нет, PATCH никогда не бывает идемпотентным"
    - "Не обязательно: «установить значение» — да, «увеличить» или «добавить в список» — нет"
    - "Да, если запрос отправлен по HTTPS"
  correct: 2
  explanation: |
    Стандарт идемпотентность `PATCH` не гарантирует.
    `{"name": "Новое"}` — установить значение, повтор ничего не меняет.
    `{"op": "increment", "path": "/balance", "value": 100}`,
    JSON Patch `add` в конец массива (`/-`), «сдвинуть дату на +1
    день» — каждый повтор меняет состояние снова.

    Хороший ответ на собеседовании: «Зависит от семантики операции,
    поэтому проверяю повтором».

- id: meth-18
  type: quiz
  question: "Хитрый вопрос: может ли POST быть идемпотентным?"
  options:
    - "Да, если сервер так спроектирован — например, ключ идемпотентности или «создать или обновить» по уникальному полю"
    - "Нет, никогда — так написано в стандарте"
    - "Да, если отправить его без тела"
    - "Да, если сервер отвечает 200, а не 201"
  correct: 0
  explanation: |
    По стандарту `POST` не идемпотентен — стандарт этого не обещает.
    Но конкретный сервер может сделать его безопасным для повтора:
    ключ идемпотентности возвращает сохранённый результат, а
    «создать или обновить» по уникальному номеру не создаёт дубль.

    И наоборот: `PUT` идемпотентен по стандарту, но если реализация
    создаёт новую запись на каждый вызов — это баг. Код ответа
    и наличие тела к идемпотентности отношения не имеют.

- id: meth-19
  type: card
  question: "Хитрый вопрос: можно ли искать через POST и почему так делают?"
  answer: |
    Можно, и это частая практика. Причины:

    - фильтр **длинный или сложный** — десятки условий, вложенные
      «и/или»; длина адреса ограничена;
    - в условиях **чувствительные данные** — телефон, паспорт, email.
      В адресе они осели бы в истории браузера, логах и `Referer`;
    - так устроен инструмент: GraphQL обычно шлёт всё через
      `POST /graphql`, поиск Elasticsearch `_search` принимает условия
      в теле.

    Минусы: метод больше не подсказывает, что запрос только читает;
    ответы на `POST` не кэшируются; ссылкой на результаты поиска не
    поделиться.

    Что проверяю: что такой `POST` действительно ничего не меняет —
    повтор даёт тот же результат, — и что чувствительные условия не
    попадают в адрес и логи.

- id: meth-20
  type: quiz
  question: "Хитрый вопрос: в GraphQL все запросы идут через POST /graphql. Значит, все они меняют данные?"
  options:
    - "Да, POST всегда меняет данные"
    - "Да, поэтому GraphQL нельзя кэшировать и тестировать"
    - "Нет, GraphQL вообще не использует HTTP"
    - "Нет: меняет ли запрос данные, определяет тело — query читает, mutation изменяет"
  correct: 3
  explanation: |
    В GraphQL метод почти всегда `POST`, а что делает запрос, написано
    в теле: `query` — чтение, `mutation` — изменение.

    Это пример того, что метод — договорённость, а не гарантия.
    Безопасен ли запрос и можно ли его повторять, тестировщик
    определяет по спецификации и проверяет поведением.

- id: meth-21
  type: quiz
  question: "Хитрый вопрос: что будет, если отправить GET с телом?"
  options:
    - "Сервер обязательно вернёт 400 — стандарт это запрещает"
    - "Зависит от пути: стандарт не определяет смысл тела у GET, поэтому прокси и библиотеки могут его выбросить"
    - "Тело автоматически превратится в query-параметры"
    - "Запрос станет POST"
  correct: 1
  explanation: |
    Стандарт тело у `GET` не запрещает, но и не определяет, что с ним
    делать. Одни серверы его читают — например, Elasticsearch для
    поиска. Другие игнорируют. Прокси, балансировщики и библиотеки
    могут выбросить его по дороге, а браузерный `fetch` не даст его
    отправить вообще.

    Что проверить, если API ждёт тело в `GET`: доходит ли оно на
    реальном окружении через все прокси и что будет, если оно
    потеряется. То же касается тела у `DELETE`.
