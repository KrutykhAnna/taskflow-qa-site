# Вопросы темы «API, REST и форматы данных». Формат — см. osnovy/bag-report.yaml.

- id: rest-01
  type: card
  question: Что такое API? Какие бывают API по тому, кому они открыты?
  answer: |
    API — программный интерфейс: договорённость о том, как одна
    программа обращается к другой. Какие запросы можно отправить,
    что в них передать и что придёт в ответ.

    API бывает не только веб: у библиотеки, операционной системы,
    браузера. Тестировщик чаще всего работает с веб-API — по сети,
    обычно по HTTP.

    По тому, кому открыт:

    - **публичный** — для всех, часто по ключу: погода, карты, платежи;
    - **партнёрский** — для конкретных компаний по договору;
    - **внутренний** — для своих приложений: фронтенд, мобильное
      приложение, другие сервисы компании.

- id: rest-02
  type: quiz
  question: Что такое REST?
  options:
    - "Протокол передачи данных поверх HTTP"
    - "Архитектурный стиль построения API"
    - "Формат данных, альтернатива JSON"
    - "Библиотека для написания серверов"
  correct: 1
  explanation: |
    REST — архитектурный стиль, набор принципов: ресурсы с адресами,
    стандартные методы, сервер не хранит состояние клиента, ответы
    можно кэшировать.

    У REST нет своего стандарта, формата сообщений и версий, поэтому
    это не протокол. Протокол — HTTP, по нему REST API обычно и
    работают. Формат данных REST не задаёт: чаще всего JSON, но может
    быть и XML.

- id: rest-03
  type: quiz
  question: Какой адрес лучше соответствует правилам REST для получения проекта 42?
  options:
    - "GET /getProject?id=42"
    - "POST /projects/get/42"
    - "GET /project/42/get"
    - "GET /projects/42"
  correct: 3
  explanation: |
    В REST адрес называет ресурс, а действие задаёт метод.
    `GET /projects/42` — элемент 42 из коллекции `/projects`.

    - `GET /getProject?id=42` — действие «get» продублировано в адресе.
    - `POST /projects/get/42` — чтение через `POST`, глагол в адресе.
    - `GET /project/42/get` — единственное число и глагол в адресе.

- id: rest-04
  type: card
  question: Что значит stateless в REST? Не противоречит ли этому то, что сервер хранит данные в базе?
  answer: |
    Stateless — сервер не хранит **состояние разговора** с клиентом
    между запросами. Каждый запрос самодостаточен: всё, что нужно для
    ответа, в нём самом, в том числе токен.

    Данные в базе — проекты, пользователи — это не состояние клиента,
    а состояние ресурсов. Их хранить можно и нужно.

    Проверка на практике: запрос с токеном проходит, тот же запрос
    без токена — `401`, хотя секунду назад этот клиент «входил».

    Зачем: любой запрос может обработать любой сервер за
    балансировщиком — так API масштабируется.

- id: rest-05
  type: quiz
  question: Какой набор — это все типы значений в JSON?
  options:
    - "string, number, boolean, date, object, array"
    - "string, integer, float, boolean, null, object"
    - "string, number, boolean, null, object, array"
    - "string, number, boolean, undefined, object, array"
  correct: 2
  explanation: |
    В JSON шесть типов: строка, число, логическое, `null`, объект,
    массив.

    - Типа «дата» нет — даты передают строкой, обычно в ISO 8601.
    - Целых и дробных чисел отдельно нет — просто number.
    - `undefined` — из JavaScript, в JSON его нет.

- id: rest-06
  type: card
  question: Чем JSON отличается от XML?
  answer: |
    - **Объём.** JSON компактнее: в XML каждое значение обёрнуто
      в открывающий и закрывающий тег.
    - **Типы.** В JSON шесть типов, тип видно по записи: `42` —
      число, `"42"` — строка. В XML всё текст, типы задаёт внешняя
      схема XSD.
    - **null.** В JSON есть `null`. В XML единого способа нет: пустой
      элемент, атрибут `xsi:nil` или элемента нет.
    - **Возможности XML**, которых нет в JSON: атрибуты, пространства
      имён, комментарии.
    - **Где встречаются.** JSON — веб, мобильные приложения,
      большинство новых API. XML — SOAP, банки, госсистемы, документы,
      конфигурации.

- id: rest-07
  type: quiz
  question: Что верно про SOAP?
  options:
    - "Сообщения — XML-конверты, контракт описан в WSDL"
    - "Это архитектурный стиль, как REST, но для XML"
    - "Каждая операция — отдельный адрес и свой метод HTTP"
    - "Ошибки всегда приходят с кодом 200 в массиве errors"
  correct: 0
  explanation: |
    SOAP — протокол. Сообщение — XML-конверт `Envelope` с `Body`
    внутри. Контракт — WSDL: список операций, параметров и типов.

    Адрес обычно один, метод практически всегда `POST`, действие —
    внутри XML. Ошибка — элемент `Fault`, в SOAP 1.1 обычно с кодом
    `500`. Массив `errors` при `200` — это про GraphQL.

- id: rest-08
  type: card
  question: Чем отличаются Swagger и OpenAPI?
  answer: |
    **OpenAPI** — спецификация, то есть стандарт описания REST API
    в YAML или JSON: адреса, параметры, тела, ответы, схемы.

    **Swagger** — инструменты вокруг стандарта: Swagger UI — страница
    для чтения описания и отправки запросов, Swagger Editor — редактор.

    Путаница историческая: до 2016 года стандарт назывался Swagger
    Specification. Версия 2.0 так и осталась «Swagger 2.0», с 3.0 —
    OpenAPI. Поэтому в старых файлах `swagger: "2.0"`, в новых —
    `openapi: 3.x`.

- id: rest-09
  type: quiz
  question: "Сервер получил PATCH /profile с телом {\"middleName\": null}. Чем это обычно отличается от PATCH с телом {}?"
  options:
    - "Ничем: и null, и отсутствие поля значат «нет значения»"
    - "null обычно значит «стереть отчество», а {} — «ничего не менять»"
    - "{} стирает все поля профиля, а null — только отчество"
    - "Тело {} не пройдёт проверку и вернёт 422"
  correct: 1
  explanation: |
    `null` — поле есть, значение «пусто»: сервер должен очистить его.
    Отсутствие поля в `PATCH` — «это поле не трогать».

    Если сервер путает эти случаи, данные пропадают: человек менял
    имя, а отчество стёрлось. Поэтому для `PATCH` проверяют три
    варианта: поле со значением, поле с `null` и без поля.

- id: rest-10
  type: quiz
  question: Сервер вернул заказ с id 9007199254740993. Веб-кабинет открыл заказ 9007199254740992. Почему?
  options:
    - "Сервер ошибся при генерации id"
    - "Браузер закэшировал старый ответ"
    - "JavaScript хранит целые числа точно только до 2^53 − 1 и округлил id"
    - "Число не помещается в JSON, поэтому последняя цифра отбрасывается"
  correct: 2
  explanation: |
    В JavaScript все числа — дробные с плавающей точкой. Целые точны
    только до `9007199254740991`, то есть 2^53 − 1. Больше —
    округляются при разборе JSON.

    Сам JSON ограничений на длину числа не задаёт, а серверы на Java
    или Go хранят 64-битные числа точно. Поэтому `curl` показывает
    правильный `id`, а браузер — нет.

    Решение — передавать большие `id` строкой.

- id: rest-11
  type: quiz
  question: Как правильно передавать денежные суммы в API?
  options:
    - "Дробным числом: 19.99 — так короче"
    - "Строкой с символом валюты: \"19,99 ₽\""
    - "Любым числом: клиент всё равно округлит"
    - "Целым числом в копейках или строкой \"19.99\" с точной арифметикой на сервере"
  correct: 3
  explanation: |
    Дробные числа с плавающей точкой хранятся приблизительно:
    `0.1 + 0.2` даёт `0.30000000000000004`. На миллионе операций
    копейки перестают сходиться.

    Поэтому деньги передают целым числом в минимальных единицах —
    `1999` копеек — или строкой, которую сервер считает точной
    десятичной арифметикой. Валюту указывают отдельным полем.
    Строка с символом валюты и запятой — формат для показа, а не для
    обмена.

- id: rest-12
  type: quiz
  question: "API отдаёт время записи как \"2026-10-14T10:00:00\". В чём проблема?"
  options:
    - "Нет часового пояса: непонятно, это 10:00 по UTC, по серверу или по пользователю"
    - "Проблемы нет: это стандартный формат ISO 8601"
    - "Даты в JSON нужно передавать числом миллисекунд"
    - "В ISO 8601 нельзя указывать секунды"
  correct: 0
  explanation: |
    Формат похож на ISO 8601, но без пояса. Каждый клиент поймёт его
    по-своему: пользователь во Владивостоке увидит запись со сдвигом
    на 7 часов от московского сервера.

    Правильно — с поясом: `2026-10-14T07:00:00Z` или
    `2026-10-14T10:00:00+03:00`. Проверять время стоит в разных
    часовых поясах и на границах суток.

- id: rest-13
  type: quiz
  question: Какое изменение API ломает старых клиентов?
  options:
    - "В ответ добавили новое необязательное поле"
    - "Добавили новый эндпоинт"
    - "Поле phone в ответе переименовали в phoneNumber"
    - "Максимальную длину имени увеличили со 100 до 200 символов"
  correct: 2
  explanation: |
    Старый клиент ищет `phone`, не находит и показывает пустое место
    или падает. Переименование и удаление поля — ломающие изменения.

    Остальные обычно безопасны: новое поле и новый эндпоинт старые
    клиенты не замечают, более широкий лимит не отклоняет то, что
    раньше проходило. Но при увеличении лимита стоит проверить
    вёрстку на длинных значениях.

- id: rest-14
  type: card
  question: Добавили новое значение в enum статусов. Это ломающее изменение?
  answer: |
    Формально — нет: контракт расширился, старые значения на месте.

    На практике — «зависит от клиентов». Если клиент написан так, что
    знает только старые значения и не обрабатывает неизвестное, —
    экран с новым статусом упадёт. Особенно опасно в мобильных
    приложениях: старые версии живут годами.

    Что проверять:

    - как текущие и старые версии клиентов показывают новое значение;
    - есть ли у клиентов обработка «неизвестного значения»;
    - не нужно ли отдавать старым версиям старое значение, пока они
      не обновятся.

- id: rest-15
  type: quiz
  question: Вышла версия API v2 с ломающими изменениями. Что важнее всего проверить про v1?
  options:
    - "Что v1 сразу отвечает 404, чтобы клиенты перешли на v2"
    - "Что v1 продолжает работать как раньше, пока её не выключат по объявленному плану"
    - "Что v1 и v2 возвращают одинаковые ответы"
    - "Ничего: старую версию тестировать не нужно"
  correct: 1
  explanation: |
    Новую версию выпускают как раз для того, чтобы старые клиенты
    не сломались. Значит, `v1` должна вести себя как раньше.

    Когда `v1` выводят из эксплуатации, клиентов предупреждают заранее:
    заголовки `Deprecation` и `Sunset` с датой. После этой даты — понятный
    ответ, например `410`, а не `500`.

    Одинаковые ответы у `v1` и `v2` не нужны: в `v2` и есть изменения.

- id: rest-16
  type: quiz
  question: GraphQL-запрос вернул код 200. Что это значит для тестировщика?
  options:
    - "Запрос выполнен полностью, проверять тело не нужно"
    - "Сервер обязан вернуть все поля схемы"
    - "Ошибка невозможна: при ошибке GraphQL всегда отвечает 500"
    - "Нужно читать тело: ошибки могут быть в массиве errors при коде 200"
  correct: 3
  explanation: |
    GraphQL часто отвечает `200`, даже если часть запроса не
    выполнилась: ошибки лежат в массиве `errors` рядом с `data`.
    Один запрос может частично выполниться, и одного кода на весь
    ответ не хватает.

    Поэтому в GraphQL код почти ничего не говорит — проверяют тело.
    И сервер возвращает только запрошенные поля, а не все.

- id: rest-17
  type: quiz
  question: Что верно про gRPC?
  options:
    - "Работает поверх HTTP/2, данные — в бинарном формате protobuf"
    - "Это разновидность REST с JSON в теле"
    - "Используется в основном в браузере вместо fetch"
    - "Это формат описания API, как OpenAPI"
  correct: 0
  explanation: |
    gRPC — способ вызывать функции другого сервиса. Транспорт — HTTP/2,
    данные — protobuf: компактный бинарный формат, его не прочитать
    глазами. Контракт — файл `.proto`.

    Встречается в основном между микросервисами. Для ручной проверки
    нужен специальный клиент — например, Postman умеет работать с gRPC.

- id: rest-18
  type: card
  question: Что такое HATEOAS и модель зрелости Ричардсона?
  answer: |
    **HATEOAS** — принцип REST: в ответе кроме данных есть ссылки на
    возможные следующие действия. Клиент не собирает адреса сам, а идёт
    по ссылкам. Встречается редко.

    **Модель зрелости Ричардсона** — четыре уровня «насколько API REST»:

    - **0** — один адрес, всё через `POST`: SOAP, RPC;
    - **1** — отдельные адреса для ресурсов;
    - **2** — ресурсы плюс правильные методы и коды. Здесь большинство
      современных API;
    - **3** — уровень 2 плюс HATEOAS.

    Большинство «REST API» на самом деле REST-like, второй уровень.
    Это нормально.

- id: rest-19
  type: card
  question: Что такое code-first и design-first? Что это меняет для тестировщика?
  answer: |
    **Code-first** — сначала пишут код, описание OpenAPI генерируется
    из него. Описание совпадает с кодом, но описывает то, что сделали,
    а не то, что задумали: ошибку в коде оно повторит.

    **Design-first** — сначала пишут и согласуют контракт, потом по нему
    код. Фронтенд и бэкенд работают параллельно, тестировщик готовит
    проверки до появления кода. Риск — код и контракт разойдутся.

    Для тестировщика: при code-first сгенерированный Swagger нельзя
    считать требованиями — сверяю с ТЗ. При design-first сверяю код
    с контрактом.

- id: rest-20
  type: quiz
  question: В ТЗ поле обязательное, в сгенерированном Swagger — необязательное, сервер принимает запрос без него. Что делает тестировщик?
  options:
    - "Верит Swagger: он сгенерирован из кода, значит, правильный"
    - "Верит ТЗ и сразу заводит баг на код"
    - "Фиксирует все три источника и уточняет у ответственного за требования, что задумано"
    - "Ничего: поведение совпадает со Swagger, значит, всё в порядке"
  correct: 2
  explanation: |
    Сгенерированный Swagger показывает, как написан код, а не что
    задумано. ТЗ описывает замысел, но может устареть.

    Тестировщик фиксирует: ТЗ — так, Swagger — так, факт — так. И задаёт
    вопрос аналитику или продакт-менеджеру. Если поле обязательное —
    баг на код. Если нет — задача на исправление ТЗ. Какой документ
    считается источником истины — договорённость команды.
