# Вопросы темы «Сетевые модели OSI и TCP/IP». Формат — см. osnovy/bag-report.yaml.

- id: net-01
  type: card
  question: Назови уровни модели OSI и что делает каждый.
  answer: |
    Семь уровней, снизу вверх:

    1. **Физический** — передаёт биты: кабель, радио Wi-Fi, оптика.
    2. **Канальный** — доставка внутри локальной сети по MAC-адресам:
       Ethernet, Wi-Fi, коммутатор. Единица — кадр.
    3. **Сетевой** — доставка между сетями по IP-адресам, маршрутизация:
       IP, ICMP, роутер. Единица — пакет.
    4. **Транспортный** — доставка от программы к программе по портам:
       TCP (сегмент), UDP (датаграмма).
    5. **Сеансовый** — управление сеансом связи. В TCP/IP отдельного
       уровня нет, функции разошлись по TLS и приложению.
    6. **Представления** — вид данных: кодировки (UTF-8), сжатие (gzip),
       форматы (JSON, JPEG), шифрование.
    7. **Прикладной** — протоколы программ: HTTP, DNS, SMTP, SSH.

    Запомнить сверху вниз: All People Seem To Need Data Processing.

- id: net-02
  type: card
  question: Чем модель TCP/IP отличается от OSI и как они соотносятся?
  answer: |
    В TCP/IP четыре уровня:

    - **прикладной** — соответствует уровням OSI 7, 6 и 5;
    - **транспортный** — уровню 4 (TCP, UDP);
    - **интернет** — уровню 3 (IP, ICMP);
    - **сетевого доступа** — уровням 2 и 1 (Ethernet, Wi-Fi).

    TCP/IP описывает то, как реально устроен интернет, — по ней работают
    протоколы в каждом устройстве. OSI — эталонная модель с более
    подробным делением: её используют, чтобы объяснять работу сети,
    и спрашивают на собеседованиях. Номера уровней в разговоре
    («проблема на третьем уровне», «балансировщик L7») берут из OSI.

- id: net-03
  type: card
  question: Чем TCP отличается от UDP? Где что используется?
  answer: |
    **TCP** устанавливает соединение (тройное рукопожатие), гарантирует
    доставку, порядок и целостность: подтверждает каждый кусок данных
    и повторяет потерянное. Надёжно, но с задержками.
    Используется там, где потеря байта ломает результат: сайты и API,
    почта, передача файлов, SSH, базы данных.

    **UDP** соединение не устанавливает и ничего не гарантирует: просто
    отправляет датаграммы. Быстро, но пакеты могут теряться и приходить
    не по порядку. Используется там, где важнее успеть, чем получить всё:
    видеозвонки, онлайн-игры, трансляции, DNS-запросы.

    Для мидла: HTTP/3 работает поверх QUIC, а QUIC — поверх UDP.

- id: net-04
  type: card
  question: Что такое тройное рукопожатие TCP?
  answer: |
    Установка TCP-соединения в три шага:

    1. **SYN** — клиент: «хочу соединиться»;
    2. **SYN-ACK** — сервер: «согласен, и я тоже»;
    3. **ACK** — клиент: «принято».

    После этого можно передавать данные — например, HTTP-запрос.
    Если сервер на SYN не отвечает совсем, клиент ждёт и получает
    таймаут. Если на порту никто не слушает, сервер отвечает отказом —
    в браузере это `ERR_CONNECTION_REFUSED`.

- id: net-05
  type: card
  question: Что происходит, когда вводишь URL в браузере и нажимаешь Enter?
  answer: |
    Кратко, по шагам:

    1. Браузер разбирает URL: схема, хост, порт (для https по умолчанию
       443), путь.
    2. **DNS**: ищет IP хоста — в кэше браузера и системы, затем
       спрашивает DNS-сервер.
    3. Пакеты идут по сети через роутеры до сервера (IP).
    4. **TCP**: тройное рукопожатие с сервером на порт 443.
    5. **TLS**: договорённость о шифровании, браузер проверяет
       сертификат — срок, имя, кто выдал.
    6. **HTTP-запрос**: например, `GET /catalog` с заголовками.
    7. Сервер обрабатывает запрос, при необходимости обращается к базе,
       и возвращает **ответ**: код, заголовки, тело.
    8. Браузер разбирает HTML, загружает стили, скрипты, картинки
       и рисует страницу.

    Каждый шаг ломается по-своему, поэтому тот же порядок помогает
    искать, почему «сайт не открывается».

- id: net-06
  type: card
  question: Сайт не открывается. Как ты будешь искать причину?
  answer: |
    Иду по уровням снизу вверх и на каждом шаге проверяю одно:

    - **Сеть у меня есть?** Открываются ли другие сайты, есть ли Wi-Fi.
      Нужен ли VPN для этого адреса.
    - **DNS:** `nslookup` имени. Ошибка `DNS_PROBE_FINISHED_NXDOMAIN` —
      имя не найдено. Сравнить с публичным DNS.
    - **Соединение:** проверка порта (`nc -vz`, `Test-NetConnection`).
      `ERR_CONNECTION_TIMED_OUT` — ответа нет вообще,
      `ERR_CONNECTION_REFUSED` — на порту никто не слушает.
    - **TLS:** ошибки сертификата вроде `NET::ERR_CERT_DATE_INVALID`.
      Смотрю срок, имя, цепочку, время на своём компьютере.
    - **HTTP:** код ответа в DevTools или `curl -v`. 5xx — сервер.
    - **Клиент:** ответ `200`, а страница пустая — ошибки в Console
      и упавшие запросы в Network.

    В баг-репорт пишу, на каком шаге остановилось, и прикладываю текст
    ошибки или вывод `curl -v`.

- id: net-07
  type: quiz
  question: Сколько уровней в модели OSI?
  options:
    - "4"
    - "5"
    - "7"
    - "8"
  correct: 2
  explanation: |
    В OSI семь уровней: физический, канальный, сетевой, транспортный,
    сеансовый, представления, прикладной.

    Четыре уровня — в модели TCP/IP. Иногда её рисуют с пятью,
    разделяя нижний уровень на канальный и физический.

- id: net-08
  type: quiz
  question: Что такое порт?
  options:
    - "Номер, по которому на одном компьютере различают программы, принимающие соединения"
    - "Адрес сетевой карты, который задаёт производитель"
    - "Адрес компьютера в интернете"
    - "Протокол передачи данных"
  correct: 0
  explanation: |
    Порт — число от 0 до 65535, «дверь» на компьютере. На одной машине
    с одним IP работают сайт (443), база данных (5432), SSH (22) — каждая
    программа слушает свой порт. Это транспортный уровень.

    Адрес сетевой карты — MAC-адрес, адрес компьютера — IP-адрес.
    Порт и протокол — разные вещи: на порту 8000 может работать HTTP.

- id: net-09
  type: quiz
  question: Какие порты по умолчанию используют HTTP и HTTPS?
  options:
    - "21 и 22"
    - "8000 и 8443"
    - "53 и 443"
    - "80 и 443"
  correct: 3
  explanation: |
    HTTP — 80, HTTPS — 443. Если порт в адресе не указан, браузер
    подставляет один из них в зависимости от схемы.

    21 — FTP, 22 — SSH, 53 — DNS. 8000 и 8443 — популярные нестандартные
    порты: их пишут в адресе явно, как у TaskFlow на `localhost:8000`.

- id: net-10
  type: quiz
  question: Что проверяет команда ping?
  options:
    - "Открыт ли на сервере порт 443"
    - "Отвечает ли хост на ICMP-запросы и за какое время"
    - "Корректен ли SSL-сертификат сайта"
    - "Какой код HTTP возвращает сайт"
  correct: 1
  explanation: |
    `ping` отправляет ICMP-запрос (сетевой уровень) и показывает,
    ответил ли хост, за сколько миллисекунд и сколько ответов потерялось.
    Заодно видно, в какой IP превратилось имя.

    Порты, сертификаты и коды HTTP `ping` не проверяет. Для порта —
    `nc -vz` или `Test-NetConnection`, для TLS и HTTP — `curl -v`.

- id: net-11
  type: quiz
  question: "Браузер показывает `DNS_PROBE_FINISHED_NXDOMAIN`. Что это значит?"
  options:
    - "DNS не нашёл IP-адрес для этого имени"
    - "Сервер ответил ошибкой 500"
    - "Порт сервера закрыт"
    - "У сертификата сайта истёк срок"
  correct: 0
  explanation: |
    DNS переводит имя сайта в IP-адрес. NXDOMAIN значит «такого имени
    нет»: до соединения с сервером дело не дошло.

    Что проверить: нет ли опечатки, `nslookup` имени через свой
    и через публичный DNS, нужен ли VPN — внутренние имена часто знает
    только корпоративный DNS. Если записи нет у всех — это задача
    для DevOps или администратора домена.

- id: net-12
  type: quiz
  question: Чем `ERR_CONNECTION_REFUSED` отличается от `ERR_CONNECTION_TIMED_OUT`?
  options:
    - "Ничем, это одна ошибка с разными названиями в разных браузерах"
    - "REFUSED — ошибка DNS, TIMED_OUT — ошибка сертификата"
    - "REFUSED — машина ответила, что на порту никто не слушает; TIMED_OUT — ответа не было вообще"
    - "REFUSED — сервер вернул 403, TIMED_OUT — сервер вернул 504"
  correct: 2
  explanation: |
    **Refused** приходит сразу: до машины достучались, но на этом порту
    никто не принимает соединения — сервис не запущен или упал.

    **Timed out** приходит после ожидания: ответа нет совсем. Машина
    выключена, недоступна по сети, нужен VPN или запросы отбрасывает
    сетевой экран.

    Обе ошибки — до HTTP, поэтому кодов ответа здесь нет.

- id: net-13
  type: quiz
  question: Сайт не отвечает на ping. Какой вывод правильный?
  options:
    - "Сайт лежит, нужно заводить баг с высоким приоритетом"
    - "Сломан DNS"
    - "У сайта истёк сертификат"
    - "Пока ничего не известно: многие серверы не отвечают на ICMP, нужно проверить браузером, curl или портом"
  correct: 3
  explanation: |
    `ping` работает по ICMP. Многие серверы и сетевые экраны специально
    не отвечают на него. А сайт работает по TCP на порту 443, и это
    `ping` никак не проверяет.

    Если `ping` показал IP-адрес, значит, DNS как раз работает.
    Проверять доступность сайта нужно браузером, `curl -v` или проверкой
    порта.

- id: net-14
  type: quiz
  question: Зачем нужен NAT?
  options:
    - "Шифрует трафик между устройством и роутером"
    - "Позволяет многим устройствам с частными адресами выходить в интернет через один публичный IP"
    - "Переводит доменное имя в IP-адрес"
    - "Раздаёт запросы между несколькими серверами"
  correct: 1
  explanation: |
    Дома у устройств частные адреса, например `192.168.1.10`. Роутер
    при выходе в интернет подменяет их на свой публичный адрес, а ответы
    возвращает нужному устройству.

    Поэтому серверу все устройства одной квартиры или офиса видны под
    одним IP — это важно при тестировании лимитов «N запросов с IP».
    Имя в адрес переводит DNS, запросы между серверами раздаёт
    балансировщик.

- id: net-15
  type: quiz
  question: "Сервер запущен на `127.0.0.1:5173`. Ты открываешь `http://192.168.1.25:5173` с телефона в той же Wi-Fi-сети. Что будет?"
  options:
    - "Не откроется: сервер принимает соединения только с того же компьютера, нужно слушать 0.0.0.0"
    - "Откроется: телефон и компьютер в одной сети"
    - "Откроется, но только по HTTPS"
    - "Откроется, если в адресе написать localhost"
  correct: 0
  explanation: |
    `127.0.0.1` — адрес «этот компьютер». Сервер, который слушает его,
    принимает только соединения изнутри той же машины. Запрос с телефона
    приходит на сетевой адрес компьютера, а там этот сервер не слушает.

    Чтобы открыть доступ из сети, сервер запускают на `0.0.0.0` — «все
    интерфейсы». `localhost` на телефоне указывает на сам телефон.

- id: net-16
  type: quiz
  question: К какому уровню OSI обычно относят TLS?
  options:
    - "К транспортному: TLS — часть TCP"
    - "К сетевому, вместо IP"
    - "Обычно к представления (6) или к «5–6»; в TCP/IP — к прикладному. Однозначного ответа нет"
    - "К физическому: шифрование делает сетевая карта"
  correct: 2
  explanation: |
    TLS работает поверх TCP и под HTTP. По функции — шифрование — его
    обычно относят к 6-му уровню, представления, или к «5–6». Встречается
    и формулировка «между транспортным и прикладным». В TCP/IP TLS
    входит в прикладной уровень.

    На собеседовании хороший ответ — назвать вариант и сказать, что
    модель тут спорная. HTTPS — это HTTP (7) поверх TLS поверх TCP (4).
