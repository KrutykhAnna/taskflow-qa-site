# Вопросы темы «Клиент-сервер и URL». Формат — см. osnovy/bag-report.yaml.

- id: cs-01
  type: card
  question: Что такое клиент-серверная архитектура?
  answer: |
    Это схема, в которой есть две роли:

    - **клиент** — отправляет запрос: браузер, мобильное приложение,
      Swagger, Postman или другой сервер;
    - **сервер** — принимает запрос, обрабатывает его и возвращает ответ.

    Запрос начинает клиент. Решения принимает и данные хранит сервер
    (вместе с базой данных), клиент показывает результат.

    У одного сервера обычно много клиентов: сайт, приложения для Android
    и iPhone, интеграции. «Клиент» и «сервер» — это роли в конкретном
    запросе: сервер магазина, обращаясь к банку, сам становится клиентом.

- id: cs-02
  type: card
  question: Из каких частей состоит URL?
  answer: |
    На примере `https://shop.example.ru:8443/catalog?brand=apple&page=2#reviews`:

    - **схема** (протокол) — `https`;
    - **хост** — `shop.example.ru`: поддомен `shop`, домен `example`,
      зона `ru`. Вместо имени может быть IP-адрес;
    - **порт** — `8443`. Если не указан — 80 для http, 443 для https;
    - **путь** — `/catalog`, какой ресурс нужен;
    - **query-параметры** — `brand=apple&page=2`: после `?`, пары
      ключ=значение через `&`;
    - **фрагмент** — `#reviews`, место на странице. На сервер не уходит.

- id: cs-03
  type: card
  question: Чем HTTP отличается от HTTPS?
  answer: |
    HTTPS — это тот же HTTP, но данные между клиентом и сервером
    **шифруются**. Тот, кто перехватит их по дороге, например в общественном
    Wi-Fi, не прочитает ни пароль, ни содержимое страницы.

    Порты по умолчанию тоже разные: 80 у HTTP, 443 у HTTPS.

    Важная оговорка: замочек в браузере значит только, что соединение
    зашифровано. Он не значит, что сайт честный: мошеннический сайт тоже
    может работать по HTTPS.

- id: cs-04
  type: card
  question: Чем тонкий клиент отличается от толстого?
  answer: |
    - **Тонкий клиент** почти всё отдаёт серверу: показывает данные
      и передаёт действия пользователя. Пример — сайт, где страницы
      приходят с сервера готовыми.
    - **Толстый клиент** сам делает заметную часть работы: считает,
      проверяет, хранит данные, может работать без сети. Пример —
      компьютерная игра, программа бухгалтерии, почта с офлайн-режимом.

    Для тестировщика разница в том, где искать баги. У тонкого клиента
    они в основном на сервере. У толстого — и на клиенте, и на сервере,
    и в синхронизации между ними.

    Граница размыта: современный сайт часто сам проверяет формы
    и сортирует списки, то есть «толще», чем кажется.

- id: cs-05
  type: card
  question: Как понять, где баг — на фронтенде или на бэкенде?
  answer: |
    Основной приём — **обойти клиент**: отправить тот же запрос напрямую
    на сервер через Swagger, Postman или curl.

    - Сервер ответил правильно, а на экране неправильно — скорее всего,
      баг на клиенте.
    - Сервер сам вернул неправильные данные или ошибку — баг на сервере.

    Ещё помогает:

    - **сравнить клиентов** — ошибка и на сайте, и в приложении указывает
      на сервер, он у них общий; ошибка в одном браузере — на клиент;
    - **посмотреть запрос и ответ** в DevTools, на вкладке Network:
      что клиент отправил и что получил.

    Отдельный случай — проверка только на клиенте. Если форма не даёт
    ввести неправильное значение, а сервер его принимает, это баг сервера:
    клиент можно обойти.

- id: cs-06
  type: card
  question: Почему токены и личные данные нельзя передавать в параметрах URL?
  answer: |
    Адрес с параметрами «расходится» по многим местам:

    - **история браузера** — увидит любой, кто сядет за компьютер;
    - **логи** серверов и промежуточных узлов — их читают многие люди;
    - **заголовок Referer** — адрес может уйти чужому сайту при переходе
      по внешней ссылке. Современные браузеры по умолчанию отрезают
      параметры, но полагаться на это нельзя;
    - **пересылка** — пользователь копирует ссылку другу вместе с токеном.

    Токен в ссылке — ключ к чужим данным. Чувствительные данные передают
    в теле запроса или в заголовках. Если токен в ссылке неизбежен, как
    в письме для сброса пароля, он должен быть одноразовым и короткоживущим.

- id: cs-07
  type: quiz
  question: Какой порт используется по умолчанию для HTTPS?
  options:
    - "80"
    - "8080"
    - "443"
    - "22"
  correct: 2
  explanation: |
    Для HTTPS по умолчанию порт 443, для HTTP — 80. Если в адресе порт
    не указан, браузер подставляет один из них в зависимости от схемы.

    Поэтому `https://example.com` и `https://example.com:443` — один и тот
    же адрес, а нестандартный порт, например `8000`, пишут явно.

- id: cs-08
  type: quiz
  question: Какая часть URL не отправляется на сервер?
  options:
    - "Путь"
    - "Query-параметры"
    - "Порт"
    - "Фрагмент (всё после #)"
  correct: 3
  explanation: |
    Фрагмент обрабатывает браузер: прокручивает к нужному месту страницы
    или передаёт его коду на клиенте. Серверу он не уходит.

    Следствия: фрагмента нет в логах сервера, а параметр, случайно
    оказавшийся после `#`, сервер не увидит.

- id: cs-09
  type: quiz
  question: Что делает DNS?
  options:
    - "Переводит доменное имя в IP-адрес"
    - "Шифрует данные между клиентом и сервером"
    - "Распределяет запросы между несколькими серверами"
    - "Хранит историю посещённых адресов"
  correct: 0
  explanation: |
    DNS — как телефонная книга: людям удобно помнить имя `example.com`,
    а компьютерам для связи нужен IP-адрес. DNS переводит одно в другое.

    Шифрование — это HTTPS. Распределение запросов между серверами —
    работа балансировщика.

- id: cs-10
  type: quiz
  question: "`/catalog` открывает страницу, а `/catalog/` отдаёт 404. Как к этому отнестись?"
  options:
    - "Это нормально: это разные адреса, и пользователь должен набирать правильный"
    - "Это повод для баг-репорта: пользователи попадают на оба варианта, обычно один перенаправляют на другой"
    - "Это баг браузера, сервер тут ни при чём"
    - "Это не важно, слэш в конце адреса браузер всегда убирает сам"
  correct: 1
  explanation: |
    Формально это два разных адреса. Но пользователи набирают адрес руками,
    копируют ссылки, приходят из поисковиков — и вариант со слэшем или без
    него встречается постоянно.

    Хорошая практика — отдавать одну и ту же страницу или перенаправлять
    с одного варианта на другой. `404` на рабочую страницу — баг, обычно
    с невысоким приоритетом.

- id: cs-11
  type: quiz
  question: Пользователь ищет «кофе & чай». Как значение должно попасть в query-параметр?
  options:
    - "Как есть: `?q=кофе & чай`"
    - "Без пробелов: `?q=кофе&чай`"
    - "Закодированным: русские буквы и `&` через `%`, пробел — `%20` или `+`"
    - "В кавычках: `?q=\"кофе & чай\"`"
  correct: 2
  explanation: |
    `&` в URL разделяет параметры. Если его не закодировать (`%26`),
    сервер получит `q=кофе ` и непонятный параметр `чай`.

    Русские буквы тоже кодируются: `кофе` → `%D0%BA%D0%BE%D1%84%D0%B5`.
    Пробел в query — `%20` или `+`. Поэтому сам `+` внутри значения
    тоже нужно кодировать — `%2B`, иначе `C++` превратится в `C` и пробелы.

- id: cs-12
  type: quiz
  question: Форма не даёт ввести возраст меньше 18, а через API пользователь с возрастом 12 создаётся. Что это значит?
  options:
    - "Всё в порядке: обычный пользователь через форму это не обойдёт"
    - "Проверка есть только на клиенте — сервер тоже должен проверять, это баг"
    - "Это баг Swagger или Postman: они отправляют запросы неправильно"
    - "Нужно убрать проверку из формы, чтобы клиент и сервер вели себя одинаково"
  correct: 1
  explanation: |
    Клиент можно обойти: другое приложение, старая версия сайта,
    интеграция, человек с Postman. Сервер — единственное место, через
    которое проходят все запросы, поэтому важные правила обязан проверять он.

    Проверка в форме — удобство для пользователя: подсказка до отправки.
    Её убирать не нужно, нужно добавить проверку на сервере.

- id: cs-13
  type: quiz
  question: Что значит `localhost` в адресе `http://localhost:8000/docs`?
  options:
    - "Компьютер, на котором открыт браузер"
    - "Общий тестовый сервер команды"
    - "Сервер в интернете, ближайший к пользователю"
    - "Любой компьютер в той же Wi-Fi-сети"
  correct: 0
  explanation: |
    `localhost` и IP-адрес `127.0.0.1` всегда указывают на тот же компьютер,
    где открыт браузер или запущен запрос.

    Поэтому ссылку на `localhost` бесполезно отправлять коллеге: его браузер
    будет искать сервер на его собственном компьютере.

- id: cs-14
  type: quiz
  question: "В адресе параметр повторяется: `?color=red&color=blue`. Что получит сервер?"
  options:
    - "Ошибку: сервер обязан ответить 400"
    - "Всегда только первое значение — red"
    - "Всегда только последнее значение — blue"
    - "Зависит от сервера: это нужно уточнить в требованиях и проверить"
  correct: 3
  explanation: |
    Единого правила нет. Одни серверы берут первое значение, другие —
    последнее, третьи собирают список из обоих.

    Если фича позволяет выбрать несколько значений, например фильтр
    по нескольким цветам, ожидаемое поведение нужно уточнить и проверить
    отдельно.
