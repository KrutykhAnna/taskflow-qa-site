# Вопросы темы «Практикум: API-фича целиком». Формат — см. osnovy/bag-report.yaml.

- id: apf-01
  type: card
  question: Из каких шагов состоит тестирование API-фичи от требований до релиза?
  answer: |
    1. **Требования** — правила с номерами разделов, дыры и вопросы аналитику.
    2. **Карта фичи** — эндпоинты, роли, состояния, зависимости; матрица доступа.
    3. **Риски и приоритеты** — что сломается больнее всего.
    4. **Тест-дизайн по слоям** — доступ, вход, правила, ответ, побочные
       эффекты, повтор. Результат — чек-лист.
    5. **Данные и пользователи** — кто нужен, как создать, как не мешать коллегам.
    6. **Инструменты** — коллекция и Environment, тесты, data-driven, `curl`.
    7. **Прогон** — смоук, позитив, негатив, права, побочные эффекты, логи.
    8. **Баг-репорты** — `curl` без токена, раздел спецификации, `X-Request-ID`.
    9. **Отчёт о тестировании** — что проверено и нет, баги, риски, вывод.
    10. **Ретест и регресс** после исправления, кандидаты в автотесты.

    Шаги не строго линейны: на прогоне находишь дыру в требованиях и
    возвращаешься к шагу 1. Но ни один шаг не пропускается совсем.

- id: apf-02
  type: quiz
  question: Зачем строить матрицу доступа «действие × роль» перед прогоном?
  options:
    - "Чтобы заменить ею чек-лист: после матрицы другие проверки не нужны"
    - "Чтобы разработчик знал, под каким пользователем ты будешь заходить"
    - "Чтобы каждая пара «роль — действие» стала проверкой с ожидаемым кодом"
    - "Чтобы проверять права только под администратором и экономить время"
  correct: 2
  explanation: |
    Матрица превращает права в список конкретных проверок: строка — действие,
    столбец — роль, в ячейке — ожидаемый код и источник. Без неё «проверил
    права» обычно значит «проверил под одной-двумя ролями».

    Матрица — это слой «доступ» чек-листа. Вход, правила, ответ и побочные
    эффекты она не заменяет.

- id: apf-03
  type: quiz
  question: |
    Интернет-магазин. В требованиях: «чужие объекты не раскрываются».
    Покупатель с валидным токеном запрашивает `GET /orders/{id}` заказа
    другого покупателя. Заказ существует. Что ожидать?
  options:
    - "`404`, потому что покупатель не должен узнать, что заказ есть"
    - "`403`, потому что заказ существует, а прав у пользователя нет"
    - "`401`, потому что пользователь не авторизован для этого заказа"
    - "`422`, потому что запрос к чужому заказу не проходит проверку"
  correct: 0
  explanation: |
    `401` — про аутентификацию: нет токена или он невалиден. Здесь токен есть.

    Между `403` и `404` решает спецификация. Если она требует не раскрывать
    чужие объекты, покупатель получает `404` — так же, как на несуществующий
    заказ. Иначе по разнице `403` и `404` можно перебором узнать, какие
    заказы есть. `403` достаётся тому, кто объект видит, но прав не хватает.

    Ловушка: «объект существует — значит `403`». Это верно, только если
    спецификация не просит его скрывать.

- id: apf-04
  type: card
  question: Удаление в API мягкое. Что проверить, кроме кода `204`?
  answer: |
    Мягкое удаление ставит отметку «удалено», запись остаётся в базе. Значит,
    каждое место, где данные читаются, должно эту отметку учитывать.

    - `GET` списка: объекта нет в `items`, `total` уменьшился.
    - `GET` по `id`, если такой есть: `404`, как у несуществующего.
    - Повторный `DELETE` и `PATCH` удалённого — по спецификации, обычно `404`.
    - Счётчики у родителя: «5 комментариев» не считают удалённые.
    - Другие роли и клиенты: удалённое не видно ни наблюдателю, ни
      администратору, ни в выгрузках партнёрам — если спецификация не говорит иначе.
    - Каскад: при удалении родителя помечаются дочерние объекты.

    А то, что запись физически осталась в базе, проверяют запросом к базе —
    этому научимся в блоке про SQL.

- id: apf-05
  type: quiz
  question: |
    Спецификация: «автор комментария определяется по токену». Ты отправляешь
    `POST` с телом `{"text": "Привет", "authorId": 7}`, где 7 — чужой
    пользователь. Что ожидать?
  options:
    - "`201` и `authorId: 7`: клиент явно указал автора, сервер его послушал"
    - "`403`: передавать `authorId` может только администратор проекта"
    - "`500`: сервер не знает, что делать с полем, которого нет в схеме"
    - "Поле не применится: автор в ответе и в `GET` — тот, чей токен"
  correct: 3
  explanation: |
    Если автор берётся из токена, поле `authorId` в теле должно быть
    проигнорировано или отклонено ошибкой валидации — как решит спецификация.
    Но сохранить его нельзя.

    Если сервер сохранил `authorId: 7` — это **mass assignment**: можно писать
    от чужого имени. Проверяют это и в ответе, и вторым запросом `GET`.

- id: apf-06
  type: quiz
  question: |
    Хитрый вопрос. Тест в коллекции: `POST` комментария → проверка, что код `201`.
    Тест зелёный. Можно отметить проверку «создание комментария» как passed?
  options:
    - "Да: `201 Created` по определению значит, что объект сохранён в базе"
    - "Нет: ещё нужно проверить тело и вторым запросом найти объект"
    - "Да, если в ответе есть заголовок `X-Request-ID` — значит, запрос дошёл"
    - "Нет: код `201` для комментариев неправильный, нужен `200 OK`"
  correct: 1
  explanation: |
    Код — это то, что сервер **сказал**. Что он **сделал**, показывает второй
    запрос: комментарий появился в списке, `total` вырос, текст и автор те,
    что ожидались. Плюс тело ответа: `text`, `authorId`, `taskId` и
    заголовок `Location`.

    Бывает, что сервер отвечает `201`, а запись не удалась или сохранилось
    не то. Такой баг виден только побочным эффектом.

- id: apf-07
  type: card
  question: Как готовить тестовые данные на общем стенде, чтобы не мешать коллегам и себе?
  answer: |
    - **Свои пользователи** с уникальным email — например, с меткой времени
      прогона. Фиксированный email на втором прогоне даст `409`.
    - **Свои объекты** с понятным префиксом: `qa13_…`, `autotest_…`. Видно,
      чьё это, легко найти и удалить.
    - **Не опираться на чужие данные** и фиксированные `id`: «создай свою
      задачу и запомни её `id`», а не «возьми задачу 17».
    - **Подготовка — папка коллекции**: регистрация, роли, объекты — одной
      кнопкой. Сбросили стенд — восстановил за минуту.
    - **Не делать разрушительного**: не сбрасывать базу, не менять чужие
      проекты, не повышать роли без нужды.
    - **Убирать за собой**: удалить свои объекты после прогона.

- id: apf-08
  type: quiz
  question: Какая строка отчёта о тестировании чаще всего отсутствует у новичков, хотя нужна команде для решения о релизе?
  options:
    - "Название фичи, номер задачи в трекере и ссылка на требования"
    - "Список всех проверок с шагами и ожидаемым результатом"
    - "Что не проверено и почему — и какие риски из этого следуют"
    - "Имена разработчиков фичи и даты, когда они делали каждую часть"
  correct: 2
  explanation: |
    Без строки «что не проверено» команда считает, что проверено всё.
    А решение о релизе принимается именно по рискам: что может сломаться
    у пользователей, о чём мы не знаем.

    Полный список проверок в отчёт не переносят — это чек-лист, на него
    дают ссылку. Отчёт короткий: фича, версия и стенд, период, что проверено,
    что нет, баги по серьёзности, риски, вывод.

- id: apf-09
  type: card
  question: Как написать рекомендацию к релизу, если найдены баги разной серьёзности?
  answer: |
    Рекомендация — это вывод с причиной и вариантами, а не «решайте сами».

    1. **Вывод одной фразой**: можно выпускать / нельзя / можно с условиями.
    2. **Причина**: какой баг или непроверенная область мешает и чем это
       грозит пользователю — деньги, данные, главный сценарий.
    3. **Варианты**: исправить и перепроверить — сколько займёт; выпустить
       с ограничением — каким; отложить часть фичи.
    4. **Что не блокирует**: minor-баги — в следующий релиз.

    Тестировщик рекомендует, решает команда. Но решение должно приниматься
    с открытыми глазами: что известно, что нет и чем рискуем.

- id: apf-10
  type: quiz
  question: Чем ретест отличается от регресса?
  options:
    - "Ретест повторяет проверку, нашедшую баг; регресс ищет, что сломалось рядом"
    - "Ретест делает разработчик перед сдачей, регресс — тестировщик после релиза"
    - "Ретест — это автотесты в пайплайне, регресс — ручные проверки перед релизом"
    - "Ретест и регресс — одно и то же, просто в разных компаниях называют по-разному"
  correct: 0
  explanation: |
    **Ретест** отвечает на вопрос «исправлен ли этот баг?» — повторяем ту же
    проверку на новой версии.

    **Регресс** отвечает на вопрос «не сломали ли что-то рядом?». Исправили
    права на изменение — проверяем и права на удаление, и другие роли, и
    соседние эндпоинты: они часто в том же коде.

    Закрыть баг по одному ретесту без регресса вокруг — частая ошибка.

- id: apf-11
  type: quiz
  question: Какие проверки из ручной коллекции в первую очередь стоит оставить автотестами в пайплайне?
  options:
    - "Все до одной: чем больше автотестов, тем меньше нужно ручного тестирования"
    - "Только те, что сейчас падают: зелёные тесты в пайплайне бесполезны"
    - "Только проверки интерфейса: API и так покрывают разработчики"
    - "Смоук, матрицу прав на чужие данные и проверки, которые нашли баги"
  correct: 3
  explanation: |
    В пайплайн берут то, что дорого пропустить и легко повторять: главный
    сценарий, права на чужие данные, проверки, которые уже ловили баги, —
    чтобы баг не вернулся. Плюс то, что долго гонять руками: data-driven границы.

    Не всё стоит автоматизировать: исследовательские проверки и редкие
    сценарии дешевле делать руками. И автотест полезен, только если может
    покраснеть — ложно-зелёный хуже, чем никакого.

- id: apf-12
  type: quiz
  question: |
    Хитрый вопрос. Ты прогнал 30 проверок по фиче — все passed, багов 0.
    Что из этого следует?
  options:
    - "Фича хорошая: если бы баги были, 30 проверок хоть один бы нашли"
    - "Ничего, пока не видно покрытия: какие роли, слои и эффекты проверены"
    - "Ты плохо искал: в любой фиче есть баги, ноль багов не бывает"
    - "Нужно прогнать те же 30 проверок ещё раз, чтобы исключить случайность"
  correct: 1
  explanation: |
    Ноль багов — результат, если его можно доказать покрытием. Матрица прав
    пройдена целиком, все слои, тесты проверяют тело и второй `GET` и умеют
    краснеть — тогда «0 багов» значит «в проверенных пределах фича
    соответствует требованиям».

    Если все 30 проверок под одним пользователем и только на код ответа —
    ноль багов ничего не значит. Повторный прогон тех же проверок покрытие
    не увеличит.

- id: apf-13
  type: card
  question: Требования молчат о важном случае. Что делает тестировщик?
  answer: |
    Не додумывает молча и не превращает догадку в ожидаемый результат.

    1. **Записывает вопрос аналитику**: что неясно, почему важно, что
       изменится в проверках от ответа.
    2. **Ищет другие источники** — похожие фичи, решения в задаче. Ответ
       разработчика — гипотеза, а не истина.
    3. **Если ответа нет к прогону** — фиксирует допущение явно: «считаю,
       что X; проверено как X». В матрице такая ячейка — «?».
    4. **В отчёте** — строка в «Рисках»: какие правила проверены по допущению.

    Найденное «не так, как мне кажется» в таком случае — вопрос, а не баг.

- id: apf-14
  type: card
  question: На тестирование фичи вместо дня дали два часа. Как распределишь время?
  answer: |
    Сразу говорю, что проверю не всё, и называю, что именно.

    Порядок по риску:

    1. **Смоук** — главный сценарий целиком.
    2. **Права на самое опасное** — изменение и удаление чужого под ролями,
       которые не должны мочь.
    3. **Побочные эффекты** главных действий — что видит `GET` после
       изменения и удаления.
    4. **Самые вероятные ошибки ввода** — границы, пустое значение, по одному
       представителю класса.

    Не успел — пишу в отчёт: «не проверено» и «риски». Рекомендация —
    с условием. Нельзя делать вид, что за два часа проверено то же, что за день.

- id: apf-15
  type: quiz
  question: |
    Хитрый вопрос. Тестировщик говорит: «Права проверил — всё прогнал под
    администратором, у него доступ ко всему, значит, и у остальных сработает».
    В чём ошибка?
  options:
    - "Ошибки нет: если у администратора всё работает, логика прав верна"
    - "Ошибка только в том, что администратора нужно было проверить дважды"
    - "Админ обходит проверки, и ошибки в правах ролей под ним не видны"
    - "Ошибка в том, что под администратором нельзя работать на тестовом стенде"
  correct: 2
  explanation: |
    У администратора обычно обходной путь: он может всё. Поэтому ошибка
    в правилах для обычных ролей под ним не проявится. Автор не может изменить
    свой отзыв, а другой покупатель удаляет чужой — под админом ничего этого
    не увидеть.

    Администратор — отдельный столбец матрицы доступа, а не способ проверить
    все роли разом.

- id: apf-16
  type: quiz
  question: |
    Хитрый вопрос. В чек-листе в колонке «Ожидание» тестировщик записал то,
    что сервер возвращает сейчас: «так работает — значит, так и должно».
    Чем это плохо?
  options:
    - "Такая проверка проходит всегда и не может найти ни одного бага"
    - "Ничем: текущее поведение — самый точный источник ожидания"
    - "Только тем, что ответ сервера может измениться после следующего релиза"
    - "Тем, что ожидание нужно брать из Swagger, а не из ответа сервера"
  correct: 0
  explanation: |
    Ожидание берут из спецификации и требований — у каждой проверки есть
    источник. Если взять его из ответа сервера, любой баг автоматически
    становится «ожиданием», и проверка всегда проходит.

    Swagger тоже не источник истины: он описывает, что сделано, а не что
    должно быть. Если требования молчат — это вопрос аналитику, а не повод
    подставить текущий ответ.
