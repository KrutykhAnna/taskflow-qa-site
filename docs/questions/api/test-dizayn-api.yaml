# Вопросы темы «Тест-дизайн для API». Формат — см. osnovy/bag-report.yaml.

- id: atd-01
  type: card
  question: Что ты проверишь в одном эндпоинте API? Назови слои проверок.
  answer: |
    Иду по слоям, а не наугад:

    1. **Доступ** — без токена, с испорченным токеном, под каждой ролью,
       с чужим объектом.
    2. **Входные данные** — path, query и тело: обязательность, типы,
       форматы, границы, enum, `null`, пустые строки, лишние поля,
       спецсимволы, очень длинные значения.
    3. **Бизнес-правила и состояния** — уникальность, лимиты, допустимые
       переходы статусов.
    4. **Ответ** — код, тело по схеме, значения, заголовки вроде
       `Location`, формат ошибки.
    5. **Побочные эффекты** — что реально изменилось, проверяю вторым
       запросом `GET`. И что не должно было измениться.
    6. **Повтор и параллельность** — дубль запроса, одновременные запросы.

    Коротко — нефункциональное: время и размер ответа.

- id: atd-02
  type: quiz
  question: "Эндпоинт `POST /orders` создаёт заказ. Какая из проверок негативная?"
  options:
    - "Создать заказ с одним товаром и проверить `201`"
    - "Создать заказ с максимально допустимым количеством товара"
    - "Отправить заказ без обязательного поля `productId`"
    - "Создать заказ и найти его через `GET /orders/{id}`"
  correct: 2
  explanation: |
    **Негативная** проверка отправляет то, что сервер должен **отклонить**:
    здесь — запрос без обязательного поля. Ожидание — ошибка валидации
    с понятным сообщением, и заказ не создан.

    Максимальное количество — это граница **внутри** допустимого, то есть
    позитивная проверка. Проверка через `GET` — тоже позитивная, она про
    побочный эффект.

- id: atd-03
  type: quiz
  question: "Параметр `limit` по спецификации принимает значения от 1 до 100. Какие значения проверить по граничным значениям?"
  options:
    - "1, 50, 100"
    - "0, 1, 100, 101"
    - "Только 1 и 100"
    - "-100, 0, 100, 1000"
  correct: 1
  explanation: |
    Граничные значения — сама граница и ближайшее значение за ней с каждой
    стороны: `0` и `1` на нижней, `100` и `101` на верхней.

    Отдельно, как представители других классов, стоит проверить
    отрицательное число, не число и отсутствие параметра — тогда
    применяется значение по умолчанию.

- id: atd-04
  type: quiz
  question: Как проверить обязательное поле в теле запроса?
  options:
    - "Достаточно отправить запрос без этого поля"
    - "Достаточно отправить пустую строку"
    - "Обязательность проверяет интерфейс, через API её проверять не нужно"
    - "Отправить без поля, с `null` и с пустой строкой — это три разных случая"
  correct: 3
  explanation: |
    «Нет поля», `null` и `""` — разные входные данные, и сервер может
    обрабатывать их по-разному. Частый баг: отсутствие поля сервер
    ловит, а `null` пропускает и сохраняет пустое значение.

    Интерфейс тут не помощник: форма может не дать отправить пустое
    поле, но через API отправить можно что угодно.

- id: atd-05
  type: quiz
  question: "Фильтр `GET /orders?status=CANCELLED`, отменённых заказов нет. Какой ответ обычно ожидается?"
  options:
    - "`200`, пустой список `items` и `total: 0`"
    - "`404 Not Found`"
    - "`204 No Content`"
    - "`400 Bad Request`"
  correct: 0
  explanation: |
    Ресурс «список заказов» существует, просто в нём сейчас ничего не
    подходит под фильтр. Это успешный ответ: `200` и пустой массив.

    `404` сообщает, что не найден сам ресурс, и клиент примет пустой
    список за ошибку. `400` — для неверного запроса, а этот запрос
    правильный.

- id: atd-06
  type: card
  question: Как протестировать параметр типа enum?
  answer: |
    - **Каждое значение** по отдельности — их обычно немного, это дёшево.
    - **Неизвестное значение** — ожидание по спецификации, обычно `400`
      или `422`. Опасно, если сервер молча игнорирует фильтр и отдаёт
      все записи.
    - **Другой регистр** — `paid` вместо `PAID`. Поведение должно быть
      одинаковым для всех значений и описано в спецификации.
    - **Пустое значение** и, если API поддерживает, несколько значений
      сразу.

    В теле запроса — то же самое плюс `null` и отсутствие поля.

- id: atd-07
  type: quiz
  question: "Сортировка размеров одежды по возрастанию вернула L, M, S, XL, XS. Что это?"
  options:
    - "Правильный порядок: сервер всегда сортирует строки по алфавиту"
    - "Нестабильная сортировка: нужен вторичный ключ"
    - "Алфавитная сортировка вместо логической: XS должен быть первым"
    - "Ошибка пагинации: часть размеров пропала"
  correct: 2
  explanation: |
    Строки сравниваются по буквам: L < M < S < X. Поэтому XS, самый
    маленький размер, оказался последним.

    У размеров, статусов, приоритетов, месяцев есть **смысловой** порядок.
    Если спецификация требует его, алфавитная сортировка — баг. Если
    спецификация молчит — вопрос аналитику. Проверяют такие поля на всех
    значениях, а не на двух: два значения могут случайно совпасть с
    алфавитом.

- id: atd-08
  type: quiz
  question: Зачем списку нужна вторичная сортировка, например по `id`?
  options:
    - "Чтобы ответ приходил быстрее"
    - "Чтобы записи с одинаковым значением основного поля шли в стабильном порядке и пагинация не давала дублей и пропусков"
    - "Чтобы можно было сортировать по двум полям одновременно по запросу клиента"
    - "Она нужна только для сортировки по убыванию"
  correct: 1
  explanation: |
    Если у десяти товаров одна цена, база вправе отдавать их в любом
    порядке — и он может меняться от запроса к запросу. Тогда товар
    попадает на две страницы, а соседний — ни на одну.

    Вторичный ключ делает порядок однозначным. Тестировщик проверяет это
    на данных с одинаковыми значениями: склеивает страницы и сравнивает
    с одним большим запросом.

- id: atd-09
  type: card
  question: Почему при offset-пагинации появляются дубли и пропуски?
  answer: |
    Две разные причины.

    **Нестабильный порядок.** У записей одинаковое значение поля
    сортировки, а вторичного ключа нет. База отдаёт их по-разному от
    запроса к запросу. Видно даже на неподвижных данных. Это баг.

    **Данные меняются во время листания.** `offset=20` значит «пропусти 20
    записей». Если в начало списка добавили 3 записи, всё сдвинулось:
    3 записи первой страницы придут повторно. При удалении — наоборот,
    записи пропадут. Это свойство offset-пагинации. Решения —
    cursor-пагинация или договорённость, что так допустимо.

    Проверка: пройти список маленькими страницами и сравнить с одним
    большим запросом; отдельно — добавить запись между страницами.

- id: atd-10
  type: quiz
  question: Чем cursor-пагинация отличается от offset-пагинации?
  options:
    - "Cursor-пагинация всегда возвращает все записи одним ответом"
    - "Курсор — это номер страницы, который клиент считает сам"
    - "Отличий нет, это два названия одного и того же"
    - "Клиент передаёт метку последней полученной записи, и сервер отдаёт записи после неё — без сдвигов при добавлении"
  correct: 3
  explanation: |
    Курсор — непрозрачная метка позиции, например закодированный `id`
    последней записи. Сервер отдаёт записи после неё и новый курсор.
    Добавление записей в начало не сдвигает следующую страницу.

    Что проверить: на последней странице курсора нет; испорченный курсор —
    ошибка, а не `500`; курсор от одного фильтра не работает с другим.
    Перейти сразу на десятую страницу обычно нельзя — это ограничение
    подхода, а не баг.

- id: atd-11
  type: quiz
  question: "Ты проверяешь поиск по каталогу. Как относиться к запросу из одних пробелов `q=\"   \"`?"
  options:
    - "Как к отдельному классу ввода: выяснить, обрезает ли сервер пробелы, и сравнить с поведением для пустой строки и со спецификацией"
    - "Пропустить: пробелы — то же самое, что обычный текст"
    - "Пропустить: интерфейс не даст отправить такой запрос"
    - "Всегда ожидать `200` и пустой список"
  correct: 0
  explanation: |
    Сервер может обрезать пробелы и получить пустую строку, искать пробел
    как символ или вернуть ошибку. Какое поведение правильное — решает
    спецификация, а не догадка тестировщика.

    Поэтому строка из пробелов — отдельный класс эквивалентности, рядом
    с пустой строкой. Интерфейс не защищает: через API отправить можно
    что угодно.

- id: atd-12
  type: quiz
  question: "Поиск по заказам со строкой `%` вернул все заказы. Что это, скорее всего?"
  options:
    - "Нормальное поведение: `%` — служебный символ URL"
    - "Сервер ищет через `LIKE` и не экранирует спецсимволы: `%` сработал как «любые символы»"
    - "Сервер упал и вернул данные из кэша"
    - "Ошибка пагинации"
  correct: 1
  explanation: |
    В шаблонах `LIKE` знак `%` значит «любая последовательность символов»,
    `_` — «один любой символ». Если ввод не экранирован, поиск `%` найдёт
    всё, а поиск `50%` — не только строки с буквальным «50%».

    Ожидание — поиск находит буквальный текст. Отдельно стоит проверить,
    что даже «всё» не выходит за рамки прав пользователя.

- id: atd-13
  type: card
  question: Что такое mass assignment и как его проверить?
  answer: |
    **Mass assignment** — массовое присвоение. Сервер берёт все поля из
    тела запроса и записывает их в объект, а не только разрешённые.

    Пример: `PATCH /users/me` с телом `{"name": "Анна", "role": "ADMIN"}`.
    Форма профиля поле «роль» не показывает, но если сервер его
    сохранил — пользователь стал администратором.

    Как проверить: в запросы создания и изменения добавляю поля, которые
    клиент менять не должен: `role`, `isAdmin`, `id`, `ownerId`,
    `balance`, `price`. Потом проверяю вторым запросом `GET`, что они не
    изменились. Ожидание — поля проигнорированы или запрос отклонён.

- id: atd-14
  type: quiz
  question: "`POST /orders` ответил `201`, тело по схеме. Что ещё обязательно проверить?"
  options:
    - "Ничего: `201` подтверждает, что заказ создан"
    - "Только время ответа"
    - "Побочные эффекты: `GET` по адресу из `Location`, появление заказа в списке, то, что не должно было измениться"
    - "Что повторный такой же `POST` возвращает тот же `id`"
  correct: 2
  explanation: |
    Код и тело — это то, что сервер **сообщил**. Что он сделал на самом
    деле, видно только вторым запросом. Бывает, что `201` пришёл, а запись
    не сохранилась или не дошла до других частей системы.

    Повторный `POST` обычно создаёт второй заказ — `POST` не идемпотентен.
    Вернуть тот же `id` он должен только при ключе идемпотентности.

- id: atd-15
  type: card
  question: Что такое pairwise и как применить его к API?
  answer: |
    **Pairwise** — попарное тестирование. Набор проверок строится так,
    чтобы каждая **пара** значений любых двух параметров встретилась хотя
    бы в одной проверке.

    Для API это query-параметры списка или поля тела. Пример: 5
    параметров с 5, 4, 3, 3 и 2 значениями — полный перебор 360
    запросов, попарный набор — около 20–25.

    Набор строит генератор, например PICT. Невозможные комбинации
    описывают ограничениями в модели. Pairwise ловит ошибки, которые
    зависят от пары параметров, но может пропустить зависимости трёх —
    их добавляют точечно, по риску.

- id: atd-16
  type: quiz
  question: "Сервер принял в теле неизвестное поле `\"foo\": \"bar\"` и ответил `201`. Как оценить?"
  options:
    - "Всегда баг: сервер обязан отклонять любые лишние поля"
    - "Никогда не баг: лишние поля ни на что не влияют"
    - "Нужно только проверить, что в ответе нет поля `foo`"
    - "Зависит от контракта: игнорировать допустимо, но нужно проверить, что поле не сохранилось, и попробовать реальные запрещённые поля"
  correct: 3
  explanation: |
    Многие API намеренно игнорируют неизвестные поля, чтобы разные версии
    клиентов работали вместе. Если контракт требует отклонять их —
    тогда `201` баг.

    Главное — что стало с полем. Сохранилось — проблема. А если вместо
    `foo` отправить `role` или `ownerId` и сервер его применит — это mass
    assignment. Если контракт молчит — вопрос аналитику.

- id: atd-17
  type: quiz
  question: "В `PATCH /orders/{id}` чем `{\"comment\": null}` отличается от запроса без поля `comment`?"
  options:
    - "Обычно `null` значит «очисти поле», а отсутствие — «не трогай»; это две разные проверки"
    - "Ничем: сервер обрабатывает их одинаково"
    - "`null` в JSON недопустим, сервер должен ответить `400`"
    - "Отсутствие поля очищает его, а `null` оставляет без изменений"
  correct: 0
  explanation: |
    В частичном обновлении «нет поля» и «поле равно `null`» — разные
    намерения клиента. Частый баг — сервер путает их: запрос без поля
    стирает значение, или `null` не очищает его.

    Как именно трактовать `null` — решает спецификация. Тестировщик
    проверяет оба варианта и смотрит результат вторым запросом `GET`.

- id: atd-18
  type: card
  question: Что поиск и фильтры не должны находить?
  answer: |
    - **Чужие данные.** Поиск в «моих заказах» не находит чужие заказы.
      Параметр вроде `userId=17` в query не открывает заказы
      пользователя 17.
    - **Удалённые записи.** Удалённый товар не всплывает в поиске и не
      считается в `total`.
    - **Скрытые поля.** Если по полю искать нельзя — email поставщика,
      внутренний комментарий, — поиск по нему ничего не находит. Иначе
      через поиск можно подбирать скрытые данные.
    - **Лишнее из-за спецсимволов.** `%` и `_` не должны работать как
      шаблон.

    Эти проверки часто забывают, потому что «всё находится» выглядит как
    успех.

- id: atd-19
  type: quiz
  question: "`GET /products?limit=abc` вернул `500`. Как оценить?"
  options:
    - "Нормально: клиент сам виноват, что отправил не число"
    - "Баг: на неверный ввод ожидается ошибка валидации `400` или `422`, а не `500`"
    - "Нормально, если в теле есть понятное сообщение"
    - "Баг только в том случае, если интерфейс позволяет ввести буквы"
  correct: 1
  explanation: |
    `500` значит «сервер сломался». Неверный ввод — ошибка клиента, и
    сервер должен распознать её сам: `400` или `422` по спецификации,
    с указанием, какой параметр неверен.

    Интерфейс тут ни при чём: через API можно отправить любой текст.
    `500` на ввод — всегда баг.

- id: atd-20
  type: card
  question: Как записать проверки API — чек-листом или тест-кейсами?
  answer: |
    Для одного эндпоинта обычно хватает **чек-листа** в виде таблицы:
    запрос, данные, ожидание, источник в спецификации. Столбец «источник»
    даёт трассируемость: видно, откуда взялось ожидание.

    **Тест-кейсы** с шагами пишут для сценариев из нескольких запросов:
    создать заказ, оплатить, отменить, проверить возврат.

    Многие проверки — это один запрос с разными данными. Их удобно
    вести как **data-driven**: запрос описан один раз, значения
    подставляются из таблицы. Так делают в Postman и в автотестах.
