# Вопросы темы «Безопасность для тестировщика». Формат — см. osnovy/bag-report.yaml.

- id: sec-01
  type: card
  question: Что такое OWASP Top 10 и зачем он тестировщику?
  answer: |
    **OWASP** — открытое сообщество специалистов по безопасности
    веб-приложений. **OWASP Top 10** — их список десяти главных рисков,
    который обновляют раз в несколько лет.

    Это не стандарт и не готовый чек-лист, а карта: какие проблемы
    встречаются чаще всего и бьют сильнее всего. На первом месте —
    нарушение контроля доступа.

    Тестировщику он помогает:

    - составлять чек-листы для новой фичи — не забыть права, вход,
      валидацию, конфигурацию;
    - правильно назвать класс найденной проблемы в баг-репорте, чтобы
      команда быстрее оценила серьёзность.

- id: sec-02
  type: quiz
  question: Что такое XSS?
  options:
    - "Перебор паролей с множества адресов одновременно"
    - "Ввод одного пользователя показывается другим на странице как разметка или скрипт, а не как текст"
    - "Подмена ответа сервера на пути между клиентом и сервером"
    - "Отправка слишком большого файла, чтобы сервер перестал отвечать"
  correct: 1
  explanation: |
    **XSS** — Cross-Site Scripting, межсайтовый скриптинг. Страница не
    экранирует ввод и показывает его как HTML. Чужой скрипт выполняется
    в браузере другого пользователя и может действовать от его имени.

    Признак для тестировщика: введённый текст отображается не так, как
    введён, — пропадает, меняет вёрстку или оформление. Ожидание —
    показать ровно те символы, что ввели.

- id: sec-03
  type: quiz
  question: Что такое SQL-инъекция?
  options:
    - "Слишком медленный запрос к базе, который тормозит весь сервис"
    - "Ошибка в схеме базы данных: не хватает индекса или внешнего ключа"
    - "Утечка резервной копии базы данных в открытый доступ"
    - "Ввод пользователя попадает в запрос к базе как часть команды и меняет его смысл"
  correct: 3
  explanation: |
    При **SQL-инъекции** сервер вставляет ввод прямо в текст запроса к
    базе. Ввод перестаёт быть «просто данными» и становится частью
    команды: можно прочитать или изменить чужие записи.

    Защита — на стороне разработки: параметризованные запросы. Признак
    для тестировщика: обычный ввод со спецсимволами, например фамилия с
    апострофом, ломает ответ или показывает ошибку базы.

- id: sec-04
  type: quiz
  question: От чего защищает HTTPS?
  options:
    - "От чтения и подмены данных по пути между клиентом и сервером"
    - "От доступа пользователя к чужим объектам по id"
    - "От ошибок в логике приложения"
    - "От перебора паролей на форме входа"
  correct: 0
  explanation: |
    HTTPS — это HTTP поверх TLS. Он **шифрует** трафик и подтверждает,
    что ты говоришь с настоящим сервером. Пароли и токены нельзя
    прочитать или подменить в открытой сети.

    Но HTTPS защищает только **дорогу**. Если сервер сам отдаёт чужие
    данные по `id`, не ограничивает попытки входа или содержит ошибку
    логики, HTTPS не поможет.

- id: sec-05
  type: card
  question: Чем аутентификация отличается от авторизации? Коротко.
  answer: |
    - **Аутентификация** — «докажи, кто ты»: пароль, код, подпись
      токена. Отказ в API — `401`.
    - **Авторизация** — «что тебе можно»: роль и права на конкретный
      объект. Отказ — `403`, а для чужих объектов часто `404`.

    Сначала аутентификация, потом авторизация. Большинство уязвимостей
    доступа — это ошибки авторизации: пользователь настоящий, а объект
    или действие ему не положены.

- id: sec-06
  type: card
  question: Что такое IDOR и как его проверить безопасно?
  answer: |
    **IDOR** — Insecure Direct Object Reference. Сервер берёт `id`
    объекта из запроса и отдаёт объект, не проверив, принадлежит ли
    он тому, кто спрашивает. Например, `/orders/1002` вместо своего
    `/orders/1001` открывает чужой заказ.

    Безопасная проверка — на своём стенде двумя **своими** тестовыми
    пользователями:

    1. Пользователь А создаёт объект.
    2. Пользователь Б со своим токеном запрашивает его `id`: открыть,
       изменить, удалить, посмотреть вложенные данные.
    3. Ожидание — отказ: `404` или `403` по требованиям.
    4. Пользователь А проверяет, что объект не изменился.

    Помнить про `id` в теле запроса, в ссылках на файлы и в выгрузках.

- id: sec-07
  type: quiz
  question: В форме заказа поле «Цена» отключено, его нельзя изменить. Цена уходит на сервер вместе с заказом. Что скажет мидл?
  options:
    - "Всё в порядке: поле отключено, пользователь цену не изменит"
    - "Это проблема только если поле видно на экране"
    - "Отключённое поле не защищает: браузер под контролем пользователя, сервер должен брать цену из своей базы"
    - "Достаточно скрыть поле целиком, тогда его не изменят"
  correct: 2
  explanation: |
    `disabled`, скрытые поля и кнопки — это свойства страницы в
    **браузере пользователя**. Пользователь может изменить страницу в
    DevTools или отправить запрос напрямую через `curl` или Postman.

    Поэтому цену, скидку, роль сервер не должен брать из запроса — только
    из своих данных и своих проверок. Любая проверка на клиенте — это
    удобство, а не защита.

- id: sec-08
  type: card
  question: Что не должно попадать в ответ API об ошибке и почему?
  answer: |
    В ответе об ошибке не должно быть:

    - **stack trace** — цепочки вызовов с файлами и строками кода;
    - **текста SQL-запроса** и ошибок базы — названий таблиц и полей;
    - **внутренних путей** на сервере;
    - **версий** фреймворка, сервера, библиотек.

    Всё это подсказки атакующему: на чём написан сервис, как устроена
    база, какие известные уязвимости искать.

    Правильно — понятное сообщение для пользователя, машиночитаемый код
    ошибки и номер запроса, например `correlationId`. Подробности
    разработчик находит у себя по этому номеру.

- id: sec-09
  type: quiz
  question: Что ожидает тестировщик, когда превышен лимит попыток входа?
  options:
    - "500 Internal Server Error"
    - "401 Unauthorized без тела"
    - "200 OK с текстом «Попробуйте позже»"
    - "429 Too Many Requests с заголовком Retry-After"
  correct: 3
  explanation: |
    `429 Too Many Requests` — стандартный код для превышения лимита
    запросов. Заголовок `Retry-After` сообщает, через сколько секунд
    можно повторить.

    Проверки: лимит срабатывает после заданного числа попыток, ответ
    понятный, после ожидания вход снова работает. И лимит нужен не
    только на вход: на коды подтверждения, восстановление пароля,
    промокоды.

- id: sec-10
  type: quiz
  question: Форма входа пишет «Пользователь не найден» или «Неверный пароль». Почему мидл заведёт на это баг?
  options:
    - "По разным сообщениям можно узнать, какие email зарегистрированы в сервисе"
    - "Сообщения слишком длинные для мобильного экрана"
    - "Два разных сообщения сложнее переводить на другие языки"
    - "Это не баг: подробные сообщения удобнее пользователю"
  correct: 0
  explanation: |
    Разные ответы для «нет пользователя» и «неверный пароль» — это
    **перечисление пользователей**. Перебирая email, можно составить
    список клиентов сервиса: для фишинга и подбора паролей.

    Ожидание — одинаковый текст и код: «Неверный email или пароль».
    Ту же утечку проверяют в восстановлении пароля и регистрации.
    Удобство подсказки против безопасности — компромисс, который
    записывают в требования.

- id: sec-11
  type: card
  question: Что такое логическая уязвимость и гонка? Приведи пример.
  answer: |
    **Логическая уязвимость** — каждый шаг работает правильно, а вместе
    они дают то, чего бизнес не хотел: скидка применяется дважды,
    шаг подтверждения можно пропустить, в корзине минус один товар.

    **Гонка**, race condition, — частный случай. Сервер сначала
    проверяет условие, потом выполняет действие. Если два запроса
    пришли **одновременно**, оба проходят проверку до того, как первый
    что-то изменил.

    Пример: одноразовый промокод применяется пять раз, если отправить
    пять запросов одновременно.

    Сканеры такое не находят. Тестировщик задаёт вопрос «а если дважды,
    одновременно, в другом порядке?» и проверяет на своём стенде.

- id: sec-12
  type: quiz
  question: Тестировщик нашёл уязвимость. Что из этого — responsible disclosure?
  options:
    - "Сразу опубликовать подробности, чтобы компания быстрее исправила"
    - "Написать в общий чат компании, чтобы все были в курсе"
    - "Закрыто сообщить владельцу системы, дать время исправить и раскрывать только по договорённости"
    - "Ничего никому не говорить, чтобы не было проблем"
  correct: 2
  explanation: |
    **Responsible disclosure** — ответственное раскрытие. Сначала тихо
    сообщить владельцу системы, дать время исправить. Публично
    рассказывать — только после исправления и по договорённости.

    Внутри компании это закрытый баг с пометкой `security` и сообщение
    тимлиду или команде безопасности. Общий чат и публикация — готовая
    инструкция для злоумышленника. Молчание — тоже плохо: уязвимость
    останется.

- id: sec-13
  type: card
  question: Где граница между ручным тестировщиком и пентестером?
  answer: |
    **Ручной тестировщик** замечает признаки проблем при обычном
    тестировании и безопасно проверяет их на своём стенде: права двумя
    пользователями, лишние поля в ответах, подробные ошибки, лимиты,
    отображение ввода. Оформляет закрытый баг.

    **Пентестер** по договору и с разрешением целенаправленно ищет
    уязвимости, подтверждает их эксплуатацией, использует специальные
    инструменты и техники.

    **Security-инженер** строит защиту: требования, архитектура,
    сканеры в процессе сборки, разбор инцидентов.

    Тестировщик не подбирает «рабочую» атаку — он сообщает, что данные
    обрабатываются небезопасно. Безопасность — ответственность всей
    команды.

- id: sec-14
  type: quiz
  question: Сервер отвечает заголовком Access-Control-Allow-Origin со звёздочкой. Что верно?
  options:
    - "CORS запрещает отправлять запросы к API через curl и Postman"
    - "Это настройка сервера: она разрешает страницам любых сайтов читать ответы, и для API с личными данными это вопрос безопасности"
    - "Это защита: звёздочка означает, что сервер проверяет всех клиентов"
    - "Заголовок влияет только на скорость загрузки страницы"
  correct: 1
  explanation: |
    **CORS** — правило **браузера**: читать ли странице одного сайта
    ответ от другого. Звёздочка разрешает это любым сайтам.

    Для открытого API без личных данных это нормально. Для API с
    личными данными — риск, и решение принимает команда безопасности.

    Ловушка: CORS не защищает сервер от `curl`, Postman и других
    программ — они правила CORS не соблюдают. Это настройка, а не
    проверка прав.

- id: sec-15
  type: quiz
  question: Зачем API отвечает 404, а не 403, когда пользователь запрашивает существующий, но чужой проект?
  options:
    - "Это ошибка: правильный код в такой ситуации всегда только 403"
    - "Так проще разработчикам: не нужно различать случаи"
    - "404 быстрее обрабатывается браузером"
    - "Чтобы по ответам нельзя было узнать, какие объекты существуют"
  correct: 3
  explanation: |
    Если чужие объекты отвечают `403`, а несуществующие — `404`,
    перебором номеров можно узнать, какие объекты есть и сколько их.
    С единым `404` чужой и несуществующий объект неотличимы.

    Это осознанное решение, его записывают в требования. `403`
    уместен, когда пользователь уже знает про объект: он участник,
    но роли не хватает.

    Тестировщик проверяет, что ответы для чужого и несуществующего
    объекта не отличаются ни кодом, ни телом, ни сообщением.

- id: sec-16
  type: quiz
  question: Можно ли проверить безопасность сайта конкурента, если ничего не ломать?
  options:
    - "Нет: проверять чужой сервис без разрешения владельца нельзя, даже без последствий"
    - "Да, если проверки только читают данные"
    - "Да, если делать это с личного компьютера, а не с рабочего"
    - "Да, если потом сообщить конкуренту о найденном"
  correct: 0
  explanation: |
    Проверки безопасности делают только там, где есть разрешение: свой
    стенд, рабочий проект в рамках задачи, программа bug bounty по её
    правилам, пентест по договору.

    Без разрешения это нарушение закона и правил сервиса — независимо
    от того, сломалось ли что-то. «Только читал» тоже не оправдание.

    Если случайно заметил проблему при обычном использовании — не
    проверять дальше и сообщить владельцу по его правилам.

- id: sec-17
  type: quiz
  question: Почему токен или пароль в адресе страницы — баг безопасности, даже если сайт работает по HTTPS?
  options:
    - "Адрес не шифруется HTTPS никогда, ни одной своей частью"
    - "Длинный адрес замедляет загрузку страницы"
    - "Адрес сохраняется в истории браузера, закладках, заголовке Referer и попадает в чужие руки"
    - "Это не баг, если адрес короче 2000 символов"
  correct: 2
  explanation: |
    HTTPS шифрует путь и параметры по дороге. Но адрес живёт и после
    запроса: в истории браузера, в закладках, в заголовке `Referer`
    при переходе на другой сайт, в скриншотах и пересланных ссылках.

    Секреты передают в заголовках или теле запроса, а не в адресе.
    Ловушка в первом варианте: доменное имя действительно может быть
    видно, но путь и параметры HTTPS шифрует.

- id: sec-18
  type: quiz
  question: Интерфейс профиля показывает имя и телефон. В ответе API ещё есть поля с хэшем пароля и служебным флагом. Это баг?
  options:
    - "Нет: интерфейс их не показывает, значит, пользователь их не видит"
    - "Да: всё, что пришло в ответе, видно любому через DevTools, и лишних полей там быть не должно"
    - "Нет, если сайт работает по HTTPS"
    - "Только если поля названы на английском"
  correct: 1
  explanation: |
    Ответ API приходит в браузер **целиком**. Любой может открыть
    Network и прочитать все поля, которые интерфейс отфильтровал.

    Хэш пароля нельзя отдавать ни в одном ответе — его можно попытаться
    подобрать. Служебные флаги и внутренние комментарии — тоже утечка.

    Ожидание — только поля из контракта API. Тестировщик читает ответ
    целиком, а не только то, что на экране.
