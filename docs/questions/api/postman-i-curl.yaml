# Вопросы темы «Postman и curl». Формат — см. osnovy/bag-report.yaml.

- id: apc-01
  type: card
  question: Что такое коллекция в Postman и зачем она тестировщику?
  answer: |
    **Коллекция** — сохранённый набор запросов, разложенный по папкам:
    обычно по ресурсам API или по сценариям.

    Зачем она нужна:

    - запрос собирается **один раз** и потом просто отправляется;
    - в коллекции живут **переменные** и **скрипты** — можно строить
      цепочки запросов без ручного копирования токенов и `id`;
    - коллекцию можно **экспортировать** в файл и положить в репозиторий —
      у всей команды будет один и тот же набор запросов;
    - коллекцию можно **прогнать целиком** в Runner или через Newman.

    Хорошая коллекция — это ещё и документация: описания запросов,
    примеры ответов, понятные имена.

- id: apc-02
  type: quiz
  question: "В адресе запроса стоит `{{baseUrl}}/api/v1/projects`. Что такое `{{baseUrl}}`?"
  options:
    - "Ошибка в адресе: Postman отправит запрос с фигурными скобками"
    - "Специальный заголовок, который Postman добавляет к запросу"
    - "Переменная: перед отправкой Postman подставит её значение, например адрес стенда"
    - "Комментарий для читателя, при отправке он удаляется"
  correct: 2
  explanation: |
    Двойные фигурные скобки — **переменная** Postman. Перед отправкой
    Postman заменит `{{baseUrl}}` значением, например
    `http://localhost:8000`.

    Зачем: адрес стенда меняется в одном месте, а не в каждом запросе.
    Если значение не задано ни в одной области, Postman отправит запрос
    с нераскрытой переменной — и запрос не дойдёт до сервера.

- id: apc-03
  type: quiz
  question: Что делают флаги `curl` `-X`, `-H`, `-d` и `-i`?
  options:
    - "`-X` — метод, `-H` — заголовок запроса, `-d` — тело, `-i` — показать заголовки ответа"
    - "`-X` — адрес, `-H` — справка, `-d` — скачать файл, `-i` — интерактивный режим"
    - "`-X` — метод, `-H` — заголовки ответа, `-d` — удалить, `-i` — игнорировать ошибки"
    - "`-X` — выход, `-H` — HTTPS, `-d` — отладка, `-i` — вход по токену"
  correct: 0
  explanation: |
    - `-X POST` — метод запроса. Без него `curl` отправляет `GET`,
      а если есть `-d` — `POST`;
    - `-H "Content-Type: application/json"` — заголовок **запроса**,
      по одному `-H` на заголовок;
    - `-d '{"name": "x"}'` — тело запроса. Длинное тело удобно брать
      из файла: `--data "@body.json"`;
    - `-i` — вывести **заголовки ответа** вместе с телом.

    Весь обмен с подробностями показывает `-v`.

- id: apc-04
  type: quiz
  question: Что такое Environment в Postman?
  options:
    - "Сервер, который Postman поднимает для тестов"
    - "Копия базы данных стенда внутри Postman"
    - "Тестовый стенд: dev, stage или prod"
    - "Именованный набор переменных, например адрес стенда и данные входа"
  correct: 3
  explanation: |
    **Postman Environment** — набор переменных внутри Postman:
    `baseUrl`, логины тестовых пользователей, токены. Переключение
    Environment меняет только то, какие значения подставятся в запросы.

    Тестовое окружение, или стенд, — живая система: сервер, база,
    настройки. Environment на него лишь **указывает** через `baseUrl`.
    Слово одно, понятия разные.

- id: apc-05
  type: card
  question: Где взять готовую команду `curl` для запроса, который уже отправлял браузер или Swagger?
  answer: |
    Набирать её с нуля не нужно:

    - **DevTools** → Network → правая кнопка по запросу →
      **Copy → Copy as cURL**. Команда повторит запрос точно: метод,
      адрес, все заголовки, тело;
    - **Swagger** — после выполнения запроса в ответе есть блок **Curl**;
    - **Postman** — значок **Code** (`</>`) у запроса → `cURL`.

    И обратно: в Postman **Import** → вставить команду `curl` —
    Postman разложит её на метод, адрес, заголовки и тело.

    В скопированной команде — токены и cookie. Перед отправкой коллегам
    их нужно вычистить.

- id: apc-06
  type: quiz
  question: Для чего нужен скрипт, который выполняется после ответа — вкладка Tests или Post-response?
  options:
    - "Чтобы изменить запрос перед отправкой"
    - "Чтобы проверить ответ и сохранить значения из него в переменные"
    - "Чтобы зашифровать ответ сервера"
    - "Только для того, чтобы красиво отформатировать JSON"
  correct: 1
  explanation: |
    Скрипт после ответа видит код, заголовки и тело. В нём делают две
    вещи:

    - **тесты** — `pm.test('Код 201', () => pm.response.to.have.status(201))`;
    - **сохранение данных** для следующих запросов —
      `pm.collectionVariables.set('projectId', pm.response.json().id)`.

    Изменить запрос до отправки — задача **pre-request** скрипта.

- id: apc-07
  type: quiz
  question: "Переменная `baseUrl` задана в Global, в коллекции и в выбранном Environment — с разными значениями. Какое подставится в запрос?"
  options:
    - "Из Global — она главнее всех"
    - "Из коллекции — запрос лежит в ней"
    - "Из Environment — из трёх областей она ближе всего к запросу"
    - "Postman покажет ошибку о конфликте переменных"
  correct: 2
  explanation: |
    Порядок областей от широкой к узкой: **Global → Collection →
    Environment → Data → Local**. Побеждает самая узкая из тех, где
    переменная задана. Здесь это Environment.

    Частая ловушка: человек меняет переменную в коллекции, а запросы
    упрямо идут на старый адрес — потому что то же имя есть
    в Environment. Наведи курсор на переменную в запросе: Postman
    покажет значение и область, откуда оно взято.

- id: apc-08
  type: quiz
  question: Куда положить токен в переменной коллекции, которую ты будешь экспортировать и отдавать команде?
  options:
    - "В current value: оно остаётся только у тебя и не уходит в экспорт"
    - "В initial value: так коллегам не придётся входить самим"
    - "Прямо в заголовок `Authorization` каждого запроса"
    - "В описание коллекции, чтобы все знали, где его взять"
  correct: 0
  explanation: |
    **Initial value** уходит в экспорт и синхронизируется в облако
    Postman — его видят все, с кем ты поделился. **Current value**
    живёт только у тебя.

    Секреты — только в current value. Ещё надёжнее — хранилище
    секретов Postman или переменная типа secret. В initial value —
    пустая строка или подсказка «вставь свой токен».

    Токен в общем файле — это рабочий ключ к учётной записи для
    каждого, кто откроет репозиторий.

- id: apc-09
  type: quiz
  question: "Команда `curl -X POST -H \"Content-Type: application/json\" …` в Windows PowerShell падает с ошибкой `Cannot bind parameter 'Headers'`. В чём дело?"
  options:
    - "В Windows нельзя отправлять POST-запросы из терминала"
    - "Сервер не принимает заголовок `Content-Type`"
    - "Нужно запустить PowerShell от имени администратора"
    - "В PowerShell `curl` — псевдоним другой команды; нужно писать `curl.exe`"
  correct: 3
  explanation: |
    В Windows PowerShell 5 слово `curl` — псевдоним команды
    `Invoke-WebRequest`. У неё другие параметры, и привычные флаги
    `curl` она не понимает. Настоящий `curl` вызывается как
    **`curl.exe`** — он есть в Windows 10 и 11.

    Ещё две ловушки Windows: перенос строки через `\` не работает,
    а кавычки внутри JSON в команде часто теряются. Надёжно —
    команда в одну строку и тело из файла: `--data "@body.json"`.

- id: apc-10
  type: card
  question: Все тесты в коллекции Postman зелёные. Значит ли это, что фича работает?
  answer: |
    Нет. Зелёный тест говорит только, что **проверенное им** не сломалось.
    Частые ложно-зелёные тесты:

    - проверяется **только код** — `200` с пустым или чужим телом тоже `200`;
    - проверка написана **вне `pm.test`** — она не попадает в список
      тестов, сводка показывает «0 failed»;
    - сравнение **`undefined` с `undefined`** — поле переименовали,
      а тест читает старое имя и сравнивает с пустой переменной;
    - **устаревшая переменная** — шаг цепочки упал, скрипт не обновил
      `id`, и дальше всё проверяется на вчерашнем объекте;
    - тест, который **не может упасть** вообще.

    Проверка для мидла: «при каком баге этот тест покраснеет?» И временно
    сломать ожидание — тест должен стать красным.

    Плюс коллекция не покрывает интерфейс, интеграции и сценарии,
    для которых тесты ещё не написали.

- id: apc-11
  type: quiz
  question: "Тест `pm.expect(body.ownerId).to.eql(pm.collectionVariables.get('userId'))` зелёный. Потом выясняется, что в ответе нет поля `ownerId`, а переменная `userId` не задана. Почему тест прошёл?"
  options:
    - "Postman пропускает тесты, если поля нет в ответе"
    - "Обе стороны равны `undefined`, а `undefined` равно `undefined`"
    - "`eql` сравнивает только типы, а не значения"
    - "Тест прошёл, потому что код ответа был `200`"
  correct: 1
  explanation: |
    Чтение отсутствующего поля даёт `undefined`. Чтение незаданной
    переменной — тоже `undefined`. Проверка «`undefined` равно
    `undefined`» верна — тест зелёный и ничего не доказывает.

    Защита — сначала проверить, что значение есть и имеет нужный тип:
    `pm.expect(body.ownerId).to.be.a('number')`. И что ожидание
    не пустое.

- id: apc-12
  type: quiz
  question: "Цепочка: логин → создать заказ → получить заказ. Скрипт сохраняет `orderId` только при `201`. Сегодня создание ответило `422`, а получение — `200`. Что, скорее всего, произошло?"
  options:
    - "Сервер создал заказ, несмотря на ошибку, — это баг"
    - "Postman закэшировал вчерашний ответ"
    - "`422` на создании — норма, раз потом заказ нашёлся"
    - "Переменная не обновилась, и получение вернуло вчерашний заказ со старым `orderId`"
  correct: 3
  explanation: |
    Скрипт сохраняет `id` только при успехе. Создание упало — в
    `orderId` осталось вчерашнее значение. Следующий шаг получил
    вчерашний заказ и честно ответил `200`.

    Как защититься:

    - проверять код каждого шага в `pm.test`;
    - при ошибке очищать переменную: `pm.collectionVariables.unset('orderId')`;
    - останавливать прогон: `pm.execution.setNextRequest(null)`;
    - в тесте получения сверять данные с тем, что **сегодня** отправили,
      а не только код.

- id: apc-13
  type: card
  question: Как прогнать один запрос на наборе данных и где хранить ожидаемый результат?
  answer: |
    Это **data-driven** прогон. Запрос описан один раз, данные — в файле
    CSV или JSON. Каждая строка файла — одна итерация в Runner или
    Newman.

    - В запросе — переменные из колонок файла: `{{name}}`, `{{email}}`.
    - В файле — колонка **`expectedStatus`**: ожидаемый код для строки.
    - В тесте ожидание тоже берётся из строки:
      `pm.iterationData.get('expectedStatus')`.

    Получается таблица «запрос → данные → ожидание». Новая граница —
    новая строка в файле, без нового запроса.

    Строки подбирают по классам эквивалентности и границам, а не наугад.
    И не забывают про очистку: прогон создаёт сущности.

- id: apc-14
  type: quiz
  question: Что такое Newman?
  options:
    - "Расширение браузера для перехвата запросов"
    - "Платная версия Postman с командной работой"
    - "Запуск коллекций Postman из командной строки — например, в пайплайне"
    - "Формат файла для экспорта коллекций"
  correct: 2
  explanation: |
    **Newman** — Postman без окна. Команда вида
    `npx newman run collection.json -e env.json -d data.csv`
    прогоняет коллекцию с Environment и файлом данных и выводит отчёт.

    Зачем: коллекция лежит в репозитории рядом с кодом и прогоняется
    в пайплайне при каждой сборке. Ещё Newman выручает, если Runner
    в бесплатном плане Postman ограничен.

- id: apc-15
  type: quiz
  question: Ты импортировал в Postman OpenAPI-схему API. Что получишь?
  options:
    - "Коллекцию со всеми эндпоинтами и примерами тел, но без тестов и цепочек"
    - "Готовые тесты на все коды ответов из схемы"
    - "Настроенные цепочки: токен из логина сам попадёт во все запросы"
    - "Mock-сервер, который заменит настоящий API"
  correct: 0
  explanation: |
    Postman соберёт коллекцию из схемы: папки по тегам, запросы со всеми
    параметрами, примеры тел. Это быстрый старт — минута вместо часа
    ручной работы.

    Чего не будет: тестов, скриптов сохранения токена и `id`,
    авторизации на уровне коллекции, реальных тестовых данных. Это
    добавляет тестировщик.

- id: apc-16
  type: card
  question: Что такое pre-request script в Postman? Приведи пример.
  answer: |
    Скрипт, который выполняется **до** отправки запроса. Он готовит
    данные.

    Пример — уникальный email для регистрации, один и тот же для
    регистрации и логина:

    ```javascript
    const email = `student_${Date.now()}@example.com`;
    pm.collectionVariables.set('studentEmail', email);
    ```

    В теле обоих запросов — `{{studentEmail}}`.

    Другие задачи: уникальное имя с отметкой времени, дата «завтра»
    в нужном формате, строка нужной длины для граничных проверок,
    получение токена, если его ещё нет.

- id: apc-17
  type: card
  question: Как ты отдашь разработчику воспроизведение бага в API?
  answer: |
    Главное — команда **`curl`**: метод, адрес, заголовки, тело.
    Разработчик вставит её в терминал и увидит то же, что я. Её дают
    DevTools через Copy as cURL, Swagger и Postman через **Code**.

    Перед отправкой — **вычистить секреты**: токен заменить на `…` или
    написать, под каким тестовым пользователем воспроизводить. Пароли
    в теле — тоже. Тикет читает много людей.

    К команде:

    - фактический ответ **текстом**: код и тело;
    - `X-Request-ID` — по нему найдут запрос в логах;
    - время с часовым поясом, стенд, версия сборки.

    Скриншот — для наглядности, но не вместо команды: с картинки
    заголовки не скопируешь.

- id: apc-18
  type: quiz
  question: "На стейдже `curl` ругается на сертификат HTTPS. Коллега советует: «Добавь `-k`, и всё заработает». Как поступить?"
  options:
    - "Добавить `-k` — это стандартный флаг для тестовых стендов, вопрос закрыт"
    - "Перейти с HTTPS на HTTP, чтобы сертификат не проверялся"
    - "Выяснить причину: просроченный сертификат или неполная цепочка — это находка, пользователи увидят ту же ошибку"
    - "Переустановить `curl`: ошибка сертификата — проблема программы"
  correct: 2
  explanation: |
    `-k` отключает проверку сертификата: `curl` будет говорить с кем
    угодно, кто ответит по этому адресу. Ошибка при этом никуда
    не девается — браузеры и мобильные приложения увидят её так же.

    На своём стенде с самоподписанным сертификатом `-k` иногда
    допустим. Но на стейдже и тем более на проде ошибка сертификата —
    повод разобраться: срок действия, имя в сертификате, цепочка.
    Если сертификат просрочен — это баг, и его надо завести.

- id: apc-19
  type: card
  question: "Как не прогнать коллекцию Runner на проде по ошибке?"
  answer: |
    Внимательности мало — нужна защита в самой коллекции и в привычках:

    - **один Environment — один стенд**, у prod — яркое имя и красный
      цвет: `PROD — ОСТОРОЖНО`;
    - **нет рабочих токенов prod** в Postman, если они не нужны прямо
      сейчас. Без токена прогон упадёт на первом запросе;
    - **проверка в pre-request** коллекции: если `baseUrl` указывает
      на прод — остановить прогон через
      `pm.execution.setNextRequest(null)`;
    - **взгляд в правый верхний угол** перед каждым запуском;
    - создаваемые сущности — с префиксом `autotest_`, чтобы их было
      видно и легко удалить.

    Если всё же случилось — сразу остановить, сообщить команде
    и поддержке, передать список созданного. Не прятать.

- id: apc-20
  type: quiz
  question: "В теле регистрации и логина стоит `{{$randomEmail}}`. Регистрация проходит, логин — нет. Почему?"
  options:
    - "Динамическая переменная генерируется заново при каждой подстановке — в логин ушёл другой email"
    - "`{{$randomEmail}}` создаёт email в неправильном формате"
    - "Сервер запрещает входить сразу после регистрации"
    - "Динамические переменные работают только в Runner"
  correct: 0
  explanation: |
    `{{$randomEmail}}`, `{{$guid}}`, `{{$timestamp}}` вычисляются
    **при каждом использовании**. Регистрация получила один email,
    логин — другой, такого пользователя нет.

    Правильно — сгенерировать значение один раз в pre-request скрипте,
    сохранить в обычную переменную и подставлять её в оба запроса.
