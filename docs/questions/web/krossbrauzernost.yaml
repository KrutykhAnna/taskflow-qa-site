# Вопросы темы «Кроссбраузерность». Формат — см. osnovy/bag-report.yaml.

- id: web10-01
  type: card
  question: Что такое кроссбраузерность и зачем её проверять?
  answer: |
    Кроссбраузерность — когда сайт работает и выглядит как задумано во
    всех браузерах, которыми пользуются его люди. Не «пиксель в пиксель
    одинаково», а «ничего не сломано и всё можно сделать».

    Зачем: один и тот же код разные браузеры понимают чуть по-разному.
    Пользователи сидят не в браузере тестировщика: у кого-то Safari на Mac,
    у кого-то iPhone. Баг, который виден только у них, для них — главный
    баг сайта, и приходит он из поддержки с пометкой «у нас всё работает».

- id: web10-02
  type: card
  question: Что такое движок браузера и какие движки важны на практике?
  answer: |
    Движок — часть браузера, которая читает HTML, CSS и JavaScript и
    рисует страницу. Важны три:

    - **Chromium** (Blink) — Chrome, Edge, Opera, Яндекс Браузер;
    - **WebKit** — Safari и, по правилам Apple, почти все браузеры на
      iPhone и iPad (в ЕС правила смягчили, но большинство всё ещё на
      WebKit);
    - **Gecko** — Firefox.

    Браузеры на одном движке обычно ведут себя похоже. Поэтому для
    покрытия разных движков нужны хотя бы Chrome, Safari и Firefox.

- id: web10-03
  type: quiz
  question: "Тестировщик пишет в отчёте: «Кроссбраузерность проверена: Chrome, Edge, Opera, Яндекс Браузер — всё работает». Что главное не так?"
  options:
    - "Ничего: четыре браузера — хорошее покрытие"
    - "Все четыре на одном движке Chromium — по сути одна проверка; нет Safari (WebKit) и Firefox (Gecko)"
    - "Нужно было проверить ещё Internet Explorer"
    - "Opera и Яндекс Браузер не нужно проверять никогда"
  correct: 1
  explanation: |
    Chrome, Edge, Opera и Яндекс Браузер построены на Chromium: вёрстка и
    JavaScript у них почти всегда ведут себя одинаково. Разные движки —
    это Safari (WebKit) и Firefox (Gecko), и именно там чаще всего
    отличия. Ещё в отчёте нет версий и систем: «всё работает» — на чём?

- id: web10-04
  type: quiz
  question: "Сайт проверили в Chrome на Windows и в Chrome на iPhone. Можно ли сказать, что движок Safari не проверен вовсе?"
  options:
    - "Да: Safari не открывали, значит WebKit не проверен"
    - "Нет: Chrome на iPhone работает на движке WebKit, как Safari. Но Safari на Mac — другая система, его это не заменяет"
    - "Нет: Chrome на iPhone и Safari — одно и то же приложение"
    - "Да: Chrome везде работает на Chromium"
  correct: 1
  explanation: |
    На iPhone браузеры по правилам Apple работают на WebKit — движке
    Safari (в ЕС правила смягчили, но на практике большинство браузеров
    там по-прежнему на WebKit). Значит, Chrome на iPhone частично проверил
    WebKit. Но Safari на Mac — другая система: свои шрифты, скроллбары,
    ввод мышью. Если Mac есть в матрице, его проверяют отдельно.

- id: web10-05
  type: card
  question: Что чаще всего ломается между браузерами — чек-лист?
  answer: |
    - **вёрстка**: отступы, переносы, высота блоков;
    - **шрифты**: толщина, сглаживание, ширина текста, запасной шрифт для
      кириллицы;
    - **скроллбары**: на Windows занимают место, на Mac скрыты; раскраска
      понятна не всем браузерам;
    - **нативные элементы форм**: дата, выпадающий список, число;
    - **автозаполнение и сохранённые пароли**;
    - **даты в JavaScript** из нестандартной строки;
    - **автозапуск видео и звука**;
    - **сторонние cookies** — Safari и Firefox их ограничивают;
    - **новые CSS и JS** — проверяй на caniuse;
    - **расширения**: блокировщики режут виджеты и аналитику;
    - **масштаб, размер шрифта, тёмная тема системы**.

- id: web10-06
  type: card
  question: Что такое нативные элементы и почему их проверяют в каждом движке?
  answer: |
    Нативные — встроенные в браузер элементы, которые рисует **браузер**,
    а не сайт: поле даты (`type="date"`), выпадающий список (`select`),
    поле-число, чекбоксы. Вид, раскрытый список, календарь, правила ввода с
    клавиатуры — свои в каждом движке, а на iPhone выбор даты вообще
    системный, снизу экрана.

    Сайт на это почти не влияет, поэтому нативные элементы проверяют в
    каждом движке из матрицы. Элементы, нарисованные сайтом (свой
    календарь из `div`), выглядят почти одинаково везде — им хватает
    смоука. Отличить просто: «Просмотреть код» — `input`/`select` или
    много `div`.

- id: web10-07
  type: quiz
  question: "Фронт превращает строку из API в дату: new Date(\"2026-10-21 10:00:00\"). В Chrome всё хорошо. Что проверит мидл?"
  options:
    - "Ничего: если работает в Chrome, работает везде"
    - "Этот экран в Safari и Firefox: формат с пробелом не по стандарту, браузер вправе его не понять — Safari долго возвращал Invalid Date"
    - "Только часовой пояс сервера"
    - "Длину строки даты"
  correct: 1
  explanation: |
    Стандартный формат — с буквой `T`: `2026-10-21T10:00:00`. Строку с
    пробелом браузер «угадывает», и каждый вправе понять её по-своему.
    Safari долгое время возвращал `Invalid Date` — и пользователи видели
    «Invalid Date» вместо даты заказа. Быстрая проверка — выполнить эту
    строку в Console нужного браузера. Надёжное исправление — стандартный
    формат в API и аккуратный разбор на фронте.

- id: web10-08
  type: card
  question: Что такое матрица браузеров и откуда брать для неё данные?
  answer: |
    Матрица — таблица «в каких браузерах, на каких системах, каких версиях
    и насколько подробно мы проверяем». Решает команда, тестировщик часто
    предлагает и поддерживает.

    Данные:

    - **аналитика продукта** (Яндекс Метрика, Google Analytics) — главный
      источник: браузеры **ваших** пользователей;
    - **публичная статистика** (StatCounter) — если продукта ещё нет;
    - **требования или договор** — «поддерживаемые браузеры: ...».

    Частое правило — последние 2 версии каждого браузера; исключения —
    корпоративные компьютеры и старые iPhone. Пересматривать раз в
    полгода-год.

- id: web10-09
  type: card
  question: Как распределить проверки между браузерами из матрицы?
  answer: |
    - **Полный прогон** — в основном браузере (обычно Chrome на системе
      большинства).
    - **Смоук** ключевых сценариев — в остальных.
    - **Safari — обязательно**, если есть пользователи Mac или iPhone:
      другой движок и частые сюрпризы.
    - **Шире** — формы, оплату, даты, загрузку файлов: там больше всего
      различий.
    - Браузеры на одном движке (Chrome, Edge, Яндекс) — короткий смоук, а
      не полный прогон в каждом.

- id: web10-10
  type: quiz
  question: "Интервьюер: «Edge сделан на Chromium. Значит, его проверять не нужно?» Какой ответ точнее?"
  options:
    - "Да, Edge — это Chrome с другой иконкой"
    - "Вёрстка и JS почти всегда как в Chrome, полный прогон не нужен. Но у Edge свои настройки, защита от отслеживания, автозаполнение, корпоративные политики и версии — смоук нужен, если Edge есть в аналитике"
    - "Нет, Edge работает на своём движке EdgeHTML"
    - "Edge проверяют только на Mac"
  correct: 1
  explanation: |
    Современный Edge — на Chromium, поэтому вёрстка совпадает с Chrome. Но
    браузер — это не только движок: защита от отслеживания, менеджер
    паролей, встроенные функции, а в компаниях — политики и отстающие
    версии. В B2B Edge часто стоит по умолчанию. Поэтому — смоук, а не
    «не проверяем». Свой движок EdgeHTML был у старого Edge, сейчас его
    заменил Chromium.

- id: web10-11
  type: card
  question: Где взять браузер, которого нет на твоём компьютере?
  answer: |
    - **Установить**: Chrome, Firefox, Edge — бесплатно на Windows и
      macOS. Safari — только на Mac, iPhone, iPad.
    - **Облачные сервисы**: BrowserStack, LambdaTest, Sauce Labs —
      настоящие браузеры и телефоны удалённо, в окне своего браузера. Для
      `localhost` — их «туннель». Есть пробные периоды, на проектах обычно
      общий аккаунт команды.
    - **Тестовые устройства** в офисе.

    Нет доступа к нужному браузеру — честно пишешь в отчёте «не
    проверено» и поднимаешь вопрос о доступе.

- id: web10-12
  type: quiz
  question: "Тестировщик видит, что на сайте нет кнопки «Поделиться». У разработчика кнопка есть. В Console у тестировщика — net::ERR_BLOCKED_BY_CLIENT. Что вероятнее всего?"
  options:
    - "Сервер не отдаёт кнопку этому пользователю"
    - "Запрос заблокировало расширение в браузере тестировщика — скорее всего, блокировщик рекламы. Нужно повторить в чистом окне"
    - "У тестировщика медленная сеть"
    - "Баг в Chrome, нужно писать в Google"
  correct: 1
  explanation: |
    `ERR_BLOCKED_BY_CLIENT` — запрос заблокировал не сервер, а сам браузер
    по просьбе расширения. Блокировщики рекламы часто режут виджеты
    соцсетей, аналитику, иногда чаты. Повтори в инкогнито или профиле без
    расширений. Но не спеши забывать: если у заметной части пользователей
    блокировщик, а без виджета ломается вёрстка, — это повод для отдельной
    задачи.

- id: web10-13
  type: card
  question: Зачем проверять в «чистом» браузере и как его получить?
  answer: |
    Расширения меняют страницу: блокировщики прячут блоки и режут
    запросы, переводчики переписывают текст, менеджеры паролей добавляют
    значки. Чтобы понять, баг это сайта или твоё расширение, — повтори в
    чистом браузере.

    Как получить:

    - **окно инкогнито** — в Chrome расширения там по умолчанию выключены;
      в других браузерах проверь настройки;
    - **отдельный профиль** «Тестирование» без расширений.

    Какие расширения встроились в страницу, в Chrome видно в DevTools →
    Sources → Content scripts.

- id: web10-14
  type: card
  question: Что такое caniuse.com и как тестировщик его использует?
  answer: |
    caniuse.com («Can I use») — таблица поддержки возможностей CSS и
    JavaScript по браузерам и версиям: зелёное — поддерживается, красное
    — нет, жёлтое — частично или с оговорками.

    Как использовать:

    - прежде чем заводить «в Safari не работает» — проверить, поддерживает
      ли эта версия то, что использовал разработчик;
    - сверить матрицу: если новая возможность не работает в браузере из
      матрицы, нужен запасной вариант или решение команды;
    - аргумент в баг-репорте: «по caniuse поддерживается с версии N».

    Если браузер не знает правило CSS — он молча его пропускает; если не
    знает функцию JS — часто ломается весь скрипт.

- id: web10-15
  type: quiz
  question: "В Firefox полоса прокрутки на сайте стандартная, а в Chrome — тонкая и раскрашенная. В стилях — ::-webkit-scrollbar. Тестировщик заводит баг «Критично: в Firefox сломан скроллбар». Прав ли он?"
  options:
    - "Да, любое отличие между браузерами — критичный баг"
    - "Нет: Firefox не понимает ::-webkit-scrollbar и рисует стандартную полосу. Это косметика; баг — только если в макете есть требование, и то не критичный"
    - "Да, нужно срочно убрать Firefox из матрицы"
    - "Нет, это баг Chrome"
  correct: 1
  explanation: |
    `::-webkit-scrollbar` понимают Chrome, Edge и Safari; у Firefox свои
    стандартные свойства (`scrollbar-color`, `scrollbar-width`). Сайт,
    который использует только первый способ, в Firefox показывает обычную
    полосу. Прокрутка работает — дело сделать можно. Мерило бага — можно
    ли сделать дело и не вводит ли экран в заблуждение. Если стиль
    скроллбара в макете обязателен — задача на улучшение с низкой
    серьёзностью.

- id: web10-16
  type: card
  question: Что обязательно указать в баг-репорте о кроссбраузерном баге?
  answer: |
    - **браузер, версию и систему**: «Safari 18.1, macOS 15.1», а не
      просто «Safari»;
    - **где воспроизводится и где нет** — список браузеров;
    - **проверено ли в чистом окне** — без расширений;
    - **два скриншота рядом**: как в основном браузере и как в
      проблемном;
    - **ошибки из Console** проблемного браузера, если есть;
    - в заголовке — браузер: «[Safari] ...».

    Где смотреть версию: `chrome://version`, `edge://version`, «О Firefox»,
    «О Safari»; на iPhone версия Safari = версия iOS.

- id: web10-17
  type: quiz
  question: "Баг-репорт: «В Edge не нажимается „Сохранить“. В Chrome нажимается. Окружение: Edge». Чего здесь не хватает в первую очередь?"
  options:
    - "Ничего, всё понятно"
    - "Версии Edge и системы, ошибок из Console и отметки, проверено ли в чистом окне — у Edge и Chrome на одном движке различия чаще в расширениях и настройках"
    - "Видео с экрана обязательно"
    - "Версии Chrome — она важнее"
  correct: 1
  explanation: |
    Без версии и системы баг не воспроизвести. «Не нажимается» в одном
    браузере — первым делом Console. И главное: Edge и Chrome на одном
    движке, поэтому разница между ними чаще в расширениях, защите от
    отслеживания или настройках, чем в коде сайта. Проверка в чистом окне
    часто сразу даёт ответ.

- id: web10-18
  type: card
  question: Как работать с кроссбраузерностью на задаче — по шагам?
  answer: |
    1. Узнать матрицу; нет — предложить по аналитике.
    2. Полный прогон фичи в основном браузере.
    3. Смоук в остальных браузерах из матрицы — ключевые сценарии и всё
       «хрупкое»: формы, даты, списки, видео, прокрутка. Два браузера
       рядом на экране.
    4. Нашёл отличие — исключить себя: чистое окно, масштаб 100%,
       обновлённый браузер, другой браузер на том же движке.
    5. Решить, баг ли это: можно ли сделать дело, не вводит ли экран в
       заблуждение; спорное — по макету и с дизайнером.
    6. Баг-репорт: браузер, версия, система, где воспроизводится и где
       нет, чистое окно, два скриншота, Console.

- id: web10-19
  type: quiz
  question: "Поле «Количество» — type=\"number\". В Chrome буквы не вписываются. Пользователь в Firefox вписал «10шт», и сохранился заказ с количеством 0. Где баги?"
  options:
    - "Только в Firefox — нужно писать разработчикам Firefox"
    - "У фронта — понадеялся на браузер и превратил неправильное значение в 0 без ошибки; у бэка — принял количество 0. Второй важнее"
    - "Нигде: пользователь сам виноват"
    - "Только у бэка"
  correct: 1
  explanation: |
    Firefox даёт вписать текст в поле-число, а для неправильного значения
    отдаёт фронту пустую строку. Фронт не проверил поле сам и отправил
    `0`. Сервер принял `0` — у него не было своей проверки. Бэкенд важнее:
    его не обойти никаким браузером. Урок для тестировщика: поле-число —
    ввод букв в каждом движке и проверка того, что ушло на сервер.
