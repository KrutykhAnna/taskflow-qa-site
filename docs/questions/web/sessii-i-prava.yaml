# Вопросы темы «Сессии, права и роли в интерфейсе». Формат — см. osnovy/bag-report.yaml.

- id: web8-01
  type: card
  question: Что такое сессия и права простыми словами?
  answer: |
    **Сессия** — как браслет в отеле: на ресепшене (страница входа) ты
    показал паспорт и получил браслет — токен или cookie. Дальше браузер
    показывает его серверу с каждым запросом. Потерял или истёк — снова на
    вход.

    **Права** — какой у тебя браслет: куда пускают, куда нет.

    Главная мысль: **скрытая кнопка — не защита.** Интерфейс только прячет
    то, что нельзя. Права проверяет сервер — на каждый запрос.

- id: web8-02
  type: card
  question: Чем отличаются cookie, Local Storage и Session Storage для хранения входа?
  answer: |
    - **Cookie** — живёт до срока `Expires` (без срока — до закрытия
      браузера), видна всем вкладкам сайта, **сама уходит на сервер** с
      каждым запросом. С флагом `HttpOnly` её не прочитает JavaScript.
    - **Local Storage** — живёт, пока не удалят, видна всем вкладкам. На
      сервер сама не уходит: сайт кладёт значение в заголовок
      `Authorization`.
    - **Session Storage** — своя у каждой вкладки и пропадает при её
      закрытии.

    Для тестировщика: вход в cookie или Local Storage общий на все вкладки,
    в Session Storage — нет. Инкогнито, другой профиль и другой браузер —
    отдельные хранилища.

- id: web8-03
  type: card
  question: Что проверить при выходе из приложения?
  answer: |
    - Переход на страницу входа.
    - **«Назад»** — один и несколько раз — не показывает приватные данные,
      даже «из памяти браузера».
    - Токен или cookie сессии удалены — видно в DevTools → Application.
    - **Старый токен не работает на сервере**: скопировать его до выхода,
      после выхода отправить запрос из Postman — ждём `401`.
    - Вход другим пользователем после выхода — без остатков предыдущего:
      имени, списков, корзины, черновиков.

- id: web8-04
  type: card
  question: Как проверить истечение сессии, не дожидаясь его?
  answer: |
    Удалить или испортить токен в DevTools → Application (Local Storage или
    Cookies) и сделать действие. Для сайта это выглядит так же, как
    истёкшая сессия.

    Что смотреть:

    - что видит пользователь — понятное «Сессия истекла» и вход или белый
      экран, «тихая» ошибка, непонятное «401»;
    - что стало с введённым текстом;
    - куда вернёт после повторного входа.

    Настоящее истечение — попросить на тестовом стенде короткий срок
    токена или посмотреть `exp` в самом токене.

- id: web8-05
  type: quiz
  question: "Анна — наблюдатель в проекте. Кнопки «Удалить задачу» у неё нет. Тестировщик взял cURL удаления у менеджера, подставил токен Анны, отправил — ответ 204, задача удалилась. Как оценить?"
  options:
    - "Не баг: обычный пользователь не умеет отправлять запросы"
    - "Баг интерфейса низкого приоритета"
    - "Security-баг высокого приоритета: сервер не проверяет роль"
    - "Не баг: раз у Анны есть токен, сервер обязан выполнить запрос"
  correct: 2
  explanation: |
    Скрытая кнопка — удобство, а не защита. Запрос виден в DevTools любому и
    повторяется из Postman, cURL, консоли. Сервер должен проверять роль на
    каждый запрос и отвечать `403` или `404`. Раз он выполнил удаление —
    любой наблюдатель может удалить любую задачу. Это высокий приоритет,
    и после исправления стоит проверить так же все опасные действия.

- id: web8-06
  type: card
  question: Какие четыре проверки сделать для одного действия из матрицы ролей?
  answer: |
    1. **Под ролью с правами** — кнопка есть, действие работает. Заодно
       это образец запроса.
    2. **Под ролью без прав** — кнопки нет или она неактивна, в том числе
       в меню, карточке, массовых действиях.
    3. **В обход интерфейса** — Copy as cURL под сильной ролью, токен
       слабой роли, Send. Ждём `403` или `404` и проверяем, что данные не
       изменились.
    4. **Прямой URL** на экран, который не положен, — «Нет доступа»,
       «Не найдено» или редирект, а не открытый экран.

- id: web8-07
  type: quiz
  question: "Менеджер видит кнопку «Удалить проект», хотя по требованию удалять ему нельзя. Нажимает — получает 403 «Недостаточно прав». Что это?"
  options:
    - "Security-баг высокого приоритета: дыра в правах"
    - "Баг интерфейса: кнопки быть не должно, но защита на сервере работает"
    - "Не баг: сервер же отказал"
    - "Вопрос аналитику: может, менеджеру можно удалять"
  correct: 1
  explanation: |
    Есть требование — значит, лишняя кнопка — баг интерфейса: человек жмёт
    и получает ошибку. Но данные целы — сервер отказал правильно. Поэтому
    приоритет средний или низкий. Опасный вариант — обратный: кнопки нет,
    а сервер пропускает.

- id: web8-08
  type: card
  question: Как построить матрицу ролей для веб-фичи и чем она отличается от матрицы для API?
  answer: |
    Строки — действия, столбцы — роли (не забыть «без входа» и особые
    случаи вроде «исполнитель без членства»). Источник — **требования**,
    не интерфейс. Пустые ячейки — вопросы аналитику до тестирования.

    В вебе одно действие даёт несколько строк: видна ли кнопка или пункт
    меню, открывается ли экран по прямому адресу, пройдёт ли запрос в
    обход. Они ломаются по отдельности.

    Опасные ячейки — удаление, деньги, участники и роли, админские
    функции — проверяют в обход интерфейса в первую очередь.

- id: web8-09
  type: quiz
  question: "Тестировщик открыл Ивана и Анну в двух вкладках одного окна Chrome. Что не так?"
  options:
    - "Ничего, так удобнее переключаться"
    - "Вход общий на все вкладки: войдя Анной во второй, он во всех вкладках станет Анной, а первая вкладка этого не покажет"
    - "Chrome запрещает две вкладки одного сайта"
    - "Нужно было открыть их в двух окнах того же профиля"
  correct: 1
  explanation: |
    Вкладки и окна одного профиля браузера делят Local Storage и cookie.
    Второй вход заменяет токен, а первая вкладка продолжает показывать
    Ивана — но запросы уже идут от Анны. Для двух пользователей нужны
    разные хранилища: обычное окно и инкогнито, два профиля Chrome или два
    браузера.

- id: web8-10
  type: card
  question: Что проверить, если в одной вкладке вышел, а вторая вкладка открыта?
  answer: |
    - Что видно во второй вкладке сразу — старый экран или вход.
    - Что будет при **первом действии** во второй: понятное «Сессия
      завершена» и переход на вход — или непонятная ошибка, или, хуже,
      действие прошло.
    - Что после F5.
    - Отдельно: вход **другим пользователем** в одной вкладке, когда во
      второй открыт первый, — не действует ли вторая вкладка от имени
      нового пользователя, показывая старого.

    Если поведение не описано в требованиях — вопрос аналитику с риском.

- id: web8-11
  type: quiz
  question: "Администратор понизил роль менеджера до сотрудника. У сотрудника открыт браузер, кнопки менеджера видны до F5. Тестировщик со старым токеном отправил из Postman запрос, разрешённый только менеджеру, — 403. Как оценить?"
  options:
    - "Security-баг: кнопки видны"
    - "Защита работает; кнопки до F5 — вопрос аналитику невысокого приоритета"
    - "Всё идеально, писать нечего"
    - "Баг сервера: он должен был отозвать токен"
  correct: 1
  explanation: |
    Главное — сервер: понижение роли действует со следующего же запроса,
    даже со старым токеном. Значит, роль сервер берёт не из токена, а
    проверяет на каждый запрос. Интерфейс показывает старые права до
    перезагрузки — неудобство, а не дыра. Записать как «проверено» и задать
    вопрос: нужно ли обновлять права в интерфейсе без перезагрузки.

- id: web8-12
  type: card
  question: Что проверить в браузере при блокировке пользователя, смене пароля и смене роли?
  answer: |
    Главное — **уже открытые** сессии, а не только новый вход.

    - **Блокировка**: пользователь работает, администратор блокирует —
      следующее действие пользователя отказ и понятное сообщение.
    - **Смена пароля**: что с входом в другом браузере — по требованию.
    - **Повышение роли**: когда появились новые кнопки — сразу, после F5,
      после повторного входа.
    - **Понижение роли**: сервер уже отказывает на действия старой роли?
      Кнопки — вторично.

    Удобно: пользователь в одном браузере, администратор в другом.

- id: web8-13
  type: quiz
  question: "Сотрудника заблокировали. Войти он больше не может, но в уже открытом браузере работает до вечера. Разработчик: «Это JWT, так устроено». Что ответит тестировщик?"
  options:
    - "Согласится: JWT нельзя отозвать"
    - "Предложит сотруднику выйти самому"
    - "Заведёт баг: блокировка не завершает активные сессии; отзыв — вопрос реализации, а не ограничение JWT"
    - "Попросит удалить учётку вместо блокировки"
  correct: 2
  explanation: |
    Сервер может проверять статус пользователя на каждый запрос, вести
    чёрный список токенов или выдавать короткие токены. «Так устроено» —
    это выбор, а не закон. Последствие — уволенный или взломанный аккаунт
    работает до конца срока токена. Если команда решит оставить — пусть это
    будет записано в требованиях с конкретным сроком.

- id: web8-14
  type: quiz
  question: "После выхода пользователь нажал «Назад» и увидел свою выписку. Запрос со старым токеном из Postman даёт 401. Где вероятнее всего проблема?"
  options:
    - "Выход не работает на сервере"
    - "Браузер показал страницу из своей памяти — сервер не запретил её хранить или приложение не очистило свои данные"
    - "Это нормально: «Назад» всегда показывает прошлую страницу"
    - "Токен не удалился из Local Storage"
  correct: 1
  explanation: |
    Сервер уже не пускает — `401` это подтверждает. Значит, страница
    пришла не с сервера, а из памяти браузера или из памяти SPA. Проверить
    в Network, ушёл ли запрос. Решение — запрет хранения страниц с личными
    данными (`Cache-Control: no-store`) и очистка данных на клиенте при
    выходе. Это баг: личные данные видны следующему человеку за
    компьютером.

- id: web8-15
  type: card
  question: Что приложить к баг-репорту о правах?
  answer: |
    - **Роль и учётку**: «anna@example.com, роль в проекте — VIEWER». У
      одного человека в разных объектах разные роли.
    - **Объект** с `id`: проект, задача.
    - **Запрос и ответ**: метод, адрес, тело, код, текст ответа. cURL — без
      настоящего токена, вместо него `<токен VIEWER>`.
    - **Ожидание**: ссылка на требование или ячейку матрицы.
    - **Последствия**: «любой наблюдатель может удалить любую задачу» —
      сразу понятен приоритет.

- id: web8-16
  type: quiz
  question: "В интерфейсе в списке пользователей видны только имена. В Network в ответе на этот список — ещё телефоны и даты рождения всех пользователей. Что это?"
  options:
    - "Норма: на экране же не видно"
    - "Утечка данных: интерфейс скрыл, а ответ API отдаёт лишнее"
    - "Баг вёрстки: забыли показать столбцы"
    - "Вопрос дизайнеру: нужны ли эти столбцы"
  correct: 1
  explanation: |
    «Не видно на экране» не значит «защищено». Ответ API доступен любому,
    кто откроет DevTools. Сервер должен отдавать только то, что нужно этому
    пользователю. Это security-баг, приоритет — по чувствительности данных.

- id: web8-17
  type: card
  question: Как работать с сессиями и правами на задаче — по шагам?
  answer: |
    1. Выписать роли из требований — глобальные и в рамках объекта.
    2. Построить матрицу «роль × действие», пустые ячейки — вопросы
       аналитику.
    3. Подготовить учётки и отдельные окна на каждую роль.
    4. Пройти интерфейс под каждой ролью, окна рядом.
    5. Самые опасные действия — в обход интерфейса с токеном слабой роли.
    6. Прямые адреса закрытых экранов и чужих объектов.
    7. Сессия: выход и «Назад», старый токен, две вкладки, смена роли и
       блокировка на открытой сессии.
    8. Баг-репорт: роль, учётка, объект, запрос и ответ, последствия.

- id: web8-18
  type: card
  question: Как одновременно работать под двумя пользователями и быстро «состарить» сессию?
  answer: |
    **Два пользователя** — два отдельных хранилища: обычное окно и
    инкогнито, два профиля Chrome (удобно дать им разные цвета и имена)
    или два браузера. Две вкладки одного окна не подходят — вход общий.
    Окна ставят рядом: разница в кнопках видна сразу.

    **Состарить сессию** — DevTools → Application → удалить или испортить
    токен в Local Storage или cookie. Для cookie удобно расширение
    Cookie-Editor, но хватает и Application.

    Токен нужной роли проще всего взять из Network: Copy as cURL любого
    её запроса, токен — после `Bearer`.
