# Вопросы темы «Сеть, кэш и нестабильность». Формат — см. osnovy/bag-report.yaml.

- id: web9-01
  type: card
  question: Зачем тестировщику проверять веб-приложение на медленной и пропадающей сети?
  answer: |
    У разработчика сервер рядом и быстрый интернет — у пользователя метро,
    лифт и дача. Баги плохой сети на быстрой не видны вовсе: двойные
    заказы, вечные спиннеры, потерянный текст, ошибки, которые выглядят
    как пустой список, гонки ответов.

    Пользователь пишет «у меня оформилось два заказа», разработчик у себя
    воспроизвести не может. Тестировщик с Throttling и Offline в DevTools
    воспроизводит это за минуту — и пишет условия сети в баг-репорт.

- id: web9-02
  type: card
  question: Какие инструменты DevTools помогают «испортить» сеть и что делает каждый?
  answer: |
    Всё — на вкладке Network:

    - **Throttling** (No throttling → Slow 4G, 3G) — медленно все запросы
      вкладки;
    - **свой профиль** (Add… → Custom) — свои скорость и задержка,
      например «Метро»: 400/200 kbit/s, 2000 ms;
    - **Offline** — сети нет совсем;
    - **Block request URL** — падает один запрос, остальные работают;
    - **Block request domain** — падают все запросы к одному адресу:
      API, шрифтам, аналитике.

    Включать — после загрузки страницы, потом действие внутри
    приложения. И не забывать выключать.

- id: web9-03
  type: quiz
  question: "Тестировщик включил в DevTools Offline, нажал F5 и увидел заглушку браузера «Нет подключения к интернету». Заводит баг: «Сайт не показывает своё сообщение без сети». Что не так?"
  options:
    - "Всё верно: сайт обязан показывать своё сообщение при любом F5"
    - "Это заглушка браузера: без сети он не может скачать сам сайт. Нужно включить Offline после загрузки и сделать действие внутри приложения"
    - "Нужно было использовать Slow 4G вместо Offline"
    - "Баг, но на браузер, а не на сайт"
  correct: 1
  explanation: |
    При F5 без сети браузер не может получить ни одного файла сайта —
    показывать нечего, и он рисует свою заглушку. Это не баг приложения.
    Правильно: открыть страницу, потом включить Offline и нажать кнопку
    или перейти в раздел. Вот тут приложение обязано показать понятную
    ошибку. Исключение — сайты, которые обещают работу без сети (через
    Service Worker), — для них F5 без сети проверяют специально.

- id: web9-04
  type: card
  question: Как проверить «обрыв сети посреди действия» и что в нём главное?
  answer: |
    1. Профиль с задержкой 2 секунды — чтобы успеть.
    2. Нажать «Сохранить» и сразу переключить на Offline.
    3. Посмотреть экран и Network, потом вернуть сеть и проверить
       данные **по факту** — F5, API или база тестового стенда.

    Главное: **ответ не пришёл — не значит «не сохранилось».** Запрос мог
    дойти, сервер сохранил, а ответ потерялся. Пользователь видит ошибку,
    жмёт ещё раз — дубль. Хорошо: честное сообщение и введённые данные
    на месте. Плохо: ложный успех, потеря текста, вечный спиннер.

- id: web9-05
  type: quiz
  question: "Пользователь нажал «Отправить», пропала сеть, на экране «Не удалось отправить сообщение». Тестировщик записывает: «Сообщение не отправилось — проверено». Что он упустил?"
  options:
    - "Ничего: экран прямо сказал, что не отправилось"
    - "Нужно было проверить на сервере, не сохранилось ли сообщение на самом деле: ответ мог потеряться, а запрос — дойти"
    - "Нужно было сделать скриншот Console"
    - "Нужно было повторить на Slow 4G"
  correct: 1
  explanation: |
    Экран знает только то, что ответа не было. Дошёл ли запрос до
    сервера — экран не знает. Если сообщение сохранилось, а пользователь
    видит ошибку, он отправит его второй раз — дубль. Поэтому после обрыва
    результат проверяют по факту: F5, API, база тестового стенда. И
    смотрят, защищён ли сервер от повтора.

- id: web9-06
  type: card
  question: Что проверить в веб-приложении на медленной сети — чек-лист?
  answer: |
    - Загрузка видна: скелетон, спиннер; экран не белый.
    - Кнопка неактивна на время запроса, двойной клик — один запрос.
    - Есть предел ожидания и понятное сообщение, а не вечный спиннер.
    - Ошибка понятна человеку и **не выглядит как пустой список**.
    - Есть «Повторить» или приложение повторяет само.
    - Введённые данные не потерялись.
    - После возвращения сети приложение «оживает» без перезагрузки.
    - Уход со страницы во время запроса ничего не ломает.
    - Порядок ответов: старый медленный ответ не перезаписал новый.

- id: web9-07
  type: card
  question: Что такое гонка ответов и как её поймать?
  answer: |
    На медленной сети ответы приходят не в том порядке, в котором ушли
    запросы. Пример — поиск: набрал «ко», потом «кот»; ответ на «ко» пришёл
    последним и перезаписал экран. В строке «кот», в результатах — кофе.

    Как ловить: медленный профиль и **быстрые** действия — печатать и
    стирать, переключать фильтры, вкладки, страницы, жать «+» в корзине.
    Сравнивать экран с последним действием, порядок ответов — в Network,
    колонка Waterfall. Ожидание: на экране всегда результат последнего
    действия.

- id: web9-08
  type: quiz
  question: "Нужно проверить, что экран покажет при ответе сервера 500. Бэкенд исправен. Тестировщик открывает Local Overrides в DevTools. Получится?"
  options:
    - "Да, Local Overrides меняет всё, включая код ответа"
    - "Нет: Local Overrides меняет содержимое и заголовки, но не код. Для кода — Requestly или прокси (Charles, Proxyman, Fiddler)"
    - "Да, если поменять в теле поле status на 500"
    - "Нет, такое можно проверить только остановив бэкенд"
  correct: 1
  explanation: |
    Local Overrides подменяет файл ответа — содержимое и заголовки. Код
    ответа так не поменять: поле `status` в теле — это просто данные,
    фронт по-прежнему получит `200`. Для `500`, `503`, `404`, `429` нужны
    Requestly в браузере или прокси. Останавливать бэкенд — грубый способ:
    он даёт «нет ответа», а не `500`, и на общем стенде мешает всем.

- id: web9-09
  type: card
  question: Чем прокси (Charles, Proxyman, Fiddler) отличается от Requestly и зачем ему сертификат?
  answer: |
    **Requestly** — расширение браузера: правила подмены для запросов
    этого браузера — код, тело, задержка, перенаправление.

    **Прокси** — программа, через которую идёт трафик всего компьютера или
    телефона. Умеет то же самое, но для **любых** программ, включая
    мобильные приложения. Поэтому в мобильном тестировании это основной
    инструмент.

    Почти весь трафик — HTTPS, зашифрован. Чтобы прокси его видел, на
    устройство ставят сертификат прокси. Делают это только на своём
    тестовом устройстве и только для своих тестовых стендов.

- id: web9-10
  type: quiz
  question: "Тестировщик подменил через Requestly код ответа на 404, а тело оставил от успешного ответа. Экран показал общую ошибку вместо «Не найдено». Заводит баг: «404 не распознаётся». Прав ли он?"
  options:
    - "Прав: при 404 всегда должно быть «Не найдено»"
    - "Не обязательно: фронт читает и тело ошибки. Настоящий сервер отдаёт 404 с телом ошибки в своём формате — подменять нужно правдоподобно и сначала повторить с таким телом"
    - "Не прав: Requestly вообще не умеет менять код"
    - "Прав, но приоритет низкий"
  correct: 1
  explanation: |
    Код и тело ошибки фронт разбирает вместе: из тела он берёт текст и
    код ошибки. Сервер, который «вдруг» отвечает `404` с телом успешного
    ответа, в жизни не встречается — тестировщик создал невозможную
    ситуацию. Сначала повторить с телом из спецификации API. Если и тогда
    экран неверный — баг. И в баг-репорте честно пишут, что ответ
    подменён и как.

- id: web9-11
  type: card
  question: Почему после релиза пользователь может видеть старую версию сайта или белый экран?
  answer: |
    Браузер хранит в кэше JS, CSS, картинки, иногда и сам `index.html`.
    После релиза он может взять **старые** файлы из кэша, а API уже
    новый. Старый фронт получает ответ в новом формате и ломается:
    ошибка, пустой список, белый экран.

    Ещё вариант — вкладка открыта со вчера: старый JS живёт в памяти
    вкладки. Ещё — CDN или Service Worker отдают старые файлы.

    У команды всё работает, потому что у них Disable cache или инкогнито.

- id: web9-12
  type: card
  question: Зачем в именах файлов хеш вроде app.3f9a1c.js и что он даёт тестировщику?
  answer: |
    Хеш — отпечаток содержимого. Поменялся код — поменялось имя файла,
    браузер не найдёт его в кэше и скачает. Поэтому файлы с хешем можно
    кэшировать надолго. А `index.html` без хеша — его не кэшируют или
    кэшируют с проверкой у сервера: именно он говорит, какой JS брать.

    Тестировщику хеш — **версия фронта**. Network → фильтр JS → имя
    главного файла. Разный хеш у тебя и у разработчика — вы смотрите
    разные сборки. Хеш пишут в баг-репорт.

- id: web9-13
  type: quiz
  question: "Тестировщик включил галочку Disable cache, закрыл DevTools и проверил сайт после релиза. Что не так?"
  options:
    - "Ничего, галочка действует, пока её не снимут"
    - "Disable cache работает только при открытых DevTools — он проверял с кэшем, сам того не зная"
    - "Disable cache нужно включать в настройках браузера, а не в DevTools"
    - "После релиза кэш не важен"
  correct: 1
  explanation: |
    Галочка Disable cache действует, только пока DevTools открыты. Закрыл —
    сайт снова живёт с кэшем. Для «чистой» проверки без DevTools —
    инкогнито или Empty cache and hard reload. И помнить, что после
    релиза нужны оба режима: без кэша — «как задумано», с кэшем — «как у
    пользователя».

- id: web9-14
  type: card
  question: Какие есть способы сбросить кэш и чем они отличаются?
  answer: |
    - **F5** — страницу браузер перепроверит, файлы часто возьмёт из кэша.
    - **Жёсткая перезагрузка** (Cmd+Shift+R, Ctrl+F5) — скачать заново всё
      для этой страницы.
    - **Disable cache** в Network — не брать кэш, пока открыты DevTools.
    - **Empty cache and hard reload** — правый клик по кнопке обновления
      при открытых DevTools: очистить кэш сайта и перезагрузить.
    - **Инкогнито** — чистый браузер: без кэша, хранилища, расширений.
    - **Clear site data** в Application — стереть всё, включая вход.

- id: web9-15
  type: quiz
  question: "Разработчик закрыл баг комментарием «Почистите кэш — всё работает». После очистки действительно работает. Что делает мидл?"
  options:
    - "Соглашается и закрывает"
    - "Выясняет, где было старое: если исправление просто не доехало до его браузера — ок; если старая версия застревает у пользователей после релиза — это отдельный баг на кэширование"
    - "Просит разработчика отключить кэш на сайте полностью"
    - "Пишет пользователям инструкцию по очистке кэша"
  correct: 1
  explanation: |
    «Почистите кэш» решает проблему одного тестировщика, но не тысяч
    пользователей — они кэш чистить не будут. Если после релиза старая
    версия застревает у пользователей, это баг выкладки: заголовки кэша
    `index.html`, CDN, Service Worker. Отключать кэш полностью не нужно —
    это замедлит сайт для всех; нужно правильно кэшировать.

- id: web9-16
  type: card
  question: Как проверить сайт после релиза с учётом кэша?
  answer: |
    1. До релиза открыть сайт в обычном окне, записать хеш главного
       JS-файла.
    2. После релиза — **обычная** перезагрузка в том же окне: хеш новый,
       сайт работает. Это сценарий пользователя.
    3. Вкладка, открытая до релиза, без перезагрузки: сделать несколько
       действий — старый фронт с новым API не ломается?
    4. Инкогнито — новая версия «в чистом виде».
    5. Заголовки `index.html` в Network: нельзя ли его хранить без
       проверки.

- id: web9-17
  type: quiz
  question: "Список задач на экране пуст: «Задач пока нет». В Network запрос списка — (failed). Как оценить?"
  options:
    - "Норма: задач нет, раз сервер ничего не вернул"
    - "Баг: ошибка загрузки выглядит как пустое состояние — пользователь решит, что данных нет"
    - "Баг сервера, фронт ни при чём"
    - "Вопрос дизайнеру о тексте пустого состояния"
  correct: 1
  explanation: |
    `(failed)` — ответа не было вовсе. Экран не знает, есть ли задачи, но
    утверждает, что их нет. Человек может испугаться, создать дубль или
    уйти. Ожидание — отдельное состояние ошибки с «Повторить». Если в
    требованиях его нет — всё равно находка: баг с риском и вопрос
    аналитику, какое состояние ошибки должно быть у списка.

- id: web9-18
  type: quiz
  question: "Тестировщик проверил сайт с Throttling 3G в DevTools и пишет: «На мобильном интернете работает». Что не так?"
  options:
    - "Всё верно: 3G и есть мобильный интернет"
    - "Throttling эмулирует только скорость и задержку для вкладки — не потерю пакетов, переключение сетей, слабый телефон. Это часть проверки, а не вся"
    - "Нужно было выбрать Slow 4G"
    - "Throttling не влияет на запросы к API"
  correct: 1
  explanation: |
    Throttling ловит большую часть багов плохой сети: нет загрузки,
    двойные отправки, гонки. Но настоящая мобильная сеть ещё теряет
    пакеты, переключается между Wi-Fi и мобильной связью, у телефона
    слабее процессор и другой браузер. Для этого — прокси с настройками
    сети, реальные устройства, иногда проверка «в поле».

- id: web9-19
  type: card
  question: Что приложить к баг-репорту о проблеме сети или кэша?
  answer: |
    - **Условия сети**: профиль (скорость, задержка), «Offline через 1 с
      после клика», какой запрос заблокирован, какое правило подмены.
    - **Network**: `(failed)` или код, сколько одинаковых запросов ушло —
      скриншот.
    - **Версию**: хеш главного JS-файла, с кэшем или без, браузер.
    - **Что с данными на самом деле**: сохранилось ли на сервере — по
      факту, а не по экрану.
    - По просьбе — HAR, без токенов и паролей.

    Без условий сети разработчик скажет «у меня работает» — и будет прав.

- id: web9-20
  type: quiz
  question: "В Network у файла app.3f9a1c.js в колонке Size написано (disk cache), а у документа — статус 304. Что это значит?"
  options:
    - "Оба файла не загрузились — нужно завести баг"
    - "JS взят из кэша без обращения к серверу; документ браузер перепроверил, сервер ответил «не изменился» — взят из кэша"
    - "Оба файла скачаны заново"
    - "304 — ошибка сервера"
  correct: 1
  explanation: |
    `(disk cache)` и `(memory cache)` — файл взят из кэша, запроса к
    серверу не было. `304 Not Modified` — браузер спросил «у меня такая
    версия, она свежая?» по `ETag` или `Last-Modified`, сервер ответил
    «да». Это нормальная работа кэша, не ошибка. Скачанный заново файл —
    `200` и размер в килобайтах.
