# Вопросы темы «Навигация, URL и состояние». Формат — см. osnovy/bag-report.yaml.

- id: web7-01
  type: card
  question: Почему тестировщику важна навигация, если все кнопки сайта работают?
  answer: |
    Пользователь живёт не только кнопками сайта, но и браузером: нажимает
    «Назад», обновляет страницу, открывает ссылки в новых вкладках,
    пересылает адрес коллеге, сохраняет в закладки.

    Главная мысль: **то, что я вижу, можно открыть по ссылке, обновить и
    вернуться назад — и не потерять.**

    Разработчик обычно проверяет свои кнопки, а «Назад» и F5 — почти
    никогда. Поэтому здесь много быстрых находок: сброшенные фильтры,
    белый экран после F5, ссылка, которая ведёт на главную. А правка
    номера в адресе может показать чужие данные — это уже безопасность.

- id: web7-02
  type: card
  question: Из каких частей адреса состоит состояние экрана и за что отвечает каждая?
  answer: |
    На примере `/projects/2?status=TODO&page=2#comments`:

    - **Путь** `/projects/2` — какой экран и какой объект. Число — `id`,
      его можно поменять руками.
    - **Параметры** `?status=TODO&page=2` — как показан экран: фильтр,
      поиск, страница списка, сортировка.
    - **Якорь** `#comments` — место на странице или вкладка. На сервер не
      уходит никогда, его обрабатывает браузер.

- id: web7-03
  type: card
  question: Что должно храниться в адресе страницы, а что — нет?
  answer: |
    **Должно** (если так решено в требованиях): экран и объект, фильтры,
    поиск, номер страницы списка, сортировка, открытая вкладка или
    карточка. Правило: что человек захочет переслать коллеге — то в
    адресе.

    **Не должно:** токены входа, пароли, персональные данные (email,
    телефон, паспорт), внутренние ключи.

    Почему: адрес остаётся в истории браузера, попадает в логи серверов и
    аналитики, может уйти другому сайту в заголовке `Referer` и
    пересылается целиком.

- id: web7-04
  type: card
  question: Что такое «тройка» проверок и что она ловит?
  answer: |
    Три действия на каждой странице, которую тестируешь:

    1. **F5** — тот же экран, ты всё ещё вошёл, состояние по требованиям
       на месте; нет белого экрана и `404` от сервера.
    2. **«Назад»** — ушёл и вернулся: тот же экран, фильтр, страница
       списка; не выкинуло с сайта; форма не отправилась снова.
    3. **Ссылка в новой вкладке** — скопировал адрес: открылся тот же
       экран. В инкогнито — вход, а потом возврат на этот же экран.

    Минута на экран, а ловит целый класс багов. Что пропало — сверяешь с
    требованиями.

- id: web7-05
  type: quiz
  question: "Пользователь выбрал фильтр, открыл карточку товара и нажал «Назад». Фильтр сбросился. В требованиях про сохранение фильтров ничего нет. Что делает тестировщик?"
  options:
    - "Заводит баг: фильтр всегда должен сохраняться"
    - "Ничего: раз в требованиях не сказано, так и задумано"
    - "Задаёт вопрос аналитику: должны ли фильтры переживать «Назад» и F5"
    - "Просит разработчика сохранять фильтры в адресе"
  correct: 2
  explanation: |
    Нет требования — нет и эталона. Это не баг и не «норма», а дыра в
    требованиях. Тестировщик задаёт вопрос аналитику с аргументами:
    человек теряет настройку, ссылку на отфильтрованный список нельзя
    переслать. Решение фиксируют в требованиях. Как именно реализовать —
    например, в адресе, — решает команда, а не тестировщик.

- id: web7-06
  type: quiz
  question: "SPA: при переходах по приложению всё работает. F5 на /orders/15 на тестовом стенде даёт «404 Not Found» от сервера. Локально у разработчика F5 работает. Где вероятнее всего проблема?"
  options:
    - "В коде приложения: оно неправильно строит адреса"
    - "В настройке сервера стенда: нет правила «на любой незнакомый адрес отдавать приложение»"
    - "В браузере тестировщика: нужно очистить кэш"
    - "Это не баг: в SPA F5 и не должен работать"
  correct: 1
  explanation: |
    Пока кликаешь внутри SPA, адрес меняет JS и сервер ни о чём не
    спрашивают. При F5 браузер просит у сервера страницу `/orders/15`.
    Если сервер не настроен отдавать приложение на любой адрес (такое
    правило называют fallback), он ищет файл, не находит и отвечает `404`.
    Локальный инструмент разработчика так умеет — поэтому «у меня
    работает». Проверяют в Network, фильтр Doc. F5 на внутренних адресах
    проверяют на каждом стенде.

- id: web7-07
  type: card
  question: Что проверить в «прямой ссылке» на экран?
  answer: |
    - Адрес в новой вкладке того же браузера — тот же экран.
    - В другом браузере или в инкогнито (без входа) — страница входа, а
      **после входа — возврат на этот экран**, а не на главную.
    - Пользователь без прав — понятное «Не найдено» или «Нет доступа», а
      не белый экран и не чужие данные.
    - Ссылки из писем и уведомлений — тем же путём: без входа и под
      другим пользователем.

- id: web7-08
  type: quiz
  question: "Тестировщик открыл ссылку из письма «Посмотреть заказ» — открылся заказ. Он пишет: «Ссылка работает». Какой проверки не хватает в первую очередь?"
  options:
    - "Открыть ссылку в другом почтовом клиенте"
    - "Открыть ссылку без входа: попадёт ли человек на заказ после входа"
    - "Проверить, что письмо пришло быстро"
    - "Открыть ссылку дважды подряд"
  correct: 1
  explanation: |
    Тестировщик был уже вошедшим. Покупатель часто открывает письмо на
    телефоне, где не входил: его отправит на вход, а после входа — нередко
    на главную, и ссылка потеряется. Проверка — в инкогнито. Следом —
    чужой аккаунт: переслал письмо другому, и тот не должен увидеть заказ.

- id: web7-09
  type: card
  question: Как проверить ручную правку адреса?
  answer: |
    Адресная строка — тоже поле ввода. Значения как для тест-дизайна:

    - **свой** `id` — открывается;
    - **несуществующий** `99999` — экран «Не найдено» со ссылкой на главную;
    - **чужой** — отказ («Не найдено» или «Нет доступа»), а не чужие
      данные;
    - **мусор**: `0`, `-1`, `abc`, `1.5`;
    - **параметры**: `?page=-1`, `?page=abc`, `?page=99999`, пустое и
      несуществующее значение фильтра, параметр два раза;
    - **неизвестный адрес** — экран «Страница не найдена»;
    - регистр и слэш в конце.

    Плохо: белый экран, вечная загрузка, ошибка `500`, чужие данные.

- id: web7-10
  type: quiz
  question: "Пользователь поменял в адресе /orders/1001 на /orders/1002 и увидел чужой заказ. Кнопок «Изменить» и «Отменить» на нём нет. Как оценить ситуацию?"
  options:
    - "Всё в порядке: изменить чужой заказ нельзя"
    - "Мелкий баг интерфейса: не нужно показывать чужие заказы"
    - "Серьёзный security-баг: чужие данные уже утекли, а скрытая кнопка не защищает от запроса через API"
    - "Не баг: номера заказов и так видны в письмах"
  correct: 2
  explanation: |
    Это классическая уязвимость IDOR: доступ к чужому объекту подменой
    номера. Утекли имя, адрес, состав заказа. Скрытая кнопка — не защита:
    `PATCH` можно отправить через Postman. Проверка — запросы к чужому
    заказу со своим токеном через API: ожидается `404` или `403`.

- id: web7-11
  type: quiz
  question: "Иван открывает чужой проект по адресу и видит «Проект не найден или у вас нет к нему доступа». На несуществующий проект — тот же текст. Почему так могут сделать специально?"
  options:
    - "Чтобы не писать два разных текста"
    - "Чтобы перебором номеров нельзя было узнать, какие чужие проекты существуют"
    - "Потому что сервер не умеет отличать эти случаи"
    - "Это ошибка: на чужой проект всегда надо писать «Нет доступа»"
  correct: 1
  explanation: |
    Если на чужой объект отвечать «Нет доступа», а на несуществующий —
    «Не найдено», перебором номеров можно составить список существующих
    объектов. Единый ответ (и `404` вместо `403` в API) этого не
    раскрывает. Так это и описано в спецификации TaskFlow. Но решение
    должно быть осознанным и записанным — иначе это вопрос аналитику.

- id: web7-12
  type: quiz
  question: "Пользователь открыл несуществующий адрес SPA и видит экран «Страница не найдена». В Network у загрузки страницы код 200. Что это?"
  options:
    - "Всё правильно: страница загрузилась успешно"
    - "Мягкий 404: человек видит «не найдено», а сервер ответил 200 — важно, если сайту нужен поиск"
    - "Ошибка сервера"
    - "Кэш браузера показал старую страницу"
  correct: 1
  explanation: |
    В SPA сервер на любой адрес отдаёт приложение с кодом `200`, а экран
    «не найдено» рисует JS. Поисковик смотрит на код и считает страницу
    настоящей. Для сайта, которому важен поиск, нужен честный `404`; для
    закрытого личного кабинета обычно не критично — уточняют у команды.
    Хуже, когда экрана «не найдено» нет вовсе и пользователь видит пустую
    страницу.

- id: web7-13
  type: card
  question: Что проверить у кнопки «Назад» браузера?
  answer: |
    - Возвращает на предыдущий экран приложения, а не с сайта и не на
      главную; «Вперёд» возвращает обратно.
    - Состояние по требованиям на месте: фильтр, страница, поиск,
      прокрутка.
    - Не отправляет форму повторно — после оплаты или заказа нет второго
      списания.
    - После выхода не показывает личные данные, после входа — не
      показывает форму входа.
    - История не засорена: не нужно жать «Назад» двадцать раз из-за
      каждого клика по фильтру, но и новые экраны не пропускаются.
    - Открытое модальное окно — поведение одинаковое во всех окнах и
      описано дизайнером.

- id: web7-14
  type: quiz
  question: "После оплаты пользователь на странице «Спасибо» нажимает «Назад», браузер спрашивает «Отправить данные формы ещё раз?», он нажимает «Да» — и платёж проходит второй раз. Что здесь не так?"
  options:
    - "Ничего: пользователь сам согласился"
    - "Только браузер: он не должен задавать такой вопрос"
    - "Страница «Спасибо» — ответ прямо на отправку формы, а сервер не защищён от повторной оплаты; нужны и отдельный адрес «Спасибо», и проверка на сервере"
    - "Нужно запретить кнопку «Назад» на сайте"
  correct: 2
  explanation: |
    Если «Спасибо» — прямой ответ на отправку формы, «Назад» и F5
    браузер понимает как повтор отправки. Защит две: после оплаты —
    переход на отдельный адрес «Спасибо», и проверка на сервере, что
    одно и то же нельзя оплатить дважды. Пользователь не обязан
    понимать вопросы браузера. Запретить «Назад» нельзя и не нужно.

- id: web7-15
  type: card
  question: Что проверить в редиректах после действий?
  answer: |
    - **После создания** — на новый объект или в список, где он виден;
      «Назад» не открывает снова форму, которая создаст дубль.
    - **После удаления** — в список, а не на удалённый объект; «Назад» не
      ведёт на удалённый объект, а если ведёт — там «Не найдено».
    - **После входа** — туда, куда человек шёл.
    - **После выхода** — на вход; «Назад» не показывает данные.
    - **После оплаты или отправки формы** — на «Готово», откуда «Назад» и
      F5 не отправляют форму снова.

    Цепочку смотрят в Network с включённой галочкой Preserve log.

- id: web7-16
  type: quiz
  question: "Ctrl+клик по названию заказа в списке не открывает новую вкладку — заказ открывается в текущей. При наведении внизу браузера адрес не виден. Что вероятнее всего?"
  options:
    - "Браузер не поддерживает Ctrl+клик"
    - "Это не настоящая ссылка, а элемент, который делает переход кодом по клику"
    - "Новая вкладка открылась, но в фоне"
    - "Сайт запретил новые вкладки ради безопасности"
  correct: 1
  explanation: |
    У настоящей ссылки браузер знает адрес: показывает его при наведении,
    открывает по Ctrl+клику и клику колёсиком, предлагает «Открыть в новой
    вкладке» в меню. Если ничего этого нет — переход сделан кодом.
    Пользователь не сможет открыть несколько заказов в разных вкладках.
    Обычно это замечание с низким приоритетом, для часто используемых
    списков — заметное.

- id: web7-17
  type: quiz
  question: "Продакт хочет, чтобы отчётом можно было поделиться без входа. Разработчик предлагает адрес /report/7?token=<токен входа пользователя>. Что ответит тестировщик?"
  options:
    - "Отлично: токен в адресе — стандартная практика"
    - "Нормально, если сайт работает по HTTPS"
    - "Нельзя: токен входа даёт доступ ко всему аккаунту, а адрес живёт в истории, логах и пересылках; нужен отдельный ограниченный токен только на этот отчёт"
    - "Нормально, если токен длинный"
  correct: 2
  explanation: |
    HTTPS защищает адрес в пути по сети, но не в истории браузера, логах
    серверов и аналитики и не в пересланном сообщении. Токен входа в
    адресе отдаёт получателю весь аккаунт. Если нужна ссылка без входа —
    отдельный токен на один отчёт, только чтение, с ограниченным сроком и
    возможностью отозвать. Похоже на ссылку восстановления пароля: там
    токен в адресе допустим, потому что он одноразовый и недолго живёт.

- id: web7-18
  type: quiz
  question: "Две вкладки с одной задачей. В первой поменяли описание, во второй — старое описание. Во второй поменяли статус и сохранили. Новое описание пропало. Что вероятнее всего?"
  options:
    - "Сервер потерял данные"
    - "Вторая вкладка отправила всю задачу со старым описанием и затёрла новое"
    - "Первая вкладка не сохранила изменение"
    - "Так всегда бывает с двумя вкладками, это не баг"
  correct: 1
  explanation: |
    Если при сохранении клиент отправляет весь объект, а не только
    изменённое поле, вторая вкладка перезаписывает свежие данные старыми.
    Проверяют в Network: что ушло в запросе. Это баг потери данных.
    Обычное решение — сервер замечает, что объект изменился после
    загрузки, и предупреждает пользователя.

- id: web7-19
  type: card
  question: Что приложить к баг-репорту о навигации?
  answer: |
    - **Адрес до и после** — целиком, с параметрами.
    - **Цепочку переходов** по шагам.
    - **Какая «Назад»** — кнопка браузера или кнопка на странице.
    - **Как открыт адрес** — кликом внутри, вставкой в новую вкладку, из
      письма, после F5.
    - **Вошёл ли и под какой ролью.**
    - **Стенд** — F5 может работать на одном и не работать на другом.
    - При редиректах — цепочку запросов из Network с Preserve log.

    Если состояние экрана есть в адресе, половину шагов заменяет одна
    ссылка.

- id: web7-20
  type: card
  question: Как работать с навигацией на задаче — по шагам?
  answer: |
    1. Выписать экраны фичи и их адреса; отметить, у чего своего адреса
       нет.
    2. Спросить до тестирования, что должно жить в адресе: фильтры, окна,
       вкладки.
    3. На каждом экране — «тройка»: F5, «Назад», адрес в новой вкладке.
    4. Ссылка без входа — в инкогнито, с возвратом после входа.
    5. Правка адреса: несуществующий, чужой, мусорный `id` и параметры.
    6. Переходы после создания, удаления, ухода с формы.
    7. Две вкладки, если фича про редактирование.
    8. Оформить: адреса до и после, цепочка, стенд, роль.
