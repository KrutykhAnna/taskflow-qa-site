# Вопросы темы «Производительность». Формат — см. osnovy/bag-report.yaml.

- id: web14-01
  type: card
  question: Что такое производительность сайта глазами пользователя?
  answer: |
    Насколько быстро сайт **откликается для человека**, а не «сколько
    миллисекунд отвечал сервер». Пользователь задаёт три вопроса:
    - **«Скоро уже?»** — появилось ли главное на экране;
    - **«Можно жать?»** — отвечает ли страница на клик;
    - **«Почему всё прыгает?»** — не уезжают ли элементы при загрузке.

    Задача тестировщика — заметить ухудшение, измерить его, сравнить с
    эталоном и понятно описать. Ускорять — работа разработчиков.

- id: web14-02
  type: card
  question: Что такое Core Web Vitals? Назови метрики и пороги.
  answer: |
    **Core Web Vitals** — три основные метрики скорости от Google:
    - **LCP** (Largest Contentful Paint) — когда появился самый большой
      элемент, «главное». Хорошо — до 2,5 с, плохо — больше 4 с;
    - **INP** (Interaction to Next Paint) — от действия до реакции экрана.
      Хорошо — до 200 мс, плохо — больше 500 мс;
    - **CLS** (Cumulative Layout Shift) — насколько прыгает макет. Число без
      единиц. Хорошо — до 0,1, плохо — больше 0,25.

    Пороги — по рекомендациям Google, их иногда пересматривают. INP в 2024
    году заменил FID — задержку первого действия.

- id: web14-03
  type: card
  question: Что такое TTFB и где его увидеть?
  answer: |
    **TTFB** (Time To First Byte) — время до первого байта ответа: как
    быстро **сервер начал отвечать**.

    Где: DevTools → Network → клик по запросу → вкладка **Timing** →
    строка **Waiting for server response** (в старых версиях — Waiting
    (TTFB)). Рядом — **Content Download**: сколько скачивался ответ.

    Большой TTFB — первым делом вопрос к бэкенду или сети.

- id: web14-04
  type: quiz
  question: "Запрос к API идёт 3 с. В Timing: Waiting for server response — 2,9 с, размер ответа — 3 КБ. Где, скорее всего, проблема?"
  options:
    - "На фронтенде: тяжёлый JavaScript"
    - "На бэкенде: сервер долго готовит ответ"
    - "Ответ слишком большой"
    - "Медленный интернет у тестировщика"
  correct: 1
  explanation: |
    Почти всё время — ожидание ответа сервера, а сам ответ крошечный.
    Значит, сервер долго думает: медленный запрос к базе, тяжёлый расчёт.
    Перед выводом стоит проверить, что throttling выключен. В баг —
    запрос с параметрами и скриншот Timing.

- id: web14-05
  type: quiz
  question: "Нажал «Применить фильтр». Запрос в Network — 90 мс. Экран не отвечает ещё 2 секунды. Где искать причину?"
  options:
    - "На бэкенде: Network врёт"
    - "На фронтенде: время уходит на код страницы после ответа. Доказать — записью Performance"
    - "Это throttling"
    - "Это нормально, бага нет"
  correct: 1
  explanation: |
    Запрос быстрый — сервер ни при чём. Две секунды браузер чем-то занят
    после ответа: обрабатывает данные, перерисовывает большой список.
    Запись во вкладке **Performance** покажет длинную задачу — это и есть
    доказательство для фронтенд-разработчика.

- id: web14-06
  type: card
  question: Как правильно запускать Lighthouse для замера скорости?
  answer: |
    - **окно инкогнито** — без расширений, они портят замер;
    - Categories — только **Performance**;
    - **Mobile** или **Desktop** — осознанно и одинаково для сравнений.
      Mobile замедляет сеть и процессор, оценка ниже;
    - **3–5 прогонов**, в отчёт — **медиана**;
    - не трогать вкладку во время замера;
    - записать условия: браузер, режим, данные, страница.

- id: web14-07
  type: quiz
  question: "Три прогона Lighthouse: 64, 71, 90. Что записать в отчёт?"
  options:
    - "90 — лучший результат показывает, на что способен сайт"
    - "64 — честнее брать худший"
    - "71 — медиану: значение посередине не боится одного случайного выброса"
    - "75 — среднее арифметическое"
  correct: 2
  explanation: |
    Оценка Lighthouse скачет от прогона к прогону. Медиана — значение
    посередине, если расставить по порядку, — устойчива к одному
    случайному выбросу вроде 90. Среднее этот выброс «тянет» за собой.
    Если разброс такой большой — повод сделать ещё пару прогонов.

- id: web14-08
  type: quiz
  question: "Почему в отчёте Lighthouse нет INP?"
  options:
    - "INP отменили"
    - "Lighthouse только загружает страницу и никуда не нажимает — мерить отклик на действие не на чем. Вместо него — TBT"
    - "INP есть только на Desktop"
    - "INP считается только на сервере"
  correct: 1
  explanation: |
    INP — это время от действия человека до реакции экрана. Lighthouse
    действий не совершает. Поэтому он показывает **TBT** (Total Blocking
    Time) — сколько страница была занята при загрузке и не смогла бы
    ответить на клик. Живой INP можно увидеть во вкладке Performance в
    новых версиях Chrome или в полевых данных PageSpeed Insights.

- id: web14-09
  type: quiz
  question: "Lighthouse на localhost — 97. Можно сказать, что продукт быстрый у пользователей?"
  options:
    - "Да, 97 — отличная оценка"
    - "Да, если запускали в инкогнито"
    - "Нет: на localhost сервер рядом, сети нет, данных мало. Это годится только для сравнения «до/после» в одинаковых условиях"
    - "Нет, Lighthouse не работает на localhost"
  correct: 2
  explanation: |
    Лабораторный замер на своём компьютере — оптимистичный: ни реальной
    сети, ни CDN, ни реального объёма данных. Он полезен, чтобы поймать
    **ухудшение** между сборками. Как у реальных людей — показывают
    полевые данные, например PageSpeed Insights для публичного сайта.

- id: web14-10
  type: card
  question: Что такое PageSpeed Insights и чем его данные отличаются от Lighthouse в DevTools?
  answer: |
    **PageSpeed Insights** (pagespeed.web.dev) — сайт Google, показывает
    два отчёта:
    - **полевые данные** — как сайт работает у реальных посетителей в
      Chrome за последние 28 дней;
    - **лабораторный** замер Lighthouse на серверах Google.

    Полевые данные есть только у публичных сайтов с заметным числом
    посетителей. Для localhost и закрытого стенда их не будет.

- id: web14-11
  type: card
  question: Что тестировщику делать во вкладке Performance?
  answer: |
    Глубоко — это инструмент разработчика. Тестировщику хватает:
    - **записать** медленное действие: Record → действие → Stop, найти на
      дорожке Main **длинные задачи** (дольше 50 мс, с красным
      треугольником) и приложить запись к багу;
    - **замедлить процессор** — CPU 4x или 6x, чтобы увидеть то, что
      увидит владелец недорогого телефона;
    - в новых Chrome — **живые метрики** LCP, CLS, INP на своих действиях.

    Рядом: **Performance monitor** — живые графики процессора и памяти,
    **Memory** — снимки памяти, если подозреваешь утечку.

- id: web14-12
  type: quiz
  question: "Чем замедление процессора (CPU 6x) отличается от замедления сети (Slow 4G)?"
  options:
    - "Ничем, это одна настройка"
    - "CPU замедляет запросы, сеть — JavaScript"
    - "Сеть замедляет запросы, процессор — работу JavaScript на странице. Это разные проблемы и разные проверки"
    - "CPU throttling работает только на телефоне"
  correct: 2
  explanation: |
    Медленная сеть — запросы и файлы идут дольше. Медленный процессор —
    страница дольше выполняет свой код: разбирает JS, рисует списки,
    реагирует на клики. Пользователь недорогого телефона страдает от
    обоих, поэтому проверяют их вместе и по отдельности.

- id: web14-13
  type: card
  question: Что проверить руками по производительности на любой странице?
  answer: |
    - **размеры файлов**: Network → Disable cache → сортировка по Size;
    - **сжатие**: `Content-Encoding: gzip` или `br` у JS и CSS;
    - **сколько запросов и веса**: подвал Network;
    - **одинаковые запросы** и запросы **на каждую строку** списка;
    - **большие ответы API**: мегабайты на 20 строк на экране;
    - **ленивая загрузка** картинок ниже экрана;
    - **сдвиги** при загрузке: Rendering → Layout Shift Regions;
    - **много данных**: сотни и тысячи записей;
    - **медленное устройство**: CPU 4x–6x + медленная сеть;
    - у долгих операций есть **индикатор**.

- id: web14-14
  type: quiz
  question: "При открытии списка из 20 проектов в Network 21 запрос к API: один за списком и по одному за участниками каждого проекта. Как это называется и что с этим делать?"
  options:
    - "Нормальная пагинация, ничего не делать"
    - "Схема «N+1». Замечание с числами: растёт вместе с размером страницы; вопрос — нельзя ли получать нужное одним запросом"
    - "Утечка памяти, баг критический"
    - "Нагрузочное тестирование, передать специалисту"
  correct: 1
  explanation: |
    «N+1» — один запрос за списком и ещё по одному на каждый элемент. На
    20 строках — 21 запрос, на 100 — 101. На маленьких данных быстро, но
    растёт с объёмом. Это вопрос и к фронту, и к API: часто API просто не
    отдаёт нужное поле в списке. В замечание — число запросов и как оно
    растёт.

- id: web14-15
  type: quiz
  question: "Через секунду после загрузки сверху появился баннер cookies и сдвинул кнопку «Оплатить» вниз. Какую метрику это ухудшает?"
  options:
    - "LCP"
    - "INP"
    - "CLS"
    - "TTFB"
  correct: 2
  explanation: |
    **CLS** — суммарный сдвиг макета: насколько элементы прыгают, пока
    страница догружается. Опасность — человек целится в одну кнопку и
    попадает в другую. Подсветить сдвиги: DevTools → Rendering → Layout
    Shift Regions. Исправление — заранее держать место под баннер или
    показывать его поверх страницы, ничего не сдвигая.

- id: web14-16
  type: quiz
  question: "Сервер отвечает на запрос документа за 100 мс, а LCP — 5 секунд. Что из этого НЕ может быть причиной?"
  options:
    - "Главный элемент — картинка на 6 МБ"
    - "Огромный JS без сжатия, который нужно скачать и запустить"
    - "Данные для главного блока запрашиваются только после запуска JS"
    - "Медленный ответ сервера на запрос документа"
  correct: 3
  explanation: |
    Сервер по условию отвечает быстро — значит, дело не в нём. Между
    ответом документа и появлением главного — скачивание JS, CSS, шрифтов
    и картинок, запуск JS, дополнительные запросы за данными. Любое из
    этого растягивает LCP. Ответ ищут в Network Waterfall и в подсказке
    Lighthouse, какой элемент посчитан LCP.

- id: web14-17
  type: card
  question: Чем проверка производительности в DevTools отличается от нагрузочного тестирования?
  answer: |
    | | DevTools и Lighthouse | Нагрузочное |
    |---|---|---|
    | Вопрос | быстро ли **одному** человеку? | выдержит ли сервер **тысячи** одновременно? |
    | Что меряем | загрузку, отклик, вес файлов | запросы в секунду, ошибки под нагрузкой |
    | Инструменты | DevTools, Lighthouse, PageSpeed Insights | JMeter, k6, Gatling |
    | Кто | любой тестировщик | специалист по нагрузке или автоматизатор |

    «Одному быстро» не значит «быстро тысяче».

- id: web14-18
  type: card
  question: Как оформить баг «стало медленнее»?
  answer: |
    - **условия замера**: устройство, браузер, инкогнито, режим
      Mobile/Desktop, throttling, данные на стенде;
    - **цифры до и после** — медианы из 3–5 прогонов, а не один замер;
    - **что именно** медленнее: запрос и его Timing, метрика LCP/TBT/CLS,
      какой файл вырос;
    - **зависимость от объёма**, если есть: «на 20 записях разницы нет, на
      1 500 — в 12 раз»;
    - **вложения**: скриншоты Lighthouse до/после, HAR без секретов,
      запись Performance;
    - **влияние на пользователя**: сколько он ждёт и что видит.

- id: web14-19
  type: quiz
  question: "До релиза Lighthouse Desktop — 82, после релиза Lighthouse Mobile — 64. По одному прогону. Что верно?"
  options:
    - "Производительность упала на 18 баллов — баг высокой серьёзности"
    - "Сравнивать нельзя: разные режимы и по одному прогону. Нужно перемерить в одинаковом режиме, 3–5 прогонов, сравнить медианы и метрики"
    - "Mobile всегда врёт, смотреть только на Desktop"
    - "Производительность выросла"
  correct: 1
  explanation: |
    Mobile замедляет сеть и процессор и всегда даёт оценку ниже Desktop.
    Один прогон — случайность: разброс бывает 5–10 баллов. Пока это не
    баг, а повод перемерить: тот же режим, те же данные, несколько
    прогонов, медиана — и сравнивать не только оценку, но и метрики.
