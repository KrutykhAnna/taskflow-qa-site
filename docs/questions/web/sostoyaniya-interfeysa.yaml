# Вопросы темы «Состояния интерфейса». Формат — см. osnovy/bag-report.yaml.

- id: web4-01
  type: card
  question: Что такое состояния интерфейса и почему тестировщик проверяет их отдельно?
  answer: |
    **Состояния** — разные «настроения» экрана и элемента: загрузка,
    пусто, ошибка, данные; у кнопки — обычная, наведение, фокус,
    нажатая, неактивная.

    Дизайнер обычно рисует одно состояние — идеальное, с данными.
    Разработчик тоже делает его в первую очередь. А пользователь
    попадает во все: медленная сеть, первый вход, упавший сервер.

    Поэтому баги чаще всего прячутся не в нормальном состоянии, а в
    загрузке, пустоте и ошибке — их не видит никто, кроме тестировщика.

- id: web4-02
  type: card
  question: Какие состояния бывают у элемента (кнопки, поля) и что проверить в каждом?
  answer: |
    - **default** — как в макете.
    - **hover** — есть визуальный отклик, курсор-«рука», соседи не прыгают.
    - **focus** — видна рамка фокуса (особенно при переходе по Tab).
    - **active** — видно, что кнопка нажата.
    - **disabled** — выглядит иначе, курсор «запрещено», нажать нельзя
      никак: ни кликом, ни Enter.
    - **selected / checked** — видно, что выбрано, выбор не сбрасывается.
    - **read-only** — видно, что менять нельзя, но значение можно
      выделить и скопировать.
    - **error** — рамка и текст ошибки рядом с полем.

- id: web4-03
  type: card
  question: Как посмотреть hover и focus элемента, если при переходе мышью в DevTools наведение пропадает?
  answer: |
    Включить состояние принудительно: Elements → выбрать элемент →
    в панели Styles нажать **`:hov`** → поставить галочку `:hover`,
    `:focus`, `:active` или `:focus-visible`. Элемент будет «как под
    мышкой», пока галочка стоит.

    Фокус с клавиатуры удобно проверять и вживую: кликнуть в пустое
    место страницы и нажимать Tab.

- id: web4-04
  type: quiz
  question: "Рамка фокуса у кнопки видна, когда идёшь по странице клавишей Tab, и не видна после клика мышью. Что это?"
  options:
    - "Баг: фокус должен выглядеть одинаково всегда"
    - "Скорее всего, так задумано: стиль задан через :focus-visible, который различает клавиатуру и мышь"
    - "Баг браузера, нужно проверить в другом"
    - "Кнопка не получает фокус от мыши, это баг доступности"
  correct: 1
  explanation: |
    `:focus-visible` — состояние, которое браузер включает, когда фокус
    важно показать: обычно при работе с клавиатуры. После клика мышью
    рамку часто не показывают, чтобы не мешала. Баг — если рамки нет
    и при переходе по Tab: тогда человек без мыши не видит, где он.

- id: web4-05
  type: quiz
  question: "Кнопка «Отправить» серая, пока форма не заполнена. При клике ничего не происходит. Можно считать неактивное состояние проверенным?"
  options:
    - "Да: серая и не реагирует на клик"
    - "Нет: нужно ещё проверить повторные клики, Tab + Enter, Enter в поле формы и что в Network нет запросов"
    - "Да, если в макете она тоже серая"
    - "Нет: нужно проверить только цвет по дизайн-системе"
  correct: 1
  explanation: |
    Серый цвет — только вид. Кнопку могли «выключить» только стилем, а
    отправку оставить: второй клик проходит, Enter в поле отправляет
    форму. Проверяют поведение всеми способами и смотрят в Network, что
    запрос не ушёл. В Elements полезно убедиться, что у кнопки есть
    атрибут `disabled`, а не только класс.

- id: web4-06
  type: card
  question: Чем поле disabled отличается от read-only?
  answer: |
    - **Disabled** — «сейчас нельзя»: поле не участвует в работе, его
      значение часто не отправляется с формой, по Tab на него не попасть,
      текст бывает трудно выделить.
    - **Read-only** — «смотреть можно, менять нельзя»: значение видно,
      его можно выделить и скопировать, оно отправляется с формой.

    Для тестировщика главное — чтобы оба вида **отличались от обычного
    поля**. Иначе пользователь пытается печатать и думает, что сайт завис.

- id: web4-07
  type: card
  question: Какие состояния бывают у экрана со списком данных?
  answer: |
    - **Загрузка** — скелетон или спиннер.
    - **Пусто** — три разных случая: первый вход, фильтр ничего не нашёл,
      удалили последний элемент. Тексты должны быть разными.
    - **Ошибка** — сервер упал, нет сети, нет прав, не найдено.
    - **Частично** — часть блоков загрузилась, часть нет.
    - **Успех** — после действия: уведомление, список обновился без F5.
    - **Много данных и длинные значения** — пагинация, счётчики, перенос
      и обрезка текста.

- id: web4-08
  type: card
  question: Что проверить в состоянии загрузки?
  answer: |
    - Видно ли, что идёт загрузка: скелетон, спиннер, а не белый экран.
    - Что при **долгой** загрузке — нет ли вечного спиннера, когда
      запрос уже упал.
    - Неактивны ли кнопки во время запроса: **двойной клик** на медленной
      сети должен давать **один** запрос.
    - Не мелькает ли «пусто» перед данными.
    - Не прыгает ли страница, когда данные пришли.
    - Что будет, если уйти со страницы во время загрузки.

    Вызывают загрузку через Network → Throttling (3G).

- id: web4-09
  type: quiz
  question: "Ты проверяешь загрузку на офисном Wi-Fi и локальном стенде. Список появляется мгновенно, скелетон даже не успеваешь заметить. Что делать?"
  options:
    - "Записать «загрузка не проверяется — слишком быстро»"
    - "Попросить разработчика добавить задержку в код"
    - "Включить в Network Throttling 3G после загрузки страницы и повторить действие внутри приложения"
    - "Проверить загрузку в другом браузере"
  correct: 2
  explanation: |
    На быстрой сети загрузка длится миллисекунды — её не видно, но у
    пользователя в метро она будет. Throttling замедляет сеть у тебя в
    браузере. Включать удобно после загрузки страницы: так ты видишь
    именно загрузку данных, а не ждёшь загрузки всего сайта.

- id: web4-10
  type: quiz
  question: "Новый пользователь, пустой фильтр и удаление последнего элемента показывают один и тот же текст «Нет данных». Что верно?"
  options:
    - "Всё в порядке: данных нет во всех трёх случаях"
    - "Это проблема: при пустом фильтре человек решит, что его данные пропали. Нужны разные тексты — или вопрос дизайнеру"
    - "Баг только в случае с удалением"
    - "Тексты пустых состояний не тестируют"
  correct: 1
  explanation: |
    Причины пустоты разные, и пользователь должен понять, какая у него.
    Первый вход — объяснить, что делать дальше. Фильтр — сказать, что
    ничего не нашлось **по фильтру**, и дать сбросить его. Если в макете
    и требованиях это не различается — это вопрос дизайнеру.

- id: web4-11
  type: card
  question: Что проверить в состоянии ошибки?
  answer: |
    - **Понятный текст** — не `undefined`, не `[object Object]`, не код.
    - **Нет белого экрана** — ошибка одного блока не ломает всю страницу.
    - **Есть выход** — «Повторить», «На главную» или совет.
    - **Ошибка не выдаёт себя за пустоту** — не «Ничего не найдено».
    - **Введённое не пропало** при ошибке сохранения.
    - **Ошибка уходит**, когда всё починилось.

    Разные причины — разные сообщения: нет сети, сервер упал (`5xx`),
    сессия истекла (`401`), нет прав (`403`), не найдено (`404`).

- id: web4-12
  type: quiz
  question: "Запрос поиска вернул 503, а на экране «Ничего не найдено». Как это оценить?"
  options:
    - "Не баг: пользователь всё равно ничего не нашёл"
    - "Баг бэкенда, фронт ни при чём"
    - "Баг фронта: ошибка сервера показана как пустой результат, пользователь поверит, что товара нет"
    - "Не баг, если 503 бывает редко"
  correct: 2
  explanation: |
    Сервер честно сказал «я недоступен» — `503`. Фронт превратил это в
    «ничего не найдено» и обманул пользователя: тот уйдёт, думая, что
    товара нет. Ожидание — отдельное состояние ошибки: «Поиск временно
    недоступен» и «Повторить». Падение сервера — отдельная проблема для
    бэкенда.

- id: web4-13
  type: quiz
  question: "Тестировщик включил в Network Offline, нажал F5 и увидел заглушку браузера «Нет подключения к интернету». Это баг сайта?"
  options:
    - "Да: сайт должен показывать своё сообщение"
    - "Нет: браузер не смог скачать саму страницу, до кода сайта дело не дошло. Нужно включать Offline после загрузки и делать действие в приложении"
    - "Да, если на макете нарисована другая страница ошибки"
    - "Нет, потому что Offline вообще не тестируют"
  correct: 1
  explanation: |
    F5 без сети — это попытка скачать страницу заново. Её нет, и браузер
    показывает свою заглушку. Состояние «нет сети» в приложении
    проверяют так: страница загружена, потом Offline, потом действие
    внутри приложения. Вот тут сайт обязан показать понятную ошибку.

- id: web4-14
  type: card
  question: Как вызвать загрузку, пустоту и ошибку, не прося разработчика?
  answer: |
    - **Загрузка** — Network → Throttling 3G.
    - **Пусто** — новый пользователь; фильтр, под который ничего не
      подходит; подмена ответа через Local Overrides (`"items": []`).
    - **Нет сети** — Throttling Offline после загрузки страницы.
    - **Упал один запрос** — правый клик по запросу → Block request URL.
    - **404** — несуществующий id в адресе.
    - **401** — испортить токен в Application.
    - **Сервер недоступен** — остановить бэкенд на **своём** стенде.

    В баг-репорте всегда пишут, каким способом вызвано состояние.

- id: web4-15
  type: quiz
  question: "Нужно проверить экран при ответе 500. Тестировщик открывает Local Overrides, чтобы поменять код ответа. Что верно?"
  options:
    - "Так и делают: Local Overrides меняет код на любой"
    - "Local Overrides меняет только содержимое и заголовки ответа, не код. Для ошибки — Offline, блокировка запроса, остановка своего бэкенда или прокси"
    - "500 можно проверить только на продакшене"
    - "Нужно поменять код в Elements"
  correct: 1
  explanation: |
    Подмена в Chrome меняет тело ответа и заголовки, а код остаётся
    прежним. Близкие к ошибке сервера состояния вызывают иначе: Offline,
    Block request URL, остановка бэкенда на своём стенде. Настоящий `500`
    с нужным телом — через прокси или заглушку сервера, это тема про сеть
    и нестабильность.

- id: web4-16
  type: quiz
  question: "Ты подменил ответ списка: \"items\": [], а \"total\": 57 оставил. На экране «— 57» и «Пока нет проектов». Заводить баг?"
  options:
    - "Да: экран показывает противоречивые данные"
    - "Нет: такой ответ API на самом деле не вернёт — подмена должна быть правдоподобной: items [] и total 0"
    - "Да, на бэкенд: total считается неправильно"
    - "Нет, потому что подмену вообще нельзя использовать"
  correct: 1
  explanation: |
    Противоречие создал сам тестировщик. Подменять ответ нужно только на
    то, что API реально может вернуть. Иначе «баги» будут найдены в
    ситуациях, которых не бывает, а разработчик закроет их с вопросом
    «откуда такой ответ?».

- id: web4-17
  type: quiz
  question: "Кнопка «Отправить» под комментарием неактивна для пустого текста. Тестировщик удалил атрибут disabled в Elements, нажал — запрос ушёл, сервер ответил 422. Что верно?"
  options:
    - "Баг фронта: кнопку получилось нажать"
    - "Всё в порядке: disabled — удобство интерфейса, а защищать данные должен сервер — он и отказал"
    - "Баг бэкенда: сервер должен был принять комментарий"
    - "Тест некорректный, его не засчитывают"
  correct: 1
  explanation: |
    Правку в Elements пользователь не делает, а значит интерфейс
    сработал правильно. Зато тест показал важное: сервер сам проверяет
    правило, и пустой комментарий не сохранится, даже если запрос придёт
    в обход интерфейса — например, из Postman. Баг был бы, если бы
    пустой комментарий **сохранился**.

- id: web4-18
  type: card
  question: Что такое состояние «частично» и как его проверить?
  answer: |
    Экран часто собирается из нескольких запросов: шапка, список,
    счётчики. Один может упасть, остальные — нет.

    Как проверить:

    1. В Network посмотри, какие запросы уходят при открытии экрана.
    2. Заблокируй один из них: правый клик → Block request URL.
    3. Ожидание: остальные блоки работают, на месте упавшего —
       понятная ошибка или прочерк.

    Баг — белый экран из-за одного блока или молчаливый «0» вместо
    ошибки: пользователь поверит, что у него ноль задач.

- id: web4-19
  type: card
  question: Как работать с состояниями на задаче — по шагам?
  answer: |
    1. **До проверки** выписать состояния экрана и элементов по макету,
       требованиям и Network.
    2. Отметить, чего нет в макете, — и спросить дизайнера или аналитика
       **до** разработки.
    3. **Пройти каждое**: Throttling для загрузки, новый пользователь и
       фильтр для пустоты, Offline и блокировку запроса для ошибки,
       `:hov` и Tab для элементов.
    4. **В баг-репорт**: скриншот состояния, **как вызвано**, что в
       Network, что ожидалось.

- id: web4-20
  type: quiz
  question: "В пустом проекте наблюдатель (без права создавать задачи) видит «Пока нет задач. Создайте первую задачу». Что не так?"
  options:
    - "Всё так: подсказка помогает пользователю"
    - "Подсказка предлагает действие, которое этому пользователю недоступно. Пустое состояние должно учитывать роль"
    - "Наблюдатель вообще не должен видеть пустой проект"
    - "Баг, только если кнопка «Создать» тоже видна"
  correct: 1
  explanation: |
    Пустое состояние зависит не только от данных, но и от роли. Если
    подсказать «создайте», человек попробует, получит ошибку или не
    найдёт кнопку — и не поймёт почему. Поэтому пустые состояния
    проверяют под каждой ролью.
