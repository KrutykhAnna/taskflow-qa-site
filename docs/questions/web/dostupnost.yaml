# Вопросы темы «Доступность». Формат — см. osnovy/bag-report.yaml.

- id: web13-01
  type: card
  question: Что такое доступность сайта и для кого она нужна?
  answer: |
    **Доступность** (a11y — между a и y 11 букв) — когда сайтом может
    пользоваться каждый:
    - человек без мыши — работает только с клавиатуры;
    - человек со слабым зрением — увеличивает страницу;
    - человек с дальтонизмом — не различает некоторые цвета;
    - незрячий — слушает сайт через скринридер (программу, которая
      читает экран вслух);
    - любой в неудобной ситуации — на солнце, со сломанной рукой, с
      телефоном в одной руке.

    Это не «для инвалидов», а для всех. Для части сайтов это ещё и
    требование закона или договора.

- id: web13-02
  type: card
  question: Что такое WCAG и уровни A, AA, AAA?
  answer: |
    **WCAG** (Web Content Accessibility Guidelines) — международный
    стандарт доступности веб-сайтов: правила, каким должен быть доступный
    сайт.

    Уровни:
    - **A** — минимум;
    - **AA** — нормальный уровень, обычная цель продуктов и требование в
      договорах;
    - **AAA** — самый строгий, целиком его достигают редко.

    Номера пунктов наизусть знать не нужно — важно понимать смысл правил.

- id: web13-03
  type: card
  question: Что проверить с клавиатуры?
  answer: |
    - до каждой ссылки, кнопки и поля можно дойти клавишей **Tab**
      (назад — Shift+Tab);
    - **фокус виден** на каждом шаге;
    - порядок логичный — как читается страница;
    - **Enter** и **Пробел** нажимают кнопки, Enter — ссылки;
    - **Esc** закрывает окна и меню;
    - фокус не теряется после действий и не застревает (ловушка);
    - в модальном окне Tab ходит только внутри окна, а после закрытия
      фокус возвращается на кнопку, которая окно открыла;
    - на сайтах с длинным меню — ссылка «Перейти к содержимому».

- id: web13-04
  type: quiz
  question: "Кликнул мышкой по кнопке — рамки фокуса нет. Это баг доступности?"
  options:
    - "Да: рамка фокуса должна быть видна всегда"
    - "Пока неизвестно: рамку часто показывают только при работе с клавиатуры. Нужно проверить клавишей Tab"
    - "Нет: рамка фокуса нужна только скринридеру"
    - "Да, критичный: сайт недоступен"
  correct: 1
  explanation: |
    Браузер отличает фокус от клавиатуры и от мыши — для этого есть
    `:focus-visible`. Часто рамка видна при Tab и не видна после клика —
    так задумано. Баг — если рамки нет **при переходе клавишей Tab**.
    Скринридеру рамка не нужна: она для тех, кто видит экран, но
    работает без мыши.

- id: web13-05
  type: card
  question: Что такое контраст и какие у него нормы?
  answer: |
    **Контраст** — насколько текст отличается по яркости от фона. Чёрный
    на белом — 21:1, максимум.

    Нормы WCAG AA:
    - обычный текст — не меньше **4.5:1**;
    - крупный текст (от 24 px или от 19 px жирным) — **3:1**;
    - не текст — рамка поля, иконка, рамка фокуса — **3:1**.

    Измеряют в DevTools: Styles → квадратик цвета → строка Contrast ratio.
    В баг-репорт — число и норма: «2,7:1 при норме 4,5:1».

- id: web13-06
  type: quiz
  question: "Белый текст 15 px полужирный на оранжевой кнопке. Контраст 4.0:1. Проходит ли AA?"
  options:
    - "Да: жирный текст считается крупным, ему хватает 3:1"
    - "Нет: крупным считается текст от 24 px или от 19 px жирным. 15 px — обычный, нужно 4.5:1"
    - "Да: на кнопках контраст не проверяют"
    - "Нет: для кнопок нужно 7:1"
  correct: 1
  explanation: |
    Полужирность сама по себе не делает текст крупным. Порог «крупного» —
    от 24 px обычным или от 19 px жирным. Текст 15 px — обычный, для
    него норма 4.5:1. Значит, 4.0 не проходит. 7:1 — это уровень AAA, а не
    норма для кнопок.

- id: web13-07
  type: quiz
  question: "В форме поле с ошибкой обводится красной рамкой. Текста ошибки нет. Что не так?"
  options:
    - "Ничего: красный — общепринятый цвет ошибки"
    - "Рамка должна быть толще"
    - "Смысл передан только цветом: человек с дальтонизмом и пользователь скринридера не поймут, что и где не так"
    - "Нужно сделать рамку зелёной"
  correct: 2
  explanation: |
    Информация не должна передаваться только цветом. Человек с
    красно-зелёным дальтонизмом не отличит красную рамку от серой,
    скринридер цвет не читает, и даже без проблем со зрением непонятно,
    **что** не так. Нужен текст ошибки рядом с полем, связанный с ним.
    Проверить — DevTools → Rendering → Emulate vision deficiencies.

- id: web13-08
  type: card
  question: Что такое alt и как проверять картинки?
  answer: |
    **alt** (от alternative — «альтернатива») — атрибут тега `<img>`:
    текст, который скринридер прочитает вместо картинки.

    - **значимая картинка** (фото товара, схема, график) — `alt` с
      описанием по смыслу: «Синие кроссовки, вид сбоку»;
    - **декоративная** (узор, разделитель) — пустой `alt=""`: скринридер
      её пропустит;
    - **нет `alt` вовсе** — скринридер может прочитать имя файла;
    - **текст на картинке** — его не увеличить и не прочитать
      скринридером.

- id: web13-09
  type: quiz
  question: "У декоративного узора в шапке сайта alt=\"\" — пустой. Это баг?"
  options:
    - "Да: у каждой картинки должен быть текст в alt"
    - "Нет: пустой alt говорит скринридеру «пропусти». Для украшений это правильно"
    - "Да: нужно написать alt=\"картинка\""
    - "Нет, потому что alt вообще не нужен"
  correct: 1
  explanation: |
    Пустой `alt=""` — правильный способ пометить украшение: скринридер
    его не читает. `alt="картинка"` у каждого узора — хуже: человек
    слушает «картинка, картинка». Баг — если пустой `alt` у **значимой**
    картинки или `alt` нет совсем. Последний вариант неверен: без `alt`
    скринридер может прочитать имя файла.

- id: web13-10
  type: card
  question: Что такое ARIA и aria-label? Когда нужен aria-label?
  answer: |
    **ARIA** (Accessible Rich Internet Applications) — набор атрибутов,
    которые подсказывают скринридеру, что это за элемент, как он
    называется и в каком он состоянии.

    **aria-label** — название элемента для скринридера. Нужен там, где
    видимого текста нет: кнопки-иконки — крестик, корзина, карандаш,
    «три точки». Пример: `aria-label="Удалить задачу"` — скринридер
    скажет «Удалить задачу, кнопка».

    Если у кнопки есть видимый текст «Сохранить» — он и есть её название,
    `aria-label` не нужен.

- id: web13-11
  type: card
  question: Что проверить в форме с точки зрения доступности?
  answer: |
    - у каждого поля **видимая подпись** (`label`), а не только серая
      подсказка внутри поля (`placeholder`) — она исчезает при вводе;
    - **клик по подписи** ставит курсор в поле — значит, они связаны;
    - ошибка — **текстом** рядом с полем, связана с полем
      (`aria-describedby`) и объявляется скринридеру;
    - обязательность понятна не только цветом звёздочки;
    - всё проходится с клавиатуры, фокус после ошибки — на первом
      ошибочном поле;
    - контраст подписей, подсказок и текста на кнопке.

- id: web13-12
  type: quiz
  question: "Lighthouse Accessibility показал 100 баллов. Что это значит?"
  options:
    - "Сайт полностью доступен, ручная проверка не нужна"
    - "На проверенной странице нет ошибок, которые видны по коду. Клавиатуру, видимость фокуса и понятность ошибок нужно проверить руками"
    - "Сайт соответствует WCAG AAA"
    - "Сайт доступен со скринридером"
  correct: 1
  explanation: |
    Автоматика ловит только часть проблем: контраст, `alt`, подписи полей,
    атрибуты ARIA. Проходится ли сценарий с клавиатуры, виден ли фокус,
    понятна ли ошибка, что с фокусом в окнах — она не знает. «Кнопку» из
    обычного текста с обработчиком клика Lighthouse часто не замечает. И
    проверена только одна страница в одном состоянии.

- id: web13-13
  type: quiz
  question: "В модальном окне Tab ходит только по элементам окна и не уходит на страницу за ним. Окно закрывается по Esc. Это ловушка фокуса?"
  options:
    - "Да: фокус не выходит из окна — это ловушка, баг"
    - "Нет: окно и должно держать фокус внутри, пока оно открыто. Ловушка — когда выйти нельзя вообще"
    - "Да, если в окне больше трёх кнопок"
    - "Нет, потому что модальные окна не проверяют на доступность"
  correct: 1
  explanation: |
    Удерживать фокус внутри открытого окна — правильно: иначе человек
    уйдёт за затемнённый фон и потеряется. Ловушка — место, из которого
    **нельзя выйти** ни Tab, ни Esc, ни кнопкой. Здесь ещё проверяют, что
    после закрытия фокус возвращается на кнопку, которая окно открыла.

- id: web13-14
  type: card
  question: Какие инструменты помогают проверять доступность?
  answer: |
    - **Lighthouse → Accessibility** в DevTools — оценка и список проблем;
    - **пипетка контраста** в Elements — коэффициент и отметки AA/AAA;
    - **вкладка Accessibility** в Elements — роль и имя элемента, дерево
      доступности: как элемент «видит» скринридер;
    - **Rendering → Emulate vision deficiencies** — эмуляция дальтонизма
      и размытого зрения;
    - **axe DevTools** и **WAVE** — расширения, часто находят больше
      Lighthouse, WAVE рисует проблемы прямо на странице;
    - **скринридер**: VoiceOver на Mac (Cmd+F5), NVDA на Windows
      (бесплатный).

    Автоматика — первый фильтр, дальше — руками.

- id: web13-15
  type: quiz
  question: "Во вкладке Accessibility у кнопки-корзины: Role — button, Name — пусто. Что услышит пользователь скринридера?"
  options:
    - "«Корзина, кнопка» — скринридер сам распознает иконку"
    - "Только «кнопка» — без названия, что она делает"
    - "Ничего: кнопка без названия пропускается"
    - "Имя файла иконки"
  correct: 1
  explanation: |
    Скринридер читает **имя** и **роль** элемента. Роль есть — `button`,
    имени нет. Значит, прозвучит просто «кнопка». Иконки скринридер не
    распознаёт. Нужно название — видимый текст или `aria-label`, например
    «Удалить задачу „Отчёт“». В списке из 20 строк лучше разные названия,
    а не 20 одинаковых «Удалить».

- id: web13-16
  type: quiz
  question: "Кнопка «Показать пароль» нажимается мышкой, но Tab её пропускает. Как оценить?"
  options:
    - "Не баг: пароль можно ввести и без неё"
    - "Замечание по доступности: человек без мыши не может проверить, что ввёл. Серьёзность — средняя или низкая: войти можно, но удобства лишён"
    - "Критичный баг: сайт недоступен"
    - "Баг кроссбраузерности"
  correct: 1
  explanation: |
    До всего, что нажимается мышкой, должна быть возможность дойти с
    клавиатуры. Но серьёзность оценивают по тому, **кого и насколько
    блокирует**: войти можно, просто без проверки введённого. Если бы
    так была сделана кнопка «Войти» — серьёзность высокая. Это не
    кроссбраузерность: пропуск одинаков во всех браузерах.

- id: web13-17
  type: card
  question: Как быстро проверить доступность новой фичи — по шагам?
  answer: |
    Около 10 минут на фичу:
    1. **Только клавиатура** — главный сценарий фичи: дошёл ли до всего,
       виден ли фокус, порядок, Enter, Пробел, Esc, фокус после действий.
    2. **Автоматика** — Lighthouse Accessibility или axe, разобрать
       список.
    3. **Контраст** спорных мест пипеткой и эмуляция дальтонизма.
    4. **Масштаб 200%**.
    5. Раз в релиз — **скринридер** на главном сценарии.
    6. **Баг-репорт**: какое правило нарушено простыми словами, кого
       блокирует, шаги клавишами, серьёзность.

- id: web13-18
  type: card
  question: Что обязательно указать в баг-репорте по доступности?
  answer: |
    - **что нарушено простыми словами**: «кнопка недоступна с
      клавиатуры», «контраст 2,7:1 при норме 4,5:1»;
    - **кого блокирует**: людей без мыши, со слабым зрением,
      пользователей скринридера;
    - **шаги клавишами**, а не кликами: «Tab с поля X, Enter»;
    - **доказательство**: скриншот пипетки, строка Lighthouse, роль и имя
      из вкладки Accessibility;
    - **серьёзность**: «не пройти сценарий без мыши» — высокая.

- id: web13-19
  type: quiz
  question: "В коде у цвета кнопки комментарий: «подобран под контраст AA». Пипетка показывает 3.9:1 для обычного текста. Что делать?"
  options:
    - "Поверить комментарию: дизайнер уже проверил"
    - "Завести замечание с числом и нормой: измерение — доказательство, комментарий — нет"
    - "Ничего: 3.9 почти 4.5"
    - "Перекрасить кнопку самому в DevTools и закрыть вопрос"
  correct: 1
  explanation: |
    Комментарий в коде, слова в макете и «дизайнер проверил» — не
    доказательство. Доказательство — измеренное число. Для обычного
    текста норма 4.5:1, «почти» не считается. В замечание — элемент,
    число, норма, скриншот пипетки. Поменять цвет в DevTools полезно,
    чтобы предложить подходящий оттенок, но исправляет его команда.
