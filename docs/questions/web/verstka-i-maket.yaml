# Вопросы темы «Вёрстка и макет». Формат — см. osnovy/bag-report.yaml.

- id: web3-01
  type: card
  question: Что такое макет и вёрстка и кто за что отвечает?
  answer: |
    **Макет** — картинка того, как экран должен выглядеть: тексты,
    шрифты, цвета, отступы. Его рисует **дизайнер**, обычно в Figma.

    **Вёрстка** — настоящая страница из HTML и CSS, сделанная по макету.
    Её делает **фронтенд-разработчик**.

    **Тестировщик** сверяет вёрстку с макетом: на задаче, когда экран
    готов, и перед релизом. Макет — чертёж, вёрстка — построенный дом.

- id: web3-02
  type: card
  question: Что сверяют при проверке вёрстки по макету?
  answer: |
    - **Тексты** — слово в слово: опечатки, регистр, кавычки, «ё».
    - **Шрифт** — семейство, размер, жирность, межстрочный интервал.
    - **Цвета** — текст, фон, рамки, иконки.
    - **Отступы и выравнивание** — расстояния, ровные линии.
    - **Размеры элементов** — кнопки, поля, картинки.
    - **Иконки и картинки** — те ли, не растянуты ли.
    - **Состояния** — hover, фокус, disabled, ошибка.
    - **Длинный текст** — перенос, обрезка, не вылез ли за край.
    - **Ширина экрана** — сначала та, на которой нарисован макет.

- id: web3-03
  type: card
  question: Что такое pixel perfect и всегда ли он нужен?
  answer: |
    **Pixel perfect** — страница совпадает с макетом до пикселя. Нужен
    там, где внешний вид — это продукт: промо-страницы, лендинги брендов.

    На большинстве проектов сверяют **по договорённости**: важно «как в
    макете» для глаза пользователя, разница в 1–2 px не считается.
    Какой режим на проекте — уточняют у команды заранее.

- id: web3-04
  type: quiz
  question: "В макете отступ 24 px, на странице 22 px. Команда работает «по договорённости», элементы стоят ровно. Что делать?"
  options:
    - "Завести баг с высоким приоритетом: вёрстка не совпадает с макетом"
    - "Обычно ничего: 1–2 px при работе «по договорённости» багом не считают"
    - "Попросить дизайнера перерисовать макет под 22 px"
    - "Завести баг на дизайнера"
  correct: 1
  explanation: |
    При работе «по договорённости» разница в 1–2 px незаметна
    пользователю и обычно не баг. Другое дело — если из-за неё элементы
    перестали стоять в одну линию и это видно глазом. На проекте с
    pixel perfect такой баг заводят, но с низким приоритетом.

- id: web3-05
  type: card
  question: Как в Figma узнать размер элемента, отступ до соседнего, цвет и шрифт?
  answer: |
    1. **Кликни по элементу** (внутри группы — двойной клик или с
       Ctrl / Cmd).
    2. **Размер** — подпись под элементом и W / H в правой панели.
    3. **Отступ до соседа** — выдели элемент и наведи на соседний с
       зажатым **Alt** (Option на Mac): Figma покажет расстояние.
    4. **Цвет** — правая панель, Fill или Stroke, код вида `#C1611F`.
    5. **Шрифт** — правая панель у текста: семейство, начертание, размер.

    Удобнее всего — в **Dev Mode** (Shift + D), если он доступен.

- id: web3-06
  type: quiz
  question: "Ты выгрузил фрейм из Figma в PNG с масштабом 2x и наложил через PerfectPixel. Картинка в два раза больше страницы. В чём дело?"
  options:
    - "Вёрстка сделана в два раза меньше макета — это баг"
    - "PerfectPixel не работает с PNG"
    - "Картинка выгружена в 2x: для наложения нужен масштаб 1x"
    - "Нужно увеличить масштаб браузера до 200%"
  correct: 2
  explanation: |
    При 2x один пиксель макета превращается в два пикселя картинки. Для
    наложения выгружай в **1x** — тогда размеры совпадут со страницей
    при масштабе браузера 100%. Та же история со скриншотами на Retina:
    они получаются в 2 раза больше.

- id: web3-07
  type: card
  question: Как пользоваться PerfectPixel — по шагам?
  answer: |
    1. Установить расширение, закрепить значок.
    2. Масштаб браузера — **100%**, ширина окна — **как в макете**
       (Device Mode → Responsive).
    3. Загрузить PNG макета (выгрузка из Figma в 1x).
    4. Прозрачность — около 50%.
    5. Выровнять по неподвижным ориентирам: логотип, левый край.
    6. Идти сверху вниз: где края и буквы двоятся — расхождение.
    7. Точные значения снять в DevTools, сделать скриншот с наложением.
    8. Выключить наложение, когда закончил.

- id: web3-08
  type: quiz
  question: "Тестировщик сверял страницу с макетом шириной 1440 px. Окно браузера — 1280 px, масштаб — 110%. Нашёл 12 расхождений в отступах. Что верно?"
  options:
    - "Все 12 — баги, их надо завести"
    - "Сверка неверная: сначала масштаб 100% и ширина окна как в макете"
    - "Надо завести один общий баг на все 12"
    - "Макет устарел, его нужно перерисовать"
  correct: 1
  explanation: |
    При другой ширине окна блоки встают по-другому, при масштабе 110% все
    размеры увеличены. Почти все расхождения — результат настроек
    браузера. Сверять надо на 100% и на ширине макета. Как страница
    выглядит на других ширинах — отдельная проверка адаптивности.

- id: web3-09
  type: quiz
  question: "В Figma цвет кнопки #C1611F, в DevTools — rgb(193, 97, 31). Что это значит?"
  options:
    - "Цвета разные — это баг"
    - "Это один и тот же цвет в двух форматах записи"
    - "DevTools показывает цвет неправильно"
    - "Разработчик взял цвет с прозрачностью"
  correct: 1
  explanation: |
    HEX и RGB — две записи одного цвета: `C1` = 193, `61` = 97, `1F` = 31.
    В окне выбора цвета в DevTools формат можно переключить. Сравнивай
    значения в одном формате, прежде чем писать «не совпадает».

- id: web3-10
  type: card
  question: Где в DevTools посмотреть всё, что нужно для сверки с макетом?
  answer: |
    - **Computed** — итоговые `font-family`, `font-size`, `font-weight`,
      `color`, размеры и отступы.
    - **Rendered Fonts** внизу Computed — какой шрифт реально отрисован.
    - **Схема блока** (box model) вверху Computed — margin, border,
      padding, размер содержимого.
    - **Подсказка при наведении** в режиме выбора элемента — размер,
      цвет, шрифт, отступы сразу.
    - **Пипетка** в окне выбора цвета в Styles — цвет любой точки.
    - **`:hov`** в Styles — включить hover или focus.
    - **Capture node screenshot** — скриншот одного элемента.

- id: web3-11
  type: quiz
  question: "В Computed у заголовка font-family: \"IBM Plex Sans\", sans-serif — как в макете. Но заказчик говорит, что видит обычный Arial. Где проверить, какой шрифт на самом деле отрисован?"
  options:
    - "В Computed → Rendered Fonts"
    - "В Styles: раз там IBM Plex Sans, значит и отрисован он"
    - "В Console"
    - "Только в Figma"
  correct: 0
  explanation: |
    `font-family` — список шрифтов, которые **хотели**: первый, если он
    есть, иначе следующий. Какой **отрисовался**, показывает Rendered
    Fonts внизу Computed. Если там не тот шрифт — файл шрифта не
    загрузился: смотри Network с фильтром Font.

- id: web3-12
  type: card
  question: Как проверить вёрстку на длинном тексте?
  answer: |
    1. Узнать **максимальную длину** поля — из требований или формы.
    2. Ввести текст максимальной длины — и со словами, и **одним словом
       без пробелов** (браузер переносит только по пробелам).
    3. Посмотреть, что произошло.

    Перенос или обрезка с «…» — нормально, если так задумано. Текст
    вылез за край, налез на соседей, спрятал кнопки, появилась
    горизонтальная прокрутка всей страницы — баг. Если в макете длинный
    текст не нарисован — вопрос дизайнеру.

- id: web3-13
  type: quiz
  question: "Имя пользователя обрезается без «…». Разработчик: «Сделано по макету, там поле 120 px». В макете нарисовано имя «Анна Ким». Что делать?"
  options:
    - "Закрыть баг: сделано по макету"
    - "Настаивать, что баг, и спорить с разработчиком"
    - "Подключить дизайнера: макет не покрывает длинные имена, нужно решение, как они должны выглядеть"
    - "Попросить разработчика уменьшить шрифт"
  correct: 2
  explanation: |
    Разработчик сделал по макету, но макет этот случай просто не
    показывает. Проблема для пользователя есть — обрезка без признака
    обрезки. Решает тот, кто отвечает за макет, — дизайнер. Дальше
    макет дополняют, разработчик доделывает.

- id: web3-14
  type: quiz
  question: "Кнопка «Оплатить» перекрыта плашкой чата, по ней не попасть. Какой приоритет у такого бага вёрстки?"
  options:
    - "Trivial: это вёрстка, а вёрстка всегда мелочь"
    - "Высокий: пользователь не может оплатить"
    - "Никакой: это не баг, а особенность дизайна"
    - "Minor: кнопка ведь на месте"
  correct: 1
  explanation: |
    Вёрстка обычно Minor или Trivial — но только пока ей можно
    пользоваться. Если кнопку не нажать, текст не прочитать или смысл
    потерян из-за обрезки — приоритет выше. Здесь из-за вёрстки
    пользователь не может заплатить.

- id: web3-15
  type: card
  question: Что приложить к баг-репорту на расхождение с макетом?
  answer: |
    - **Скриншот макета** и **скриншот страницы** — один и тот же кусок,
      рядом или с наложением; место обведено.
    - **Значения**: что в макете и что на странице — «16 px, `#211D15`
      против 14 px, `#000000`».
    - **Ссылку на фрейм** в Figma.
    - **Ширину окна** и **масштаб** браузера.
    - **Браузер и версию**, операционную систему.

- id: web3-16
  type: quiz
  question: "Нужно сверить экран, а макета нет — дизайнер эту доработку не рисовал. Что разумнее всего?"
  options:
    - "Не проверять внешний вид: без макета нет требований"
    - "Сравнить с дизайн-системой и похожими экранами, проверить длинные тексты и ширину, странное показать дизайнеру"
    - "Завести баг «нет макета» и ждать"
    - "Проверять по своему вкусу и заводить баги на всё некрасивое"
  correct: 1
  explanation: |
    Эталон есть и без макета: дизайн-система и уже сделанные экраны.
    Новая кнопка должна выглядеть как остальные кнопки того же типа.
    Что непоследовательно или непонятно — скриншот дизайнеру с вопросом
    «так задумано?». Вкус тестировщика — не требование.

- id: web3-17
  type: card
  question: Что делать, если в Figma нет доступа к Dev Mode?
  answer: |
    Dev Mode обычно есть в платных тарифах и может быть не у всех. Без
    него чаще всего всё равно можно:

    - выделить элемент и увидеть размер;
    - с зажатым Alt увидеть расстояние до соседних элементов;
    - посмотреть цвет и шрифт в правой панели.

    Если чего-то не видно — попросить дизайнера выписать значения или
    дать доступ. Точные значения на странице всё равно снимают в
    DevTools.

- id: web3-18
  type: quiz
  question: "Ты наложил макет TaskFlow на страницу, и буквы двоятся по ширине во всех заголовках. В дизайн-системе сказано, что макеты нарисованы системными шрифтами, а в приложении — IBM Plex Sans и Fraunces. Как поступить?"
  options:
    - "Завести баг на каждый заголовок"
    - "Завести баг: шрифты в приложении не совпадают с макетом"
    - "Сверять шрифт по дизайн-системе через Computed и Rendered Fonts, а наложением — расположение и размеры блоков"
    - "Отказаться от наложения совсем"
  correct: 2
  explanation: |
    Разница в начертании ожидаема и описана в самой дизайн-системе. Если
    в Computed и Rendered Fonts шрифты совпадают с дизайн-системой — бага
    нет. Наложение по-прежнему полезно для порядка блоков, отступов,
    высоты кнопок и строк. Важно знать, что за эталон у тебя в руках.

- id: web3-19
  type: card
  question: Как отличить, что баг вёрстки — от твоих настроек, а не от разработчика?
  answer: |
    Проверь перед тем, как заводить:

    - масштаб браузера — **100%**;
    - ширина окна — **как в макете**;
    - макет **актуальный** — уточнено у дизайнера;
    - картинка макета выгружена в **1x**, скриншоты с Retina уменьшены;
    - сравниваешь значения **в одном формате** (HEX и RGB — одно и то же);
    - расширения не меняют страницу — можно проверить в инкогнито.
