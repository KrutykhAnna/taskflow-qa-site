# Вопросы темы «Типовые элементы веба». Формат — см. osnovy/bag-report.yaml.

- id: web6-01
  type: card
  question: Зачем тестировщику готовые чек-листы на типовые элементы веба?
  answer: |
    Сайты собраны из одних и тех же деталей — поиск, фильтры, таблицы,
    пагинация, окна, загрузка файлов — и у этих деталей **одни и те же
    баги**.

    Готовый чек-лист:

    - экономит время — не нужно каждый раз вспоминать проверки;
    - ловит то, о чём забывают: комбинации фильтров, вторую страницу
      сортировки, кириллицу в экспорте;
    - даёт структурный ответ на собеседовании «как протестируете поиск».

    Чек-лист не проходят целиком вслепую: вычёркивают неприменимое и
    добавляют специфику задачи из требований.

- id: web6-02
  type: card
  question: Что проверить у поиска?
  answer: |
    - **Совпадения:** точное, часть слова (начало, середина, конец).
    - **Регистр** — на латинице и на кириллице.
    - **Пробелы:** по краям, только пробелы, двойной внутри.
    - **Спецсимволы:** `%`, `_`, кавычки — `%` может вернуть всё.
    - **«Ничего не найдено»** — понятный текст, а не пустая таблица.
    - **Очистка** — вернулся полный список.
    - **Связки:** поиск + фильтр + пагинация.
    - **После F5 и «Назад»** — запрос сохранился?
    - **Network:** запрос уходит после паузы (debounce), а не на каждую
      букву; результат не «мигает» от старых ответов.

- id: web6-03
  type: quiz
  question: "Пользователь быстро напечатал «отчёт», а в результатах — задачи, подходящие под «отч». Что вероятнее всего произошло?"
  options:
    - "Поиск ищет только по началу слова"
    - "Ответ на старый запрос «отч» пришёл позже ответа на «отчёт» и перезаписал результат"
    - "Сервер обрезает запрос до трёх символов"
    - "Браузер не успел отправить последнюю букву"
  correct: 1
  explanation: |
    Если поиск отправляет запрос на каждую букву, ответы могут прийти не
    в том порядке, в каком ушли. Последним на экран попадает ответ на
    устаревший запрос. Проверяют в Network: сколько запросов ушло и в
    каком порядке пришли ответы. Защита — debounce (ждать паузу перед
    запросом) и игнорирование устаревших ответов.

- id: web6-04
  type: card
  question: Что проверить у фильтров?
  answer: |
    - Каждый фильтр и каждое значение отдельно.
    - **Комбинации** — работают как «И», а не «ИЛИ». Не все сочетания, а
      важные пары (попарное тестирование).
    - **Пусто по фильтру** — «Нет задач по фильтру», а не «Пока нет задач».
    - **Сброс** — сбрасывает все фильтры, включая поиск.
    - **Счётчик** совпадает с числом строк.
    - **Смена фильтра** возвращает на первую страницу.
    - **После F5 и «Назад»** — поведение описано в требованиях; нет
      описания — вопрос аналитику.

- id: web6-05
  type: quiz
  question: "Пользователь был на 3-й странице списка, выбрал фильтр — и видит «Ничего не найдено», хотя по фильтру есть 15 записей. Что вероятнее всего?"
  options:
    - "Фильтр работает неправильно и ничего не находит"
    - "После смены фильтра список остался на 3-й странице, а по фильтру всего одна страница"
    - "Сервер не успел обновить данные"
    - "Так и должно быть: фильтр применяется только к текущей странице"
  correct: 1
  explanation: |
    15 записей при 20 на странице — одна страница. Если смена фильтра не
    сбрасывает номер страницы, список запрашивает 3-ю страницу, а её нет —
    пусто. Проверяют в Network: какой `offset` или `page` ушёл вместе с
    фильтром. Ожидание — при смене фильтра возвращаться на первую
    страницу.

- id: web6-06
  type: card
  question: Что проверить у сортировки?
  answer: |
    - Каждая колонка, по возрастанию и убыванию; направление видно.
    - **Все данные, а не текущая страница** — главная проверка.
    - **Одинаковые значения** — порядок стабильный, без дублей и
      пропусков между страницами.
    - **Пустые значения** — предсказуемо в начале или в конце.
    - **Числа и даты** — как числа и даты, а не как текст (2, 10, 100).
    - **Смысловой порядок** — приоритет «Низкий → Средний → Высокий», а
      не по алфавиту.
    - Регистр, кириллица и латиница вместе.
    - Сортировка + фильтр + поиск.

- id: web6-07
  type: quiz
  question: "Тестовые данные — 12 товаров, на странице 20. Сортировка по цене выглядит идеально. Что можно сказать про сортировку всех данных?"
  options:
    - "Работает: все 12 товаров стоят правильно"
    - "Ничего: на одной странице сортировку всех данных и сортировку страницы не отличить, нужно больше данных"
    - "Работает, если сервер вернул 200"
    - "Не работает: правильная сортировка видна только на 20+ товарах"
  correct: 1
  explanation: |
    Когда все данные помещаются на одну страницу, сортировка в браузере
    (только по странице) и сортировка на сервере (по всем данным)
    выглядят одинаково. Чтобы проверить, нужно больше записей, чем
    помещается на страницу, и эталонный элемент, который точно должен
    оказаться первым. Сделать 50 записей быстро помогает Postman Runner.

- id: web6-08
  type: card
  question: Что проверить у пагинации?
  answer: |
    - Первая и последняя страница: неактивные «Назад» и «Вперёд».
    - **Граница:** ровно 20 записей при 20 на страницу — нет пустой
      второй; 21 — вторая с одной строкой.
    - **Счётчик** «21–40 из 357» верен, в том числе на последней
      странице.
    - Смена размера страницы — возврат на первую.
    - **Удаление** элемента, особенно последнего на последней странице.
    - Номер страницы в адресе: `999`, `0`, `-1`, `abc`.
    - **Сортировка + пагинация** — пролистать все страницы, ни одна
      строка не повторилась и не пропала.

- id: web6-09
  type: quiz
  question: "Список отсортирован по приоритету. Задача «Отчёт» видна и на 1-й, и на 2-й странице, а задачи «Бюджет» нет нигде. У многих задач одинаковый приоритет. Что вероятнее всего?"
  options:
    - "Баг фронта: он дважды нарисовал одну строку"
    - "Нестабильная сортировка: у одинаковых значений нет второго ключа, и база при каждом запросе ставит их в разном порядке"
    - "«Бюджет» удалили"
    - "Так работает любая пагинация, это не баг"
  correct: 1
  explanation: |
    Каждая страница — отдельный запрос. Если у строк одинаковый
    приоритет, а второго ключа сортировки нет, база может вернуть их в
    разном порядке в двух запросах — на границе страниц строка
    повторяется, другая теряется. Лечится вторым ключом, обычно `id`.
    Проверка — данные с одинаковыми значениями на границе страниц и
    сравнение `id` в ответах двух страниц.

- id: web6-10
  type: card
  question: Как быстро создать много данных для проверки пагинации?
  answer: |
    Через Postman Runner:

    1. Создать одну запись через интерфейс.
    2. В Network: запрос `POST` → Copy as cURL → Postman Import.
    3. Сохранить запрос в коллекцию.
    4. Run → Iterations: 25 → 25 записей за минуту.

    Для разных названий — динамические переменные Postman. Для проверки
    одинаковых значений — наоборот, одно и то же название во всех
    записях.

- id: web6-11
  type: card
  question: Что проверить у таблицы?
  answer: |
    - **Длинные значения** — перенос, многоточие; можно ли увидеть полный
      текст; не уехали ли соседние колонки.
    - **Пустые ячейки** — одинаково («—»), без `null` и `undefined`.
    - **Числа** — по правому краю, разделители разрядов, одинаковое число
      знаков после запятой.
    - **Шапка** при прокрутке длинной таблицы.
    - **Узкий экран** — обрезается или прокручивается.
    - **Клик по кнопке в строке** не открывает заодно карточку строки.

- id: web6-12
  type: quiz
  question: "У чекбокса «Запомнить меня» галочка ставится только кликом по маленькому квадратику, а клик по тексту ничего не делает. Как оценить?"
  options:
    - "Не баг: чекбокс работает"
    - "Замечание по удобству и доступности: подпись должна быть связана с чекбоксом и тоже ставить галочку"
    - "Критичный баг: функция недоступна"
    - "Баг браузера"
  correct: 1
  explanation: |
    Функция работает, но в маленький квадратик трудно попасть мышкой и
    особенно пальцем на телефоне. Когда подпись правильно связана с
    чекбоксом, клик по тексту тоже ставит галочку — и экранный диктор
    читает подпись. Обычно это низкий приоритет, но пункт есть в любом
    чек-листе чекбоксов.

- id: web6-13
  type: card
  question: Что проверить у поля выбора даты?
  answer: |
    - **Ручной ввод и календарь** дают одинаковый результат.
    - **Формат** — `05.03.2025` и `03/05/2025` читаются по-разному.
    - **Границы** — минимум, максимум, прошедшие даты, сегодня.
    - **Несуществующие** — `31.04`, `30.02`, `29.02` в обычный и
      високосный год.
    - **Конец месяца и переход года** в календаре.
    - **Диапазон** «с» позже «по».
    - **Очистка** необязательного поля.
    - **Что ушло на сервер** — в Network, без сдвига на день.

- id: web6-14
  type: quiz
  question: "Пользователь выбрал в календаре 15 марта, а в карточке сохранилось 14 марта. Где искать причину в первую очередь?"
  options:
    - "В календаре: он неправильно рисует даты"
    - "В часовых поясах: дату перевели во время с поясом, и при сохранении она сдвинулась на сутки"
    - "В базе данных: она не хранит даты"
    - "В браузере пользователя: надо очистить кэш"
  correct: 1
  explanation: |
    Сдвиг ровно на день — почти всегда часовые пояса: «15 марта 00:00»
    по Москве — это «14 марта 21:00» по UTC. Если сервер или фронт
    отрезает время и оставляет дату, получается 14-е. Проверяют в
    Network: что ушло в запросе и что пришло в ответе. Подробно о
    часовых поясах — в уроке про локализацию.

- id: web6-15
  type: card
  question: Что проверить при загрузке файлов?
  answer: |
    - Разрешённые форматы проходят, запрещённые — понятная ошибка.
    - **Расширение ≠ содержимое:** переименованный текстовый файл,
      `photo.jpg.exe`. Проверять должен **сервер**.
    - **Размер:** ровно максимум, чуть больше, очень большой.
    - **Пустой файл**, 0 байт.
    - **Имя:** длинное, кириллица, пробелы, спецсимволы — без искажений и
      при последующем скачивании.
    - Перетаскивание, несколько файлов, прогресс, отмена, обрыв сети.
    - Только безобидные файлы.

- id: web6-16
  type: quiz
  question: "Разработчик: «Окно выбора файла показывает только .jpg и .png, значит, другие форматы загрузить нельзя». Что верно?"
  options:
    - "Он прав: браузер не даст выбрать другой файл"
    - "Фильтр окна — только подсказка: можно выбрать «Все файлы», перетащить файл или отправить запрос через Postman. Формат должен проверять сервер"
    - "Он прав, если на сервере есть антивирус"
    - "Это зависит только от операционной системы"
  correct: 1
  explanation: |
    Ограничение в окне выбора — удобство, как `maxlength` у поля: его
    легко обойти. Проверка — текстовый файл, переименованный в `.jpg`,
    перетаскивание, запрос из Postman. Сервер должен отказать с понятной
    ошибкой. Для проверки достаточно безобидных файлов.

- id: web6-17
  type: quiz
  question: "Экспорт в CSV у тестировщика открывается в редакторе кода нормально, а у бухгалтера в Excel вместо кириллицы — мусор. Что это?"
  options:
    - "Не баг: файл правильный, бухгалтер открывает его не той программой"
    - "Баг для пользователя: Excel при двойном клике не распознал кодировку UTF-8; файл верный, но открыть его так, как открывает пользователь, нельзя"
    - "Баг Excel, разработчики тут ни при чём"
    - "Сервер сохранил файл в неверной кодировке"
  correct: 1
  explanation: |
    Файл в UTF-8 правильный — в редакторе всё читается. Но пользователь
    открывает CSV двойным кликом в Excel, а тот без подсказки может
    выбрать другую кодировку. Для пользователя функция не работает —
    значит, это баг. Обычно его решают специальной меткой кодировки в
    начале файла. Тестировщику урок: проверять экспорт той программой,
    которой пользуется пользователь.

- id: web6-18
  type: card
  question: Что проверить у модального окна?
  answer: |
    - **Способы закрыть:** крестик, «Отмена», Esc, клик по фону — одинаково
      во всех окнах продукта.
    - **Несохранённые данные** при случайном закрытии — пропали молча,
      вопрос или черновик. Особенно выделение текста с отпусканием мыши
      за краем окна.
    - **Открыть снова** — без старых данных и ошибок.
    - **Фокус:** в первом поле; Tab не уходит за окно; после закрытия
      возвращается на кнопку.
    - **Прокрутка фона** и длинное содержимое — кнопки достижимы.
    - **Окно поверх окна:** Esc закрывает только верхнее.

- id: web6-19
  type: card
  question: Что проверить у уведомлений (тостов) и подтверждений опасных действий?
  answer: |
    **Уведомления:**

    - понятный текст; тип виден не только цветом;
    - время показа — успеваешь прочитать, особенно ошибку;
    - крестик; стопка из нескольких; не закрывают важные кнопки;
    - одна ошибка — одно место, без дубля баннером.

    **Подтверждения:**

    - «Отмена», Esc и клик мимо — отмена, и запрос `DELETE` не ушёл;
    - текст говорит, **что** удаляем и что будет с вложенным;
    - кнопка «Удалить», а не «ОК»; фокус не на ней по умолчанию;
    - двойной клик — один запрос; после удаления элемент исчез без F5.

- id: web6-20
  type: quiz
  question: "В окне «Удалить задачу?» тестировщик нажал «Отмена», окно закрылось. Он отмечает «Отмена работает». Чего не хватает?"
  options:
    - "Ничего: окно закрылось, значит, отмена сработала"
    - "Проверки, что задача осталась: F5 или Network — не ушёл ли запрос DELETE"
    - "Скриншота окна"
    - "Проверки в другом браузере"
  correct: 1
  explanation: |
    Окно может закрыться и при отмене, и при удалении. Бывает баг, когда
    запрос `DELETE` отправляется сразу при открытии окна или по нажатию
    любой кнопки. Доказательство отмены — запись на месте после F5 и нет
    запроса `DELETE` в Network.

- id: web6-21
  type: card
  question: Как работать с типовым элементом на задаче — по шагам?
  answer: |
    1. Увидеть в задаче элементы — новый и соседние (поиск, сортировка,
       пагинация, пустое состояние).
    2. Взять свой чек-лист для каждого.
    3. Вычеркнуть неприменимое.
    4. Добавить специфику из требований; неописанное поведение — вопрос
       аналитику.
    5. Подготовить данные: много записей, одинаковые и пустые значения,
       тестовые файлы.
    6. Пройти с открытым Network.
    7. Завести баги и дописать в чек-лист новое.
