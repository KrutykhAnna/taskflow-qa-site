# Вопросы темы «Баг-репорт по вебу». Формат — см. osnovy/bag-report.yaml.

- id: web15-01
  type: card
  question: Что добавляется к обычному баг-репорту, когда баг в вебе?
  answer: |
    Поля обычного баг-репорта остаются. Для веба в окружение и описание
    добавляется:
    - **полный URL** с параметрами — без токенов;
    - **стенд и версия сборки**;
    - **браузер с версией и ОС**;
    - **размер окна или устройство**;
    - **учётка и роль** — без пароля;
    - если важно — **язык, часовой пояс, условия сети**;
    - **шаги с первой страницы**;
    - **доказательства**: скриншот или видео, текст из Console, запрос из
      Network, HAR, номер запроса.

- id: web15-02
  type: card
  question: Что значит «хороший веб-баг — это посылка»?
  answer: |
    Разработчик не видит твой экран. Всё, что нужно для воспроизведения,
    должно лежать в одном месте: где, в каком окружении, под кем, по каким
    шагам, что ожидалось, что случилось, и доказательства.

    Проверка — перечитать баг глазами разработчика: сможет ли он
    воспроизвести его за минуту **без единого вопроса** в комментариях.

- id: web15-03
  type: quiz
  question: "Кнопка ничего не делает, в Console — красная ошибка JavaScript. Как лучше приложить ошибку?"
  options:
    - "Скриншотом всего экрана"
    - "Текстом — целиком, с файлом и строкой; скриншот только в дополнение"
    - "Достаточно написать «в консоли ошибка»"
    - "Не прикладывать: разработчик сам откроет Console"
  correct: 1
  explanation: |
    Текст можно найти поиском, скопировать, по нему разработчик видит файл и
    место в коде. С картинки его придётся перепечатывать. Разработчик не
    увидит ошибку в своей Console, если она случается только в твоём
    окружении.

- id: web15-04
  type: card
  question: Что такое HAR и как его безопасно отправить разработчику?
  answer: |
    **HAR** (HTTP Archive) — файл со всеми запросами и ответами вкладки
    Network: заголовки, тела, время. Разработчик откроет его у себя и
    увидит твою сессию.

    Безопасно:
    - тестовая учётка, не рабочая;
    - запись **после** входа, если вход не нужен для бага;
    - обычный экспорт, не «with sensitive data»;
    - поиск в файле `password`, `token`, `Authorization`, `cookie` —
      замена на `***`;
    - отправка в баг-трекер или лично, **не в общий чат**.

- id: web15-05
  type: quiz
  question: "Новый Chrome при обычном экспорте HAR убирает секретные заголовки. Значит, файл можно отправлять без проверки?"
  options:
    - "Да, Chrome всё почистил"
    - "Да, если стенд тестовый"
    - "Нет: тела запросов и ответов остаются — пароль из формы входа, токен в ответе, личные данные. Нужен поиск и чистка"
    - "Нет, HAR вообще нельзя отправлять"
  correct: 2
  explanation: |
    Обычный экспорт вырезает часть **заголовков** — например, Authorization
    и cookie. Но **тела** остаются как есть: `password` в запросе входа,
    `accessToken` в ответе. Проверяй поиском, а не по памяти: поведение
    зависит от версии браузера.

- id: web15-06
  type: card
  question: Что такое correlationId (X-Request-ID) и зачем он в баг-репорте?
  answer: |
    Номер, который сервер даёт каждому запросу. Приходит в заголовке ответа
    (часто `X-Request-ID`) и иногда в теле ошибки. Тот же номер сервер пишет
    в свой лог.

    В баг-репорте номер + время позволяют разработчику найти в логах
    **одну** нужную строку и причину ошибки, а не искать «примерно в
    10:15». Особенно важен при ошибках 500 и «Что-то пошло не так».

- id: web15-07
  type: quiz
  question: "Форма не отправилась при выключенной сети (Offline). Где найти номер запроса для логов сервера?"
  options:
    - "В заголовке X-Request-ID ответа"
    - "В Console"
    - "Нигде: запрос не дошёл до сервера, ответа и номера нет, в логах сервера строки не будет"
    - "В HAR"
  correct: 2
  explanation: |
    Номер выдаёт сервер. Если запрос не дошёл — сервер его не видел. Это тоже
    факт для баг-репорта: «ошибка сети, сервер не участвовал». Искать
    причину нужно на стороне браузера: Console и Network.

- id: web15-08
  type: card
  question: Чем Console браузера отличается от логов сервера и от Sentry?
  answer: |
    - **Console** — ошибки JavaScript **на твоём компьютере**. На сервер не
      попадают, разработчик их не увидит, если не приложишь.
    - **Логи сервера** — что пришло на сервер: запросы, коды, ошибки
      бэкенда, номер запроса. Смотрят в терминале или в Kibana.
    - **Sentry** и аналоги — ошибки JavaScript из браузеров **всех
      пользователей**: сколько раз, у скольких людей, в каких браузерах,
      с какой версии, с «хлебными крошками» — действиями перед ошибкой.

- id: web15-09
  type: quiz
  question: "Как правильно указать браузер в баг-репорте?"
  options:
    - "«Последняя версия Chrome»"
    - "«Chrome»"
    - "«Chrome 130, Windows 11» — с номером версии и ОС; плюс где не воспроизводится"
    - "Браузер указывать не нужно, если баг на бэке"
  correct: 2
  explanation: |
    «Последняя» через месяц станет другой. Номер версии и ОС — то, что
    разработчик повторит. Строка «в Firefox 131 и Safari 17 не
    воспроизводится» сразу подсказывает, что дело в браузере. Если баг
    точно на бэке — браузер менее важен, но указать его ничего не стоит.

- id: web15-10
  type: card
  question: Какое доказательство приложить к какому веб-багу?
  answer: |
    - вёрстка — **скриншот с выделением**, наложение на макет;
    - длинная страница — **скриншот всей страницы** из DevTools;
    - последовательность, анимация, «прыгает» — **видео** 15–40 с;
    - кнопка не работает, белый экран — **текст ошибки из Console**;
    - неверные данные, ошибка сервера — **запрос и ответ из Network**,
      cURL без токена, **номер запроса**;
    - плавающий баг, «только у меня» — **HAR** без секретов;
    - «медленно» — цифры до/после, отчёт Lighthouse.

    Не всё подряд — то, что доказывает **причину** этого бага.

- id: web15-11
  type: quiz
  question: "В адресе страницы с багом есть `?token=8f3a9c…` из письма восстановления пароля. Что делать с URL в баг-репорте?"
  options:
    - "Вставить как есть: URL должен быть полным"
    - "Не указывать URL вообще"
    - "Оставить адрес и параметры, а значение токена заменить на *** и написать, из какого письма ссылка"
    - "Сократить ссылку сервисом-сокращателем"
  correct: 2
  explanation: |
    Пока токен жив, любой читатель бага сменит пароль этой учётки. Полный
    URL нужен, но без секретов. Если для бага важен сам токен — разработчик
    найдёт его сам по времени и адресу письма. Сокращатель ничего не
    скрывает: ссылка откроется так же.

- id: web15-12
  type: card
  question: Как писать заголовок веб-бага?
  answer: |
    По формуле **где — что — при каком условии**. В вебе условие часто и
    есть баг: браузер, ширина, сеть, роль.

    Плохо: «Не работает кнопка».
    Хорошо: «Корзина: кнопка „Оформить“ не реагирует на клик в Safari 17».

    Проверка: по заголовку без описания понятно, где искать и что сломано.

- id: web15-13
  type: quiz
  question: "Разработчик закрыл баг «не воспроизводится». Что сделать в первую очередь?"
  options:
    - "Переоткрыть с тем же текстом"
    - "Найти, чем окружения отличаются: браузер, роль, данные, флаги, стенд, сборка — и дописать условие в баг"
    - "Согласиться и закрыть"
    - "Пожаловаться руководителю"
  correct: 1
  explanation: |
    Если разработчик не воспроизвёл, в баге не хватает условия. Проверь в
    инкогнито, сравни учётки, роли, данные, флаги функций и версию сборки.
    Найди, где баг есть и где нет, — допиши. Если не получается — покажи
    на созвоне, это быстрее переписки.

- id: web15-14
  type: quiz
  question: "В Console красная строка «POST …/api/v1/auth/login 422 (Unprocessable Entity)». Что это?"
  options:
    - "Упал JavaScript на странице"
    - "Браузер сообщает, что сервер ответил кодом 422. Это не ошибка JavaScript — смотри сам запрос в Network"
    - "Ошибка расширения браузера"
    - "Сервер упал"
  correct: 1
  explanation: |
    Chrome показывает в Console неуспешные ответы сервера красным, хотя
    скрипт работает. Красное в Console — не всегда «упал скрипт». Читай
    текст: здесь причина — в ответе сервера, а доказательство — запрос и
    ответ из Network.

- id: web15-15
  type: card
  question: Что такое Mailtrap и зачем он тестировщику?
  answer: |
    **Перехватчик писем** на тестовом стенде (аналоги — MailHog, Mailpit).
    Сайт «отправляет» письмо, а оно попадает не в интернет, а в ящик
    перехватчика.

    Тестировщик видит письма — «Восстановление пароля», «Подтверждение
    email» — их текст, ссылки и вёрстку, без настоящего ящика и без риска
    отправить письмо реальному клиенту. Настраивают его разработчики —
    спроси, есть ли он на проекте.

- id: web15-16
  type: card
  question: Что такое UTM-метки и что в них проверяет тестировщик?
  answer: |
    Параметры в ссылке, которые говорят аналитике, **откуда пришёл
    человек**: `?utm_source=vk&utm_medium=cpc&utm_campaign=sale`.

    Что проверить:
    - страница с метками открывается без ошибок;
    - метки не ломают фильтры и пагинацию, которые тоже живут в URL;
    - метки не теряются при переходах, если так требуется;
    - событие аналитики уходит — запрос к счётчику видно в Network.

- id: web15-17
  type: quiz
  question: "Удобное расширение одним кликом отправляет видео, Console и запросы в баг-трекер через свой сервис. Можно ли сразу поставить его на рабочем проекте?"
  options:
    - "Да, оно экономит время"
    - "Да, если оно бесплатное"
    - "Сначала спросить команду: данные уходят в сторонний сервис, там могут оказаться данные клиентов и токены"
    - "Нет, расширения запрещены всегда"
  correct: 2
  explanation: |
    Записи экрана, консоль и запросы попадают на серверы чужой компании. На
    рабочем проекте это вопрос безопасности и иногда закона о персональных
    данных. Во многих компаниях есть список одобренных инструментов. Если
    нельзя — то же самое собирается встроенными средствами.

- id: web15-18
  type: quiz
  question: "Баг: на экране «Что-то пошло не так», в ответе сервера — 500 и пустое тело. Что самое полезное приложить?"
  options:
    - "Скриншот сообщения"
    - "Номер запроса (X-Request-ID) и точное время — по ним разработчик найдёт в логах сервера причину"
    - "Отчёт Lighthouse"
    - "Видео на 3 минуты"
  correct: 1
  explanation: |
    Ни экран, ни ответ причину не показывают. Причина — в логах сервера, а
    ключ к ним — номер запроса и время с часовым поясом. Плюс запрос и cURL
    без токена, чтобы повторить. Скриншот — в дополнение.

- id: web15-19
  type: card
  question: Как записать хорошее видео для баг-репорта?
  answer: |
    - **коротко** — 15–40 секунд, лишнее обрезать;
    - **начать с URL**, чтобы было видно, где ты;
    - медленно, без суеты курсором; при необходимости — открытые DevTools;
    - видео **не заменяет** шаги текстом.

    Встроенные средства: macOS — Cmd + Shift + 5, Windows 11 — «Ножницы»
    в режиме видео. Видео нужно, когда важна **последовательность**:
    скриншот её не покажет.

- id: web15-20
  type: quiz
  question: "Баг плавающий: повторился 2 раза из 20. Что верно?"
  options:
    - "Не заводить, пока не повторится стабильно"
    - "Завести с честной частотой, приложить всё, что успел сохранить (HAR, Console, время), и описать условия этих двух раз"
    - "Написать «воспроизводится всегда», чтобы взяли в работу"
    - "Завести с серьёзностью «блокирующая», чтобы заметили"
  correct: 1
  explanation: |
    Плавающие баги — часто гонки запросов, кэш, медленная сеть, и они
    бывают самыми опасными. Частота «2 из 20» — честная и полезная
    информация. Держи DevTools открытыми с Preserve log, при повторе сразу
    сохраняй HAR. Если есть Sentry — посмотри, как часто ошибка у
    пользователей.
