# Вопросы темы «Локализация и форматы». Формат — см. osnovy/bag-report.yaml.

- id: web12-01
  type: card
  question: Что такое i18n и l10n и чем они отличаются?
  answer: |
    - **i18n** — интернационализация (между i и n — 18 букв). Это
      подготовка кода: тексты вынесены из кода в отдельные файлы, даты
      и числа форматируются под язык пользователя, вёрстка выдерживает
      длинные слова. Делается один раз.
    - **l10n** — локализация (между l и n — 10 букв). Это перевод и
      настройка под конкретную страну: язык, форматы, валюта. Делается
      для каждой новой страны.

    Проще: i18n — дом построили так, чтобы в нём могли жить люди из
    разных стран; l10n — обставили его под конкретную семью.

- id: web12-02
  type: card
  question: Что входит в чек-лист проверки переводов?
  answer: |
    - всё переведено: нет забытых строк на другом языке и «ключей» вида
      `button.save` вместо текста;
    - переведены не только экраны, но и ошибки, уведомления, подсказки,
      письма, PDF, выгрузки, заголовок вкладки;
    - картинки с текстом;
    - длинные переводы (немецкий примерно на 30% длиннее английского)
      не ломают кнопки, меню, таблицы;
    - склонения и число: «1 задача, 2 задачи, 5 задач, 21 задача»;
    - род и падеж при подстановке имён;
    - сортировка по алфавиту языка, поиск без учёта регистра;
    - атрибут `lang` у `<html>` соответствует языку;
    - для арабского и иврита — зеркальная раскладка (RTL).

- id: web12-03
  type: quiz
  question: "Счётчик на сайте: «1 задача», «2 задачи», «5 задач» — правильно. Какой набор чисел лучше всего найдёт оставшиеся ошибки склонения?"
  options:
    - "3, 4, 6, 7, 8, 9, 10"
    - "11, 12, 21, 22, 25, 111"
    - "100, 1000, 10000"
    - "Больше ничего: 1, 2 и 5 покрывают все три формы"
  correct: 1
  explanation: |
    Русские формы зависят от последних цифр, и ломается чаще всего после
    10. На 11–14 форма «задач», хотя последняя цифра 1–4. На 21 — снова
    «задача», на 22 — «задачи». 111 — «задач». Типичные баги: «21 задач»
    и «11 задача». Числа до 10 разработчик обычно уже проверил сам.

- id: web12-04
  type: card
  question: Как записывают даты, числа и деньги в России и в США?
  answer: |
    | Что | Россия | США |
    |---|---|---|
    | Дата | 21.10.2026 | 10/21/2026 |
    | Время | 23:30 | 11:30 PM |
    | Первый день недели | понедельник | воскресенье |
    | Число | 1 234,5 | 1,234.5 |
    | Деньги | 1 234,50 ₽ | $1,234.50 |

    Международный формат даты — ISO 8601: `2026-10-21`. Его используют
    в API и базах данных: год, месяц, день — одинаково для всех.

- id: web12-05
  type: quiz
  question: "Поле даты на сайте для США. Пользователь из России вписал «03/04/2026», имея в виду 3 апреля. Что сохранится, если сайт ждёт американский формат?"
  options:
    - "3 апреля 2026"
    - "4 марта 2026"
    - "Ошибка «неверная дата»"
    - "Сайт сам поймёт по языку браузера"
  correct: 1
  explanation: |
    В американском формате первым идёт месяц: `03/04` — это 4 марта.
    Дата валидна, ошибки не будет — поэтому подмена незаметна.
    Самые опасные даты — где и день, и месяц не больше 12. Защита —
    подсказка формата в поле и месяц словом при показе: «4 марта 2026».

- id: web12-06
  type: card
  question: Что такое UTC и как правильно хранить и показывать время?
  answer: |
    **UTC** — всемирное координированное время, нулевой пояс («время по
    Гринвичу»). Все пояса записывают как сдвиг от него: Москва — UTC+3.

    Правильная схема:
    1. Сервер и база хранят время в UTC — один момент, одна запись.
    2. API отдаёт его в ISO 8601 с поясом: `2026-10-21T20:30:00Z`
       (`Z` — это UTC) или `2026-10-21T23:30:00+03:00` — это одно и то же.
    3. Браузер показывает время в поясе пользователя.

    Время без `Z` и без смещения — красный флаг: непонятно, чьё оно.

- id: web12-07
  type: quiz
  question: "Ты в Москве. Создал заказ в 15:00. В ответе API: \"createdAt\": \"2026-10-21T12:00:00Z\". На экране — 15:00. Что это?"
  options:
    - "Баг сервера: время отстаёт на 3 часа"
    - "Баг фронта: на экране не то, что в API"
    - "Всё правильно: Z — это UTC, 12:00 UTC — это 15:00 по Москве"
    - "Баг базы данных: неверный часовой пояс"
  correct: 2
  explanation: |
    Буква `Z` в конце означает UTC. Москва — UTC+3, значит 12:00 UTC —
    это 15:00 по Москве. Сервер хранит и отдаёт время правильно, фронт
    правильно перевёл в пояс пользователя. Баг был бы, если бы на экране
    тоже было 12:00 — тогда фронт показал UTC как местное время.

- id: web12-08
  type: card
  question: Где часовые пояса чаще всего ломаются?
  answer: |
    - «сегодня» и «вчера» около полуночи — сайт считает по UTC, а у
      пользователя уже другой день;
    - дедлайн «до 23:59» — чьего времени?
    - отчёт «за день» на сервере в UTC — для Москвы сдвинут на 3 часа:
      заказы с 00:00 до 03:00 попадают во вчерашний день;
    - конец месяца и года — тот же сдвиг, но в бухгалтерии;
    - переход на летнее время в Европе и США;
    - даты без времени (день рождения) сдвигаются у пользователей
      западнее UTC;
    - время в API без `Z` и без смещения.

- id: web12-09
  type: quiz
  question: "Пользователи из Нью-Йорка видят дату рождения на день раньше. Из Москвы всё правильно. API отдаёт \"birthDate\": \"1990-05-15T00:00:00Z\". В чём причина?"
  options:
    - "Ошибка перевода на английский"
    - "Дату рождения хранят как момент «полночь по UTC», а в Нью-Йорке в этот момент ещё 14 мая"
    - "В США другой формат даты, поэтому день и месяц перепутались"
    - "Ошибка в браузере пользователя, бэк и фронт ни при чём"
  correct: 1
  explanation: |
    Полночь 15 мая по UTC — это вечер 14 мая в Нью-Йорке (UTC−4 летом).
    Браузер честно переводит момент в пояс пользователя. В Москве,
    восточнее UTC, это утро 15 мая — поэтому баг не виден. Дата рождения
    — это просто дата, а не момент: её передают как `1990-05-15` и не
    переводят в пояс. Проверяют такие поля в поясе западнее UTC.

- id: web12-10
  type: card
  question: Чем «момент времени» отличается от «просто даты» и почему это важно?
  answer: |
    - **Момент** — время создания заказа, комментария, дедлайн. Это одна
      точка на шкале времени. Хранится в UTC и показывается в поясе
      пользователя: в Москве 23:30, в Лондоне 21:30.
    - **Просто дата** — день рождения, дата выдачи паспорта, праздник. Она
      одинакова в любом поясе и не должна сдвигаться. В API — `1990-05-15`,
      без времени и `Z`.

    Тестировщик у каждого поля с датой спрашивает: это момент или дата?
    Ошибка в этом — классический сдвиг «на день раньше» западнее UTC.

- id: web12-11
  type: quiz
  question: "Сервер считает отчёт «за 21 октября» с 00:00 до 23:59 по UTC. Магазин в Москве. В какой день отчёта попадёт заказ, сделанный 22 октября в 01:30 по Москве?"
  options:
    - "22 октября — он сделан 22-го"
    - "21 октября — по UTC это 21 октября, 22:30"
    - "23 октября"
    - "Никуда: время после полуночи в отчёт не попадает"
  correct: 1
  explanation: |
    01:30 по Москве (UTC+3) — это 22:30 предыдущего дня по UTC. Сервер
    считает день по UTC и положит заказ в отчёт за 21 октября. А
    директор в Москве ждёт его в 22-м. Это вопрос к требованиям: по
    какому поясу считать «день». Проверяют такие отчёты заказами около
    полуночи — днём расхождение не видно.

- id: web12-12
  type: card
  question: Как проверить сайт в другом часовом поясе и с другим языком браузера?
  answer: |
    - **Пояс в DevTools:** ⋮ → More tools → Sensors → Location → готовый
      город или Other… и поле Timezone ID, например `America/New_York`.
      Действует на вкладку. Проверка в Console:
      `Intl.DateTimeFormat().resolvedOptions().timeZone`.
    - **Пояс системы** — надёжнее для полной проверки: настройки даты и
      времени в macOS или Windows.
    - **Язык браузера:** Chrome → Settings → Languages, поднять язык
      наверх. Проверка: `navigator.language` в Console и заголовок
      `Accept-Language` в Network.
    - **Сравнить API и экран:** какое время пришло (с `Z`?) и какое
      показано.

    Названия пунктов в разных версиях Chrome могут отличаться.

- id: web12-13
  type: quiz
  question: "Пользователь поставил английский язык браузера. Сайт, который поддерживает только русский, остался на русском. Это баг?"
  options:
    - "Да: сайт обязан переключаться на язык браузера"
    - "Да, критичный: пользователь не поймёт интерфейс"
    - "Нет, если в требованиях только русский. Сайт не обязан реагировать на язык браузера — только если это записано в требованиях"
    - "Нет, потому что язык браузера на сайт никак не передаётся"
  correct: 2
  explanation: |
    Браузер сообщает сайту язык в заголовке `Accept-Language`, но выбирать
    по нему язык сайт не обязан. Если продукт только на русском — это
    правильное поведение. Последний вариант неверен: язык передаётся,
    его видно в Network → Request Headers. Баг был бы, если бы по
    требованиям язык должен выбираться по браузеру, а этого не
    происходит.

- id: web12-14
  type: card
  question: Что такое летнее время и что с ним ломается?
  answer: |
    Во многих странах дважды в год переводят часы. В России сейчас не
    переводят, но в Европе — в последние воскресенья марта и октября, в
    США — во второе воскресенье марта и в первое воскресенье ноября.

    Что ломается:
    - весной часть времени не существует: с 02:00 сразу 03:00;
    - осенью часть времени бывает дважды: 02:30 два раза;
    - сутки в день перехода — 23 или 25 часов;
    - жёстко прописанный сдвиг: «Нью-Йорк = UTC−5», а летом там UTC−4;
    - разница Москвы с Европой и США меняется на час в течение года.

- id: web12-15
  type: quiz
  question: "Список городов отсортирован по алфавиту так: «Ёлкино, Анапа, Владимир, Ярославль». Что не так?"
  options:
    - "Всё правильно: Ё — особая буква, её ставят первой"
    - "Сортировка по кодам символов: Ё должна стоять рядом с Е — после Владимира и перед Ярославлем"
    - "Нужно сортировать по длине названия"
    - "Сортировка не важна, пользователи пользуются поиском"
  correct: 1
  explanation: |
    В русском алфавите Ё идёт сразу после Е. Простая сортировка «по кодам
    символов» ставит заглавную Ё в самое начало — перед А, — а строчную ё
    в самый конец — после я. Сортировку проверяют на значениях с Ё, ё и
    разным регистром. Правильный порядок для языка можно посмотреть в
    Console через `Intl.Collator('ru')`.

- id: web12-16
  type: card
  question: Какие лайфхаки помогают тестировать локализацию без переводчика?
  answer: |
    - **Intl в Console** — посмотреть, как принято:
      `new Intl.NumberFormat('de-DE').format(1234.5)` → `1.234,5`.
    - **Длинный перевод вручную** — в Elements дописать текст кнопки
      ещё раз: «Сохранить Сохранить» — поместилось?
    - **Псевдолокализация** — режим, где все тексты превращаются в
      `[Ŝàvé ţĥîš !!!]`. Строка без закорючек — не переведена, обрезанная
      скобка — текст не помещается.
    - **Набор тестовых данных** — `Анна-Мария О'Нил`, фамилия `Ю`,
      числа для склонений, `1234,56`, `03.04.2026`, `23:59`.
    - **Две вкладки с разными поясами** рядом.

- id: web12-17
  type: quiz
  question: "Ответ API: \"createdAt\": \"2026-10-21T20:30:00\" — без Z и без смещения. Что сделает тестировщик?"
  options:
    - "Ничего: формат ISO 8601, значит всё правильно"
    - "Спросит разработчика, в каком поясе это время, и проверит экран в разных поясах: такую строку каждый может понять по-своему"
    - "Заведёт критичный баг: API сломан"
    - "Переведёт время в московское и сравнит с часами"
  correct: 1
  explanation: |
    Без `Z` и смещения непонятно, чьё это время: UTC, Москвы или сервера.
    JavaScript понимает такую строку как местное время пользователя — и в
    каждом поясе получится другой момент. Сначала — вопрос к спецификации
    и разработчику. Сразу «критичный баг» — рано: возможно, так задумано и
    описано. Переводить в московское наугад нельзя: неизвестно, из какого
    пояса.

- id: web12-18
  type: card
  question: Что обязательно указать в баг-репорте по локализации и часовым поясам?
  answer: |
    - **язык браузера** (`navigator.language`) и язык в профиле сайта;
    - **часовой пояс** системы или подмену в DevTools — например,
      `America/New_York`;
    - **время, когда воспроизводил** — для багов около полуночи это
      критично;
    - **что пришло в API** — строку времени целиком, с `Z` или
      смещением;
    - **что на экране** — скриншот;
    - **ожидание** по требованиям: в каком поясе и формате должно быть.

    Не «время неправильное», а «пришло 20:30Z, показано 20:30, ожидалось
    23:30 по Москве».
