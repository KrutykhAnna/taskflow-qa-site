# Вопросы темы «Формы и валидация». Формат — см. osnovy/bag-report.yaml.

- id: web5-01
  type: card
  question: Что такое валидация формы и почему её делают и на фронте, и на бэке?
  answer: |
    **Валидация** — проверка введённых данных: не пусто ли, не слишком
    ли длинно, правильный ли формат.

    - **На фронте** — в браузере: быстро и удобно, ошибка видна сразу у
      поля, без запроса на сервер. Но её можно обойти.
    - **На бэке** — на сервере: главная защита данных. Через неё проходит
      любой путь — интерфейс, Postman, интеграции, мобильное приложение.

    Проверка только на фронте — баг. И правила на фронте и бэке должны
    совпадать.

- id: web5-02
  type: card
  question: Что проверить у любого текстового поля формы?
  answer: |
    Всегда:

    - **обязательность** — пусто → понятная ошибка;
    - **только пробелы** — считается пустым;
    - **длина** — ровно максимум принимается, максимум +1 — нет
      (и минимум / минимум −1, если он есть);
    - **пробелы по краям** — что сохранилось.

    По типу поля: формат (email, телефон), регистр, спецсимволы и
    кириллица, эмодзи, HTML (`<b>жирный</b>` должен показаться текстом),
    вставка из буфера, автозаполнение браузера, маска ввода.

- id: web5-03
  type: quiz
  question: "Тестировщик удалил у поля атрибут maxlength, ввёл 101 символ и увидел «Не длиннее 100 символов». Какой вывод верный?"
  options:
    - "Бэк проверяет длину — ошибка же появилась"
    - "Пока ничего нельзя сказать про бэк: нужно посмотреть, ушёл ли запрос; скорее всего, сработала проверка в JavaScript"
    - "Удаление maxlength не сработало, нужно обновить страницу"
    - "Это баг: после удаления maxlength ограничения быть не должно"
  correct: 1
  explanation: |
    Ошибку мог показать сам фронт — проверкой в JavaScript, без запроса
    на сервер. Если в Network запроса нет, о бэке вывода нет. Проверить
    бэк — отправить 101 символ напрямую через Postman и получить `422`.

- id: web5-04
  type: card
  question: Как проверить, что бэк тоже валидирует поле, — по шагам?
  answer: |
    1. Отправить форму с правильными данными через интерфейс.
    2. В Network найти запрос → Copy → **Copy as cURL (bash)**.
    3. В Postman: Import → вставить. Запрос с токеном готов.
    4. В Body менять значение: пусто, только пробелы, максимум +1,
       неверный формат, без поля.
    5. Смотреть ответ: `422`/`400` с описанием — бэк проверяет;
       `200`/`201` — бэк принял плохие данные, баг; `500` — сервер
       упал вместо проверки, тоже баг.

    Быстрый вариант без Postman — убрать `maxlength`, `required`,
    `disabled` в Elements, но за атрибутом часто стоит проверка в
    JavaScript.

- id: web5-05
  type: quiz
  question: "В интерфейсе ввести больше 50 символов нельзя, а через Postman API принимает 5000. Как оценить?"
  options:
    - "Не баг: пользователи работают через интерфейс"
    - "Баг фронта: ограничение нужно убрать, раз API разрешает"
    - "Баг бэка, обычно серьёзный: через API, интеграции и старые клиенты в базу попадает мусор"
    - "Низкий приоритет: воспроизводится только через Postman"
  correct: 2
  explanation: |
    В API ходит не только интерфейс: интеграции, мобильное приложение,
    скрипты. Если правило «до 50» — реальное ограничение данных, бэк
    обязан отвечать `422`. Иначе длинные значения ломают отчёты,
    выгрузки и вёрстку. Если не ясно, какое правило верное, — вопрос
    аналитику, но «через интерфейс нельзя» — не аргумент.

- id: web5-06
  type: card
  question: Фронт пропустил, бэк поймал — и наоборот. Чей это баг в каждом случае?
  answer: |
    - **Фронт пропустил, бэк поймал** — баг фронта, обычно средний:
      данные не испорчены, но ошибка приходит поздно и часто общим текстом.
    - **Фронт поймал, бэк пропустил** — баг бэка, высокий: мусор попадает
      в базу в обход интерфейса. Находится только обходом фронта.
    - **Оба пропустили** — баг обоих, высокий.
    - **Правила разные** (фронт строже или мягче) — сначала требование:
      от него зависит, чей баг. Нет требования — вопрос аналитику.

- id: web5-07
  type: quiz
  question: "Поле «Название» обязательное. Тестировщик ввёл три пробела, форма сохранила проект. Что верно?"
  options:
    - "Всё правильно: поле не пустое, в нём три символа"
    - "Скорее всего, баг: только пробелы обычно считаются пустым значением; в списке появится проект без видимого названия"
    - "Это проверка безопасности, к валидации не относится"
    - "Баг браузера: он должен удалять пробелы сам"
  correct: 1
  explanation: |
    Обязательное поле из одних пробелов для пользователя пустое — в
    списке будет строка без названия. Обычно пробелы обрезают и
    проверяют обязательность после обрезки. Сверься с требованием и
    проверь то же через API: бэк может обрабатывать пробелы иначе, чем
    фронт.

- id: web5-08
  type: card
  question: Что не так с атрибутом maxlength с точки зрения пользователя?
  answer: |
    `maxlength` не даёт напечатать лишний символ, а при **вставке**
    длинного текста браузер **молча обрезает** его до лимита. Пользователь
    вставил описание из документа и не заметил, что конец пропал.

    Это не нарушение правила длины, но вопрос дизайнеру: может, нужен
    счётчик «87 / 100» или ошибка вместо тихой обрезки.

    И главное: `maxlength` — только фронт. Его стирают в Elements за
    секунду, бэк должен проверять длину сам.

- id: web5-09
  type: quiz
  question: "Поле «Ник» — до 20 символов. Ник из 11 эмодзи фронт отклоняет как слишком длинный, а через API такой ник сохраняется. Что происходит?"
  options:
    - "Бэк сломан: он не считает эмодзи"
    - "Фронт и бэк по-разному считают длину: в JavaScript эмодзи часто имеет длину 2, а в Python и во многих базах — 1 символ"
    - "Эмодзи нельзя использовать в никах, так и задумано"
    - "Баг Postman: он искажает эмодзи"
  correct: 1
  explanation: |
    11 эмодзи в JavaScript — длина 22, больше 20. На сервере это 11
    символов — в пределах лимита. Правило одно, а считают его по-разному.
    Это расхождение фронта и бэка: нужно договориться, как считать, и
    проверить границу длины эмодзи на обеих сторонах.

- id: web5-10
  type: card
  question: Что проверить в сообщениях об ошибках формы?
  answer: |
    - **Где**: рядом с полем, к которому относится.
    - **Когда**: при вводе, при уходе с поля или при отправке — и не
      краснеют ли пустые поля сразу при открытии формы.
    - **Текст**: понятный — что не так и что сделать; без кода и
      системных английских сообщений.
    - **Исчезает** после исправления.
    - **Введённое не пропадает** после ошибки.
    - **Фокус**: курсор встаёт в первое ошибочное поле, длинная форма
      прокручивается к нему.
    - Не дублируется в трёх местах сразу.

- id: web5-11
  type: quiz
  question: "Сервер ответил 422 с понятным message, а пользователь видит «Что-то пошло не так». Что это?"
  options:
    - "Норма: технические ошибки пользователю не показывают"
    - "Баг бэка: он вернул 422"
    - "Баг фронта: сервер объяснил причину, а интерфейс её не показал"
    - "Не баг, если в Console есть текст ошибки"
  correct: 2
  explanation: |
    `422` — отказ с объяснением, предназначенным для пользователя (если
    API отдаёт понятный `message`). Фронт должен показать его у поля или
    над формой. Общий текст оставляет человека без подсказки, что
    исправить. Плюс проверь, что введённые данные не стёрлись.

- id: web5-12
  type: card
  question: Что проверить при отправке формы?
  answer: |
    - Кнопка до заполнения: неактивна с объяснением или показывает
      ошибки по нажатию.
    - **Enter** в однострочном поле отправляет форму, в многострочном
      (`textarea`) — делает перенос строки.
    - **Двойной клик и двойной Enter** на медленной сети — должен уйти
      один запрос.
    - **После успеха** — понятный итог: уведомление, закрытие окна,
      объект в списке без F5.
    - **После ошибки сервера** — нет вечного спиннера, данные на месте.
    - Закрыть и открыть форму — не остались старые ошибки и данные.

- id: web5-13
  type: card
  question: Что такое Bug Magnet и Fake Filler и как ими пользоваться?
  answer: |
    Оба — расширения для Chrome и Firefox.

    - **Bug Magnet** — правый клик в поле → меню Bug Magnet → готовые
      «плохие» значения: длинные строки, юникод и эмодзи, граничные
      числа, правильные и неправильные email, пробелы. Напоминает о
      проверках, которые легко забыть.
    - **Fake Filler** — клик по иконке заполняет **всю форму**
      правдоподобными случайными данными. Удобно: остальные поля
      заполнены, а ты меняешь только проверяемое.

    Подвох Fake Filler: данные случайные — если баг воспроизвёлся,
    сразу сохрани значения.

- id: web5-14
  type: quiz
  question: "Нужно проверить поле с ограничением 255 символов. Какой способ лучше?"
  options:
    - "Напечатать руками примерно 260 символов"
    - "Сгенерировать строку в Console, например copy('a'.repeat(256)), и вставить; для наглядности — строку с маркером в конце"
    - "Вставить большой текст из интернета — главное, чтобы был длиннее"
    - "Проверить только 1000 символов: если 1000 не прошло, то и 256 не пройдёт"
  correct: 1
  explanation: |
    Граница проверяется точно: 255 и 256. Строка из Console даёт ровно
    нужную длину, а маркер в конце (`'1234567890'.repeat(25) + '12345X'`)
    показывает, где обрезали. «Примерно» и «очень длинное» не проверяют
    границу: баг «принимает 256» останется незамеченным.

- id: web5-15
  type: quiz
  question: "Фронт разрешает описание до 100 символов, сервер отвечает ошибкой на всё длиннее 50. Чей это баг?"
  options:
    - "Всегда бэка: сервер должен принимать то, что разрешает интерфейс"
    - "Всегда фронта: сервер — главный, интерфейс должен под него подстроиться"
    - "Зависит от требования: если в нём 100 — баг бэка, если 50 — фронта; если требования нет — вопрос аналитику"
    - "Ничей: данные же не испорчены"
  correct: 2
  explanation: |
    «Чей баг» определяет требование, а не тот, кто «главнее». Без
    требования тестировщик не выбирает правило сам — он задаёт вопрос
    аналитику. А пока расхождение есть, пользователь заполняет форму по
    подсказкам и получает отказ — это в любом случае нужно исправить.

- id: web5-16
  type: quiz
  question: "В поле «Комментарий» ввели <b>жирный</b>, после сохранения слово показалось жирным. Что это?"
  options:
    - "Удобная функция форматирования"
    - "Сайт не экранирует ввод: HTML пользователя выполняется на странице — это уязвимость, сразу к разработчику"
    - "Баг вёрстки, низкий приоритет"
    - "Норма, если поле многострочное"
  correct: 1
  explanation: |
    Если текст пользователя показывается как HTML, вместо безобидного
    `<b>` можно вставить и опасный код. Правильно — показать строку как
    есть, со скобками. Для такой проверки безобидного `<b>жирный</b>`
    достаточно — атакующие строки на чужих сайтах и в проде не нужны.

- id: web5-17
  type: card
  question: Что приложить к баг-репорту по валидации формы?
  answer: |
    - **Точное значение** текстом, чтобы его можно было скопировать, и
      его длину («101 символ»).
    - **Текст ошибки** как есть, скриншот поля.
    - **Запрос и ответ**: тело запроса, код и тело ответа — из Network
      или Postman.
    - **Правило** из требований, которое нарушено.
    - **Чей баг**, если понятно: «фронт пропускает, бэк отвечает 422»
      или «бэк принимает, через интерфейс нельзя».

- id: web5-18
  type: card
  question: Как работать с формой на задаче — по шагам?
  answer: |
    1. **Выписать правила** каждого поля из требований: обязательность,
       длина, формат, пробелы, тексты ошибок. Чего нет — вопрос аналитику
       до разработки.
    2. **Таблица проверок**: пусто, пробелы, максимум, максимум +1,
       пробелы по краям, формат, HTML.
    3. **Пройти через интерфейс**: Bug Magnet для значений, Fake Filler
       для остальных полей.
    4. **Обойти фронт**: cURL → Postman → те же значения напрямую.
    5. **Отправка**: Enter, двойной клик, успех, ошибка сервера.
    6. **Баг-репорт** с значением, текстом ошибки, запросом и ответом.

- id: web5-19
  type: quiz
  question: "Регистрация прошла с email «anna@mail.ru » (с пробелом в конце), а вход с «anna@mail.ru» пишет «Пользователь не найден». Где искать причину?"
  options:
    - "Пользователь ошибся, это не баг"
    - "Регистрация и вход по-разному обрабатывают пробелы: одна сторона сохранила пробел, другая обрезает"
    - "Проблема в пароле: сообщение просто неточное"
    - "Браузер подставил старый email через автозаполнение"
  correct: 1
  explanation: |
    Пробел в конце — частый результат копирования из письма. Если
    регистрация сохранила его, а вход обрезает, пользователь больше не
    войдёт. Ожидание — обрезать пробелы одинаково везде, и на бэке тоже.
    Проверяют это через интерфейс и через API: у поля `type="email"`
    браузер сам убирает пробелы, а запрос из Postman — нет.
