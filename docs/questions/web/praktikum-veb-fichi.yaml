# Вопросы темы «Практикум: веб-фича». Формат — см. osnovy/bag-report.yaml.

- id: web16-01
  type: card
  question: Как вы тестируете новую фичу в веб-интерфейсе — по шагам?
  answer: |
    1. **Спецификация и макет** — что должно работать, кому что можно,
       какие состояния; выписать вопросы.
    2. **Карта фичи** — экраны и окна, роли, состояния, запросы к API,
       таблицы в базе.
    3. **Счастливый путь** с открытыми DevTools — Network с Preserve log,
       Console.
    4. **Чек-листы с приоритетом** — сначала функциональность и права,
       потом состояния, формы, сеть, потом вёрстка, браузеры, ширины,
       доступность, скорость.
    5. **Сверка с API и базой** — что ушло, что пришло, что сохранилось,
       что в журнале.
    6. **Баг-репорты** — окружение, шаги с начала, доказательства.
    7. **Отчёт** — проверено, найдено, риски, не проверено, вывод.

- id: web16-02
  type: card
  question: Что такое «счастливый путь» и почему с него начинают?
  answer: |
    Основной сценарий, где пользователь всё делает правильно и всё
    работает: создал, открыл, изменил, удалил.

    С него начинают, потому что если он сломан, остальные проверки
    бессмысленны — это баг с высокой серьёзностью, о котором команда
    должна узнать сразу. И пока проходишь его, видишь все запросы фичи в
    Network — это готовая карта для следующих проверок.

- id: web16-03
  type: quiz
  question: "Времени мало. Что проверить в первую очередь?"
  options:
    - "Вёрстку против макета — её видят все пользователи"
    - "Функциональность и права: счастливый путь под разными ролями и отказ в обход интерфейса"
    - "Lighthouse и скорость загрузки"
    - "Все браузеры из матрицы"
  correct: 1
  explanation: |
    Порядок по тому, что сломается больнее всего. Не работает главное
    действие или роль без прав может удалить чужое — релиз
    останавливается. Состояния, формы и сеть — вторыми. Вёрстку, браузеры,
    ширины, доступность и скорость — выборочно, если продукт не требует
    иного: для банка или госуслуг доступность может быть в первой группе.

- id: web16-04
  type: card
  question: Что такое карта фичи и что на ней должно быть для веба?
  answer: |
    Схема фичи перед проверками. Для веба на ней:
    - **экраны и окна** — включая модальные, у которых нет своего адреса;
    - **роли** — кто что видит и что может;
    - **состояния** — пусто, загрузка, ошибка, нет по фильтру;
    - **запросы к API** с каждого экрана;
    - **таблицы в базе**, которые меняются, и журнал действий.

    Без карты легко пропустить целый кусок — например, что метки
    сохраняются отдельными запросами.

- id: web16-05
  type: quiz
  question: "Хитрый вопрос. Наблюдатель не видит кнопку «Удалить» у задачи. Права проверены?"
  options:
    - "Да, кнопки нет — значит, удалить нельзя"
    - "Нет: нужно отправить DELETE с токеном наблюдателя в обход интерфейса и убедиться, что сервер ответил 403 и в базе ничего не изменилось"
    - "Да, если кнопки нет и в мобильной версии"
    - "Нет: нужно проверить кнопку в другом браузере"
  correct: 1
  explanation: |
    Скрытая кнопка — вежливость интерфейса, а защита — работа сервера.
    Запрос можно отправить из Postman, cURL или Console. Проверка прав —
    это два пути: интерфейс прячет, сервер отказывает. И после отказа —
    взгляд в базу: ничего не удалилось, в журнале нет записи.

- id: web16-06
  type: quiz
  question: "Хитрый вопрос. Открыл карточку задачи — в Network нет запроса самой задачи. Что это значит?"
  options:
    - "Баг: карточка показывает выдуманные данные"
    - "Network сломан — нужно перезапустить DevTools"
    - "Карточка берёт данные из строки списка, которые уже пришли раньше. Не баг, но риск: изменения после загрузки списка карточка не покажет"
    - "Данные берутся напрямую из базы"
  correct: 2
  explanation: |
    Браузер не ходит в базу — только к API. Если отдельного запроса нет,
    данные пришли раньше, например в запросе списка. Такое решение
    экономит запросы, но карточка может показать устаревшее. Это стоит
    записать в отчёт как риск.

- id: web16-07
  type: card
  question: Зачем при тестировании веб-фичи смотреть в Network и базу, если на экране всё правильно?
  answer: |
    Экран — то, что фронт решил показать. Он может:
    - показать «Сохранено», хотя запрос не ушёл или вернул ошибку;
    - отправить два запроса — и в базе две записи;
    - отправить не все поля — и сохранится не всё.

    **Network** показывает, что ушло и что ответил сервер, и сразу
    отвечает на вопрос «фронт или бэк». **База** — что на самом деле
    лежит. **Журнал** — кто сделал действие.

- id: web16-08
  type: quiz
  question: "Форма редактирования отправила в PATCH все поля, хотя ты поменял только название. Это баг?"
  options:
    - "Да, всегда: PATCH должен содержать только изменённые поля"
    - "Нет, если сервер правильно сохраняет значения. Но стоит знать последствия: журнал запишет все поля, а одновременные правки двух людей могут затереть друг друга"
    - "Нет, PATCH и PUT одинаковы"
    - "Да, потому что сервер вернёт ошибку"
  correct: 1
  explanation: |
    Отправлять форму целиком — частое решение, не нарушение само по себе.
    Тестировщику важно видеть последствия: в журнале изменений — поля,
    которые никто не менял; если двое редактируют задачу одновременно,
    второй сохранит старые значения первого. Это повод для вопроса
    аналитику и для проверки «двое редактируют одно».

- id: web16-09
  type: card
  question: Что должно быть в отчёте по тестированию фичи?
  answer: |
    - **Фича и сборка** — что и на какой версии.
    - **Окружение** — браузеры, ширины, роли.
    - **Проверено** — числом: сколько проверок, passed, failed, blocked.
    - **Найдено** — баги со ссылками и серьёзностью, главный первым.
    - **Риски** — что может пойти не так.
    - **Не проверено** — честно и с причиной.
    - **Вывод** — можно выпускать, нельзя или можно с условиями.

- id: web16-10
  type: quiz
  question: "Хитрый вопрос. Какая строка отчёта по фиче самая важная для команды перед релизом?"
  options:
    - "Сколько багов найдено"
    - "Сколько часов ушло на тестирование"
    - "Что не проверено и почему"
    - "Список всех проверок"
  correct: 2
  explanation: |
    Про найденные баги команда и так знает из трекера. А о непроверенном
    узнаёт только из отчёта. Если там написано «Safari не проверен —
    нет устройства», тимлид решит, искать ли устройство или принять риск.
    Если строки нет — команда прочитает «багов нет» как «проверено всё».

- id: web16-11
  type: card
  question: Нашли 15 мелких замечаний по вёрстке и один критичный баг вечером перед релизом. Что делать?
  answer: |
    - **Критичный — сразу**: баг-репорт с доказательствами и личное
      сообщение тимлиду и разработчику, не дожидаясь, пока откроют трекер.
    - **Мелочи не терять**, но и не забивать ими трекер: сгруппировать
      одним баг-репортом по экрану со списком.
    - **В отчёте** — критичный первым, мелочи одной строкой.

    Решение «выпускать или нет» — за командой. Задача тестировщика —
    чтобы у неё были факты.

- id: web16-12
  type: quiz
  question: "Хитрый вопрос. Другой пользователь сменил статус задачи, а у тебя на экране старый, пока не нажмёшь F5. Это баг?"
  options:
    - "Да, всегда: данные должны обновляться сами"
    - "Нет, если требования не обещают живого обновления. Баг — если после F5 всё ещё старое или если твои же изменения не видны на другом экране"
    - "Да, это баг кэша браузера"
    - "Нет, F5 никогда не нужен"
  correct: 1
  explanation: |
    Живое обновление между пользователями — отдельная функция, её нужно
    требовать явно. Без требования это вопрос аналитику, а не баг. Баг —
    когда данные не обновились там, где должны: после перезагрузки или в
    другом месте интерфейса после твоего же действия.

- id: web16-13
  type: card
  question: Разработчик отвечает «в спецификации не написано — не баг». Ваши действия?
  answer: |
    Не спорить: требования действительно нет. Но «нет требования» не
    значит «так и надо».

    - Перевести баг в **вопрос аналитику** или дизайнеру.
    - Показать, как ведут себя похожие места продукта и что в макете.
    - Объяснить, что видит пользователь и чем это мешает.

    Аналитик решает и дописывает требование — тогда баг закрывается или
    становится настоящим, со ссылкой на новое требование.

- id: web16-14
  type: quiz
  question: "Как правильно подготовить данные для проверки пагинации на 20 строк?"
  options:
    - "Создать 3–4 записи руками — пагинация видна и так"
    - "Создать больше 20 записей быстро — например, Postman Runner — и проверить переход, подписи, отсутствие повторов и пропусков"
    - "Попросить разработчика включить пагинацию на 2 строки"
    - "Пагинацию проверять не нужно, если есть поиск"
  correct: 1
  explanation: |
    Пока данных меньше страницы, пагинации нет — и проверять нечего.
    Runner создаёт 25 записей за минуту. Дальше: подпись «1–20 из N»,
    переход, сброс страницы при смене фильтра, каждый id ровно один раз,
    total в ответе совпадает с COUNT(*) из базы.

- id: web16-15
  type: card
  question: Что проверить, когда в вебе удаляют запись с мягким удалением?
  answer: |
    - **Интерфейс**: подтверждение с понятным текстом, «Отмена» не
      отправляет запрос, после удаления запись пропала из всех списков.
    - **Network**: `DELETE` → `204`, список перезапрошен, повторный
      `GET` записи — `404`.
    - **База**: строка на месте, `deleted_at` заполнен; связанные записи —
      тем же моментом; ранее удалённые сохранили своё время.
    - **Журнал**: одна запись об удалении от того, кто удалил.
    - **Другой пользователь**: после обновления запись у него тоже пропала.

- id: web16-16
  type: quiz
  question: "Хитрый вопрос. Ты протестировал фичу три дня и не нашёл ни одного бага. Что это значит?"
  options:
    - "Тестирование провалено"
    - "Фича идеальна, можно не писать отчёт"
    - "Само по себе ничего: качество работы показывает отчёт — что, где и под кем проверено и что нет. Стоит перепроверить себя в местах, где баги прячутся чаще"
    - "Нужно срочно найти хоть что-нибудь"
  correct: 2
  explanation: |
    Цель тестирования — информация о качестве, а не число багов.
    Хорошая фича бывает. Но самопроверка полезна: права в обход
    интерфейса, медленная сеть, граничные значения, пустые и длинные
    данные, другая роль, другой браузер.

- id: web16-17
  type: card
  question: Фича проверена только в Chrome, Safari проверить не на чем, релиз завтра. Что делать?
  answer: |
    - Сказать **сегодня**, а не после релиза: тимлиду — что Safari не
      проверен и почему.
    - Дать цифры риска, если есть аналитика: доля пользователей iPhone и
      Safari.
    - Предложить варианты: телефон коллеги, облачный сервис реальных
      устройств, быстрая проверка сразу после релиза.
    - В отчёте — строка «Не проверено: Safari и iOS — нет устройства».

    Решение принимает команда, но с открытыми глазами.

- id: web16-18
  type: quiz
  question: "Мелкие расхождения с макетом на одном экране — 12 штук по 2–4 пикселя. Как оформить?"
  options:
    - "12 отдельных баг-репортов — так каждое легче отследить"
    - "Не оформлять: пиксели никого не волнуют"
    - "Один баг-репорт со списком расхождений и скриншотом наложения на макет"
    - "Написать дизайнеру в личные сообщения"
  correct: 2
  explanation: |
    Двенадцать мелких багов забивают трекер и отнимают у команды время на
    разбор. Один баг со списком, скриншотом и наложением макета чинится
    за один подход. Но если среди расхождений есть заметное — съехавшая
    кнопка, обрезанный текст — его лучше вынести отдельно.
