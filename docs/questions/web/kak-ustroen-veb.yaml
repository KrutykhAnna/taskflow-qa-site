# Вопросы темы «Как устроен веб». Формат — см. osnovy/bag-report.yaml.

- id: web1-01
  type: card
  question: Что такое фронтенд и бэкенд? Как они общаются?
  answer: |
    **Фронтенд** — то, что работает в браузере: HTML (скелет), CSS
    (внешний вид), JS (поведение). Сервер фронта только отдаёт эти файлы,
    выполняются они на компьютере пользователя.

    **Бэкенд** — API и база данных: правила, проверки, хранение.

    Общаются через HTTP-запросы: JS в браузере отправляет запрос в API
    и получает ответ, обычно в JSON. Это внутренняя синхронная
    интеграция.

- id: web1-02
  type: quiz
  question: За что на странице отвечает CSS?
  options:
    - "За то, что происходит при клике на кнопку"
    - "За загрузку данных из API"
    - "За внешний вид: цвета, шрифты, отступы, расположение"
    - "За структуру: какие на странице заголовки, поля и кнопки"
  correct: 2
  explanation: |
    HTML — скелет страницы, CSS — её внешний вид, JS — поведение:
    клики, проверка форм, запросы в API.

- id: web1-03
  type: quiz
  question: Где выполняется код фронтенда?
  options:
    - "В браузере пользователя"
    - "На сервере фронта, браузер получает готовую картинку"
    - "В API, рядом с бизнес-логикой"
    - "В базе данных"
  correct: 0
  explanation: |
    Сервер фронта только отдаёт файлы. HTML, CSS и JS выполняются
    в браузере. Поэтому результат зависит от браузера, размера окна,
    расширений и скорости интернета.

- id: web1-04
  type: card
  question: Что такое SPA? Что тестировщик проверяет в SPA дополнительно?
  answer: |
    **SPA** (single-page application) — приложение, которое загружается
    один раз. Дальше страница не перезагружается: JS сам перерисовывает
    экраны и подгружает из API только данные.

    Что проверить дополнительно:

    - при переходах меняется URL, и прямая ссылка открывает нужный экран;
    - F5 на любом экране возвращает тот же экран;
    - «Назад» работает внутри приложения;
    - Console — ошибка JS может сломать весь экран.

- id: web1-05
  type: quiz
  question: "Нажимаешь «Сохранить» — ничего не происходит. В Network (Fetch/XHR) нет ни одного нового запроса. Где, скорее всего, баг?"
  options:
    - "В базе данных: данные не записались"
    - "На бэке: API не принял запрос"
    - "В сети: запрос потерялся по дороге"
    - "На фронте: запрос не ушёл"
  correct: 3
  explanation: |
    Если запроса нет вовсе — до бэка дело не дошло, фронт его просто
    не отправил. Стоит заглянуть в Console: там часто видна ошибка JS.
    Но сначала проверь, что в Network стоит нужный фильтр.

- id: web1-06
  type: quiz
  question: "API ответил 200 и вернул новое название задачи. На экране осталось старое, после F5 — новое. Где баг?"
  options:
    - "На бэке: он должен был вернуть другой код"
    - "На фронте: экран не обновился"
    - "В базе: название сохранилось не сразу"
    - "Это не баг: так работает кэш браузера"
  correct: 1
  explanation: |
    Ответ API правильный, после F5 данные на месте — значит, бэк сохранил
    и вернул верно. Не отработал фронт: не перерисовал экран.

- id: web1-07
  type: card
  question: Как по шагам понять, баг на фронте или на бэке?
  answer: |
    1. DevTools (F12) → Network → фильтр Fetch/XHR.
    2. Повторить действие.
    3. Найти запрос: адрес, метод, код ответа.
    4. Payload — что отправил фронт, Response — что ответил API.

    Правило:

    - запроса нет — фронт;
    - фронт отправил не то — фронт;
    - API ответил неверно — бэк;
    - API ответил верно, на экране не то — фронт.

- id: web1-08
  type: quiz
  question: "На экране написано «Ошибка сервера». В Network ответ API — 200 с правильными данными. Где баг?"
  options:
    - "На бэке: раз на экране ошибка сервера, значит, ошибся сервер"
    - "Нигде: ответ 200, значит, всё в порядке"
    - "На фронте: API ответил верно, а экран показал ошибку"
    - "В сети: ответ пришёл, но с опозданием"
  correct: 2
  explanation: |
    Текст на экране пишет фронт. Если ответ API верный, а фронт показал
    ошибку — баг на фронте, какой бы текст он ни написал.

- id: web1-09
  type: quiz
  question: "Кнопка «Зарегистрироваться» неактивна, пока email пустой. Достаточно ли этого, чтобы считать обязательность email проверенной?"
  options:
    - "Да, если кнопка неактивна, пользователь не сможет отправить форму"
    - "Да, если ещё проверить в других браузерах"
    - "Нет, нужно ещё проверить, что поле подсвечивается красным"
    - "Нет, нужно отправить запрос без email прямо в API"
  correct: 3
  explanation: |
    Проверка на фронте — для удобства. Запрос можно отправить в обход
    интерфейса, например через Postman. Защищать данные должен бэк,
    поэтому обязательность проверяют и через API.

- id: web1-10
  type: card
  question: Что такое soft 404 и как его заметить?
  answer: |
    **Soft 404** — несуществующая страница, которая выглядит как «Не
    найдено», но приходит с кодом `200`. Человек видит ошибку, а поисковик
    считает страницу настоящей.

    Часто бывает в SPA: сервер на любой адрес отдаёт одно приложение,
    а «Не найдено» рисует JS.

    Как заметить: открыть несуществующий адрес, DevTools → Network →
    первый запрос (тип `document`) → колонка Status.

- id: web1-11
  type: quiz
  question: Что тестировщик может проверить по SEO за минуту?
  options:
    - "Позицию сайта в поиске по главным запросам"
    - "Title, meta description и код 404 у несуществующей страницы"
    - "Сколько посетителей пришло на сайт из Google и Яндекса за последний месяц"
    - "Что у сайта больше всего ссылок с других сайтов"
  correct: 1
  explanation: |
    Позиции, трафик и ссылки — работа SEO-специалиста. Тестировщик
    быстро проверяет то, что видно на самой странице: title на вкладке,
    meta description в коде (Ctrl + U), код ответа несуществующей
    страницы в Network.

- id: web1-12
  type: quiz
  question: "Пользователь видит в списке чужой проект. В ответе API этот проект есть. Почему это не исправить, просто спрятав проект на фронте?"
  options:
    - "Ответ API всё равно виден в Network и доступен через Postman"
    - "Фронт не умеет скрывать строки в таблице"
    - "Спрятанный проект замедлит загрузку страницы"
    - "Это исправит баг, но в таблице останется заметная пустая строка"
  correct: 0
  explanation: |
    Данные уже ушли пользователю — их видно в Network или можно получить
    запросом напрямую. Доступ к данным ограничивает бэк: чужой проект
    не должен попадать в ответ.
