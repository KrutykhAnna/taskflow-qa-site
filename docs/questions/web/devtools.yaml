# Вопросы темы «DevTools». Формат — см. osnovy/bag-report.yaml.

- id: web2-01
  type: card
  question: Что такое DevTools и как их открыть?
  answer: |
    **DevTools** — инструменты разработчика, встроенные в браузер. Они
    показывают, что внутри страницы: HTML и стили, ошибки JS, запросы
    к серверу, данные, сохранённые в браузере.

    Как открыть: **F12** или **Ctrl + Shift + I** (на Mac —
    **Cmd + Option + I**), или правый клик на элементе → «Просмотреть код».

- id: web2-02
  type: card
  question: Какие вкладки DevTools главные для тестировщика и на какой вопрос отвечает каждая?
  answer: |
    - **Elements** — как это выглядит и из чего собрано: HTML, CSS,
      скрытые элементы, реальный шрифт и цвет.
    - **Console** — что сломалось в JS: ошибки и предупреждения.
    - **Network** — что ушло на сервер и что пришло: запросы, коды,
      Payload, Response, время.
    - **Application** — что сохранено в браузере: Local Storage,
      Session Storage, Cookies.

- id: web2-03
  type: quiz
  question: "Ты поменял текст кнопки в Elements и нажал F5. Что произойдёт?"
  options:
    - "Текст сохранится, но только у тебя в браузере"
    - "Текст сохранится на сервере и его увидят все пользователи"
    - "Текст вернётся к прежнему: изменения в Elements живут до перезагрузки"
    - "Страница сломается, потому что код изменён"
  correct: 2
  explanation: |
    Elements меняет только копию страницы у тебя в браузере и только до
    перезагрузки. На сервер ничего не уходит. Это удобно для скриншота
    «как должно быть», но такие изменения — не баг.

- id: web2-04
  type: quiz
  question: Где посмотреть, какой размер шрифта реально применился к элементу?
  options:
    - "Во вкладке Computed в Elements"
    - "В Console, в списке предупреждений"
    - "В Network, в ответе запроса CSS"
    - "В Application, в Local Storage"
  correct: 0
  explanation: |
    Во вкладке Styles правил много, и они перебивают друг друга.
    **Computed** показывает итог: какой шрифт, размер, цвет и отступы
    у элемента на самом деле.

- id: web2-05
  type: card
  question: Как проверить стиль кнопки при наведении мыши, если при переходе в DevTools наведение пропадает?
  answer: |
    Включить состояние принудительно: выбрать кнопку в Elements →
    в панели Styles нажать **`:hov`** → поставить галочку **`:hover`**.
    Кнопка «застынет» в этом состоянии. Так же работают `:focus`
    и `:active`. Ещё вариант — правый клик по элементу → Force state.

- id: web2-06
  type: quiz
  question: "Кнопки «Удалить» нет на экране, но в Elements она есть со стилем display: none. Что это значит?"
  options:
    - "Кнопки нет, удалять пользователь не может — проверка пройдена"
    - "Кнопку спрятали стилем; нужно проверить, запрещает ли удаление API"
    - "Это ошибка DevTools: в дереве показываются удалённые элементы"
    - "Кнопка появится после перезагрузки страницы"
  correct: 1
  explanation: |
    `display: none` только прячет элемент. Спрятанная кнопка — не защита:
    запрос удаления можно отправить напрямую, например из Postman.
    Права обязан проверять бэк — отправь запрос и убедись, что API
    отвечает `403`.

- id: web2-07
  type: quiz
  question: "В Console красная ошибка, в её адресе chrome-extension://… Что делать первым делом?"
  options:
    - "Сразу завести баг на фронтенд с высоким приоритетом"
    - "Завести баг на бэкенд: ошибка пришла с сервера"
    - "Ничего, красные ошибки в Console никогда не важны"
    - "Повторить в режиме инкогнито — скорее всего, это расширение браузера"
  correct: 3
  explanation: |
    `chrome-extension://` — признак ошибки из расширения: блокировщика,
    переводчика, менеджера паролей. В инкогнито расширения обычно
    выключены. Ошибка пропала — к сайту она не относится. Но если сайт
    из-за расширения ломается — это уже баг сайта.

- id: web2-08
  type: card
  question: Что приложить к баг-репорту, если при действии в Console появилась ошибка?
  answer: |
    Текст ошибки **целиком и текстом** — не только скриншотом: разработчик
    будет искать по нему. В тексте обычно есть файл и строка, где
    сломалось.

    Плюс: на каком действии появилась, адрес страницы, браузер и версия,
    запрос и ответ из Network, если он связан с ошибкой.

- id: web2-09
  type: card
  question: Что такое Preserve log и когда он нужен?
  answer: |
    Галочка в Network (и в настройках Console), которая **не очищает
    список при переходе на другую страницу**.

    Нужна, когда действие заканчивается перезагрузкой или редиректом:
    вход, оплата, отправка формы. Без неё запросы с прошлой страницы
    исчезают, и кажется, что «запрос не отправлялся».

- id: web2-10
  type: quiz
  question: "Открыл Network после того, как нажал «Сохранить». Запроса в списке нет. Какой вывод верный?"
  options:
    - "Фронт не отправил запрос — баг фронта"
    - "Пока никакой: Network записывает только при открытых DevTools — нужно повторить"
    - "Сервер не ответил — баг бэка"
    - "Запрос ушёл, но его спрятал кэш браузера"
  correct: 1
  explanation: |
    Network не записывает то, что было до открытия DevTools. Открой
    DevTools, проверь фильтр (Fetch/XHR) и Preserve log, повтори действие.
    Только после этого можно говорить, что запроса нет.

- id: web2-11
  type: card
  question: Что смотреть во вкладках Headers, Payload и Response у запроса в Network?
  answer: |
    - **Headers** — адрес, метод, код ответа, заголовки. Например, есть ли
      `Authorization` с токеном.
    - **Payload** — что фронт отправил: тело запроса и параметры адреса.
      Совпадает ли с тем, что ввёл пользователь?
    - **Response** (или Preview) — что API ответил. Совпадает ли со
      спецификацией и с тем, что на экране?

- id: web2-12
  type: quiz
  question: "В Network у запроса статус (canceled). Что это чаще всего значит?"
  options:
    - "Браузер сам отменил запрос — например, пользователь ушёл со страницы или фронт отправил новый"
    - "Сервер отказал в доступе"
    - "Сервер упал с ошибкой 500"
    - "Запрос выполнился, но ответ пустой"
  correct: 0
  explanation: |
    `(canceled)` ставит браузер, а не сервер: запрос больше не нужен.
    Обычно это не баг. Подозрительно, если отменяется нужный запрос
    и из-за этого данные не сохраняются или не показываются.

- id: web2-13
  type: card
  question: Как перенести запрос из браузера в Postman?
  answer: |
    Network → правый клик по запросу → **Copy → Copy as cURL** (на Windows
    для Postman — вариант bash). В Postman: **Import** → вставить текст.

    Запрос придёт со всеми заголовками и токеном. Дальше можно менять
    поля, id, токен и проверять API в обход интерфейса.

- id: web2-14
  type: quiz
  question: "Разработчик просит HAR, чтобы разобрать баг. Что важно помнить?"
  options:
    - "HAR содержит только адреса и коды ответа, его можно отправлять кому угодно"
    - "HAR можно записать, только если включён Device Mode"
    - "В HAR попадают тела запросов и ответов: пароли, токены, личные данные"
    - "HAR открывается только в браузере, в котором его записали"
  correct: 2
  explanation: |
    HAR — все запросы и ответы со вкладки Network. Новые версии Chrome
    при обычном экспорте вырезают часть чувствительных заголовков, но
    тела запросов и ответов остаются: пароль из формы входа, токен
    в ответе на вход. Записывай на тестовом пользователе и отправляй
    лично разработчику, не в общий чат.

- id: web2-15
  type: card
  question: Чем отличаются Local Storage, Session Storage и Cookies?
  answer: |
    - **Local Storage** — хранится, пока не удалят; переживает закрытие
      браузера. Токены, настройки, корзина.
    - **Session Storage** — живёт до закрытия вкладки; в новой вкладке
      пусто. Временные данные: шаг формы, фильтры.
    - **Cookies** — хранятся до срока истечения и **сами отправляются на
      сервер** с каждым запросом к этому сайту. Сессия, язык, согласие
      с cookie.

    Всё видно и редактируется в DevTools → Application → Storage.

- id: web2-16
  type: quiz
  question: "У тебя страница сломана, у коллеги на том же стенде — нет. После Clear site data у тебя всё заработало. Что верно?"
  options:
    - "Это не баг: проблема была только в твоём браузере"
    - "Это баг бэка: сервер отдавал разные данные"
    - "Это не баг: пользователи всегда могут почистить кэш"
    - "Это может быть баг: у пользователей после релиза тоже останутся старые данные в браузере"
  correct: 3
  explanation: |
    Старые данные в браузере — не «проблема тестировщика». После релиза
    у настоящих пользователей тоже будут сохранены данные от прошлой
    версии. Нужно выяснить, какие именно данные ломают страницу,
    и завести баг с их значением.

- id: web2-17
  type: quiz
  question: "Ты подменил ответ API через Local Overrides: у проекта название из 300 символов, вёрстка поехала. API принимает название не длиннее 100 символов. Это баг?"
  options:
    - "Да, вёрстка должна выдерживать любые данные"
    - "Нет: такого ответа API вернуть не может; проверять вёрстку нужно на 100 символах"
    - "Да, баг бэка: он должен был запретить подмену ответа"
    - "Нет, Local Overrides всегда ломают вёрстку"
  correct: 1
  explanation: |
    Подмена — инструмент исследования. Проблема на данных, которых
    в реальности не бывает, — не баг. Подменяй на то, что API действительно
    может вернуть: максимальную длину, пустой список, `null` в
    необязательном поле.

- id: web2-18
  type: quiz
  question: "Тестировщик проверил вёрстку в Device Mode на «iPhone» — всё хорошо. Можно считать, что на iPhone сайт проверен?"
  options:
    - "Да, Device Mode полностью повторяет iPhone"
    - "Да, если ещё проверить в горизонтальной ориентации"
    - "Нет: это Chrome с размером экрана iPhone, а не Safari на настоящем телефоне"
    - "Нет: Device Mode работает только для Android"
  correct: 2
  explanation: |
    Device Mode меняет размер окна и имитирует касания, но браузер
    остаётся Chrome на компьютере. Шрифты, поведение Safari, клавиатура,
    вырез экрана — другие. Это быстрый первый взгляд, а не замена
    проверки на устройстве.

- id: web2-19
  type: card
  question: Что ты делаешь в DevTools при любом баге в вебе — по шагам?
  answer: |
    1. Открываю DevTools **до** воспроизведения.
    2. Очищаю Console; в Network — Fetch/XHR, Preserve log, очистить.
    3. Воспроизвожу, смотрю на Console и Network.
    4. Решаю, где баг: нет запроса — фронт; ответ неверный — бэк;
       ответ верный, а экран не тот — фронт.
    5. Исключаю себя: инкогнито (расширения), Clear site data (старые
       данные).
    6. Прикладываю текст ошибки, запрос и ответ, при необходимости
       cURL или HAR без секретов, браузер и версию.

- id: web2-20
  type: quiz
  question: "В Network запрос шёл 12 секунд. В Timing почти всё время — Waiting for server response. Где искать причину?"
  options:
    - "На сервере: он долго готовил ответ"
    - "На фронте: браузер долго рисовал страницу"
    - "В размере ответа: он слишком большой"
    - "В интернете пользователя: медленная загрузка"
  correct: 0
  explanation: |
    Waiting for server response — время, пока сервер думал над ответом.
    Если бы ответ был огромным или сеть медленной, большую часть заняла
    бы загрузка ответа (Content Download). Вопрос — к бэкенду.
