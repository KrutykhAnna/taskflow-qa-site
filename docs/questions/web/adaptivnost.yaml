# Вопросы темы «Адаптивность». Формат — см. osnovy/bag-report.yaml.

- id: web11-01
  type: card
  question: Что такое адаптивность сайта и зачем её проверять?
  answer: |
    Адаптивность — когда сайтом удобно пользоваться на экране любой
    ширины: от телефона до большого монитора. Ничего не вылезает за край,
    ничего не обрезано, все кнопки можно нажать пальцем.

    Зачем: часто половина пользователей и больше приходит с телефона.
    Разработчик и дизайнер обычно смотрят на широком мониторе, поэтому
    узкие ширины чаще всего проверяет тестировщик. Баг на узком экране —
    например, кнопка оплаты за краем — бьёт по большой части людей.

- id: web11-02
  type: card
  question: Что такое брейкпоинт?
  answer: |
    Брейкпоинт (breakpoint — «точка перелома») — ширина экрана, на которой
    раскладка страницы перестраивается. Например, до 767 px меню спрятано
    под кнопку-бургер, а с 768 px показано в строку — значит, брейкпоинт
    768.

    В коде брейкпоинты — это правила `@media`: `max-width: 767px` —
    «767 и меньше», `min-width: 768px` — «768 и больше». Между
    брейкпоинтами раскладка та же, только тянется или сжимается.

- id: web11-03
  type: card
  question: Чем адаптивный сайт отличается от отдельной мобильной версии?
  answer: |
    - **Адаптивный сайт** — один сайт и один адрес. Раскладка меняется
      от ширины экрана.
    - **Отдельная мобильная версия** — другой сайт для телефонов, часто
      на адресе вида `m.site.ru`. Сервер определяет устройство и
      отправляет на нужную версию.

    Для тестировщика мобильная версия — это второй сайт со своими багами
    плюс переадресация: ссылка с телефона на компьютере должна открыть
    ту же страницу, а не главную.

- id: web11-04
  type: card
  question: Откуда брать ширины для проверки адаптивности?
  answer: |
    - **Из макета и требований** — на каких ширинах нарисованы экраны
      (часто 360, 768, 1280, 1440), есть ли минимальная поддерживаемая
      ширина.
    - **Из CSS сайта** — брейкпоинты: поиск `@media` по всем файлам в
      DevTools (Ctrl + Shift + F, на Mac Cmd + Option + F), Styles у
      элемента, Show media queries в Device Mode.
    - **Из аналитики** — какие экраны самые частые у ваших
      пользователей.

    И к каждому брейкпоинту — ±1 px и пара ширин «между».

- id: web11-05
  type: quiz
  question: "Брейкпоинт сайта — 768: до 767 бургер, с 768 меню в строку. Какой набор проверок по ширине самый полезный?"
  options:
    - "Только 768 — это и есть брейкпоинт"
    - "767, 768, 769 и пара ширин между брейкпоинтами, например 1024"
    - "Только ширины из макета — 375 и 1440"
    - "Все ширины от 320 до 1920 по одному пикселю"
  correct: 1
  explanation: |
    Ошибки живут на границах — как в тест-дизайне. 767 и 768 — по разные
    стороны границы. 769 — на случай, если в одном месте написано
    `max-width: 768px`, а в другом `min-width: 768px`: на 768 срабатывают
    оба правила. Ширины «между» — там раскладка та же, но места меньше
    или больше. Перебирать все ширины по пикселю — долго и не нужно.

- id: web11-06
  type: quiz
  question: "В CSS: бургер при max-width: 1023px, меню в строку при min-width: 1025px. Что увидит пользователь на ширине ровно 1024 px?"
  options:
    - "Бургер"
    - "Меню в строку"
    - "Ни бургера, ни меню: на 1024 не срабатывает ни одно правило"
    - "И бургер, и меню одновременно"
  correct: 2
  explanation: |
    `max-width: 1023px` — это «1023 и меньше», `min-width: 1025px` —
    «1025 и больше». Ровно 1024 не попадает ни туда, ни туда — дыра в
    1 px. А 1024 — ширина популярных планшетов в горизонтальном
    положении. Поэтому каждый брейкпоинт проверяют ±1 px.

- id: web11-07
  type: card
  question: Что такое CSS-пиксели и DPR?
  answer: |
    Ширина в DevTools и в `@media` — в **CSS-пикселях**, а не в точках
    экрана. У iPhone экран физически больше тысячи точек в ширину, а
    сайт «видит» около 390 px.

    **DPR** (device pixel ratio) — сколько точек экрана приходится на
    один CSS-пиксель: 1, 2, 3. Для тестировщика: ширину для проверки
    берут в CSS-пикселях, а DPR важен для картинок — на экране с DPR 3
    картинка для DPR 1 выглядит размытой.

- id: web11-08
  type: quiz
  question: "Новая страница на телефоне выглядит как уменьшенная версия для компьютера: всё мелкое, приходится увеличивать пальцами. На остальных страницах всё нормально. Что проверить первым?"
  options:
    - "Скорость интернета на телефоне"
    - "Есть ли в <head> строка <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">"
    - "Версию Chrome на компьютере"
    - "Ничего: так выглядят все сайты на телефоне"
  correct: 1
  explanation: |
    Без строки `viewport` телефон рисует страницу как на широком экране
    и уменьшает её. Медиазапросы для узкой ширины при этом не
    срабатывают. Это частый баг именно на новых страницах: строку
    забыли добавить в шаблон. Проверяется в Elements за секунду.

- id: web11-09
  type: card
  question: Что входит в чек-лист адаптивности?
  answer: |
    - нет горизонтальной прокрутки **страницы**;
    - текст не обрезан и не наезжает, картинки не растянуты;
    - длинные слова, email, ссылки не растягивают блоки;
    - меню превращается в бургер, открывается и закрывается, в нём все
      пункты;
    - таблицы — прокрутка внутри или карточки;
    - модальные окна помещаются, прокручиваются, закрываются пальцем;
    - кнопки под палец — ориентир 44–48 px;
    - поля и экранная клавиатура: кнопка не прячется под ней;
    - увеличение страницы на iPhone при нажатии на поле;
    - поворот экрана, липкая шапка не съедает полэкрана;
    - масштаб браузера 200%.

- id: web11-10
  type: quiz
  question: "На телефоне таблицу операций можно прокрутить вбок. Шапка сайта и остальная страница при этом стоят на месте. Это баг?"
  options:
    - "Да: любая горизонтальная прокрутка на телефоне — баг"
    - "Не обязательно: прокрутка внутри таблицы — одно из нормальных решений. Сверить с макетом; баг — если вбок едет вся страница или колонки обрезаны без прокрутки"
    - "Да, критичный: таблицы на телефоне запрещены"
    - "Нет, и сверять ничего не нужно"
  correct: 1
  explanation: |
    Для широких таблиц на узком экране есть два нормальных решения:
    прокрутка внутри таблицы или карточки вместо строк. Как задумано —
    видно в макете. Баг — когда шире экрана становится **вся страница**
    (проверка: `document.documentElement.scrollWidth` больше ширины окна)
    или когда правые колонки обрезаны и их не увидеть.

- id: web11-11
  type: card
  question: Как работать с Device Mode при проверке адаптивности?
  answer: |
    1. Выбрать устройство в списке Dimensions — или **Responsive** и
       вписать ширину вручную.
    2. Добавить свои устройства с ширинами из макета: Edit… → Add custom
       device.
    3. Включить DPR (меню ⋮ → Add device pixel ratio), повернуть экран.
    4. Показать брейкпоинты: меню ⋮ → **Show media queries**, клик по
       полоске выставляет эту ширину.
    5. При необходимости — медленная сеть в Throttling.
    6. Скриншот — с видимой шириной в полях сверху.

    Масштаб панели Device Mode (Zoom) не меняет ширину для сайта.

- id: web11-12
  type: quiz
  question: "Тестировщик проверил форму оплаты в Device Mode на iPhone 14 — всё хорошо. Пользователи iPhone пишут, что кнопка «Оплатить» пропадает при вводе комментария. Почему Device Mode мог это не показать?"
  options:
    - "Device Mode показывает всё точно так же, как iPhone, — значит, пользователи ошибаются"
    - "В Device Mode нет экранной клавиатуры и движка Safari — кнопку закрывает клавиатура, а эмуляция этого не видит"
    - "Нужно было выбрать iPhone 15"
    - "Device Mode не умеет показывать кнопки"
  correct: 1
  explanation: |
    Device Mode меняет ширину и сообщает сайту, что это телефон, но
    браузер остаётся Chrome на компьютере. Нет экранной клавиатуры, нет
    Safari с его высотой экрана и адресной строкой, нет увеличения
    страницы при нажатии на поле. Такие баги ищут на реальном телефоне —
    своём, у коллег или в облаке.

- id: web11-13
  type: card
  question: Чего не покажет Device Mode в Chrome?
  answer: |
    - **Safari на iPhone** — другой движок; на iPhone все браузеры на
      нём;
    - **экранную клавиатуру** — что она закрывает;
    - **увеличение страницы** на iPhone при нажатии на поле со шрифтом
      меньше 16 px;
    - **настоящий тач** — жесты, случайные касания, «толстый палец»;
    - **реальную скорость** — компьютер мощнее телефона;
    - **высоту экрана**, которая меняется, когда прячется адресная
      строка.

    Поэтому Device Mode — для всех ширин, реальный телефон — для
    ключевых сценариев.

- id: web11-14
  type: quiz
  question: "Стенд запущен у тебя на компьютере. На телефоне в той же Wi‑Fi сети ты открываешь http://localhost:3000. Что произойдёт?"
  options:
    - "Откроется стенд с компьютера"
    - "Не откроется: для телефона localhost — это сам телефон. Нужно открыть http://<IP компьютера>:3000"
    - "Откроется, если на телефоне Chrome"
    - "Откроется, но медленно"
  correct: 1
  explanation: |
    `localhost` — всегда «это же устройство». На телефоне это телефон.
    Нужен IP компьютера в локальной сети (`192.168.x.x` и т. п.). Ещё
    нужно, чтобы стенд слушал не только `localhost`, а брандмауэр
    пропускал порт. И та же ловушка внутри страницы: если фронт ходит к
    API по `localhost`, страница откроется, а запросы к API — нет.

- id: web11-15
  type: card
  question: Как посмотреть Console и Network страницы, открытой на телефоне?
  answer: |
    Через удалённую отладку:

    - **Android + Chrome**: на телефоне включить режим разработчика и
      отладку по USB, подключить кабелем, на компьютере открыть
      `chrome://inspect` → Devices → inspect у нужной вкладки. Там же —
      Port forwarding, чтобы `localhost` на телефоне вёл на компьютер.
    - **iPhone + Mac**: на iPhone «Настройки» → Safari → «Дополнения» →
      Веб-инспектор; подключить к Mac; в Safari на Mac меню «Разработка»
      → iPhone → страница.

    С Windows Safari на iPhone так не отладить — тогда облачные
    устройства.

- id: web11-16
  type: quiz
  question: "Макеты нарисованы только для компьютера, в требованиях про телефоны ничего нет. На ширине 375 шапка не помещается. Что правильнее сделать?"
  options:
    - "Завести критичный баг «шапка должна быть бургером»"
    - "Ничего: раз макета нет, проверять не нужно"
    - "Задать вопрос аналитику и дизайнеру: поддерживаем ли телефоны, с какой ширины и как должно выглядеть; приложить скриншоты находок"
    - "Самому решить, как должно быть, и описать это в баге"
  correct: 2
  explanation: |
    Без требований нельзя сказать, баг это или договорённость: может,
    сайт поддерживается только от 1280. Это белое пятно в требованиях —
    вопрос аналитику и дизайнеру, со скриншотами. Решать за дизайнера,
    как должна выглядеть шапка, — не задача тестировщика. Но и молчать
    нельзя: находку нужно показать.

- id: web11-17
  type: card
  question: Как работать с адаптивностью на задаче — по шагам?
  answer: |
    1. Собрать ширины: макет, брейкпоинты из CSS, аналитика.
    2. Пройти ключевые экраны на 3–4 ширинах, начиная с самой узкой, по
       чек-листу.
    3. Проверить брейкпоинты ±1 px и ширины «между».
    4. Повернуть телефон и планшет.
    5. Один прогон ключевых сценариев на реальном телефоне.
    6. Решить, баг ли это: можно ли сделать дело; нет требований —
       вопрос дизайнеру или аналитику.
    7. Баг-репорт с шириной, устройством, ориентацией и скриншотом.

- id: web11-18
  type: card
  question: Что обязательно указать в баг-репорте о баге адаптивности?
  answer: |
    - **ширину** в CSS-пикселях: «390 px», а не «на телефоне»;
    - на реальном устройстве — **модель, систему, браузер**: «iPhone 13,
      iOS 18.1, Safari»;
    - **ориентацию** — вертикально или горизонтально;
    - **DPR**, если баг про картинки;
    - **диапазон**: где воспроизводится и где нет — «375–767 px; от 768
      нет»;
    - **скриншот с видимой шириной**;
    - **чем проверено**: Device Mode, реальный телефон, облако.

    В заголовке — ширина: «[375 px] Корзина: кнопка уходит за край».

- id: web11-19
  type: quiz
  question: "На компьютере пользователь включил масштаб браузера 200%. Окно — 1280 px. Как это выглядит для сайта?"
  options:
    - "Ничего не меняется: ширина та же, 1280"
    - "Ширина для сайта — около 640 px: должны сработать брейкпоинты для узкого экрана, а не обрезка страницы"
    - "Ширина для сайта — 2560 px"
    - "Сайт переключается на мобильную версию m.site"
  correct: 1
  explanation: |
    При масштабе 200% каждый CSS-пиксель становится в два раза больше,
    и в окно помещается вдвое меньше: 1280 / 2 = 640. Сайт должен
    перестроиться, как на узком экране. Многие так живут постоянно —
    это требование доступности. И обратная ловушка для тестировщика:
    проверяя ширину, держи масштаб 100%, иначе смотришь не на ту ширину.
