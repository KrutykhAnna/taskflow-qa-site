# Вопросы темы «Установка, обновление и удаление приложения». Формат — см. osnovy/bag-report.yaml.

- id: mob11-01
  type: card
  question: Зачем отдельно тестировать обновление мобильного приложения, если новая версия уже проверена на чистой установке?
  answer: |
    Почти все пользователи получают новую версию **поверх старой** —
    со своими данными: вход, настройки, черновики, офлайн-данные.

    Чистая установка этого не проверяет. После обновления может:
    - разлогинить всех;
    - пропасть то, что пользователь сделал сам;
    - упасть приложение при первом запуске — миграция базы;
    - не поставиться обновление из-за другой подписи.

    Откатить мобильный релиз нельзя — только выпустить новый.

- id: mob11-02
  type: card
  question: Чем versionName отличается от versionCode? Как это называется на iOS?
  answer: |
    - **versionName** — версия для людей, строка: `2.3.0`.
    - **versionCode** — целое число для системы и магазина, только растёт: `27`.

    Android решает «новее или старее» по **versionCode**.

    На iOS: **CFBundleShortVersionString** — версия для людей,
    **CFBundleVersion** — номер сборки.

    В баг-репорт пишут оба: `2.3.0 (27)`.

- id: mob11-03
  type: quiz
  question: Что произойдёт при `adb install -r` сборки с меньшим versionCode, чем у установленной?
  options:
    - "Поставится старая версия, данные сохранятся"
    - "Ошибка INSTALL_FAILED_VERSION_DOWNGRADE"
    - "Приложение удалится и поставится заново"
    - "Поставится, но данные очистятся"
  correct: 1
  explanation: |
    Понижение версии — **даунгрейд** — система не пропускает:
    `INSTALL_FAILED_VERSION_DOWNGRADE`. Это защита от отката на
    версию с известной уязвимостью. Флаг `-d` разрешает даунгрейд
    только отладочным сборкам. Для обычного приложения путь один —
    удалить и поставить старую, потеряв данные.

- id: mob11-04
  type: card
  question: Что такое миграция локальных данных и что бывает, если её сделали плохо?
  answer: |
    У базы на телефоне есть **версия схемы**. Новая версия приложения
    переделывает таблицы, а **миграция** переносит старые данные
    в новое устройство таблиц.

    Если плохо:
    - **миграцию забыли** — падение при первом запуске
      (в Room — `IllegalStateException`);
    - **режим «стереть и создать заново»** — не падает, но данные удалены;
    - **ошибка в миграции** — данные перенесены не все или не туда.

- id: mob11-05
  type: quiz
  question: "Хитрый вопрос: обновление 3.6 → 3.7 проверили с данными — всё отлично. У 6% пользователей стоит 3.3. Что ещё обязательно проверить?"
  options:
    - "Ничего — с прошлой версии проверили, этого достаточно"
    - "Обновление 3.3 → 3.7: у них пройдут все миграции подряд, в том числе давно забытые"
    - "Только чистую установку 3.3"
    - "Обновление 3.7 → 3.3"
  correct: 1
  explanation: |
    Тот, кто пропускает версии, проходит **все** миграции подряд.
    Старые миграции давно никто не запускал — там и прячутся баги.
    Поэтому в матрице обновлений всегда есть строка «с минимальной
    поддерживаемой версии».

- id: mob11-06
  type: card
  question: Как проверить, что данные пережили обновление на Android? Какие инструменты помогут?
  answer: |
    1. В старой версии создать данные и записать их.
    2. Обновить поверх: `adb install -r новая.apk`.
    3. Проверить на экране и внутри:
       - **Database Inspector** (App Inspection в Android Studio) —
         таблицы и число строк до и после, новые колонки заполнены;
       - **Device Explorer** — файлы в `/data/data/<пакет>/`:
         `databases`, `shared_prefs`;
       - **Logcat** первого запуска — падение миграции.

    Внутрь папки приложения можно заглянуть только у отладочной сборки.

- id: mob11-07
  type: quiz
  question: "Хитрый вопрос: проверили обновление — поставили старую версию и сразу поверх новую. Приложение открылось. Что не так?"
  options:
    - "Всё правильно, обновление проверено"
    - "Нужно было обновлять через магазин"
    - "Обновляли пустое приложение: ломаются накопленные данные, их не было"
    - "Нужно было удалить старую версию перед установкой"
  correct: 2
  explanation: |
    Пустое приложение почти всегда переживает обновление. Сначала
    надо «пожить» в старой версии: войти, создать данные, поменять
    настройки, сделать что-то без сети — и только потом обновлять.

- id: mob11-08
  type: card
  question: Что такое обратная совместимость API и почему в мобильном она важнее, чем в вебе?
  answer: |
    **Обратная совместимость** — новый сервер правильно работает
    со **старыми** версиями приложения.

    Сайт обновился — у всех новая версия. Приложение — нет: у людей
    одновременно живут версии за год и больше. Сервер меняют сразу
    для всех — и старые версии получают ответ, которого не ждут.

    Безопаснее всего — **добавить** новое поле. Удалить, переименовать,
    сделать обязательным, поменять формат — риск для старых версий.

- id: mob11-09
  type: quiz
  question: "Хитрый вопрос: на сервере в статусы заказа добавили новое значение. Ничего не удаляли. Что может случиться со старыми версиями приложения?"
  options:
    - "Ничего — добавление всегда безопасно"
    - "Старая версия может упасть на незнакомом значении — у тех, у кого есть такой заказ"
    - "Старая версия автоматически обновится"
    - "Сервер не даст старой версии войти"
  correct: 1
  explanation: |
    Старый код знает фиксированный список значений (enum).
    Незнакомое — ошибка разбора ответа и падение. Коварно то, что
    сломаются только люди с таким заказом. Безопасно добавить новое
    **поле**, а новое **значение** в старом списке — риск.

- id: mob11-10
  type: card
  question: Как тестировать старые версии приложения против нового API?
  answer: |
    - **Архив сборок** — текущая, предыдущая, минимальная поддерживаемая.
    - **Матрица версий** — какие версии прогоняем против нового сервера.
    - **Прогон старой версии против нового стенда** — вход, главные
      экраны, экраны с изменениями.
    - **Подмена ответа** — сервер не готов: Charles или Proxyman,
      Map Local, подсунуть старой сборке «новый» ответ.
    - **Список изменений API** — пройтись по типам: удалили,
      переименовали, обязательное, новое значение, формат.

- id: mob11-11
  type: card
  question: Чем мягкое обновление отличается от принудительного? Как приложение узнаёт, что пора обновиться?
  answer: |
    - **Мягкое** — «Доступна новая версия», можно отказаться.
    - **Принудительное** — экран-блокировка с кнопкой в магазин,
      без обновления не пускает.

    Обычно при запуске приложение спрашивает сервер: «минимальная —
    4.10, рекомендуемая — 4.12» и сравнивает со своим номером.

    На Android есть готовый механизм **Google Play In-App Updates**:
    режимы **flexible** (скачивается в фоне) и **immediate**
    (полноэкранно: обновись и перезапусти).

- id: mob11-12
  type: card
  question: Что проверить в принудительном обновлении?
  answer: |
    - Версия **ниже** минимальной — блокирующий экран, кнопка ведёт
      в магазин на страницу приложения.
    - Обойти нельзя: «Назад», свайп, сворачивание, пуш, дип-линк.
    - Версия **равна** минимальной — не блокирует (граница `<` и `<=`).
    - Сравнение по числам: `4.10.0` больше `4.9.10`.
    - Нет сети при проверке — не падает и не висит.
    - После обновления экран исчез — нет петли.
    - Требуемая версия уже доступна в магазине всем.

- id: mob11-13
  type: quiz
  question: "Хитрый вопрос: минимальная версия на сервере — 4.10.0. У пользователя 4.9.10 — а экран блокировки не появляется. Самая вероятная причина?"
  options:
    - "У пользователя нет интернета"
    - "Версии сравнивают как строки: «4.9.10» оказывается «больше» «4.10.0»"
    - "4.9.10 новее, чем 4.10.0"
    - "Принудительное обновление на Android не работает"
  correct: 1
  explanation: |
    При сравнении строк посимвольно «9» больше «1», и «4.9.10»
    оказывается «больше». Версии надо сравнивать по числам в каждой
    части. Поэтому в тест-кейсы берут «двузначные» версии.

- id: mob11-14
  type: card
  question: Чем обновление поверх отличается от переустановки и от очистки данных?
  answer: |
    - **Обновление поверх** (`adb install -r`, магазин, TestFlight) —
      данные **остаются**. Так проверяют миграцию.
    - **Очистка данных** (Android, `pm clear`) — данные удалены,
      приложение той же версии осталось. Быстро пройти первый запуск.
    - **Удалить и поставить** — данные и разрешения сброшены.
      Чистая установка, новый токен push.

    Баг миграции переустановкой не найти — данных уже нет.

- id: mob11-15
  type: quiz
  question: "Хитрый вопрос: на Android приложение удалили и поставили заново — а настройки вернулись. Что, скорее всего, произошло?"
  options:
    - "Android не удаляет данные приложения при удалении"
    - "Сработала автоматическая резервная копия Android: данные вернулись из Google Drive при установке"
    - "Приложение не удалилось"
    - "Это всегда баг приложения"
  correct: 1
  explanation: |
    Auto Backup (с Android 6.0) сохраняет данные приложения в Google
    Drive пользователя и **возвращает их при установке**. Включено
    по умолчанию (`allowBackup`). Настройки вернуть — нормально;
    вход и токены — повод уточнить у команды, что исключить из копии.

- id: mob11-16
  type: card
  question: Что остаётся после удаления приложения на iOS и Android?
  answer: |
    - **iOS** — данные приложения удаляются. Но записи в **связке
      ключей** (Keychain) исторически могли пережить удаление —
      приложение после переустановки «помнит» вход. Apple это
      не гарантирует.
    - **Android** — данные удаляются, но могут вернуться из
      автоматической резервной копии.
    - **Везде** остаются файлы в общих папках (фото, загрузки)
      и **аккаунт на сервере**: удалить приложение ≠ удалить аккаунт.

- id: mob11-17
  type: card
  question: Как обновление касается WebView-экранов и кросс-платформенных приложений?
  answer: |
    - **WebView** — содержимое приходит с сервера и обновляется **без**
      обновления приложения. «Половина новая, половина старая»: новая
      страница может ждать от старого приложения того, чего в нём нет.
      Ещё — старый кэш WebView после обновления.
    - **PWA и мобильный сайт** — обновляются сами при открытии.
    - **Кросс-платформенные** — бывают **OTA-обновления** («по воздуху»,
      например Expo Updates): JS-код меняется без магазина, номер
      сборки тот же. Спрашивай, как узнать версию кода.

- id: mob11-18
  type: quiz
  question: Что обязательно указать в баг-репорте о проблеме после обновления?
  options:
    - "Только новую версию приложения"
    - "С какой версии на какую (с номерами сборок), способ обновления, какие данные были, лог первого запуска"
    - "Только модель телефона"
    - "Скриншот экрана после обновления"
  correct: 1
  explanation: |
    Без версии «с какой» не понять, какие миграции прошли.
    Способ обновления важен: магазин, `adb install -r` и TestFlight
    ведут себя по-разному. Данные до обновления и лог первого запуска
    показывают, что и где сломалось.

- id: mob11-19
  type: quiz
  question: "Хитрый вопрос: новая сборка не ставится поверх старой: `INSTALL_FAILED_UPDATE_INCOMPATIBLE`. Версия выше. Что случилось?"
  options:
    - "На телефоне мало места"
    - "Сборки подписаны разными ключами — обновить можно только сборкой с той же подписью"
    - "Нужен флаг -d"
    - "Это нормально для любого обновления"
  correct: 1
  explanation: |
    Каждую сборку Android подписывают ключом. Обновление принимается
    только с **той же** подписью. С тестовыми сборками с разных
    компьютеров так бывает. Для релиза это блокер: пользователи не
    смогут обновиться, только удалить и поставить заново — с потерей
    данных.
