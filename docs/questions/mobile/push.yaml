# Вопросы темы «Push-уведомления». Формат — см. osnovy/bag-report.yaml.

- id: mob5-01
  type: card
  question: Что такое push-уведомление и как оно доходит до телефона?
  answer: |
    Сообщение от приложения, которое появляется на экране, даже когда
    приложение закрыто.

    Путь: приложение получает токен устройства → отдаёт его нашему
    бэкенду → случается событие → бэкенд собирает payload и отдаёт
    его почтальону (FCM у Google, APNs у Apple) → почтальон доставляет
    на телефон → ОС показывает уведомление → нажатие открывает нужный
    экран. Наш сервер не связывается с телефоном напрямую.

- id: mob5-02
  type: card
  question: Что такое токен устройства?
  answer: |
    «Адрес для писем»: строка, по которой FCM или APNs находят это
    приложение на этом телефоне. Не пароль и не номер пользователя.

    Связь «токен — пользователь» хранит бэкенд. Токен может смениться
    после переустановки, очистки данных, переноса на новый телефон —
    и приложение должно отправить новый токен на бэкенд.

    Токен — чувствительные данные: по нему можно отправить пуш на
    конкретный телефон. В баг-репорте пишут начало и конец.

- id: mob5-03
  type: card
  question: Что такое FCM и APNs?
  answer: |
    - **FCM** (Firebase Cloud Messaging) — сервис доставки пушей
      от Google: Android, а также iOS и браузер.
    - **APNs** (Apple Push Notification service) — сервис Apple,
      через него проходят все пуши на iPhone и iPad.

    Наш бэкенд отдаёт сообщение им, а они доставляют на устройство,
    когда получится.

- id: mob5-04
  type: quiz
  question: "Хитрый вопрос: бэкенд отправил пуш, FCM ответил «принято». Гарантирует ли это, что пользователь увидит уведомление?"
  options:
    - "Да, если FCM принял — уведомление точно покажется"
    - "Нет: телефон может быть без сети или в энергосбережении, уведомления или канал выключены, включено «Не беспокоить», оболочка «убила» приложение"
    - "Да, но только на iPhone"
    - "Нет, FCM никогда не доставляет пуши на Android"
  correct: 1
  explanation: |
    Доставка пуша не гарантирована и не мгновенна. После того как
    почтальон принял письмо, наш бэкенд уже ничего не контролирует.
    Дальше решают сеть, ОС, разрешения, каналы и режимы телефона.
    Поэтому «не пришло» — повод пройти цепочку, а не сразу баг.

- id: mob5-05
  type: card
  question: Чем отличаются обычный пуш, тихий пуш и локальное уведомление?
  answer: |
    - **Обычный** — видимое уведомление с текстом и звуком.
    - **Тихий** (silent, data) — без показа: будит приложение, чтобы
      обновить данные в фоне. Проверяют по результату и логам.
      Система не обязана его доставлять.
    - **Локальное** — создаёт само приложение без сервера: будильник,
      напоминание. Проверяют время, повторы, часовой пояс,
      перезагрузку телефона.

- id: mob5-06
  type: card
  question: Как пуш обрабатывается в разных состояниях приложения?
  answer: |
    - **На экране** — система баннер обычно не показывает, решает
      приложение: своя плашка, обновить данные или ничего.
    - **В фоне** — системный баннер; нажатие разворачивает приложение
      на нужном экране.
    - **Закрыто или выгружено** — баннер всё равно приходит; нажатие
      запускает приложение с нуля (холодный старт) и должно привести
      на тот же нужный экран.

    За нажатие в каждом состоянии часто отвечает разный код —
    проверять нужно все три.

- id: mob5-07
  type: quiz
  question: "Хитрый вопрос: нажатие на пуш из фона открывает нужный заказ. Можно ли не проверять нажатие из закрытого приложения?"
  options:
    - "Можно: если работает из фона, работает везде"
    - "Нельзя: из закрытого состояния приложение стартует с нуля, это другой путь кода и самое частое место багов"
    - "Можно, если пуш пришёл"
    - "Нельзя, но только на iOS"
  correct: 1
  explanation: |
    Холодный старт из пуша — отдельный сценарий: приложение должно
    запуститься, при необходимости проверить вход, загрузить данные
    и только потом открыть нужный экран. Типичный баг — открывается
    главная вместо заказа.

- id: mob5-08
  type: card
  question: Какими способами тестировщик может отправить пуш для теста?
  answer: |
    1. **Через саму фичу** — настоящее событие. Проверяет всю цепочку.
    2. **Тестовая ручка бэкенда** — эндпоинт для тестов на стенде,
       из Postman или Swagger. Любой шаблон и данные за секунды.
    3. **Админка или платформа рассылок** — на тестовый сегмент.
    4. **Firebase Console** — «Send test message» на токен устройства.
    5. **Напрямую** — FCM API или Push Notifications Console Apple.
    6. **Симулятор iOS** — `xcrun simctl push` или перетащить
       `.apns`-файл. Без APNs.
    7. **adb** — локальное уведомление, только вид в системе.

    Чем раньше в цепочку «врезается» способ, тем больше он проверяет.
    Один прогон через фичу нужен всегда.

- id: mob5-09
  type: card
  question: Что такое тестовая ручка для пушей и что в ней самой стоит проверить?
  answer: |
    Ручка — эндпоинт API. Тестовая ручка — эндпоинт для тестировщиков:
    «отправь пуш этому пользователю по этому шаблону с этими данными».
    Ищут в Swagger тестового стенда или спрашивают разработчиков.

    Проверить в ней самой:
    - работает только на тестовом стенде, на проде — 404 или 403;
    - требует авторизацию;
    - на стенде шлёт только тестовым устройствам;
    - понятные ошибки при неверных данных;
    - в ответе — сколько устройств и номера отправки.

- id: mob5-10
  type: quiz
  question: "Хитрый вопрос: пуш через simctl push на симуляторе iOS пришёл и открыл нужный экран. Что это доказывает?"
  options:
    - "Что доставка пушей через APNs работает"
    - "Что бэкенд правильно отправляет пуши"
    - "Только что приложение правильно показывает и обрабатывает такой payload; бэкенд и APNs не участвовали"
    - "Что пуши будут работать на всех iPhone"
  correct: 2
  explanation: |
    simctl push кладёт пуш прямо в симулятор, минуя наш бэкенд и
    APNs. Он хорош для проверки текста, бейджа и нажатия. Доставку
    проверяют через ручку или фичу на реальных устройствах.

- id: mob5-11
  type: card
  question: Где тестировщику взять токен устройства?
  answer: |
    - Отладочное меню тестовой сборки — попросить разработчиков
      вывести токен с кнопкой «Скопировать».
    - Логи устройства: Logcat на Android, Console на Mac для iPhone.
    - Таблица устройств в базе бэкенда.
    - Спросить разработчиков.

    Не публиковать токен целиком в общих чатах и баг-репортах.

- id: mob5-12
  type: card
  question: Пуш не пришёл. В каком порядке искать причину?
  answer: |
    1. Ушёл ли пуш: ответ ручки или платформы, номер отправки.
    2. Логи бэкенда по номеру или correlationId: что ответил FCM
       или APNs («принято», «токен недействителен»).
    3. Отчёт доставки в Firebase, консоли Apple или платформе.
    4. Телефон: разрешение, канал, «Не беспокоить».
    5. Энергосбережение, сеть, оболочка производителя.
    6. Актуален ли токен: совпадает ли в базе и в приложении.

- id: mob5-13
  type: quiz
  question: "Хитрый вопрос: после выхода из аккаунта и входа другим пользователем на телефон приходят пуши первого. Где, скорее всего, ошибка?"
  options:
    - "В FCM — он путает пользователей"
    - "В приложении или бэкенде: при выходе токен не отвязали от первого пользователя"
    - "Это нормальное поведение пушей"
    - "В настройках «Не беспокоить»"
  correct: 1
  explanation: |
    Токен — адрес устройства, а не человека. Связь «токен —
    пользователь» хранит наш бэкенд. Если при выходе её не убрали,
    пуши первого продолжают идти на этот телефон. Это утечка
    персональных данных — баг с высоким приоритетом.

- id: mob5-14
  type: card
  question: Что такое каналы уведомлений на Android и как их тестировать?
  answer: |
    Каналы — виды уведомлений внутри приложения: «Заказы», «Чат»,
    «Акции». Пользователь может выключить один канал и оставить
    остальные.

    Проверить: каждый пуш уходит в правильный канал; выключил
    «Акции» — заказы приходят; названия каналов понятны; нужные
    каналы включены по умолчанию.

    На iOS такого деления в системных настройках нет — там
    уведомления приложения включают целиком и выбирают стиль.

- id: mob5-15
  type: card
  question: Что проверить, если нажатие на пуш открывает экран в WebView?
  answer: |
    - Страница загрузилась, особенно при холодном старте.
    - Вход сохранился — сайт не просит войти заново.
    - Открылась нужная страница, а не главная сайта.
    - «Назад» возвращает в приложение.
    - Без сети — экран приложения «Нет сети», а не ошибка браузера.

- id: mob5-16
  type: quiz
  question: "Хитрый вопрос: маркетинговая рассылка пришла клиентам в 3 часа ночи. Что, скорее всего, пошло не так?"
  options:
    - "Почтальон Apple задержал пуш на 6 часов"
    - "Время рассылки посчитали без часового пояса пользователя — например, сервер работает в UTC"
    - "У клиентов было включено «Не беспокоить»"
    - "Это особенность Android"
  correct: 1
  explanation: |
    Классика: время без часового пояса. Полночь по UTC — 3:00 по
    Москве. Проверять запланированные рассылки нужно с расписанием,
    а не кнопкой «отправить сейчас», на телефонах в разных часовых
    поясах. И уточнить требования: по чьему времени и есть ли
    «тихие часы».

- id: mob5-17
  type: card
  question: Что указать в баг-репорте о пуше?
  answer: |
    - Как отправлен: фича, ручка, консоль, simctl — с payload.
    - Ответ ручки, номер отправки или correlationId.
    - Время отправки и прихода с часовым поясом.
    - Состояние приложения: на экране, в фоне, закрыто.
    - Разрешение, каналы, «Не беспокоить», энергосбережение.
    - Устройство, версия ОС, сборка; была ли переустановка.
    - Токен — начало и конец.
    - Видео, особенно нажатие из закрытого состояния.

- id: mob5-18
  type: card
  question: Как проверить бейдж на иконке приложения?
  answer: |
    Бейдж — цифра на иконке, например число непрочитанных.

    - Цифра совпадает с реальным числом непрочитанного.
    - Сбрасывается после прочтения.
    - Синхронизируется между устройствами одного пользователя.
    - Не «висит» после выхода из аккаунта.
    - `badge: 0` в payload убирает цифру.

- id: mob5-19
  type: quiz
  question: "Хитрый вопрос: пользователь отказал в уведомлениях, через неделю включил их в настройках телефона. Пуши так и не приходят, пока он не переустановит приложение. Что это?"
  options:
    - "Нормально: после отказа пуши не работают никогда"
    - "Баг: после включения разрешения приложение должно получить или отправить токен на бэкенд без переустановки"
    - "Проблема FCM"
    - "Пользователь забыл перезагрузить телефон"
  correct: 1
  explanation: |
    Частая ошибка: приложение регистрирует токен только сразу после
    первого «Разрешить». Включил позже — токен на бэкенд не ушёл.
    Проверка: отказать → включить в настройках → вернуться в
    приложение → отправить пуш ручкой.

- id: mob5-20
  type: card
  question: Как протестировать тихий пуш?
  answer: |
    Его не видно, поэтому смотрят результат: свернуть приложение →
    поменять данные на бэкенде → отправить тихий пуш → открыть
    приложение без сети — данные уже свежие. Плюс логи устройства.

    Помнить: система не обязана будить приложение (энергосбережение,
    приложение смахнули). Поэтому приложение всё равно обновляет
    данные при открытии. И тихий пуш не должен показываться пустым
    уведомлением.
