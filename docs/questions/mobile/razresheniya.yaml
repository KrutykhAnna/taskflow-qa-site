# Вопросы темы «Разрешения». Формат — см. osnovy/bag-report.yaml.

- id: mob4-01
  type: card
  question: Что такое разрешение в мобильном приложении?
  answer: |
    Согласие пользователя на доступ приложения к личному: камере,
    микрофону, фото, контактам, геолокации, уведомлениям.

    Хорошее приложение спрашивает разрешение в момент, когда оно
    нужно, объясняет зачем и продолжает работать, если пользователь
    отказал.

- id: mob4-02
  type: card
  question: Чем «опасные» разрешения Android отличаются от «обычных»?
  answer: |
    - **«Опасные»** (dangerous, runtime-разрешения) касаются личного:
      камера, микрофон, геолокация, контакты, фото, уведомления на
      Android 13+. Их спрашивают у пользователя в системном окне,
      он может отказать и отозвать позже.
    - **«Обычные»** (normal) — безопасные вещи вроде интернета.
      Выдаются молча при установке, окна нет.

- id: mob4-03
  type: card
  question: Какие варианты ответа бывают в окне разрешения на современных телефонах?
  answer: |
    - Разрешить / при использовании приложения.
    - Только в этот раз — на текущий сеанс (Android 11+ для камеры,
      микрофона, геолокации; на iOS — для геолокации).
    - Приблизительная геолокация вместо точной (Android 12+, iOS 14+).
    - Доступ только к выбранным фото (iOS 14+, Android 14+).
    - Запретить.

    Плюс отзыв в настройках в любой момент и автосброс неиспользуемых
    разрешений на Android. Каждый вариант — отдельная проверка.

- id: mob4-04
  type: quiz
  question: "Хитрый вопрос: пользователь iPhone один раз отказал в камере. Что произойдёт, когда приложение спросит снова?"
  options:
    - "Системное окно появится снова"
    - "Системное окно не появится: на iOS его показывают один раз, дальше пользователь меняет решение только в настройках"
    - "Приложение получит доступ автоматически через сутки"
    - "iOS удалит приложение"
  correct: 1
  explanation: |
    На iOS системное окно показывают один раз. После отказа
    приложение должно само объяснить, зачем нужна камера, и дать
    кнопку «Открыть настройки». Если кнопка «Сканировать» молча
    ничего не делает — это баг приложения, а не системы.

- id: mob4-05
  type: card
  question: Чем запрос разрешений на iOS отличается от Android?
  answer: |
    - **Сколько раз спросить.** iOS — системное окно один раз.
      Android — можно снова, но обычно после двух отказов окно
      перестаёт появляться.
    - **Объяснение.** iOS — обязательный текст-обоснование в
      Info.plist, его показывают в системном окне. Android — свой
      экран-объяснение приложения перед окном.
    - **Отзыв.** На Android отзыв в настройках завершает процесс
      приложения.
    - **Уведомления.** iOS спрашивает всегда, Android — с версии 13.

- id: mob4-06
  type: card
  question: Что такое Info.plist и при чём тут разрешения?
  answer: |
    Файл настроек iOS-приложения внутри сборки. Для каждого
    разрешения в нём должен быть текст-обоснование — зачем
    приложению доступ. iOS показывает этот текст в системном окне.

    Тестировщик проверяет, что текст понятный, на нужном языке
    и правдивый. Расплывчатый текст вроде «приложению нужна
    камера» — причина отказа магазина.

- id: mob4-07
  type: quiz
  question: "Хитрый вопрос: на Android пользователь свернул приложение и отозвал камеру в настройках. Что произойдёт с приложением?"
  options:
    - "Ничего, процесс продолжит работать как раньше"
    - "Android завершит процесс приложения; при возврате будет холодный запуск, и приложение должно заметить, что разрешения нет"
    - "Приложение удалится"
    - "Разрешение вернётся само при следующем запуске"
  correct: 1
  explanation: |
    При отзыве разрешения Android завершает процесс. Пользователь
    возвращается через «недавние» — и приложение запускается заново.
    Тут ловят вылеты (приложение «помнит» старое разрешение) и
    потерю экрана и данных. Проверка: разрешить → свернуть →
    отозвать → вернуться.

- id: mob4-08
  type: card
  question: Что проверить после отказа в разрешении?
  answer: |
    - Понятное сообщение: что не работает и почему.
    - Путь в настройки — кнопка «Открыть настройки».
    - Приложение не падает, не показывает пустой экран или вечный
      спиннер.
    - Окно не спрашивает снова и снова по кругу.
    - Остальное приложение работает; есть обходной путь, если он
      возможен (ввести адрес вручную, загрузить фото из галереи).
    - Второй отказ на Android: окна уже нет, а приложение всё
      равно объясняет и ведёт в настройки.

- id: mob4-09
  type: quiz
  question: "Хитрый вопрос: тестировщик хочет снова увидеть системное окно. Он заходит в настройки и ставит «Не разрешать». Окно появится?"
  options:
    - "Да, это сброс"
    - "Нет: «Не разрешать» — это отказ. Для повторного окна нужен сброс: «Спрашивать каждый раз», очистка данных или переустановка"
    - "Да, но только на iOS"
    - "Да, если перезагрузить телефон"
  correct: 1
  explanation: |
    Отказ в настройках — это состояние «запрещено», окно после него
    не появится. Им удобно проверять ветку «отказ без окна».
    А чтобы снова пройти путь «нажал → объяснение → окно», нужен
    сброс: на Android — «Спрашивать каждый раз», «Очистить данные»
    или переустановка; на iOS — переустановка.

- id: mob4-10
  type: card
  question: Как сбросить разрешения для повторной проверки?
  answer: |
    **Android:**
    - «Настройки» → «Приложения» → приложение → «Разрешения» —
      поменять ответ.
    - «Очистить данные» — сбрасывает и разрешения.
    - Переустановка.
    - adb: `adb shell pm grant` / `pm revoke` имя пакета и
      разрешение — выдать или отобрать без окна.

    **iOS:** удалить и поставить заново; на симуляторе — сбросить
    устройство целиком (Erase All Content and Settings).

- id: mob4-11
  type: quiz
  question: Почему нельзя проверять разрешения только через adb pm grant и pm revoke?
  options:
    - "adb не работает с разрешениями"
    - "Эти команды пропускают системное окно и путь «нажал → объяснение → окно» — баги в самом запросе останутся не найдены"
    - "После них приложение удаляется"
    - "Они работают только на iOS"
  correct: 1
  explanation: |
    adb удобен для подготовки состояния: «уже разрешено» или
    «уже запрещено». Но объяснение перед окном, момент запроса
    и реакцию на ответ в окне проверяют только руками.

- id: mob4-12
  type: card
  question: Зачем тестировщику смотреть манифест в APK Analyzer?
  answer: |
    Манифест (`AndroidManifest.xml`) — «паспорт» Android-приложения,
    в нём каждое разрешение — строка `uses-permission`. Тестировщик
    сверяет три списка: что объявлено в манифесте, что приложение
    реально просит и что указано в анкете магазина о данных.

    Лишнее разрешение — вопрос команде: приватность и риск отказа
    магазина. Смотреть нужно итоговый манифест в APK: библиотеки
    могут добавить свои разрешения.

- id: mob4-13
  type: quiz
  question: "Хитрый вопрос: разработчик говорит «я разрешение на контакты не добавлял», а в APK Analyzer оно есть. Как такое возможно?"
  options:
    - "APK Analyzer показывает разрешения всех приложений на телефоне"
    - "Разрешение могла добавить подключённая библиотека — в итоговый манифест APK попадают и её разрешения"
    - "Это разрешение добавляет магазин при публикации"
    - "Такого не бывает, разработчик ошибается"
  correct: 1
  explanation: |
    Приложение собирают из своего кода и библиотек. Манифесты
    библиотек объединяются с манифестом приложения. Поэтому
    смотрят итоговый манифест в APK — его видят пользователь
    и магазин. Если разрешение не нужно — разработчики могут
    исключить его.

- id: mob4-14
  type: card
  question: Чем «нет разрешения на геолокацию» отличается от «геолокация выключена в системе»?
  answer: |
    - **Нет разрешения** — пользователь запретил доступ именно этому
      приложению. Подсказка: «разрешите в настройках приложения».
    - **Выключена в системе** — разрешение есть, но геолокация
      телефона выключена целиком. Подсказка: «включите геолокацию».

    Частый баг — приложение путает их и просит разрешение, которое
    уже дано. Третье состояние для проверки — точка далеко
    (другой город): на эмуляторе задаётся в Extended controls →
    Location.

- id: mob4-15
  type: quiz
  question: "Хитрый вопрос: пользователь выбрал «приблизительную» геолокацию, и приложение пишет «нет доступа к геолокации». Что это?"
  options:
    - "Норма: приблизительная геолокация — это то же, что запрет"
    - "Скорее всего баг: приложение ждёт только точную и не обработало вариант «приблизительно»"
    - "Баг Android, его не исправить"
    - "Пользователь сделал что-то не так"
  correct: 1
  explanation: |
    С Android 12 и iOS 14 пользователь может дать только
    приблизительную геолокацию. Приложение должно либо работать
    с ней (например, определить город), либо объяснить, зачем
    нужна точная, и попросить её. Сообщение «нет доступа» при
    выданном доступе — баг.

- id: mob4-16
  type: card
  question: Что такое двойной запрос разрешения в WebView?
  answer: |
    Сайт внутри приложения (WebView) просит камеру или геолокацию.
    Нужны два «замка»:

    1. У самого приложения есть разрешение ОС — системное окно.
    2. Приложение передаёт доступ странице — это решает его код.

    Типичный баг: в браузере сайт камеру получает, в приложении —
    нет. Ещё проверяют, не задают ли один вопрос дважды разными
    окнами. У мобильного сайта и PWA разрешения спрашивает браузер,
    и у самого браузера тоже должно быть разрешение ОС.

- id: mob4-17
  type: card
  question: Когда приложение должно спрашивать разрешение?
  answer: |
    В момент, когда функция понадобилась: нажал «Сканировать» —
    спросили камеру. Перед системным окном — объяснение зачем.

    Запрос на старте оправдан, только если без разрешения
    приложение бесполезно (навигатор). Пять окон подряд на первом
    запуске — замечание: пользователь отказывает «на всякий случай»,
    а второго шанса на iOS нет.

- id: mob4-18
  type: quiz
  question: Что обязательно указать в баг-репорте о разрешениях?
  options:
    - "Только модель телефона"
    - "Какое разрешение, какой ответ дал пользователь (включая «только в этот раз», «приблизительно», отзыв позже), версию ОС, как сбрасывал разрешения, видео"
    - "Имя разработчика фичи"
    - "Только скриншот системного окна"
  correct: 1
  explanation: |
    Поведение разрешений сильно зависит от версии ОС: «только в этот
    раз» есть с Android 11, приблизительная геолокация — с Android 12
    и iOS 14. Без ответа пользователя и версии ОС баг часто
    «не воспроизводится».

- id: mob4-19
  type: card
  question: Что проверить, если обновление приложения добавило новое разрешение?
  answer: |
    - Новое разрешение спрашивают в момент новой фичи, а не сразу
      после обновления.
    - Старые ответы пользователя не сбросились.
    - Без нового разрешения старые фичи работают как раньше.
    - Новое разрешение есть в манифесте или Info.plist с понятным
      объяснением и указано в анкете магазина о данных.

- id: mob4-20
  type: card
  question: Как проверить геолокацию, не выходя из-за компьютера?
  answer: |
    - **Эмулятор Android:** Extended controls → Location — задать
      точку на карте или координаты (Set location) либо маршрут.
    - **Симулятор iOS:** Features → Location — свои координаты
      или готовые маршруты.

    Проверить стоит три состояния: нет разрешения, геолокация
    выключена в системе, точка далеко (другой город или страна).
