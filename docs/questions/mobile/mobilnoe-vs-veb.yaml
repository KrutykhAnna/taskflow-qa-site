# Вопросы темы «Мобильное и веб». Формат — см. osnovy/bag-report.yaml.

- id: mob1-01
  type: card
  question: Чем тестирование мобильного приложения отличается от тестирования веба?
  answer: |
    База та же: требования, тест-дизайн, API, состояния экранов, формы.
    Сверху добавляется:

    - две платформы — iOS и Android — с разными правилами;
    - фрагментация: сотни моделей, версии ОС, оболочки производителей;
    - установка и обновление через магазин, пользователи на старых версиях;
    - жизненный цикл и прерывания: звонки, сворачивание, выгрузка из памяти;
    - разрешения, push-уведомления, дип-линки;
    - жесты, экранная клавиатура, вырез экрана, системный шрифт;
    - нестабильная сеть и офлайн, батарея и память;
    - другие инструменты: прокси для трафика и логи устройства вместо DevTools.

- id: mob1-02
  type: quiz
  question: Что такое PWA?
  options:
    - "Приложение, написанное на Kotlin и Swift одновременно"
    - "Сайт, который можно «установить» на главный экран: открывается без адресной строки и может работать без сети"
    - "Сайт, показанный внутри приложения через WebView"
    - "Тестовая сборка приложения для iOS"
  correct: 1
  explanation: |
    PWA (Progressive Web App) — сайт, который ставится на экран прямо
    из браузера, без магазина. Открывается как приложение, может хранить
    файлы и работать без интернета. Сайт внутри приложения — это гибрид
    с WebView, а тестовые сборки для iOS раздают через TestFlight.

- id: mob1-03
  type: card
  question: Что такое WebView и что это значит для тестировщика?
  answer: |
    **WebView** — встроенное в приложение «окно браузера» без адресной
    строки и кнопок. Через него приложение показывает сайт: часто это
    «Правила», «Помощь», чат поддержки, страница оплаты.

    Для тестировщика: внутри WebView живут веб-баги — вёрстка, запросы,
    кэш, поведение без сети в стиле браузера. Пригодятся веб-навыки.
    А на стыке с нативной частью — свои баги: «Назад», передача входа
    из приложения в WebView, открытие ссылок.

- id: mob1-04
  type: quiz
  question: Чем кросс-платформенное приложение отличается от нативного?
  options:
    - "Кросс-платформенное работает только в браузере"
    - "Кросс-платформенное не публикуют в магазинах"
    - "У кросс-платформенного один код на обе платформы (например, Flutter или React Native), у нативного — отдельный код под каждую (Kotlin, Swift)"
    - "Нативное приложение не может обращаться к API"
  correct: 2
  explanation: |
    Кросс-платформенное собирают из одного кода и для iOS, и для Android.
    Поэтому многие баги сразу на обеих платформах: нашёл на одной —
    проверь на другой. Платформенные различия («Назад», разрешения,
    клавиатура) при этом остаются.

- id: mob1-05
  type: card
  question: Как понять, нативный перед тобой экран или WebView?
  answer: |
    Самый надёжный способ — спросить команду. Признаки, которые помогают
    угадать самому:

    - долгое нажатие на обычный текст выделяет его, как в браузере, — скорее WebView;
    - в авиарежиме ошибка в стиле браузера — WebView; свой экран «Нет сети» — скорее нативный;
    - страница увеличивается двумя пальцами целиком — WebView;
    - на Android в режиме разработчика «Показывать границы»: нативный
      экран весь в рамках, WebView — одна большая рамка.

    Хорошо сделанный гибрид по ощущениям не отличить.

- id: mob1-06
  type: quiz
  question: "Хитрый вопрос: на Android включили «Показывать границы», и экран — одна большая рамка без рамок вокруг кнопок. Что можно сказать точно?"
  options:
    - "Это точно WebView"
    - "Это точно PWA"
    - "Экран не из нативных элементов Android: это может быть WebView или фреймворк, который рисует экран сам, например Flutter"
    - "Это точно нативное приложение"
  correct: 2
  explanation: |
    Одна рамка значит, что кнопки не нативные. Но так выглядит и WebView,
    и Flutter — он рисует весь экран сам. Признак сужает варианты,
    а точный ответ даст команда.

- id: mob1-07
  type: card
  question: Что такое фрагментация и как она влияет на тестирование?
  answer: |
    **Фрагментация** — огромное разнообразие устройств: сотни моделей,
    размеры экранов, версии ОС, оболочки производителей (Samsung,
    Xiaomi и другие меняют поведение Android по-своему).

    Влияние: проверить «на всём» невозможно. Нужна матрица устройств —
    какие модели и версии ОС проверяем, выбранные по статистике
    пользователей. И баги, которые есть только на одной марке, — например,
    не приходят уведомления из-за агрессивной экономии батареи.

- id: mob1-08
  type: quiz
  question: "Хитрый вопрос: в мобильном приложении нашли критичный баг через час после релиза. Почему нельзя просто «откатить», как в вебе?"
  options:
    - "Можно: достаточно вернуть прошлую версию на сервер"
    - "Приложение уже установлено у людей — забрать его с телефонов нельзя, можно только выпустить новую версию или выключить функцию на сервере"
    - "Магазин запрещает выпускать больше одной версии в месяц"
    - "Откат возможен только на iOS"
  correct: 1
  explanation: |
    В вебе прошлая версия возвращается на сервер, и у всех снова она.
    Приложение живёт на телефоне. Что помогает: остановить поэтапный
    релиз, выключить функцию фича-флагом на сервере, поправить на
    бэкенде или выпустить срочную сборку — она тоже пройдёт проверку магазина.

- id: mob1-09
  type: card
  question: "Хитрый вопрос: бэкенд переименовывает поле в ответе API, новое приложение уже под это обновили. Всё протестировано на новой версии. Чего не хватает?"
  answer: |
    Проверки **старых версий приложения** с новым API. Пользователи
    обновляются не сразу, некоторые — годами. Старое приложение ждёт
    старое поле и может упасть.

    Что сделать: проверить 2–3 последние версии из магазина, узнать
    минимальную поддерживаемую версию и есть ли принудительное
    обновление. Предложить добавить новое поле рядом со старым, а не
    переименовывать.

- id: mob1-10
  type: quiz
  question: Что такое APK и IPA?
  options:
    - "APK — файл приложения для Android, IPA — файл приложения для iOS"
    - "APK — магазин Android, IPA — магазин Apple"
    - "Оба — форматы логов устройства"
    - "APK — эмулятор Android, IPA — симулятор iOS"
  correct: 0
  explanation: |
    APK (Android Package) можно поставить на Android напрямую, без
    магазина. IPA (iOS App Store Package) на iPhone просто так не
    поставить: нужна подписанная для устройства сборка или TestFlight.

- id: mob1-11
  type: card
  question: Как тестировщик получает сборку приложения на iOS и на Android?
  answer: |
    **iOS:** через **TestFlight** — приложение Apple для раздачи тестовых
    сборок.

    **Android:** файлом APK напрямую, через **Firebase App Distribution**
    (сервис Google для раздачи сборок) или через внутреннее тестирование
    в Google Play.

    В любом случае сразу записать версию и номер сборки.

- id: mob1-12
  type: quiz
  question: "Хитрый вопрос: в баг-репорте написано «Окружение: последняя версия приложения». Что не так?"
  options:
    - "Ничего, разработчик знает, какая версия последняя"
    - "Нужно ещё написать название магазина"
    - "«Последняя» завтра будет другой. Нужны точная версия и номер сборки, например 2.14.0 (1523), и откуда сборка"
    - "Версия приложения в баг-репорте не нужна, нужна только версия ОС"
  correct: 2
  explanation: |
    Пока баг дойдёт до разработчика, выйдет новая сборка, и «последняя»
    будет означать другое. Без номера сборки не понять, где баг и есть ли
    в ней уже исправление.

- id: mob1-13
  type: card
  question: Что добавить в баг-репорт мобильного бага, кроме шагов и результатов?
  answer: |
    - модель устройства;
    - версия ОС и оболочки (One UI, HyperOS и т. п.);
    - версия и номер сборки приложения, откуда сборка;
    - стенд, на который ходит приложение;
    - сеть: Wi‑Fi, 4G, переключение;
    - ориентация экрана;
    - особые настройки: крупный шрифт, тёмная тема, экономия батареи;
    - частота и где не воспроизводится;
    - видео и логи устройства.

- id: mob1-14
  type: quiz
  question: Чем системная кнопка «Назад» отличается на iOS и Android?
  options:
    - "На обеих платформах она одинаковая"
    - "На Android есть системная «Назад» (кнопка или жест) на каждом экране, на iOS системной нет — кнопка в приложении или свайп от левого края"
    - "На iOS есть системная кнопка, на Android — нет"
    - "Кнопки «Назад» нет ни на одной платформе"
  correct: 1
  explanation: |
    Поэтому на Android «Назад» проверяют на каждом экране, особенно
    посреди сценария: оплата, регистрация, ввод кода. Частая ошибка —
    тестировать Android только кнопками самого приложения.

- id: mob1-15
  type: card
  question: "Хитрый вопрос: зачем реальные телефоны, если есть бесплатный эмулятор?"
  answer: |
    Эмулятор хорош для старта и функциональных проверок, но не повторяет:

    - реальные звонки, СМС, камеру и датчики;
    - настоящую батарею и её экономию;
    - реальную сеть с потерями;
    - оболочки производителей (Samsung, Xiaomi);
    - скорость слабого телефона.

    Симулятор iOS — не настоящий iPhone. Финальную проверку и всё
    «железное» делают на реальных устройствах или в облачной ферме.

- id: mob1-16
  type: quiz
  question: На каком компьютере можно запустить симулятор iOS из Xcode?
  options:
    - "На любом: Mac, Windows, Linux"
    - "Только на Windows"
    - "Только на Mac"
    - "Только в браузере"
  correct: 2
  explanation: |
    Xcode работает только на Mac. Эмулятор Android из Android Studio
    работает на Mac, Windows и Linux. Нет Mac — iOS проверяют на
    реальном iPhone или в облачной ферме устройств.

- id: mob1-17
  type: quiz
  question: "Хитрый вопрос: на iPhone в Chrome кнопка на сайте не нажимается, а в Safari — нажимается. Что вероятнее всего?"
  options:
    - "Баг движка Chrome — к сайту не относится"
    - "Chrome на iPhone работает на том же движке WebKit, что и Safari, — надо искать разницу в условиях: сессия, куки, перевод страницы, масштаб"
    - "Сайт не поддерживает iPhone"
    - "Надо переустановить iOS"
  correct: 1
  explanation: |
    По правилам Apple браузеры на iPhone в основном работают на движке
    Safari. Разница чаще в условиях, а не в движке. И даже если причина
    в браузере — пользователю всё равно, где он не смог купить.

- id: mob1-18
  type: card
  question: Какие «мобильные» проверки добавить к веб-чек-листу для экрана входа?
  answer: |
    Примеры:

    - свернуть приложение во время ввода и вернуться — данные на месте;
    - входящий звонок при нажатии «Войти»;
    - системная «Назад» на Android на каждом шаге;
    - клавиатура не закрывает поля и кнопку, у email — клавиатура с `@`;
    - менеджер паролей подставляет данные;
    - крупный шрифт и поворот экрана;
    - авиарежим и переключение Wi‑Fi → 4G;
    - ссылка из письма «Забыли пароль?» открывает приложение;
    - «Запомнить меня» после обновления, перезагрузки и переустановки.

- id: mob1-19
  type: quiz
  question: Что такое поэтапный релиз мобильного приложения?
  options:
    - "Выпуск приложения сначала на iOS, через месяц — на Android"
    - "Новую версию сначала получает небольшая доля пользователей, потом больше и больше; при проблеме раскатку останавливают"
    - "Разработка приложения по этапам SDLC"
    - "Публикация сначала в TestFlight, потом в App Store"
  correct: 1
  explanation: |
    Например, 5% → 20% → 100%. Баг, найденный на 5%, затронет мало
    людей, а раскатку можно остановить. Это одна из замен «отката»,
    которого в мобильном нет.
