# Вопросы темы «Дип-линки». Формат — см. osnovy/bag-report.yaml.

- id: mob6-01
  type: card
  question: Что такое дип-линк и где он встречается?
  answer: |
    Ссылка, которая открывает не приложение целиком, а конкретный
    экран внутри него: товар, заказ, чат.

    Где встречается: письма и СМС (сброс пароля, «заказ в пути»),
    пуши, QR-коды, реклама, «поделиться», переход с сайта в
    приложение, переходы между приложениями (оплата через банк и
    возврат в магазин).

- id: mob6-02
  type: card
  question: Зачем тестировать дип-линки — чем грозит баг?
  answer: |
    - **Сброс пароля, подтверждение email** — человек не может войти.
    - **Товар, заказ** — открылась главная (ищи сам) или чужой заказ
      (утечка данных).
    - **Оплата и возврат из банка** — не понял, оплачено ли, платит
      второй раз.
    - **Реклама, рефералки** — бюджет сгорел, бонус не засчитан.
    - **Пуш → экран** — открылся не тот чат или главная.

- id: mob6-03
  type: card
  question: Какие бывают дип-линки?
  answer: |
    - **URL-схема** — своя схема `shop://orders/42`. Без приложения
      никуда не ведёт; ту же схему может заявить чужое приложение.
    - **Universal Links (iOS) / App Links (Android)** — обычная
      `https`-ссылка: есть приложение и домен подтверждён — открывается
      приложение, нет — сайт.
    - **Отложенный дип-линк** — приложения нет: магазин → установка →
      при первом запуске нужный экран. Обычно через сторонние сервисы
      (AppsFlyer, Branch, Adjust).

- id: mob6-04
  type: card
  question: Как Android и iOS узнают, что https-ссылка «принадлежит» приложению?
  answer: |
    Владелец сайта кладёт служебный файл в папку `.well-known`:

    - Android — `assetlinks.json`: имя пакета и отпечаток подписи
      приложения;
    - iOS — `apple-app-site-association` (AASA): идентификатор
      приложения и какие пути открывать в приложении.

    Система скачивает файл (на iOS — через серверы Apple) и запоминает
    связь домена с приложением. Файл — часть релиза: пропал или сломан —
    ссылки у всех начнут открывать сайт.

- id: mob6-05
  type: quiz
  question: "Хитрый вопрос: приложение установлено, домен подтверждён. Тестировщик вставил ссылку в адресную строку Safari — открылся сайт. Это баг?"
  options:
    - "Да, Universal Links сломаны"
    - "Нет: ссылку, вставленную в адресную строку, браузер обычно оставляет себе. Нажимать надо как на ссылку — в заметках, письме, на странице"
    - "Да, нужно переустановить приложение"
    - "Нет, Universal Links на iPhone вообще не работают"
  correct: 1
  explanation: |
    Вставка в адресную строку — не то же самое, что нажатие на ссылку.
    Чтобы проверить, открывает ли ссылка приложение, на неё нажимают:
    в заметках, письме, мессенджере или на тестовой страничке.

- id: mob6-06
  type: card
  question: Что проверить у дип-линка — главные пункты?
  answer: |
    - Приложение установлено / не установлено (сайт или магазин).
    - Состояние: закрыто (холодный старт), в фоне, открыто на другом
      экране.
    - Пользователь вошёл / не вошёл — после входа возврат на цель.
    - Чужой, несуществующий, удалённый объект; кривые параметры.
    - Разные источники: почта, мессенджеры, браузер, QR.
    - «Назад» после перехода, повторное нажатие.
    - Одноразовые ссылки, UTM-метки, старая версия приложения.
    - iOS и Android отдельно.

- id: mob6-07
  type: quiz
  question: "Хитрый вопрос: ссылка из письма открывает приложение, если нажать её в заметках, но не открывает, если нажать в почтовом приложении. Где искать причину в первую очередь?"
  options:
    - "В коде экрана заказа"
    - "Почтовое приложение открывает ссылку во встроенном браузере и не передаёт её системе"
    - "Ссылка слишком длинная"
    - "Нужно перезагрузить телефон"
  correct: 1
  explanation: |
    Многие почтовые приложения, мессенджеры и соцсети открывают ссылки
    в своём встроенном браузере (WebView). Тогда наше приложение даже не
    получает ссылку. Поэтому ссылки проверяют из тех источников, откуда
    их реально открывают пользователи, а на сайте должна быть понятная
    кнопка «Открыть в приложении».

- id: mob6-08
  type: card
  question: Как открыть дип-линк для теста?
  answer: |
    - Нажать в заметках, мессенджере, письме — самый реалистичный способ.
    - QR-код — только для своих тестовых ссылок.
    - Android: `adb shell am start -a android.intent.action.VIEW
      -c android.intent.category.BROWSABLE -d "ссылка"`.
    - iOS-симулятор: `xcrun simctl openurl booted "ссылка"`.
    - Тестовая страничка со списком ссылок на стенде.
    - Отладочное меню приложения, если есть.

    Быстрые способы — для перебора; хотя бы один прогон — нажатием из
    настоящего источника на реальном телефоне.

- id: mob6-09
  type: card
  question: Как проверить, подтвердил ли Android домен для приложения?
  answer: |
    `adb shell pm get-app-links <имя пакета>` (Android 12+). У каждого
    домена статус: `verified` — подтверждён; `none` — проверка ещё не
    прошла; `approved` / `denied` — принудительно командой; код 1024+ —
    ошибка проверки.

    Перепроверить: `adb shell pm verify-app-links --re-verify <пакет>`.
    На iOS простого аналога нет: проверку делает Apple, результат видно
    по поведению — открылось приложение или Safari.

- id: mob6-10
  type: quiz
  question: "Хитрый вопрос: на магазинной сборке https-ссылки открывают приложение, а на тестовой — браузер (Android 14). pm get-app-links на тестовой показывает не verified. Самая вероятная причина?"
  options:
    - "Эмулятор не поддерживает App Links"
    - "В assetlinks.json нет отпечатка подписи тестовой сборки"
    - "Тестовые сборки никогда не открывают ссылки"
    - "Нужно включить режим разработчика"
  correct: 1
  explanation: |
    В `assetlinks.json` указан отпечаток подписи приложения. Тестовая
    сборка подписана другим ключом — для неё домен не подтверждён, и
    Android 12+ открывает такую ссылку в браузере. Решение — добавить
    отпечаток тестовой сборки (или тестовое имя пакета) в файл.

- id: mob6-11
  type: card
  question: Что такое отложенный дип-линк и как его проверить?
  answer: |
    Ссылка, которая «ждёт» установки: приложения нет → магазин →
    установка → при первом запуске открывается нужный экран, а не
    главная.

    Проверка: удалить приложение → нажать ссылку → поставить → первый
    запуск → нужный экран; то же с регистрацией на первом запуске;
    засчитан ли реферал или установка из кампании. Ломается незаметно —
    например, после переделки первого запуска.

- id: mob6-12
  type: quiz
  question: "Хитрый вопрос: дип-линк на чужой заказ показывает экран «Нет доступа». Достаточно ли этого?"
  options:
    - "Да, раз экран показал отказ — данные защищены"
    - "Нет: нужно проверить ответ сервера — он должен быть 403 или 404 без данных; экран мог нарисовать клиент, а данные уже пришли"
    - "Да, если на iOS и Android одинаково"
    - "Нет, должен открываться чужой заказ только для чтения"
  correct: 1
  explanation: |
    Защищает данные сервер, а не экран. Если API отдал чужой заказ
    целиком, а приложение просто не показало его, данные всё равно
    утекли — их видно в трафике. Проверка — тот же запрос в API или
    перехват трафика.

- id: mob6-13
  type: card
  question: Как тестировать одноразовую ссылку (сброс пароля)?
  answer: |
    - Позитивный путь: ссылка → новый пароль → вход.
    - Повторное нажатие — «Ссылка уже использована».
    - Срок действия на границе — до и после.
    - Два запроса подряд — работает ли первая ссылка (по требованиям).
    - Испорченный или пустой токен — понятная ошибка без вылета.
    - Без приложения и во встроенном браузере почты — сброс работает
      на сайте.
    - После смены — другие сессии завершены.

- id: mob6-14
  type: card
  question: Что написать в баг-репорте по дип-линку?
  answer: |
    - Ссылку целиком (секретные токены — скрыть).
    - Источник: где нажал — какое почтовое приложение, мессенджер,
      заметки, adb.
    - Состояние приложения: закрыто, в фоне, на каком экране.
    - Вошёл ли пользователь и какой.
    - Что открылось: приложение и какой экран, сайт, встроенный
      браузер, ничего.
    - Версии приложения и ОС, модель телефона, видео.

- id: mob6-15
  type: quiz
  question: "Хитрый вопрос: на телефоне два приложения зарегистрировали схему shop://. Какое откроет ссылку shop://pay?order=1?"
  options:
    - "Всегда то, что установлено первым"
    - "Всегда то, что установлено последним"
    - "Решает система — поэтому своя схема не защищена от перехвата, и для оплаты и входа используют проверенные https-ссылки"
    - "Никакое — система запретит обе"
  correct: 2
  explanation: |
    Свою схему может заявить любое приложение — случайно или нарочно.
    Что откроется, решает система по своим правилам. Universal Links и
    App Links защищены подтверждением домена: перехватить их можно
    только получив контроль над сайтом.

- id: mob6-16
  type: card
  question: Как построить матрицу проверок для ссылки, если комбинаций слишком много?
  answer: |
    Измерения: установлено / нет × вошёл / не вошёл / чужой × закрыто /
    в фоне / открыто × источники × iOS / Android — это сотня с лишним
    прогонов на одну ссылку.

    Приоритизация: главный путь (установлено, вошёл, закрыто, из
    реального источника, обе платформы) — полностью; дальше меняют по
    одному измерению за раз; плюс проверки данных (чужой,
    несуществующий, кривой id). Получается 15–20 прогонов.

- id: mob6-17
  type: card
  question: Как дип-линки касаются WebView и типа приложения?
  answer: |
    - **Кросс-платформенное** — ссылки часто разбирает один код:
      баг сразу на обеих платформах; регистрация ссылок у каждой своя.
    - **Ссылка открылась в WebView** чужого приложения — сайт должен
      работать и предлагать «Открыть в приложении».
    - **Ссылка из нашего WebView-экрана** на товар — должна открыть
      нативный экран, а не сайт внутри WebView.
    - **Дип-линк на WebView-экран** — загрузка при холодном старте,
      вход сохранён, «Назад» в приложение.
    - **Мобильный сайт и PWA** — обычные URL; ссылка из письма часто
      откроется в браузере, а не в PWA.

- id: mob6-18
  type: quiz
  question: "Хитрый вопрос: тестировщик прогнал все ссылки через adb — открываются нужные экраны. Что осталось непроверенным?"
  options:
    - "Ничего, adb повторяет поведение пользователя полностью"
    - "Источники (встроенные браузеры почты и мессенджеров), iOS, ссылки в реальных письмах и рекламе — опечатки и тестовые домены"
    - "Только скорость открытия"
    - "Только тёмная тема"
  correct: 1
  explanation: |
    adb подаёт ссылку системе напрямую. Он не показывает, дойдёт ли
    ссылка из почтового приложения или мессенджера, не проверяет iOS
    и не видит, какая ссылка на самом деле стоит в письме или рекламе.
    Главный путь нужно пройти нажатием из реальных источников.

- id: mob6-19
  type: card
  question: Что проверить при оплате через приложение банка с возвратом в магазин?
  answer: |
    - Ссылка возврата открывает наше приложение на экране результата —
      в том числе если магазин выгрузили из памяти, пока человек был
      в банке.
    - Статус оплаты берётся с сервера, а не только из ссылки: вернулся
      вручную через «недавние» — всё равно видит «Оплачено».
    - Повторное открытие ссылки возврата не создаёт второй заказ и не
      списывает деньги второй раз.
