# Вопросы темы «Устройства и сборки». Формат — см. osnovy/bag-report.yaml.

- id: mob2-01
  type: card
  question: На чём можно тестировать мобильное приложение? Плюсы и минусы каждого варианта.
  answer: |
    - **Реальный телефон** — всё по-настоящему: скорость, сеть, камера,
      батарея, оболочка производителя. Минус — дорого, нужен парк телефонов.
    - **Эмулятор Android** — бесплатно, любая версия и размер экрана,
      быстрый сброс. Нет оболочек производителей, настоящей камеры и звонков.
    - **Симулятор iOS** — бесплатно, все модели iPhone, но только на Mac,
      и работает на ресурсах Mac.
    - **Облачная ферма** — сотни реальных моделей без покупки. Платно,
      задержка картинки, сборка уходит третьей стороне.

    Обычно используют всё вместе: эмуляторы — для большинства
    функциональных проверок, реальные устройства — для «железа» и финала.

- id: mob2-02
  type: quiz
  question: "Хитрый вопрос: чем эмулятор Android отличается от симулятора iOS?"
  options:
    - "Ничем, это два названия одного и того же"
    - "Эмулятор изображает телефон целиком и запускает настоящий Android; симулятор изображает только поведение iPhone и работает на ресурсах Mac, поэтому ему нужна отдельная сборка"
    - "Симулятор точнее эмулятора, потому что сделан Apple"
    - "Эмулятор работает только на Mac, симулятор — на любом компьютере"
  correct: 1
  explanation: |
    Эмулятор Android изображает «железо», внутри работает настоящая
    система, ставится обычный APK. Симулятор iOS запускает приложение,
    собранное под процессор Mac, — поэтому нужна сборка «для симулятора»
    (`.app`), а скорость и память — от Mac. Симулятор работает только
    на Mac, эмулятор — на Mac, Windows и Linux.

- id: mob2-03
  type: card
  question: Что нельзя полноценно проверить на эмуляторе или симуляторе?
  answer: |
    - настоящие звонки и СМС (есть только имитация);
    - камеру — вместо неё картинка или виртуальная сцена;
    - реальную батарею и её экономию;
    - оболочки производителей: Samsung, Xiaomi, Honor;
    - реальную мобильную сеть с потерями;
    - производительность слабого телефона;
    - push на симуляторе iOS — работает с оговорками.

    Всё «железное» и финальный прогон — на реальных устройствах
    или в облачной ферме.

- id: mob2-04
  type: card
  question: Что такое матрица устройств и как её составить?
  answer: |
    **Матрица устройств** — табличка «на каких моделях и версиях ОС
    проверяем».

    Как составить:

    1. Взять данные: аналитика продукта (топ моделей и версий ОС),
       минимальные поддерживаемые версии, публичная статистика, жалобы.
    2. Выбрать 5–8 устройств под разные риски: свежий iPhone, старый
       iPhone на минимальной iOS, маленький экран, популярный Samsung,
       Xiaomi или другая оболочка, чистый Android, минимальная версия
       Android, планшет — если заявлен.
    3. Разделить: 2–3 основных — полный прогон, остальные — смоук.
    4. Пересматривать с выходом новых версий ОС.

- id: mob2-05
  type: quiz
  question: "Хитрый вопрос: у 40% пользователей включён крупный системный шрифт. Как это учесть в матрице устройств?"
  options:
    - "Добавить в матрицу отдельный телефон «для крупного шрифта»"
    - "Никак — шрифт не относится к устройствам"
    - "Проверять основные устройства с включённым крупным шрифтом — это условие прогона, а не отдельное устройство"
    - "Попросить пользователей выключить крупный шрифт"
  correct: 2
  explanation: |
    Крупный шрифт — настройка, которая есть на любом телефоне. Значит,
    это условие прогона: на основных устройствах проверяют с крупным
    шрифтом. Отдельный телефон для этого не нужен, а игнорировать
    настройку почти половины пользователей нельзя.

- id: mob2-06
  type: quiz
  question: Что такое APK и AAB?
  options:
    - "APK — файл приложения Android, его можно поставить на телефон напрямую; AAB — формат для загрузки в Google Play, напрямую не ставится"
    - "APK — для iOS, AAB — для Android"
    - "Это одно и то же, просто разные расширения"
    - "AAB — тестовая сборка, APK — только для магазина"
  correct: 0
  explanation: |
    **APK** (Android Package) — файл приложения: скачал, разрешил
    установку из неизвестных источников, поставил. **AAB** (Android App
    Bundle) загружают в Google Play, и магазин сам собирает из него APK
    под конкретный телефон. Прислали AAB для ручной установки — попроси
    APK или приглашение в Firebase или внутреннее тестирование.

- id: mob2-07
  type: card
  question: Какими способами тестировщик получает сборку на Android?
  answer: |
    - **Файл APK** — в задаче, чате, с CI. Ставится напрямую, нужно
      разрешить установку из неизвестных источников.
    - **Firebase App Distribution** — приглашение по email, новые сборки
      с заметками к выпуску, легко поставить предыдущую.
    - **Внутреннее тестирование Google Play** — приглашение по ссылке,
      установка из самого магазина. Так проверяют установку и обновление
      через магазин, встроенные покупки.

    На эмулятор APK ставят перетаскиванием в окно или командой
    `adb install`.

- id: mob2-08
  type: card
  question: Как тестировщик получает сборку на iOS?
  answer: |
    - **TestFlight** — основной способ. Приглашение по email или ссылке,
      приложение TestFlight на iPhone, оттуда — установка сборки.
      Сборка доступна около 90 дней.
    - **Сборка для симулятора** — `.app` (часто в архиве), её перетаскивают
      в окно симулятора на Mac.
    - **Ad-hoc сборка** — подписана для списка конкретных iPhone, которые
      определяют по UDID (уникальному номеру устройства).

    Просто прислать `.ipa` и поставить его, как APK, нельзя.

- id: mob2-09
  type: quiz
  question: "Хитрый вопрос: через час демо, а TestFlight-сборка пишет «Эта бета-версия больше недоступна». Что вероятнее всего случилось?"
  options:
    - "Apple заблокировала приложение"
    - "Сломался телефон"
    - "Истёк срок сборки — в TestFlight сборка доступна около 90 дней"
    - "Нужно перезагрузить iPhone"
  correct: 2
  explanation: |
    Сборки в TestFlight живут около 90 дней с момента загрузки — это
    правило Apple, а не баг. Перед демо проверяй сборку накануне на том
    самом устройстве. Если «эталонная» сборка нужна надолго — загружай
    её заново до истечения срока.

- id: mob2-10
  type: card
  question: "Хитрый вопрос: почему перед тестированием сборки надо проверить стенд, на который она ходит?"
  answer: |
    В приложении не видно адреса, как в браузере. Сборка может ходить
    на dev, stage или prod — и выглядеть одинаково. Если тестовые заказы
    и оплаты уйдут на prod, это реальные заказы и реальные деньги.

    Как проверить: экран «О приложении», скрытое меню разработчика,
    вопрос команде. Хорошая практика — у тестовых сборок другая иконка
    или подпись и стенд, видный на экране.

- id: mob2-11
  type: card
  question: Как узнать версию и номер сборки установленного приложения?
  answer: |
    - В самом приложении: «Профиль» → «Настройки» → «О приложении».
    - На Android в системе: «Настройки» → «Приложения» → приложение →
      «Версия».
    - В TestFlight и Firebase App Distribution — у каждой сборки.

    Версия (`2.14.0`) — то, что видят пользователи. Номер сборки (`1523`)
    растёт с каждой новой сборкой. В баг-репорт пишут оба.

- id: mob2-12
  type: card
  question: Что такое режим разработчика на Android и что в нём полезно тестировщику?
  answer: |
    Скрытый раздел настроек для отладки. Обычно включается семью
    нажатиями на «Номер сборки» в «О телефоне» — путь зависит от
    производителя.

    Полезное:

    - «Показывать границы элементов» — рамки вокруг кнопок, помогают
      отличить нативный экран от WebView;
    - «Показывать нажатия» — касания видно на записи экрана;
    - «Не сохранять действия» — ловить баги «вернулся — данные пропали»;
    - скорость анимаций;
    - «Отладка по USB» — для adb.

- id: mob2-13
  type: quiz
  question: Что делает команда `adb shell pm clear имя.пакета`?
  options:
    - "Удаляет приложение с телефона"
    - "Очищает данные приложения — оно открывается как после первой установки, но само остаётся"
    - "Очищает кэш браузера"
    - "Перезагружает телефон"
  correct: 1
  explanation: |
    `pm clear` стирает все данные приложения: вход, настройки, сохранённое.
    Само приложение и его версия остаются. Удобно, чтобы быстро пройти
    первый запуск и онбординг ещё раз. Удаление — `adb uninstall`.

- id: mob2-14
  type: card
  question: Какие команды adb пригодятся тестировщику?
  answer: |
    **adb** (Android Debug Bridge) — программа для управления телефоном
    или эмулятором с компьютера.

    - `adb devices` — список подключённых устройств;
    - `adb install app.apk` — поставить; с `-r` — обновить поверх
      с сохранением данных;
    - `adb uninstall имя.пакета` — удалить;
    - `adb shell pm clear имя.пакета` — очистить данные;
    - `adb exec-out screencap -p > screen.png` — скриншот на компьютер;
      `adb shell screenrecord` — запись экрана.

    Для реального телефона нужна «Отладка по USB».

- id: mob2-15
  type: card
  question: Чем отличаются очистка данных, переустановка и сброс устройства? Когда что использовать?
  answer: |
    - **Очистка данных** (Android) — стирает данные приложения, само
      приложение остаётся. Быстро пройти первый запуск, онбординг,
      вход заново.
    - **Удалить и поставить заново** — ещё и сбрасывает разрешения,
      проверяет саму установку. На iOS это единственный способ
      «очистить» приложение.
    - **Сброс устройства** (эмулятор — Wipe Data, симулятор — Erase All
      Content and Settings) — стирает всё. Когда что-то «залипло»
      на уровне системы.

    Обновление поверх старой версии, наоборот, данные сохраняет — это
    отдельная проверка.

- id: mob2-16
  type: quiz
  question: "Хитрый вопрос: на iPhone удалили приложение и поставили заново, а оно всё ещё помнит вход. Это точно баг?"
  options:
    - "Да, после удаления должно стираться всё"
    - "Нет, такого не бывает — значит, удаление не прошло"
    - "Не обязательно: приложение могло сохранить вход в связке ключей (Keychain), она иногда переживает удаление. Надо уточнить, как задумано"
    - "Это баг iOS, а не приложения"
  correct: 2
  explanation: |
    На iOS данные в связке ключей могут пережить удаление приложения.
    Иногда так задумано (удобство), иногда это баг (например, человек
    продал телефон). Тестировщик фиксирует поведение и уточняет у команды.

- id: mob2-17
  type: card
  question: "Хитрый вопрос: экран в WebView на эмуляторе выглядит идеально, а у части пользователей Android вёрстка разъехалась. Почему так бывает?"
  answer: |
    На Android WebView — встроенный браузер, и он обновляется отдельно,
    через Google Play. У части пользователей он старый: телефон старый,
    обновления выключены, нет сервисов Google. На эмуляторе с образом
    Google Play — свежий WebView, а в образе без Google Play он не
    обновляется вовсе.

    Что делать: выяснить модель и версию WebView, воспроизвести на старом
    образе Android или в ферме, добавить такое устройство в матрицу.

- id: mob2-18
  type: card
  question: Что такое облачная ферма устройств и о чём помнить, когда ей пользуешься?
  answer: |
    Ферма — реальные телефоны в чужом дата-центре. Открываешь сайт,
    выбираешь модель, ставишь сборку и управляешь мышкой. Примеры:
    BrowserStack App Live, TestMu AI (бывший LambdaTest), Sauce Labs;
    Firebase Test Lab — в основном для автоматических прогонов.

    О чём помнить:

    - сборка и тестовые учётки уходят третьей стороне — сначала спроси
      разрешение;
    - платно, обычно есть пробный период;
    - сеть — дата-центра, а не мобильная вокруг тебя;
    - телефон не возьмёшь в руки: геолокацию в движении, долгую работу
      в фоне так не проверишь.

- id: mob2-19
  type: quiz
  question: "Хитрый вопрос: у тестировщика нет Mac. Как ему проверить iOS-приложение компании?"
  options:
    - "Запустить симулятор iOS на Windows"
    - "Скачать .ipa и поставить на свой iPhone без TestFlight"
    - "Через TestFlight на iPhone (если компания пригласила) или в облачной ферме на реальном iPhone"
    - "Никак — iOS тестируют только разработчики"
  correct: 2
  explanation: |
    Симулятор iOS работает только на Mac. Поставить `.ipa` на iPhone
    просто так нельзя — нужна подпись под устройство или TestFlight.
    Остаются TestFlight на своём или рабочем iPhone и облачная ферма.

- id: mob2-20
  type: card
  question: Что сделать сразу после установки новой сборки, до начала тестирования?
  answer: |
    1. Сверить версию и номер сборки с заявленными.
    2. Проверить стенд — тестовая сборка не должна ходить на prod.
    3. Прочитать заметки к выпуску: что вошло, что проверить.
    4. Для новой фичи — чистая установка или очистка данных, чтобы
       старые данные не прятали баги.
    5. Выбрать устройства из матрицы: основные — полный прогон,
       остальные — смоук.

- id: mob2-21
  type: quiz
  question: Тестировщик открыл в Android Studio Layout Inspector, подключил телефон со сборкой из Google Play — а приложения в списке нет. Почему?
  options:
    - "Layout Inspector работает только на эмуляторе"
    - "Сборка из магазина без включённой отладки — инструментам закрыта «дверь»; нужна тестовая (debug) сборка"
    - "Нужно сначала включить тёмную тему"
    - "Layout Inspector показывает только WebView"
  correct: 1
  explanation: |
    Layout Inspector, Network Inspector, Database Inspector и Profiler
    работают с отладочной сборкой. Сборка из магазина отладку
    выключает. Решение — попросить у команды тестовую сборку.
