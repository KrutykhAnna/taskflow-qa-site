# Вопросы темы «Перехват трафика». Формат — см. osnovy/bag-report.yaml.

- id: mob9-01
  type: card
  question: Что такое прокси и зачем он тестировщику мобильных приложений?
  answer: |
    **Прокси** — программа-посредник на компьютере, через которую телефон
    отправляет все запросы. В ней видно каждый запрос и ответ, и их можно
    задержать, изменить или подменить.

    Зачем: у мобильного приложения нет DevTools. Без прокси тестировщик
    видит только экран, с прокси — что реально ушло на сервер и что
    пришло в ответ.

- id: mob9-02
  type: card
  question: Зачем перехватывать трафик — какие задачи без прокси не решить?
  answer: |
    - **Понять, кто виноват** — сервер прислал не то или приложение
      показало не то.
    - **Найти лишние данные** — пароль, карта, телефон в аналитике.
    - **Подменить ответ** — пустой список, `500`, длинный текст.
    - **Замедлить один запрос**, а не всю сеть.
    - **Повторить запрос** — проверить дубль.
    - **Направить на другой стенд** — Map Remote.
    - **Доказательство в баг-репорт** — запрос и ответ.

- id: mob9-03
  type: card
  question: Почему для HTTPS нужен сертификат Charles?
  answer: |
    HTTPS шифрует трафик: прокси видит только адрес сервера. Чтобы
    прочитать содержимое, Charles расшифровывает трафик и шифрует заново
    своим сертификатом. Устройство примет такой ответ, только если
    сертификат Charles **установлен и доверен**.

    Плюс в Charles должен быть включён **SSL Proxying** для нужного хоста.

- id: mob9-04
  type: quiz
  question: "Хитрый вопрос: у хоста в Charles вместо путей `<unknown>`, содержимого нет. Что это значит?"
  options:
    - "Сертификат Charles сломан — переустановить"
    - "Для этого хоста не включён SSL Proxying — Charles пропускает HTTPS туннелем"
    - "У приложения SSL pinning"
    - "Сервер не ответил"
  correct: 1
  explanation: |
    `<unknown>` — режим по умолчанию: пока SSL Proxying для хоста не
    включён, Charles не вскрывает HTTPS. Проблема с сертификатом или
    pinning выглядит иначе: запросы падают с ошибкой рукопожатия, а
    приложение пишет «Нет соединения».

- id: mob9-05
  type: card
  question: Как подключить телефон к Charles?
  answer: |
    1. Телефон и компьютер — в одной Wi‑Fi сети.
    2. В настройках Wi‑Fi телефона — **Прокси: вручную**, IP компьютера,
       порт `8888`.
    3. В Charles — **Allow** на запрос подключения.
    4. В браузере телефона — `chls.pro/ssl`, установить сертификат.
    5. iPhone: дополнительно «Об этом устройстве» → «Доверие сертификатам».
    6. В Charles — SSL Proxying для хостов приложения.

    После работы — **Прокси: Нет**, иначе на телефоне не будет интернета.

- id: mob9-06
  type: quiz
  question: Какой адрес прокси указать в эмуляторе Android, если Charles запущен на этом же компьютере?
  options:
    - "localhost:8888"
    - "127.0.0.1:8888"
    - "10.0.2.2:8888"
    - "chls.pro:8888"
  correct: 2
  explanation: |
    Внутри эмулятора `localhost` и `127.0.0.1` — это сам эмулятор.
    Особый адрес `10.0.2.2` ведёт на компьютер, где запущен эмулятор.
    Порт Charles по умолчанию — `8888`.

- id: mob9-07
  type: quiz
  question: "Хитрый вопрос: Chrome на Android через Charles расшифровывается, а приложение с targetSdk 31 — нет. Самая вероятная причина?"
  options:
    - "SSL pinning в приложении"
    - "Charles не поддерживает приложения"
    - "С Android 7 приложения по умолчанию не доверяют сертификатам, установленным пользователем, а Chrome доверяет"
    - "Приложение не ходит в интернет"
  correct: 2
  explanation: |
    Это правило Android 7+ (API 24), а не pinning. Приложение доверяет
    только системным сертификатам. Решение — debug-сборка с
    `network_security_config`: `debug-overrides` → `<certificates src="user"/>`.
    Pinning подозревают, когда доверие в сборке точно есть, а соединение
    всё равно рвётся.

- id: mob9-08
  type: card
  question: Что такое SSL pinning и что делает тестировщик, если он мешает?
  answer: |
    **SSL pinning** — приложение знает настоящий сертификат своего
    сервера «в лицо» и отвергает любой другой, даже доверенный телефоном.
    Защита от того, кто посередине.

    Тестировщик:
    - сначала исключает простые причины — SSL Proxying, доверие,
      правило Android 7+;
    - просит у команды **сборку без pinning** для теста;
    - чужие приложения не «взламывает»;
    - в релизной сборке проверяет, что pinning **работает** — трафик
      через Charles не расшифровывается.

- id: mob9-09
  type: card
  question: Чем отличаются Breakpoints, Map Local, Map Remote и Rewrite?
  answer: |
    - **Breakpoints** — остановить запрос или ответ и поправить
      **руками** один раз.
    - **Map Local** — отдать вместо ответа сервера **свой файл**.
    - **Map Remote** — перенаправить запрос на **другой адрес** или стенд.
    - **Rewrite** — **постоянное правило** замены: код ответа, заголовок,
      текст в теле.

- id: mob9-10
  type: quiz
  question: "Нужно проверить экран «Заказов нет», а у всех тестовых аккаунтов есть заказы. Какой инструмент Charles подходит лучше всего?"
  options:
    - "Throttle"
    - "Map Local с файлом пустого ответа"
    - "Repeat"
    - "Block Cookies"
  correct: 1
  explanation: |
    Map Local отдаёт приложению твой файл вместо ответа сервера — например,
    `[]` по структуре настоящего пустого ответа. Данные на стенде менять
    не нужно. В баг-репорте указывают, что ответ подменён, и прикладывают
    файл.

- id: mob9-11
  type: quiz
  question: "Хитрый вопрос: через Rewrite поменяли код ответа 200 на 500, тело не трогали. Экран показал странное. Это баг приложения?"
  options:
    - "Да, приложение обязано выдерживать любой ответ"
    - "Нет: такого ответа сервер никогда не пришлёт — нужна правдоподобная подмена: код и тело ошибки по спецификации"
    - "Нет, Rewrite не умеет менять код"
    - "Да, критичный"
  correct: 1
  explanation: |
    Приложение читает не только код, но и тело: текст и код ошибки.
    Код `500` с телом успешного ответа — невозможная ситуация, экран
    ломается иначе, чем при настоящей ошибке. Подменяют код **и тело**
    (Rewrite с правилом Body, Breakpoints) и честно пишут о подмене в
    баг-репорте.

- id: mob9-12
  type: card
  question: Чем Throttle в Charles удобнее медленной сети в эмуляторе?
  answer: |
    Эмулятор замедляет **всю** сеть устройства. Charles может замедлить
    **один хост** (Only for selected hosts), а остальное оставить быстрым.

    Так проверяют, что один медленный запрос — например, рекомендации —
    не «вешает» весь экран, есть спиннер, таймаут и нет двойного тапа.

- id: mob9-13
  type: card
  question: Как через Charles проверить, что повтор запроса не создаёт дубль?
  answer: |
    1. Пройти действие — например, оформить заказ на тестовом стенде.
    2. Найти `POST` в Charles → **Repeat** (или Repeat Advanced —
       несколько раз).
    3. Проверить **на сервере** — вторым запросом, в админке, в базе:
       один заказ или два.

    Ожидание для денег и заказов: повтор не создаёт второй объект.
    Только на своём или учебном стенде.

- id: mob9-14
  type: quiz
  question: "Хитрый вопрос: прокси на телефоне настроен верно, другие приложения в Charles видны, а Flutter-приложение — ни одного запроса. Почему?"
  options:
    - "Приложение не ходит в сеть"
    - "Не включён SSL Proxying"
    - "Сетевой код Flutter (Dart) не берёт системный прокси — нужна настройка прокси в debug-сборке"
    - "Charles не поддерживает Android"
  correct: 2
  explanation: |
    Без SSL Proxying запросы всё равно были бы видны как туннели с
    `<unknown>`. Полное отсутствие значит, что приложение идёт мимо
    системного прокси. У Flutter это известная особенность —
    разработчики прописывают прокси в тестовой сборке.

- id: mob9-15
  type: card
  question: Как WebView-экран ведёт себя с прокси и сертификатом?
  answer: |
    WebView — встроенный браузер: трафик идёт через прокси из настроек
    Wi‑Fi, как у браузера.

    Доверие сертификату на Android WebView берёт из настроек **самого
    приложения**: если приложение не доверяет пользовательским
    сертификатам, WebView-экран тоже может не расшифроваться. Мобильный
    сайт в Chrome — расшифровывается.

- id: mob9-16
  type: card
  question: Почему трафик localhost может не появиться в Charles и что делать?
  answer: |
    Браузеры и системы ходят на `localhost` мимо прокси.

    Документация Charles советует адрес `localhost.charlesproxy.com` —
    он ведёт на тот же компьютер (`127.0.0.1`), но идёт через прокси.
    Порт пишется как обычно: `localhost.charlesproxy.com:3000`.

    Если фронт сам ходит на зашитый `localhost:8000`, эти запросы всё
    равно пойдут мимо Charles.

- id: mob9-17
  type: quiz
  question: "Хитрый вопрос: на телефоне `500`, а в логах сервера все ответы `200`. Что проверить первым?"
  options:
    - "Сразу завести баг на сервер"
    - "Перезагрузить телефон"
    - "Свой прокси: не осталось ли включённых правил Rewrite, Map Local, Map Remote, Breakpoints"
    - "Переустановить приложение"
  correct: 2
  explanation: |
    Расхождение «на устройстве одно, на сервере другое» — признак, что
    ответ меняется по дороге. Чаще всего — забытое правило в прокси.
    Потом повторить запрос без прокси, например в Postman.

- id: mob9-18
  type: card
  question: Что писать в баг-репорте, если баг найден с помощью Charles?
  answer: |
    - **Запрос и ответ** — адрес, метод, код, нужная часть тела; при
      необходимости — сессия `.chls` или HAR.
    - **Без токенов и паролей** — `Authorization`, cookie, пароль
      заменить на `***`.
    - **Была ли подмена** и какая: «ответ подменён через Map Local,
      файл приложен».
    - Устройство, ОС, версия сборки.

- id: mob9-19
  type: quiz
  question: "Хитрый вопрос: в Charles виден пароль открытым текстом в теле POST /login по HTTPS. Это баг?"
  options:
    - "Да, пароль никогда не должен быть виден"
    - "Нет: HTTPS защищает по дороге, а Charles видит, потому что ты сам доверил ему сертификат. Баг — пароль в адресе, по HTTP, в аналитике или в ответе"
    - "Да, HTTPS сломан"
    - "Нет, пароли в мобильных приложениях не шифруют"
  correct: 1
  explanation: |
    Серверу нужен пароль, чтобы проверить его, — в теле запроса входа по
    HTTPS это норма. Charles посередине по твоей воле. Риск — пароль в
    URL (попадает в логи), по HTTP без шифрования, в сторонних сервисах
    или в ответе сервера.

- id: mob9-20
  type: card
  question: Какие правила безопасности и этики при перехвате трафика?
  answer: |
    - Только **свой** трафик: свои и тестовые приложения, свои стенды.
    - Сертификат Charles — на тестовое устройство; с личного телефона
      **удалить** после работы.
    - Обход SSL pinning чужих приложений — не задача тестировщика.
    - Сессии и HAR содержат токены и личные данные — не выкладывать в
      общие чаты, чистить перед отправкой.
    - Выключить прокси на телефоне после работы.

- id: mob9-21
  type: card
  question: Какие есть альтернативы Charles?
  answer: |
    - **Proxyman** — macOS (есть Windows и Linux), удобный; бесплатная
      пробная версия с ограничениями.
    - **Fiddler** — Classic для Windows, Fiddler Everywhere — для всех
      систем, платный.
    - **mitmproxy** — бесплатный, консольный, открытый код.
    - **HTTP Toolkit** — есть бесплатная версия.
    - **Network Inspector** в Android Studio — без прокси, но только
      отладочная сборка Android и не все запросы.
