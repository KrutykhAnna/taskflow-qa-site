# Вопросы темы «Мобильная вёрстка и интерфейс». Формат — см. osnovy/bag-report.yaml.

- id: mob7-01
  type: card
  question: Чем проверка вёрстки в мобилке отличается от веба?
  answer: |
    В вебе ширину окна меняешь сам. В мобилке «окно» задаёт телефон:
    сотни размеров экранов, вырезы и закругления, системные панели,
    клавиатура на полэкрана, системные настройки человека — крупный
    шрифт, тёмная тема, язык.

    Поэтому вёрстку проверяют не на одном «среднем» телефоне, а на
    крайних случаях: самый маленький экран, максимальный шрифт,
    открытая клавиатура, тёмная тема, оба режима навигации Android.

- id: mob7-02
  type: card
  question: Зачем тестировать мобильную вёрстку — чем грозит баг?
  answer: |
    - **Кнопка под клавиатурой или полоской жестов** — заказ не
      оформить, потеря денег.
    - **Текст обрезан при крупном шрифте** — человек не видит сумму.
    - **Элемент под вырезом** — не прочитать, не нажать «Назад».
    - **Маленький экран** — «Далее» за краем, человек уходит.
    - **Тёмная тема** — тёмный текст на тёмном фоне, поле «пустое».
    - **Непривычные элементы** — человек не понимает, что нажимать.

- id: mob7-03
  type: card
  question: Что такое px, pt, dp и sp?
  answer: |
    - **px** — физическая точка экрана. Скриншот всегда в px.
    - **pt** (iOS) и **dp** (Android) — логические единицы: элемент
      одного размера в pt/dp выглядит примерно одинаково на любом
      экране.
    - **sp** (Android) — как dp, но для текста: растёт вместе с
      системным размером шрифта.

    Связь: `px = pt × плотность` (iOS @2x, @3x) и `px = dp × dpi / 160`
    (Android).

- id: mob7-04
  type: quiz
  question: "Хитрый вопрос: в макете кнопка 48 dp, на скриншоте с телефона xxhdpi она 144 px. Что это?"
  options:
    - "Баг: кнопка в три раза больше макета"
    - "Не баг: xxhdpi — плотность × 3, 48 × 3 = 144"
    - "Баг: dp и px должны совпадать"
    - "Нельзя сказать без Figma"
  correct: 1
  explanation: |
    Скриншот в физических px, макет — в dp. У xxhdpi (около 480 dpi)
    плотность 480 ÷ 160 = 3. Перед сравнением px делят на плотность —
    или уменьшают скриншот до размера фрейма в Figma.

- id: mob7-05
  type: card
  question: Как наложить скриншот с телефона на макет, если PerfectPixel на телефоне нет?
  answer: |
    1. Снять скриншот на устройстве того же размера, что фрейм макета
       (кнопками телефона, кнопкой эмулятора, ⌘S в симуляторе или
       `adb exec-out screencap -p > screen.png`).
    2. Вставить в Figma поверх фрейма.
    3. Уменьшить до размера фрейма — то есть разделить на плотность
       (1179 × 2556 → 393 × 852).
    4. Прозрачность 50%, совместить угол — расхождения видны
       «двоением».

    На Android то же умеет Layout Inspector: Load Overlay и ползунок
    прозрачности.

- id: mob7-06
  type: card
  question: Что такое Layout Inspector и что в нём смотрит тестировщик?
  answer: |
    Инструмент Android Studio — аналог Elements в DevTools для
    приложения. Работает с отладочной сборкой.

    Открывается из окна Running Devices кнопкой Toggle Layout
    Inspector. Слева — дерево элементов (Component Tree), в центре —
    экран, справа — свойства (Attributes).

    Что смотрят: размеры и отступы в dp, размер и цвет текста, тип
    ввода поля, видимость, что поверх чего; рамки (Show Borders);
    наложение макета (Load Overlay). WebView в дереве — один элемент:
    его внутренности смотрят веб-инструментами.

- id: mob7-07
  type: quiz
  question: "Хитрый вопрос: ты открыл в Layout Inspector экран акции, а в дереве один элемент WebView без вложенных элементов. Что это значит?"
  options:
    - "Layout Inspector сломался — нужно переустановить Android Studio"
    - "Экран пустой — баг"
    - "Это веб-страница внутри приложения: её вёрстку смотрят через chrome://inspect (или Safari «Разработка» на iOS)"
    - "Приложение собрано не в отладочном режиме"
  correct: 2
  explanation: |
    Layout Inspector показывает нативные элементы. WebView для него —
    один «чёрный ящик». Внутри обычная веб-страница: её дерево, размеры
    и стили видно в DevTools через удалённую отладку.

- id: mob7-08
  type: card
  question: Что такое Debug View Hierarchy и почему тестировщик пользуется им редко?
  answer: |
    Инструмент Xcode: дерево элементов экрана iOS-приложения,
    разобранное по слоям в 3D, с размерами и свойствами. Запускается
    кнопкой на панели отладки или Debug → View Debugging → Capture
    View Hierarchy.

    Работает, только когда приложение запущено из Xcode — нужен
    проект с исходным кодом. Сборку из TestFlight так не посмотреть.
    Поэтому iOS-вёрстку тестировщик чаще проверяет наложением
    скриншота и на крайних устройствах.

- id: mob7-09
  type: card
  question: Как выбрать экраны для проверки вёрстки?
  answer: |
    - Самый маленький поддерживаемый (iPhone SE, Android ~360 dp).
    - Обычный, популярный по аналитике.
    - Самый большой (Pro Max, большой Android).
    - С вырезом и без (SE с кнопкой «Домой»).
    - Android: навигация кнопками и жестами.
    - Планшет и горизонталь — если заявлены; складные — если в
      списке поддерживаемых.

- id: mob7-10
  type: card
  question: Какие системные настройки ломают вёрстку?
  answer: |
    - Размер шрифта на максимум (iOS «Увеличенный текст», Android
      «Размер шрифта»).
    - Масштаб интерфейса (Android «Масштаб изображения», iOS «Вид —
      Увеличенный»).
    - Жирный шрифт.
    - Тёмная тема.
    - Язык с длинными словами (немецкий) и справа налево (арабский).
    - Уменьшение движения.

    Менять их стоит и на ходу, с открытым приложением: на Android
    экран при этом пересоздаётся и может потерять данные.

- id: mob7-11
  type: quiz
  question: "Хитрый вопрос: ты включил шрифт × 2, а экран приложения не изменился — ничего не обрезано. Какой вывод?"
  options:
    - "Всё отлично: вёрстка устойчива к крупному шрифту"
    - "Подозрительно: текст, скорее всего, не масштабируется (на Android размер в dp вместо sp) — проблема доступности"
    - "Настройка не применилась, надо перезагрузить телефон"
    - "Так всегда: приложения не обязаны реагировать на шрифт"
  correct: 1
  explanation: |
    Если ничего не изменилось, вероятно, приложение игнорирует
    системный размер шрифта. Вёрстка цела, но человек со слабым
    зрением не может увеличить текст. Проверка — размер текста в
    Layout Inspector и сравнение со встроенными приложениями.

- id: mob7-12
  type: card
  question: Что такое безопасная зона (safe area)?
  answer: |
    Часть экрана, где контенту ничего не мешает: статус-бар, вырез
    («чёлка», Dynamic Island), закругления углов, полоска жестов iOS,
    навигационная панель Android.

    Кнопки и текст должны быть внутри неё; фон и картинки могут
    уходить под края. Проверяют на устройствах с вырезом и без, в обоих
    режимах навигации Android, в горизонтали (там вырез сбоку). На
    новых Android приложения рисуются от края до края — отступы
    должно делать само приложение.

- id: mob7-13
  type: quiz
  question: "Хитрый вопрос: жалобы «нажимаю „Подтвердить“ внизу экрана — приложение сворачивается». Только у части пользователей. Что вероятнее всего?"
  options:
    - "Приложение падает при нажатии"
    - "Кнопка заходит под полоску жестов или жестовую навигацию — нажатие ловит система"
    - "У пользователей слабые телефоны"
    - "Пользователи нажимают кнопку «Домой»"
  correct: 1
  explanation: |
    Внизу экрана — системная зона жестов. Если кнопка уходит под неё,
    свайп или нажатие у края перехватывает система и сворачивает
    приложение. Проверяют на iPhone с полоской и без, на Android с
    жестами и тремя кнопками.

- id: mob7-14
  type: card
  question: Что проверить у клавиатуры на экране с формой?
  answer: |
    - Поле, в которое печатаешь, не закрыто клавиатурой.
    - До кнопки «Далее»/«Оплатить» можно долистать, не закрывая
      клавиатуру.
    - Правильный тип: email — с `@`, телефон, код, индекс — цифры,
      пароль — без подсказок.
    - Клавиша действия: «Далее» в следующее поле, на последнем —
      «Готово».
    - Код из СМС подставляется.
    - На Android «Назад» сначала закрывает клавиатуру, а не экран.
    - Высокие сторонние клавиатуры не прячут кнопку.

- id: mob7-15
  type: quiz
  question: "Какой минимальный размер области касания рекомендуют гайдлайны платформ?"
  options:
    - "iOS — 24 × 24 pt, Android — 24 × 24 dp"
    - "iOS — 44 × 44 pt, Android — 48 × 48 dp"
    - "Обе — 44 × 44 px"
    - "Обе — 100 × 100 px"
  correct: 1
  explanation: |
    Human Interface Guidelines (Apple) — 44 × 44 pt, Material Design
    (Google) — 48 × 48 dp. Область касания может быть больше видимой
    иконки — проверяют её, а не картинку («Показывать границы»,
    Layout Inspector).

- id: mob7-16
  type: card
  question: Какие жесты проверяют на мобильном экране?
  answer: |
    - Тап — маленькие кнопки нажимаются, соседние не путаются.
    - Свайп назад от края (iOS) — не конфликтует с каруселью.
    - Свайп по списку и карусели — не срабатывает случайно.
    - Долгое нажатие — меню, а не обычный тап.
    - Потянуть вниз для обновления — работает только сверху списка.
    - Двойной тап, увеличение двумя пальцами — где задумано.
    - Мультитач — две кнопки одновременно не дают два заказа.

- id: mob7-17
  type: quiz
  question: "Хитрый вопрос: в кросс-платформенном приложении на iPhone переключатели выглядят «по-андроидному». Это баг?"
  options:
    - "Да, всегда — на iOS должны быть только элементы iOS"
    - "Нет, никогда — внешний вид не тестируют"
    - "Не обязательно: единый дизайн может быть решением команды. Баг — если элемент ведёт себя непривычно и мешает"
    - "Да, если приложение написано на Flutter"
  correct: 2
  explanation: |
    Многие команды делают один дизайн на обе платформы — это вопрос
    дизайнеру. Баг — когда не работает привычное поведение: свайп
    назад, «Назад» не там, переключатель не переключается свайпом.
    Системные окна (разрешения, «Поделиться») задаёт ОС — там «не как
    на платформе» быть не должно.

- id: mob7-18
  type: card
  question: Как WebView-экран и тип приложения влияют на проверку вёрстки?
  answer: |
    - **Нативное** — свои системные элементы на iOS и Android,
      проверять обе платформы; инструменты — границы, Layout Inspector,
      Debug View Hierarchy.
    - **Кросс-платформенное** — элементы «не как на платформе»; ошибка
      в общем коде сразу на обеих платформах.
    - **WebView-экран** — вёрстку внутри смотрят через `chrome://inspect`
      или Safari «Разработка»; плюс мобильное: вырез, полоска жестов,
      клавиатура, системный шрифт и тёмная тема (часто игнорируются).
    - **Мобильный сайт и PWA** — веб целиком, но на настоящем телефоне.

- id: mob7-19
  type: card
  question: Что считать багом вёрстки на мобилке, а что — нет?
  answer: |
    - Сдвиг 1–2 pt, чуть другой оттенок — обычно не баг (если нет
      договорённости о pixel perfect).
    - Обрезанный текст, потерявший смысл, — баг.
    - Кнопка под клавиатурой, полоской жестов, вырезом — баг, часто
      высокий приоритет.
    - Налезание элементов — баг.
    - Область касания меньше 44 pt / 48 dp — баг, обычно некритичный.
    - «Не как на платформе», растянуто на большом экране, нет случая в
      макете — вопрос дизайнеру.

- id: mob7-20
  type: card
  question: Что написать в баг-репорте по мобильной вёрстке?
  answer: |
    - Модель, размер экрана в pt или dp, плотность.
    - Версии ОС и приложения.
    - Ориентация.
    - Системные настройки: шрифт, жирный, масштаб, тема, язык, режим
      навигации Android.
    - Путь к экрану и данные (длинное имя, большая сумма).
    - Скриншот и макет рядом или наложение; для клавиатуры и жестов —
      видео.
    - Ожидание со ссылкой на макет или гайдлайн.
