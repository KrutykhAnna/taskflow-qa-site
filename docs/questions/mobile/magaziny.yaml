# Вопросы темы «Магазины приложений: что проверяют перед публикацией». Формат — см. osnovy/bag-report.yaml.

- id: mob12-01
  type: card
  question: Зачем тестировщику знать правила App Store и Google Play?
  answer: |
    Ревьюер магазина проходит приложение как пользователь — почти
    все причины отказа видны тестировщику раньше.

    Чем грозит незнание правил:
    - **отказ на ревью** — релиз сдвигается на дни, больнее всего на срочном фиксе;
    - **удаление из магазина** или блокировка обновлений;
    - **анкета о данных не совпадает** с поведением — требование исправить, вплоть до удаления;
    - **плохие показатели падений** — приложение хуже показывается в поиске Google Play.

    Тестировщик проходит чек-лист «пройдёт ли ревью» до отправки.

- id: mob12-02
  type: card
  question: Какой путь проходит сборка от сервера сборки до всех пользователей?
  answer: |
    1. **Сборка** на сервере сборки.
    2. **Внутреннее тестирование** — TestFlight для команды; внутренний трек Google Play.
    3. **Закрытое / открытое** — внешние тестировщики TestFlight (после бета-ревью);
       закрытый и открытый треки Google Play.
    4. **Ревью** магазина.
    5. **Публикация**.
    6. **Поэтапная раскатка** — phased release у Apple, staged rollout у Google.

    Самое дешёвое место найти проблему — до отправки на ревью.

- id: mob12-03
  type: quiz
  question: Чем внешние тестировщики TestFlight отличаются от внутренних?
  options:
    - "Ничем, это одно и то же"
    - "Сборка для внешних сначала проходит бета-ревью Apple"
    - "Внешним сборка приходит файлом IPA"
    - "Внешние тестировщики могут быть только сотрудниками Apple"
  correct: 1
  explanation: |
    Внутренние тестировщики — члены команды в App Store Connect, им
    сборка доступна без проверки. Внешние — кто угодно по приглашению
    или публичной ссылке, и сборка для них сначала проходит **бета-ревью**
    (упрощённую проверку Apple). Значит, и тут возможен отказ и задержка.

- id: mob12-04
  type: card
  question: Назови частые причины отказа на ревью App Store.
  answer: |
    - **Недоделки (2.1):** падения, заглушки «Coming soon», мёртвые кнопки, битые ссылки.
    - **Ревьюер не вошёл (2.1):** демо-учётка не работает, нужен SMS-код.
    - **Разрешения (5.1.1):** без объяснения или лишние.
    - **Нет удаления аккаунта (5.1.1 (v))**, хотя регистрация есть.
    - **Цифровые товары в обход встроенных покупок (3.1.1).**
    - **Вход только через Google или соцсети (4.8)** без равноценного варианта.
    - **Нет политики конфиденциальности (5.1.1 (i))** или ссылка битая.
    - **Просто сайт в обёртке (4.2).**
    - **Скриншоты и описание** не соответствуют приложению (2.3).

    Номера — на момент написания; правила меняются.

- id: mob12-05
  type: card
  question: "Хитрый вопрос: демо-учётку для ревьюера проверили — входит. Почему ревьюер всё равно может не войти?"
  answer: |
    Проверили, скорее всего, **не там**:
    - на тестовом стенде, а ревьюер входит на **боевом** сервере;
    - со своего телефона, а у ревьюера — новое устройство и другая страна:
      срабатывает защита от подозрительных входов;
    - учётку удалила ночная чистка тестовых данных;
    - нужен код из SMS на номер, которого у ревьюера нет.

    Проверять надо на той же сборке, на боевом сервере, с чистого
    телефона — и прямо перед отправкой. И у учётки должны быть данные,
    на которых видна функция.

- id: mob12-06
  type: quiz
  question: Приложение доставки продуктов принимает оплату заказа банковской картой на своём экране. Что скажет Apple?
  options:
    - "Отклонит: любые покупки — только через встроенные покупки"
    - "Одобрит: физические товары оплачивают обычными способами"
    - "Одобрит, только если цена в приложении выше, чем на сайте"
    - "Отклонит, если нет Apple Pay"
  correct: 1
  explanation: |
    Встроенные покупки (IAP) обязательны для **цифровых** товаров:
    подписки, премиум-функции, внутренняя валюта (правило 3.1.1).
    Физические товары и услуги, которые потребляются вне приложения,
    оплачивают обычными способами — картой или Apple Pay (3.1.3 (e)).
    У Google похожее разделение. Правила меняются, в некоторых странах
    есть исключения — уточняй актуальную версию.

- id: mob12-07
  type: card
  question: "Хитрый вопрос: подписка «Премиум» оплачивается на странице сайта, открытой в WebView внутри приложения. Это же сайт, а не приложение — правила магазина не действуют?"
  answer: |
    Действуют. Для ревьюера и для правил WebView-экран — часть
    приложения. Продажа **цифрового** (подписка, премиум) по карте
    внутри приложения — обход встроенных покупок: отказ по 3.1.1 у Apple
    и нарушение политики платежей Google.

    Есть региональные исключения и особые случаи — это решает команда
    по актуальным правилам. Задача тестировщика — заметить, **что именно**
    продаётся на WebView-экране, и поднять вопрос до отправки.

- id: mob12-08
  type: card
  question: Что требуют Apple и Google про удаление аккаунта?
  answer: |
    Если в приложении можно **создать** аккаунт, его должно быть можно
    **удалить внутри приложения** — а не только «напишите в поддержку».

    - **Apple** — правило 5.1.1 (v).
    - **Google** — путь удаления в приложении **и** веб-ссылка, где можно
      попросить удаление без установки приложения; в анкете Data safety —
      вопросы про удаление.

    Что проверить: путь найти легко; удаление доходит до конца; что
    с подписками и заказами; после удаления нельзя войти старыми данными.
    Удаление приложения — это не удаление аккаунта.

- id: mob12-09
  type: card
  question: "Хитрый вопрос: в iOS-приложении есть только вход через Google. Нужно ли что-то ещё?"
  answer: |
    Скорее всего, да. Правило Apple 4.8: если основной аккаунт создаётся
    или входит через сторонний сервис (Google, Facebook и т. п.), нужен
    **ещё один равноценный вариант**: собирает только имя и email,
    позволяет скрыть email, не отслеживает для рекламы без согласия.
    На практике обычно — **Sign in with Apple**.

    Есть исключения: только свой логин и пароль, корпоративные
    и учебные приложения с существующими учётками, государственные ID
    и другие. Проверяй актуальный текст правила.

- id: mob12-10
  type: card
  question: Что такое анкеты о данных (App Privacy, Data safety) и как их проверяет тестировщик?
  answer: |
    Это раздел в карточке магазина: какие данные приложение собирает,
    зачем и кому передаёт. У Apple — «Конфиденциальность приложения»
    («этикетки»), у Google — «Безопасность данных». Заполняет команда,
    включая данные **сторонних библиотек**.

    Как проверить:
    - перехватить трафик (Charles, Proxyman) — что уходит на сервер
      и **в сторонние сервисы**;
    - сверить разрешения в манифесте и в приложении;
    - спросить список библиотек: аналитика, реклама, сборщики падений.

    Расхождение — баг с высокой серьёзностью: риск блокировки
    обновлений и удаления.

- id: mob12-11
  type: quiz
  question: "В анкете Data safety: «местоположение не передаётся третьим лицам». В Charles видно, что координаты уходят в сторонний сервис аналитики. Что это?"
  options:
    - "Нормально: аналитика — это не третьи лица"
    - "Баг: поведение не совпадает с анкетой, риск для приложения в магазине"
    - "Вопрос только к юристам, тестировщика не касается"
    - "Не баг, если пользователь дал разрешение на геолокацию"
  correct: 1
  explanation: |
    Анкета — обещание пользователю, и в неё входят данные, которые
    собирают сторонние библиотеки. Разрешение на геолокацию не делает
    передачу в аналитику «честной» — анкета должна её описывать.

    Оформляем баг-репорт: что в анкете, какой запрос и какие поля уходят,
    версия сборки. Решает команда: убрать передачу или исправить анкету.

- id: mob12-12
  type: card
  question: Что проверить в карточке приложения в магазине?
  answer: |
    - **Название и иконка** — совпадают с приложением.
    - **Скриншоты** — текущая версия, все языки и размеры (iPad, планшеты),
      приложение в работе, без чужой платформы.
    - **Описание** — всё обещанное есть в приложении.
    - **«Что нового»** — про этот релиз, на всех языках.
    - **Возрастной рейтинг** — соответствует содержимому.
    - **Ссылки** — поддержка, сайт, политика конфиденциальности открываются.
    - **Анкета о данных** — совпадает с поведением.

- id: mob12-13
  type: card
  question: Что такое target API level на Android и почему это важно для релиза?
  answer: |
    **Target API level** (`targetSdkVersion`) — под какую версию Android
    собрано приложение. Google Play требует свежий уровень: на момент
    написания — с 31 августа 2026 новые приложения и обновления должны
    быть собраны под Android 16 (API 36) или выше. Старые приложения
    со слишком низким уровнем перестают быть видны новым пользователям
    на свежих телефонах.

    Для тестировщика:
    - со старым уровнем сборку просто **не загрузить** в консоль;
    - поднятие уровня меняет поведение (разрешения, фон, уведомления) —
      это **большой регресс**.

    Цифры меняются каждый год — проверяй актуальное требование.

- id: mob12-14
  type: card
  question: Как проверить размер приложения в APK Analyzer и что искать?
  answer: |
    Android Studio → **Build → Analyze APK…** (или перетащить APK в окно).

    - **Raw File Size** — сколько часть весит внутри APK.
    - **Download Size** — сколько примерно скачает человек из Google Play.

    Отсортировать по размеру, раскрыть самое тяжёлое: обычно картинки
    (`res`, `assets`), нативные библиотеки (`lib`), код (`classes.dex`).
    **Compare with previous APK…** — что выросло с прошлого релиза.

    Ищем: заметный рост без объяснения, огромные картинки и видео,
    тестовые файлы в релизе.

- id: mob12-15
  type: quiz
  question: Как устроен phased release в App Store (на момент написания)?
  options:
    - "Сразу всем пользователям, но в разных странах по очереди"
    - "7 дней: от 1% до 100% пользователей с автообновлением, можно поставить на паузу"
    - "Процент выбирает команда, сам он не растёт"
    - "Только для тестировщиков TestFlight"
  correct: 1
  explanation: |
    У Apple phased release идёт 7 дней: 1% → 2% → 5% → 10% → 20% → 50% → 100%
    тех, у кого включено автообновление. Паузу можно ставить (в сумме до
    30 дней). Вручную обновиться из магазина может любой.

    Вариант «процент выбирает команда» — это staged rollout у Google.

- id: mob12-16
  type: card
  question: "Хитрый вопрос: раскатку поставили на паузу. У тех, кто уже обновился, баг исчез?"
  answer: |
    Нет. Пауза (у Apple) или остановка раскатки (halt у Google) только
    **перестаёт раздавать** версию новым людям. У тех, кто уже обновился,
    версия остаётся — и баг тоже. Откатить мобильное приложение нельзя.

    Им поможет только новая сборка с исправлением (опять через ревью)
    или исправление на сервере и выключение функции фича-флагом, если
    так можно. Поэтому пауза — чем раньше, тем лучше.

- id: mob12-17
  type: card
  question: Что такое Android vitals и при чём тут тестировщик?
  answer: |
    **Android vitals** — раздел Google Play Console: доля пользователей
    с падениями (**crash rate**) и с зависаниями «приложение не отвечает»
    (**ANR rate**).

    У Google есть **пороги плохого поведения** — в среднем и на отдельную
    модель телефона. Превысил — Google может хуже показывать приложение
    в магазине и показать предупреждение в карточке.

    Тестировщик смотрит vitals после релиза и во время раскатки —
    **по версиям ОС и моделям**, а не только в среднем, — и предлагает
    паузу, если показатели растут.

- id: mob12-18
  type: card
  question: Как разбирать отзывы 1★ после релиза?
  answer: |
    1. **Сгруппировать** — одинаковые жалобы у многих = баг, а не настроение.
    2. **Версия и устройство** — консоль магазина показывает их у отзыва.
    3. **Воспроизвести** на похожем устройстве и версии ОС.
    4. **Сверить** со сборщиком падений и Android vitals.
    5. **Баг-репорт** со ссылкой на отзывы: сколько, за какой период.
    6. **Ответить** через поддержку, когда исправят.

    Отделять баги от вопросов и мнений: «верните старый дизайн» — не баг,
    а обратная связь для продукта.

- id: mob12-19
  type: card
  question: "Хитрый вопрос: в приложении нет регистрации, вход только готовыми учётками, магазин продаёт футболки. Нужны ли удаление аккаунта и встроенные покупки?"
  answer: |
    Скорее всего, нет — и это тоже результат проверки.

    - **Удаление аккаунта** требуется, если аккаунт можно **создать**
      в приложении. Нет регистрации — требование не срабатывает.
    - **Встроенные покупки** нужны для цифровых товаров. Футболки —
      физический товар, их продают обычной оплатой.

    Чек-лист не применяют вслепую: к каждому пункту — вопрос «а у нас это
    есть?». Но политика конфиденциальности нужна всегда.

- id: mob12-20
  type: card
  question: Как магазины относятся к приложениям на WebView и к PWA?
  answer: |
    - **«Просто сайт в обёртке»** — Apple может отклонить по 4.2
      Minimum Functionality: приложение должно давать больше сайта.
    - **WebView-экраны** проверяются по тем же правилам, что и нативные:
      заглушки, оплата цифрового по карте, данные в анкете.
    - **Содержимое WebView** меняется без ревью — но правила магазина
      действуют и после публикации.
    - **PWA и мобильный сайт** в магазин не попадают и ревью не проходят.
      На Android PWA можно упаковать в приложение через TWA
      (Trusted Web Activity) — тогда это уже приложение со всеми правилами.
