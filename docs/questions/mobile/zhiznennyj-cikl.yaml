# Вопросы темы «Жизненный цикл и прерывания». Формат — см. osnovy/bag-report.yaml.

- id: mob3-01
  type: card
  question: В каких состояниях может находиться мобильное приложение?
  answer: |
    - **На экране** (foreground) — пользователь с ним работает.
    - **В фоне** (background) — свёрнуто, процесс ещё жив.
    - **Выгружено системой** — процесса нет, но в «недавних»
      приложение видно.
    - **Закрыто пользователем** — смахнул из «недавних».
    - **Не запущено** — после перезагрузки телефона.

    Для пользователя «в фоне» и «выгружено» выглядят одинаково,
    поэтому их проверяют отдельно.

- id: mob3-02
  type: quiz
  question: "Хитрый вопрос: тестировщик свернул приложение, сразу вернулся — данные формы на месте. Что это доказывает?"
  options:
    - "Что приложение никогда не теряет данные при прерываниях"
    - "Только что данные переживают тёплый запуск; после выгрузки из памяти они могут пропасть — это отдельная проверка"
    - "Что приложение сохраняет данные на сервере"
    - "Что выгрузку из памяти можно не проверять на iOS"
  correct: 1
  explanation: |
    При быстром возврате процесс жив и всё лежит в памяти — это тёплый
    запуск. Если система выгрузила приложение, будет холодный запуск,
    и данные сохранятся, только если приложение их специально сохранило.
    Выгрузку вызывают нарочно: «Не сохранять действия», лимит фоновых
    процессов или `adb shell am kill`.

- id: mob3-03
  type: card
  question: Чем холодный запуск отличается от тёплого?
  answer: |
    - **Тёплый** — возврат из фона, процесс жив: экран появляется сразу,
      всё на месте.
    - **Холодный** — процесс запускается с нуля: первый запуск, после
      выгрузки системой, после закрытия пользователем, после перезагрузки.
      Видна заставка, идёт загрузка.

    После выгрузки приложение должно восстановить экран и данные. После
    закрытия пользователем — честно начать с нуля. Мелькнула заставка при
    возврате — значит, приложение выгружали.

- id: mob3-04
  type: card
  question: Какие прерывания проверяют в мобильном приложении?
  answer: |
    - входящий звонок, СМС, уведомление сверху;
    - сворачивание и возврат, переход в другое приложение и возврат
      через «недавние»;
    - блокировка экрана;
    - будильник, таймер;
    - низкий заряд и системное предупреждение;
    - подключение и отключение наушников, Bluetooth;
    - поворот экрана;
    - смена темы, языка, размера шрифта на ходу;
    - смена сети;
    - выгрузка из памяти.

    Не все сразу: выбирают 3–4 по смыслу в каждом опасном моменте фичи.

- id: mob3-05
  type: card
  question: Что проверить после возврата в приложение после прерывания?
  answer: |
    - введённые данные на месте;
    - тот же экран, а не главный или вход;
    - прокрутка и открытые окна;
    - таймеры считают честно;
    - видео и аудио встали на паузу и ведут себя как задумано;
    - незавершённая операция (оплата, загрузка) не задвоилась
      и не потерялась молча;
    - если нужен повторный вход — после него пользователь вернулся
      туда, где был;
    - экран в WebView не перезагрузился с потерей формы.

- id: mob3-06
  type: quiz
  question: Как на Android нарочно проверить, что экран переживает выгрузку?
  options:
    - "Смахнуть приложение из «недавних» и открыть снова"
    - "Нажать «Остановить» (Force stop) в настройках приложения"
    - "Включить в режиме разработчика «Не сохранять действия» или свернуть приложение и выполнить `adb shell am kill имя.пакета`"
    - "Перезагрузить телефон"
  correct: 2
  explanation: |
    «Не сохранять действия» закрывает каждый экран, как только с него
    ушли, — так ловят потерю данных на экране. `adb shell am kill`
    завершает процесс приложения в фоне — как это делает система, когда
    ей нужна память. Смахивание, Force stop и перезагрузка — это
    закрытие: после него запуск с нуля — норма. Настройку после проверки
    выключают — она действует на все приложения.

- id: mob3-07
  type: quiz
  question: "Хитрый вопрос: пользователь смахнул приложение из «недавних», открыл снова — форма пустая. Это баг?"
  options:
    - "Да, приложение обязано восстановить данные в любом случае"
    - "Нет: закрытие пользователем — это осознанный выход, запуск с нуля — норма; восстановление обязательно после выгрузки системой"
    - "Да, но только на iOS"
    - "Нет, потому что формы в приложениях вообще не сохраняют"
  correct: 1
  explanation: |
    Смахнул сам — значит, закрыл. Следующий запуск начинается с нуля,
    так задумано системами. Иное дело — выгрузка системой: пользователь
    ничего не закрывал и ждёт свой экран. Черновики после закрытия
    приложение может хранить, но это отдельное требование продукта.

- id: mob3-08
  type: card
  question: "Хитрый вопрос: на Android после поворота экрана форма очищается, на iPhone — нет. В чём причина?"
  answer: |
    Android при повороте, смене темы, языка или размера шрифта
    **пересоздаёт экран**. Если приложение не сохраняет и не возвращает
    данные, они пропадают. На iOS экран при повороте не пересоздаётся.

    Это баг приложения, а не системы. Заодно стоит проверить смену темы
    и шрифта на ходу — причина та же. Если приложение не должно
    поворачиваться — проверить, что ориентация закреплена и ничего не
    сбрасывается.

- id: mob3-09
  type: card
  question: Как вызвать выгрузку приложения из памяти на iOS?
  answer: |
    Прямого переключателя, как на Android, нет. На практике:

    - запустить много тяжёлых приложений на iPhone с небольшой памятью —
      работает не всегда;
    - вместе с разработчиком через Xcode: свернуть приложение, запущенное
      из Xcode, и остановить его — похоже на выгрузку системой.

    «Simulate Memory Warning» в симуляторе — только предупреждение
    о нехватке памяти, не выгрузка.

- id: mob3-10
  type: quiz
  question: "Хитрый вопрос: звонок пришёл сразу после нажатия «Оплатить». После разговора пользователь снова видит корзину с кнопкой «Оплатить». Что главное проверить?"
  options:
    - "Что кнопка «Оплатить» по-прежнему зелёная"
    - "Что звонок был слышен"
    - "Не прошла ли уже первая оплата и не создастся ли второй заказ при повторном нажатии; пользователь должен видеть итог"
    - "Что приложение не свернулось"
  correct: 2
  explanation: |
    Прерывание между «нажал» и «получил ответ» — самый опасный момент.
    Если приложение не восстановило статус оплаты, пользователь нажмёт
    ещё раз — и получит два заказа и два списания. Правильно: после
    возврата показать итог («оплачено», «не прошло», «проверяем»),
    а сервер не должен создавать дубль.

- id: mob3-11
  type: card
  question: Что происходит с экраном в WebView при выгрузке и почему это опасно?
  answer: |
    Встроенный браузер держит страницу в памяти. Когда экран
    пересоздаётся (поворот, «Не сохранять действия», выгрузка),
    приложение часто просто загружает страницу заново: форма пустая,
    прокрутка в начале.

    Опаснее всего — оплата в WebView: перезагрузка посреди оплаты
    может привести к повторной оплате или дублю заказа. Поэтому
    WebView-экраны с формами и оплатой — первые кандидаты на проверку
    выгрузки.

- id: mob3-12
  type: card
  question: Что ломается в режиме энергосбережения и как это проверить?
  answer: |
    Система ограничивает фоновую работу:

    - синхронизация и загрузки в фоне останавливаются или откладываются;
    - данные не обновляются, пока приложение не откроют;
    - push может приходить с задержкой;
    - анимации и видео — медленнее.

    Проверка: включить режим, свернуть приложение на 15–20 минут,
    проверить уведомления и свежесть данных. Отдельно — телефоны с
    агрессивной экономией (Xiaomi, Huawei): там приложение могут
    закрыть в фоне и без режима.

- id: mob3-13
  type: card
  question: Что такое утечка памяти и как тестировщик её замечает?
  answer: |
    **Утечка памяти** — приложение берёт оперативную память и не отдаёт
    обратно. Признаки:

    - приложение тормозит всё сильнее со временем;
    - вылетает через 20–30 минут одних и тех же действий;
    - на слабом телефоне вылетает, на мощном — нет.

    Проверка: в Profiler (Android Studio) или Instruments (Xcode)
    повторить одно действие 20 раз и посмотреть, падает ли память
    обратно после паузы. Тестировщик приносит шаги, время, цифры
    и график; причину ищут разработчики.

- id: mob3-14
  type: quiz
  question: "Хитрый вопрос: в Profiler память в покое сама поднимается и опускается «пилой». Это утечка?"
  options:
    - "Да, любая растущая память — утечка"
    - "Нет, если «пол» графика возвращается к прежнему уровню: память берут и отдают. Утечка — когда «пол» поднимается и не опускается после паузы"
    - "Да, если график вообще двигается в покое"
    - "Нельзя понять без исходного кода"
  correct: 1
  explanation: |
    Приложение может работать и в покое: таймеры, загрузки, очистка
    памяти. Важна не форма графика, а сравнение: уровень до действий,
    после и после минуты покоя в одинаковых точках. «Пол» вырос и не
    вернулся — подозрение на утечку.

- id: mob3-15
  type: card
  question: Что такое ANR и OOM?
  answer: |
    - **ANR** (Application Not Responding — «приложение не отвечает») —
      на Android системное окно «Приложение не отвечает. Закрыть или
      подождать?», когда приложение несколько секунд не реагирует
      на нажатия.
    - **OOM** (Out Of Memory — «память закончилась») — вылет из-за
      нехватки оперативной памяти, часто следствие утечки.

    Причины того и другого ищут в журнале устройства (Logcat на
    Android, Console на Mac для iPhone) и в отчётах о падениях.

- id: mob3-16
  type: card
  question: Как построить проверку прерываний для новой фичи?
  answer: |
    1. Найти опасные моменты: ввод данных, оплата и подтверждение,
       загрузка, таймер, воспроизведение.
    2. В каждом устроить 3–4 прерывания по смыслу.
    3. После каждого — проверить возврат: экран, данные, операция.
    4. Один раз на фичу — выгрузка из памяти.
    5. Для ленты, карты, видео — длинная сессия и взгляд на память.
    6. Баг-репорт: какое прерывание, в какой момент, сколько длилось,
       устройство и ОС, видео.

- id: mob3-17
  type: quiz
  question: Чего не хватает в баг-репорте «Заполнил форму, вышел из приложения, зашёл — форма пустая»?
  options:
    - "Ничего, этого достаточно"
    - "Только скриншота пустой формы"
    - "Как именно «вышел»: свернул на время, смахнул сам или выгрузка; сколько длилось; как открыл обратно; устройство, ОС, сборка, видео"
    - "Имени разработчика, который делал форму"
  correct: 2
  explanation: |
    От способа «выхода» зависит, баг ли это вообще: смахнул сам —
    запуск с нуля норма; выгрузка системой — данные должны
    восстановиться. Выгрузка сильно зависит от устройства, поэтому
    модель, ОС и время в фоне обязательны. Видео снимает половину
    вопросов.

- id: mob3-18
  type: card
  question: "Хитрый вопрос: в банковском приложении после выгрузки снова просят войти по коду. Это баг?"
  answer: |
    Не обязательно. Банки часто специально требуют вход после
    сворачивания или выгрузки ради безопасности — это сверяют
    с требованиями.

    Баг — если после входа пользователь не вернулся туда, где был,
    и потерял несекретные данные: сумму и получателя перевода.
    Код из СМС и данные карты могут намеренно не сохранять — тогда
    пользователь должен понимать, что произошло.

- id: mob3-19
  type: card
  question: Почему прерывания и выгрузку важно проверять на слабом телефоне?
  answer: |
    У бюджетных телефонов мало оперативной памяти — система выгружает
    фоновые приложения быстро и часто. Мощный флагман может держать
    приложение в фоне часами, и баг «свернул — всё пропало» на нём
    не проявится. Утечки памяти тоже приводят к вылету раньше на слабых
    устройствах. Поэтому «у меня на флагмане работает» — не аргумент.
