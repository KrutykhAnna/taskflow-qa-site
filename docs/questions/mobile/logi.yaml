# Вопросы темы «Логи мобильных приложений». Формат — см. osnovy/bag-report.yaml.

- id: mob10-01
  type: card
  question: Что такое лог устройства и зачем он тестировщику мобильных приложений?
  answer: |
    **Лог устройства** — журнал, куда телефон и все приложения постоянно
    записывают, что делают: запросы, ошибки, падения. Как «чёрный ящик»
    самолёта.

    Зачем тестировщику:
    - найти **причину падения** — тип ошибки и строку кода;
    - увидеть ошибку, которой **нет на экране**;
    - **доказать** редкий баг сохранённым логом;
    - заметить **секреты и личные данные** в логе — баг безопасности.

- id: mob10-02
  type: card
  question: Чем лог телефона отличается от логов сервера и Console в браузере?
  answer: |
    - **Поток общий и огромный** — пишут система и все приложения сразу,
      без фильтра своё не найти.
    - **Нужен доступ к устройству** — телефон подключают к компьютеру,
      и сделать это надо **до** бага.
    - **Быстро стирается** — журнал кольцевой, новое затирает старое.

    Android — Logcat (Android Studio или `adb logcat`), iPhone — Console
    на Mac, Xcode, отчёты о падениях в настройках.

- id: mob10-03
  type: card
  question: Из каких частей состоит строка Logcat?
  answer: |
    `10-21 14:03:15.482  5123  5140 E Network : Request failed`

    - **дата и время** телефона;
    - **PID** — номер процесса приложения;
    - **TID** — номер потока (если равен PID — главный поток);
    - **уровень** — `V`, `D`, `I`, `W`, `E`, `F`;
    - **тег** — кто написал;
    - **сообщение**.

    В Android Studio ещё видно **имя пакета** приложения.

- id: mob10-04
  type: quiz
  question: В Logcat выбран фильтр уровня `W`. Какие строки останутся?
  options:
    - "Только W"
    - "W, E и F — этот уровень и серьёзнее"
    - "V, D, I и W — этот уровень и проще"
    - "Все строки, W подсвечены"
  correct: 1
  explanation: |
    Фильтр уровня работает «этот и серьёзнее»: `W` (предупреждение),
    `E` (ошибка), `F` (фатально). Подробные `V`, `D`, `I` скрываются.

- id: mob10-05
  type: card
  question: Как выглядит падение Android-приложения в Logcat и что в нём главное?
  answer: |
    Блок от тега `AndroidRuntime` уровня `E`:
    - `FATAL EXCEPTION: main` — необработанная ошибка в главном потоке;
    - `Process: <пакет>, PID: …` — чьё падение;
    - **тип исключения и сообщение** — например, `NullPointerException`;
    - строки `at …` — **стектрейс**, путь до ошибки;
    - `Caused by:` — настоящая причина, если ошибку «завернули».

    Главное — **первая строка `at` с именем пакета приложения**
    (под последним `Caused by`): файл и номер строки в коде команды.

- id: mob10-06
  type: quiz
  question: "Хитрый вопрос: в стектрейсе есть верхний `RuntimeException: Unable to start activity` и ниже `Caused by: NumberFormatException`. Где настоящая причина?"
  options:
    - "В верхнем RuntimeException — он первый"
    - "В последней строке стектрейса ActivityThread.main"
    - "В блоке Caused by — и первой строке с пакетом приложения под ним"
    - "Причину по логу не узнать"
  correct: 2
  explanation: |
    Верхнее исключение — «обёртка»: «не смог открыть экран из-за…».
    Причина — в последнем `Caused by`, а место в коде — первая строка
    `at` с пакетом приложения под ним. Последняя строка
    `ActivityThread.main` есть в любом Android-приложении и ничего
    не говорит.

- id: mob10-07
  type: card
  question: Что копировать из лога в баг-репорт о падении?
  answer: |
    - **Весь блок** от `FATAL EXCEPTION` до конца строк `at` и всех
      `Caused by` — **текстом**, не скриншотом.
    - Полный лог — файлом во вложении, а не в описании.
    - Время падения, **точную версию сборки**, модель и ОС, шаги.
    - Для iOS — файл `.ips`; ссылку на событие в сборщике падений.
    - Токены и личные данные — замазать.

- id: mob10-08
  type: card
  question: Что такое ANR и как его найти?
  answer: |
    **ANR** (Application Not Responding) — окно «Приложение не отвечает».
    Появляется, когда главный поток занят и, например, 5 секунд
    не обрабатывает нажатие.

    В логе — системная строка `ANR in <пакет>` и причина
    (`Input dispatching timed out`). Подробности — в `adb bugreport`.
    Нарочно вызвать обычно нельзя — держат Logcat открытым и ловят,
    когда случится. На тестовом устройстве включают
    «Показывать все ANR».

- id: mob10-09
  type: quiz
  question: "Хитрый вопрос: приложение свернули, через 10 минут оно открылось с главного экрана. В логе: `Process com.app (pid 3302) has died`, `signal 9 (Killed)`, `FATAL EXCEPTION` нет. Что это?"
  options:
    - "Падение — критичный баг"
    - "ANR"
    - "Выгрузка системой ради памяти — не падение; баг, только если потеряны данные"
    - "Ошибка Logcat"
  correct: 2
  explanation: |
    Система завершила фоновый процесс, чтобы освободить память. Это
    норма Android. Баг — если после возврата приложение не восстановило
    состояние: черновик, место в плеере, шаг формы. Падение выглядело бы
    иначе — `FATAL EXCEPTION` от `AndroidRuntime`.

- id: mob10-10
  type: quiz
  question: "Хитрый вопрос: падение `OutOfMemoryError` указывает на `ImageLoader.java:88`. Исправили эту строку — падение осталось. Почему?"
  options:
    - "Исправили неправильно — надо ещё раз ту же строку"
    - "Стектрейс OOM показывает, где память закончилась, а не где её съели — нужна проверка утечки на длинном сценарии"
    - "OutOfMemoryError — не падение"
    - "Logcat ошибся"
  correct: 1
  explanation: |
    При нехватке памяти падает тот код, которому не хватило «последней
    капли». Причина — утечка или накопление по всему сценарию. Тестировщик
    приносит длинный воспроизводимый сценарий и график памяти из Profiler
    или Instruments.

- id: mob10-11
  type: card
  question: Какие фильтры Logcat в Android Studio нужны тестировщику?
  answer: |
    - `package:имя.пакета` — только своё приложение
      (`package:mine` — для открытого проекта, у тестировщика его нет);
    - `level:error` — ошибки и серьёзнее;
    - `tag:AndroidRuntime` — по тегу;
    - `message:timeout` — по тексту;
    - `is:crash` — только падения, Java и нативные;
    - `age:5m` — за последние 5 минут.

    Пробел — «и», минус — «кроме»: `-tag:Network`.

- id: mob10-12
  type: card
  question: Какие команды adb logcat нужны тестировщику?
  answer: |
    - `adb logcat -c` — очистить журнал перед воспроизведением;
    - `adb logcat` — поток вживую, стоп — Ctrl+C;
    - `adb logcat '*:E'` — только ошибки (кавычки — для zsh);
    - `adb logcat --pid=<номер>` — только процесс приложения;
    - `adb logcat -d > log.txt` — сохранить журнал в файл;
    - `adb logcat -b crash` — буфер падений;
    - `adb bugreport` — полный отчёт для разработчиков.

    Привычка: **очистить → воспроизвести → сохранить**.

- id: mob10-13
  type: quiz
  question: "Хитрый вопрос: падение было час назад, сейчас подключили телефон — в Logcat его нет. Вывод?"
  options:
    - "Падения не было"
    - "Это была выгрузка из памяти"
    - "Журнал кольцевой и мог перезаписаться; проверить буфер падений `-b crash` и воспроизвести с открытым Logcat"
    - "Logcat не показывает падения"
  correct: 2
  explanation: |
    Отсутствие строки не доказывает, что её не было: старое затирается
    новым. Падения живут дольше в отдельном буфере `adb logcat -b crash`.
    Правило — подключать устройство **до** теста и сохранять лог сразу.

- id: mob10-14
  type: card
  question: Как получить логи и отчёты о падениях на iOS?
  answer: |
    - **Console на Mac** — выбрать iPhone или симулятор, нажать
      «Начать», фильтр по процессу — живой журнал.
    - **Xcode** → Devices and Simulators — отчёты о падениях с
      устройства; Organizer → Crashes — падения тестовых сборок у всех.
    - **На iPhone** — Настройки → Конфиденциальность и безопасность →
      Аналитика и улучшения → Данные аналитики: файлы `.ips`.
    - **Симулятор** — `xcrun simctl spawn booted log stream` с фильтром
      по процессу.

    Без Mac живого журнала нет — только отчёты `.ips`, TestFlight
    и сборщик падений.

- id: mob10-15
  type: card
  question: Что такое символикация и dSYM? Что от них нужно тестировщику?
  answer: |
    В iOS-отчёте о падении вместо имён функций часто **адреса**.
    **Символикация** — подстановка имён по файлу **dSYM**
    («отладочные символы»), который создаётся при сборке.

    Делают её разработчики и сборщики падений. Тестировщику — приложить
    отчёт `.ips` и **точную версию сборки**: без неё нужный dSYM
    не найти. На Android похожая история — обфускация и файл mapping.

- id: mob10-16
  type: card
  question: Что такое сборщик падений и как тестировщик им пользуется?
  answer: |
    Библиотека в приложении + сайт: падение у любого пользователя
    приходит к команде само. Примеры — **Firebase Crashlytics**, **Sentry**.

    Что видно: стектрейс, сколько пользователей, устройства и версии,
    **«хлебные крошки»** — последние действия перед падением.

    Как используют: после релиза смотрят новые падения, по крошкам
    воспроизводят, ссылку на событие кладут в баг-репорт.

- id: mob10-17
  type: quiz
  question: "Хитрый вопрос: форма показала «Отправлено», в Logcat с `level:error` пусто. Можно считать, что всё дошло?"
  options:
    - "Да — ошибок нет"
    - "Нет: приложение может молча проглотить ошибку; проверить результат на сервере или через прокси"
    - "Да, если нет FATAL EXCEPTION"
    - "Нет, Logcat не пишет сетевые ошибки"
  correct: 1
  explanation: |
    Ошибку могут поймать и проигнорировать, записать уровнем `D` или не
    записать вовсе. Результат проверяют там, где он должен оказаться:
    API, админка, база, запросы в прокси или Network Inspector.

- id: mob10-18
  type: quiz
  question: "Хитрый вопрос: WebView-экран белый, в Logcat нет ни одной ошибки. Где искать?"
  options:
    - "Ошибок нет — значит, проблема на сервере"
    - "В DevTools: chrome://inspect для Android, Safari «Разработка» для iOS — ошибки JS живут в консоли страницы"
    - "Только в сборщике падений"
    - "Переустановить приложение"
  correct: 1
  explanation: |
    Ошибки JavaScript — это ошибки страницы. В Logcat они попадают,
    только если приложение их туда передаёт. Нужна тестовая сборка
    с включённой отладкой WebView — тогда в DevTools видны Console
    и Network страницы.

- id: mob10-19
  type: card
  question: Что в логе телефона — баг безопасности?
  answer: |
    **Токены** (`Authorization: Bearer …`), **пароли**, номера карт,
    телефоны, email целиком — в открытом виде.

    Журнал читают инструменты с доступом к устройству, его прикладывают
    к обращениям в поддержку. В отладочной сборке подробный лог может
    быть договорённостью — главное, чтобы этого **не было в релизе**.
    Проверка — фильтры `message:Bearer`, `message:password` на релизной
    сборке. В баг-репорте секреты замазывают.

- id: mob10-20
  type: card
  question: Как кросс-платформенные приложения и WebView меняют работу с логами?
  answer: |
    - **React Native** — сообщения JS-части в Logcat с тегом
      `ReactNativeJS`.
    - **Flutter** — вывод обычно с тегом `flutter`; ошибки часто
      не роняют приложение, а видны только в логе.
    - **WebView и мобильный сайт** — ошибки JS смотрят в DevTools
      (`chrome://inspect`, Safari «Разработка»).

    Спроси разработчиков, на чём приложение и какие теги искать.
