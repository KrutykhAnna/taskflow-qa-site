# Вопросы темы «Сеть на телефоне и офлайн». Формат — см. osnovy/bag-report.yaml.

- id: mob8-01
  type: card
  question: Чем тестирование сети в мобилке отличается от веба?
  answer: |
    В вебе условия сети тестировщик включает сам в DevTools. На телефоне
    сеть меняется сама и по-настоящему: Wi‑Fi ↔ мобильная сеть, лифт,
    метро, слабый сигнал, роуминг, Wi‑Fi с входом в кафе.

    Плюс мобильное: приложение работает в фоне, есть офлайн-режим и
    локальная база, а значок сети может гореть, когда интернета нет.

- id: mob8-02
  type: card
  question: Зачем тестировать сеть на телефоне — чем грозит баг?
  answer: |
    - **Обрыв во время оплаты** — двойное списание или оплата без заказа.
    - **Сообщение в метро** — пропало или ушло дважды.
    - **Офлайн-режим** — данные не синхронизировались, курьер видит
      старый адрес.
    - **Wi‑Fi → LTE при загрузке** — загрузка с нуля или зависла.
    - **Медленная сеть** — вечный спиннер без «Повторить».
    - **Роуминг** — видео «съело» гигабайты.

- id: mob8-03
  type: card
  question: Какие сетевые ситуации проверяют на мобилке?
  answer: |
    - Нет сети (авиарежим).
    - Слабый сигнал.
    - Медленный тип сети — 2G, EDGE, 3G.
    - Переключение Wi‑Fi ↔ мобильная сеть.
    - Wi‑Fi без интернета (captive portal).
    - Сеть пропала посреди запроса.
    - Долго нет сети → вернулась.
    - VPN, роуминг, режим экономии трафика.

- id: mob8-04
  type: card
  question: Что такое офлайн-режим и синхронизация?
  answer: |
    **Офлайн-режим** — приложение работает без сети: показывает уже
    загруженные данные и иногда даёт что-то делать.

    **Синхронизация** — когда сеть вернулась, приложение сверяет данные
    с сервером: досылает сделанное офлайн из очереди отправки и забирает
    новое.

- id: mob8-05
  type: card
  question: Что проверить в синхронизации после возвращения сети?
  answer: |
    - Ушло **всё** из очереди.
    - Ушло **один раз** — даже если сеть мигала.
    - **В правильном порядке** — «создал» раньше «изменил».
    - **Само**, без захода на экран, если заявлена фоновая синхронизация.
    - Статусы обновились — часики сменились галочкой.
    - Есть правило для **конфликтов**, ни одна правка не потерялась.

    Результат сверяют на сервере, в вебе или на другом устройстве.

- id: mob8-06
  type: quiz
  question: "Хитрый вопрос: в авиарежиме каталог, корзина и вход работают без ошибок. Что это значит?"
  options:
    - "Офлайн-режим сделан отлично"
    - "Ничего не значит само по себе: экраны могут не ходить в сеть или молча игнорировать ошибки"
    - "Авиарежим на эмуляторе не работает"
    - "Приложение — мобильный сайт"
  correct: 1
  explanation: |
    Экран может работать без сети, потому что данные локальные и сервер
    ему не нужен. Или приложение отправляет запросы и молча игнорирует
    ошибки — тогда заказ «оформлен», а на сервере его нет. Сетевые
    действия смотрят по запросам (Network Inspector), а результат —
    на сервере.

- id: mob8-07
  type: card
  question: Что такое captive portal и почему это важная проверка?
  answer: |
    Wi‑Fi в кафе, отеле, аэропорту, который сначала показывает страницу
    входа или «Принять условия». До этого телефон подключён к Wi‑Fi,
    значок полный, а интернета нет.

    Приложение, которое верит значку и ждёт без таймаута, висит с
    вечным спиннером. Должно быть: через разумное время — «Нет
    подключения к интернету» и «Повторить».

- id: mob8-08
  type: quiz
  question: "Хитрый вопрос: можно ли проверить переключение Wi‑Fi → LTE на симуляторе iOS?"
  options:
    - "Да, в меню симулятора есть переключатель сети"
    - "Да, включив профиль LTE в Network Link Conditioner"
    - "Нет: симулятор использует сеть Mac, настоящего переключения нет — нужен реальный телефон"
    - "Да, через авиарежим в симуляторе"
  correct: 2
  explanation: |
    У симулятора iOS нет своей мобильной сети и авиарежима. Network Link
    Conditioner на Mac может замедлить сеть или «потерять» всё, но
    настоящее переключение Wi‑Fi ↔ LTE, рывки и Wi‑Fi без интернета
    проверяют на реальном iPhone.

- id: mob8-09
  type: card
  question: Как устроить медленную сеть на эмуляторе Android?
  answer: |
    1. Кнопка **⋯** → **Extended controls** → **Cellular**.
    2. **Network type** — EDGE или GPRS (медленные), UMTS — 3G.
    3. **Signal strength** — Poor или None.
    4. **Выключить Wi‑Fi** в шторке эмулятора — иначе он выходит в сеть
       через виртуальный Wi‑Fi и тип мобильной сети почти не влияет.

    Нет сети — авиарежим в шторке или Data status: Unregistered.

- id: mob8-10
  type: card
  question: Что такое Network Inspector и что тестировщик из него берёт?
  answer: |
    Инструмент Android Studio (App Inspection → Network Inspector):
    показывает запросы отладочного приложения — адрес, время, заголовки
    и тело запроса и ответа. Видит запросы через OkHttp и
    HttpsURLConnection; WebView, скорее всего, нет.

    Тестировщик берёт: карту сетевых действий фичи, дубли запросов,
    медленные запросы и доказательства для баг-репорта.

- id: mob8-11
  type: card
  question: Что такое Network Link Conditioner?
  answer: |
    Инструмент Apple, который искусственно замедляет сеть и теряет часть
    данных. Готовые профили — 3G, EDGE, LTE, Very Bad Network,
    100% Loss и другие; можно сделать свой.

    На iPhone — «Настройки» → «Разработчик» → Network Link Conditioner.
    На Mac — из пакета Additional Tools for Xcode, замедляет весь Mac,
    в том числе симулятор.

- id: mob8-12
  type: quiz
  question: "Хитрый вопрос: при слабой сети приложение само повторяет запрос перевода после таймаута. Какой главный риск?"
  options:
    - "Никакого: автоповтор только помогает"
    - "Перевод уйдёт дважды, если первый запрос на самом деле дошёл, а ответ потерялся"
    - "Телефон перегреется"
    - "Сервер вернёт код 404"
  correct: 1
  explanation: |
    Таймаут не значит, что запрос не дошёл, — мог потеряться ответ.
    Повтор без защиты от дублей создаёт второй перевод. Защита должна
    быть на сервере: он узнаёт повтор того же действия. Тестировщик
    проверяет на медленной сети и сверяет историю операций.

- id: mob8-13
  type: card
  question: Как WebView-экран и тип приложения влияют на проверку сети?
  answer: |
    - **Нативное** — свой экран «Нет сети», данные из памяти, очередь,
      синхронизация: проверяется всё.
    - **WebView** — если ошибку не перехватили, человек видит браузерную
      «Веб-страница недоступна» с кодом `net::ERR_…`. Нужен свой экран
      с «Повторить».
    - **Кросс-платформенное** — экран ошибки общий, тексты системных
      ошибок iOS и Android разные.
    - **Мобильный сайт** — без сети заглушка браузера, это не баг сайта.
    - **PWA** — офлайн через сервис-воркер: своя офлайн-страница,
      нет устаревшей версии.

- id: mob8-14
  type: quiz
  question: "Хитрый вопрос: без сети приложение показывает «Unable to resolve host api.shop.ru». Что это?"
  options:
    - "Не баг: ошибка поймана, приложение не упало"
    - "Баг: технический текст вместо понятного «Нет подключения к интернету» и кнопки «Повторить»"
    - "Баг сервера: DNS не работает"
    - "Нормально для Android"
  correct: 1
  explanation: |
    Хорошо, что приложение не упало. Но человек не поймёт, что дело в
    интернете, и не знает, что делать. Ожидание — понятный текст и
    «Повторить». Заодно лишний раз показывается адрес сервера.

- id: mob8-15
  type: card
  question: Что показывать без сети, а что — нет?
  answer: |
    Хорошо:

    - свой экран «Нет сети» с понятным текстом и «Повторить»;
    - данные из памяти **с пометкой** «Обновлено 10 минут назад».

    Плохо:

    - пустой список — человек думает, что данных нет;
    - вечный спиннер;
    - технический код или браузерная страница ошибки;
    - старые данные без пометки — человек им верит.

- id: mob8-16
  type: card
  question: Что делать приложению, если человек нажал «Отправить» без сети?
  answer: |
    Два честных пути:

    1. **Заблокировать с объяснением** — «Нет сети, оплата недоступна».
       Так делают с оплатой.
    2. **Поставить в очередь** с видимым статусом (часики, «не
       синхронизировано») и отправить, когда сеть вернётся.

    Нечестно — молча ничего не сделать или показать «Отправлено», когда
    ничего не ушло.

- id: mob8-17
  type: quiz
  question: "Хитрый вопрос: тестировщик включил авиарежим, потом запустил приложение и завёл баг «главный экран не загружается». Что не так?"
  options:
    - "Всё правильно — так и проверяют офлайн"
    - "Он проверил запуск без сети, а не фичу: обычно экран открывают с сетью и уже потом выключают её; и ожидание надо сверить с требованиями"
    - "Авиарежим нужно включать только на эмуляторе"
    - "Нужно было использовать Network Inspector"
  correct: 1
  explanation: |
    Холодный запуск без сети — отдельная проверка, и «не загружается»
    там может быть нормой, если офлайн не заявлен. Важно, ЧТО показано:
    понятное сообщение или пустота. А основной сценарий — открыть экран
    и потерять сеть во время работы, потом вернуть её.

- id: mob8-18
  type: card
  question: Что такое конфликт при синхронизации и как его проверить?
  answer: |
    Одно и то же изменили в двух местах, пока одно из устройств было
    без сети. Например, заметку переименовали на телефоне офлайн и в
    вебе.

    Правило выбирает команда: побеждает последнее, сервер всегда прав,
    спросить человека, сохранить обе версии. Тестировщик проверяет, что
    правило есть, работает и ни одна правка не исчезла молча.

- id: mob8-19
  type: card
  question: Что написать в баг-репорте сетевого бага?
  answer: |
    - Тип сети: Wi‑Fi, LTE, эмулятор с EDGE, профиль Network Link
      Conditioner.
    - Как воспроизводил обрыв: «нажал „Оплатить“, через 1 с авиарежим,
      через 10 с выключил».
    - Время с точностью до минуты — для поиска в логах сервера.
    - Устройство, версии ОС и приложения.
    - Видео; запросы из Network Inspector и логи, если есть.
    - Результат на сервере: сколько заказов, сообщений.

- id: mob8-20
  type: quiz
  question: "Хитрый вопрос: на эмуляторе поставили Network type: EDGE, а приложение грузится так же быстро. Почему?"
  options:
    - "EDGE — это быстрая сеть"
    - "Скорее всего, включён Wi‑Fi эмулятора — он выходит в сеть через него, и тип мобильной сети почти не влияет"
    - "Приложение не поддерживает EDGE"
    - "Нужно перезапустить Android Studio"
  correct: 1
  explanation: |
    Эмулятор часто выходит в интернет через виртуальный Wi‑Fi. Чтобы
    медленная мобильная сеть заработала, выключи Wi‑Fi в шторке
    эмулятора. Ещё вариант — экран просто не ходит в сеть: проверь
    запросы в Network Inspector.
