# Вопросы темы «Практикум: мобильное приложение целиком». Формат — см. osnovy/bag-report.yaml.

- id: mob13-01
  type: card
  question: Из каких шагов состоит тестирование мобильного релиза?
  answer: |
    1. **Получить сборку**, проверить версию, номер сборки и стенд.
    2. **Матрица устройств** — где полный прогон, где смоук.
    3. **Счастливый путь** с открытыми логами устройства.
    4. **Мобильные проверки по приоритету** — прерывания, разрешения,
       сеть, вёрстка.
    5. **Обновление** поверх версии, которая сейчас у пользователей.
    6. **Чек-лист магазина** — что отклонит ревьюер.
    7. **Баг-репорты** с мобильным окружением и логами.
    8. **Отчёт**: что проверено, найдено, риски, что не проверено.

- id: mob13-02
  type: card
  question: Зачем проверять версию и номер сборки до начала тестирования?
  answer: |
    Чтобы тестировать **ту** сборку. Номер сборки — единственный точный
    признак: версия 2.4.0 может быть собрана десять раз.

    Чем грозит пропуск:
    - день регресса на вчерашней сборке — результаты ничего не стоят;
    - баг «не воспроизводится» у разработчика — он смотрит другую сборку;
    - тестовая сборка смотрит на боевой стенд — реальные заказы и письма.

    Где смотреть: «О приложении», `dumpsys package` на Android,
    TestFlight на iOS.

- id: mob13-03
  type: quiz
  question: Что проверить первым в регрессе мобильного релиза, если времени мало?
  options:
    - "Сверку вёрстки всех экранов с макетом"
    - "Главный сценарий с открытыми логами и обновление поверх текущей версии"
    - "Тёмную тему и крупный шрифт"
    - "Все версии Android по очереди"
  correct: 1
  explanation: |
    Приоритет 1 — то, без чего релиз не выпускают: главный сценарий
    работает и не падает, а пользователи могут обновиться и не потерять
    данные. Вёрстка, тема и шрифт — приоритет 3, их проверяют выборочно.
    Все версии Android — не по очереди, а по матрице устройств.

- id: mob13-04
  type: card
  question: Почему регресс нельзя делать только на чистой установке?
  answer: |
    В день релиза почти все пользователи получают его **обновлением** —
    со своими данными, входом, настройками. Чистая установка этого
    не покажет.

    Что ловит только обновление:
    - падение миграции базы при первом запуске;
    - пропавшие данные (корзина, избранное, карты лояльности);
    - всех разлогинило;
    - релизная сборка подписана не тем ключом — не ставится поверх.

    Чистая установка — путь новых пользователей, обновление — всех
    остальных. Нужны оба.

- id: mob13-05
  type: card
  question: Что обязательно указать в мобильном баг-репорте?
  answer: |
    - **Устройство** — модель; реальный телефон, эмулятор или ферма.
    - **Версия ОС** (и оболочки — One UI, MIUI).
    - **Версия и номер сборки**, откуда сборка.
    - **Чистая установка или обновление** — с какой версии.
    - **Стенд**, **сеть**, **ориентация**.
    - **Особые настройки** — крупный шрифт, энергосбережение,
      «Не сохранять действия».
    - **Частота** — «всегда» или «3 из 10».
    - **Доказательства** — видео, блок из лога, файл лога.

- id: mob13-06
  type: card
  question: Что должно быть в отчёте по мобильному релизу?
  answer: |
    - **Релиз** — версия, номер сборки, откуда, стенд.
    - **Устройства** — где полный прогон, где смоук; эмулятор или реальный.
    - **Проверено** — числом: passed, failed, blocked.
    - **Найдено** — по серьёзности, главный баг первым.
    - **Обновление** — с какой версии, что с данными.
    - **Риски**.
    - **Не проверено** — с причиной: push, реальные устройства, iOS.
    - **Вывод** одной строкой: отправлять, нет или с условием.

- id: mob13-07
  type: card
  question: "Хитрый вопрос: на эмуляторе всё работает. Можно отправлять в магазин?"
  answer: |
    Зависит от того, что в релизе. Эмулятор не покажет:
    - настоящую камеру, датчики, отпечаток;
    - оболочки производителей и их экономию батареи;
    - производительность слабого телефона;
    - настоящую мобильную сеть и часть сценариев push.

    Если релиз трогает это — нужен реальный телефон или облачная ферма.
    Если нет — можно, но в отчёте обязательно «Не проверено: реальные
    устройства». Решает команда, но с открытыми глазами.

- id: mob13-08
  type: quiz
  question: "Без сети приложение показало «Заказ оформлен». Что это значит?"
  options:
    - "Отличный офлайн-режим, можно не проверять дальше"
    - "Ничего не значит, пока не видно, что заказ дошёл до сервера"
    - "Баг эмулятора — без сети так не бывает"
    - "Заказ точно сохранился на сервере"
  correct: 1
  explanation: |
    Экран показывает то, что **решило** приложение. Дошёл ли заказ —
    видно в запросах (Network Inspector, прокси) или в логе приложения.
    Если запрос упал молча, а пользователь видит «Оформлено» — это
    критичный баг для настоящего магазина. Хороший офлайн-режим
    сохраняет заказ и отправляет его, когда сеть вернулась, и честно
    показывает статус «Ожидает отправки».

- id: mob13-09
  type: card
  question: "Хитрый вопрос: в Profiler память «пилой» ходит вверх-вниз, хотя ты ничего не трогаешь. Это утечка?"
  answer: |
    Не обязательно. Утечка — когда **«пол»** графика (нижние точки) растёт
    от раза к разу и не возвращается после покоя. Пила, которая
    возвращается к одному уровню, — память берут и отдают.

    Как проверить: «пол» до действий, после 20 повторов и после минуты
    покоя. Если вернулся — утечки не видно. Пила в покое — повод для
    **вопроса** разработчикам («что приложение делает в фоне?»),
    а не для бага «критичная утечка».

- id: mob13-10
  type: card
  question: "Хитрый вопрос: обновление не ставится — INSTALL_FAILED_UPDATE_INCOMPATIBLE. Пользователи не смогут обновиться?"
  answer: |
    Ошибка говорит: **подписи сборок разные**. Тестовые отладочные
    сборки часто подписаны разными ключами — это ограничение окружения,
    шаг — blocked.

    Пользователи получат **релизную** сборку, подписанную ключом
    магазина. Поэтому:
    - вопрос команде: «Релизные сборки подписаны одним ключом?»;
    - отдельная проверка до отправки: релизная сборка поверх версии
      из магазина.

    Если **она** не ставится — тогда критичный баг: не обновится никто.

- id: mob13-11
  type: card
  question: Как доказать падение, которое воспроизводится 1 раз из 20?
  answer: |
    - **Лог**: буфер падений (`adb logcat -b crash -d`) или блок
      `FATAL EXCEPTION` с 20–30 строками до него; на iOS — отчёт
      о падении из настроек телефона или Xcode.
    - **Сборщик падений** проекта — найти по времени и модели; часто
      у пользователей это падение уже есть.
    - **Окружение** целиком и что было до: сворачивание, звонок, поворот.
    - **Видео** с «Показывать нажатия».

    «1 из 20» в поле «Частота» — честно и нормально. Плавающий баг
    с логом — это баг.

- id: mob13-12
  type: quiz
  question: В Android-версии приложения нет push. Что написать в отчёте по релизу?
  options:
    - "Ничего — раз нет функции, нечего и писать"
    - "Push проверен, багов нет"
    - "Не проверено: push на Android — не поддерживается сборкой"
    - "Завести баг «push не работает»"
  correct: 2
  explanation: |
    «Не проверено» с причиной — честное окружение. Команда видит, что
    тестировщик знает о push и сознательно его не проверял. Писать
    «проверен» — неправда. Заводить баг — только если push заявлен
    в требованиях для Android, а его нет.

- id: mob13-13
  type: card
  question: "Хитрый вопрос: «iOS такой же, как Android — напиши, что багов нет». Что ответить?"
  answer: |
    Не такой же. У нативных приложений iOS и Android — **две разные
    программы**; у кроссплатформенных — разные системные части:
    разрешения, клавиатура, push, жизненный цикл, фон. Баг на одной
    платформе не обязан быть на другой.

    Пишу честно: «Android 14 / Pixel 7 — багов не найдено. iOS
    не проверялся — нет устройства». Предлагаю быстрый вариант: смоук
    на симуляторе или в облачной ферме.

- id: mob13-14
  type: card
  question: Почему прерывания проверяют на важных экранах, а не «вообще»?
  answer: |
    Опасность прерывания зависит от того, **что происходит на экране**.

    - Звонок на каталоге — свернул и вернулся, терять нечего.
    - Звонок на оплате, пока приложение ждёт ответа банка, — риск
      двойного списания или потерянного заказа.
    - Выгрузка на длинной форме — потеря всего введённого.

    Поэтому прерывания в первую очередь проверяют на формах, оплате,
    загрузке файлов, WebView с оплатой — там, где есть что терять.

- id: mob13-15
  type: card
  question: "Хитрый вопрос: Charles не показывает HTTPS-запросы приложения на Android 7+. Тестировать сеть невозможно?"
  answer: |
    Нет, тестировать можно. С Android 7 приложения по умолчанию **не доверяют**
    пользовательским сертификатам — Charles не может расшифровать HTTPS,
    если в сборке нет настройки доверия (network security config).

    Что делать:
    - попросить разработчиков **тестовую сборку** с доверием
      к пользовательским сертификатам;
    - в отладочной сборке — Network Inspector в Android Studio;
    - логи приложения, если оно пишет запросы;
    - для поведения при плохой сети — Extended controls и авиарежим,
      расшифровка для этого не нужна.

- id: mob13-16
  type: quiz
  question: Что тестировщик проверяет «глазами ревьюера» перед отправкой в магазин?
  options:
    - "Только скорость работы приложения"
    - "Отладочные экраны, тестовые данные на экранах, разрешения без объяснения, падения, политику конфиденциальности"
    - "Только текст описания в карточке магазина"
    - "Ничего, это работа менеджера"
  correct: 1
  explanation: |
    Ревьюер проходит приложение как пользователь. Всё, за что он
    отклонит сборку, тестировщик может найти раньше: кнопки и экраны
    для разработчиков, подсказанные логины, разрешения без объяснения
    «зачем», падения, заглушки, отсутствующую политику
    конфиденциальности. И главное — проверять **релизную** сборку,
    а не отладочную.

- id: mob13-17
  type: card
  question: Магазин отклонил сборку за день до акции. Что делает тестировщик?
  answer: |
    1. Читает письмо целиком: правило, устройство, версия ОС, лог.
    2. Воспроизводит на той же сборке и похожем устройстве (реальное,
       симулятор, ферма).
    3. Нашёл — критичный баг-репорт с логом, сразу разработчику и тимлиду.
       Не нашёл — передаёт лог и проверяет, чем ревьюер отличался:
       версия ОС, язык, сеть, демо-учётка.
    4. После исправления — смоук этого сценария и главного пути.
    5. Честно говорит команде: повторное ревью — время; решение
       про сроки — за командой.

    Вывод на будущее: этот случай — в чек-лист перед отправкой.

- id: mob13-18
  type: card
  question: "Хитрый вопрос: в учебном приложении многое «так задумано». Зачем записывать находки?"
  answer: |
    Тренировка — это навык **формулировать**, а не угадывать намерения
    авторов. На работе ты тоже не знаешь заранее, что «задумано»: это
    решают требования и аналитик.

    Как писать: «Если бы это был настоящий магазин, это был бы баг,
    потому что…» — или вопрос команде. Находка без вывода «баг / не баг /
    вопрос» — недоделанная работа. А «так задумано» без ссылки
    на требование — не ответ.
