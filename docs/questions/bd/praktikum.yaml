# Вопросы темы «Практикум: фича через API и БД». Формат — см. osnovy/bag-report.yaml.

- id: bd9-01
  type: card
  question: Как проверить один шаг фичи через API и базу данных? Какие вопросы ты задаёшь к каждому шагу?
  answer: |
    Пять вопросов к каждому шагу:

    1. **Что я делаю?** Запрос: от чьего имени, метод, путь, тело.
    2. **Что должно прийти?** Код и тело по спецификации. Запомнить `id`
       из ответа.
    3. **Что стало в базе?** `SELECT` по `id` из ответа — каждое поле:
       значение, `NULL` или пустая строка, длина, время в UTC, умолчания.
    4. **Что изменилось рядом?** Журнал действий, связанные таблицы,
       счётчики, каскады.
    5. **Что не должно было измениться?** Соседние строки — снимок
       «до и после». После отказа не изменилось ничего.

    Базу при этом только читают: все изменения — через API.

- id: bd9-02
  type: quiz
  question: |
    Ты удалил задачу через API: ответ `204`, повторный `GET` — `404`.
    По спецификации удаление мягкое. Что ты ожидаешь увидеть в таблице `tasks`?
  options:
    - "Строки задачи нет — `404` это подтверждает"
    - "Строка на месте, `status` сменился на отдельное значение"
    - "Строка на месте, `deleted_at` заполнен"
    - "Строка на месте без изменений — удаление видно только в журнале"
  correct: 2
  explanation: |
    Мягкое удаление — строка остаётся, заполняется `deleted_at`. `404` —
    это про ответ API: удалённое неотличимо снаружи от несуществующего.
    Проверка — `SELECT` по `id` без условия на `deleted_at`.

    Строки нет совсем — удаление физическое, расхождение со спецификацией.
    Строка без пометки — удаление не сохранилось, хотя API ответил `204`.

- id: bd9-03
  type: quiz
  question: |
    В ответе `GET /tasks/8` — `"commentsCount": 2`. В таблице `comments`
    у задачи 8 три строки. Что сделать первым?
  options:
    - "Завести баг: счётчик не совпадает с таблицей"
    - "Посчитать комментарии с условием `deleted_at IS NULL`"
    - "Повторить `GET` через минуту — вдруг кэш"
    - "Сравнить число строк с записями `comment.create` в журнале"
  correct: 1
  explanation: |
    `commentsCount` — число **неудалённых** комментариев. Одна из трёх
    строк может быть удалённой, и тогда всё верно:

    ```sql
    SELECT COUNT(*) AS active
    FROM comments
    WHERE task_id = 8 AND deleted_at IS NULL;
    ```

    Баг — если `active` не совпадает с `commentsCount`. Сначала проверь
    свой запрос, потом заводи баг.

- id: bd9-04
  type: quiz
  question: |
    Исполнитель задачи может менять только `status`. Он отправил
    `PATCH /tasks/8` с телом `{"status": "DONE", "title": "Новое"}`
    и получил `403`. Что ещё обязательно проверить в базе?
  options:
    - "Ничего: `403` — значит, запрос отклонён целиком"
    - "Что `title` не изменился, а `status` — уже `DONE`"
    - "Что в журнале есть запись об отказе с кодом `403`"
    - "Что не изменились ни `title`, ни `status`"
  correct: 3
  explanation: |
    Запрос с разрешённым и запрещённым полем должен отклоняться целиком.
    Опасный баг — ответ `403`, а разрешённое поле всё-таки записалось.
    По ответу этого не видно, только по базе.

    Отказы в журнал действий не пишутся: журнал — про изменения данных.

- id: bd9-05
  type: card
  question: Что проверить в базе после удаления задачи, у которой есть комментарии?
  answer: |
    - **Задача.** Строка на месте, `deleted_at` заполнен — при мягком
      удалении.
    - **Её комментарии.** Действующие получили **тот же** момент
      `deleted_at`, что и задача, — каскад.
    - **Ранее удалённые комментарии.** Сохранили своё, более раннее
      время. Перезаписанное время — искажённая история.
    - **Соседи.** Другие задачи и их комментарии не задеты — снимок
      «до и после».
    - **Журнал.** Одна запись об удалении задачи, `user_id` — кто удалил.
    - **Через API.** Задача и её комментарии — `404`, новый комментарий
      к ней создать нельзя.

- id: bd9-06
  type: quiz
  question: |
    Менеджер удалил комментарий, который написал исполнитель. Какой
    `user_id` должен быть у записи `comment.delete` в журнале?
  options:
    - "`id` менеджера — того, кто удалил"
    - "`id` исполнителя — автора комментария"
    - "`NULL`, потому что удалял не автор"
    - "Две записи — для автора и для менеджера"
  correct: 0
  explanation: |
    Журнал отвечает на вопрос «кто сделал». Поэтому в `user_id` — тот,
    чей токен был в запросе на удаление, а не автор объекта.

    Это одна из главных проверок журнала: при модерации легко по ошибке
    записать автора, и тогда при разборе инцидента виноватым окажется
    не тот человек.

- id: bd9-07
  type: quiz
  question: |
    Тестировщик ищет в журнале записи о комментариях задачи 8:
    `WHERE entity_type = 'task' AND entity_id = 8`. Записей о комментариях нет.
    В TaskFlow записи о комментариях пишутся с `entity_type = 'comment'`
    и `id` комментария. Какой вывод верный?
  options:
    - "Комментарии не пишутся в журнал — это баг"
    - "Журнал пишется с задержкой — надо подождать"
    - "Запрос ищет не там — нужен `JOIN` с `comments`"
    - "Комментарии попадают в журнал только при удалении задачи, с её `id`"
  correct: 2
  explanation: |
    Запись о комментарии привязана к комментарию, а не к задаче.
    Связь с задачей — через таблицу `comments`:

    ```sql
    SELECT a.action, a.user_id, a.entity_id
    FROM audit_log a
    JOIN comments c ON c.id = a.entity_id
    WHERE a.entity_type = 'comment' AND c.task_id = 8;
    ```

    Пустой результат — это и баг системы, и ошибка в своём `WHERE`.
    Прежде чем заводить баг, проверь запрос.

- id: bd9-08
  type: card
  question: Зачем тестировщику проверять журнал аудита и что в нём смотреть?
  answer: |
    Журнал нужен для разбора инцидентов, споров с клиентами и проверок.
    Если он пишется не всегда, это узнают в самый неудобный момент.

    Что смотреть:

    - запись есть на **каждом** пути изменения — одиночное и массовое
      удаление, модерация, каскад;
    - `user_id` — кто сделал, а не автор объекта;
    - `entity_type`, `entity_id`, `details` — верные;
    - после отказа и после чтения записи **нет**.

    Ещё польза: по журналу видна история объекта, даже если в таблице
    нет `updated_at`.

- id: bd9-09
  type: quiz
  question: |
    Проект удалили. В нём было три задачи, одну из них удалили за час
    до этого. В журнале — `project.delete` с `{"cascadedTasks": N}`.
    Каким должно быть `N`, если это число задач, которые каскад пометил?
  options:
    - "3 — все задачи проекта"
    - "2 — только действующие"
    - "1 — та, что удалена раньше"
    - "0 — задачи пишутся в журнал отдельными записями `task.delete`"
  correct: 1
  explanation: |
    Каскад трогает только действующие задачи. Удалённая раньше сохраняет
    своё время удаления, и в счёт не входит.

    Проверка в базе: сколько задач проекта получили **ровно** время
    удаления проекта. Это число должно совпасть с `cascadedTasks`.

- id: bd9-10
  type: quiz
  question: Какое из этих действий **не** должно оставить запись в журнале действий TaskFlow?
  options:
    - "Изменение статуса задачи исполнителем"
    - "Удаление комментария модератором"
    - "Изменение текста комментария автором"
    - "Просмотр задачи через `GET`"
  correct: 3
  explanation: |
    В журнал пишутся действия, которые меняют данные: создание,
    изменение, удаление. Чтение не меняет ничего и не пишется.
    Отказы — `403`, `404`, `422` — тоже не пишутся.

    Поэтому, чтобы проверить журнал, нужно действие, которое что-то
    меняет.

- id: bd9-11
  type: quiz
  question: |
    Создал задачу и проверяешь её в базе запросом
    `WHERE title = 'Отчёт по продажам'`. Вернулась одна строка со статусом
    `TODO`. Что здесь рискованно?
  options:
    - "Поиск по названию медленнее, чем по `id`"
    - "Это может быть задача из другого проекта"
    - "Статус `TODO` в базе хранится в нижнем регистре"
    - "По `title` нельзя искать — он не уникальный ключ таблицы"
  correct: 1
  explanation: |
    Название не уникально. Запрос может найти задачу из прошлого прогона,
    из чужого проекта или удалённую — и ты сверишь не ту строку.

    Надёжно — по `id` из ответа API. Если `id` нет — по названию вместе
    с `project_id` и `deleted_at IS NULL`, и смотреть, сколько строк
    вернулось.

- id: bd9-12
  type: card
  question: Хитрый вопрос. В базе всё верно, а API отдаёт другое. Где искать баг?
  answer: |
    Между базой и ответом. Что проверить:

    - **Тот ли объект** — тот ли `id`, стенд, база. Самая частая причина.
    - **Кэш** — API отдаёт сохранённую копию. Подождать время жизни
      кэша или проверить кэш.
    - **Права и фильтры** — другой пользователь видит другое; в запросе
      API забыли условие на пометку удаления.
    - **Преобразование** — поле переименовано, время в другом поясе,
      `NULL` стал пустой строкой, значение обрезано.
    - **Незакоммиченное** — меняли базу руками без `COMMIT`: ты видишь
      своё, API — старое.

    В баг-репорте — рядом ответ API и результат запроса в базу.

- id: bd9-13
  type: quiz
  question: |
    Тот же `DELETE` комментария отправили второй раз. Ответ — `404`,
    как и положено. Что проверить в базе?
  options:
    - "Что строка комментария удалилась физически"
    - "Что `deleted_at` обновился на время второго запроса"
    - "Что в журнале появилась вторая запись об удалении"
    - "Что `deleted_at` прежний, записи в журнале — одна"
  correct: 3
  explanation: |
    Повторное удаление уже удалённого ничего не должно менять. Если время
    удаления перезаписалось, история искажена: по базе уже не понять,
    когда комментарий удалили на самом деле. Лишняя запись в журнале —
    та же проблема.

- id: bd9-14
  type: card
  question: Чем баг-репорт с данными из базы отличается от обычного API-баг-репорта?
  answer: |
    Добавляется **доказательство из базы**:

    - запрос `SELECT` — короткий, по `id`, только нужные столбцы, чтобы
      разработчик скопировал и увидел то же;
    - результат запроса — как есть, без пересказа;
    - если важно «до и после» — оба результата.

    Остальное — как обычно: шаги с запросами к API, фактический
    и ожидаемый результат со ссылкой на требование, `X-Request-ID`,
    серьёзность и приоритет.

    Чего быть не должно: пароль от базы, токены целиком, скриншот
    всей таблицы.

- id: bd9-15
  type: quiz
  question: |
    Ты проверяешь фичу на общем стенде команды. Чтобы подготовить
    шаг, нужно сменить статус задачи. Как правильно?
  options:
    - "Через API — тем же запросом, что делает пользователь"
    - "`UPDATE` в базе — так быстрее, и потом откатить"
    - "`UPDATE` в базе с `COMMIT` — данные всё равно тестовые"
    - "Попросить разработчика поменять статус в коде"
  correct: 0
  explanation: |
    Изменения через API проходят проверки и пишут журнал — данные
    остаются такими, какими их сделал бы пользователь. Изменение мимо
    API не оставляет записи в журнале и может создать состояние, которого
    через API не получить.

    Базу на общем стенде тестировщик только читает. Менять данные
    напрямую — только на своём стенде, внутри `BEGIN … ROLLBACK`
    и когда через API это сделать нельзя.
