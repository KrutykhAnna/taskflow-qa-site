# Вопросы темы «Redis: кэш и не только». Формат — см. osnovy/bag-report.yaml.

- id: bd7-01
  type: card
  question: Что такое Redis и чем он отличается от PostgreSQL?
  answer: |
    Redis — хранилище «ключ → значение» в оперативной памяти.
    По ключу сразу получаешь значение. У ключа может быть срок
    жизни — TTL: время вышло, Redis удаляет ключ сам.

    Отличия от PostgreSQL:

    - хранит в памяти, а не на диске — поэтому очень быстрый;
    - не главное хранилище: данные могут пропасть, и это нормально;
    - нет SQL и таблиц — спрашивают по ключу.

    Поэтому в Redis кладут временное и часто нужное: кэш, счётчики
    попыток, отозванные токены, коды из SMS. Основные данные остаются
    в PostgreSQL.

- id: bd7-02
  type: quiz
  question: Где Redis держит данные, с которыми работает?
  options:
    - "На диске, как PostgreSQL, но в другом формате"
    - "В оперативной памяти"
    - "В браузере пользователя"
    - "В файлах логов приложения"
  correct: 1
  explanation: |
    Redis работает с данными в оперативной памяти — поэтому он такой
    быстрый. Обратная сторона: данные могут пропасть при перезапуске
    или нехватке памяти. Поэтому Redis — не главное хранилище.

- id: bd7-03
  type: quiz
  question: Что такое TTL у ключа в Redis?
  options:
    - "Тип значения: строка, список или набор полей"
    - "Сколько раз ключ прочитали"
    - "Размер значения в байтах"
    - "Срок жизни ключа"
  correct: 3
  explanation: |
    TTL — time to live, срок жизни. Например, 30 секунд: время вышло —
    Redis сам удаляет ключ. Так работают кэш, лимиты попыток и коды
    из SMS: данные «сгорают» без чьей-либо помощи.

- id: bd7-04
  type: card
  question: Что такое кэш? Что значат «попадание» и «промах»?
  answer: |
    Кэш — копия часто нужных данных в быстром месте, например в Redis,
    чтобы не ходить каждый раз в основную базу.

    - **Попадание** (cache hit) — нужный ключ в кэше есть, ответ сразу
      оттуда, база не нужна.
    - **Промах** (cache miss) — ключа нет: приложение берёт данные из
      базы, кладёт копию в кэш на какое-то время и отвечает.

    Снаружи ответ одинаковый. Разница — в скорости и в том, откуда
    взяты данные.

- id: bd7-05
  type: quiz
  question: Приложение ищет карточку товара в Redis, а ключа нет. Что обычно происходит дальше?
  options:
    - "Берёт из базы, кладёт копию в Redis, отвечает"
    - "Отвечает 404: товара нет в кэше — значит, нет вообще"
    - "Ждёт, пока ключ появится в Redis сам"
    - "Отвечает 500: кэш не настроен"
  correct: 0
  explanation: |
    Это промах. Приложение идёт в основную базу, отвечает и заодно
    кладёт копию в Redis — следующий запрос будет попаданием.

    Отсутствие ключа в кэше ничего не говорит о том, есть ли товар.
    Кэш — копия, оригинал в базе.

- id: bd7-06
  type: quiz
  question: Для чего Redis на проектах обычно НЕ используют?
  options:
    - "Кэш карточки товара"
    - "Счётчик неверных попыток входа"
    - "Единственное хранилище истории заказов"
    - "Код из SMS, который действует ровно 5 минут"
  correct: 2
  explanation: |
    Кэш, счётчики, коды из SMS — временные данные, их не страшно
    потерять или можно взять заново. История заказов — важные данные,
    которые терять нельзя. Их хранят в основной базе, например
    в PostgreSQL. В Redis может лежать разве что копия.

- id: bd7-07
  type: card
  question: Что такое сброс кэша и что будет, если его нет?
  answer: |
    Сброс кэша (инвалидация) — удаление копии из кэша, когда изменились
    сами данные. Следующий запрос — промах, и приложение возьмёт свежие
    данные из базы.

    Если сброса нет, копия живёт до конца срока жизни ключа. Всё это
    время пользователи видят **устаревшие данные**: в базе цена новая,
    на сайте старая.

    Что проверяет тестировщик: изменил данные — сразу открыл — видно
    новое? Удалил — не «воскресает» из кэша? И всеми ли способами
    изменения сбрасывается кэш: админка, импорт, обмен с другими
    системами.

- id: bd7-08
  type: quiz
  question: |
    Ты поменял цену товара в админке. На сайте старая цена, через
    3 минуты — новая. Про задержку в требованиях ничего нет. Что делаешь?
  options:
    - "Ничего: через 3 минуты обновилось — значит, работает"
    - "Собираешь факты и спрашиваешь аналитика о допустимой задержке"
    - "Сразу заводишь критичный баг: на сайте показываются неправильные данные"
    - "Очищаешь кэш и проверяешь заново"
  correct: 1
  explanation: |
    Задержка бывает задуманной, а бывает багом — решают требования.
    Их нет — значит, вопрос аналитику: «Сколько можно показывать
    старую цену после изменения?»

    Перед вопросом собери факты: через сколько появилась новая цена,
    что в базе, что в ключе Redis, какой у ключа срок жизни. Очистка
    кэша ничего не проверит — она просто спрячет проблему.

- id: bd7-09
  type: quiz
  question: |
    Пользователи иногда видят в шапке сайта чужое имя. Шапку недавно
    начали кэшировать. Какая причина вероятнее всего?
  options:
    - "В имени ключа кэша нет id пользователя"
    - "У ключа слишком короткий срок жизни"
    - "Redis отвечает слишком медленно и путает ответы"
    - "В базе перепутаны имена пользователей"
  correct: 0
  explanation: |
    Если ключ один на всех — например, `header`, — в нём лежит имя
    того, кто зашёл первым. Остальные видят его имя. Правильно —
    ключ с id пользователя: `header:user:42`.

    Поэтому кэш с личными данными проверяют минимум под двумя
    пользователями.

- id: bd7-10
  type: quiz
  question: |
    Хитрый вопрос. Redis на тестовом стенде перезапустили, все ключи
    кэша пропали. Приложение работает. Это баг?
  options:
    - "Да: потеря данных, критичный баг"
    - "Да: Redis обязан сохранять все ключи при любом перезапуске сервера"
    - "Нужно восстановить ключи из резервной копии"
    - "Нет: кэш — копия, он наполнится заново"
  correct: 3
  explanation: |
    Для кэша пропажа — нормальная ситуация. Оригинал данных в основной
    базе, приложение снова положит копии при следующих запросах.

    Баг был бы, если бы пропало то, что больше нигде не хранится, или
    если бы приложение после перезапуска Redis перестало работать.

- id: bd7-11
  type: card
  question: Redis упал. Что должно происходить с приложением и что проверит тестировщик?
  answer: |
    Зависит от того, что Redis делает в приложении.

    **Кэш.** Обычно ждут: приложение работает медленнее, но работает —
    берёт данные прямо из базы. Если все страницы отвечают `500`,
    «просто кэш» уронил сайт — это повод для бага.

    **Лимиты попыток, выход из аккаунта.** Тут выбор: либо приложение
    работает, но эта защита временно не действует, либо защита важнее,
    и вход блокируется. Решает команда, не тестировщик.

    Что делает тестировщик: узнаёт, что решили, и проверяет на тестовом
    стенде — останавливает Redis и смотрит, что происходит.

- id: bd7-12
  type: quiz
  question: |
    Лимит: не больше 5 попыток входа в минуту с одного IP. Сотрудники
    одного офиса жалуются, что их блокирует, хотя пароли верные. Почему?
  options:
    - "Redis хранит пароли с ошибками"
    - "Срок жизни счётчика слишком длинный, и он не успевает обнулиться"
    - "У всего офиса один IP — и счётчик общий"
    - "Лимит работает только для администраторов"
  correct: 2
  explanation: |
    Счётчик считается по IP. У офиса один внешний адрес на всех —
    пять ошибок разных людей блокируют всех. Вопрос аналитику:
    считать по IP, по логину или по обоим.

    Отсюда проверка: лимит тестируют минимум с двух учётных записей.

- id: bd7-13
  type: quiz
  question: |
    В TaskFlow после `POST /api/v1/auth/logout` старый токен получает
    `401`, хотя сам токен ещё не истёк. Как приложение узнаёт, что
    токен отозван?
  options:
    - "Номер токена лежит в Redis в «чёрном списке»"
    - "Токен удаляется из таблицы `users` в PostgreSQL"
    - "Postman перестаёт отправлять старый токен"
    - "Токен меняется в браузере после выхода"
  correct: 0
  explanation: |
    При выходе номер токена кладут в Redis — ключ `blacklist:…`.
    На каждый запрос приложение проверяет, нет ли токена в списке.

    Срок жизни ключа — сколько оставалось жить токену. Потом токен
    истечёт сам, хранить его в списке незачем.

- id: bd7-14
  type: quiz
  question: |
    Найди подвох. Тестировщик проверил кэш личного кабинета под
    администратором: данные свежие, всё работает. Пишет «Кэш проверен».
    Что не так?
  options:
    - "Ничего: если работает у администратора, работает у всех"
    - "Проверен один пользователь, и не обычный"
    - "Кэш нельзя проверять под администратором"
    - "Нужно было проверять в DBeaver, а не через интерфейс"
  correct: 1
  explanation: |
    Главные риски кэша — чужие данные у другого пользователя и данные,
    зависящие от прав. Под одним пользователем их не увидеть.
    У администратора к тому же другие права и другие данные.

    Нужно минимум два обычных пользователя, лучше — с разными правами.

- id: bd7-15
  type: quiz
  question: |
    Найди подвох. Задача: «Карточку товара кэшируем на 10 минут, при
    изменении в админке кэш сбрасываем». Тестировщик проверил изменения
    через админку — всё обновляется сразу. Что он упустил?
  options:
    - "Ничего: сброс кэша работает"
    - "Скорость сохранения в админке под нагрузкой в тысячу пользователей"
    - "Цвет кнопки «Сохранить»"
    - "Импорт и обмен со складом"
  correct: 3
  explanation: |
    Сброс написан в коде админки. Если товар меняет импорт или обмен
    со складом — мимо этого кода, — кэш не сбросится, и новое появится
    только через 10 минут.

    Вопрос аналитику: «Кто ещё меняет товары, кроме админки?»

- id: bd7-16
  type: quiz
  question: |
    Найди подвох. Общий тестовый стенд. Коллега: «Очищу весь Redis,
    чтобы проверить работу без кэша, — это же просто кэш». Что не так?
  options:
    - "Ничего: кэш на общем стенде можно чистить когда угодно и кому угодно"
    - "Очистка Redis удалит данные из PostgreSQL"
    - "Там не только кэш — коллеги пострадают"
    - "Redis нельзя очищать, только перезапускать"
  correct: 2
  explanation: |
    В общем Redis кроме кэша бывают счётчики, коды из SMS, сессии —
    данные, с которыми прямо сейчас работают коллеги.

    Правильно: дождаться, пока нужный ключ истечёт сам, удалить один
    ключ с согласия команды или проверить на своём локальном стенде.
