# Вопросы темы «Миграции и как их тестировать». Формат — см. osnovy/bag-report.yaml.

- id: bd6-01
  type: card
  question: Что такое миграция базы данных и зачем она нужна?
  answer: |
    Миграция — записанное изменение схемы базы: добавить столбец,
    создать таблицу, сделать поле обязательным, иногда — преобразовать
    данные. Миграции нумеруются и применяются строго по порядку.
    В базе хранится номер последней применённой — по нему видно,
    какая версия схемы на стенде.

    Зачем: база уже с данными, её нельзя пересоздать — её меняют на ходу.
    И меняют одинаково на всех стендах: локально, на тесте, на проде.
    Без миграций каждый стенд правили бы руками, и схемы у всех
    разошлись бы.

    Миграции пишут и запускают разработчики. Тестировщик понимает,
    что миграция меняет, и проверяет схему, старые данные и работу
    приложения после неё.

- id: bd6-02
  type: quiz
  question: Чем upgrade отличается от downgrade в миграции?
  options:
    - "`upgrade` меняет схему, `downgrade` — только данные в таблицах"
    - "`upgrade` выполняется на проде, `downgrade` — только на тестовых стендах"
    - "`upgrade` применяет изменение, `downgrade` — отменяет его"
    - "Это одно и то же, просто названия в разных инструментах"
  correct: 2
  explanation: |
    `upgrade` — шаг вперёд: например, добавить столбец. `downgrade` —
    шаг назад: удалить этот столбец. Оба пишет разработчик.

    Важно: `downgrade` возвращает **устройство** базы, но не всегда
    данные. Удалённый столбец вернётся пустым.

- id: bd6-03
  type: quiz
  question: |
    В TaskFlow есть таблица `alembic_version` с одной строкой. Что в ней?
  options:
    - "Номер последней применённой миграции"
    - "Список всех изменений данных, сделанных через API"
    - "Версия PostgreSQL, на которой работает стенд"
    - "Номер сборки приложения, которая сейчас запущена"
  correct: 0
  explanation: |
    Это служебная таблица инструмента миграций. В ней — номер последней
    применённой миграции. К данным приложения она не относится.

    Сам номер ничего не говорит — важно сравнение: на двух стендах
    разные номера — значит, разные схемы. Это частая причина
    «у меня работает, у коллеги — нет».

- id: bd6-04
  type: card
  question: Чем миграция схемы отличается от миграции данных? Какая опаснее?
  answer: |
    **Миграция схемы** меняет устройство: таблицы, столбцы, типы,
    ограничения. Пример — добавить столбец `delivery_status`.

    **Миграция данных** меняет сами строки: заполняет, переносит,
    преобразует. Пример — всем старым заказам проставить
    `delivery_status = 'DELIVERED'`.

    Опаснее миграция данных. Ошибка в схеме громкая — миграция падает.
    Ошибка в данных тихая — миграция проходит, а данные неправильные:
    не то условие, не учтённые `NULL`, разное написание одного значения.
    Её проверяют по группам до и после — и отдельно убеждаются,
    что строки, которые не должны были измениться, не тронуты.

- id: bd6-05
  type: quiz
  question: |
    Миграция: `ALTER TABLE customers ADD COLUMN phone varchar(20);`
    В таблице 50 000 клиентов. Что будет в `phone` у них после миграции?
  options:
    - "Пустая строка `''` — так база заполняет новые текстовые столбцы"
    - "Миграция упадёт: у старых строк нет значения для нового столбца"
    - "Строка `'не указан'` — значение по умолчанию для `varchar`"
    - "`NULL` у всех 50 000"
  correct: 3
  explanation: |
    Новый необязательный столбец без значения по умолчанию получает
    `NULL` во всех существующих строках. Миграция проходит.

    Для тестировщика это вопрос к требованиям: `NULL` у старых
    клиентов — так и задумано? Приложение нормально показывает
    старых клиентов без телефона? Не выпадают ли они из фильтров?

- id: bd6-06
  type: quiz
  question: |
    Миграция `ALTER TABLE couriers ADD COLUMN transport varchar(20) NOT NULL;`
    прошла на стейдже и упала на проде. Почему?
  options:
    - "На проде другая версия PostgreSQL — `NOT NULL` там работает иначе"
    - "На стейдже таблица пустая, на проде у курьеров нет значения"
    - "Столбец `transport` уже был на проде, а на стейдже — нет"
    - "Миграции нельзя применять дважды — на стейдже она уже прошла"
  correct: 1
  explanation: |
    Обязательный столбец без значения по умолчанию: старым строкам
    нечего в него записать. PostgreSQL отвечает
    `column "transport" of relation "couriers" contains null values`.

    В пустую таблицу такой столбец добавить можно — заполнять нечего.
    Поэтому миграции проверяют на стенде **с данными**. Решение —
    значение по умолчанию или три шага: добавить необязательным,
    заполнить, сделать обязательным.

- id: bd6-07
  type: quiz
  question: |
    Найди подвох. Тестировщик проверил миграцию «добавить статус доставки»
    так: создал новый заказ — статус есть; фильтр «Доставлен» работает.
    Что он упустил?
  options:
    - "Ничего: новая запись и фильтр — это и есть проверка миграции"
    - "Нужно было проверить скорость создания заказа после миграции"
    - "Нужно было проверить, что `alembic_version` изменилась"
    - "Старые заказы: у них статус `NULL`, и фильтры их не покажут"
  correct: 3
  explanation: |
    Главный объект проверки после миграции — **старые** записи.
    Новый столбец у них пустой, а фильтры ищут конкретные статусы:
    `NULL` не равен ни одному. Старые заказы «пропадают» из истории.

    Проверка: `SELECT COUNT(*) FROM orders WHERE delivery_status IS NULL`
    и просмотр старых заказов через API.

- id: bd6-08
  type: quiz
  question: |
    Перед миграцией «телефон клиента уникален» тестировщик хочет понять,
    пройдёт ли она на живых данных. Какой запрос ему нужен?
  options:
    - "`SELECT phone, COUNT(*) FROM customers WHERE phone IS NOT NULL GROUP BY phone HAVING COUNT(*) > 1`"
    - "`SELECT COUNT(*), COUNT(phone), COUNT(DISTINCT id) FROM customers WHERE phone IS NOT NULL AND phone <> ''`"
    - "`SELECT COUNT(DISTINCT id) FROM customers`"
    - "`SELECT phone, created_at FROM customers WHERE phone IS NOT NULL ORDER BY phone, created_at DESC LIMIT 100`"
  correct: 0
  explanation: |
    Ограничение `UNIQUE` не создастся, если повторы уже есть:
    `could not create unique index … Key (phone)=(…) is duplicated`.
    Запрос с `GROUP BY` и `HAVING COUNT(*) > 1` находит повторы,
    а `WHERE phone IS NOT NULL` убирает пустые телефоны.
    Если он что-то вернул — сначала решение бизнеса о повторах,
    потом миграция.

    `NULL` уникальности не мешают: в PostgreSQL несколько `NULL`
    в уникальном столбце допустимы.

- id: bd6-09
  type: card
  question: Что проверяет тестировщик после миграции? Назови основные пункты.
  answer: |
    - **Схема**: столбцы, типы и длины, обязательность, значения
      по умолчанию, ограничения — как в задаче. Вкладки Columns
      и Constraints в DBeaver или `information_schema.columns`.
    - **Число строк** до и после — совпадает.
    - **Старые записи** по одним и тем же `id` — значения те же.
    - **Новое поле у старых строк** — `WHERE новое_поле IS NULL`:
      сколько и так ли задумано. Решают требования.
    - **Приложение**: старые записи видны в списках и фильтрах,
      новые создаются, поле возвращается в API.
    - **Границы**: API и база принимают одно и то же.
    - **Откат**: есть ли план, что будет с данными, есть ли бэкап.

    И главное условие — проверка на стенде с данными, похожими на прод,
    а не на пустой базе.

- id: bd6-10
  type: quiz
  question: |
    Найди подвох. Разработчик: «Отчество клиентов удалили зря, но это
    не страшно — откатим миграцию, и всё вернётся». Что не так?
  options:
    - "Откатывать миграции запрещено — только новая миграция вперёд"
    - "Откат вернёт столбец пустым — значения пропали вместе с ним"
    - "Откат вернёт отчества, но только у клиентов без заказов"
    - "Всё так: для этого `downgrade` и пишут"
  correct: 1
  explanation: |
    `DROP COLUMN` удаляет столбец вместе с данными. Откат создаст
    столбец заново — пустым. Вернуть значения можно только из резервной
    копии, сделанной до миграции.

    Поэтому про удаление данных спрашивают **до** выкладки:
    данные точно не нужны? бэкап есть?

- id: bd6-11
  type: quiz
  question: |
    Миграция `ALTER TABLE orders RENAME COLUMN total TO total_amount`
    выкатилась на прод на 15 минут раньше нового кода. Что видели
    пользователи эти 15 минут?
  options:
    - "Ничего: база сама подставит новое имя в старые запросы"
    - "Суммы заказов были пустыми, но всё остальное работало"
    - "Ошибки на всём, что читает сумму заказа"
    - "Только медленную работу из-за перестройки таблицы"
  correct: 2
  explanation: |
    Старое приложение просит столбец `total`, а его уже нет:
    `column "total" does not exist` — и `500` на каждом таком запросе.

    Переименование — вопрос порядка выкладки. Безопасный путь —
    в несколько шагов: добавить новый столбец, переключить код,
    старый удалить потом. Тестировщику стоит проверить и промежуточное
    состояние «старый код + новая схема».

- id: bd6-12
  type: quiz
  question: |
    Миграция меняет `products.title` с `varchar(200)` на `varchar(100)`.
    Что тестировщик проверит **до** выкладки?
  options:
    - "Есть ли товары с названием длиннее 100 символов"
    - "Сколько товаров с пустым названием"
    - "Сколько товаров добавили в каталог за последнюю неделю"
    - "Сколько всего товаров в таблице"
  correct: 0
  explanation: |
    `SELECT COUNT(*) FROM products WHERE length(title) > 100`.
    Если не ноль — миграция упадёт с `value too long for type
    character varying(100)`, или, если разработчик добавит обрезку,
    названия молча потеряют хвосты. И то и другое нужно решить заранее.

    Граница в API тоже важна — но после миграции: API должен принимать
    100 и отказывать на 101. Это вторая проверка, а не первая.

- id: bd6-13
  type: quiz
  question: |
    Найди подвох. Миграция данных: «всем клиентам из Москвы проставить
    регион 77» — `UPDATE customers SET region = 77 WHERE city = 'Москва'`.
    Тестировщик проверяет тем же условием: число с регионом 77 равно
    числу с городом `'Москва'`. Что не так с проверкой?
  options:
    - "Ничего: условие в проверке точно совпадает с условием в миграции, значит всё сходится"
    - "Нужно было считать через `SUM`, а не через `COUNT`"
    - "Проверка повторяет ошибку миграции: `'г. Москва'` и `'москва'` она не видит"
    - "`UPDATE` с `WHERE` нельзя проверить запросом `SELECT`"
  correct: 2
  explanation: |
    Проверка тем же условием, что и миграция, всегда «сходится» —
    и ничего не доказывает. В живых данных Москва записана по-разному:
    `'г. Москва'`, `'москва'`, с пробелом в конце. Их миграция пропустит.

    Сначала посмотреть варианты написания:
    `SELECT city, COUNT(*) FROM customers WHERE city ILIKE '%москв%' GROUP BY city`.
    И проверить обратное: регион 77 не появился у клиентов из других городов.

- id: bd6-14
  type: card
  question: Как проверить переезд базы на новый сервер?
  answer: |
    - **Число строк** по каждой таблице в старой и новой базе.
      Это первая проверка, но не последняя.
    - **Выборочное сравнение** одних и тех же записей по `id` — все поля.
    - **Кодировка**: «ё», эмодзи, кавычки, длинные тексты.
    - **Даты и время**: не сдвинулся ли часовой пояс.
    - **`NULL` и пустые строки**: число тех и других до и после.
    - **Создание новых записей**: счётчики `id` продолжают нумерацию,
      а не начинают с 1.
    - **Ограничения, индексы, типы** на месте.
    - **Приложение пишет в новую базу**, в старую — ничего.
    - **Скорость** ключевых экранов.
    - **План отката** и что будет с данными, записанными после переезда.

- id: bd6-15
  type: quiz
  question: |
    После переезда базы старые заказы открываются, а создание нового
    падает: `duplicate key value violates unique constraint "orders_pkey"`.
    Самая вероятная причина?
  options:
    - "Счётчик `id` не перенесли — он выдаёт номер, который уже занят"
    - "Новая версия PostgreSQL не поддерживает первичные ключи"
    - "Клиент отправил один и тот же заказ дважды, и вторая копия упала на ключе"
    - "В новой базе не хватает места для новых строк"
  correct: 0
  explanation: |
    Данные скопировали, а счётчик — нет: он начал с 1 и выдаёт `id`,
    которые уже есть. Проверка — сравнить наибольший `id` и текущее
    значение счётчика: `SELECT MAX(id) FROM orders` и
    `SELECT last_value FROM orders_id_seq`.

    Вывод для чек-листа: переезд проверяют не только чтением —
    в каждой основной таблице создают новую запись.

- id: bd6-16
  type: quiz
  question: |
    У тебя новая страница работает, у коллеги — `500`. Код одинаковый,
    стенды разные. Что сравнить первым?
  options:
    - "Версии браузеров у обоих: скорее всего, виноват кэш"
    - "Логи сервера у обоих за последнюю неделю целиком"
    - "Версию схемы базы на обоих стендах"
    - "Тестовые данные: у коллеги их намного больше"
  correct: 2
  explanation: |
    Код одинаковый, а схема может быть разной: стенд коллеги
    **отстал по миграциям**. Код ждёт новый столбец или таблицу,
    а в базе их нет — `500`.

    Сравнить номер версии схемы (в TaskFlow — `alembic_version`)
    и проверить в DBeaver, есть ли нужный столбец. Это быстрее,
    чем разбирать логи.

- id: bd6-17
  type: card
  question: Всегда ли можно откатить миграцию? Что спросить у команды перед рискованной выкладкой?
  answer: |
    Не всегда. Откат возвращает устройство базы, но не всегда данные:

    - удалённый столбец вернётся пустым;
    - преобразованные данные — например, имя и фамилия, склеенные
      в одно поле, — обратно без потерь не разделить;
    - откат бывает не написан или не работает — про него вспоминают
      только в аварии.

    Что спросить: откат проверяли? что он сделает с данными? есть ли
    резервная копия перед миграцией? сколько миграция идёт на объёме
    прода и блокирует ли таблицы? Если откат невозможен — это решение
    должно быть принято заранее.
