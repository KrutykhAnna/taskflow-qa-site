# Вопросы темы «Что такое база данных». Формат — см. osnovy/bag-report.yaml.

- id: bd1-01
  type: card
  question: Что такое база данных и СУБД? Чем они отличаются?
  answer: |
    **База данных** — организованный набор данных одного приложения:
    таблицы со строками и столбцами, связи между ними, правила.

    **СУБД** (система управления базами данных) — программа, которая хранит
    базы, выполняет запросы, следит за правилами и даёт работать многим
    пользователям одновременно. Примеры — PostgreSQL, MySQL, Oracle.

    Одна СУБД может хранить много баз. Например, на одном сервере PostgreSQL
    лежат базы нескольких приложений.

    Чем база лучше таблицы в Excel: одновременная работа сотен пользователей,
    миллионы строк, правила, которые нельзя нарушить (уникальность, типы,
    обязательные поля), и связи, которые база охраняет сама.

- id: bd1-02
  type: quiz
  question: Какое утверждение о таблице базы данных верно?
  options:
    - "Строка — один объект, столбец — одно свойство у всех объектов"
    - "Строка — одно свойство у всех объектов, столбец — один объект"
    - "Строка и столбец — одно и то же, разница только в отображении"
    - "Столбец может хранить значения разных типов в разных строках"
  correct: 0
  explanation: |
    **Строка** (запись) — один объект: один пользователь, одна задача.
    **Столбец** (поле) — одно свойство у всех объектов: `email` у всех
    пользователей.

    У столбца один тип на всю таблицу. Если столбец — `integer`, строку
    в нём сохранить нельзя: база откажет.

- id: bd1-03
  type: card
  question: Что такое первичный ключ и внешний ключ? Приведи пример.
  answer: |
    **Первичный ключ** (PK) — столбец или набор столбцов, по которому строку
    находят однозначно. Уникален и не бывает `NULL`. Обычно это `id`.

    **Внешний ключ** (FK) — столбец, который ссылается на первичный ключ
    другой таблицы. Пример: `tasks.project_id` ссылается на `projects.id` —
    у задачи записан номер её проекта.

    Внешний ключ охраняет целостность: база не даст сохранить задачу
    с `project_id = 999`, если проекта 999 нет. А правило удаления у ключа
    (например, `ON DELETE CASCADE`) определяет, что станет с задачами,
    если удалить проект.

- id: bd1-04
  type: quiz
  question: |
    В таблице задач у одной строки `assignee_id = NULL`. Что это значит?
  options:
    - "Задача назначена на пользователя с номером 0, его ещё нет в системе"
    - "В поле записана пустая строка, исполнитель был, но его стёрли"
    - "Значения нет: у задачи пока нет исполнителя, его не назначили"
    - "Строка повреждена, базе не удалось прочитать значение этого поля"
  correct: 2
  explanation: |
    `NULL` — отметка «значения нет или оно неизвестно». Это не `0`
    и не пустая строка `''`.

    `0` во внешнем ключе значил бы ссылку на пользователя с `id = 0` — база
    такую ссылку не сохранит, если такого пользователя нет. Пустая строка
    в числовом столбце невозможна вообще.

    Ловушка — считать `NULL` «ошибкой» или «нулём». Для тестов важно другое:
    `NULL` и пустое значение код и запросы обрабатывают по-разному.

- id: bd1-05
  type: quiz
  question: Какая группа команд SQL изменяет данные в таблицах?
  options:
    - "DDL — `CREATE`, `ALTER`, `DROP`"
    - "DML — `INSERT`, `UPDATE`, `DELETE`"
    - "DCL — `GRANT`, `REVOKE`"
    - "TCL — `BEGIN`, `COMMIT`, `ROLLBACK`"
  correct: 1
  explanation: |
    - **DDL** — структура: создать, изменить, удалить таблицу.
    - **DML** — данные: добавить, изменить, удалить строки.
    - **DQL** — чтение: `SELECT`. В некоторых книгах его относят к DML.
    - **DCL** — права доступа.
    - **TCL** — транзакции.

    Частая путаница — `DROP` и `DELETE`. `DELETE` удаляет строки,
    таблица остаётся. `DROP TABLE` удаляет саму таблицу вместе с данными.

- id: bd1-06
  type: card
  question: Как в базе устроена связь «многие ко многим»? Приведи пример.
  answer: |
    Через **промежуточную таблицу**: каждая её строка — одна пара
    «объект слева — объект справа», а оба столбца — внешние ключи.

    Пример: у задачи несколько меток, одна метка на многих задачах.
    Таблица `task_labels (task_id, label_id)` — строка «на задаче 1 висит
    метка 5». Первичный ключ — составной, из обоих столбцов: одна и та же
    пара не повторится.

    В промежуточной таблице бывают и данные о самой связи. В
    `project_members (project_id, user_id, role)` роль принадлежит паре:
    один и тот же человек — менеджер в одном проекте и наблюдатель в другом.

    Одним внешним ключом многие-ко-многим не сделать: в столбец задачи
    не положить список меток.

- id: bd1-07
  type: card
  question: Какие СУБД ты знаешь и где они встречаются? Чем отличаются их диалекты SQL?
  answer: |
    - **PostgreSQL** — веб-сервисы, финтех, стартапы. Бесплатная, очень
      распространена.
    - **MySQL / MariaDB** — сайты, интернет-магазины, CMS.
    - **MS SQL Server** — корпоративные системы на технологиях Microsoft.
    - **Oracle** — крупные банки, телеком.
    - **SQLite** — база в одном файле внутри приложения: мобильные
      приложения, браузеры.

    Основа SQL общая: `SELECT … FROM … WHERE` пишется одинаково. Диалекты
    отличаются деталями: как ограничить число строк (`LIMIT`, `TOP`,
    `FETCH FIRST`), какие есть типы и функции, как работают даты.

    Кроме реляционных, есть NoSQL: MongoDB (документы), Redis
    (ключ — значение), Elasticsearch (поиск).

- id: bd1-08
  type: quiz
  question: |
    Таблица участников проекта `project_members (project_id, user_id, role)`
    не имеет своего `id`. Первичный ключ — пара `(project_id, user_id)`.
    Что это даёт?
  options:
    - "Участника можно быстро найти по роли без перебора всей таблицы"
    - "При удалении проекта база сама удалит пользователей проекта"
    - "Один пользователь может быть в проекте с несколькими ролями"
    - "Один пользователь записан в одном проекте не больше одного раза"
  correct: 3
  explanation: |
    Составной первичный ключ уникален как пара: `(1, 2)` может быть только
    одна строка. Значит, пользователь 2 в проекте 1 записан один раз —
    с одной ролью.

    Если бы ключом был отдельный `id`, а пара не была уникальной, база
    пропустила бы дубль: пользователь в проекте дважды, с разными ролями.
    Какая из них действует — непонятно.

    Ловушка — «каскад»: правило удаления задаётся у внешних ключей, а не
    у первичного. И удаляются при каскаде строки участия, а не сами
    пользователи.

- id: bd1-09
  type: quiz
  question: |
    В системе мягкое удаление: у удалённых пользователей заполнен
    `deleted_at`. Требование — email освобождается после удаления.
    Как должна быть устроена уникальность email в базе?
  options:
    - "Обычный уникальный индекс на `email` — удалённых он не учитывает"
    - "Уникальность только среди строк, где `deleted_at` пустой"
    - "Уникальность по паре `email` и `deleted_at` по всей таблице"
    - "Уникальность в базе не нужна, достаточно проверки в коде API"
  correct: 1
  explanation: |
    Нужен **частичный уникальный индекс** с условием «только неудалённые»:
    `CREATE UNIQUE INDEX … ON users (email) WHERE deleted_at IS NULL`.
    Два живых пользователя с одним email невозможны, живой и удалённый —
    возможны.

    Обычный индекс удалённую строку видит, и повторная регистрация упадёт.
    Пара `email` + `deleted_at` не защищает живых: в PostgreSQL `NULL`
    не равен `NULL`, и два живых пользователя с одним email пройдут.
    Только проверка в коде не спасает от двух одновременных запросов —
    оба увидят «email свободен».

- id: bd1-10
  type: quiz
  question: |
    В спецификации название проекта — от 1 до 100 символов. В базе
    столбец `varchar(100)`. Разработчик забыл проверку длины в API.
    Что получит клиент на название из 101 символа?
  options:
    - "Скорее всего `500`: база откажет, а API не превратит это в `422`"
    - "`201`: база сама обрежет строку до 100 символов и сохранит её"
    - "`422`: база вернёт ошибку валидации в том же формате, что и API"
    - "`201`: база сохранит все 101 символ, лимит `varchar` — лишь совет"
  correct: 0
  explanation: |
    PostgreSQL строку длиннее `varchar(n)` не обрезает и не сохраняет —
    возвращает ошибку. Если API её не обработал, клиент увидит `500`
    вместо понятного `422`.

    Отсюда правило: граница в API и граница в базе — одна и та же.
    На 100 и 101 символ проверяют не только «сохранилось ли», но и
    **какой код** вернулся. `500` на длинной строке — баг валидации.

    Ловушка — «база сама обрежет». Так делают некоторые настройки MySQL,
    но не PostgreSQL. Обрезка без ошибки — ещё хуже: данные теряются молча.

- id: bd1-11
  type: quiz
  question: |
    Столбец `created_at` — `timestamp with time zone`. В DBeaver видно
    `2026-10-15 09:30:00+00`, на экране у пользователя из Москвы —
    «15.10, 12:30». Что это?
  options:
    - "Баг: время в базе отстаёт на 3 часа, его нужно сохранять по Москве"
    - "Баг: экран прибавляет к времени лишние 3 часа при отображении"
    - "Норма: в базе время в UTC, экран показывает его в поясе пользователя"
    - "Норма: база и экран всегда расходятся, сравнивать их бессмысленно"
  correct: 2
  explanation: |
    `+00` — это UTC. 09:30 по UTC — это 12:30 по Москве. Момент один и тот
    же, просто показан в разных поясах. Хранить в UTC — правильная практика.

    Что проверять на самом деле: экран переводит время в пояс пользователя;
    при смене пояса меняется экран, а не база; события около полуночи
    попадают в правильный день отчёта.

    Ловушка — «сравнивать бессмысленно». Сравнивать нужно, но после
    приведения к одному поясу.

- id: bd1-12
  type: quiz
  question: |
    Столбец `role` в базе — enum-тип со значениями `USER` и `ADMIN`.
    Нужно ли проверять, как API отвечает на неизвестную роль `MODERATOR`?
  options:
    - "Нет: база всё равно не сохранит значение, которого нет в enum"
    - "Нет: enum в базе автоматически проверяет и тело запроса в API"
    - "Да, но только если в базе вместо enum обычный столбец `varchar`"
    - "Да: база откажет, но клиент должен увидеть `422`, а не `500`"
  correct: 3
  explanation: |
    Enum в базе — последняя линия обороны: неизвестное значение он
    не пропустит. Но если API не проверил значение сам, ошибка базы
    превратится в `500`, а клиент не поймёт, что сделал не так.

    Проверка в API нужна, чтобы ответить понятной ошибкой валидации.
    Проверка в базе — чтобы данные не испортились, даже если код ошибся
    или кто-то пишет в базу в обход API.

    Если столбец — `varchar`, всё ещё важнее: тогда допустимые значения
    охраняет только код.

- id: bd1-13
  type: card
  question: Что такое каскадное удаление? Почему при этом приложения часто удаляют мягко?
  answer: |
    **Каскадное удаление** — правило внешнего ключа `ON DELETE CASCADE`:
    удалили «родителя» — база сама удаляет «детей». Удалили проект —
    исчезли его задачи, у задач — комментарии.

    Бывают и другие правила: запретить удаление, пока есть дети, или
    поставить детям `NULL` вместо ссылки.

    **Мягкое удаление** — запись не стирается, ей ставят отметку
    (например, `deleted_at`). Приложение само помечает связанные записи.
    Плюсы: можно восстановить, остаётся история, отчёты за прошлое
    не ломаются.

    Риск каскада: кто-то выполнит настоящий `DELETE` в обход приложения —
    например, «почистит данные» на стенде, — и вместе с проектом молча
    исчезнут все его задачи.

- id: bd1-14
  type: quiz
  question: |
    Тебе выдали доступ к базе общего тестового стенда. Что сделать
    в первую очередь, прежде чем писать запросы?
  options:
    - "Включить в клиенте режим только чтения для этого подключения"
    - "Сделать резервную копию базы, чтобы можно было всё вернуть"
    - "Удалить старые тестовые данные, чтобы они не мешали проверкам"
    - "Проверить, что под этой учётной записью работает `UPDATE`"
  correct: 0
  explanation: |
    Режим только чтения защищает от случайной правки: неосторожный
    `UPDATE`, двойной щелчок по ячейке в таблице данных. На общем стенде
    такая правка ломает проверки коллег.

    Резервное копирование общей базы — задача не тестировщика.
    Удалять чужие тестовые данные нельзя: кто-то на них опирается.
    А проверять, работает ли `UPDATE`, — значит менять данные без нужды.

    Менять данные в базе стенда — осознанное действие по договорённости
    с командой, а не привычка.

- id: bd1-15
  type: quiz
  question: |
    На стенде — копия базы прода. Ты нашёл баг в отчёте по клиентам.
    Что приложить к баг-репорту?
  options:
    - "Полную выгрузку отчёта, чтобы разработчик видел все случаи"
    - "Выгрузку без столбца с телефонами, остальные поля — как есть"
    - "Выгрузку целиком в архиве с паролем, пароль — в комментарии"
    - "Пару строк, где имена, телефоны и адреса заменены или скрыты"
  correct: 3
  explanation: |
    Имена, телефоны, адреса — персональные данные, их обработку регулирует
    закон. Баг-трекер видят многие, иногда подрядчики. Для воспроизведения
    бага обычно хватает 2–3 строк с обезличенными полями.

    Убрать один столбец мало: имя с адресом — тоже персональные данные.
    Архив с паролем в том же тикете — та же утечка.

    Мидл заодно поднимает вопрос: копии прода на стенде должны быть
    обезличены, а не просто «аккуратно использоваться».

- id: bd1-16
  type: quiz
  question: Какое утверждение о NoSQL-базах верно?
  options:
    - "NoSQL — значит без схемы: данные можно класть как угодно, проверять нечего"
    - "Структура данных есть всегда, в документных базах её часто держит код"
    - "NoSQL-базы не поддерживают запросы, данные читают только целиком"
    - "NoSQL — новая версия SQL, которая постепенно заменяет реляционные"
  correct: 1
  explanation: |
    В реляционной базе схему охраняет СУБД: типы, ключи, обязательные поля.
    В документной базе вроде MongoDB документы в одной коллекции могут
    отличаться, и структуру держит код приложения. Значит, и проверять её
    нужно: что код пишет обязательные поля, правильные типы, не оставляет
    документы «старого формата».

    У NoSQL-баз есть свои языки запросов. И они не замена реляционным,
    а другой инструмент: кэш — Redis, поиск — Elasticsearch, разнородные
    документы — MongoDB, деньги и связи — реляционная база.

- id: bd1-17
  type: card
  question: Зачем тестировщику база данных, если есть API?
  answer: |
    API показывает то, что сервер решил показать. База — что сохранилось
    на самом деле.

    - **Проверить побочные эффекты.** После `201` посмотреть, что
      записалось, включая поля, которых нет в ответе, и связанные таблицы.
    - **Подготовить данные.** Найти пользователя с нужной ролью или запись
      в нужном состоянии.
    - **Локализовать баг.** Данные в базе правильные, а API отдаёт не то —
      баг в коде чтения. В базе уже неправильно — в коде записи.
    - **Увидеть скрытое.** Мягко удалённые записи, журнал действий,
      служебные поля.

    Ограничения: не на проде, по умолчанию только чтение, только тестовые
    данные.

- id: bd1-18
  type: quiz
  question: |
    В таблице заказов есть заказ, которого нет в ответе `GET /orders`
    под его владельцем. Что сделать первым?
  options:
    - "Сразу завести баг: в базе есть, а API не отдаёт — данные потеряны"
    - "Удалить заказ из базы, чтобы данные в базе и в API совпадали"
    - "Проверить законные причины: удаление, фильтр, пагинация, статус"
    - "Ничего: API всегда показывает меньше, чем лежит в базе, это норма"
  correct: 2
  explanation: |
    «Есть в базе» — не значит «должен видеть пользователь». Заказ может
    быть мягко удалён, не подходить под фильтр по умолчанию, лежать
    на следующей странице, быть черновиком, а ответ — взят из кэша.

    Если ни одна причина не подходит и по требованиям заказ должен быть
    виден — это баг. В отчёт: запрос в базу, запрос в API и раздел
    требований.

    «Это норма» — тоже ловушка: расхождение без объяснения — повод
    разобраться, а не пропустить.
