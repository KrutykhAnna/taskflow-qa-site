# Вопросы темы «Как тестировать базу данных». Формат — см. osnovy/bag-report.yaml.

- id: bd5-01
  type: card
  question: Что проверяет тестировщик в базе данных и чего обычно не делает?
  answer: |
    Что проверяет:

    - **Данные после действия** — сохранилось, изменилось или удалилось
      ровно то, что нужно, и больше ничего. Соседние записи не задеты.
    - **Целостность и ограничения** — база сама не пускает мусор: пустые
      обязательные поля, ссылки «в никуда», повторы ключей, слишком длинные строки.
    - **Служебные поля и побочные эффекты** — `created_at`, `deleted_at`,
      журнал действий, связанные таблицы, каскады.
    - **Транзакции** — операция из нескольких шагов выполняется целиком
      или не выполняется вовсе.
    - **Тестовые данные** — подготовка нужного состояния и уборка за собой.
    - **Безопасность данных** — пароли хранятся хешем, лишние персональные
      данные не сохраняются.

    Главный приём — «API → БД»: действие через API, потом `SELECT` по `id`
    из ответа и сверка каждого поля, соседей и побочных эффектов.

    Чего ручной тестировщик обычно не делает: нагрузочное тестирование СУБД,
    настройку индексов, администрирование. Но заметить медленный экран
    на больших данных и принести это команде — его работа.

- id: bd5-02
  type: quiz
  question: |
    Тестировщик выполнил в базе стенда `UPDATE tasks SET status = 'DONE';`
    и забыл дописать условие. Что произойдёт?
  options:
    - "Ошибка синтаксиса: `UPDATE` нельзя выполнить без `WHERE`"
    - "Изменится только первая строка таблицы — по порядку `id`"
    - "Статус `DONE` получат все строки таблицы `tasks`"
    - "Ничего: без условия база не знает, какие строки менять"
  correct: 2
  explanation: |
    `WHERE` в `UPDATE` и `DELETE` не обязателен. Без него команда действует
    на **всю таблицу** — без ошибки и без вопросов. База ответит
    `UPDATE N`, где `N` — число строк в таблице.

    Привычка, которая спасает: сначала `SELECT` с тем же `WHERE`,
    посмотреть число строк, потом `UPDATE`. И эксперименты — только
    внутри `BEGIN … ROLLBACK`.

- id: bd5-03
  type: quiz
  question: |
    После `UPDATE tasks SET status = 'DONE' WHERE id = 999;` база ответила
    `UPDATE 0`. Что это значит?
  options:
    - "Строк под условием нет — ничего не изменено, это не ошибка"
    - "Задача 999 обновлена, `0` — код успешного завершения команды"
    - "Команда упала с ошибкой, и транзакция теперь сломана"
    - "Изменение сохранено, но станет видно другим только после `COMMIT`"
  correct: 0
  explanation: |
    Число после `UPDATE` — сколько строк изменено. `0` значит, что условие
    не совпало ни с одной строкой: задачи 999 нет. Для базы это нормальный
    результат, ошибки нет.

    Для тестировщика — сигнал: проверь условие. Типичная ловушка —
    `WHERE assignee_id = NULL`: сравнение с `NULL` никогда не истинно,
    и `UPDATE` тихо изменит 0 строк. Правильно — `IS NULL`.

- id: bd5-04
  type: card
  question: Чем первичный ключ отличается от ограничения UNIQUE?
  answer: |
    Общее: оба запрещают повторы. Нарушение даёт одну и ту же ошибку
    PostgreSQL — `duplicate key value violates unique constraint "…"`.

    Отличия:

    - **Первичный ключ** у таблицы один. Он не бывает `NULL`. По нему
      строку находят однозначно, и чаще всего именно на него ссылаются
      внешние ключи (хотя сослаться можно и на столбец с `UNIQUE`).
    - **`UNIQUE`** у таблицы может быть сколько угодно. Столбец с `UNIQUE`
      допускает `NULL` — и в PostgreSQL даже несколько строк с `NULL`:
      два «неизвестно» не считаются равными.

    Оба бывают составными — из нескольких столбцов. Пример: у участников
    проекта ключ — пара `(project_id, user_id)`. Один пользователь
    в одном проекте — одна строка, а в разных проектах — сколько угодно.

    Для мягкого удаления часто нужен **частичный** уникальный индекс —
    уникальность только среди строк с `deleted_at IS NULL`. Иначе удалённая
    запись навсегда «занимает» значение.

- id: bd5-05
  type: quiz
  question: |
    На столбце `products.sku` стоит `UNIQUE`. Два раза подряд вставляют
    товар с `sku = NULL`. Что ответит PostgreSQL?
  options:
    - "Вторая вставка упадёт: `NULL` уже есть в уникальном столбце"
    - "Первая вставка упадёт: уникальный столбец не допускает `NULL`"
    - "Обе пройдут, но вторая заменит первую строку с тем же `sku`"
    - "Обе пройдут: два `NULL` не считаются одинаковыми значениями"
  correct: 3
  explanation: |
    `NULL` — это «значение неизвестно». Два «неизвестно» PostgreSQL
    не считает равными, поэтому `UNIQUE` их не сравнивает: строк с `NULL`
    может быть сколько угодно.

    Для тестов это значит: если поле должно быть уникальным **и обязательным**,
    одного `UNIQUE` мало — нужен ещё `NOT NULL`. Иначе в базе окажется
    много записей «без артикула».

- id: bd5-06
  type: quiz
  question: |
    У `comments.text` — `varchar(500) NOT NULL`. Тестировщик вставляет
    комментарий прямо в базу с текстом `''`. Что будет?
  options:
    - "Ошибка `null value violates not-null constraint`"
    - "Строка запишется: пустая строка — значение, а не `NULL`"
    - "База сама заменит пустую строку на `NULL` и запишет её"
    - "Ошибка `value too long`: пустая строка не проходит по длине"
  correct: 1
  explanation: |
    `NOT NULL` запрещает только `NULL`. Пустая строка `''` — обычное
    значение длиной 0, ограничение её пропускает.

    Правило «не меньше одного символа» в таких системах обычно проверяет
    только API: через него пустой комментарий получит `422`. А мимо API —
    импортом, скриптом, руками в DBeaver — пустой текст попадёт в базу.
    Хочешь запретить и в базе — нужен `CHECK`, например
    `CHECK (length(text) > 0)`.

- id: bd5-07
  type: quiz
  question: |
    Какую ошибку вернёт PostgreSQL на вставку задачи с `project_id = 999`,
    если проекта 999 нет, а `tasks.project_id` — внешний ключ на `projects`?
  options:
    - "`duplicate key value violates unique constraint …`"
    - "`insert or update … violates foreign key constraint`"
    - "`null value in column … violates not-null constraint`"
    - "`new row for relation … violates check constraint`"
  correct: 1
  explanation: |
    Внешний ключ требует, чтобы значение существовало в родительской
    таблице. Полный текст: `insert or update on table "tasks" violates
    foreign key constraint "tasks_project_id_fkey"`, а во второй строке —
    `Key (project_id)=(999) is not present in table "projects"`.

    Через API ссылка на несуществующий проект должна давать понятный
    `404` или `422` — как записано в спецификации. Если API отвечает
    `500` — он не проверил данные и «упал» о внешний ключ. Это баг.

- id: bd5-08
  type: card
  question: Что означают ON DELETE CASCADE, RESTRICT и SET NULL? Как это проверить?
  answer: |
    Правило внешнего ключа решает, что станет с дочерними строками,
    если **физически** удалить родителя:

    - **`CASCADE`** — дети удаляются вместе с родителем. Без ошибки
      и без предупреждения. Пример: позиции заказа удаляются с заказом.
    - **`RESTRICT`** — удалить родителя нельзя, пока есть дети: ошибка
      внешнего ключа. Пример: товар, который есть в заказах.
      **`NO ACTION`** — то, что действует, если правило не указано;
      для тестировщика почти то же, что `RESTRICT`.
    - **`SET NULL`** — дети остаются, ссылка в них становится `NULL`.
      Пример: заказ остаётся, если уволили менеджера.

    Как проверить: посмотреть правило в DDL или на вкладке Foreign Keys,
    сравнить с требованием и выполнить удаление родителя **с детьми**
    внутри `BEGIN … ROLLBACK` — посчитать детей до и после.
    На родителе без детей все три правила выглядят одинаково.

    Важно: правила срабатывают только на настоящий `DELETE`. Мягкое
    удаление — это `UPDATE`, каскад для него делает код приложения.

- id: bd5-09
  type: quiz
  question: |
    У `tasks.project_id` — `ON DELETE CASCADE`, у `comments.task_id` — тоже.
    В проекте 4 одна задача с одним комментарием. Тестировщик выполнил
    `DELETE FROM projects WHERE id = 4;`. Что ответит база? Найди подвох.
  options:
    - "Ошибку: у проекта есть задачи, удалить его нельзя"
    - "`DELETE 3` — проект, задачу и комментарий"
    - "`DELETE 1` и предупреждение о каскадно удалённых строках"
    - "`DELETE 1` — и молча удалит задачу и комментарий"
  correct: 3
  explanation: |
    `CASCADE` не запрещает удаление, а распространяет его: проект →
    задачи → комментарии. Подвох в ответе базы: `DELETE 1` — это только
    строки, которые удалила **сама команда**, то есть проект. О каскадно
    удалённых строках база не сообщает и не предупреждает.

    Поэтому каскад проверяют своими `SELECT`: посчитать детей до удаления
    и после. Делать такое — только внутри `BEGIN … ROLLBACK` и только
    на своём стенде.

- id: bd5-10
  type: quiz
  question: |
    Пользователь 6 мягко удалён — у него заполнен `deleted_at`.
    `tasks.assignee_id` — внешний ключ на `users(id)`. Что будет при
    `UPDATE tasks SET assignee_id = 6 WHERE id = 5;` прямо в базе?
  options:
    - "Пройдёт: строка пользователя 6 есть, ключу этого хватает"
    - "Ошибка внешнего ключа: пользователь 6 считается удалённым"
    - "Пройдёт, но база сама сбросит `assignee_id` обратно в `NULL`"
    - "Ошибка `NOT NULL`: у удалённого пользователя пустые поля"
  correct: 0
  explanation: |
    Внешний ключ проверяет только, что **строка** с таким `id` есть.
    Про `deleted_at` он ничего не знает: для базы мягко удалённая запись
    существует.

    Проверка «нельзя назначить удалённого» живёт только в коде API.
    Значит, это тест-кейс для API: назначить удалённого или несуществующего
    пользователя — ожидаемая ошибка по спецификации. А данные, вставленные
    мимо API, могут ссылаться на удалённые записи.

- id: bd5-11
  type: card
  question: Что такое транзакция? Что делают COMMIT и ROLLBACK? Что такое автокоммит?
  answer: |
    **Транзакция** — группа команд, которая выполняется целиком или никак.
    Классический пример — перевод денег: списать и зачислить. Половины
    перевода быть не должно.

    - `BEGIN` — начать транзакцию.
    - `COMMIT` — сохранить. После этого изменения видят все, отменить нельзя.
    - `ROLLBACK` — отменить всё, что сделано после `BEGIN`.

    Пока нет `COMMIT`, изменения видны только в твоём подключении —
    приложение и коллеги видят старые данные. А изменённые строки
    заблокированы: чужие изменения этих строк ждут конца транзакции.

    **Автокоммит** — режим, в котором каждая команда сразу сохраняется
    отдельной транзакцией. В DBeaver — переключатель Auto-Commit /
    Manual Commit. В Auto-Commit `ROLLBACK` после `UPDATE` уже ничего
    не вернёт. Для экспериментов — Manual Commit и `BEGIN … ROLLBACK`.

- id: bd5-12
  type: quiz
  question: |
    DBeaver в режиме Auto-Commit. Тестировщик выполнил `UPDATE` без `BEGIN`,
    понял, что ошибся, и выполнил `ROLLBACK`. Что произойдёт?
  options:
    - "Изменения отменятся: `ROLLBACK` отменяет последнюю команду"
    - "DBeaver спросит, какую из последних команд нужно отменить"
    - "Ничего не отменится: `UPDATE` уже сохранён автокоммитом"
    - "Отменится вся работа за сеанс, включая прошлые запросы"
  correct: 2
  explanation: |
    В автокоммите каждая команда — отдельная транзакция, сохранённая сразу.
    К моменту `ROLLBACK` открытой транзакции нет: PostgreSQL ответит
    предупреждением `there is no transaction in progress` и ничего
    не вернёт.

    Путь назад — восстановление данных: сброс своего стенда или резервная
    копия. Поэтому для изменений — Manual Commit и `BEGIN` первой строкой.

- id: bd5-13
  type: quiz
  question: |
    В транзакции первая команда прошла, вторая упала на внешнем ключе.
    Теперь любой `SELECT` отвечает `current transaction is aborted,
    commands ignored until end of transaction block`. Что делать?
  options:
    - "Выполнить `COMMIT` — сохранится первая команда, вторая нет"
    - "Повторить вторую команду с правильным значением — транзакция оживёт"
    - "Переподключиться: такая ошибка значит, что база недоступна"
    - "Выполнить `ROLLBACK` и начать транзакцию заново"
  correct: 3
  explanation: |
    В PostgreSQL ошибка внутри транзакции «ломает» её целиком: все
    следующие команды отвергаются до конца транзакции. Выход — `ROLLBACK`.

    `COMMIT` здесь ничего не сохранит: PostgreSQL выполнит откат
    и ответит `ROLLBACK`. Первая, успешная команда тоже отменится —
    это и есть «всё или ничего». Продолжить после ошибки можно, только
    если заранее поставить `SAVEPOINT` и откатиться к нему.

- id: bd5-14
  type: quiz
  question: |
    В DBeaver (Manual Commit) тестировщик выполнил
    `UPDATE tasks SET title = 'Черновик' WHERE id = 5;` и не закоммитил.
    `SELECT` в DBeaver показывает «Черновик». Что вернёт `GET /tasks/5`
    через API в этот момент?
  options:
    - "Старое название: API не видит незакоммиченных изменений"
    - "«Черновик»: API и DBeaver работают с одной и той же базой"
    - "Ошибку `500`: строка задачи заблокирована транзакцией"
    - "Пустой ответ, пока транзакция в DBeaver не завершится"
  correct: 0
  explanation: |
    База одна, но подключения разные. Незакоммиченные изменения видны
    только в том подключении, где сделаны. API читает последнюю
    закоммиченную версию — со старым названием.

    Чтение при этом не блокируется. А вот **изменение** той же строки
    через API — `PATCH /tasks/5` — будет ждать, пока транзакция
    в DBeaver не закончится. Забытая открытая транзакция выглядит
    как «API завис».

- id: bd5-15
  type: card
  question: Зачем нужна и валидация в API, и ограничения в базе? Что если они не совпадают?
  answer: |
    Это два уровня защиты:

    - **Валидация в API** проверяет запрос до базы и даёт понятную ошибку —
      `422` с указанием поля.
    - **Ограничение в базе** — последний рубеж. Защищает от всех, кто пишет
      мимо API: импорта, скриптов, другого сервиса, ручных правок,
      одновременных запросов.

    Границы должны совпадать. Если разошлись:

    - **API пропускает, база не пускает** — например, API до 255 символов,
      в базе `varchar(100)`: на 101 символе пользователь получает `500`.
    - **База пропускает, API не проверяет** — мусор в базе: статус
      не из списка, отрицательная цена.
    - **Правило только в API** — работает, пока все пишут через API
      и по одному. Два одновременных запроса — и уникальность нарушена.

    Как найти расхождение: сравнить спецификацию, DDL и поведение API
    на границе — `n` и `n + 1`. `500` в ответ на неверные данные
    клиента — всегда баг.

- id: bd5-16
  type: quiz
  question: |
    В спецификации и в валидации API поле «тема» — до 255 символов.
    В базе — `varchar(100)`. Пользователь отправляет тему из 150 символов.
    Какой ответ он, скорее всего, получит?
  options:
    - "`201`: база сама обрежет строку до 100 символов"
    - "`422`: API сравнит длину со схемой базы до записи"
    - "`500`: валидация пропустит, а база отвергнет строку"
    - "`409`: база сообщит о конфликте длины с ограничением"
  correct: 2
  explanation: |
    Валидация API знает только про 255 — 150 символов проходят. Запись
    в базу падает с ошибкой `value too long for type character
    varying(100)`. API такую ошибку не ожидал — обычно это `500`.

    PostgreSQL строку молча не обрезает — он отвергает её целиком.
    Баг — расхождение валидации и схемы. Какая граница правильная, решает
    команда. После исправления тестировщик проверяет `n` и `n + 1`
    на обоих уровнях.

- id: bd5-17
  type: quiz
  question: |
    На складе 10 единиц товара. Два менеджера одновременно открыли карточку,
    оба видят 10. Первый сохранил `stock = 7`, второй — `stock = 8`.
    В базе 8. Как называется проблема?
  options:
    - "Нарушение ограничения `CHECK`: остаток не может уменьшаться"
    - "Потерянное обновление: изменение первого менеджера затёрто"
    - "Сломанная транзакция: вторая команда должна была упасть"
    - "Каскадное удаление: второе изменение удалило первое"
  correct: 1
  explanation: |
    Каждый менеджер считал от устаревшего значения 10 и записал готовое
    число. Второй затёр результат первого — правильный остаток 5,
    а в базе 8. Ошибок нет, каждая транзакция по отдельности корректна.

    Спасают запись от текущего значения — `SET stock = stock - 2`, —
    блокировка строки или проверка версии записи. Тестировщик проверяет
    это двумя клиентами: две вкладки или два запроса почти одновременно —
    и смотрит в базе, не потерялось ли чьё-то изменение.

- id: bd5-18
  type: quiz
  question: |
    Чтобы проверить экран задач, тестировщик вставил 50 задач прямо
    в базу через `INSERT`. Найди главный риск такого подхода.
  options:
    - "`INSERT` в базу работает медленнее, чем запросы к API"
    - "Через базу нельзя создать больше 10 строк за один запрос"
    - "Строки, вставленные через `INSERT`, не видны другим пользователям"
    - "Данные могут быть такими, каких API никогда бы не создал"
  correct: 3
  explanation: |
    `INSERT` обходит бизнес-логику: валидацию, значения по умолчанию
    из кода, связанные записи, журнал. Можно записать статус, которого
    API не знает, проект без участника-владельца, пустой текст. На таких
    данных легко найти «баг», которого у пользователей не будет.

    Правило: по возможности создавать данные через API. Через базу —
    осознанно, повторяя всё, что делает API, на своём стенде, с откатом
    или сбросом после теста. Закоммиченные изменения видны всем.

- id: bd5-19
  type: quiz
  question: |
    Тестировщик по привычке сначала выполнил `SELECT … WHERE status = 'TODO'`
    — 3 строки. Потом `UPDATE … SET status = 'IN_PROGRESS' WHERE status = 'TODO'`
    — база ответила `UPDATE 5`. Это в одной транзакции. Что делать?
  options:
    - "Не коммитить: выполнить `ROLLBACK` и выяснить, откуда разница"
    - "Выполнить `COMMIT`: `UPDATE` всегда считает точнее, чем `SELECT`"
    - "Выполнить `COMMIT`, а лишние две строки поправить следующим `UPDATE`"
    - "Ничего: разница в числах — обычное поведение PostgreSQL"
  correct: 0
  explanation: |
    Смысл привычки «сначала `SELECT`» — сравнить числа. Не совпали —
    значит, условия разные: опечатка, лишний пробел, забыт фильтр
    `deleted_at IS NULL` или проекта, или кто-то изменил данные
    между командами.

    Пока нет `COMMIT`, всё обратимо: `ROLLBACK`, разобраться, повторить.
    «Поправить потом» нельзя: ты не знаешь, какие именно две строки
    лишние и какими они были.

- id: bd5-20
  type: card
  question: Расшифруй ACID простыми словами.
  answer: |
    Четыре свойства транзакции:

    - **A — Atomicity, атомарность.** Всё или ничего. Списали — значит,
      и зачислили. Сбой посередине — откат, как будто ничего не было.
    - **C — Consistency, согласованность.** После транзакции соблюдены все
      ограничения: нет задачи в несуществующем проекте, нет отрицательного
      остатка, если это запрещено.
    - **I — Isolation, изолированность.** Параллельные транзакции не видят
      незавершённых изменений друг друга. Пока перевод не закоммичен,
      другие видят старый баланс.
    - **D — Durability, долговечность.** После `COMMIT` данные не пропадут,
      даже если сервер сразу выключили.

    Как тестировщик использует: проверяет атомарность фич — устраивает сбой
    посередине и ищет в базе «половинки»; проверяет одновременные запросы —
    нет ли потерянных обновлений и дублей; сам экспериментирует внутри
    `BEGIN … ROLLBACK`.
