# Вопросы темы «Агрегаты, GROUP BY, HAVING». Формат — см. osnovy/bag-report.yaml.

- id: bd4-01
  type: card
  question: Какие агрегатные функции ты знаешь и что считает каждая?
  answer: |
    - `COUNT(*)` — число строк.
    - `COUNT(столбец)` — число непустых значений столбца, `NULL` пропускает.
    - `COUNT(DISTINCT столбец)` — число разных непустых значений.
    - `SUM(столбец)` — сумма.
    - `AVG(столбец)` — среднее: сумма, делённая на число **непустых** значений.
    - `MIN(столбец)`, `MAX(столбец)` — наименьшее и наибольшее. Работают
      и с числами, и с датами, и со строками.

    Без `GROUP BY` агрегат сворачивает все строки, прошедшие `WHERE`,
    в одну строку-итог. С `GROUP BY` — каждую группу в одну строку.

    Все функции, кроме `COUNT(*)`, пропускают `NULL`. На этом построены
    главные ловушки: `AVG` по неполным данным, `SUM` пустого набора,
    `COUNT(*)` после `LEFT JOIN`.

- id: bd4-02
  type: quiz
  question: |
    В таблице `orders` 20 строк. У 8 заказов заполнен `rating`, у остальных
    он `NULL`. Что вернёт `SELECT COUNT(*), COUNT(rating) FROM orders`?
  options:
    - "`8` и `8`: строки с `NULL` не считает ни одна из функций"
    - "`20` и `8`: `COUNT(*)` считает строки, `COUNT(rating)` — значения"
    - "`20` и `20`: обе функции считают все строки таблицы подряд"
    - "`20` и `12`: `COUNT(rating)` считает строки, где `rating` пустой"
  correct: 1
  explanation: |
    `COUNT(*)` отвечает на вопрос «сколько строк» — ему всё равно, что
    в столбцах. `COUNT(rating)` — «сколько строк, где `rating` заполнен»:
    `NULL` он пропускает.

    Разница `COUNT(*) - COUNT(rating)` — число строк, где оценки нет.
    Это удобный способ посчитать пустые значения одним запросом.

- id: bd4-03
  type: quiz
  question: |
    Запрос `SELECT status, customer_id, COUNT(*) FROM orders GROUP BY status`
    упал с ошибкой `column "orders.customer_id" must appear in the GROUP BY
    clause or be used in an aggregate function`. Почему?
  options:
    - "`COUNT(*)` нельзя писать вместе с обычными столбцами в одном `SELECT`"
    - "Столбец `customer_id` может быть `NULL`, а в `GROUP BY` это запрещено"
    - "`GROUP BY` должен стоять перед `FROM`, а не после него в запросе"
    - "В группе статуса разные `customer_id`, база не знает, какой показать"
  correct: 3
  explanation: |
    В одной группе — например, `DELIVERED` — заказы разных клиентов.
    Результат — одна строка на группу. Какой `customer_id` в неё поставить,
    база не угадывает и требует решить явно.

    Решений два: добавить столбец в `GROUP BY` — тогда группа будет
    «статус × клиент», — или завернуть его в агрегат, например
    `COUNT(DISTINCT customer_id)`. Правило: каждый столбец `SELECT` — либо
    в `GROUP BY`, либо внутри агрегатной функции.

    `NULL` в `GROUP BY` разрешён — он образует отдельную группу.

- id: bd4-04
  type: card
  question: Чем WHERE отличается от HAVING?
  answer: |
    `WHERE` фильтрует **строки** до группировки. `HAVING` фильтрует
    **группы** после `GROUP BY` — по результатам агрегатов.

    Порядок выполнения:
    `FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT`.

    Отсюда:

    - агрегат в `WHERE` — ошибка: групп и подсчётов ещё нет;
    - условие с агрегатом — в `HAVING`: `HAVING COUNT(*) > 5`;
    - условие без агрегата — в `WHERE`, даже если оно «работает»
      в `HAVING`: так запрос понятнее и одинаково работает в любой базе;
    - в PostgreSQL псевдоним из `SELECT` в `HAVING` недоступен — `SELECT`
      выполняется позже. Пишут агрегат целиком.

    Пример: «клиенты с тремя доставленными заказами и больше» —
    `WHERE status = 'DELIVERED'` и `HAVING COUNT(*) >= 3`.

- id: bd4-05
  type: quiz
  question: В каком порядке PostgreSQL выполняет части запроса с группировкой?
  options:
    - "`FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT`"
    - "`SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT`"
    - "`FROM → GROUP BY → WHERE → HAVING → SELECT → ORDER BY → LIMIT`"
    - "`FROM → WHERE → SELECT → GROUP BY → HAVING → ORDER BY → LIMIT`"
  correct: 0
  explanation: |
    Сначала берутся таблицы (`FROM`, вместе с `JOIN`), потом `WHERE`
    отбирает строки, `GROUP BY` раскладывает их по группам, `HAVING`
    отбирает группы. Только после этого `SELECT` вычисляет столбцы
    и псевдонимы, `ORDER BY` сортирует, `LIMIT` отрезает.

    Из этого порядка следует почти всё: почему агрегат нельзя в `WHERE`,
    почему псевдоним нельзя в `HAVING`, но можно в `ORDER BY`.

- id: bd4-06
  type: quiz
  question: |
    Из 5 заказов оценку поставили трое: 5, 4 и 3. У двух `rating` — `NULL`.
    Что вернёт `AVG(rating)`?
  options:
    - "`2.4` — сумма 12, делённая на число всех строк, то есть на 5"
    - "`NULL` — среднее не определено, раз среди значений есть `NULL`"
    - "`4` — сумма 12, делённая на число непустых значений, то есть на 3"
    - "Ошибку — перед `AVG` пустые значения нужно убрать через `WHERE`"
  correct: 2
  explanation: |
    `AVG` пропускает `NULL`: считает сумму непустых значений и делит
    на их число. 12 / 3 = 4.

    Если по требованиям неоценённый заказ должен считаться нулём, нужно
    `AVG(COALESCE(rating, 0))` — тогда 12 / 5 = 2,4. Какой вариант
    правильный, решают требования, а не база. Тестировщику важно знать,
    как считает система, и проверять тем же способом.

- id: bd4-07
  type: quiz
  question: |
    У клиента нет ни одного заказа. Что вернёт
    `SELECT COUNT(*), SUM(discount) FROM orders WHERE customer_id = 7`?
  options:
    - "`0` и `0`: обе функции возвращают ноль, если считать нечего"
    - "`NULL` и `NULL`: для пустого набора все агрегаты дают `NULL`"
    - "Пустой результат без строк, потому что `WHERE` ничего не нашёл"
    - "`0` и `NULL`: `COUNT` пустоты — ноль, а `SUM` пустоты — `NULL`"
  correct: 3
  explanation: |
    Агрегат без `GROUP BY` всегда возвращает одну строку — даже если
    строк нет. `COUNT` пустого набора — 0. `SUM`, `AVG`, `MIN`, `MAX` —
    `NULL`: складывать нечего, результат неизвестен.

    В отчёте это пустая ячейка вместо «0 ₽», а в дальнейших вычислениях
    `NULL + 100` — снова `NULL`. Где нужен ноль — `COALESCE(SUM(discount), 0)`.

- id: bd4-08
  type: card
  question: Хитрый вопрос — почему у проекта без задач запрос показывает 1 задачу?
  answer: |
    Типичный запрос:

    ```sql
    SELECT p.name, COUNT(*) AS tasks
    FROM projects p
    LEFT JOIN tasks t ON t.project_id = p.id
    GROUP BY p.id, p.name;
    ```

    `LEFT JOIN` сохраняет каждый проект. Для проекта без задач он
    оставляет **одну** строку с `NULL` в столбцах `tasks`. `COUNT(*)`
    считает строки — и насчитывает одну.

    Исправление — `COUNT(t.id)`: столбец правой таблицы, который у
    настоящей строки не бывает пустым. Он пропускает `NULL` и даёт 0.

    И если нужен фильтр мягкого удаления задач — он в `ON`, а не в `WHERE`.
    Иначе проект, у которого все задачи удалены, пропадёт из отчёта.

- id: bd4-09
  type: quiz
  question: |
    Скидка хранится в `orders.discount` — одна на заказ. Запрос
    `SELECT SUM(o.discount) FROM orders o JOIN order_items oi ON oi.order_id = o.id`
    вернул больше, чем `SELECT SUM(discount) FROM orders`. Почему?
  options:
    - "`SUM` по столбцу с `NULL` всегда возвращает завышенный результат"
    - "Скидка заказа повторилась в каждой его строке и сложилась"
    - "`JOIN` добавил в результат заказы гостей, у которых нет клиента"
    - "Внутри `SUM` нельзя использовать столбцы из таблицы в `JOIN`"
  correct: 1
  explanation: |
    Связь «заказ → строки заказа» — один ко многим. После `JOIN` заказ
    из двух строк превращается в две строки результата, и его `discount`
    есть в каждой. `SUM` складывает скидку дважды.

    Раздувается всё, что принадлежит стороне «один». Сумма по
    `quantity * price` в том же запросе была бы верной — это данные строк.
    Правильно — считать скидки по `orders` без `JOIN` к строкам.

- id: bd4-10
  type: quiz
  question: |
    После `JOIN` заказов со строками заказа скидки посчитались дважды.
    Коллега предлагает заменить `SUM(o.discount)` на `SUM(DISTINCT o.discount)`.
    Что получится?
  options:
    - "Сумма станет верной: каждая скидка будет учтена ровно один раз"
    - "Запрос упадёт: `DISTINCT` внутри `SUM` в PostgreSQL недопустим"
    - "Сумма станет верной, но только если у всех заказов есть скидка"
    - "Одинаковые скидки разных заказов схлопнутся, сумма будет занижена"
  correct: 3
  explanation: |
    `SUM(DISTINCT …)` складывает **разные значения**, а не скидки разных
    заказов. Два заказа со скидкой по 500 дадут одну пятисотку. Было
    слишком много — станет слишком мало, и совпадение с правдой будет
    случайным.

    `COUNT(DISTINCT o.id)` спасает **счёт** заказов: у каждого заказа
    свой `id`. Сумму так не спасти. Решение — не смешивать в одном
    запросе данные «одного» и «многих».

- id: bd4-11
  type: quiz
  question: |
    Запрос `SELECT customer_id, COUNT(*) AS cnt FROM orders GROUP BY customer_id
    HAVING cnt >= 3` в PostgreSQL падает с ошибкой `column "cnt" does not exist`.
    Почему?
  options:
    - "`HAVING` выполняется раньше `SELECT`, где появляется псевдоним"
    - "Псевдонимы в PostgreSQL нужно всегда писать в двойных кавычках"
    - "Перед `HAVING` нужно повторить `WHERE` с тем же условием на `cnt`"
    - "Псевдоним нельзя давать результату агрегатной функции `COUNT`"
  correct: 0
  explanation: |
    Порядок выполнения: `… → GROUP BY → HAVING → SELECT → ORDER BY`.
    Псевдоним `cnt` создаётся в `SELECT` — на шаге `HAVING` его ещё нет.
    Исправление — повторить агрегат: `HAVING COUNT(*) >= 3`.

    В `ORDER BY` тот же псевдоним работает: сортировка идёт после
    `SELECT`. Некоторые другие базы псевдоним в `HAVING` разрешают —
    не удивляйся, если увидишь такое в чужом запросе.

- id: bd4-12
  type: quiz
  question: |
    `SELECT customer_id, COUNT(*) FROM orders GROUP BY customer_id
    HAVING COUNT(*) >= 3`. У трёх гостевых заказов `customer_id` — `NULL`.
    Что с ними будет?
  options:
    - "Каждый гостевой заказ станет отдельной группой из одной строки"
    - "Гостевые заказы не попадут ни в одну группу — `NULL` не группируется"
    - "Они соберутся в одну группу `NULL` с числом 3 и пройдут `HAVING`"
    - "Запрос упадёт: столбец `GROUP BY` не должен содержать `NULL`"
  correct: 2
  explanation: |
    В сравнениях два `NULL` не равны, но `GROUP BY` собирает все `NULL`
    в **одну** группу. Здесь в ней 3 заказа — условие `>= 3` выполняется,
    и в списке «постоянных клиентов» появляется строка без клиента.

    Если гости не нужны — `WHERE customer_id IS NOT NULL` до группировки.
    Для тестировщика это и ловушка в отчётах, и полезная проверка:
    группа `NULL` показывает, сколько записей без связи.

- id: bd4-13
  type: card
  question: Как найти дубли в таблице?
  answer: |
    Сгруппировать по полям, которые должны быть уникальны, и оставить
    группы, где больше одной строки:

    ```sql
    SELECT project_id, title, COUNT(*) AS copies
    FROM tasks
    WHERE deleted_at IS NULL
    GROUP BY project_id, title
    HAVING COUNT(*) > 1;
    ```

    Если поле может быть `NULL`, пустые значения обычно исключают
    в `WHERE`: иначе все `NULL` соберутся в одну группу и покажутся дублем.

    Важно понимать, кто гарантирует уникальность. Если это **база** —
    первичный ключ или уникальный индекс, — дублей не будет. Как в
    `project_members` TaskFlow: `(project_id, user_id)` — первичный ключ.
    Если только **код** — дубли возможны при параллельных запросах,
    импорте, ручных правках, и такой запрос стоит запускать регулярно.

- id: bd4-14
  type: quiz
  question: |
    Доля завершённых задач считается как
    `COUNT(CASE WHEN status = 'DONE' THEN 1 END) * 100 / COUNT(*)`.
    В проекте 3 задачи, одна завершена. Что вернёт PostgreSQL?
  options:
    - "`33.33` — PostgreSQL сам округляет результат до двух знаков"
    - "`33.333…` — деление в PostgreSQL всегда даёт дробное число"
    - "`0` — без `ROUND` результат деления всегда округляется вниз до нуля"
    - "`33` — оба числа целые, и дробная часть результата отбрасывается"
  correct: 3
  explanation: |
    `COUNT` возвращает целое, `100` — целое, значит, деление
    целочисленное: 100 / 3 = 33, дробная часть отбрасывается, а не
    округляется.

    Исправление — сделать одно из чисел дробным: `* 100.0`. И округлить
    до нужного знака: `ROUND(… * 100.0 / COUNT(*), 1)` даст `33.3`.
    При сверке процентов и средних с API или отчётом сначала выясни,
    как и где система округляет.

- id: bd4-15
  type: quiz
  question: |
    Запрос «топ-3 клиента по выручке» — `ORDER BY revenue DESC LIMIT 3`.
    У третьего и четвёртого клиента выручка одинаковая. Что вернёт запрос?
  options:
    - "Четыре строки: при равенстве на границе `LIMIT` берёт обе строки"
    - "Ошибку: при равных значениях в `ORDER BY` нужен второй столбец"
    - "Три строки, третьим — один из двух; какой, база не обещает"
    - "Три строки, третьим — тот, кто раньше был добавлен в таблицу"
  correct: 2
  explanation: |
    `LIMIT` отрезает ровно столько строк, сколько сказано. При ничьей
    порядок равных строк не определён — сегодня один клиент, завтра
    другой. Порядок вставки ничего не гарантирует.

    Чтобы результат был стабильным, добавляют второй ключ сортировки:
    `ORDER BY revenue DESC, name`. А показывать ли обоих при ничьей —
    вопрос к требованиям. Для тестировщика ничья на границе — отдельный
    тест-кейс для любого «топа».

- id: bd4-16
  type: card
  question: Как через базу проверить счётчик или total, который показывает API?
  answer: |
    1. Выяснить, **что** считает система: какие записи входят —
       действующие или все, какие фильтры применяются, что видит именно
       этот пользователь.
    2. Написать `COUNT(*)` с теми же условиями. Параметры запроса
       в API — это условия в `WHERE`. Для TaskFlow: `total` в
       `GET /tasks?projectId=1&status=TODO` администратора — `COUNT(*)`
       действующих задач проекта 1 в статусе `TODO`.
    3. Сравнить. Не совпало — подобрать условие, при котором совпадёт:
       это и будет описанием бага, например «счётчик учитывает удалённые».
    4. Проверить в динамике: создал запись — +1, удалил — −1.
    5. Если одно число показывают в нескольких местах — экран, `total`,
       счётчик в карточке, — сверить их между собой.

    Отдельно: `total` — число **всех** подходящих записей, а не длина
    страницы. При `limit=1` он не должен меняться.

- id: bd4-17
  type: quiz
  question: |
    Нужно «сколько задач в каждом статусе по проекту — одной строкой
    на проект». Какой вариант это делает?
  options:
    - "`GROUP BY project_id, status` и `COUNT(*)` в списке `SELECT`"
    - "`COUNT(CASE WHEN status = 'TODO' THEN 1 END)` и так на каждый статус"
    - "`COUNT(DISTINCT status)` при группировке по `project_id`"
    - "`HAVING status IN ('TODO', 'IN_PROGRESS', 'DONE')` с `COUNT(*)`"
  correct: 1
  explanation: |
    `CASE` без `ELSE` даёт `1` для задач нужного статуса и `NULL` для
    остальных. `COUNT` пропускает `NULL` — и считает только нужные.
    По столбцу на статус — и всё в одной строке проекта.

    `GROUP BY project_id, status` тоже считает задачи по статусам, но
    даёт по строке на сочетание, а не одну строку на проект.
    `COUNT(DISTINCT status)` ответит, сколько разных статусов, а не
    сколько задач в каждом. В PostgreSQL есть и короткая запись:
    `COUNT(*) FILTER (WHERE status = 'TODO')`.

- id: bd4-18
  type: card
  question: Хитрый вопрос — почему сумма в отчёте больше реальной?
  answer: |
    Чаще всего — `JOIN` со связью «один ко многим» перед `SUM`.

    Например, `SUM(o.total)` после `JOIN` заказов со строками заказа:
    заказ из трёх позиций становится тремя строками, его `total` —
    в каждой, и складывается трижды. Раздувается всё, что принадлежит
    стороне «один».

    Как найти: взять один заказ с несколькими позициями и выполнить
    запрос отчёта только для него; сравнить число строк до и после
    `JOIN`.

    Как исправить: не смешивать уровни — суммы заказов считать по
    `orders` без строк, позиции — отдельным запросом. `SUM(DISTINCT …)`
    не исправление: одинаковые суммы разных заказов схлопнутся.
    `COUNT(DISTINCT o.id)` спасает только счёт.

    Другие причины расхождения — `NULL` и разные условия: учитываются ли
    отменённые и удалённые записи, как считается среднее и где округление.

- id: bd4-19
  type: quiz
  question: |
    Задача: «книги, изданные начиная с 2010 года». Запрос:
    `SELECT title FROM books WHERE year > 2010`. Что не так?
  options:
    - "Ничего: «начиная с 2010» означает «позже 2010 года»"
    - "Нужно `year >= 2010` — книги 2010 года тоже должны попасть"
    - "Нужно `year >= 2011`: «начиная с 2010» значит «после 2010»"
    - "Нужно `year IS NOT NULL`, иначе в выборку попадут книги без года"
  correct: 1
  explanation: |
    «Начиная с 2010» — 2010 год включается: `>= 2010`. С `> 2010` книги
    2010 года молча пропадут.

    Книги без года и так не попадут: `NULL > 2010` — не TRUE. Отдельное
    условие `IS NOT NULL` здесь ничего не меняет, но сам факт, что такие
    книги в ответ не входят, стоит проговорить.

- id: bd4-20
  type: quiz
  question: |
    «Сколько книг у авторов из России?» — запрос считает `COUNT(*)` по
    `book_authors JOIN authors` с фильтром по стране и возвращает 14.
    Книг на самом деле 13. Где подвох?
  options:
    - "`COUNT(*)` посчитал и книги без года, а их нужно было исключить"
    - "Фильтр по стране нужно ставить в `HAVING`, а не в `WHERE`"
    - "Книга двух российских соавторов посчиталась два раза"
    - "`JOIN` с `authors` потерял книги, у которых нет автора"
  correct: 2
  explanation: |
    Строка `book_authors` — это пара «книга — автор». Книга двух авторов
    из России — две строки. `COUNT(*)` считает строки, а вопрос — про книги.

    Исправление — `COUNT(DISTINCT ba.book_id)`: каждая книга один раз.

- id: bd4-21
  type: quiz
  question: |
    Сегодня 20 октября. Задача: «сколько заказов было в прошлом месяце».
    Какое условие правильное?
  options:
    - "`created_at >= '2026-09-01' AND created_at < '2026-10-01'`"
    - "`created_at BETWEEN '2026-09-01' AND '2026-10-01'`"
    - "`created_at >= '2026-09-01' AND created_at <= '2026-09-30'`"
    - "`created_at >= now() - interval '1 month'`"
  correct: 0
  explanation: |
    «Прошлый месяц» — весь сентябрь. Надёжная граница — полуинтервал:
    от начала месяца включительно до начала следующего — не включая.

    `<= '2026-09-30'` — это 30 сентября 00:00: заказы за весь последний
    день пропадут. `BETWEEN … '2026-10-01'` захватит заказ ровно
    в полночь 1 октября. `now() - interval '1 month'` — это последние
    30 с небольшим дней, а не прошлый месяц.

- id: bd4-22
  type: quiz
  question: |
    Задача: «какой жанр самый популярный по числу выдач». Запрос
    сгруппировал выдачи по жанру, отсортировал по убыванию и взял `LIMIT 1`.
    Что стоит проверить, прежде чем отвечать?
  options:
    - "Что в `GROUP BY` стоит жанр, а не `id` книги"
    - "Нет ли второго жанра с тем же числом выдач"
    - "Что `COUNT(*)` заменён на `COUNT(DISTINCT genre)`"
    - "Что `ORDER BY` стоит после `LIMIT`, а не перед ним"
  correct: 1
  explanation: |
    `LIMIT 1` вернёт одну строку, даже если первое место делят два жанра,
    — и какую из них, база не обещает. Правильно — сначала посмотреть
    на все группы без `LIMIT` и, если есть ничья, так и ответить.

    `COUNT(DISTINCT genre)` внутри группы по жанру всегда даст 1.
    `ORDER BY` в запросе всегда пишется до `LIMIT`.
