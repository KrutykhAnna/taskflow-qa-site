# Вопросы темы «JOIN: соединение таблиц». Формат — см. osnovy/bag-report.yaml.

- id: bd3-01
  type: card
  question: Какие бывают виды JOIN и чем они отличаются?
  answer: |
    - `INNER JOIN` (просто `JOIN`) — только строки, для которых нашлась пара
      по условию `ON`. Строки без пары пропадают с обеих сторон.
    - `LEFT JOIN` — все строки левой таблицы. Нет пары — столбцы правой
      таблицы заполняются `NULL`.
    - `RIGHT JOIN` — то же, но сохраняются все строки правой таблицы.
      На практике вместо него пишут `LEFT`, поменяв таблицы местами.
    - `FULL JOIN` — строки обеих таблиц: пары склеены, у строк без пары
      другая сторона — `NULL`. Нужен для сверки двух списков.
    - `CROSS JOIN` — каждая строка слева с каждой строкой справа, без условия:
      m × n строк.

    Для тестировщика главные — `INNER` и `LEFT`. Ошибка выбора между ними
    не падает с ошибкой, а молча теряет строки.

- id: bd3-02
  type: quiz
  question: |
    `tasks t JOIN users u ON u.id = t.assignee_id`. Что будет с задачей,
    у которой `assignee_id` — NULL?
  options:
    - "Попадёт в результат, а столбцы `users` будут заполнены `NULL`"
    - "Запрос упадёт с ошибкой: в условии `ON` встретился `NULL`"
    - "Не попадёт в результат: для неё не нашлось пары в `users`"
    - "Попадёт в результат в паре с первым пользователем таблицы"
  correct: 2
  explanation: |
    `JOIN` — это `INNER JOIN`, он оставляет только пары. Условие
    `u.id = NULL` для любого пользователя — UNKNOWN, пары нет,
    и задача молча пропадает.

    Сохранить её со столбцами `users`, заполненными `NULL`, — это поведение
    `LEFT JOIN`. Ошибки не будет: сравнение с `NULL` — обычная ситуация
    для базы.

- id: bd3-03
  type: quiz
  question: |
    Запрос `SELECT id, title FROM tasks t JOIN users u ON u.id = t.assignee_id`
    упал с ошибкой `column reference "id" is ambiguous`. Как исправить?
  options:
    - "Указать таблицу у столбца: `SELECT t.id, t.title`"
    - "Заменить `JOIN` на `LEFT JOIN`, тогда `id` возьмётся слева"
    - "Добавить `DISTINCT`, чтобы убрать повторяющийся столбец `id`"
    - "Убрать псевдонимы таблиц `t` и `u` из части `FROM`"
  correct: 0
  explanation: |
    Столбец `id` есть и в `tasks`, и в `users` — база не знает, какой
    из них нужен. Решение — указать таблицу: `t.id`. Если нужны оба,
    дать им разные имена: `t.id AS task_id, u.id AS user_id`.

    Вид `JOIN` и `DISTINCT` на неоднозначность не влияют. Без псевдонимов
    пришлось бы писать `tasks.id` — то же исправление, только длиннее.

    Привычка: в запросе с `JOIN` указывать таблицу у каждого столбца.

- id: bd3-04
  type: card
  question: Как найти записи, у которых нет связанных записей в другой таблице?
  answer: |
    `LEFT JOIN`, а потом оставить строки, где правая сторона пустая:

    ```sql
    SELECT c.id, c.name
    FROM customers c
    LEFT JOIN orders o ON o.customer_id = c.id
    WHERE o.id IS NULL;
    ```

    `LEFT JOIN` сохраняет всех клиентов, у клиентов без заказов столбцы
    `orders` — `NULL`. `WHERE o.id IS NULL` оставляет именно их.

    Проверять на `IS NULL` нужно столбец, который у настоящей строки
    не бывает пустым, — первичный ключ или `NOT NULL`. Если у правой
    таблицы нет `id`, как у `project_members`, — любой столбец
    составного ключа.

    Если пару должна давать не любая строка, а только подходящая —
    например, неудалённая, — это условие пишут в `ON`, а не в `WHERE`.

- id: bd3-05
  type: quiz
  question: |
    `customers c LEFT JOIN orders o ON o.customer_id = c.id`.
    Что будет в столбце `o.status` у клиента без заказов?
  options:
    - "Пустая строка `''`, потому что статуса у такого клиента нет"
    - "Значение по умолчанию для столбца `status` из таблицы `orders`"
    - "Такого клиента в результате не будет, его отбросит `LEFT JOIN`"
    - "`NULL`, как и во всех остальных столбцах таблицы `orders`"
  correct: 3
  explanation: |
    `LEFT JOIN` сохраняет строку левой таблицы, даже если пары нет,
    и заполняет **все** столбцы правой таблицы `NULL`. Значения по умолчанию
    и пустые строки тут ни при чём — они бывают только у настоящих строк.

    Отсюда приём поиска «без пары»: `WHERE o.id IS NULL`. И ловушка:
    любое условие вида `o.status = …` в `WHERE` для такой строки даст
    UNKNOWN и выбросит её.

- id: bd3-06
  type: quiz
  question: Какой запрос возвращает то же, что `orders o RIGHT JOIN customers c ON c.id = o.customer_id`?
  options:
    - "`orders o LEFT JOIN customers c ON c.id = o.customer_id`"
    - "`customers c LEFT JOIN orders o ON c.id = o.customer_id`"
    - "`customers c JOIN orders o ON c.id = o.customer_id`"
    - "`orders o FULL JOIN customers c ON c.id = o.customer_id`"
  correct: 1
  explanation: |
    `RIGHT JOIN` сохраняет все строки **правой** таблицы — здесь клиентов.
    Это то же, что `LEFT JOIN`, если поменять таблицы местами: клиенты
    в `FROM`, заказы присоединяются.

    `orders LEFT JOIN customers` сохраняет все заказы — другой вопрос.
    `INNER` потеряет клиентов без заказов. `FULL` добавит ещё и заказы
    без клиента.

    Поэтому на практике `RIGHT JOIN` почти не пишут: главную таблицу ставят
    в `FROM` и используют `LEFT`.

- id: bd3-07
  type: quiz
  question: |
    В TaskFlow связь «пользователи ↔ проекты» хранится в `project_members`.
    Как получить список «название проекта — имя участника — роль»?
  options:
    - "`projects JOIN users ON users.id = projects.owner_id` и столбец `role` из `users`"
    - "`project_members CROSS JOIN projects CROSS JOIN users` и фильтр по роли"
    - "От `project_members` — `JOIN projects` по `project_id` и `JOIN users` по `user_id`"
    - "`users JOIN projects ON projects.id = users.id` и столбец `role` из `projects`"
  correct: 2
  explanation: |
    Связь «многие ко многим» идёт через промежуточную таблицу: от неё
    два `JOIN` — к обеим сторонам. Роль хранится в самой связи,
    в `project_members.role`.

    `owner_id` даст только владельца, а у `users.role` — глобальная роль
    `USER`/`ADMIN`, а не роль в проекте. `CROSS JOIN` склеит всё со всем.
    `projects.id = users.id` сравнивает номера, которые никак не связаны.

- id: bd3-08
  type: card
  question: Почему после JOIN строк может стать больше, чем было? Помогает ли DISTINCT?
  answer: |
    Связь «один ко многим» размножает строки: проект с тремя задачами
    после `projects JOIN tasks` — три строки. Две такие связи в одном
    запросе — произведение: 3 задачи × 3 участника = 9 строк.

    Это опасно, когда результат дальше считают как список «одного»:
    «проектов 7», хотя их 4; выручка заказа учтена столько раз,
    сколько у него доставок.

    `DISTINCT` не лечит, а прячет: он склеит и разные записи с одинаковыми
    значениями, и не вернёт строки, которые лишний `INNER JOIN` потерял.
    Правильно — понять, зачем нужен этот `JOIN`, и убрать лишний.

    Простая проверка: число строк до `JOIN` и после. Для связи
    «многие к одному» — задача → проект — оно должно совпасть.

- id: bd3-09
  type: quiz
  question: |
    Нужны все клиенты и их доставленные заказы, клиенты без таких заказов —
    тоже. Написали `customers c LEFT JOIN orders o ON o.customer_id = c.id
    WHERE o.status = 'DELIVERED'`. Что получится?
  options:
    - "Все клиенты: у кого нет доставленных заказов — столбцы заказа `NULL`"
    - "Только клиенты, у которых есть доставленный заказ: как при `INNER JOIN`"
    - "Ошибка: условие на правую таблицу нельзя писать в `WHERE`"
    - "Все клиенты со всеми заказами: при `LEFT JOIN` условие `WHERE` не действует"
  correct: 1
  explanation: |
    `JOIN` выполняется раньше `WHERE`. `LEFT JOIN` сохранил всех клиентов,
    у клиента без заказов `o.status` — `NULL`. Потом `WHERE` проверил
    `NULL = 'DELIVERED'` — UNKNOWN — и выбросил строку. Клиента с одним
    отменённым заказом — тоже. `LEFT` фактически стал `INNER`.

    Правильно — условие в `ON`:
    `LEFT JOIN orders o ON o.customer_id = c.id AND o.status = 'DELIVERED'`.
    Тогда оно решает, какой заказ считать парой, а не какого клиента оставить.

    Ловушка — «ошибка». Запрос выполняется, просто возвращает меньше.

- id: bd3-10
  type: quiz
  question: |
    В таблице `tasks` 50 строк, `WHERE` нет. Что можно сказать о числе
    строк `tasks LEFT JOIN users` и `tasks INNER JOIN users` по исполнителю?
  options:
    - "Оба запроса всегда вернут ровно 50 строк, ведь левая таблица одна и та же"
    - "`LEFT` вернёт не больше 50 строк, а `INNER` — не меньше 50 строк"
    - "`INNER` всегда вернёт больше строк, чем `LEFT`, при любых данных в таблицах"
    - "`LEFT` вернёт не меньше 50, `INNER` — не больше, чем вернул `LEFT`"
  correct: 3
  explanation: |
    `LEFT JOIN` без `WHERE` сохраняет каждую строку левой таблицы — значит,
    строк **не меньше** 50. Больше — может, если у одной задачи нашлось
    несколько пар.

    `INNER JOIN` даёт те же пары, но без строк, у которых пары нет. Поэтому
    `INNER` ≤ `LEFT`. Разница — ровно строки без пары: задачи без исполнителя.

    Связь задача → исполнитель — «многие к одному», так что здесь
    `LEFT` вернёт ровно 50. Если бы вернул больше — повод разбираться в схеме.

- id: bd3-11
  type: card
  question: Что такое self-join? Приведи пример.
  answer: |
    Self-join — соединение таблицы с самой собой. Нужен, когда строки
    ссылаются на строки той же таблицы: сотрудник → руководитель,
    комментарий → комментарий-родитель, категория → родительская категория.

    ```sql
    SELECT e.name AS employee, m.name AS manager
    FROM employees e
    LEFT JOIN employees m ON m.id = e.manager_id;
    ```

    Одна таблица — два псевдонима и две роли: `e` — сотрудник,
    `m` — руководитель. Без псевдонимов такой запрос не написать.

    `LEFT`, потому что у генерального директора руководителя нет —
    `INNER JOIN` его потеряет. Тестировщику на таких структурах стоит
    проверить запись без родителя, удалённого родителя и цикл.

- id: bd3-12
  type: quiz
  question: |
    3 проекта. У первого 4 задачи, у второго 2, у третьего задач нет.
    Сколько строк вернёт `projects p JOIN tasks t ON t.project_id = p.id`?
  options:
    - "6 — по строке на каждую пару «проект — задача»"
    - "3 — по одной строке на каждый проект в таблице"
    - "7 — шесть пар и строка проекта без задач с `NULL`"
    - "2 — только проекты, у которых нашлись задачи"
  correct: 0
  explanation: |
    `JOIN` даёт строку на каждую **пару**: 4 + 2 = 6. Первый проект
    повторится 4 раза, второй — 2.

    Третий проект пропадёт: пары нет, а это `INNER JOIN`. С `LEFT JOIN`
    было бы 7 — он добавил бы строку проекта без задач с `NULL`.

    «3» и «2» — ответы на вопрос «сколько проектов», а `JOIN` возвращает
    пары. На этом и строятся ошибки подсчёта после соединения.

- id: bd3-13
  type: quiz
  question: |
    После переноса данных нужно сверить список клиентов в старой и новой
    системе: найти тех, кто есть только в одной из них. Какое соединение подходит?
  options:
    - "`LEFT JOIN` старой таблицы с новой и фильтр `WHERE new.id IS NULL`"
    - "`FULL JOIN` и фильтр `WHERE old.id IS NULL OR new.id IS NULL`"
    - "`INNER JOIN` по номеру клиента: несовпадения он сам отбросит"
    - "`CROSS JOIN` двух таблиц и сравнение номеров клиентов в `WHERE`"
  correct: 1
  explanation: |
    `FULL JOIN` сохраняет строки обеих таблиц. У клиента, который есть
    только в старой системе, пустая новая сторона, и наоборот. Фильтр
    `old.id IS NULL OR new.id IS NULL` оставляет расхождения с обеих сторон.

    `LEFT JOIN` найдёт только тех, кого потеряли при переносе, — но не тех,
    кто появился лишним. `INNER` покажет совпадения, а нужны как раз
    несовпадения. `CROSS JOIN` на больших таблицах даст миллиарды строк.

- id: bd3-14
  type: card
  question: Как через базу проверить, что API вернул правильные связанные данные — например, имя исполнителя задачи?
  answer: |
    Поля вроде `assigneeFirstName` или `projectName` API собирает из других
    таблиц. Проверка — тот же `JOIN` запросом:

    ```sql
    SELECT t.id, p.name, u.first_name, u.last_name
    FROM tasks t
    JOIN projects p   ON p.id = t.project_id
    LEFT JOIN users u ON u.id = t.assignee_id
    WHERE t.project_id = 1 AND t.deleted_at IS NULL;
    ```

    Сравниваю с ответом построчно: число записей, имена, названия.
    `LEFT JOIN` к исполнителю — чтобы не потерять задачи без исполнителя:
    у них в API имя должно быть `null`.

    Отдельно — особые случаи: исполнитель удалён или деактивирован,
    сменил имя, не участник проекта. Если в API одно, а в базе другое —
    где-то копия данных или кэш.

- id: bd3-15
  type: quiz
  question: |
    `SELECT o.id, c.name FROM orders o, customers c` — условие соединения
    забыли. В `orders` 1 000 строк, в `customers` 200. Сколько строк вернёт запрос?
  options:
    - "1 000 — по строке на каждый заказ, клиент возьмётся первый"
    - "Ошибка: без условия соединения запрос не выполнится"
    - "1 200 — строки двух таблиц, выведенные друг за другом"
    - "200 000 — каждый заказ в паре с каждым клиентом"
  correct: 3
  explanation: |
    Таблицы через запятую без условия — это `CROSS JOIN`: каждая строка
    слева с каждой строкой справа, 1 000 × 200 = 200 000.

    Ошибки не будет — синтаксис старый, но правильный. Поэтому лучше писать
    `JOIN … ON`: без `ON` PostgreSQL сразу выдаст синтаксическую ошибку.

    Вывести строки двух таблиц друг за другом соединение не может:
    `JOIN` всегда склеивает строки в пары.

- id: bd3-16
  type: quiz
  question: |
    В `employees` есть `manager_id` — ссылка на руководителя из этой же таблицы.
    Какой запрос покажет всех сотрудников с именем руководителя?
  options:
    - "`employees e LEFT JOIN employees m ON m.id = e.manager_id`"
    - "`employees e JOIN employees m ON m.id = e.manager_id`"
    - "`employees e LEFT JOIN employees m ON m.manager_id = e.manager_id`"
    - "`employees LEFT JOIN employees ON id = manager_id`"
  correct: 0
  explanation: |
    Нужен self-join: одна таблица под двумя псевдонимами. Руководитель
    сотрудника `e` — это строка `m`, чей `id` равен `e.manager_id`.

    `INNER JOIN` потеряет сотрудников без руководителя — например,
    генерального директора. `m.manager_id = e.manager_id` найдёт коллег
    с общим руководителем, а не руководителя. Без псевдонимов база
    не поймёт, `id` какой из двух копий таблицы имеется в виду.

- id: bd3-17
  type: card
  question: Как учитывать мягкое удаление в запросах с JOIN?
  answer: |
    Фильтр `deleted_at IS NULL` нужен **у каждой** таблицы, которая может
    быть удалена. Мягко удалённая строка для `JOIN` — обычная существующая
    строка: без фильтра «оживут» задачи удалённого проекта или удалённые
    участники.

    Где ставить фильтр:

    - у **левой** таблицы и у таблиц `INNER JOIN` — в `WHERE`;
    - у **правой** таблицы `LEFT JOIN` — в `ON`:
      `LEFT JOIN users u ON u.id = t.assignee_id AND u.deleted_at IS NULL`.

    Если поставить `u.deleted_at IS NULL` в `WHERE`, задача удалённого
    исполнителя пропадёт целиком, хотя сама задача живая. В `ON` задача
    останется, а имя будет `NULL`.

    Нужен ли фильтр у каждой таблицы — решает вопрос запроса.
    Комментарий удалённого автора — всё ещё комментарий к задаче.

- id: bd3-18
  type: quiz
  question: |
    Нужны все живые задачи с именем исполнителя. Если исполнитель мягко удалён,
    задача должна остаться, а имя — быть пустым. Какой вариант верный?
  options:
    - "`LEFT JOIN users u ON u.id = t.assignee_id WHERE t.deleted_at IS NULL AND u.deleted_at IS NULL`"
    - "`JOIN users u ON u.id = t.assignee_id AND u.deleted_at IS NULL WHERE t.deleted_at IS NULL`"
    - "`LEFT JOIN users u ON u.id = t.assignee_id AND u.deleted_at IS NULL WHERE t.deleted_at IS NULL`"
    - "`LEFT JOIN users u ON u.id = t.assignee_id WHERE t.deleted_at IS NULL AND u.id IS NOT NULL`"
  correct: 2
  explanation: |
    Фильтр удаления **правой** таблицы при `LEFT JOIN` ставят в `ON`.
    Тогда удалённый пользователь просто не считается парой: задача остаётся,
    имя — `NULL`.

    В `WHERE` условие `u.deleted_at IS NULL` выбросит строку задачи
    с удалённым исполнителем целиком. Хитрость в том, что задачи
    **без** исполнителя при этом останутся — и кажется, что всё работает.

    `INNER JOIN` потеряет и задачи удалённых, и задачи без исполнителя.
    `u.id IS NOT NULL` в `WHERE` превращает `LEFT` в `INNER`.
