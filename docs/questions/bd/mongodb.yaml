# Вопросы темы «MongoDB и нереляционные базы». Формат — см. osnovy/bag-report.yaml.

- id: bd8-01
  type: card
  question: Чем MongoDB отличается от PostgreSQL?
  answer: |
    PostgreSQL — реляционная база: таблицы со строгими столбцами
    и типами, связи через внешние ключи, запросы на SQL с JOIN.

    MongoDB — документная база: коллекции документов, похожих на JSON.

    - связанные данные обычно вложены прямо в документ;
    - структура гибкая: поля у документов могут отличаться;
    - за структурой следит код приложения, а не база;
    - свой язык запросов: `find(...)`.

    PostgreSQL — где важны точность и связи: деньги, заказы. MongoDB —
    где у объектов разная структура: каталог, профили, контент.

- id: bd8-02
  type: quiz
  question: Что в MongoDB примерно соответствует таблице PostgreSQL?
  options:
    - "Документ"
    - "Поле"
    - "Коллекция"
    - "ObjectId"
  correct: 2
  explanation: |
    Коллекция — набор документов, как таблица — набор строк.
    Документ ≈ строка, поле ≈ столбец, `_id` ≈ первичный ключ.

- id: bd8-03
  type: card
  question: Что такое документ в MongoDB?
  answer: |
    Одна запись в коллекции — примерно как строка в таблице. Записан
    в формате, похожем на JSON.

    - у каждого документа есть уникальный `_id`, обычно ObjectId;
    - внутри могут быть вложенные объекты — `address: { city: … }`;
    - и массивы — `phones: [ … ]`.

    Главное отличие от строки: документы одной коллекции не обязаны
    быть одинаковыми — у одного поле есть, у другого нет.

- id: bd8-04
  type: quiz
  question: Какой вид NoSQL-баз — MongoDB?
  options:
    - "Документная"
    - "Ключ — значение"
    - "Графовая"
    - "Колоночная"
  correct: 0
  explanation: |
    MongoDB хранит документы, похожие на JSON. Ключ — значение — это
    Redis, графовая — например, Neo4j, колоночная — например, ClickHouse.

- id: bd8-05
  type: quiz
  question: |
    Как найти в MongoDB заказы, у которых во вложенном объекте
    `customer` город — Москва?
  options:
    - "db.orders.find({ city: \"Москва\" })"
    - "db.orders.find({ customer: \"Москва\" })"
    - "SELECT * FROM orders WHERE customer = 'Москва'"
    - "db.orders.find({ \"customer.city\": \"Москва\" })"
  correct: 3
  explanation: |
    Вложенное поле пишут через точку и в кавычках: `"customer.city"`.
    Запрос по `city` ищет поле на верхнем уровне документа — его там нет.

- id: bd8-06
  type: quiz
  question: |
    Что делает запрос
    `db.orders.find({ status: "paid" }).sort({ createdAt: -1 }).limit(5)`?
  options:
    - "Удаляет 5 оплаченных заказов"
    - "Находит 5 последних оплаченных заказов"
    - "Находит 5 первых оплаченных заказов — самых старых"
    - "Считает, сколько оплаченных заказов"
  correct: 1
  explanation: |
    `find` — найти по условию, `sort({ createdAt: -1 })` — по убыванию
    даты, сначала новые, `limit(5)` — только пять. На SQL:
    `WHERE status = 'paid' ORDER BY created_at DESC LIMIT 5`.

- id: bd8-07
  type: card
  question: |
    В документах коллекции появилось новое поле. Что проверишь?
  answer: |
    - **Старые документы без поля** — главный риск: экраны, фильтры,
      отчёты на них не падают и показывают то, что задумано.
    - **Новые документы** — поле сохраняется, правильного типа.
    - **Все способы создания** — интерфейс, API, импорт.
    - **Поиск и сортировка** по полю — с учётом документов без него.

    Вопрос аналитику и разработчику: заполнят ли поле у старых
    документов и что показывать, пока оно пустое.

- id: bd8-08
  type: quiz
  question: |
    В коллекции товаров у части документов цена `1500` (число),
    у части — `"1500"` (строка). Что вероятнее всего сломается?
  options:
    - "Ничего: на экране цена выглядит одинаково"
    - "MongoDB не даст сохранить второй документ"
    - "Документы со строковой ценой удалятся при сортировке"
    - "Сортировка и фильтр по цене"
  correct: 3
  explanation: |
    MongoDB по умолчанию сохранит оба варианта. При сортировке числа
    идут отдельно от строк — порядок «скачет». Фильтр `price < 1000`
    сравнивает только с числами — товары со строковой ценой он
    не найдёт.

- id: bd8-09
  type: quiz
  question: |
    Найди подвох. Клиент сменил имя в профиле, а в его старых заказах
    — прежнее. Имя хранится копией в каждом документе заказа.
    Коллега сразу заводит баг. Что не так?
  options:
    - "Ничего: это всегда баг"
    - "Это может быть задумано — сначала вопрос аналитику"
    - "Баг в MongoDB: база обязана сама обновлять все копии имени"
    - "Нужно заводить баг на PostgreSQL"
  correct: 1
  explanation: |
    Дублирование в MongoDB — обычная практика. Для заказа часто
    правильно хранить данные на момент покупки, как в чеке.

    Как должно быть — решает аналитик. Если «как сейчас» — тогда баг,
    и проверить все места, куда скопировано имя.

- id: bd8-10
  type: quiz
  question: |
    Найди подвох. Новое поле «скидка» проверили на 5 только что
    созданных товарах — всё работает. Что упустили?
  options:
    - "Старые товары без этого поля"
    - "Проверку на 50 новых товарах вместо 5"
    - "Ничего: новое поле проверено"
    - "Перезапуск MongoDB"
  correct: 0
  explanation: |
    Документы, созданные до изменения, поля `discount` не имеют.
    На них экран или расчёт цены могут упасть. Проверять нужно
    хотя бы один старый товар.

- id: bd8-11
  type: card
  question: Хитрый вопрос. NoSQL — значит без схемы?
  answer: |
    Нет. Схема есть всегда: приложение ждёт определённые поля
    определённых типов. Вопрос — кто её охраняет.

    - В PostgreSQL база не даст записать строку в числовой столбец.
    - В MongoDB по умолчанию даст — ошибку поймает только код
      приложения или тестировщик.

    Поэтому в MongoDB структуру проверять нужно даже внимательнее:
    отсутствующие поля, `null`, разные типы в одном поле.

- id: bd8-12
  type: quiz
  question: |
    Удалили пользователя. Его комментарии остались, в каждом —
    `authorId` удалённого пользователя. Что сделает MongoDB?
  options:
    - "Удалит комментарии сама, как каскадное удаление"
    - "Не даст удалить пользователя, пока есть комментарии"
    - "Ничего: ссылки по id база не проверяет"
    - "Заменит authorId на null"
  correct: 2
  explanation: |
    Внешних ключей в MongoDB нет. Комментарии остаются с «осиротевшей»
    ссылкой. Проверять нужно приложение: что показано вместо автора,
    не падает ли страница. И спросить аналитика, как задумано.

- id: bd8-13
  type: quiz
  question: |
    Найди подвох. Чтобы найти последний созданный документ, тестировщик
    сортирует по `_id` по убыванию. Что не так?
  options:
    - "Ничего: _id — это счётчик 1, 2, 3"
    - "Сортировать по _id в MongoDB нельзя"
    - "Надо сортировать по возрастанию"
    - "_id — не надёжный порядок создания"
  correct: 3
  explanation: |
    ObjectId хранит время только с точностью до секунды, а приложение
    может задать `_id` само. Для тестов надёжнее сортировать по полю
    даты, например `createdAt`.
