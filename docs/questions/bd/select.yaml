# Вопросы темы «SELECT: выбрать и отфильтровать». Формат — см. osnovy/bag-report.yaml.

- id: bd2-01
  type: card
  question: Из каких частей состоит запрос SELECT? В каком порядке их пишут и в каком выполняет база?
  answer: |
    Пишут так: `SELECT … FROM … WHERE … ORDER BY … LIMIT`.

    - `SELECT` — какие столбцы и выражения показать;
    - `FROM` — из какой таблицы;
    - `WHERE` — какие строки оставить;
    - `ORDER BY` — в каком порядке;
    - `LIMIT` / `OFFSET` — сколько строк и сколько пропустить.

    Выполняет база в другом порядке: `FROM → WHERE → SELECT → ORDER BY → LIMIT`.
    С группировкой — `FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT`.

    Из этого порядка следует: псевдоним из `SELECT` нельзя использовать
    в `WHERE` — его ещё нет, а в `ORDER BY` можно. И `LIMIT` срабатывает
    последним — после сортировки.

- id: bd2-02
  type: quiz
  question: Как в PostgreSQL записать условие «статус не равен CANCELLED»?
  options:
    - "Только `status != 'CANCELLED'`, оператор `<>` устарел"
    - "Только `status <> 'CANCELLED'`, оператор `!=` даст ошибку"
    - "`status <> 'CANCELLED'` или `status != 'CANCELLED'` — одно и то же"
    - "`status NOT 'CANCELLED'` — отдельного оператора нет"
  correct: 2
  explanation: |
    В PostgreSQL `<>` и `!=` равнозначны. `<>` — запись из стандарта SQL,
    `!=` поддерживают почти все СУБД.

    Важнее другое: ни один из них не находит строки, где `status` — `NULL`.
    `NULL <> 'CANCELLED'` — это UNKNOWN, и `WHERE` такую строку отбросит.
    Если строки без статуса тоже нужны — `OR status IS NULL`
    или `status IS DISTINCT FROM 'CANCELLED'`.

- id: bd2-03
  type: quiz
  question: |
    Какое условие равносильно `WHERE category IN ('Обувь', 'Одежда')`?
  options:
    - "`category = 'Обувь' OR category = 'Одежда'`"
    - "`category = 'Обувь' AND category = 'Одежда'`"
    - "`category LIKE 'Обувь%' OR category LIKE 'Одежда%'`"
    - "`category BETWEEN 'Обувь' AND 'Одежда'`"
  correct: 0
  explanation: |
    `IN` — короткая запись нескольких `OR` по одному столбцу. Удобно ещё
    и тем, что не нужно думать о скобках, когда рядом есть `AND`.

    `AND` по одному столбцу с разными значениями не найдёт ничего:
    категория не может быть сразу двумя. `LIKE 'Обувь%'` найдёт ещё
    и «Обувь детская». `BETWEEN` для строк сравнивает по алфавиту
    и захватит всё, что между ними.

- id: bd2-04
  type: quiz
  question: |
    Что вернёт `WHERE price BETWEEN 590 AND 990`?
  options:
    - "Товары дороже 590 и дешевле 990, сами границы не входят"
    - "Товары от 590 включительно до 990, сама цена 990 не входит"
    - "Товары дороже 590 и до 990 включительно, цена 590 не входит"
    - "Товары от 590 до 990, обе границы входят в результат"
  correct: 3
  explanation: |
    `BETWEEN a AND b` — это `>= a AND <= b`. Обе границы включены.
    Товары ровно за 590 и ровно за 990 попадут в результат.

    Это граничные значения из тест-дизайна: если требование «до 990,
    не включая», `BETWEEN` не подходит — нужно `price >= 590 AND price < 990`.

    И порядок границ важен: `BETWEEN 990 AND 590` не найдёт ничего.

- id: bd2-05
  type: card
  question: Что значат символы % и _ в LIKE? Как найти сам символ % в тексте?
  answer: |
    - `%` — любое число любых символов, в том числе ноль:
      `'Чай%'` — начинается с «Чай», `'%USB%'` — содержит «USB».
    - `_` — ровно один любой символ: `'Худи _'` найдёт «Худи S», но не «Худи XL».

    Чтобы символ значил сам себя, его **экранируют** обратным слэшем:
    `LIKE '%50\%%'` — содержит «50%». Можно задать свой символ:
    `LIKE '%50!%%' ESCAPE '!'`.

    Без экранирования поиск «50%» превращается в «содержит 50», а поиск
    «USB_C» находит и «USB-C». Если сервер подставляет ввод пользователя
    в `LIKE` без экранирования — это баг поиска, его стоит проверять
    спецсимволами.

- id: bd2-06
  type: quiz
  question: Как найти заказы, у которых не указан телефон — в столбце `phone` записан NULL?
  options:
    - "`WHERE phone = NULL`"
    - "`WHERE phone IS NULL`"
    - "`WHERE phone = ''`"
    - "`WHERE phone = 'NULL'`"
  correct: 1
  explanation: |
    `IS NULL` — единственная проверка, которая на `NULL` отвечает TRUE.
    `phone = NULL` для любой строки — UNKNOWN, запрос молча вернёт пусто.

    `= ''` ищет пустую строку — это другое значение: «телефон есть, он
    пустой». `'NULL'` в кавычках — строка из четырёх букв.

    На практике «не указан» часто включает оба варианта:
    `WHERE phone IS NULL OR phone = ''`.

- id: bd2-07
  type: quiz
  question: Какой запрос вернёт 5 самых новых заказов?
  options:
    - "`SELECT * FROM orders LIMIT 5`"
    - "`SELECT * FROM orders ORDER BY created_at, id LIMIT 5`"
    - "`SELECT * FROM orders ORDER BY created_at DESC, id DESC LIMIT 5`"
    - "`SELECT * FROM orders LIMIT 5 ORDER BY created_at DESC, id DESC`"
  correct: 2
  explanation: |
    Новые сверху — `DESC`, по убыванию. `LIMIT` срабатывает после сортировки,
    поэтому получаются пять самых новых. `id DESC` вторым столбцом делает
    порядок однозначным, если у заказов одинаковое время.

    Без `ORDER BY` — какие-то пять строк. `ORDER BY created_at, id` без `DESC` —
    пять самых старых. `LIMIT` перед `ORDER BY` — синтаксическая ошибка:
    порядок частей запроса фиксированный.

- id: bd2-08
  type: card
  question: Что делает DISTINCT? Когда он полезен, а когда прячет проблему?
  answer: |
    `DISTINCT` убирает одинаковые строки из результата. Он относится
    ко **всей строке**: `SELECT DISTINCT category, size` убирает только
    полностью совпадающие пары. Все `NULL` для него одинаковы.

    **Полезен** для разведки: какие статусы, категории, роли встречаются
    в таблице. Так находят грязные данные — «Одежда» и «одежда», статус,
    которого нет в спецификации.

    **Прячет проблему**, когда им «лечат» дубли. Дубли — симптом:
    в данных лишние строки или таблицы соединены неправильно.
    `DISTINCT` уберёт их из твоего отчёта, а пользователь в приложении
    по-прежнему увидит товар дважды. Сначала нужно найти, откуда дубли.

- id: bd2-09
  type: card
  question: Что такое псевдоним в SELECT? Чем в PostgreSQL отличаются одинарные и двойные кавычки?
  answer: |
    **Псевдоним** — имя столбца в результате: `price * stock AS stock_value`.
    Им удобно называть выражения и делать отчёты читаемыми.

    - **Одинарные кавычки** — строка, значение: `WHERE status = 'DONE'`.
    - **Двойные кавычки** — имя столбца, таблицы или псевдонима:
      `AS "Цена, ₽"`. Нужны, если в имени пробелы, большие или русские буквы.
    - **Без кавычек** имя приводится к нижнему регистру: `AS Total` → `total`.

    Классическая ошибка — `WHERE status = "DONE"`: PostgreSQL ищет столбец
    `DONE` и отвечает `column "DONE" does not exist`.

    Псевдоним работает в `ORDER BY`, но не в `WHERE` — `WHERE` выполняется
    раньше `SELECT`.

- id: bd2-10
  type: quiz
  question: |
    Нужны «обувь и электроника дешевле 1000 ₽». Написали:
    `WHERE category = 'Обувь' OR category = 'Электроника' AND price < 1000`.
    Что вернёт запрос?
  options:
    - "Только обувь и электронику дешевле 1000 ₽ — как и задумано"
    - "Всю обувь с любой ценой и электронику дешевле 1000 ₽"
    - "Ошибку: условия с AND и OR нельзя смешивать без скобок"
    - "Только электронику дешевле 1000 ₽, обувь в выборку не попадёт"
  correct: 1
  explanation: |
    `AND` выполняется раньше `OR`, как умножение раньше сложения.
    База читает условие как
    `category = 'Обувь' OR (category = 'Электроника' AND price < 1000)`.
    Обувь попадает целиком, с любой ценой.

    Правильно — скобками сказать, что сначала `OR`:
    `(category = 'Обувь' OR category = 'Электроника') AND price < 1000`
    или `category IN ('Обувь', 'Электроника') AND price < 1000`.

    Ловушка — «ошибка». Запрос выполняется, просто возвращает больше, чем нужно.

- id: bd2-11
  type: quiz
  question: |
    В таблице 1000 заказов, 50 отменены, у остальных статус заполнен.
    Сколько строк вернёт
    `WHERE status NOT IN ('CANCELLED', NULL)`?
  options:
    - "950 — все заказы, кроме отменённых"
    - "1000 — `NULL` в списке отключает фильтр"
    - "50 — `NOT IN` с `NULL` работает как `IN`"
    - "0 — ни одна строка не даст TRUE"
  correct: 3
  explanation: |
    `NOT IN ('CANCELLED', NULL)` — это
    `status <> 'CANCELLED' AND status <> NULL`. Вторая часть для любой
    строки — UNKNOWN. Для отменённых: `FALSE AND UNKNOWN` — FALSE.
    Для остальных: `TRUE AND UNKNOWN` — UNKNOWN. TRUE нет ни у кого,
    `WHERE` отбрасывает всё.

    На практике `NULL` приходит из подзапроса:
    `NOT IN (SELECT user_id FROM …)`. Один `NULL` в подзапросе — и пустой
    результат. Безопасная замена — `NOT EXISTS`.

- id: bd2-12
  type: quiz
  question: |
    В таблице 16 заказов: 3 отменены, у 2 статус `NULL`, у остальных
    другие статусы. Сколько строк вернёт `WHERE status <> 'CANCELLED'`?
  options:
    - "11 — заказы со статусом `NULL` отбрасываются"
    - "13 — всё, кроме трёх отменённых"
    - "16 — `<>` не работает со строками и пропускает всё"
    - "2 — `<>` находит только строки со статусом `NULL`"
  correct: 0
  explanation: |
    `NULL <> 'CANCELLED'` — UNKNOWN, а `WHERE` пропускает только TRUE.
    Из 13 «не отменённых» два заказа без статуса теряются — остаётся 11.

    Если по смыслу заказы без статуса тоже нужны — так и пишут:
    `status <> 'CANCELLED' OR status IS NULL`
    или `status IS DISTINCT FROM 'CANCELLED'`.

    Ловушка — «13»: так кажется, если забыть про трёхзначную логику.
    Такая ошибка в отчёте выглядит как «выручка не сходится на пару процентов».

- id: bd2-13
  type: quiz
  question: |
    В PostgreSQL выполняют `ORDER BY finished_at` — у части строк
    `finished_at` равен `NULL`. Где окажутся эти строки?
  options:
    - "В начале списка — `NULL` считается меньше любого значения"
    - "В случайных местах — `NULL` нельзя сравнить, порядок не определён"
    - "В конце списка, а при `ORDER BY finished_at DESC` — в начале"
    - "Их не будет в результате — сортировка отбрасывает `NULL`"
  correct: 2
  explanation: |
    В PostgreSQL `NULL` при сортировке считается больше любого значения.
    По возрастанию — в конце, по убыванию — в начале.

    Поменять можно явно: `NULLS FIRST` или `NULLS LAST`. Например,
    «новые сверху, без даты — внизу»: `ORDER BY finished_at DESC NULLS LAST`.

    В MySQL и MS SQL Server наоборот — `NULL` меньше всего. Ловушка
    «в начале» — верный ответ для них, но не для PostgreSQL.

- id: bd2-14
  type: quiz
  question: |
    Запрос
    `SELECT name, price * stock AS total FROM products WHERE total > 1000`
    падает с ошибкой `column "total" does not exist`. Почему?
  options:
    - "Псевдоним нельзя давать выражению, только столбцу таблицы"
    - "`WHERE` выполняется раньше `SELECT`, псевдонима ещё нет"
    - "Слово `total` зарезервировано, его нужно взять в кавычки"
    - "Выражение `price * stock` нельзя сравнивать с числом"
  correct: 1
  explanation: |
    Порядок выполнения: `FROM → WHERE → SELECT → ORDER BY → LIMIT`.
    Псевдоним `total` появляется на шаге `SELECT`, а `WHERE` работает
    раньше — для него такого столбца нет.

    Исправление — повторить выражение: `WHERE price * stock > 1000`.
    А в `ORDER BY total` псевдоним работает: сортировка идёт после `SELECT`.

    `total` не зарезервировано, и выражениям давать псевдонимы можно —
    для этого они чаще всего и нужны.

- id: bd2-15
  type: quiz
  question: |
    Столбец `created_at` — `timestamptz`. Отчёт за октябрь построен как
    `WHERE created_at BETWEEN '2026-10-01' AND '2026-10-31'`.
    Какие заказы потеряются?
  options:
    - "Никакие — `BETWEEN` включает обе границы, весь октябрь на месте"
    - "Заказы 1 октября — левая граница для дат не включается"
    - "Только заказы 31 октября, оформленные ровно в полночь"
    - "Заказы 31 октября, оформленные позже 00:00"
  correct: 3
  explanation: |
    Для столбца со временем `'2026-10-31'` — это `2026-10-31 00:00:00`.
    Всё, что оформлено 31-го позже полуночи, больше правой границы
    и в отчёт не попадает. Заказ ровно в 00:00 — попадает.

    Правильно — полуоткрытый интервал:
    `created_at >= '2026-10-01' AND created_at < '2026-11-01'`.

    Ловушка — «`BETWEEN` включает границы». Включает, но граница — это
    полночь, а не весь день.

- id: bd2-16
  type: quiz
  question: Что делает ILIKE в PostgreSQL?
  options:
    - "Ищет по шаблону, как `LIKE`, но без учёта регистра"
    - "Ищет по шаблону, но `%` и `_` в нём — обычные символы"
    - "Ищет по шаблону и считает «е» и «ё» одной буквой"
    - "Ищет по шаблону, как `LIKE`, но работает быстрее"
  correct: 0
  explanation: |
    `ILIKE` — `LIKE` без учёта регистра: `name ILIKE '%sony%'` найдёт
    «SONY», «Sony» и «sony». Это особенность PostgreSQL. В других СУБД
    пишут `lower(name) LIKE '%sony%'`.

    `%` и `_` в `ILIKE` — такие же шаблоны, экранировать их всё равно нужно.
    «Е» и «ё» остаются разными буквами: поиск «зеленый» не найдёт «Зелёный».
    Быстрее `ILIKE` не работает — скорее наоборот.

- id: bd2-17
  type: quiz
  question: |
    Номера заказов хранятся в столбце `varchar`: '5', '9', '10', '100'.
    В каком порядке их вернёт `ORDER BY number`?
  options:
    - "5, 9, 10, 100 — база понимает, что это числа"
    - "100, 10, 9, 5 — длинные строки идут первыми"
    - "10, 100, 5, 9 — строки сравниваются посимвольно"
    - "Ошибка — строку нельзя сортировать, если в ней цифры"
  correct: 2
  explanation: |
    Строки сравниваются как слова в словаре — по первому символу,
    потом по второму. `'1'` меньше `'5'` и `'9'`, поэтому `'10'` и `'100'`
    идут первыми, а `'10'` короче `'100'` — значит, раньше.

    Исправление — сортировать как числа: `ORDER BY number::integer`.
    Это сработает, только если в столбце нет нечисловых значений.

    В интерфейсе такая сортировка — баг, даже если «база так сортирует».

- id: bd2-18
  type: card
  question: Почему LIMIT и OFFSET без ORDER BY опасны? Как это связано с пагинацией в API?
  answer: |
    Без `ORDER BY` база не обещает порядок строк. Он может меняться между
    запусками одного и того же запроса — после обновления строк, очистки
    таблицы, смены плана запроса.

    `LIMIT 5 OFFSET 5` без сортировки — это «пропусти какие-то 5, дай
    какие-то 5». Одна строка может попасть на две страницы, другая —
    ни на одну.

    API с параметрами `limit` и `offset` часто превращает их ровно
    в `LIMIT … OFFSET …`. Поэтому в списках проверяют: есть ли сортировка
    и **однозначна ли она**. При сортировке по дате с одинаковыми значениями
    нужен второй, уникальный столбец: `ORDER BY created_at DESC, id DESC`.
    Иначе страницы «плавают».

- id: bd2-19
  type: quiz
  question: |
    Что вернёт `COALESCE(description, 'нет описания')` для строки,
    где `description` — пустая строка `''`?
  options:
    - "Строку «нет описания» — пустая строка тоже считается пустым значением"
    - "Пустую строку `''` — `COALESCE` заменяет только `NULL`"
    - "`NULL` — пустая строка при вызове функции становится `NULL`"
    - "Ошибку — `COALESCE` не принимает пустые строки"
  correct: 1
  explanation: |
    `COALESCE(a, b)` возвращает первое значение, которое не `NULL`.
    Пустая строка — не `NULL`: это значение, просто пустое. Поэтому
    она и вернётся.

    Если нужно заменять оба случая, сначала превращают `''` в `NULL`
    или используют `CASE WHEN description IS NULL OR description = '' THEN … END`.

    Ловушка в том, что на экране `NULL` и `''` выглядят одинаково,
    а запросы и код обрабатывают их по-разному.

- id: bd2-20
  type: card
  question: Что делает DISTINCT ON в PostgreSQL? Приведи пример из работы тестировщика.
  answer: |
    `DISTINCT ON (столбец)` оставляет **одну строку на каждое значение**
    столбца — первую по сортировке.

    ```sql
    SELECT DISTINCT ON (task_id) task_id, id, text, created_at
    FROM comments
    ORDER BY task_id, created_at DESC, id DESC;
    ```

    Это последний комментарий к каждой задаче.

    Правило: столбцы из `DISTINCT ON` стоят первыми в `ORDER BY`, дальше —
    порядок, который решает, какая строка «первая». Без него база выберет
    любую строку группы, и результат будет меняться.

    Примеры для тестировщика: последняя запись журнала по каждому объекту,
    последний заказ каждого клиента, самый дешёвый товар в категории.
    Это особенность PostgreSQL — в других СУБД то же делают оконными функциями.
