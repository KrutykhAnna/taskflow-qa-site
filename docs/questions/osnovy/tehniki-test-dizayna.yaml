# Формат файла вопросов темы (имя файла = id темы из lib/topics.ts).
# Файл — список вопросов. Поле id уникально во всём банке вопросов.
#
# Открытый вопрос (card):
#   - id: уникальный-id
#     type: card
#     question: текст вопроса
#     answer: |       # ответ в простом markdown
#
# Тест (quiz):
#   - id: уникальный-id
#     type: quiz
#     question: текст вопроса
#     options: [минимум 2 варианта]
#     correct: 0      # индекс верного варианта, отсчёт с НУЛЯ
#     explanation: |  # разбор в простом markdown
#
# В answer и explanation только простой markdown: без контейнеров (::: tip)
# и без ссылок на страницы сайта — они не поддерживаются, а ссылку на тему
# тренажёр показывает сам.

- id: tdd-techniques-sources
  type: card
  question: Какие техники тест-дизайна вы знаете и откуда у каждой берётся источник?
  answer: |
    Начну с четырёх основных формальных техник. У каждой есть свой
    источник: документ, из которого берутся данные для проверок. Без
    источника техника не работает: вы не применяете её, а выдумываете
    проверки «на глаз».

    - **Эквивалентное разбиение.** Делим все возможные значения на классы,
      внутри которых система ведёт себя одинаково, и проверяем по одному
      представителю из каждого класса. Источник: описание допустимых значений
      и типов полей (спецификация API, ТЗ, пользовательская история).
    - **Анализ граничных значений.** Проверяем значения ровно на границе и на
      шаг за ней с обеих сторон. Источник: явно заданные пределы (минимум и
      максимум длины, числовой диапазон). Нет явной границы, значит, применять
      технику не к чему.
    - **Таблица принятия решений.** Записываем несколько условий и все их
      сочетания в таблицу, чтобы не пропустить комбинацию. Источник:
      описание бизнес-правил, например ролевая модель.
    - **Переходы состояний.** Проверяем не только сами состояния, но и
      переходы между ними, в том числе запрещённые. Источник: диаграмма
      состояний или описание жизненного цикла объекта. Если формального
      источника нет, честно сформулируйте правила как гипотезу и уточните их.

    Техника без источника превращается в угадывание, поэтому сначала найдите документ.

    Ещё есть попарное тестирование (источник — список параметров и их
    значений) и техники на основе опыта: предугадывание ошибок и
    исследовательское тестирование. Они опираются на опыт тестировщика и
    сам продукт и дополняют формальные техники.

- id: tdd-bva-title-length
  type: quiz
  question: Название задачи в TaskFlow — от 1 до 100 символов. Какие длины проверяем по граничным значениям?
  options:
    - "1, 50, 100"
    - "0 и 101"
    - "0, 1, 100, 101"
    - "1 и 100"
  correct: 2
  explanation: |
    Проверяем саму границу и шаг за неё с обеих сторон: 0 (недопустимо),
    1 (минимум), 100 (максимум), 101 (недопустимо). Значение 50 — это
    представитель класса эквивалентности, а не граница.

- id: tdd-pick-technique-statuses
  type: quiz
  question: У задачи есть статусы TODO, IN_PROGRESS, DONE. Какая техника лучше всего подходит, чтобы проверить смену статусов?
  options:
    - "Переходы состояний"
    - "Граничные значения"
    - "Эквивалентное разбиение"
    - "Таблица принятия решений"
  correct: 0
  explanation: |
    Когда у сущности конечный набор состояний и правила перехода между ними,
    проверяем сами переходы: обычные, возвраты назад и «прыжки» через состояние.

- id: tdd-exploratory-vs-monkey
  type: card
  question: Чем исследовательское тестирование отличается от манки-тестирования?
  answer: |
    Главное отличие — цель.

    - **Исследовательское тестирование** — это исследование с целью. Есть
      миссия (charter): что исследуем и зачем. Есть ограничение по времени
      и записи: что проверил, что нашёл, какие вопросы появились. Каждое
      следующее действие выбирается осознанно, по итогам предыдущего.
      ISTQB относит его к техникам на основе опыта.
    - **Манки-тестирование** — случайные хаотичные действия без цели:
      нажимать на всё подряд, вводить что попало. Строго говоря, это скорее
      подход, чем техника тест-дизайна. Оно полезно, чтобы проверить
      устойчивость: не падает ли программа от неожиданных действий. Его
      слабое место — воспроизведение, поэтому действия записывают или
      автоматизируют, например с помощью gremlins.js для веба.

    Коротко: исследовательское — исследование с целью, манки — хаос без цели.

- id: tdd-pairwise-what-when
  type: card
  question: Что такое попарное тестирование и когда его применять?
  answer: |
    Это техника, в которой мы не перебираем все сочетания параметров,
    а подбираем проверки так, чтобы каждая пара значений встретилась хотя
    бы один раз.

    Идея опирается на наблюдение: большинство ошибок вызывает одно значение
    или пара значений двух параметров. Ошибки, которым нужно точное сочетание
    сразу трёх и больше параметров, редки.

    Пример: три параметра по три значения. Полный перебор — 27 проверок,
    попарный набор — 9.

    Применять, когда параметров много, они в основном независимы и полный
    перебор слишком дорогой: фильтры, настройки, конфигурации (браузер × ОС ×
    язык). Если правило явно зависит от сочетания условий, лучше таблица
    принятия решений со всеми сочетаниями. Набор строят вручную или
    генератором, например PICT от Microsoft.

- id: tdd-pairwise-count
  type: quiz
  question: Три параметра, у каждого по 3 значения. Сколько проверок нужно для полного перебора и сколько примерно для попарного?
  options:
    - "9 и 3"
    - "27 и 9"
    - "27 и 27"
    - "81 и 9"
  correct: 1
  explanation: |
    Полный перебор — 3 × 3 × 3 = 27 сочетаний. В попарном наборе каждая пара
    значений должна встретиться хотя бы раз. Только пар «первый параметр ×
    второй» уже 3 × 3 = 9, поэтому меньше 9 проверок не получится. Для трёх
    параметров по три значения 9 проверок хватает, чтобы покрыть все пары.

- id: tdd-experience-based
  type: quiz
  question: Какая из этих техник относится к техникам на основе опыта, а не к формальным?
  options:
    - "Граничные значения"
    - "Таблица принятия решений"
    - "Исследовательское тестирование"
    - "Эквивалентное разбиение"
  correct: 2
  explanation: |
    Формальные техники берут проверки из источника: граничные значения и
    эквивалентное разбиение — из описания допустимых значений, таблица
    принятия решений — из бизнес-правил. Исследовательское тестирование
    опирается на опыт тестировщика и на сам продукт: проверки придумываются
    по ходу работы. К той же группе относится предугадывание ошибок.

- id: tdd-one-invalid-per-test
  type: quiz
  question: Почему в одном негативном тесте обычно нарушают только одно правило поля?
  options:
    - "Так требует стандарт ISTQB"
    - "Иначе тест получится слишком длинным"
    - "Если нарушить сразу два правила, непонятно, на какое из них отреагировала система"
    - "Система не умеет обрабатывать две ошибки сразу"
  correct: 2
  explanation: |
    Если пароль одновременно слишком короткий и без цифры, а система
    отклонила его, ты не знаешь, сработала проверка длины или проверка
    состава. Одна из них может быть вообще сломана, а тест всё равно
    «прошёл». Поэтому в негативном тесте меняют что-то одно, а остальные
    правила выполняют.

- id: tdd-age-boundary-today
  type: quiz
  question: Счёт можно открыть с 18 лет. Сегодня 14.10.2026. Какая дата рождения стоит ровно на границе и должна быть принята?
  options:
    - "15.10.2008"
    - "14.10.2008"
    - "14.10.2009"
    - "01.01.2008"
  correct: 1
  explanation: |
    Человеку, родившемуся 14.10.2008, сегодня исполняется ровно 18 —
    это минимум допустимого класса. 15.10.2008 — шаг за границу (18
    исполнится только завтра), его нужно отклонить. 01.01.2008 —
    представитель класса, а не граница.

    Важно: граница по возрасту зависит от даты прогона. В кейсе пишут
    правило «исполняется 18 сегодня», а не фиксированную дату. И
    уточняют, по чьему часовому поясу считается «сегодня».

- id: tdd-cumulative-limit
  type: card
  question: В банке лимит «не больше 100 000 ₽ переводов в сутки». Какие проверки и вопросы ты добавишь, кроме перевода на 100 001 ₽?
  answer: |
    Лимит накопительный, поэтому граница — по сумме за период, а не по
    одной операции.

    Проверки:

    - шаг у денег — копейка: 99 999,99, 100 000,00 и 100 000,01;
    - несколько переводов: 60 000 + 40 000 (ровно лимит) и
      60 000 + 40 000,01 (сверху);
    - переводы на стыке суток;
    - два перевода одновременно с разных устройств — не пройдут ли оба.

    Вопросы аналитику:

    - сутки календарные или скользящие 24 часа, и по какому часовому поясу;
    - какие операции входят в лимит;
    - освобождает ли лимит отменённый перевод.

    Без ответов на эти вопросы границу просто не из чего построить.

- id: tdd-pairwise-constraints
  type: quiz
  question: Генератор попарных наборов выдал строки, которые в продукте невозможны (например, «доставка в постамат + оплата наличными курьеру»). Что правильнее всего сделать?
  options:
    - "Удалить эти строки из таблицы вручную"
    - "Оставить как есть и пометить строки как пропущенные"
    - "Отказаться от попарного тестирования и перебрать всё"
    - "Описать ограничения в модели генератора, а невозможные сочетания проверить отдельно как негативные"
  correct: 3
  explanation: |
    Если удалить строки вручную, пропадут и допустимые пары, которые в них
    покрывались, — набор перестанет быть попарным. Генераторы вроде PICT
    умеют принимать ограничения (условия IF … THEN) и строят набор только
    из возможных строк.

    Сами невозможные сочетания полезны как негативные проверки: интерфейс
    не должен позволить их выбрать, а сервер — принять.

- id: tdd-forbidden-transitions
  type: card
  question: Предыдущий тестировщик проверил все стрелки на диаграмме статусов заказа, всё работает. Почему этого недостаточно и что ты добавишь?
  answer: |
    Диаграмма показывает только разрешённые переходы. Запрещённые никто
    не проверял, а самые опасные ошибки часто там: возврат по отменённому
    заказу, отмена уже доставленного, повторная оплата.

    Что добавлю:

    1. Таблицу переходов «статус × событие». Каждая клетка — проверка:
       разрешённые переходы работают, запрещённые отклоняются.
    2. Клетки, где непонятно, что должно быть, — вопросы аналитику:
       «запрещено» это или «не подумали».
    3. Одновременные действия разных участников (курьер и клиент) и
       повторные события, например двойное «оплачено» от платёжного
       сервиса.

    В регресс в первую очередь пойдут запрещённые переходы, связанные с
    деньгами.

- id: tdd-defend-test-count
  type: card
  question: "Тимлид говорит: «Зачем 14 тестов на одно поле? Сделай три». Как ответишь?"
  answer: |
    Покажу, откуда взялась каждая проверка, сгруппировав их по техникам:
    границы, классы недопустимых значений, форматы, особые случаи. У каждой
    группы — источник в требованиях и риск, который она закрывает.

    Если сокращать всё равно нужно, предложу убрать проверки с самым
    низким риском и явно запишу, что они не проверены. Тогда решение о
    риске принимается осознанно.

    «Три теста» без объяснения, какие именно, — это не экономия, а
    неизвестный риск.

- id: tdd-sfdipot
  type: quiz
  question: Для чего тестировщику эвристика SFDIPOT?
  options:
    - "Чтобы набрать идеи проверок по разным сторонам продукта, когда спецификации мало"
    - "Чтобы посчитать минимальное число попарных проверок"
    - "Чтобы определить severity найденного бага"
    - "Чтобы построить таблицу принятия решений"
  correct: 0
  explanation: |
    SFDIPOT (Structure, Function, Data, Interfaces, Platform, Operations,
    Time) — подсказка, на какие стороны продукта посмотреть: из чего он
    состоит, что умеет, с какими данными работает, с чем интегрирован, на
    каких платформах живёт, как им пользуются и что зависит от времени.

    Она не говорит, как правильно, а помогает не застрять на первых
    очевидных идеях. Особенно полезна в исследовательских сессиях.
