# Формат файла вопросов темы (имя файла = id темы из lib/topics.ts).
# Файл — список вопросов. Поле id уникально во всём банке вопросов.
#
# Открытый вопрос (card):
#   - id: уникальный-id
#     type: card
#     question: текст вопроса
#     answer: |       # ответ в простом markdown
#
# Тест (quiz):
#   - id: уникальный-id
#     type: quiz
#     question: текст вопроса
#     options: [минимум 2 варианта]
#     correct: 0      # индекс верного варианта, отсчёт с НУЛЯ
#     explanation: |  # разбор в простом markdown
#
# В answer и explanation только простой markdown: без контейнеров (::: tip)
# и без ссылок на страницы сайта — они не поддерживаются, а ссылку на тему
# тренажёр показывает сам.

- id: tdd-techniques-sources
  type: card
  question: Какие техники тест-дизайна вы знаете и откуда у каждой берётся источник?
  answer: |
    Начну с четырёх основных формальных техник. У каждой есть свой
    источник: документ, из которого берутся данные для проверок. Без
    источника техника не работает: вы не применяете её, а выдумываете
    проверки «на глаз».

    - **Эквивалентное разбиение.** Делим все возможные значения на классы,
      внутри которых система ведёт себя одинаково, и проверяем по одному
      представителю из каждого класса. Источник: описание допустимых значений
      и типов полей (спецификация API, ТЗ, пользовательская история).
    - **Анализ граничных значений.** Проверяем значения ровно на границе и на
      шаг за ней с обеих сторон. Источник: явно заданные пределы (минимум и
      максимум длины, числовой диапазон). Нет явной границы, значит, применять
      технику не к чему.
    - **Таблица принятия решений.** Записываем несколько условий и все их
      сочетания в таблицу, чтобы не пропустить комбинацию. Источник:
      описание бизнес-правил, например ролевая модель.
    - **Переходы состояний.** Проверяем не только сами состояния, но и
      переходы между ними, в том числе запрещённые. Источник: диаграмма
      состояний или описание жизненного цикла объекта. Если формального
      источника нет, честно сформулируйте правила как гипотезу и уточните их.

    Техника без источника превращается в угадывание, поэтому сначала найдите документ.

    Ещё есть попарное тестирование (источник — список параметров и их
    значений) и техники на основе опыта: предугадывание ошибок и
    исследовательское тестирование. Они опираются на опыт тестировщика и
    сам продукт и дополняют формальные техники.

- id: tdd-bva-title-length
  type: quiz
  question: Название задачи в TaskFlow — от 1 до 100 символов. Какие длины проверяем по граничным значениям?
  options:
    - "1, 50, 100"
    - "0 и 101"
    - "0, 1, 100, 101"
    - "1 и 100"
  correct: 2
  explanation: |
    Проверяем саму границу и шаг за неё с обеих сторон: 0 (недопустимо),
    1 (минимум), 100 (максимум), 101 (недопустимо). Значение 50 — это
    представитель класса эквивалентности, а не граница.

- id: tdd-pick-technique-statuses
  type: quiz
  question: У задачи есть статусы TODO, IN_PROGRESS, DONE. Какая техника лучше всего подходит, чтобы проверить смену статусов?
  options:
    - "Переходы состояний"
    - "Граничные значения"
    - "Эквивалентное разбиение"
    - "Таблица принятия решений"
  correct: 0
  explanation: |
    Когда у сущности конечный набор состояний и правила перехода между ними,
    проверяем сами переходы: обычные, возвраты назад и «прыжки» через состояние.

- id: tdd-exploratory-vs-monkey
  type: card
  question: Чем исследовательское тестирование отличается от манки-тестирования?
  answer: |
    Главное отличие — цель.

    - **Исследовательское тестирование** — это исследование с целью. Есть
      миссия (charter): что исследуем и зачем. Есть ограничение по времени
      и записи: что проверил, что нашёл, какие вопросы появились. Каждое
      следующее действие выбирается осознанно, по итогам предыдущего.
      ISTQB относит его к техникам на основе опыта.
    - **Манки-тестирование** — случайные хаотичные действия без цели:
      нажимать на всё подряд, вводить что попало. Строго говоря, это скорее
      подход, чем техника тест-дизайна. Оно полезно, чтобы проверить
      устойчивость: не падает ли программа от неожиданных действий. Его
      слабое место — воспроизведение, поэтому действия записывают или
      автоматизируют, например с помощью gremlins.js для веба.

    Коротко: исследовательское — исследование с целью, манки — хаос без цели.

- id: tdd-pairwise-what-when
  type: card
  question: Что такое попарное тестирование и когда его применять?
  answer: |
    Это техника, в которой мы не перебираем все сочетания параметров,
    а подбираем проверки так, чтобы каждая пара значений встретилась хотя
    бы один раз.

    Идея опирается на наблюдение: большинство ошибок вызывает одно значение
    или пара значений двух параметров. Ошибки, которым нужно точное сочетание
    сразу трёх и больше параметров, редки.

    Пример: три параметра по три значения. Полный перебор — 27 проверок,
    попарный набор — 9.

    Применять, когда параметров много, они в основном независимы и полный
    перебор слишком дорогой: фильтры, настройки, конфигурации (браузер × ОС ×
    язык). Если правило явно зависит от сочетания условий, лучше таблица
    принятия решений со всеми сочетаниями. Набор строят вручную или
    генератором, например PICT от Microsoft.

- id: tdd-pairwise-count
  type: quiz
  question: Три параметра, у каждого по 3 значения. Сколько проверок нужно для полного перебора и сколько примерно для попарного?
  options:
    - "9 и 3"
    - "27 и 9"
    - "27 и 27"
    - "81 и 9"
  correct: 1
  explanation: |
    Полный перебор — 3 × 3 × 3 = 27 сочетаний. В попарном наборе каждая пара
    значений должна встретиться хотя бы раз. Только пар «первый параметр ×
    второй» уже 3 × 3 = 9, поэтому меньше 9 проверок не получится. Для трёх
    параметров по три значения 9 проверок хватает, чтобы покрыть все пары.

- id: tdd-experience-based
  type: quiz
  question: Какая из этих техник относится к техникам на основе опыта, а не к формальным?
  options:
    - "Граничные значения"
    - "Таблица принятия решений"
    - "Исследовательское тестирование"
    - "Эквивалентное разбиение"
  correct: 2
  explanation: |
    Формальные техники берут проверки из источника: граничные значения и
    эквивалентное разбиение — из описания допустимых значений, таблица
    принятия решений — из бизнес-правил. Исследовательское тестирование
    опирается на опыт тестировщика и на сам продукт: проверки придумываются
    по ходу работы. К той же группе относится предугадывание ошибок.
