# Формат файла вопросов темы (имя файла = id темы из lib/topics.ts).
# Файл — список вопросов. Поле id уникально во всём банке вопросов.
#
# Открытый вопрос (card):
#   - id: уникальный-id
#     type: card
#     question: текст вопроса
#     answer: |       # ответ в простом markdown
#
# Тест (quiz):
#   - id: уникальный-id
#     type: quiz
#     question: текст вопроса
#     options: [минимум 2 варианта]
#     correct: 0      # индекс верного варианта, отсчёт с НУЛЯ
#     explanation: |  # разбор в простом markdown
#
# В answer и explanation только простой markdown: без контейнеров (::: tip)
# и без ссылок на страницы сайта — они не поддерживаются, а ссылку на тему
# тренажёр показывает сам.


- id: bug-severity-vs-priority
  type: card
  question: Чем серьёзность (severity) отличается от приоритета (priority)?
  answer: |
    Это две независимые оценки, а не два названия одного и того же.

    **Серьёзность** — насколько сильно сломано технически: рушит ли баг
    главный сценарий, теряются ли данные, падает ли программа — или это
    мелочь с лёгким обходом. Обычно её ставит тестировщик: он видит баг
    своими глазами.

    **Приоритет** — насколько срочно чинить: сколько пользователей задето,
    насколько баг заметен, нет ли рядом релиза или показа клиенту. Решающее
    слово обычно за владельцем продукта.

    Поэтому бывают все четыре сочетания. Например, тяжёлый сбой в редком
    сценарии — высокая серьёзность, низкий приоритет. А опечатка на главной
    перед показом клиенту — низкая серьёзность, высокий приоритет. Это не
    противоречие: оценки измеряют разное.

- id: bug-prod-vs-deadline
  type: card
  question: Одновременно нашёлся критичный баг на проде и есть срочная задача с дедлайном сегодня. Как расставишь приоритеты?
  answer: |
    Критичный баг на проде почти всегда означает высокую серьёзность:
    он задевает настоящих пользователей прямо сейчас. Такой баг не кладут
    в общую очередь — о нём сразу сообщают лиду или владельцу продукта,
    с честной оценкой серьёзности и фактами: кого и как задевает.

    Но что делать первым — чинить прод или доделывать задачу с дедлайном —
    решает не тестировщик в одиночку. Это решение с бизнес-картиной, которую
    целиком видит лид или владелец продукта.

    Задача тестировщика — не разрываться молча и не решать самому, а сразу
    сделать риск видимым и получить явное решение от того, у кого есть
    на это полномочия.

- id: bug-typo-first
  type: card
  question: Тимлид просит отдать в работу мелкую опечатку раньше, чем найденный тобой технически более серьёзный баг. Тимлид неправ?
  answer: |
    Не обязательно. «Что серьёзнее» и «что чинить первым» — разные вопросы.

    Опечатка остаётся мелочью по серьёзности, даже если её видят все. Но
    на первом экране или перед показом клиенту у неё высокая заметность и
    цена для репутации. А приоритет как раз зависит от таких вещей.

    Правильная реакция — не спорить, чья оценка важнее, а убедиться, что
    на серьёзный баг тоже есть полноценный баг-репорт с честной
    серьёзностью и что его видит тот, кто расставляет приоритеты.

- id: bug-po-defers
  type: card
  question: Ты считаешь, что баг нужно чинить первым, а владелец продукта его откладывает. Что делаешь?
  answer: |
    Решение о приоритете — за владельцем продукта. У него есть картина,
    которой у тестировщика обычно нет целиком: сроки, другие задачи,
    обещания клиентам.

    Задача тестировщика — чтобы решение принималось на точных фактах:
    ясная серьёзность, конкретно кого и как задевает баг, и своё мнение
    о приоритете с доводами — высказанное один раз и явно, а не молчаливое
    несогласие.

    Если после этого баг всё равно откладывают — это решение нужно уважать
    и не обходить, например договорившись с разработчиком починить
    «по-тихому». Цель — не победить в споре, а сделать решение осознанным.

- id: bug-classify-typo
  type: quiz
  question: На главной странице магазина опечатка в названии самого магазина. Завтра показ продукта инвесторам. Какая оценка подходит лучше всего?
  options:
    - "Серьёзность высокая, приоритет высокий"
    - "Серьёзность низкая, приоритет высокий"
    - "Серьёзность высокая, приоритет низкий"
    - "Серьёзность низкая, приоритет низкий"
  correct: 1
  explanation: |
    Технически это косметика: ничего не сломано, данные целы. Значит,
    серьёзность низкая.

    Но опечатку видит каждый, а завтра показ. Чинить её нужно срочно —
    приоритет высокий. Серьёзность и приоритет — независимые оценки.

- id: bug-classify-rare-crash
  type: quiz
  question: Выгрузка архива заказов за 2015 год падает с ошибкой сервера. Пользуются ею два человека раз в год. Какая оценка подходит лучше всего?
  options:
    - "Серьёзность низкая, приоритет низкий"
    - "Серьёзность низкая, приоритет высокий"
    - "Серьёзность высокая, приоритет высокий"
    - "Серьёзность высокая, приоритет низкий"
  correct: 3
  explanation: |
    Функция сломана целиком — серьёзность высокая. Занижать её из-за
    редкости нельзя: это техническая оценка.

    А вот срочность низкая: сценарием почти не пользуются. Такой баг можно
    осознанно отложить — но в баг-репорте серьёзность должна остаться
    честной.

- id: bug-not-in-report
  type: quiz
  question: Что НЕ нужно писать в баг-репорте?
  options:
    - "Догадку о причине в поле «Фактический результат»"
    - "Окружение: сборку, браузер, операционную систему"
    - "Ожидаемый результат со ссылкой на источник"
    - "Шаги с конкретными данными"
  correct: 0
  explanation: |
    Фактический результат — только то, что ты видел: код ответа, текст
    сообщения, число на экране. Догадка о причине может оказаться неверной
    и бросить тень на весь баг-репорт. Искать причину — работа того, кто
    будет чинить.

    Окружение, шаги с данными и ожидаемый результат с источником — как раз
    обязательная часть хорошего баг-репорта.

- id: bug-good-title
  type: quiz
  question: Какой заголовок баг-репорта лучше?
  options:
    - "Корзина сломана!!!"
    - "Разработчик забыл пересчёт суммы"
    - "Корзина: промокод не уменьшает сумму к оплате, если в корзине больше 10 товаров"
    - "Баг с промокодом"
  correct: 2
  explanation: |
    Хороший заголовок отвечает на три вопроса: где (корзина), что (сумма
    не уменьшается) и когда (больше 10 товаров). По нему понятно, о чём
    баг, даже без чтения шагов.

    Остальные варианты либо слишком общие, либо содержат эмоции или
    догадку о причине вместо факта.

- id: bug-after-fixed
  type: quiz
  question: Разработчик перевёл баг в статус «Исправлен» (Fixed). Что дальше?
  options:
    - "Баг сразу закрывается — разработчик же исправил"
    - "Тестировщик делает ретест на новой сборке и только потом закрывает или переоткрывает баг"
    - "Баг уходит владельцу продукта на оценку приоритета"
    - "Тестировщик заводит новый баг-репорт на то же самое"
  correct: 1
  explanation: |
    «Исправлен» — это мнение разработчика, а не факт. Тестировщик повторяет
    шаги из баг-репорта на сборке с исправлением. Прошло — баг закрывают.
    Повторился — баг переоткрывают и возвращают разработчику.

    Заодно стоит подумать о регрессе: исправление могло задеть соседние
    функции.

- id: bug-duplicate
  type: quiz
  question: Ты нашёл баг, а в трекере уже есть баг-репорт на ту же проблему. Что делать?
  options:
    - "Завести свой баг-репорт — чем больше репортов, тем быстрее починят"
    - "Ничего не делать: баг уже заведён"
    - "Удалить чужой репорт и завести свой, более подробный"
    - "Не заводить новый, а дописать в существующий то, чего там не хватает"
  correct: 3
  explanation: |
    Два баг-репорта на одну проблему только путают команду: их обсуждают
    по отдельности, а потом один всё равно закрывают как дубликат.

    Но и молчать не стоит: если у тебя есть новые сведения — другое
    окружение, более короткие шаги, скриншот, — допиши их в существующий
    баг-репорт.

- id: bug-report-fields
  type: card
  question: Из каких полей состоит баг-репорт?
  answer: |
    - **ID** — номер, его обычно даёт трекер.
    - **Заголовок** — суть в одной фразе по формуле «что — где — когда».
    - **Окружение** — стенд, версия сборки, браузер или устройство, ОС.
    - **Предусловия** — что готово до первого шага: кто вошёл, какие
      данные есть.
    - **Шаги воспроизведения** — пронумерованные, с конкретными данными.
    - **Фактический результат** — только то, что видел, без догадок.
    - **Ожидаемый результат** — со ссылкой на источник: требования,
      макет или честно «по здравому смыслу».
    - **Серьёзность** и **приоритет** — две разные оценки.
    - **Вложения** — скриншоты, видео, логи.

    Главная проверка: может ли разработчик повторить баг сам, ничего не
    переспрашивая.

- id: bug-flaky-collect
  type: card
  question: Баг воспроизводится примерно в одном случае из десяти. Разработчик просит точные шаги. Что делаешь?
  answer: |
    Точных шагов пока нет, поэтому задача — найти условие, при котором
    баг появляется, а не повторять одно и то же.

    1. Включаю запись экрана на всё время и записываю точное время
       каждой попытки — чтобы данные первого же случая не пропали.
    2. Прошу у разработчиков способ найти мои действия в логах: по
       пользователю, времени или номеру запроса.
    3. Меняю по одному фактору за серию попыток: сеть, уход в фон,
       второе устройство, версия приложения — и записываю частоту.
    4. Смотрю жалобы пользователей: нет ли общего устройства, версии,
       времени.
    5. Завожу баг сразу, честно указываю частоту («1 из 10») и
       дополняю его по мере находок. Гипотезы помечаю как гипотезы.

- id: bug-prod-first-hour
  type: quiz
  question: Пользователи пишут в поддержку, что после вчерашнего обновления в приложении не работает важная функция. Что тестировщику важнее всего сделать в первый час?
  options:
    - "Найти, кто из команды пропустил баг, чтобы такого больше не было"
    - "Воспроизвести, понять масштаб и обходной путь, завести баг и эскалировать"
    - "Дождаться понедельника и обсудить на планировании"
    - "Ответить поддержке, что у тебя на стенде всё работает"
  correct: 1
  explanation: |
    В первый час нужны ответы на три вопроса: воспроизводится ли, кого
    задевает и есть ли обход. С ними баг заводят с пометкой «прод» и
    сразу поднимают дежурному разработчику и тимлиду, а поддержке дают
    короткий текст для клиентов.

    Разбор, почему баг пропустили, — нужен, но позже и без поиска
    виноватых. А «на стенде работает» — не ответ: на проде другие данные,
    устройства и настройки.

- id: bug-third-party
  type: quiz
  question: При оплате зависает страница банка (3-D Secure), и покупатель не возвращается в приложение. Разработчик говорит «это баг платёжного сервиса» и предлагает закрыть баг. Как правильно?
  options:
    - "Закрыть: чинить должен партнёр, это не наша зона"
    - "Написать в поддержку партнёра самому, в обход команды"
    - "Разделить: проблему партнёра передать через ответственного за интеграцию, а у себя завести баг на то, что видит покупатель"
    - "Поставить Blocker, чтобы разработчик передумал"
  correct: 2
  explanation: |
    Покупателю всё равно, где причина: для него не работает оплата в
    магазине. Обычно в такой ситуации две части.

    Часть партнёра передают через того, кто ведёт интеграцию, — с
    идентификаторами платежей, временем, банком и версией ОС. А в своей
    зоне остаётся то, что можно исправить у себя: таймаут, понятная
    ошибка, кнопка возврата, проверка, что деньги не списались без
    заказа. Баги связывают, чтобы после исправления у партнёра сделать
    ретест.

- id: bug-not-duplicate
  type: card
  question: Твой баг закрыли как дубликат старого, но тебе кажется, что это другой баг. Как это проверить и как аргументировать?
  answer: |
    Дубликат — это не «похожие симптомы», а одна и та же причина:
    исправление одного закроет и другой.

    1. Перечитываю старый баг целиком: шаги, окружение, комментарии о
       причине.
    2. Пробую воспроизвести свой баг в условиях, где старый не
       проявляется (или наоборот).
    3. Пишу в комментарии один конкретный довод: чем отличаются место,
       условия и результат, со скриншотами. Предлагаю переоткрыть и
       связать как «связан с».

    Если команда всё равно считает причину общей — соглашаюсь, но прошу
    при ретесте старого бага проверить и мой сценарий. Заново тот же баг
    под другим заголовком не завожу.

- id: bug-many-small
  type: card
  question: За два дня до релиза ты нашёл 40 мелких расхождений с макетами. Как их оформить и подать, чтобы команда смогла принять решение?
  answer: |
    1. Сначала вытаскиваю отдельными тикетами то, что мешает действию:
       кнопку закрывает клавиатура, обрезается сумма, текст не читается.
       Это уже не косметика.
    2. Остальное группирую по причине, а не по экрану: один неправильный
       отступ на 12 экранах — скорее всего, один общий компонент и один
       тикет со списком экранов и скриншотами.
    3. Показываю список дизайнеру: часть расхождений может оказаться
       устаревшим макетом.
    4. Приношу PO короткую сводку в три группы: мешает пользоваться (до
       релиза), заметно (в ближайший патч), косметика (когда будет время).

    Не делаю ни 40 разрозненных тикетов, ни один тикет «дизайн не
    соответствует макетам» — его нельзя ни оценить, ни закрыть.

- id: bug-retest-new-issue
  type: quiz
  question: На ретесте исходный баг исправлен, но ты замечаешь рядом новое неверное поведение. Что правильнее?
  options:
    - "Закрыть исходный баг и завести новый, связав его с исходным"
    - "Переоткрыть исходный баг и дописать новое поведение в комментарий"
    - "Ничего не заводить: это вопрос регресса, а не ретеста"
    - "Вернуть исходный баг разработчику без комментариев"
  correct: 0
  explanation: |
    Переоткрывают баг, когда не исправлен он сам: шаги из репорта
    по-прежнему дают тот же неверный результат. Если исходное поведение
    исправлено, баг закрывают — иначе в трекере будет висеть
    «не исправлено» то, что исправлено.

    Новое поведение — новый баг со своими шагами и ожидаемым результатом.
    Его связывают с исходным («появился после исправления BUG-…») и
    проверяют, не было ли этой проблемы и раньше: тогда это старый баг, а
    не регрессия от исправления.
