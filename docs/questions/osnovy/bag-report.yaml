- id: bug-severity-vs-priority
  type: card
  question: Чем серьёзность (severity) отличается от приоритета (priority)?
  answer: |
    Это две независимые оценки, а не два названия одного и того же.

    **Серьёзность** — насколько сильно сломано технически: рушит ли баг
    главный сценарий, теряются ли данные, падает ли программа — или это
    мелочь с лёгким обходом. Обычно её ставит тестировщик: он видит баг
    своими глазами.

    **Приоритет** — насколько срочно чинить: сколько пользователей задето,
    насколько баг заметен, нет ли рядом релиза или показа клиенту. Решающее
    слово обычно за владельцем продукта.

    Поэтому бывают все четыре сочетания. Например, тяжёлый сбой в редком
    сценарии — высокая серьёзность, низкий приоритет. А опечатка на главной
    перед показом клиенту — низкая серьёзность, высокий приоритет. Это не
    противоречие: оценки измеряют разное.

- id: bug-prod-vs-deadline
  type: card
  question: Одновременно нашёлся критичный баг на проде и есть срочная задача с дедлайном сегодня. Как расставишь приоритеты?
  answer: |
    Критичный баг на проде почти всегда означает высокую серьёзность:
    он задевает настоящих пользователей прямо сейчас. Такой баг не кладут
    в общую очередь — о нём сразу сообщают лиду или владельцу продукта,
    с честной оценкой серьёзности и фактами: кого и как задевает.

    Но что делать первым — чинить прод или доделывать задачу с дедлайном —
    решает не тестировщик в одиночку. Это решение с бизнес-картиной, которую
    целиком видит лид или владелец продукта.

    Задача тестировщика — не разрываться молча и не решать самому, а сразу
    сделать риск видимым и получить явное решение от того, у кого есть
    на это полномочия.

- id: bug-typo-first
  type: card
  question: Тимлид просит отдать в работу мелкую опечатку раньше, чем найденный тобой технически более серьёзный баг. Тимлид неправ?
  answer: |
    Не обязательно. «Что серьёзнее» и «что чинить первым» — разные вопросы.

    Опечатка остаётся мелочью по серьёзности, даже если её видят все. Но
    на первом экране или перед показом клиенту у неё высокая заметность и
    цена для репутации. А приоритет как раз зависит от таких вещей.

    Правильная реакция — не спорить, чья оценка важнее, а убедиться, что
    на серьёзный баг тоже есть полноценный баг-репорт с честной
    серьёзностью и что его видит тот, кто расставляет приоритеты.

- id: bug-po-defers
  type: card
  question: Ты считаешь, что баг нужно чинить первым, а владелец продукта его откладывает. Что делаешь?
  answer: |
    Решение о приоритете — за владельцем продукта. У него есть картина,
    которой у тестировщика обычно нет целиком: сроки, другие задачи,
    обещания клиентам.

    Задача тестировщика — чтобы решение принималось на точных фактах:
    ясная серьёзность, конкретно кого и как задевает баг, и своё мнение
    о приоритете с доводами — высказанное один раз и явно, а не молчаливое
    несогласие.

    Если после этого баг всё равно откладывают — это решение нужно уважать
    и не обходить, например договорившись с разработчиком починить
    «по-тихому». Цель — не победить в споре, а сделать решение осознанным.

- id: bug-classify-typo
  type: quiz
  question: На главной странице магазина опечатка в названии самого магазина. Завтра показ продукта инвесторам. Какая оценка подходит лучше всего?
  options:
    - "Серьёзность высокая, приоритет высокий"
    - "Серьёзность низкая, приоритет высокий"
    - "Серьёзность высокая, приоритет низкий"
    - "Серьёзность низкая, приоритет низкий"
  correct: 1
  explanation: |
    Технически это косметика: ничего не сломано, данные целы. Значит,
    серьёзность низкая.

    Но опечатку видит каждый, а завтра показ. Чинить её нужно срочно —
    приоритет высокий. Серьёзность и приоритет — независимые оценки.

- id: bug-classify-rare-crash
  type: quiz
  question: Выгрузка архива заказов за 2015 год падает с ошибкой сервера. Пользуются ею два человека раз в год. Какая оценка подходит лучше всего?
  options:
    - "Серьёзность низкая, приоритет низкий"
    - "Серьёзность низкая, приоритет высокий"
    - "Серьёзность высокая, приоритет высокий"
    - "Серьёзность высокая, приоритет низкий"
  correct: 3
  explanation: |
    Функция сломана целиком — серьёзность высокая. Занижать её из-за
    редкости нельзя: это техническая оценка.

    А вот срочность низкая: сценарием почти не пользуются. Такой баг можно
    осознанно отложить — но в баг-репорте серьёзность должна остаться
    честной.

- id: bug-not-in-report
  type: quiz
  question: Что НЕ нужно писать в баг-репорте?
  options:
    - "Догадку о причине в поле «Фактический результат»"
    - "Окружение: сборку, браузер, операционную систему"
    - "Ожидаемый результат со ссылкой на источник"
    - "Шаги с конкретными данными"
  correct: 0
  explanation: |
    Фактический результат — только то, что ты видел: код ответа, текст
    сообщения, число на экране. Догадка о причине может оказаться неверной
    и бросить тень на весь баг-репорт. Искать причину — работа того, кто
    будет чинить.

    Окружение, шаги с данными и ожидаемый результат с источником — как раз
    обязательная часть хорошего баг-репорта.

- id: bug-good-title
  type: quiz
  question: Какой заголовок баг-репорта лучше?
  options:
    - "Корзина сломана!!!"
    - "Разработчик забыл пересчёт суммы"
    - "Корзина: промокод не уменьшает сумму к оплате, если в корзине больше 10 товаров"
    - "Баг с промокодом"
  correct: 2
  explanation: |
    Хороший заголовок отвечает на три вопроса: где (корзина), что (сумма
    не уменьшается) и когда (больше 10 товаров). По нему понятно, о чём
    баг, даже без чтения шагов.

    Остальные варианты либо слишком общие, либо содержат эмоции или
    догадку о причине вместо факта.

- id: bug-after-fixed
  type: quiz
  question: Разработчик перевёл баг в статус «Исправлен» (Fixed). Что дальше?
  options:
    - "Баг сразу закрывается — разработчик же исправил"
    - "Тестировщик делает ретест на новой сборке и только потом закрывает или переоткрывает баг"
    - "Баг уходит владельцу продукта на оценку приоритета"
    - "Тестировщик заводит новый баг-репорт на то же самое"
  correct: 1
  explanation: |
    «Исправлен» — это мнение разработчика, а не факт. Тестировщик повторяет
    шаги из баг-репорта на сборке с исправлением. Прошло — баг закрывают.
    Повторился — баг переоткрывают и возвращают разработчику.

    Заодно стоит подумать о регрессе: исправление могло задеть соседние
    функции.

- id: bug-duplicate
  type: quiz
  question: Ты нашёл баг, а в трекере уже есть баг-репорт на ту же проблему. Что делать?
  options:
    - "Завести свой баг-репорт — чем больше репортов, тем быстрее починят"
    - "Ничего не делать: баг уже заведён"
    - "Удалить чужой репорт и завести свой, более подробный"
    - "Не заводить новый, а дописать в существующий то, чего там не хватает"
  correct: 3
  explanation: |
    Два баг-репорта на одну проблему только путают команду: их обсуждают
    по отдельности, а потом один всё равно закрывают как дубликат.

    Но и молчать не стоит: если у тебя есть новые сведения — другое
    окружение, более короткие шаги, скриншот, — допиши их в существующий
    баг-репорт.
