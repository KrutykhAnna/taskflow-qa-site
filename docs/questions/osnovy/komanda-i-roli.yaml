# Формат файла вопросов темы (имя файла = id темы из lib/topics.ts).
# Файл — список вопросов. Поле id уникально во всём банке вопросов.
#
# Открытый вопрос (card):
#   - id: уникальный-id
#     type: card
#     question: текст вопроса
#     answer: |       # ответ в простом markdown
#
# Тест (quiz):
#   - id: уникальный-id
#     type: quiz
#     question: текст вопроса
#     options: [минимум 2 варианта]
#     correct: 0      # индекс верного варианта, отсчёт с НУЛЯ
#     explanation: |  # разбор в простом markdown
#
# В answer и explanation только простой markdown: без контейнеров (::: tip)
# и без ссылок на страницы сайта — они не поддерживаются, а ссылку на тему
# тренажёр показывает сам.

- id: team-typical-team
  type: card
  question: Как устроена типичная команда и с кем взаимодействует тестировщик?
  answer: |
    Состав отличается от компании к компании. Чаще всего рядом с
    тестировщиком работают: владелец продукта (PO/PM), аналитик (если
    он есть), дизайнер, разработчики (frontend и backend), тимлид и
    DevOps.

    - **Разработчики** — самое частое общение: им адресован почти
      каждый найденный баг.
    - **Владелец продукта** — к нему идут с вопросом «как должно быть
      на самом деле», если это нигде не описано. Он же решает, какие
      баги исправлять в первую очередь.
    - **Аналитик** — источник подробных требований.
    - **Дизайнер** — источник макетов: с ним сверяются, когда неясно,
      отклонение это от макета или так задумано.
    - **DevOps** — к нему идут, если стенд для тестирования недоступен
      или ведёт себя странно не из-за самого продукта.

- id: team-product-vs-outsourcing
  type: card
  question: Чем отличается работа тестировщика в продуктовой команде и на аутсорсе?
  answer: |
    Ни один формат не «лучше» — различаются условия. Главное отличие в
    двух вещах: сколько у тебя информации о том, зачем нужна фича, и к
    кому идти с вопросом.

    - **Продуктовая команда** работает над своим продуктом долго. У
      тестировщика больше контекста, он видит последствия своих находок,
      а до автора требования обычно можно дойти напрямую.
    - **Аутсорс** — работа на клиента по договору. Требования часто
      приходят готовыми, без объяснения «почему». Вопросы идут через
      менеджера или согласованный канал, и ответ может занять дни.
      Бывает несколько проектов одновременно.

    На аутсорсе особенно важно задавать вопросы письменно и сохранять
    ответы.

- id: team-who-mockup
  type: quiz
  question: Ты проверяешь новую форму и не понимаешь, как должно выглядеть сообщение об ошибке. Где искать ожидаемый вид?
  options:
    - "Спросить у DevOps, он выкатывал сборку"
    - "В макете дизайнера"
    - "Решить самому, как будет красивее"
    - "Посмотреть, как сделано в коде"
  correct: 1
  explanation: |
    Макет дизайнера — источник ожидаемого вида интерфейса: как должны
    выглядеть кнопки, формы, сообщения.

    Код показывает, как сделано, а не как должно быть. Своё мнение —
    тоже не источник. Если макета нет или он противоречит требованиям,
    стоит спросить у дизайнера или владельца продукта.

- id: team-stand-down
  type: quiz
  question: С утра тестовый стенд не открывается, хотя вчера всё работало. К кому идти в первую очередь?
  options:
    - "К владельцу продукта"
    - "К дизайнеру"
    - "К DevOps-инженеру"
    - "Никуда, подождать до вечера"
  correct: 2
  explanation: |
    За стенды и выкатку сборок отвечает DevOps. Если стенд недоступен
    по причинам, не связанным с самим продуктом, — это к нему.

    Молча ждать — плохой вариант: ты теряешь время, а команда не знает,
    что тестирование стоит.

- id: team-requirement-vs-mockup
  type: quiz
  question: В требовании написано, что над комментарием показывается имя автора, а на макете его нет. К кому идти в первую очередь?
  options:
    - "К frontend-разработчику: пусть сделает, как ему удобнее"
    - "К DevOps-инженеру"
    - "Ни к кому: проверить по макету, он нагляднее"
    - "К владельцу продукта или аналитику — тому, кто отвечает за требования"
  correct: 3
  explanation: |
    Противоречие между требованием и макетом — вопрос «как должно
    быть». Решает его тот, кто отвечает за требования: аналитик или
    владелец продукта. Дизайнера стоит подключить, если в итоге нужно
    поправить макет.

    Разработчик не решает, каким должен быть продукт, а выбрать
    вариант самому — значит потом спорить, баг это или нет.

- id: team-outsourcing-unclear
  type: quiz
  question: Ты на аутсорс-проекте, и в требовании непонятно, как должна работать фича. Что лучше сделать?
  options:
    - "Задать вопрос через согласованный канал и сохранить ответ письменно"
    - "Протестировать так, как кажется логичным, и не тратить время на вопросы"
    - "Написать напрямую разработчику клиента в личные сообщения"
    - "Остановить тестирование, пока не пришлют полную спецификацию"
  correct: 0
  explanation: |
    На аутсорсе вопросы обычно идут через менеджера или определённый
    канал. Ответ стоит сохранить письменно: устная договорённость через
    посредника легко искажается, и к ней не вернёшься при споре.

    Тестировать по догадке — значит потом спорить, баг это или нет.
    А полностью останавливать работу обычно не нужно: можно проверять
    то, что понятно, пока ждёшь ответа.

- id: team-no-analyst
  type: card
  question: Как меняется работа тестировщика в команде без аналитика?
  answer: |
    Требования становятся короче — часто это пара предложений от
    владельца продукта. Но проверок меньше не становится.

    Тестировщику приходится самому продумывать то, что не написано:
    пустые значения, повторные действия, границы, слишком длинный
    текст. Многие вопросы всплывают уже во время тестирования.

    Главное — не додумывать молча. Неясные места нужно уточнить у
    владельца продукта, а ответ записать, например, в комментарии к
    задаче. Так появляется источник, на который можно опереться.

- id: team-escalation-when
  type: quiz
  question: Ты третий день ждёшь от аналитика ответа на вопрос, без которого нельзя проверить фичу. Релиз через два дня. Что разумнее сделать?
  options:
    - "Ждать дальше: аналитик занят, рано или поздно ответит"
    - "Написать тимлиду, что аналитик не отвечает и срывает сроки"
    - "Напомнить аналитику, предупредить, что вынесешь вопрос выше, и, если ответа нет, эскалировать сам вопрос с вариантами"
    - "Протестировать так, как кажется правильным, и не поднимать тему"
  correct: 2
  explanation: |
    Это нормальный повод для эскалации: вопрос блокирует работу, срок
    близко, а прямой путь не сработал.

    Но эскалировать нужно правильно: сначала ещё раз напрямую, с
    предупреждением, потом — вопрос, а не человека. «Нужно решение: X
    или Y, без него не проверить возвраты» звучит иначе, чем «аналитик
    не отвечает». Молча ждать или угадывать — значит сорвать релиз или
    проверить не то.

- id: team-escalation-how
  type: card
  question: Что такое эскалация и как эскалировать, не испортив отношения с коллегой?
  answer: |
    Эскалация — передача вопроса тому, у кого больше полномочий его
    решить. Это рабочий инструмент, а не жалоба.

    Как делать правильно:

    1. Сначала попробовать решить напрямую с человеком.
    2. Предупредить его: «Если не решим до вечера, вынесу на тимлида».
    3. Эскалировать вопрос, а не человека: «Нужно решение: X или Y».
    4. Писать в открытом канале или в задаче: коротко, с фактами и
       вариантами.

    Повод для эскалации — блокер без ответа, спор по кругу или
    серьёзный риск вне твоих полномочий.

- id: team-dev-closes-bugs
  type: card
  question: Разработчик раз за разом закрывает твои баги как «не воспроизводится», хотя они воспроизводятся. Что будешь делать?
  answer: |
    Это уже не про отдельные баги, а про то, как мы работаем вместе.

    1. Перечитаю свои баг-репорты: достаточно ли там окружения, данных,
       шагов. Возможно, часть проблемы на моей стороне.
    2. Поговорю с разработчиком лично и спокойно, предложу разобрать
       один баг вместе. Обычно быстро находится разница: стенд, данные,
       роль пользователя.
    3. Предложу правило: если баг не воспроизвёлся, разработчик пишет,
       где и как пробовал, а не просто меняет статус.
    4. Если не помогло — подниму вопрос на тимлида как вопрос процесса.

    Не буду молча переоткрывать баги и обсуждать конфликт в общем чате.

- id: team-client-direct-message
  type: quiz
  question: "Ты на аутсорсе. Представитель клиента пишет тебе в личку: «Срочно проверьте новую акцию, запуск завтра». По договору запросы идут через менеджера проекта. Что сделаешь?"
  options:
    - "Вежливо отвечу, что передаю запрос менеджеру проекта, и сразу перешлю ему всё дословно"
    - "Молча сделаю — клиент важнее процессов"
    - "Не буду отвечать: общаться с клиентом должен менеджер"
    - "Отвечу, что это не моя работа"
  correct: 0
  explanation: |
    Игнорировать или отказывать — плохо для отношений с клиентом. Делать
    молча — тоже: работа не запланирована, менеджер о ней не знает, а
    договорённость в личке никто не увидит.

    Лучший ход — быстро и вежливо ответить, передать запрос менеджеру
    проекта и взять задачу в работу, когда её согласуют. Сроки от имени
    команды тестировщик не обещает.

- id: team-time-zones
  type: card
  question: Команда работает в разных часовых поясах, и каждый вопрос получает ответ на следующий день. Как ты выстроишь работу?
  answer: |
    - Задаю вопросы пакетом и с вариантами ответов, чтобы на них можно
      было ответить сразу, без уточнений. Отмечаю, какой вопрос
      блокирует, а какой нет.
    - Пока жду ответа, проверяю то, что от него не зависит.
    - Пишу баг-репорты так, чтобы разработчик мог начать исправление
      без единого вопроса: окружение, данные, шаги, логи.
    - Использую общие рабочие часы для коротких созвонов по блокерам.
    - Подстраиваю свой день: с кем пересекаюсь утром, с тем решаю
      утром.
    - Предлагаю команде договориться о сроке ответа на блокирующие
      вопросы.

- id: team-onboarding
  type: card
  question: Ты пришёл на большой старый проект, документация устарела, передачи дел не было. С чего начнёшь?
  answer: |
    - **Карта людей:** кто владелец продукта, кто знает какие части
      системы, кто отвечает за стенды.
    - **Основные сценарии руками** на стенде, с записью вопросов.
    - **История багов** за последние месяцы: что ломалось чаще и
      что было критичным — это будущая карта рисков.
    - **Короткие встречи** с ключевыми людьми с вопросами: что самое
      хрупкое, что проверить, если на релиз два часа.
    - **Свои записи:** глоссарий, схема сервисов, список стендов и
      доступов.
    - **Первая небольшая задача** уже на первой неделе, в паре с
      разработчиком.

    И не молчать: вопросы новичка в первые недели — норма.
