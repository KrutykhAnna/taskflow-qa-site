# Формат файла вопросов темы (имя файла = id темы из lib/topics.ts).
# Файл — список вопросов. Поле id уникально во всём банке вопросов.
#
# Открытый вопрос (card):
#   - id: уникальный-id
#     type: card
#     question: текст вопроса
#     answer: |       # ответ в простом markdown
#
# Тест (quiz):
#   - id: уникальный-id
#     type: quiz
#     question: текст вопроса
#     options: [минимум 2 варианта]
#     correct: 0      # индекс верного варианта, отсчёт с НУЛЯ
#     explanation: |  # разбор в простом markdown
#
# В answer и explanation только простой markdown: без контейнеров (::: tip)
# и без ссылок на страницы сайта — они не поддерживаются, а ссылку на тему
# тренажёр показывает сам.

- id: cycle-sdlc-vs-stlc
  type: card
  question: Что такое SDLC и чем он отличается от STLC?
  answer: |
    **SDLC** (Software Development Life Cycle) — жизненный цикл разработки
    всего продукта: требования, проектирование, разработка, тестирование,
    релиз, сопровождение. В нём участвует вся команда. Модель разработки
    определяет, в каком порядке и как часто проходят эти этапы: в каскаде —
    один раз по порядку, в Scrum — в каждом спринте.

    **STLC** (Software Testing Life Cycle) — жизненный цикл тестирования:
    этапы работы тестировщика внутри SDLC. Анализ требований, планирование,
    проектирование тестов, подготовка окружения, выполнение тестов,
    завершение.

    Это не два названия одного и того же, а разные масштабы: SDLC — как
    делается продукт, STLC — как внутри этого устроена проверка качества.
    И STLC начинается не на этапе «Тестирование», а ещё на этапе
    требований.

- id: cycle-feature-walkthrough
  type: card
  question: Опишите жизненный цикл тестирования одной фичи от начала до конца.
  answer: |
    1. **Анализ требований.** Читаю требования, выписываю неясные места,
       задаю вопросы аналитику или владельцу продукта, записываю ответы.
    2. **Планирование.** Решаю, что проверяю, а что нет, оцениваю время,
       думаю о рисках. На выходе — тест-план или короткий план в задаче.
    3. **Проектирование тестов.** Придумываю проверки — обычные сценарии,
       ошибки пользователя, крайние случаи. На выходе — чек-лист или
       тест-кейсы и тестовые данные.
    4. **Подготовка окружения.** Проверяю, что на стенде нужная сборка,
       есть тестовые данные и доступы.
    5. **Выполнение.** Прохожу проверки, завожу баг-репорты, после
       исправлений перепроверяю сам баг и то, что рядом с ним.
    6. **Завершение.** Пишу итоговый отчёт: что проверено, что нет, какие
       баги остались и чем они грозят. По нему команда решает о релизе.

    Важно показать, что каждый этап опирается на предыдущий: без ясных
    требований не из чего строить план, без плана проверки придумываются
    наугад.

- id: cycle-stlc-inside-sdlc
  type: quiz
  question: Как связаны SDLC и STLC?
  options:
    - "Это одно и то же, просто разные названия"
    - "STLC заменяет SDLC в Agile-командах"
    - "STLC вложен в SDLC: это этапы работы тестировщика внутри жизненного цикла продукта"
    - "SDLC — это этапы тестирования, а STLC — этапы разработки"
  correct: 2
  explanation: |
    SDLC описывает путь всего продукта, и в нём участвует вся команда.
    STLC — путь работы тестировщика внутри этого большого пути.

    Он не заменяет SDLC ни в одной модели разработки — просто в каскаде
    проходит один раз, а в Scrum повторяется в каждом спринте.

- id: cycle-stlc-order
  type: quiz
  question: Какой порядок этапов STLC верный?
  options:
    - "Выполнение тестов → анализ требований → планирование → завершение"
    - "Планирование → подготовка окружения → анализ требований → проектирование тестов"
    - "Проектирование тестов → анализ требований → выполнение тестов → планирование"
    - "Анализ требований → планирование → проектирование тестов → подготовка окружения → выполнение → завершение"
  correct: 3
  explanation: |
    Сначала нужно понять, что проверять (анализ требований), потом решить,
    что входит в проверку и сколько на неё нужно времени (планирование).
    Дальше — придумать проверки, подготовить стенд и данные, пройти
    проверки и подвести итоги.

    В жизни этапы могут частично идти параллельно, но порядок «сначала
    понять, потом проверять» сохраняется.

- id: cycle-when-start
  type: quiz
  question: Когда тестировщик может начать работу над новой фичей?
  options:
    - "Только когда разработчик передал готовую сборку"
    - "Как только появились требования — даже черновик"
    - "После релиза, когда придут отзывы пользователей"
    - "Когда готов дизайн и написана половина кода"
  correct: 1
  explanation: |
    Первый этап STLC — анализ требований. Он начинается, как только есть
    хотя бы черновик требований: кода ещё нет, а вопросы уже можно
    задавать.

    Четыре этапа STLC из шести идут до того, как появится готовая сборка.
    Это и называют ранним стартом тестирования (shift-left).

- id: cycle-entry-criteria
  type: quiz
  question: Что из этого — критерий входа для этапа «Выполнение тестов»?
  options:
    - "Новая сборка установлена на стенд, и стенд открывается"
    - "Все запланированные проверки пройдены"
    - "Итоговый отчёт отправлен команде"
    - "Критичных открытых багов нет"
  correct: 0
  explanation: |
    Критерий входа — условие, без которого начинать этап бессмысленно.
    Без сборки на работающем стенде проверять нечего.

    «Все проверки пройдены» и «нет критичных открытых багов» — это
    критерии выхода из выполнения тестов. А отправленный отчёт — критерий
    выхода из этапа завершения.

- id: cycle-exit-criteria
  type: quiz
  question: Зачем заранее договариваться о критериях выхода из тестирования?
  options:
    - "Чтобы тестировщик мог работать без перерывов"
    - "Чтобы разработчики не заводили баги"
    - "Чтобы «закончено» означало выполненное условие, а не «кончилось время», и было видно, что осталось непроверенным"
    - "Чтобы не писать итоговый отчёт"
  correct: 2
  explanation: |
    Критерий выхода — условие, по которому этап считается законченным.
    Например: все запланированные проверки пройдены, критичных открытых
    багов нет.

    Без него тестирование заканчивается, когда кончилось время, и никто
    не знает, что именно не проверено. С ним можно честно сказать:
    «Вот что готово, вот что осталось».

- id: cycle-defect-cost
  type: quiz
  question: Почему ошибку в требованиях выгоднее найти до того, как написан код?
  options:
    - "Потому что после релиза ошибки исправлять запрещено"
    - "Потому что разработчики не умеют исправлять код"
    - "Потому что в требованиях ошибок не бывает"
    - "Потому что сейчас её исправляют одной правкой в тексте, а позже — переделкой кода, новой сборкой и повторной проверкой"
  correct: 3
  explanation: |
    Чем позже найден дефект, тем дороже его исправить. В требованиях это
    одна правка в тексте. В коде — переписать код и всё, что построено
    поверх ошибки. У пользователей добавляются ещё обращения в поддержку
    и срочный выпуск исправления.

    Поэтому тестировщик подключается рано и ищет ошибки ещё в
    требованиях. Это называют ранним стартом тестирования (shift-left).
