- id: models-waterfall-vs-agile
  type: card
  question: Как процесс тестирования отличается в каскадной модели и в Agile?
  answer: |
    Главная разница — когда тестировщик подключается к работе и в каком
    виде до него доходит продукт.

    - **Каскадная модель:** этапы идут строго друг за другом —
      требования, дизайн, разработка, тестирование, релиз. Проверки
      начинаются поздно, когда весь продукт уже написан. Баг, найденный
      в конце, стоит дороже: поверх ошибки уже успели построить другие
      функции, и исправлять и перепроверять приходится целую цепочку.
    - **Agile:** продукт делают короткими циклами, и тестирование
      встроено в каждый цикл. Тестировщик подключается рано, часто ещё
      при обсуждении задачи, и может указать на неучтённый случай до
      того, как написан код.

    Важно: и в каскаде тестировщик может готовиться заранее — изучать
    требования, задавать вопросы, продумывать проверки.

- id: models-sdlc
  type: card
  question: Что такое SDLC и зачем тестировщику знать модель разработки?
  answer: |
    **SDLC** (Software Development Life Cycle) — жизненный цикл
    разработки программы: в каком порядке команда делает продукт от идеи
    до релиза. Конкретный порядок и называют моделью разработки:
    каскадная, V-модель, Scrum, Kanban.

    Тестировщику модель важна, потому что от неё зависит:

    - когда он подключается к работе — в конце или с самого начала;
    - получает ли он продукт целиком или небольшими частями;
    - сколько у него времени и информации на каждую задачу.

- id: models-waterfall-when
  type: quiz
  question: Проект идёт по каскадной модели. Когда начинаются проверки на готовом продукте?
  options:
    - "С первого дня, параллельно с требованиями"
    - "После того как вся разработка закончена"
    - "В конце каждой двухнедельной итерации"
    - "Только после релиза, по отзывам пользователей"
  correct: 1
  explanation: |
    В каскадной модели этапы идут строго друг за другом, и тестирование —
    отдельный поздний этап после разработки.

    Но готовиться к нему можно раньше: изучать требования, задавать
    вопросы, продумывать проверки. Двухнедельные итерации — это уже
    про Scrum.

- id: models-scrum-not-event
  type: quiz
  question: Что из этого НЕ относится к событиям Scrum?
  options:
    - "Планирование спринта"
    - "Ежедневная встреча (дейли)"
    - "Ретроспектива"
    - "Фаза тестирования всего продукта перед релизом"
  correct: 3
  explanation: |
    События Scrum — планирование спринта, дейли, обзор спринта и
    ретроспектива. Они повторяются в каждом спринте.

    Отдельная большая фаза «тестирование всего продукта» — признак
    каскадной модели. В Scrum задачи проверяют внутри спринта, как
    только они готовы.

- id: models-increment
  type: quiz
  question: Что в Scrum называют инкрементом?
  options:
    - "Список всего, что хотят сделать в продукте"
    - "Задачи, которые команда взяла в текущий спринт"
    - "Готовый и проверенный результат спринта, который можно показать"
    - "Встречу, на которой обсуждают, как улучшить работу команды"
  correct: 2
  explanation: |
    Инкремент — готовый результат спринта: новая часть продукта, которая
    работает и проверена.

    Список всего, что хотят сделать, — это бэклог продукта. Задачи
    текущего спринта — бэклог спринта. А встреча про улучшение работы —
    ретроспектива.

- id: models-kanban-wip
  type: quiz
  question: На Kanban-доске у колонки «Тестирование» WIP-лимит 3, и в ней уже три задачи. Разработчик закончил ещё одну. Что правильно сделать?
  options:
    - "Не переносить задачу, пока одна из трёх не уйдёт дальше, и помочь разгрузить колонку"
    - "Перенести задачу: лимит — это просто рекомендация"
    - "Сразу перенести задачу в «Готово», минуя проверку"
    - "Увеличить лимит до четырёх, чтобы задача поместилась"
  correct: 0
  explanation: |
    WIP-лимит ограничивает, сколько задач может одновременно быть в
    колонке. Полная колонка — сигнал: проверка стала узким местом, и
    команде стоит помочь её разгрузить. Правило Kanban: сначала закончи,
    потом начинай новое.

    Пропустить проверку или поднимать лимит каждый раз, когда он мешает, —
    значит спрятать проблему, а не решить её.

- id: models-v-model
  type: quiz
  question: Чем V-модель помогает тестировщику по сравнению с обычным каскадом?
  options:
    - "В ней нет этапа тестирования, всё проверяют разработчики"
    - "Релизы в ней выходят каждые две недели"
    - "У каждого этапа разработки есть парный этап проверки, и готовить проверки можно сразу после этого этапа"
    - "Требования в ней можно менять в любой момент"
  correct: 2
  explanation: |
    В V-модели каждому этапу разработки соответствует свой этап проверки:
    требованиям — приёмочное тестирование, архитектуре —
    интеграционное, дизайну модулей — модульное.

    Сами проверки идут после кода, но готовиться к ним можно рано.
    Например, продумывать приёмочные проверки, как только готовы
    требования, — и попутно находить в них ошибки, пока исправить их
    дёшево.
