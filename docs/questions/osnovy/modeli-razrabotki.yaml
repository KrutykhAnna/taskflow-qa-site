- id: models-waterfall-vs-agile
  type: card
  question: Как процесс тестирования отличается в каскадной модели и в Agile?
  answer: |
    Главная разница — когда тестировщик подключается к работе и в каком
    виде до него доходит продукт.

    - **Каскадная модель:** этапы идут строго друг за другом —
      требования, дизайн, разработка, тестирование, релиз. Проверки
      начинаются поздно, когда весь продукт уже написан. Баг, найденный
      в конце, стоит дороже: поверх ошибки уже успели построить другие
      функции, и исправлять и перепроверять приходится целую цепочку.
    - **Agile:** продукт делают короткими циклами, и тестирование
      встроено в каждый цикл. Тестировщик подключается рано, часто ещё
      при обсуждении задачи, и может указать на неучтённый случай до
      того, как написан код.

    Важно: и в каскаде тестировщик может готовиться заранее — изучать
    требования, задавать вопросы, продумывать проверки.

- id: models-sdlc
  type: card
  question: Что такое SDLC и зачем тестировщику знать модель разработки?
  answer: |
    **SDLC** (Software Development Life Cycle) — жизненный цикл
    разработки программы: в каком порядке команда делает продукт от идеи
    до релиза. Конкретный порядок и называют моделью разработки:
    каскадная, V-модель, Scrum, Kanban.

    Тестировщику модель важна, потому что от неё зависит:

    - когда он подключается к работе — в конце или с самого начала;
    - получает ли он продукт целиком или небольшими частями;
    - сколько у него времени и информации на каждую задачу.

- id: models-waterfall-when
  type: quiz
  question: Проект идёт по каскадной модели. Когда начинаются проверки на готовом продукте?
  options:
    - "С первого дня, параллельно с требованиями"
    - "После того как вся разработка закончена"
    - "В конце каждой двухнедельной итерации"
    - "Только после релиза, по отзывам пользователей"
  correct: 1
  explanation: |
    В каскадной модели этапы идут строго друг за другом, и тестирование —
    отдельный поздний этап после разработки.

    Но готовиться к нему можно раньше: изучать требования, задавать
    вопросы, продумывать проверки. Двухнедельные итерации — это уже
    про Scrum.

- id: models-scrum-not-event
  type: quiz
  question: Что из этого НЕ относится к событиям Scrum?
  options:
    - "Планирование спринта"
    - "Ежедневная встреча (дейли)"
    - "Ретроспектива"
    - "Фаза тестирования всего продукта перед релизом"
  correct: 3
  explanation: |
    События Scrum — планирование спринта, дейли, обзор спринта и
    ретроспектива. Они повторяются в каждом спринте.

    Отдельная большая фаза «тестирование всего продукта» — признак
    каскадной модели. В Scrum задачи проверяют внутри спринта, как
    только они готовы.

- id: models-increment
  type: quiz
  question: Что в Scrum называют инкрементом?
  options:
    - "Список всего, что хотят сделать в продукте"
    - "Задачи, которые команда взяла в текущий спринт"
    - "Готовый и проверенный результат спринта, который можно показать"
    - "Встречу, на которой обсуждают, как улучшить работу команды"
  correct: 2
  explanation: |
    Инкремент — готовый результат спринта: новая часть продукта, которая
    работает и проверена.

    Список всего, что хотят сделать, — это бэклог продукта. Задачи
    текущего спринта — бэклог спринта. А встреча про улучшение работы —
    ретроспектива.

- id: models-kanban-wip
  type: quiz
  question: На Kanban-доске у колонки «Тестирование» WIP-лимит 3, и в ней уже три задачи. Разработчик закончил ещё одну. Что правильно сделать?
  options:
    - "Не переносить задачу, пока одна из трёх не уйдёт дальше, и помочь разгрузить колонку"
    - "Перенести задачу: лимит — это просто рекомендация"
    - "Сразу перенести задачу в «Готово», минуя проверку"
    - "Увеличить лимит до четырёх, чтобы задача поместилась"
  correct: 0
  explanation: |
    WIP-лимит ограничивает, сколько задач может одновременно быть в
    колонке. Полная колонка — сигнал: проверка стала узким местом, и
    команде стоит помочь её разгрузить. Правило Kanban: сначала закончи,
    потом начинай новое.

    Пропустить проверку или поднимать лимит каждый раз, когда он мешает, —
    значит спрятать проблему, а не решить её.

- id: models-v-model
  type: quiz
  question: Чем V-модель помогает тестировщику по сравнению с обычным каскадом?
  options:
    - "В ней нет этапа тестирования, всё проверяют разработчики"
    - "Релизы в ней выходят каждые две недели"
    - "У каждого этапа разработки есть парный этап проверки, и готовить проверки можно сразу после этого этапа"
    - "Требования в ней можно менять в любой момент"
  correct: 2
  explanation: |
    В V-модели каждому этапу разработки соответствует свой этап проверки:
    требованиям — приёмочное тестирование, архитектуре —
    интеграционное, дизайну модулей — модульное.

    Сами проверки идут после кода, но готовиться к ним можно рано.
    Например, продумывать приёмочные проверки, как только готовы
    требования, — и попутно находить в них ошибки, пока исправить их
    дёшево.

- id: models-mini-waterfall
  type: card
  question: Команда работает по Scrum, но все задачи приходят на тестирование в последние два дня спринта. Что не так и что ты предложишь?
  answer: |
    Это мини-водопад внутри спринта: формально Scrum, а по сути
    каскад с тестированием в самом конце. В итоге задачи переносятся
    непроверенными, а баги находят уже после демо.

    Что предложу на ретро, опираясь на факты (когда задачи приходили,
    сколько перенесли):

    - нарезать задачи мельче, чтобы каждая была готова за 2–3 дня;
    - ввести WIP-лимит: не брать новую задачу, пока предыдущая не
      дошла до тестирования;
    - оставлять конец спринта на исправления и проверку.

    А пока процесс не поменялся — смотреть промежуточные результаты с
    начала спринта и честно говорить на планировании, сколько задач
    реально проверить.

- id: models-code-freeze
  type: quiz
  question: Что такое code freeze («заморозка кода») перед релизом?
  options:
    - "Запрет на любые изменения кода до конца года"
    - "Момент, после которого в релиз не добавляют новые функции — только исправления багов"
    - "Остановка всех серверов на время тестирования"
    - "Удаление старых веток из системы контроля версий"
  correct: 1
  explanation: |
    После заморозки в релизную сборку попадают только исправления
    найденных багов. Новые функции продолжают вливать в основную ветку,
    но они пойдут в следующий релиз.

    Тестировщику это даёт стабильную цель: пока идёт регресс, в сборку
    не приезжают новые задачи, которые могут сломать уже проверенное.

- id: models-hotfix-scope
  type: quiz
  question: На проде сломалась оплата, разработчик за 20 минут подготовил исправление и говорит «проверять нечего, одна строчка». Как поступить?
  options:
    - "Выкатить без проверки — каждая минута стоит денег"
    - "Потребовать полный регресс перед выкаткой"
    - "Отказаться выкатывать до следующего планового релиза"
    - "Быстро проверить сам сценарий и ближайшие к нему сценарии оплаты, назвав объём вслух, а остальное проверить после выкатки"
  correct: 3
  explanation: |
    Хотфикс — компромисс между скоростью и риском. Полный регресс
    занял бы часы, пока деньги теряются. Но «одна строчка» в оплате
    вполне может сломать соседние сценарии: сохранённые карты,
    повторную оплату, возвраты.

    Поэтому проверяют самое главное за 15–20 минут, вслух называя
    объём проверки. После выкатки — проверяют на проде основной сценарий
    и заводят задачу на то, что не успели.

- id: models-mobile-release-train
  type: card
  question: Почему релиз мобильного приложения тестировать и выпускать сложнее, чем релиз сайта?
  answer: |
    - **Ревью сторов.** Каждую версию проверяют App Store и Google Play
      — от нескольких часов до нескольких дней. Быстро выкатить
      исправление, как на сайте, нельзя.
    - **Пользователи обновляются не сразу.** Старая версия с багом
      может жить у части людей неделями.
    - **Две платформы и много устройств** — регресс нужно проводить
      на iOS и Android, на разных экранах и версиях системы.

    Поэтому в мобайле часто работают релизными поездами: заморозка
    кода, регресс, отправка в сторы по расписанию. А чтобы снизить
    риск, используют фазированный релиз — новую версию сначала получает
    небольшая доля пользователей — и фича-флаги, которыми можно
    выключить сломанное без новой версии.

- id: models-feature-flag
  type: quiz
  question: Новая функция выпущена в релиз, но спрятана за фича-флагом и пока выключена. Что тестировщику важно проверить?
  options:
    - "Что функция работает при включённом флаге и что при выключенном флаге продукт работает как раньше"
    - "Ничего — пока флаг выключен, функции для пользователей нет"
    - "Только работу функции при включённом флаге"
    - "Только то, что флаг можно переключить"
  correct: 0
  explanation: |
    Код фичи уже в продукте, даже если её не видно. Поэтому важны оба
    состояния: выключенный флаг не должен ничего ломать, а включённый —
    давать работающую функцию.

    Ещё стоит проверить переключение на ходу: что происходит с
    пользователем, который был в середине сценария, когда флаг
    включили или выключили.

- id: models-urgent-mid-sprint
  type: card
  question: Посреди спринта владелец продукта приносит срочную задачу, а у тебя и так не хватает времени. Что ответишь?
  answer: |
    Не откажу и не соглашусь молча — покажу цену решения:
    «Проверка новой задачи займёт примерно два дня. Если берём её, я
    не успею проверить задачу X. Какую можно сдвинуть?»

    Приоритеты определяет владелец продукта вместе с командой. Моя
    задача — чтобы новая задача не казалась «бесплатной» и чтобы
    непроверенное не ушло в релиз незаметно.

    Если срочные вбросы повторяются каждый спринт, подниму это на
    ретро: возможно, команде стоит заранее оставлять запас времени.
