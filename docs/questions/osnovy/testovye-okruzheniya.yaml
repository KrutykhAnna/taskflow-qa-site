# Вопросы темы «Тестовые окружения». Формат — см. bag-report.yaml.

- id: env-01
  type: card
  question: Какие окружения бывают и чем они отличаются?
  answer: |
    Обычно их четыре:

    - **Dev** — стенд разработчиков. Свежий, недописанный код, часто ломается.
    - **Test (QA)** — стенд тестировщиков. Сюда выкладывают то, что готово
      к проверке. Тестовые данные, можно ломать.
    - **Stage** — копия прода: те же настройки и настоящие внешние сервисы,
      данные похожи на настоящие. Последняя проверка перед выпуском.
    - **Prod** — то, чем пользуются настоящие люди. Настоящие данные,
      ломать нельзя.

    Отличаются они данными, стабильностью, доступом и настройками.
    На dev и test внешние сервисы вроде оплаты обычно заменены заглушками,
    на stage и prod — настоящие.

    Зачем столько: тестирование — это попытки сломать систему нарочно.
    Отдельные окружения убирают цену этих попыток для настоящих
    пользователей.

- id: env-02
  type: card
  question: Почему «у меня работает» ещё не значит «работает на проде»?
  answer: |
    Программа одна и та же, но вокруг неё на разных окружениях разное:

    - **данные** — на стенде пять задач, на проде пять тысяч;
    - **настройки** — например, на стенде письма не отправляются;
    - **нагрузка** — на стенде работаешь один, на проде тысячи людей;
    - **внешние сервисы** — на стенде заглушки, на проде настоящие;
    - **версия** — на разных стендах может стоять разная сборка.

    Поэтому в баг-репорте окружение — обязательное поле: стенд, версия
    сборки, браузер или устройство.

    Если баг есть на одном окружении и нет на другом, это не повод
    считать его случайным. Нужно сверить окружения по этим пунктам
    и найти разницу.

- id: env-03
  type: card
  question: Что такое CI/CD и где в нём место ручного тестировщика?
  answer: |
    CI/CD — автоматический конвейер (пайплайн), который сам собирает
    каждую правку, прогоняет автотесты и выкладывает на стенды.

    - **Continuous Integration** — каждую правку сразу собирают и проверяют
      автотестами.
    - **Continuous Delivery** — прошедшая проверки правка готова к выпуску,
      но решение «выпускаем на прод» принимает человек.
    - **Continuous Deployment** — то же без человека: прошло проверки —
      само уехало на прод.

    Ручной тестировщик обычно не пишет и не чинит автотесты. Его место —
    на test и stage: проверка нового, регресс, исследование того, что
    автотесты не ловят. В Continuous Delivery он часто и есть тот человек,
    чья проверка — основание сказать «выпускаем».

    А если пайплайн стоит и под угрозой сроки — тестировщик сообщает
    об этом рано, даже если чинить будет не он.

- id: env-04
  type: card
  question: Зачем тестировщику логи и что в них не должно попадать?
  answer: |
    Лог — журнал, в который программа записывает, что делает. Строка лога
    обычно содержит время, уровень (`INFO`, `WARNING`, `ERROR`) и
    сообщение.

    Тестировщику логи нужны, чтобы:

    - найти причину сбоя — например, ответа `500`, когда в самом ответе
      ничего полезного нет;
    - приложить нужные строки к баг-репорту как доказательство;
    - заметить ошибку, которая не видна снаружи.

    В логи нельзя записывать пароли (даже неверные), токены входа целиком
    и лишние личные данные. Логи читают многие люди и хранят долго.
    Если такое попало в лог — это баг безопасности.

- id: env-05
  type: quiz
  question: На каком окружении уместнее всего проверять граничные значения и неправильные данные?
  options:
    - "На проде — там настоящие условия"
    - "На стенде разработчиков, пока код ещё пишется"
    - "На тестовом стенде (test)"
    - "Только в автотестах, вручную это не проверяют"
  correct: 2
  explanation: |
    Тестовый стенд для этого и нужен: тестовые данные, никаких настоящих
    пользователей, всё можно сбросить.

    На проде такие проверки недопустимы — цена ошибки там настоящая.
    А dev слишком нестабилен: код ещё пишется, и непонятно, баг это
    или просто недоделка.

- id: env-06
  type: quiz
  question: Чем Continuous Delivery отличается от Continuous Deployment?
  options:
    - "В Delivery решение о выпуске на прод принимает человек, в Deployment правка уезжает на прод сама"
    - "Delivery — про сборку, Deployment — про автотесты"
    - "Ничем, это два названия одного и того же"
    - "В Deployment выпускают реже, чем в Delivery"
  correct: 0
  explanation: |
    В обоих случаях каждая правка автоматически собирается и проверяется.
    Разница в последнем шаге: есть ли перед продом человек, который
    говорит «да».

    В Delivery пайплайн останавливается на «готово к выпуску» и ждёт
    решения. В Deployment прошедшая проверки правка уходит на прод сама.
    Частота выпусков тут ни при чём — в обеих моделях она может быть
    высокой.

- id: env-07
  type: quiz
  question: Что из этого допустимо делать на проде?
  options:
    - "Создать сотню тестовых заказов, чтобы проверить нагрузку"
    - "Проверить поле ввода граничными значениями"
    - "Поменять данные настоящего пользователя и вернуть обратно"
    - "Сделать короткий смоук после выпуска под тестовой учётной записью"
  correct: 3
  explanation: |
    На проде допустимы только осторожные проверки, которые ничего
    не ломают. Смоук после выпуска — как раз такой: убедиться, что главное
    работает там, где сейчас настоящие пользователи.

    Массовое создание объектов, граничные значения и изменение чужих
    данных — для тестовых стендов. На проде у них настоящая цена.

- id: env-08
  type: quiz
  question: "В логе строка с кодом ответа 500. Какой уровень у неё скорее всего?"
  options:
    - "INFO"
    - "ERROR"
    - "WARNING"
    - "DEBUG"
  correct: 1
  explanation: |
    Код `500` значит, что сломался сам сервер: он не смог сделать то, что
    должен. Это сбой, а для сбоев есть уровень `ERROR`.

    `WARNING` обычно ставят, когда что-то пошло не так, но программа
    справилась, — например, неверный пароль. `INFO` — для штатных событий,
    `DEBUG` — для подробных записей разработчиков.

- id: env-09
  type: quiz
  question: Что лучше всего написать в поле «Окружение» баг-репорта?
  options:
    - "Stage, сборка 2.14.3, Chrome 129, Windows 11"
    - "Тестовый стенд"
    - "У меня на компьютере"
    - "Поле можно не заполнять, если баг серьёзный"
  correct: 0
  explanation: |
    По полю «Окружение» разработчик должен понять, где искать баг:
    какой стенд, какая версия сборки, какой браузер или устройство.

    «Тестовый стенд» и «у меня на компьютере» не отвечают ни на один
    из этих вопросов. А для серьёзного бага окружение тем более важно —
    его нужно повторить как можно быстрее.

- id: env-10
  type: quiz
  question: Пайплайн уже полдня падает на автотестах, новая сборка не доходит до стенда, а релиз завтра. Что правильно сделать тестировщику?
  options:
    - "Ждать: автотесты — не его зона ответственности"
    - "Самому найти ошибку в коде и исправить её"
    - "Сообщить команде, что пайплайн стоит и это угрожает срокам"
    - "Проверить старую сборку и считать задачу проверенной"
  correct: 2
  explanation: |
    Чинить автотесты и код — работа разработчиков или автоматизаторов.
    Но пайплайн, который стоит, блокирует и проверку, и релиз. Это риск,
    о котором команда должна узнать рано, пока ещё можно что-то решить.

    Молчаливое ожидание лишает команду этого времени. А проверка старой
    сборки ничего не говорит о новой правке.
