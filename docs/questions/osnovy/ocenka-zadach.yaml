# Вопросы темы «Оценка задач». Формат — см. bag-report.yaml.

- id: est-01
  type: card
  question: Из чего складывается оценка задачи по тестированию?
  answer: |
    Хорошая оценка — не одно число «на глаз», а сумма четырёх частей,
    каждую из которых продумывают отдельно.

    - **Тест-дизайн** — прочитать требования, придумать проверки, записать
      чек-лист или тест-кейсы.
    - **Выполнение** — пройти все проверки и записать результат.
    - **Оформление находок** — воспроизвести каждый баг, сузить шаги,
      написать баг-репорт.
    - **Ретест и регресс** — после исправлений проверить сам фикс и то,
      что рядом ничего не сломалось.

    Последнюю часть забывают чаще всего: в момент оценки исправлений ещё нет.

    На размер каждой части влияет риск области и ясность требований.
    Неясные требования увеличивают оценку не потому, что проверок больше,
    а потому что часть времени уйдёт на вопросы владельцу продукта.

- id: est-02
  type: card
  question: Почему оценку лучше давать вилкой, а не одним числом?
  answer: |
    Вилка — например, «от 3 до 5 часов» — честнее одного числа. Не потому,
    что она осторожнее, а потому что неопределённость — тоже часть правды
    о задаче. Заранее неизвестно, сколько найдётся багов и сколько будет
    кругов ретеста.

    Одно число создаёт иллюзию точности, которой нет. Это как отчёт
    «всё ок»: удобно, но прячет важное.

    При этом голая пара чисел тоже не годится. Рядом нужно короткое
    обоснование: из каких частей сложена вилка, какой риск у области и от
    чего зависит, окажется реальность ближе к нижней или к верхней границе.

- id: est-03
  type: card
  question: На второй день работы стало ясно, что оценка сильно разошлась с реальностью. Что делаешь?
  answer: |
    Само расхождение — не провал: оценка — это прогноз, а не клятва.
    Важно, как на него реагировать.

    Неправильно — молча доделывать в переработку. Это выглядит как забота
    о команде, но лишает её возможности вовремя поменять план.

    Правильно:

    1. Сказать рано — как только расхождение стало заметно.
    2. Объяснить причину: область рискованнее, требования менее ясные,
       багов больше, чем ожидалось.
    3. Дать новую оценку и предложить варианты: что можно отложить или
       сократить.

    Тогда команда успеет перенести менее важную задачу или помочь.

- id: est-04
  type: card
  question: Менеджер просит оценку одним числом — «так проще планировать». Как ответишь?
  answer: |
    Объяснять стоит не через «мне так спокойнее», а через то, что теряет
    сам менеджер. Одно число почти наверняка не совпадёт с реальностью,
    и при первом расхождении доверие к оценкам упадёт.

    Вилка честно говорит, что известно сейчас: нижняя граница — если всё
    пойдёт гладко, верхняя — если подтвердятся конкретные риски.

    А если для календаря нужна одна точка, разумно взять верхнюю границу.
    Тогда при удачном раскладе задача закроется раньше срока, а не позже.

- id: est-05
  type: quiz
  question: Какую часть оценки чаще всего забывают заложить?
  options:
    - "Выполнение проверок"
    - "Тест-дизайн"
    - "Ретест и регресс после исправлений"
    - "Чтение требований"
  correct: 2
  explanation: |
    В момент оценки исправлений ещё нет, поэтому о них просто не думают.
    Но почти в каждой новой функции находится хотя бы один баг, а значит,
    будет и ретест, и проверка, что рядом ничего не сломалось.

    Без этой части оценка почти всегда оказывается мала.

- id: est-06
  type: quiz
  question: "Тестировщик оценил части так: тест-дизайн 1–2 ч, выполнение 2–4 ч, оформление находок 1–2 ч, ретест и регресс 1–3 ч. Какая получается вилка?"
  options:
    - "От 5 до 11 часов"
    - "8 часов"
    - "От 1 до 4 часов"
    - "От 5 до 8 часов"
  correct: 0
  explanation: |
    Минимумы складываются в нижнюю границу: 1 + 2 + 1 + 1 = 5.
    Максимумы — в верхнюю: 2 + 4 + 2 + 3 = 11.

    Вилка — от 5 до 11 часов. Одно число «8 часов» спрятало бы
    неопределённость, а «от 1 до 4» — это разброс одной части, а не всей
    задачи.

- id: est-07
  type: quiz
  question: Требования к задаче описаны в две строки. Почему оценка в этом случае растёт?
  options:
    - "Проверок становится в два раза больше"
    - "Тестировщик перестраховывается на всякий случай"
    - "Разработчики в таких задачах чаще ошибаются"
    - "Часть времени уйдёт на уточнение неясных случаев у владельца продукта"
  correct: 3
  explanation: |
    Короткое описание не добавляет проверок. Но прежде чем проверять,
    нужно понять, как должно быть: задать вопросы владельцу продукта или
    аналитику и дождаться ответов.

    Это отдельная работа, и её стоит называть вслух: «Плюс час на
    уточнение требований».

- id: est-08
  type: quiz
  question: Ты оценил задачу в 4 часа. На второй день видно, что уйдёт около 10. Что правильно сделать?
  options:
    - "Молча доделать вечером, чтобы не подвести команду"
    - "Сразу сказать команде, объяснить причину и дать новую оценку"
    - "Сократить проверки, чтобы уложиться в 4 часа"
    - "Доделать и объяснить задержку уже в конце"
  correct: 1
  explanation: |
    Чем раньше команда узнает о расхождении, тем больше у неё вариантов:
    перенести менее важную задачу, помочь, сократить объём.

    Молчаливая переработка и объяснение в конце лишают команду этих
    вариантов. А тихо урезать проверки — значит выпустить непроверенное
    и никому об этом не сказать.

- id: est-09
  type: quiz
  question: Какая доработка при прочих равных потребует больше всего времени на проверку?
  options:
    - "Новый цвет кнопки в настройках профиля"
    - "Новая подсказка под полем поиска"
    - "Исправленная опечатка в подвале сайта"
    - "Новый способ оплаты, через который пройдёт каждый заказ"
  correct: 3
  explanation: |
    Размер оценки зависит от риска области. Оплата — центральная функция:
    через неё проходит каждый покупатель, а ошибка стоит денег. Здесь
    нужна глубокая проверка и внимательный регресс.

    Цвет кнопки, подсказка и опечатка — низкий риск. Их проверяют быстро.

- id: est-10
  type: quiz
  question: Для плана спринта нужна одна цифра, а у тебя вилка «от 6 до 10 часов». Какое число разумнее назвать?
  options:
    - "6 часов — так команда успеет взять больше задач"
    - "10 часов и сказать, от чего зависит, получится ли быстрее"
    - "8 часов, ничего не объясняя"
    - "Никакое — отказаться называть число"
  correct: 1
  explanation: |
    Верхняя граница — безопасная опора для плана. Если всё пройдёт гладко,
    задача закроется раньше срока. А если назвать нижнюю, любая сложность
    превратится в срыв.

    Короткое объяснение рядом сохраняет главное, что даёт вилка: команда
    понимает, от чего зависит срок.
