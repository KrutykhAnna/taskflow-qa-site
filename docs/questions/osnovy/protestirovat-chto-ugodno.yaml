# Вопросы темы «Как протестировать что угодно». Формат — см. bag-report.yaml.

- id: any-01
  type: card
  question: Протестируй карандаш.
  answer: |
    Не список проверок, а структура из шести шагов.

    1. **Вопросы:** какой карандаш и для кого — школьник, художник,
       чертёжник? Есть ли требования к твёрдости? Если ответа нет —
       допущение вслух: «обычный HB с ластиком для школьников».
    2. **Главный сценарий:** пишет ровной линией, ластик стирает.
    3. **По видам:** функционально (пишет, точится, стирает), негатив
       (сильный нажим, глянцевая бумага), границы (длина линии до заточки),
       надёжность (падение — не ломается ли грифель внутри), безопасность
       (нетоксичная краска, ластик не отваливается), удобство (не катится,
       удобен детской руке).
    4. **Топ-5 по риску:** главный сценарий, безопасность для детей,
       грифель после падения, заточка, ластик.
    5. **Что нужно:** разная бумага, стандартная точилка.
    6. **Итог:** что не проверяю (химию краски — по сертификату, срок
       хранения 10 лет) и когда заканчиваю.

- id: any-02
  type: quiz
  question: Тебя просят протестировать лифт. С чего лучше начать ответ?
  options:
    - "С проверки, что двери закрываются"
    - "Со списка всех видов тестирования, которые ты знаешь"
    - "С уточняющих вопросов: какое здание, пассажирский или грузовой, сколько этажей"
    - "С вопроса, сколько времени есть на ответ, и сразу перечислить 20 проверок"
  correct: 2
  explanation: |
    «Протестируй лифт» — требование в одну строку. Лифт в жилом доме,
    в больнице и на складе — разные продукты с разными рисками. Поэтому
    первые 30 секунд — вопросы, а если ответа нет — допущение вслух.

    Двери и виды тестирования будут, но позже. Начав с них, ты рискуешь
    тестировать не ту вещь, которую задумал интервьюер.

- id: any-03
  type: card
  question: Протестируй поле «Сумма перевода» в банковском приложении.
  answer: |
    **Вопросы:** кому перевод, какие лимиты (разовый, суточный), какая
    валюта, есть ли комиссия. Допущение: в рублях, от 1 до 150 000 ₽.

    **Главный сценарий:** списано и зачислено ровно столько, сколько ввели.

    **По видам:**

    - границы — 0,99 / 1 / 150 000 / 150 000,01 ₽, сумма ровно равна
      остатку и на копейку больше;
    - формат — запятая и точка, три знака после запятой, минус, буквы,
      пустое поле;
    - ввод — вставка из буфера «1,500.00», цифровая клавиатура;
    - лимиты — суточный по сумме нескольких переводов;
    - двойные действия — двойное нажатие, повтор после потери сети;
    - удобство, безопасность, доступность.

    **Топ-5:** нет двойного перевода; сумма списания совпадает с введённой;
    границы лимита; сумма больше остатка; вставка с разделителями.

    **Не проверяю:** антифрод и нагрузку — у них свои команды.

- id: any-04
  type: quiz
  question: |
    Кандидат тестирует кофемашину с оплатой картой. Он перечислил все
    6 напитков, все объёмы и все добавки. Что главное он упустил?
  options:
    - "Проверить напитки ещё раз в другом порядке"
    - "Негатив и деньги: кончилась вода после оплаты, двойное списание, отмена"
    - "Цвет корпуса и шрифт на экране"
    - "Ничего — все напитки проверены, этого достаточно"
  correct: 1
  explanation: |
    Перечисление всего меню — это только позитивные функциональные
    проверки. Главный риск автомата с оплатой — «деньги списаны, напитка
    нет»: кончилась вода или зёрна после оплаты, сбой связи с банком,
    двойное прикладывание карты, отмена.

    Сюда же — безопасность: горячие части и кипяток. Без негатива и
    нефункционального ответ остаётся ответом джуна, сколько бы напитков
    в нём ни было.

- id: any-05
  type: card
  question: Чем ответ мидла на «протестируй что-нибудь» отличается от ответа джуна?
  answer: |
    Проверки у джуна часто правильные. Разница — в том, что вокруг них.

    - **Начало.** Джун сразу перечисляет проверки. Мидл задаёт вопросы
      и называет допущение.
    - **Структура.** У джуна поток идей. У мидла — главный сценарий,
      проход по видам тестирования, топ-5, итог.
    - **Нефункциональное.** У джуна случайно. У мидла — целенаправленно,
      особенно безопасность.
    - **Приоритет.** У джуна все проверки звучат одинаково важными. Мидл
      называет топ-5 по риску и объясняет почему.
    - **Рамки.** Мидл говорит, что нужно для проверки, что он **не** будет
      проверять и почему, и когда закончит.

- id: any-06
  type: quiz
  question: У тебя 10 минут на банкомат. Что проверишь первым?
  options:
    - "Перевод меню на английский язык"
    - "Скорость печати чека"
    - "Яркость экрана на солнце"
    - "Выдачу наличных: выдано ровно столько, сколько списано со счёта"
  correct: 3
  explanation: |
    Риск — это вероятность плюс влияние. Выдача наличных — главный сценарий
    банкомата, и ошибка в нём — прямая потеря денег клиента или банка.
    Поэтому она первая.

    Локализация, чек и экран тоже нужно проверить, но если времени
    10 минут, они ниже в списке: их сбой неприятен, но не стоит денег.

- id: any-07
  type: card
  question: Протестируй форму входа по email и паролю.
  answer: |
    **Вопросы:** что за продукт — магазин или банк; есть ли «Запомнить
    меня», восстановление пароля, блокировка, двухфакторная защита.

    **Главный сценарий:** правильные email и пароль — пользователь
    в личном кабинете.

    **По видам:**

    - негатив — неверный пароль, несуществующий email, пустые поля,
      пробел в конце email;
    - ошибки без раскрытия — одинаковое сообщение для неверного пароля
      и несуществующего email, иначе можно узнать, у кого есть аккаунт;
    - блокировка — 4 попытки можно, 5-я блокирует, границы времени
      блокировки;
    - восстановление — ссылка одноразовая и ограничена по времени;
    - «Запомнить меня» и выход;
    - удобство, совместимость, доступность.

    **Топ-5:** вход; одинаковые ошибки; блокировка; одноразовая ссылка;
    «Запомнить меня» и выход.

    **Не проверяю:** шифрование паролей в базе и нагрузку — это зона
    разработки и отдельных специалистов.

- id: any-08
  type: quiz
  question: Зачем в ответе на собеседовании называть, что ты НЕ будешь проверять?
  options:
    - "Это показывает, что ты осознанно управляешь объёмом и рисками, а не просто не успел"
    - "Чтобы интервьюер сократил задание"
    - "Это обязательный пункт любого отчёта, иначе ответ не засчитают"
    - "Чтобы сэкономить время на проверках, которые лень делать"
  correct: 0
  explanation: |
    Проверить всё невозможно — ни на собеседовании, ни на работе. Разница
    между «не проверил» и «решил не проверять» — в том, есть ли причина.

    «Механику тросов лифта не проверяю — это сертифицированные испытания,
    запрошу акт» звучит как решение мидла. Тот же пробел без объяснения
    выглядит как то, о чём ты забыл. Это тот же раздел «Что не входит и
    почему» из тест-плана.

- id: any-09
  type: card
  question: Протестируй push-уведомление «Курьер выехал» в приложении доставки.
  answer: |
    **Вопросы:** какие платформы и версии, что открывается по нажатию,
    есть ли настройки уведомлений в приложении.

    **Главный сценарий:** статус сменился — пришёл push с правильным
    текстом, нажатие открывает именно этот заказ.

    **По видам** — почти все риски в состояниях:

    - приложение открыто, свёрнуто, закрыто, телефон заблокирован;
    - уведомления запрещены в системе или в приложении;
    - нет сети в момент отправки, два заказа сразу, заказ отменён;
    - быстрая смена статуса — нет ли дублей;
    - выход из аккаунта и вход другого пользователя на том же телефоне;
    - локализация, разные версии ОС, режим «Не беспокоить».

    **Топ-5:** нажатие ведёт к нужному заказу; после выхода уведомления
    не приходят; приходит при закрытом приложении; запрет не ломает
    приложение; нет дублей.

    **Не проверяю:** работу серверов Apple и Google и все модели телефонов.

- id: any-10
  type: quiz
  question: Как лучше всего закончить ответ на «протестируй что-нибудь»?
  options:
    - "Сказать «ну, в общем, как-то так»"
    - "Перечислить ещё десяток проверок, пока интервьюер не остановит"
    - "Подвести итог: когда тестирование закончено и что сознательно не проверяем"
    - "Спросить интервьюера, какие проверки он ожидал услышать"
  correct: 2
  explanation: |
    Ответ без концовки выглядит незаконченным. Лучшая концовка повторяет
    то, чем заканчивается настоящее тестирование: критерии выхода —
    например, «главный сценарий и топ-5 пройдены без проблем
    с безопасностью» — и что сознательно осталось за рамками.

    Новые проверки в конце только размывают структуру, а «как-то так»
    оставляет впечатление, что структуры не было.
