# Формат файла вопросов темы (имя файла = id темы из lib/topics.ts).
# Файл — список вопросов. Поле id уникально во всём банке вопросов.
#
# Открытый вопрос (card):
#   - id: уникальный-id
#     type: card
#     question: текст вопроса
#     answer: |       # ответ в простом markdown
#
# Тест (quiz):
#   - id: уникальный-id
#     type: quiz
#     question: текст вопроса
#     options: [минимум 2 варианта]
#     correct: 0      # индекс верного варианта, отсчёт с НУЛЯ
#     explanation: |  # разбор в простом markdown
#
# В answer и explanation только простой markdown: без контейнеров (::: tip)
# и без ссылок на страницы сайта — они не поддерживаются, а ссылку на тему
# тренажёр показывает сам.


- id: docs-checklist-vs-testcase
  type: card
  question: Когда достаточно чек-листа, а когда нужен тест-кейс?
  answer: |
    Разница — в широте и глубине, как у смоука и подробной проверки.

    **Чек-лист** — список коротких проверок: одна строка — что проверить
    и что ожидаем, без предусловий и шагов. Широкий охват, мало деталей.
    Подходит для смоука, для давно стабильных функций, когда времени мало,
    а проверяющий хорошо знает продукт.

    **Тест-кейс** — одна проверка, расписанная подробно: предусловия,
    шаги с конкретными данными, ожидаемый результат. Нужен для новой или
    сложной логики, когда важны точные данные, когда проверку выполнит
    другой человек или её потом автоматизируют.

    Часто их сочетают: сначала чек-лист по всей функции, потом самые
    важные строки разворачивают в тест-кейсы.

- id: docs-risk-based
  type: card
  question: Что такое риск-ориентированный подход и как он влияет на тест-план?
  answer: |
    Это способ осознанно решить, что проверять глубже, что быстрее, а что
    отложить, — по риску каждой области, а не «поровну» или «по списку».

    Риск складывается из двух вещей:

    - **вероятность** — насколько вероятно, что в области есть ошибка;
    - **влияние** — насколько плохо будет, если ошибка там есть.

    Риск повышают: центральность функции (через неё проходят все
    пользователи), недавние изменения, много путей и пользователей через
    область, баги, которые здесь уже находили.

    В тест-плане это видно так: области с высоким риском — первыми и
    глубоко, тест-кейсами; со средним — чек-листом; с низким по обеим
    осям — кандидаты в раздел «Что не входит и почему».

- id: docs-plan-vs-report
  type: card
  question: Чем тест-план отличается от отчёта о тестировании?
  answer: |
    Это зеркальные документы: намерение и факт.

    **Тест-план** пишут **до** проверки. В нём: что входит в проверку и
    что сознательно нет, подход (виды тестирования, документы), риски,
    окружение и данные, когда проверка считается законченной. Обычно его
    пишет ведущий тестировщик, читает команда, иногда менеджер.

    **Отчёт** пишут **после** проверки. В нём: что реально проверено,
    сколько багов найдено и насколько они серьёзные, что не проверено и
    почему, и вывод — можно ли выпускать. Его читают разработчики и
    владелец продукта: им нужна итоговая картина, а не все подробности.

- id: docs-testcase-required
  type: quiz
  question: Без чего тест-кейса не бывает?
  options:
    - "Без приоритета и ID"
    - "Без ссылки на баг-репорт"
    - "Без предусловий, шагов и ожидаемого результата"
    - "Без фактического результата"
  correct: 2
  explanation: |
    Предусловия, шаги и ожидаемый результат — ядро тест-кейса. Без них
    другой человек не сможет выполнить проверку так же, как ты.

    ID и приоритет помогают, когда кейсов много. Фактический результат
    заполняют только при прогоне, а ссылка на баг появляется, только если
    кейс не прошёл.

- id: docs-bad-expected
  type: quiz
  question: Какой ожидаемый результат написан плохо?
  options:
    - "Проект создаётся корректно, всё работает"
    - "Код ответа 201, в ответе name = «Ремонт кухни»"
    - "Код ответа 422, проект не появился в списке проектов"
    - "Код ответа 401"
  correct: 0
  explanation: |
    «Корректно» и «всё работает» каждый понимает по-своему — с таким
    результатом не сравнить то, что получилось на самом деле.

    Хороший ожидаемый результат можно проверить однозначно: код ответа,
    значение поля, есть ли объект в списке.

- id: docs-smoke-document
  type: quiz
  question: Пришла новая сборка, нужно за 15 минут понять, живы ли главные пути продукта. Какой документ подходит лучше всего?
  options:
    - "Тест-план"
    - "Подробные тест-кейсы на каждую функцию"
    - "Отчёт о тестировании"
    - "Чек-лист"
  correct: 3
  explanation: |
    Это смоук: нужно быстро и широко, без глубины. Чек-лист даёт ровно это —
    много проверок по одной строке.

    Расписывать каждую проверку в тест-кейсе здесь слишком долго. Тест-план
    пишут до всей проверки, отчёт — после.

- id: docs-plan-not-included
  type: quiz
  question: Что обычно НЕ входит в тест-план?
  options:
    - "Что сознательно не проверяем и почему"
    - "Сколько багов нашли и насколько они серьёзные"
    - "Риски"
    - "Какие функции входят в проверку"
  correct: 1
  explanation: |
    Тест-план пишут до проверки — в нём ещё нечего считать. Найденные баги
    попадают в отчёт о тестировании, который пишут после.

    Объём, исключения и риски — как раз главные разделы плана.

- id: docs-report-verdict
  type: quiz
  question: Без чего отчёт о тестировании бесполезен для того, кто решает о релизе?
  options:
    - "Без списка всех шагов каждого тест-кейса"
    - "Без имён разработчиков"
    - "Без вывода: можно ли выпускать, а если нет — что мешает"
    - "Без тест-плана в приложении"
  correct: 2
  explanation: |
    Отчёт читают, чтобы принять решение. Поэтому в нём обязательно есть
    вывод — вместе с тем, что проверено, что нашлось и что не проверено.

    Все шаги каждого кейса читателю отчёта не нужны: ему важна картина,
    а не подробности.

- id: docs-risk-first
  type: quiz
  question: Времени мало. Какую область по риск-ориентированному подходу проверить первой?
  options:
    - "Ту, что идёт первой в списке функций"
    - "Вход в систему, который меняли в этой сборке"
    - "Редкую настройку, которую не меняли год"
    - "Ту, которую проще всего проверить"
  correct: 1
  explanation: |
    Риск — это вероятность ошибки плюс её влияние. Вход недавно меняли —
    вероятность выше. Через вход проходит каждый пользователь — влияние
    огромное. Значит, его проверяют первым.

    Порядок в списке и простота проверки к риску отношения не имеют. Редкая
    давно стабильная настройка — первый кандидат, чтобы отложить.

- id: docs-high-level
  type: quiz
  question: Какой документ высокоуровневый — описывает общую картину без шагов?
  options:
    - "Тест-кейс"
    - "Баг-репорт"
    - "Чек-лист с конкретными проверками"
    - "Тест-план"
  correct: 3
  explanation: |
    Тест-план говорит, что проверяем, как и какие риски, — но не расписывает
    действия по шагам.

    Тест-кейс и баг-репорт — низкоуровневые: в них точные шаги и данные.
    Чек-лист — посередине: конкретные проверки, но без шагов.

- id: docs-coverage-not-quality
  type: card
  question: Покрытие требований 100%. Значит ли это, что багов нет?
  answer: |
    Нет. 100% покрытия значит только одно: у каждого требования есть хотя бы
    одна проверка. Насколько эта проверка хороша — покрытие не говорит.

    - **Глубина.** Требование «название от 1 до 30 символов» покрыто и одной
      проверкой на 5 символов. Границы 30 и 31, пустое значение остались
      непроверенными — а в процент это не видно.
    - **Неявные требования.** Покрытие считают по тому, что записано.
      «Не терять данные», «не выполнять действие дважды» в процент
      не попадают, хотя нарушить их — тоже баг.
    - **Покрытие кода — другое.** Это доля строк и ветвлений, выполненных
      автотестами. Её считают инструменты, и она тоже не гарантирует,
      что поведение правильное.

    Поэтому покрытие — хороший способ найти дыры, но плохой способ доказать
    качество.

- id: docs-trace-empty-row
  type: quiz
  question: В матрице трассируемости строка требования оказалась пустой. Что это значит?
  options:
    - "У требования нет ни одной проверки — это дыра в покрытии"
    - "Требование лишнее, его можно удалить"
    - "Проверки на это требование все пройдены"
    - "Проверка не относится ни к одному требованию"
  correct: 0
  explanation: |
    В строках — требования, в столбцах — проверки. Пустая строка: на
    требование не написано ни одной проверки. Нужно добавить проверки или
    осознанно записать, почему это требование сейчас не проверяем.

    Пустой **столбец** — обратная ситуация: проверка без требования. Тогда
    либо проверка лишняя, либо в требованиях чего-то не хватает.
