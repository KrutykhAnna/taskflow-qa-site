# Формат файла вопросов темы (имя файла = id темы из lib/topics.ts).
# Файл — список вопросов. Поле id уникально во всём банке вопросов.
#
# Открытый вопрос (card):
#   - id: уникальный-id
#     type: card
#     question: текст вопроса
#     answer: |       # ответ в простом markdown
#
# Тест (quiz):
#   - id: уникальный-id
#     type: quiz
#     question: текст вопроса
#     options: [минимум 2 варианта]
#     correct: 0      # индекс верного варианта, отсчёт с НУЛЯ
#     explanation: |  # разбор в простом markdown
#
# В answer и explanation только простой markdown: без контейнеров (::: tip)
# и без ссылок на страницы сайта — они не поддерживаются, а ссылку на тему
# тренажёр показывает сам.


- id: types-build-path
  type: card
  question: Опишите путь сборки от получения до релиза — какие проверки и в каком порядке?
  answer: |
    1. **Новая сборка.** Разработчики выложили изменения на тестовый стенд.
    2. **Смоук.** Быстро и неглубоко прохожу главные пути продукта: жива
       ли сборка, есть ли смысл проверять её дальше. Если нет — возвращаю
       разработчикам.
    3. **Проверка нового.** Подробно проверяю новую фичу или изменение по
       требованиям: обычные сценарии, ошибки пользователя, крайние случаи.
    4. **Ретест и санити.** Если находил баги и их исправили — проверяю
       сами баги (ретест) и область вокруг исправления (санити).
    5. **Регресс.** Проверяю, что изменения не сломали то, что работало
       раньше.
    6. **Релиз и смоук на проде.** После выпуска к пользователям снова
       быстрый смоук, но уже там, где настоящие пользователи.

    Главная мысль: на каждом шаге набор проверок разный по ширине и
    глубине. Один и тот же огромный список на каждом шаге не прогоняют.

- id: types-retest-regress-sanity
  type: card
  question: Чем ретест отличается от регресса и от санити?
  answer: |
    Все три случаются после исправления, но отвечают на разные вопросы.

    - **Ретест** — «этот баг действительно исправлен?» Очень узко:
      повторяю шаги, по которым нашёл баг, и проверяю результат.
    - **Санити** — «то, что могла задеть эта правка, работает?» Узко,
      но шире ретеста: одна область вокруг изменения.
    - **Регресс** — «не сломалось ли то, что работало раньше?» Широко:
      всё, что могло пострадать, а не только затронутая область.

    Они дополняют друг друга. Ретест без регресса может пропустить
    поломку в другом месте. Регресс без ретеста не подтверждает, что
    исходный баг исправлен.

- id: types-axes
  type: card
  question: Какие виды тестирования вы знаете?
  answer: |
    Виды удобно называть по осям — это разные вопросы к одной проверке:

    - **по цели:** функциональное (что делает система) и
      нефункциональное (как: скорость, нагрузка, удобство, безопасность,
      совместимость, локализация, доступность);
    - **по уровню:** модульное, интеграционное, системное, приёмочное;
    - **по знанию кода:** чёрный, серый и белый ящик;
    - **по сценарию:** позитивное и негативное;
    - **по запуску:** статическое (без запуска — требования, код) и
      динамическое;
    - **по исполнителю:** ручное и автоматизированное;
    - **вокруг сборки и релиза:** смоук, санити, ретест, регресс, смоук
      на проде.

    Одна проверка может быть сразу функциональной, системной, негативной
    и ручной — оси не исключают друг друга.

- id: types-smoke-goal
  type: quiz
  question: Какая главная цель смоук-тестирования?
  options:
    - "Найти как можно больше багов в новой фиче"
    - "Быстро понять, жива ли сборка и есть ли смысл проверять её дальше"
    - "Проверить, что исправлен конкретный баг"
    - "Проверить все функции продукта перед релизом"
  correct: 1
  explanation: |
    Смоук — быстрая и неглубокая проверка главных путей. Он отвечает на
    один вопрос: стоит ли тратить время на подробную проверку этой
    сборки.

    Проверка конкретного бага — это ретест. Проверка всего старого перед
    релизом — это регресс.

- id: types-retest-situation
  type: quiz
  question: Разработчик исправил баг. Ты повторяешь те же шаги, по которым его нашёл, и смотришь на результат. Как называется эта проверка?
  options:
    - "Смоук"
    - "Регресс"
    - "Санити"
    - "Ретест"
  correct: 3
  explanation: |
    Ретест — повторная проверка одного конкретного бага после
    исправления. Он отвечает только на вопрос «исправлен ли этот баг».

    Чтобы убедиться, что исправление не сломало остальное, нужен ещё
    регресс или хотя бы санити вокруг правки.

- id: types-regress-situation
  type: quiz
  question: В магазин добавили новый способ оплаты. Ты его проверил, а теперь проходишь оплату картой и бонусами, которые не меняли. Что это?
  options:
    - "Регресс"
    - "Ретест"
    - "Приёмочное тестирование"
    - "Смоук на проде"
  correct: 0
  explanation: |
    Регресс проверяет, что изменения не сломали то, что работало раньше.
    Старые способы оплаты не трогали, но они могли пострадать заодно —
    поэтому их и проверяют.

    Проверка нового смотрит вглубь нового, регресс — вширь на старое.

- id: types-levels
  type: quiz
  question: На каком уровне чаще всего работает ручной тестировщик?
  options:
    - "Модульном — проверяет отдельные функции в коде"
    - "Интеграционном — проверяет только связь двух сервисов"
    - "Системном — проверяет весь продукт целиком, как пользователь"
    - "Приёмочном — сам решает, принимать ли продукт"
  correct: 2
  explanation: |
    Модульные тесты обычно пишут сами разработчики. Интеграционные —
    разработчики, иногда тестировщики. Приёмку чаще проводит владелец
    продукта или заказчик, тестировщик ему помогает.

    Основная работа ручного тестировщика — системный уровень: весь
    продукт целиком, через тот же интерфейс, что у пользователя.

- id: types-nonfunctional
  type: quiz
  question: Что из этого — нефункциональная проверка?
  options:
    - "Форма регистрации создаёт пользователя с правильными данными"
    - "Страница каталога открывается быстрее чем за 2 секунды, даже когда на сайте тысяча покупателей"
    - "Без email регистрация не проходит, и система объясняет почему"
    - "Новая задача появляется в списке задач проекта"
  correct: 1
  explanation: |
    Функциональное тестирование проверяет, **что** делает система:
    правильный ли результат. Нефункциональное — **как** она это делает:
    быстро ли, удобно ли, безопасно ли.

    Скорость под нагрузкой — нефункциональное свойство. Остальные
    варианты проверяют результат действия, это функциональные проверки.

- id: types-black-box
  type: quiz
  question: Тестировщик отправляет запросы и смотрит на ответы, не заглядывая в код. Как называют такой подход?
  options:
    - "Белый ящик"
    - "Статическое тестирование"
    - "Модульное тестирование"
    - "Чёрный ящик"
  correct: 3
  explanation: |
    Чёрный ящик — проверяем только вход и выход, не зная, как продукт
    устроен внутри. Белый ящик — проверяем, зная код. Серый — через
    интерфейс, но частично зная устройство: например, заглядывая в базу
    данных.

    Статическое тестирование — это проверка без запуска программы, а
    здесь программа запущена.

- id: types-prod-smoke
  type: quiz
  question: На тестовом стенде все проверки прошли. Зачем после релиза ещё смоук на проде?
  options:
    - "Прод — другое место с другими настройками и данными, а сам выпуск тоже может пройти с ошибкой"
    - "Чтобы ещё раз пройти полный регресс"
    - "Смоук на проде не нужен, если стенд был зелёным"
    - "Чтобы найти баги, которые пропустили на стенде"
  correct: 0
  explanation: |
    Хороший результат на стенде говорит, что программа работает на
    стенде. Но у прода свои настройки, ключи к внешним сервисам и база
    данных, а выпуск — отдельное действие, которое может пройти не так.

    Смоук на проде за несколько минут проверяет, что главные сценарии
    работают там, где сейчас настоящие пользователи.

- id: types-static-dynamic
  type: quiz
  question: Что из этого — статическое тестирование?
  options:
    - "Прогон автотестов после каждой сборки"
    - "Проверка формы оплаты в трёх браузерах"
    - "Чтение требований и макетов с поиском противоречий до того, как написан код"
    - "Смоук новой сборки на тестовом стенде"
  correct: 2
  explanation: |
    Статическое тестирование — проверка без запуска программы: ревью
    требований и макетов, чтение кода. Динамическое — когда программу
    запускают и смотрят на её поведение.

    Анализ требований — самый ранний и дешёвый вид статического
    тестирования, которым занимается тестировщик.

- id: types-pyramid
  type: quiz
  question: Что советует пирамида тестирования?
  options:
    - "Больше всего проверок делать через весь продукт целиком, как пользователь"
    - "Держать много быстрых модульных тестов внизу, меньше интеграционных и совсем немного проверок всего продукта наверху"
    - "Поровну распределять проверки между всеми уровнями"
    - "Сначала тестировать безопасность, потом нагрузку, потом функциональность"
  correct: 1
  explanation: |
    Модульные тесты быстрые и дешёвые, поэтому их много. Проверки всего
    продукта целиком самые медленные и дорогие — их держат немного и
    только для главных сценариев.

    Ошибку в одной функции дешевле поймать модульным тестом за секунду,
    чем искать её через весь продукт.

- id: types-impact-analysis
  type: card
  question: На регресс обычно уходит три дня, а сейчас есть четыре часа. Как ты решишь, что проверять?
  answer: |
    Начну с анализа влияния (impact analysis), а не с прогона по порядку.

    1. **Что поменяли.** Спрошу разработчика, какие части кода трогали,
       нет ли общих изменений: общий компонент, библиотека, база данных.
    2. **Кто от этого зависит.** Какие функции используют изменённое
       место.
    3. **Что важнее всего.** Сценарии, где деньги и доверие: вход,
       оплата, оформление заказа.
    4. **Что ломалось раньше.**

    Получится план по уровням: смоук, проверка изменённого, связанные
    сценарии, критичный минимум. План проговорю вслух. А в отчёте
    отдельно перечислю, что не проверено, — решение выпускать с этим
    риском принимает PO.

- id: types-short-regress
  type: quiz
  question: Регресс не помещается во время до релиза. Какой подход правильный?
  options:
    - "Проходить регресс по порядку с первого пункта, пока не кончится время"
    - "Пропустить регресс целиком, раз всё равно не успеть"
    - "Написать в отчёте «регресс пройден», а остальное проверить после релиза"
    - "Выбрать проверки по анализу влияния и критичности, а непроверенное явно указать в отчёте как риск"
  correct: 3
  explanation: |
    Прогон «по порядку» проверяет случайные пункты, а не важные. Полный
    пропуск и «регресс пройден» без правды — это скрытый риск.

    Мидл выбирает регресс по риску: что задело изменение, что критично
    для пользователей, что ломалось раньше. И честно показывает, что
    осталось непроверенным.

- id: types-feature-flag
  type: quiz
  question: Новая фича спрятана за фича-флагом. Что обязательно проверить, кроме самой фичи?
  options:
    - "Что с выключенным флагом продукт работает как раньше, а данные, созданные при включённом флаге, не ломают старые экраны после выключения"
    - "Ничего: пока флаг выключен, код фичи не влияет на продукт"
    - "Только скорость загрузки страницы с флагом"
    - "Достаточно проверить фичу с включённым флагом — выключенное состояние проверят пользователи"
  correct: 0
  explanation: |
    У сборки с флагом два состояния, и проверять нужно оба. С
    выключенным флагом — это регресс: от фичи не должно быть видно
    ничего. С включённым — проверка нового.

    Отдельный риск — переключение: что будет с данными, созданными при
    включённой фиче, когда её выключат, и что увидит человек, у которого
    флаг переключился посреди работы.

- id: types-green-autotests
  type: card
  question: Все автотесты были зелёными, а после релиза пользователи нашли баг в корзине. Что ты скажешь руководителю и что сделаешь?
  answer: |
    Сначала — сам баг: воспроизвести, завести баг-репорт, оценить
    масштаб.

    Потом — понять, почему автотесты не поймали. Обычные причины:

    - такого сценария в тестах нет — особенно сочетаний действий;
    - тест работает на заглушке вместо настоящего сервиса;
    - тест есть, но проверяет не то (например, только что страница
      открылась).

    Руководителю честно: зелёные автотесты означают, что проверены
    именно написанные сценарии, а не весь продукт. Добавим этот
    сценарий и похожие на него. А рискованные сочетания перед релизом
    стоит проверять ещё и вручную, исследовательски.

- id: types-ab-test
  type: quiz
  question: Ты тестируешь A/B-тест экрана подписки. Какой риск легче всего пропустить?
  options:
    - "Что кнопки в варианте B другого цвета"
    - "Что вариант A выглядит хуже варианта B"
    - "Что пользователь видит разные варианты на разных устройствах или аналитика отправляет события с неверным вариантом"
    - "Что A/B-тест нельзя проверить на тестовом стенде"
  correct: 2
  explanation: |
    Результат A/B-теста считают по аналитике. Если пользователь сегодня
    видит вариант A, а завтра B, или события уходят с неправильной
    меткой варианта, решение примут на неверных данных. Пользователь
    этого бага не видит, но он ломает весь эксперимент.

    Поэтому кроме обоих вариантов целиком проверяют стабильность
    варианта у пользователя и события аналитики.
