# Формат файла вопросов темы (имя файла = id темы из lib/topics.ts).
# Файл — список вопросов. Поле id уникально во всём банке вопросов.
#
# Открытый вопрос (card):
#   - id: уникальный-id
#     type: card
#     question: текст вопроса
#     answer: |       # ответ в простом markdown
#
# Тест (quiz):
#   - id: уникальный-id
#     type: quiz
#     question: текст вопроса
#     options: [минимум 2 варианта]
#     correct: 0      # индекс верного варианта, отсчёт с НУЛЯ
#     explanation: |  # разбор в простом markdown
#
# В answer и explanation только простой markdown: без контейнеров (::: tip)
# и без ссылок на страницы сайта — они не поддерживаются, а ссылку на тему
# тренажёр показывает сам.

- id: who-tester-vs-qa
  type: card
  question: Чем тестировщик отличается от QA-инженера?
  answer: |
    Чаще всего — ничем: в вакансиях и в работе это синонимы.

    Но в разных компаниях названия иногда используют по-разному. Где-то
    QA-инженеру дают зону пошире: он не только проверяет продукт, но и
    участвует в процессах команды — помогает улучшать требования,
    договорённости, порядок работы. А «тестировщиком» называют того, кто
    в основном выполняет проверки.

    Единого стандарта нет. На собеседовании лучше уточнить, как
    разделяют эти роли именно в этой компании, чем спорить о
    «правильном» определении.

- id: who-qa-qc-testing
  type: card
  question: Чем отличаются QA, QC и тестирование?
  answer: |
    Это вложенные понятия: тестирование — часть QC, а QC — часть QA.

    - **QA (обеспечение качества)** — про процесс. Всё, что команда
      делает, чтобы ошибок было меньше с самого начала: понятные
      требования, договорённости, ревью. Например, договориться
      записывать ограничения каждого поля в спецификации.
    - **QC (контроль качества)** — про продукт. Проверка готовой сборки:
      соответствует ли она требованиям, можно ли её выпускать.
    - **Тестирование** — конкретные проверки внутри QC: выполнить
      действие и сравнить результат с ожидаемым. Например, отправить
      пароль из 7 символов и проверить, что он отклонён.

    Коротко: QA предупреждает ошибки, QC и тестирование их находят.

- id: who-error-defect-failure
  type: quiz
  question: Разработчик опечатался в условии, и теперь пользователь не может сохранить форму. Что здесь сбой (failure)?
  options:
    - "Опечатка, которую допустил разработчик"
    - "Неправильная строчка в коде"
    - "Пользователь не может сохранить форму"
    - "Задача в трекере, которую завёл тестировщик"
  correct: 2
  explanation: |
    Цепочка такая: ошибка → дефект → сбой.

    - **Ошибка** — промах человека: разработчик опечатался.
    - **Дефект (баг)** — след промаха в продукте: неправильная строчка кода.
    - **Сбой** — то, что видно снаружи: форма не сохраняется.

    Дефект может долго не проявляться, пока никто не попадёт в нужный
    сценарий.

- id: who-verification-validation
  type: quiz
  question: Что проверяет валидация?
  options:
    - "Что продукт сделан строго по спецификации"
    - "Что в коде нет синтаксических ошибок"
    - "Что все тест-кейсы пройдены"
    - "Что продукт действительно решает задачу пользователя"
  correct: 3
  explanation: |
    Валидация отвечает на вопрос «мы сделали правильный продукт?» — то,
    что действительно нужно людям.

    Верификация отвечает на вопрос «мы сделали продукт правильно?» — так,
    как написано в требованиях.

    Продукт может пройти верификацию и не пройти валидацию: всё сделано
    по требованиям, но пользоваться неудобно. Значит, ошиблись в самих
    требованиях.

- id: who-no-bugs-found
  type: quiz
  question: Ты прогнал все тесты регистрации, и ни один баг не найден. Какой вывод верный?
  options:
    - "В регистрации нет багов"
    - "В проверенных сценариях багов не найдено"
    - "Тесты написаны неправильно, раз ничего не нашли"
    - "Регистрацию больше можно не проверять"
  correct: 1
  explanation: |
    Первый принцип тестирования: тестирование показывает наличие
    дефектов, а не их отсутствие. Тесты могут найти баг, но не могут
    доказать, что багов нет совсем.

    Честная формулировка — «в проверенных сценариях багов не найдено».
    А «больше не проверять» противоречит ещё одному принципу: тесты
    «изнашиваются», и одни и те же проверки со временем перестают
    находить новое.

- id: who-exhaustive-testing
  type: quiz
  question: Какой принцип тестирования объясняет, почему нельзя проверить все возможные значения поля «Название задачи»?
  options:
    - "Исчерпывающее тестирование невозможно"
    - "Дефекты скапливаются вместе"
    - "Тестирование зависит от контекста"
    - "Отсутствие багов — не гарантия успеха"
  correct: 0
  explanation: |
    Вариантов ввода почти бесконечно много, и перебрать их все нельзя.
    Поэтому тестировщик выбирает самые важные проверки: по рискам и с
    помощью техник тест-дизайна, например граничных значений.

- id: who-why-tester
  type: card
  question: Зачем нужен тестировщик, если разработчик сам проверяет свой код?
  answer: |
    Дело не в том, что разработчики плохо пишут код. У автора и у
    проверяющего разный взгляд.

    Автор видит, как он задумал и написал программу, и невольно
    проверяет то, что сам и задумал. Тестировщик смотрит со стороны:
    как программа ведёт себя на самом деле, в том числе в редких и
    ошибочных сценариях, о которых никто не подумал.

    Ещё тестировщик проверяет продукт с точки зрения пользователя и
    описывает находки так, чтобы их можно было быстро повторить и
    исправить. Оба взгляда нужны, чтобы продукт получился качественным.

- id: who-risk-based-priority
  type: quiz
  question: На проверку новой фичи интернет-магазина осталось два часа, а полная проверка займёт день. С чего разумнее начать?
  options:
    - "С проверки всех пунктов задачи по порядку, сколько успею"
    - "С вёрстки и текстов — их быстрее всего проверить"
    - "Попросить перенести релиз, пока не проверю всё"
    - "Со сценариев, где ошибка стоит дороже всего: деньги, чужие данные, самый частый путь пользователя"
  correct: 3
  explanation: |
    Это тестирование на основе рисков. Раз проверить всё нельзя,
    начинают с того, где проблема вероятнее и где её последствия
    серьёзнее: оплата, персональные данные, права доступа, основной
    сценарий.

    Если время закончится, непроверенным останется наименее опасное. А
    команде можно честно сказать, что проверено, а что нет. Перенос
    релиза — решение не тестировщика, и предлагать его стоит с
    конкретными рисками на руках, а не «пока не проверю всё».

- id: who-who-decides-release
  type: quiz
  question: Кто обычно принимает решение, выпускать ли релиз с известными багами?
  options:
    - "Тестировщик — он лучше всех знает, сколько там багов"
    - "Тот, кто отвечает за продукт: владелец продукта, руководитель или команда по договорённости"
    - "Разработчик, который писал фичу"
    - "Никто: релиз с известными багами выпускать нельзя"
  correct: 1
  explanation: |
    Тестировщик не «привратник». Решение о релизе принимает тот, кто
    отвечает за продукт и его бизнес-результат.

    Задача тестировщика — чтобы это решение принималось с открытыми
    глазами: что проверено, что нет, какие известные баги остаются и чем
    они грозят. Релизы с известными некритичными багами — обычная
    практика: важно, чтобы риск был осознанным.

- id: who-quality-responsibility
  type: card
  question: Кто отвечает за качество продукта? Что ответишь, если на прод попал баг и спрашивают «куда смотрел тестировщик»?
  answer: |
    Качество — ответственность всей команды. Его закладывают на каждом
    шаге: в требованиях, в коде, на ревью, в тестировании, в процессе
    релиза. Тестировщик помогает увидеть проблемы, но не может «добавить»
    качество в одиночку.

    Если баг дошёл до прода, сначала помогаю исправить: воспроизвожу,
    собираю данные, проверяю исправление. Потом предлагаю разобрать
    случай без поиска виноватых: почему баг прошёл через все этапы и что
    поменять в процессе. Например, договориться, какие устройства и
    версии проверяем в каждом релизе.

    При этом не прячусь за «качество — общее»: если в моей части была
    дыра, называю её и предлагаю, как закрыть.

- id: who-critical-bug-before-release
  type: card
  question: За два часа до релиза ты нашёл критичный баг. Что сделаешь?
  answer: |
    1. Быстро перепроверю и запишу точные шаги — чтобы не поднимать
       тревогу из-за случайности.
    2. Заведу баг и сразу напишу в общий канал релиза, отметив
       владельца продукта и тимлида: что сломано, насколько это серьёзно,
       где шаги.
    3. Предложу варианты: исправить и перепроверить, выпустить без
       этой фичи (например, выключив её переключателем), перенести релиз.
    4. Если решили чинить — скажу, что буду перепроверять после
       исправления.
    5. Попрошу записать принятое решение.

    Чего не сделаю: не промолчу и не поставлю ультиматум «не пропущу
    релиз». Решение принимает владелец продукта, а моя задача — чтобы
    он принимал его, зная о риске.

- id: who-usability-not-bug
  type: quiz
  question: Функция сделана строго по требованиям, но ты видишь, что пользователю ей неудобно пользоваться. Как поступишь?
  options:
    - "Ничего не буду делать — по требованиям всё верно"
    - "Заведу баг с высокой критичностью и не пропущу задачу"
    - "Оформлю замечание по удобству с объяснением, кому и почему неудобно, и отправлю владельцу продукта и дизайнеру"
    - "Попрошу разработчика переделать, как мне кажется удобнее"
  correct: 2
  explanation: |
    Это проблема валидации, а не верификации: сделано по требованиям,
    но задача пользователя решается плохо.

    Промолчать — значит не сделать свою работу. Заводить критичный баг
    — несправедливо по отношению к разработчику: он сделал то, что
    просили. Решать, менять ли продукт, — владельцу продукта и
    дизайнеру. Поэтому лучший ход — внятное замечание с позиции
    пользователя и, по возможности, вариант улучшения.

- id: who-first-qa-startup
  type: card
  question: Ты первый тестировщик в небольшом стартапе, процессов нет. Что будешь делать в первые две недели?
  answer: |
    Не буду сразу внедрять тяжёлые процессы. Сначала пойму продукт и
    боль команды:

    - пройду основные сценарии сам;
    - соберу у поддержки самые частые жалобы клиентов;
    - спрошу у основателя или владельца продукта, что для бизнеса
      критично.

    Из этого составлю карту рисков: что важнее и что чаще ломается.
    Сделаю короткий смоук-чек-лист на 15–20 пунктов, который реально
    прогнать перед каждым релизом. Предложу одну-две простые
    договорённости — например, баги заводить в трекер с шагами, а не в
    чат.

    Результат покажу фактами: сколько багов поймали до релиза. И сразу
    договорюсь, что разработчики продолжают проверять свой код сами —
    качество не должно стать «работой одного тестировщика».
