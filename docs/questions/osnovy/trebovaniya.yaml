# Вопросы темы «Требования и их тестирование». Формат — см. bag-report.yaml.

- id: req-01
  type: card
  question: Требование «страница грузится быстро» — что с ним не так и как его переписать?
  answer: |
    Его нельзя ни сделать, ни проверить: нет критерия, когда оно выполнено.
    «Быстро» у каждого своё.

    Чтобы переписать, нужно ответить на вопросы:

    - **Что считать загрузкой** — первый контент, возможность нажать,
      все картинки.
    - **Сколько** — конкретное число секунд.
    - **Для какой доли пользователей** — перцентиль, а не среднее:
      среднее прячет тех, у кого очень медленно.
    - **В каких условиях** — сеть, устройство, холодный или тёплый
      старт, нагрузка.

    Пример: «Основной контент каталога виден не позже 2,5 с для 95%
    загрузок: холодный старт, 4G, телефон среднего класса, до 2 000
    одновременных пользователей».

- id: req-02
  type: card
  question: "PO говорит: «Сделайте как у конкурентов». Твои действия?"
  answer: |
    «Как у конкурентов» — слово-сигнал. Непонятно, какой конкурент,
    какая часть его поведения и всё ли в ней нам подходит. Конкурент
    мог сделать это плохо или под другую аудиторию.

    Что делаю:

    1. Уточняю, какой продукт и какой сценарий имеется в виду.
    2. Сам разбираю поведение конкурента: позитивный путь, ошибки,
       крайние случаи.
    3. Приношу PO список конкретных пунктов: «у них так-то — нам нужно
       так же?» — особенно там, где поведение неочевидно.
    4. Ответы записываю в задачу как требования.

    Конкурент — хороший оракул, но не замена требованиям.

- id: req-03
  type: card
  question: Чем критерии приёмки отличаются от тест-кейсов?
  answer: |
    **Критерий приёмки** — договорённость, как должно быть. Он короткий,
    пишется до разработки вместе с PO и описывает результат, а не шаги.
    Часто в формате «Дано / Когда / Тогда».

    **Тест-кейс** — способ проверить договорённость: конкретные шаги,
    данные, окружение, ожидаемый результат.

    Из одного критерия обычно получается несколько тест-кейсов:
    граничные значения, разные пользователи, ошибки. А критерий
    приёмки — это то, по чему команда и PO решают, сделана ли история.

- id: req-04
  type: card
  question: Как задать вопрос по требованию, чтобы на него быстро ответили?
  answer: |
    Хороший вопрос состоит из трёх частей:

    - **что именно** непонятно — цитата из требования;
    - **почему это важно** — какой риск, если угадать неверно;
    - **какие варианты** ты видишь — а лучше предложенная формулировка.

    На вопрос «Суммируется ли скидка с промокодом? Если да, при промокоде
    15% выйдет 25%. Варианты: а) не суммируются, б) суммируются» можно
    ответить одной буквой. На «про скидки непонятно, уточните» —
    только созвоном.

    Ещё важно: вопрос задаётся там, где живёт требование, — в задаче.
    Тогда ответ увидит вся команда.

- id: req-05
  type: card
  question: Что делаешь, если к началу тестирования на вопрос по требованиям так и не ответили?
  answer: |
    Не жду и не тестирую молча «как понял». Фиксирую **допущение**:

    - что в требованиях не описано;
    - из чего я исхожу и почему — здравый смысл, прошлая версия,
      поведение аналогов;
    - что вопрос задан, кому и когда.

    Так работа идёт, а все видят, на чём основаны результаты. Если
    допущение окажется неверным, сразу понятно, какие проверки повторить.

    Если пробел касается денег, данных или безопасности, говорю об этом
    тому, кто решает о релизе: решение должно приниматься с учётом риска.

- id: req-06
  type: quiz
  question: Какое из требований проверяемое?
  options:
    - "Сообщение об ошибке должно быть понятным"
    - "Приложение должно работать без сбоев"
    - "Пароль — от 8 до 64 символов, хотя бы одна цифра"
    - "Поиск должен находить нужные товары"
  correct: 2
  explanation: |
    Проверяемое требование позволяет однозначно сказать «выполнено» или
    «нет». У пароля есть границы и правило: можно проверить 7, 8, 64 и 65
    символов, пароль без цифр.

    «Понятное», «без сбоев», «нужные» — оценки, а не критерии. Каждый
    поймёт их по-своему.

- id: req-07
  type: quiz
  question: "PO прислал требование: «Сокет в мобильном приложении никогда не должен рваться». Что главное не так?"
  options:
    - "Требование невыполнимо: сеть пропадает, ОС закрывает соединения в фоне"
    - "Не указан протокол соединения"
    - "Требование слишком короткое"
    - "Это нефункциональное требование, его не тестируют"
  correct: 0
  explanation: |
    «Никогда» — абсолют, который нельзя выполнить. Соединение рвётся из-за
    смены сети, лифта, метро, а iOS и Android сами закрывают соединения
    у приложений в фоне.

    Правильная цель — быстрое и заметное пользователю восстановление:
    за сколько секунд переподключиться, что показать, пока связи нет,
    и можно ли совершать действия по устаревшим данным.

    Протокол — дело разработки. Длина требования сама по себе не
    проблема. А нефункциональные требования тестируют так же, как
    функциональные.

- id: req-08
  type: quiz
  question: Разработчик реализовал двусмысленное требование по-своему, а ты понял его иначе. Что правильно сделать?
  options:
    - "Завести баг на разработчика — требование нужно было уточнить"
    - "Принять реализацию разработчика, раз код уже готов"
    - "Переписать требование самому так, как понял ты"
    - "Задать вопрос PO с двумя трактовками и записать ответ в задачу"
  correct: 3
  explanation: |
    Обе трактовки законны — дефект в самом требовании. Решать, как должно
    быть, не тестировщику и не разработчику, а тому, кто отвечает за
    требования.

    Вопрос с двумя вариантами быстро получает ответ. Записанный ответ
    закрывает спор и для следующих задач. Если PO выберет другую
    трактовку, это доработка по уточнённому требованию.

- id: req-09
  type: quiz
  question: Какое из требований — нефункциональное?
  options:
    - "Пользователь может отменить заказ до передачи курьеру"
    - "Каталог открывается за 2 с у 95% пользователей"
    - "Администратор может заблокировать пользователя"
    - "В корзине показывается итоговая сумма со скидкой"
  correct: 1
  explanation: |
    Функциональные требования описывают, **что** делает система:
    отменить заказ, заблокировать, показать сумму.

    Нефункциональные — **насколько хорошо** она это делает: скорость,
    надёжность, безопасность, удобство, совместимость. Время загрузки
    каталога — требование к производительности.

- id: req-10
  type: quiz
  question: Ты подготовил к грумингу 30 вопросов по одной истории. Как лучше поступить?
  options:
    - "Отправить все 30 одним списком — пусть PO разбирается"
    - "Задать только самый первый, остальные потом"
    - "Разделить на блокирующие и «можно позже», блокирующие — в начало"
    - "Ничего не спрашивать и записать всё как допущения"
  correct: 2
  explanation: |
    Длинный список без приоритета никто не прочитает внимательно.
    Мидл приоритизирует:

    - **блокирует** — без ответа нельзя ни делать, ни проверять, или
      ошибка стоит денег, данных, юридических рисков;
    - **можно позже** — уточнить по ходу;
    - **мелочь** — решить самому и записать как допущение.

    Только допущения — тоже плохо: блокирующие вопросы нельзя оставлять
    на волю догадки.

- id: req-11
  type: quiz
  question: Что такое неявное требование?
  options:
    - "Требование, которое PO сказал устно, но не записал"
    - "Требование с ошибкой, которую ещё не нашли"
    - "Требование, которое пока не взяли в спринт"
    - "То, что «и так понятно» и потому нигде не записано, например не терять введённые данные"
  correct: 3
  explanation: |
    Неявные требования никто не записывает, потому что они кажутся
    очевидными: данные не теряются, сумма не бывает отрицательной,
    пользователь не видит чужое, двойное нажатие не создаёт два заказа.

    Нарушение неявного требования — тоже баг. Но надёжнее превратить
    неявное в явное: спросить и записать.

- id: req-12
  type: quiz
  question: Что из этого — пример статического тестирования требований?
  options:
    - "Прочитать user story и спросить, что будет при двойном нажатии"
    - "Пройти сценарий оформления заказа на стенде"
    - "Запустить автотесты после сборки"
    - "Проверить время загрузки страницы в браузере"
  correct: 0
  explanation: |
    Статическое тестирование — проверка без запуска программы. Программы
    ещё может и не быть: тестировщик читает требование, ищет дыры,
    придумывает сценарии «а что если…» и задаёт вопросы.

    Остальные варианты требуют работающей системы — это динамическое
    тестирование.

- id: req-13
  type: card
  question: Что такое требования и откуда они берутся?
  answer: |
    Требования — описание того, что должен делать продукт и каким он
    должен быть. По ним разработчик понимает, что делать, а
    тестировщик — с чем сравнивать результат.

    Источники: ТЗ и спецификации, user story в трекере, макеты
    дизайнера, договорённости на созвонах и в переписке, законы и
    стандарты, поведение предыдущей версии продукта.

- id: req-14
  type: card
  question: Какие виды требований бывают?
  answer: |
    - **Бизнес-требования** — зачем продукт нужен бизнесу.
    - **Пользовательские** — что пользователь сможет сделать.
    - **Функциональные** — что именно делает система.
    - **Нефункциональные** — какой она должна быть: скорость,
      надёжность, безопасность, удобство, совместимость.
    - **Ограничения** — технологии, сроки, законы.

    Отдельно — **неявные требования**: то, что «и так понятно» и
    поэтому нигде не записано. Например, данные не должны теряться.

- id: req-15
  type: card
  question: Какими свойствами должно обладать хорошее требование?
  answer: |
    - **Полное** — описаны все случаи, включая ошибки.
    - **Однозначное** — все понимают его одинаково.
    - **Непротиворечивое** — не спорит с другими требованиями и макетами.
    - **Проверяемое** — понятно, как убедиться, что оно выполнено.
    - **Выполнимое** — его реально сделать.
    - **Атомарное** — одно требование, а не несколько в одной фразе.
    - **Трассируемое** — понятно, откуда оно и какие проверки с ним связаны.
    - **Приоритизированное** — известно, насколько оно важно.

- id: req-16
  type: card
  question: Что такое user story и критерии приёмки?
  answer: |
    **User story** — короткое описание функции от лица пользователя:
    «Как <кто>, я хочу <что>, чтобы <зачем>».

    **Критерии приёмки** — условия, при которых история считается
    сделанной. Часто пишутся в формате «Дано — Когда — Тогда»:
    «Дано: товар в корзине. Когда: пользователь применяет промокод.
    Тогда: цена уменьшается на 10%».

- id: req-17
  type: card
  question: Как тестировать требования?
  answer: |
    Ещё до появления кода — это статическое тестирование:

    - внимательно прочитать и проверить по свойствам хорошего
      требования;
    - искать слова-сигналы: «быстро», «удобно», «всегда», «и т.д.»;
    - придумывать сценарии «а что если…», включая негативные и
      граничные;
    - сверять с макетами и другими требованиями;
    - задавать вопросы аналитику или PO и фиксировать ответы письменно.
