# Задачи по теме «JOIN».
- id: join-01
  topic: join
  level: junior
  dataset: taskflow
  kind: select
  title: Задачи с названием проекта
  text: |
    Выведи `title` каждой неудалённой задачи и `name` её проекта. Задачи удалённых проектов не
    показывай.
  solution: |
    SELECT t.title, p.name
    FROM tasks t
    JOIN projects p ON p.id = t.project_id
    WHERE t.deleted_at IS NULL
      AND p.deleted_at IS NULL;
  hint: |
    Связь — `tasks.project_id = projects.id`. Мягкое удаление есть у обеих таблиц: условие
    `deleted_at IS NULL` нужно для каждой.

- id: join-02
  topic: join
  level: middle
  dataset: shop
  kind: select
  title: Клиенты без заказов
  text: |
    Найди клиентов, которые не сделали ни одного заказа. Выведи `first_name`, `last_name` и `email`.
  solution: |
    SELECT c.first_name, c.last_name, c.email
    FROM customers c
    LEFT JOIN orders o ON o.customer_id = c.id
    WHERE o.id IS NULL;
  hint: |
    `INNER JOIN` отбросит клиентов без пары. `LEFT JOIN` оставит их, а столбцы заказа у них будут
    NULL — по этому признаку их и находят.

- id: join-03
  topic: join
  level: interview
  dataset: shop
  kind: select
  title: Сотрудник и руководитель
  text: |
    Выведи фамилию каждого сотрудника и фамилию его руководителя (`manager_id`). У директора
    руководителя нет — он тоже должен попасть в список, с NULL вместо фамилии руководителя.
  solution: |
    SELECT e.last_name AS employee, m.last_name AS manager
    FROM employees e
    LEFT JOIN employees m ON m.id = e.manager_id;
  hint: |
    Это self-join: таблица соединяется сама с собой под двумя псевдонимами. Чтобы не потерять
    директора, соединение должно быть внешним.
