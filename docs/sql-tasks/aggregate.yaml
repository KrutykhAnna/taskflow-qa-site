# Задачи по теме «Агрегаты, GROUP BY, HAVING».
- id: agg-01
  topic: aggregate
  level: junior
  dataset: taskflow
  kind: select
  title: Задачи по статусам
  text: |
    Сколько неудалённых задач в каждом статусе? Выведи `status` и количество задач.
  solution: |
    SELECT status, COUNT(*) AS tasks_count
    FROM tasks
    WHERE deleted_at IS NULL
    GROUP BY status;
  hint: |
    Сгруппируй строки по статусу и посчитай строки в каждой группе. Удалённые задачи отсекаются
    до группировки — в `WHERE`.

- id: agg-02
  topic: aggregate
  level: middle
  dataset: taskflow
  kind: select
  title: Дубли email без учёта регистра
  text: |
    Почта не различает регистр, а база — различает. Найди среди неудалённых пользователей email,
    которые повторяются, если не учитывать регистр. Выведи email в нижнем регистре и сколько раз
    он встречается.
  solution: |
    SELECT lower(email) AS email_lower, COUNT(*) AS cnt
    FROM users
    WHERE deleted_at IS NULL
    GROUP BY lower(email)
    HAVING COUNT(*) > 1;
  hint: |
    Группировать можно не только по столбцу, но и по выражению — например, `lower(email)`.
    Условие на количество в группе пишется в `HAVING`, а не в `WHERE`.

- id: agg-03
  topic: aggregate
  level: interview
  dataset: shop
  kind: select
  title: Выручка по годам
  text: |
    Посчитай выручку магазина по годам: год заказа и сумму `quantity * price` по всем позициям
    заказов. Отменённые заказы (`status = 'cancelled'`) не считай.
  solution: |
    SELECT substr(o.order_date, 1, 4) AS year,
           SUM(i.quantity * i.price) AS revenue
    FROM orders o
    JOIN order_items i ON i.order_id = o.id
    WHERE o.status <> 'cancelled'
    GROUP BY substr(o.order_date, 1, 4);
  hint: |
    Цена — из `order_items`: это цена на момент заказа, она может отличаться от текущей в
    `products`. Год в SQLite достаётся из текстовой даты через `substr(order_date, 1, 4)` или
    `strftime('%Y', order_date)`; в PostgreSQL — `EXTRACT(YEAR FROM order_date)`.
