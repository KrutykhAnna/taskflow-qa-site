# Задачи по теме «INSERT, UPDATE, DELETE». Для kind: dml проверка выполняет check-запрос
# на базе студента и на эталонной базе и сравнивает результаты.
- id: dml-01
  topic: dml
  level: junior
  dataset: shop
  kind: dml
  title: Новая категория
  text: |
    Добавь в справочник категорий новую категорию «Игры». `id` можно не указывать — SQLite
    назначит его сам.
  solution: |
    INSERT INTO categories (name) VALUES ('Игры');
  check: |
    SELECT name FROM categories
  hint: |
    `INSERT INTO таблица (столбцы) VALUES (значения)`. Строки — в одинарных кавычках.

- id: dml-02
  topic: dml
  level: junior
  dataset: taskflow
  kind: dml
  title: Закрыть задачи в работе
  text: |
    В проекте 2 закончили спринт. Переведи в статус `DONE` все его неудалённые задачи, которые
    сейчас в статусе `IN_PROGRESS`. Остальные задачи не трогай.
  solution: |
    UPDATE tasks
    SET status = 'DONE'
    WHERE project_id = 2
      AND status = 'IN_PROGRESS'
      AND deleted_at IS NULL;
  check: |
    SELECT id, project_id, status FROM tasks
  hint: |
    Перед `UPDATE` выполни `SELECT` с тем же `WHERE` — увидишь, какие строки изменятся. Без
    `WHERE` изменятся все задачи всех проектов.

- id: dml-03
  topic: dml
  level: middle
  dataset: taskflow
  kind: dml
  title: Мягкое удаление проекта
  text: |
    Удали проект 4 так, как это делает API TaskFlow: физически ничего не удаляй, а проставь
    `deleted_at = '2026-10-01T12:00:00Z'` самому проекту и всем его задачам, которые ещё не
    удалены.
  solution: |
    UPDATE projects
    SET deleted_at = '2026-10-01T12:00:00Z'
    WHERE id = 4;
    UPDATE tasks
    SET deleted_at = '2026-10-01T12:00:00Z'
    WHERE project_id = 4
      AND deleted_at IS NULL;
  check: |
    SELECT 'project' AS entity, id, deleted_at FROM projects
    UNION ALL
    SELECT 'task', id, deleted_at FROM tasks
  hint: |
    Понадобятся два `UPDATE` подряд, через `;`. Дату пиши текстом в формате ISO, как в остальных
    строках. Условие `deleted_at IS NULL` для задач не даст перезаписать дату уже удалённых.
